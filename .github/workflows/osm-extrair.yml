name: extrair OSM (temporário)
on:
  push:
    branches: [osm-extrair]
    paths: [".github/workflows/osm-extrair.yml"]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for r in 1 2 3 4; do for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -fsS -m 400 -A "onibus-rio/1.0 (https://estevaolutz.github.io/onibus-rio/)" -H "Accept: application/json" --data-urlencode data@onibus-rio/build/trilhos.overpassql "$u" -o bruto.json && python3 -c "import json;d=json.load(open('bruto.json'));print(len(d['elements']))" && break 2
          done; sleep 40; done
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached bruto.json 2>/dev/null; git add bruto.json && git commit -m "bruto" && git push
