as solta; acabam devoradas por feras no monte Olimpo.", "grego": "Ἄβδηρα", "ref": "Apolodoro II.5.8 · Eurípides, Alceste 481–506", "tempo": "8º trabalho", "certeza": "Sítio arqueológico", "sentido": "O tirano é castigado com o próprio crime. A cidade nasce de um luto.", "hoje": "Abdera, na Trácia grega, perto de Xanthi, foi uma cidade importante, terra natal de Demócrito e Protágoras. O sítio e o museu podem ser visitados."}, {"nome": "9. Temiscira", "moderno": "Terme, Turquia", "lat": 41.21, "lon": 37.0, "texto": "Admete, filha de Euristeu, quer o cinturão de Hipólita, rainha das Amazonas, um presente do próprio Ares. Héracles navega com um grupo de heróis (em algumas versões, Teseu entre eles) até Temiscira, no rio Termodonte, na costa sul do mar Negro.\n\nPara surpresa de todos, Hipólita o recebe bem e promete dar o cinturão de livre vontade. Mas Hera, disfarçada de amazona, espalha entre as guerreiras que o estrangeiro veio raptar a rainha. As Amazonas atacam a cavalo. Héracles, acreditando ter sido traído, mata Hipólita e toma o cinturão. Na volta, para em Troia, onde salva a princesa Hesíone de um monstro marinho. O rei Laomedonte não lhe paga a recompensa prometida, e Héracles jura voltar, o que fará anos depois, saqueando a cidade numa primeira guerra de Troia.", "grego": "Θεμίσκυρα", "ref": "Apolodoro II.5.9 · Diodoro IV.16", "tempo": "9º trabalho", "certeza": "Tradicional", "sentido": "Um encontro pacífico vira massacre por causa de um boato. A guerra com as Amazonas, a Amazonomaquia, era tema favorito da escultura grega.", "hoje": "A região de Terme, na província de Samsun (Turquia), na foz do rio Terme Çayı, é identificada com Temiscira. A cidade moderna tem estátuas e um festival dedicado às Amazonas."}, {"nome": "10. Eritia", "moderno": "Cádis, Espanha (tradicional)", "lat": 36.53, "lon": -6.29, "texto": "Gerião, gigante de três corpos unidos na cintura, vive em Eritia, ilha do pôr do sol além do oceano. Seu gado vermelho é guardado pelo pastor Eurítion e pelo cão de duas cabeças Ortro. Para atravessar a África, Héracles chega ao estreito que separa a Europa da Líbia e, como marco da viagem, ergue duas colunas, uma de cada lado. São as Colunas de Héracles.\n\nO sol queima tanto que Héracles aponta uma flecha para Hélio. Admirado com a ousadia, o deus lhe empresta a taça de ouro em que navega todas as noites pelo oceano de volta ao oriente. Com ela, o herói chega a Eritia, mata o cão, o pastor e o próprio Gerião, com uma flecha que atravessa os três corpos. A volta com o gado é uma epopeia à parte: passa pela Ibéria, Gália, Ligúria e Itália, onde o gigante Caco rouba parte do rebanho (no sítio da futura Roma); um touro foge para a Sicília, e Hera envia moscardos que dispersam a manada na Trácia.", "grego": "Ἐρύθεια", "ref": "Apolodoro II.5.10 · Hesíodo, Teogonia 287–294 · Virgílio, Eneida VIII", "tempo": "10º trabalho", "certeza": "Tradicional", "sentido": "As Colunas marcavam o fim do mundo conhecido. A divisa “Non plus ultra” (nada além) virou “Plus ultra” no brasão da Espanha depois da chegada à América.", "hoje": "Os antigos identificavam Eritia com uma ilha junto a Gades, a atual Cádis. As Colunas costumam ser o rochedo de Gibraltar e o monte Hacho, em Ceuta (ou Jebel Musa, no Marrocos)."}, {"nome": "11. Jardim das Hespérides", "moderno": "Lixus/Atlas, Marrocos (tradicional)", "lat": 35.2, "lon": -6.11, "texto": "As maçãs de ouro foram o presente de casamento de Gaia a Hera e crescem num jardim no extremo ocidente, cuidadas pelas Hespérides, filhas da Noite, e guardadas pelo dragão Ládon. Héracles nem sabe onde fica o jardim. Captura o deus marinho Nereu, que muda de forma sem parar, e só o solta quando ele revela o caminho. Na rota, enfrenta o gigante Anteu na Líbia, que fica mais forte cada vez que toca a terra, sua mãe; Héracles o ergue no ar e o esmaga. No Cáucaso, liberta Prometeu.\n\nSeguindo o conselho de Prometeu, pede ajuda a Atlas, pai das Hespérides, e se oferece para segurar o céu enquanto o Titã busca as maçãs. Atlas volta com elas e, gostando da liberdade, diz que ele mesmo as levará a Euristeu. Héracles finge concordar e só pede que Atlas segure o céu um instante, para ele ajeitar uma almofada nos ombros. Atlas pega o céu de volta, e Héracles vai embora com as maçãs. Euristeu as devolve; Atena as leva de volta ao jardim, porque não podiam ficar em outro lugar.", "grego": "Ἑσπερίδες", "ref": "Apolodoro II.5.11 · Ferecides", "tempo": "11º trabalho", "certeza": "Lendário", "sentido": "O trabalho que se resolve com astúcia, não com força. Héracles carrega literalmente o peso do mundo e devolve a carga com um truque.", "hoje": "A tradição antiga situava o jardim perto de Lixus, cidade fenício-romana junto a Larache, no Marrocos, ao pé do Atlas. Outros o punham em Cirenaica, na Líbia."}, {"nome": "12. Cabo Tênaro", "moderno": "Lacônia", "lat": 36.39, "lon": 22.48, "texto": "O último trabalho é o mais impossível: trazer do reino dos mortos Cérbero, o cão de três cabeças (em Hesíodo, cinquenta), com cauda de serpente, que impede os mortos de sair. Antes, Héracles se inicia nos Mistérios de Elêusis para conhecer os segredos do além. Desce por uma caverna no cabo Tênaro, a ponta sul do Peloponeso, guiado por Hermes e Atena.\n\nNo Hades, as sombras fogem dele. Só Medusa e o herói Meléagro o enfrentam. Encontra Teseu e Pirítoo presos em cadeiras do esquecimento, por terem tentado raptar Perséfone, e consegue libertar Teseu. Pede o cão a Hades, que aceita com uma condição: que o leve sem armas. Héracles o agarra pelo pescoço e aperta até o cão se render, apesar das mordidas da cauda. Sobe por Trezena ou por Heracleia Pôntica. Da baba de Cérbero teria nascido o acônito, planta venenosa. Euristeu, ao ver o cão, se esconde de novo no jarro, e Héracles devolve Cérbero ao seu posto. O serviço termina; o herói está livre.", "grego": "Ταίναρον", "ref": "Apolodoro II.5.12 · Odisseia XI 617–626 · Eurípides, Héracles", "tempo": "12º trabalho", "certeza": "Sítio identificado", "sentido": "Vencer a morte é o último degrau antes da imortalidade. Ao fim da vida, envenenado pela túnica com o sangue do centauro Nesso, Héracles será queimado numa pira no monte Eta e subirá ao Olimpo, onde se casa com Hebe e se reconcilia com Hera.", "hoje": "No cabo Tênaro (Matapan), extremidade sul da Grécia continental, há uma gruta junto às ruínas do santuário de Poseidon, indicada desde a Antiguidade como uma entrada para o Hades. Hoje é ponto de caminhada até o farol."}]}, {"id": "perseu", "titulo": "Perseu e a Medusa", "ciclo": "herois", "fontes": ["Apolodoro II.4", "Ovídio IV–V"], "resumo": "Um oráculo diz ao rei Acrísio de Argos que ele será morto pelo filho de sua filha, Dânae. Para impedir o destino, ele a tranca numa câmara de bronze. Mas Zeus entra como chuva de ouro e dela nasce Perseu. Lançados ao mar, mãe e filho sobrevivem e vão parar numa ilha distante. A missão impossível que um rei ali impõe ao jovem leva Perseu ao fim do mundo, contra a Górgona cujo olhar transforma em pedra, e faz dele o fundador de Micenas e antepassado de Héracles.", "paradas": [{"nome": "Argos", "moderno": "Argólida", "lat": 37.63, "lon": 22.73, "texto": "Acrísio, rei de Argos, não tem filhos homens e pergunta ao oráculo se terá algum. A resposta é pior: não terá, e o neto o matará. Ele manda construir uma câmara de bronze subterrânea e prende ali a filha Dânae, para que nenhum homem se aproxime dela.\n\nZeus atravessa o teto como uma chuva de ouro e a engravida. Quando Acrísio ouve o choro de Perseu, não acredita que Zeus seja o pai. Sem coragem de matar a própria família com as mãos (o que atrairia as Erínias), põe mãe e filho numa arca de madeira e os lança ao mar.", "grego": "Ἄργος", "ref": "Apolodoro II.4.1 · Simônides, fragmento 543", "tempo": "O nascimento", "certeza": "Cidade real", "sentido": "Tentar escapar de uma profecia é justamente o que a realiza. É o mesmo mecanismo do mito de Édipo.", "hoje": "Argos é uma das cidades habitadas há mais tempo na Europa. Tem um grande teatro antigo e a colina fortificada de Lárissa, a antiga acrópole."}, {"nome": "Sérifos", "moderno": "Cíclades", "lat": 37.15, "lon": 24.49, "texto": "A arca flutua até a ilha de Sérifos, nas Cíclades, e fica presa na rede do pescador Díctis, que acolhe mãe e filho. Perseu cresce ali. O irmão do pescador, Polidectes, rei da ilha, se apaixona por Dânae, mas o rapaz, já adulto, a protege.\n\nPara se livrar dele, Polidectes finge que vai se casar com outra mulher e pede a cada convidado um cavalo de presente. Perseu, pobre, se gaba de que traria qualquer coisa, até a cabeça da Górgona. O rei o prende à palavra. Atena e Hermes vêm ajudá-lo: Hermes lhe empresta uma foice de diamante, Atena um escudo polido como espelho. Perseu procura as Greias, três velhas irmãs das Górgonas que dividem um único olho e um único dente; rouba o olho e só o devolve quando elas indicam o caminho das ninfas, que lhe dão sandálias aladas, um alforje mágico (kíbisis) e o elmo da invisibilidade de Hades.", "grego": "Σέριφος", "ref": "Apolodoro II.4.2 · Píndaro, Pítica XII", "tempo": "A missão", "certeza": "Ilha real", "sentido": "O herói só vence com ajuda: dos deuses, das ninfas e até das velhas que ele precisa enganar. Cada objeto mágico resolve um problema da tarefa.", "hoje": "Sérifos é uma ilha pequena e montanhosa, com minas de ferro abandonadas. A Chora, vila branca no alto do morro, é das mais fotografadas das Cíclades."}, {"nome": "Morada das Górgonas", "moderno": "Extremo ocidente / Líbia (tradicional)", "lat": 33.7, "lon": 8.4, "texto": "As três Górgonas vivem no extremo ocidente, além do oceano. Esteno e Euríale são imortais; só Medusa, a do meio, é mortal. Têm cabelos de serpentes, presas de javali, mãos de bronze e asas de ouro, e qualquer um que as olhe vira pedra. Segundo Ovídio, Medusa havia sido uma bela jovem violentada por Poseidon no templo de Atena, e a deusa a castigou com esse rosto.\n\nPerseu chega voando enquanto elas dormem, guiado por Atena. Sem olhar diretamente, mira o reflexo de Medusa no escudo e corta sua cabeça com a foice. Do pescoço saltam o cavalo alado Pégaso e o guerreiro Crisaor, filhos de Poseidon. Perseu guarda a cabeça no alforje e foge invisível das irmãs, que acordam aos gritos. Sobrevoando a Líbia, gotas de sangue caem na areia e viram as serpentes do deserto.", "grego": "Γοργόνες", "ref": "Apolodoro II.4.2–3 · Ovídio, Metamorfoses IV 770–803 · Hesíodo, Escudo 216–237", "tempo": "A Medusa", "certeza": "Lendário", "sentido": "Só se vence o horror olhando-o indiretamente. A cabeça da Medusa (gorgóneion) virou amuleto contra o mal em escudos, portas e moedas.", "hoje": "Os antigos situavam as Górgonas no extremo oeste ou na Líbia. O ponto do mapa é tradicional, perto do lago Tritão, região dos chotts do sul da Tunísia."}, {"nome": "Monte Atlas", "moderno": "Marrocos", "lat": 31.06, "lon": -7.92, "texto": "A caminho de casa, Perseu pede abrigo ao Titã Atlas, que guarda o jardim das Hespérides no extremo ocidente. Atlas se lembra de um oráculo que dizia que um filho de Zeus viria roubar as maçãs de ouro e o expulsa com violência.\n\nPerseu, sem forças para lutar contra um Titã, tira a cabeça da Medusa do alforje e a mostra a ele. O gigante se transforma numa montanha: a barba e os cabelos viram florestas, os ombros e as mãos, cumes, os ossos, rochas. Tão alto que o céu inteiro passa a repousar sobre ele.", "grego": "Ἄτλας", "ref": "Ovídio, Metamorfoses IV 621–662", "tempo": "A volta: a montanha", "certeza": "Montanha real", "sentido": "Uma explicação para uma cordilheira que parecia sustentar o céu. Esta versão contradiz a de Héracles, que encontra Atlas vivo; mitologia grega não é um sistema coerente.", "hoje": "A cordilheira do Atlas atravessa Marrocos, Argélia e Tunísia. O ponto mais alto é o Toubkal (4.167 m), perto de Marrakech. O oceano Atlântico também deve seu nome a Atlas."}, {"nome": "Jope", "moderno": "Jafa, Israel", "lat": 32.05, "lon": 34.75, "texto": "Voando sobre a costa da Etiópia (que os antigos às vezes punham na Palestina), Perseu vê uma jovem acorrentada a um rochedo. É Andrômeda, filha do rei Cefeu e de Cassiopeia. A rainha se gabara de ser mais bela que as Nereidas, e Poseidon enviou uma inundação e um monstro marinho, Ceto. O oráculo de Amon diz que só o sacrifício da princesa salvará o reino.\n\nPerseu faz um acordo com o rei: matará o monstro em troca da mão de Andrômeda. Mergulha do alto e mata a fera. Mas a jovem já estava prometida ao tio, Fineu, que invade o banquete de casamento com homens armados. Perseu, em desvantagem, tira a cabeça da Medusa e transforma Fineu e todos os seus aliados em estátuas.", "grego": "Ἰόππη", "ref": "Apolodoro II.4.3 · Ovídio, Metamorfoses IV 663–V 235", "tempo": "Andrômeda", "certeza": "Tradicional", "sentido": "Todos os personagens viraram constelações: Perseu, Andrômeda, Cefeu, Cassiopeia e Cetus, o monstro, estão juntos no céu do outono.", "hoje": "Em Jafa, hoje parte de Tel Aviv, as pedras de Andrômeda, rochedos junto ao porto antigo, eram mostradas na Antiguidade com as marcas das correntes, segundo Estrabão e Plínio."}, {"nome": "Sérifos", "moderno": "Cíclades", "lat": 37.15, "lon": 24.49, "texto": "De volta a Sérifos, Perseu descobre que a mãe e Díctis se refugiaram num templo, perseguidos por Polidectes. Ele vai ao palácio, onde o rei banqueteia com seus amigos, e anuncia que trouxe o presente prometido. Ninguém acredita. Desviando o rosto, ergue a cabeça da Medusa, e todos ficam petrificados exatamente como estavam.\n\nPerseu faz de Díctis o novo rei da ilha. Devolve as sandálias, o alforje e o elmo a Hermes, e dá a cabeça da Medusa a Atena, que a fixa no centro de sua égide. Desde então a deusa a carrega no peito.", "grego": "Σέριφος", "ref": "Apolodoro II.4.3 · Píndaro, Pítica XII 9–16", "tempo": "A vingança", "certeza": "Ilha real", "sentido": "O presente impossível é entregue, e a arma volta à deusa que a inspirou. O herói devolve todo o poder emprestado.", "hoje": "Os moradores de Sérifos mostravam a Pausânias as rochas da ilha como os convidados petrificados de Polidectes. A paisagem pedregosa ainda alimenta a lenda."}, {"nome": "Larissa", "moderno": "Tessália", "lat": 39.64, "lon": 22.42, "texto": "Perseu volta a Argos com Dânae e Andrômeda para reencontrar o avô. Acrísio, sabendo da chegada e lembrando do oráculo, foge para Larissa, na Tessália. Por coincidência, Perseu também vai a Larissa, para participar dos jogos fúnebres que o rei local organizava pelo pai.\n\nNa prova de disco, Perseu arremessa e o vento desvia o disco para a plateia, onde ele atinge um velho na cabeça e o mata. É Acrísio. Envergonhado de herdar o trono de quem matou, Perseu troca o reino de Argos pelo de Tirinto com o primo Megapentes. Funda depois a cidade de Micenas e, com Andrômeda, gera a linhagem de onde nascerão Alcmena e Héracles.", "grego": "Λάρισα", "ref": "Apolodoro II.4.4–5 · Pausânias II.16", "tempo": "A profecia se cumpre", "certeza": "Cidade real", "sentido": "Ninguém foge do destino, nem o herói que não queria cumpri-lo. A culpa não é de Perseu, mas a profecia é implacável.", "hoje": "Larissa é hoje a capital da Tessália. Tem dois teatros antigos no centro. Micenas, fundada por Perseu segundo o mito, tem a Porta dos Leões e os túmulos reais."}]}, {"id": "teseu", "titulo": "Teseu e o Minotauro", "ciclo": "herois", "fontes": ["Plutarco, Vida de Teseu", "Apolodoro, Epítome I"], "resumo": "Teseu é filho de Etra, princesa de Trezena, e de Egeu, rei de Atenas (ou de Poseidon, na mesma noite). Antes de voltar para casa, Egeu esconde uma espada e um par de sandálias sob uma rocha e diz: quando o menino puder erguê-la, que venha me procurar. Adolescente, Teseu levanta a pedra e escolhe o caminho mais perigoso para Atenas, por terra, onde bandidos matam os viajantes. Depois vai a Creta enfrentar o Minotauro. É o herói fundador de Atenas: o que une a Ática e livra a cidade do tributo humano.", "paradas": [{"nome": "Trezena", "moderno": "Argólida", "lat": 37.5, "lon": 23.35, "texto": "Egeu não tinha filhos e foi a Delfos perguntar por quê. O oráculo respondeu com um enigma: que não abrisse o odre de vinho até chegar a Atenas. Na volta, ele parou em Trezena, e o rei Piteu, entendendo a profecia, o embriagou e o pôs no quarto da filha, Etra. Na mesma noite, Poseidon também a visitou.\n\nAntes de partir, Egeu escondeu a espada e as sandálias sob uma pedra enorme. Aos dezesseis anos, Teseu a ergue com facilidade. Etra e o avô insistem que ele vá a Atenas por mar, mais seguro. Mas Teseu admira Héracles, seu primo, e quer provar seu valor: escolhe a estrada costeira pelo istmo, infestada de malfeitores.", "grego": "Τροιζήν", "ref": "Plutarco, Teseu 3–7 · Pausânias II.32", "tempo": "A rocha de Egeu", "certeza": "Sítio arqueológico", "sentido": "Erguer a pedra é a prova de que o menino virou homem. A mesma ideia reaparece, séculos depois, na espada na pedra do rei Artur.", "hoje": "As ruínas de Trezena ficam junto à vila de Trizina, na península da Argólida. Ainda hoje se mostra ali uma grande pedra, a “Petra tou Thiseos”, como a rocha do mito."}, {"nome": "Epidauro", "moderno": "Argólida", "lat": 37.6, "lon": 23.08, "texto": "O primeiro bandido é Perifetes, filho de Hefesto. Como o pai, é coxo e anda apoiado numa clava de bronze, com a qual esmaga a cabeça de quem passa pela estrada de Epidauro.\n\nTeseu o enfrenta, arranca a clava de sua mão e o mata com ela. Gosta tanto da arma que passa a carregá-la sempre, como Héracles carregava a pele do leão. A clava vira um de seus atributos na arte grega.", "grego": "Ἐπίδαυρος", "ref": "Apolodoro III.16.1 · Plutarco, Teseu 8", "tempo": "1º bandido", "certeza": "Sítio arqueológico", "sentido": "O padrão das seis provas está fixado aqui: Teseu derrota cada malfeitor com o próprio método dele.", "hoje": "Epidauro é famosa pelo teatro do século IV a.C., de acústica extraordinária, ainda usado em festivais de verão. O santuário de Asclépio é Patrimônio Mundial."}, {"nome": "Istmo de Corinto", "moderno": "Coríntia", "lat": 37.93, "lon": 22.99, "texto": "No istmo de Corinto vive Sinis, chamado Pitiocamptes, “o que verga pinheiros”. Ele força os viajantes a ajudá-lo a dobrar um pinheiro até o chão; quando a vítima segura a árvore, ele solta, e ela é lançada no ar. Em outra versão, amarra a pessoa a dois pinheiros curvados e os solta, rasgando-a ao meio.\n\nTeseu o mata da mesma forma. A filha de Sinis, Perigune, foge e se esconde num campo de aspargos selvagens, implorando às plantas que a protejam. Teseu a encontra, promete não lhe fazer mal, e dela tem um filho, Melanipo. Os descendentes dela nunca queimavam aspargos, em gratidão.", "grego": "Ἰσθμός", "ref": "Plutarco, Teseu 8 · Apolodoro III.16.2", "tempo": "2º bandido", "certeza": "Região real", "sentido": "Teseu teria fundado os Jogos Ístmicos em honra a Poseidon (ou para expiar essa morte), uma das quatro grandes competições pan-helênicas.", "hoje": "O istmo é cortado desde 1893 pelo Canal de Corinto, de paredes verticais com 80 m de altura. Junto ao canal estão as ruínas do santuário de Poseidon em Ístmia e o Díolkos, rampa pavimentada por onde os navios eram arrastados por terra."}, {"nome": "Crommyon", "moderno": "Coríntia", "lat": 37.93, "lon": 23.15, "texto": "Em Crommyon, vila da Coríntia, uma porca selvagem chamada Faia, filha de Tifão e Equidna segundo alguns, devasta a região e mata os camponeses. Ninguém ousa enfrentá-la.\n\nTeseu desvia do caminho só para caçá-la, mostrando que não luta apenas para se defender, mas para livrar a terra de ameaças. Plutarco conta uma versão racionalizada: Faia seria uma mulher bandida, assassina e de costumes porcinos, apelidada de porca.", "grego": "Κρομμυών", "ref": "Plutarco, Teseu 9 · Apolodoro, Epítome I.1", "tempo": "3º perigo", "certeza": "Sítio tradicional", "sentido": "Plutarco já tentava explicar os mitos de forma realista no século II d.C., transformando monstros em criminosos humanos.", "hoje": "A antiga Crommyon fica perto da atual Agioi Theodoroi, na costa do golfo Sarônico, onde há refinarias de petróleo."}, {"nome": "Rochas Cirônicas", "moderno": "Mégara", "lat": 37.97, "lon": 23.3, "texto": "Na estreita trilha à beira de penhascos sobre o mar, entre Mégara e o istmo, mora Círon. Ele obriga os viajantes a lavar seus pés. Quando eles se abaixam, ele os chuta para o abismo, onde uma tartaruga gigante os devora.\n\nTeseu finge obedecer, agarra o pé do bandido e o lança ao mar, onde a tartaruga o recebe. Os megarenses contavam outra história: Círon seria um homem justo, e Teseu o teria matado ao tomar Elêusis.", "grego": "Σκιρωνίδες πέτραι", "ref": "Plutarco, Teseu 10 · Diodoro IV.59", "tempo": "4º bandido", "certeza": "Nome preservado", "sentido": "Um mito que guarda uma rivalidade real entre Atenas e Mégara: a vítima de um é o herói do outro.", "hoje": "As Rochas Cirônicas (Kakia Skala, “o passo ruim”) ainda são um trecho de penhascos entre Mégara e Corinto, por onde passam a estrada antiga e a autoestrada moderna."}, {"nome": "Elêusis", "moderno": "Ática", "lat": 38.041, "lon": 23.54, "texto": "Em Elêusis, o rei Cercião obriga todos os passantes a lutar com ele e esmaga os vencidos até a morte. É imensamente forte.\n\nTeseu, menor e mais leve, o vence pela técnica: ergue-o do chão e o atira contra a terra. Os atenienses diziam que, com isso, Teseu inventou a luta como arte, baseada na habilidade e não só na força. Ele toma para si o reino de Elêusis.", "grego": "Ἐλευσίς", "ref": "Plutarco, Teseu 11 · Pausânias I.39.3", "tempo": "5º bandido", "certeza": "Sítio arqueológico", "sentido": "Ao incorporar Elêusis, Teseu une a Ática. O mito justifica a anexação de uma cidade vizinha por Atenas.", "hoje": "Elêusis (Elefsina) é hoje uma cidade industrial a oeste de Atenas, com o santuário dos Mistérios no centro."}, {"nome": "Rio Cefiso", "moderno": "Ática", "lat": 38.0, "lon": 23.65, "texto": "Perto do rio Cefiso, já às portas de Atenas, mora Procusto (ou Damastes). Ele oferece hospedagem e tem uma cama de ferro. Se o hóspede é alto demais, corta-lhe as pernas; se é baixo demais, estica-o com martelo e cordas até caber. Em algumas versões, tem duas camas, uma curta e uma longa, para que ninguém nunca sirva.\n\nTeseu o deita na própria cama e o ajusta do mesmo jeito. Depois se purifica dos assassinatos às margens do Cefiso, numa cerimônia com os descendentes de Fítalo, antes de entrar em Atenas.", "grego": "Κηφισός", "ref": "Plutarco, Teseu 11–12 · Diodoro IV.59", "tempo": "6º bandido", "certeza": "Rio real", "sentido": "O “leito de Procusto” virou expressão para qualquer padrão rígido ao qual a realidade é forçada a se encaixar.", "hoje": "O Cefiso atravessa a área metropolitana de Atenas, em grande parte canalizado e coberto pela avenida Kifisou."}, {"nome": "Atenas", "moderno": "Atenas", "lat": 37.971, "lon": 23.726, "texto": "Teseu chega a Atenas como um desconhecido. Egeu está casado com Medeia, que fugira de Corinto. Ela reconhece o rapaz e, temendo pelo trono do próprio filho, convence o velho rei de que o estrangeiro é um perigo. Primeiro o mandam capturar o touro de Maratona, aquele que Héracles trouxe de Creta; Teseu o traz vivo e o sacrifica.\n\nNo banquete de celebração, Medeia prepara uma taça envenenada. Teseu, para se revelar, tira a espada para cortar a carne. Egeu reconhece a arma, derruba a taça da mão do filho e o abraça. Medeia foge num carro mágico. Pouco depois, chega o tempo do tributo: a cada nove anos (ou anualmente), Atenas deve enviar sete rapazes e sete moças a Creta para o Minotauro, como castigo pela morte de Androgeu, filho de Minos. Teseu se oferece como um deles.", "grego": "Ἀθῆναι", "ref": "Plutarco, Teseu 12–17 · Apolodoro, Epítome I.5–7", "tempo": "O reconhecimento", "certeza": "Cidade real", "sentido": "Medeia liga a história de Teseu à dos Argonautas. Os mitos gregos formam uma grande teia genealógica.", "hoje": "Na Ágora de Atenas fica o Hefesteion, templo do século V a.C., o mais bem conservado da Grécia. Na Idade Média foi chamado de Theseion, por causa dos relevos com feitos de Teseu."}, {"nome": "Cnossos", "moderno": "Creta", "lat": 35.298, "lon": 25.163, "texto": "Em Cnossos, a princesa Ariadne, filha de Minos, se apaixona por Teseu à primeira vista. Pede a Dédalo, construtor do Labirinto, um modo de sair dele. A resposta é simples: um novelo de fio. Ariadne o entrega a Teseu em troca da promessa de levá-la para Atenas como esposa.\n\nTeseu amarra a ponta do fio à porta e desenrola o novelo enquanto avança pelos corredores. No centro, encontra o Minotauro, homem com cabeça de touro, e o mata com os punhos (ou com a espada que Ariadne escondeu). Segue o fio de volta até a saída, liberta os outros jovens atenienses e foge de navio com eles e com Ariadne, depois de furar os cascos dos navios cretenses para impedir a perseguição. Em Delos, para em agradecimento e dança com os jovens uma dança sinuosa, a “dança do grou”, que imitava os caminhos do labirinto.", "grego": "Κνωσός", "ref": "Plutarco, Teseu 19–21 · Catulo 64 · Ovídio, Metamorfoses VIII 152–182", "tempo": "O Labirinto", "certeza": "Sítio arqueológico", "sentido": "O fio de Ariadne virou metáfora de qualquer método que permite atravessar um problema complexo e voltar.", "hoje": "Quando Arthur Evans escavou Cnossos, no início do século XX, o palácio de corredores e salas sem fim pareceu a materialização do Labirinto. A palavra viria de lábrys, o machado duplo, símbolo minoico gravado nas paredes."}, {"nome": "Naxos", "moderno": "Cíclades", "lat": 37.1, "lon": 25.38, "texto": "O navio para em Naxos. Ariadne adormece na praia e, ao acordar, vê as velas se afastando. Teseu partiu sem ela. As versões divergem muito: ele a esqueceu, ou se apaixonou por outra, ou Atena lhe apareceu em sonho ordenando que partisse, ou Dioniso a quis para si e o obrigou a deixá-la.\n\nAriadne, desesperada na praia, é encontrada por Dioniso, que a toma como esposa. A cena da mulher abandonada que lamenta foi um dos temas mais repetidos da poesia antiga, de Catulo a Ovídio, e depois da pintura e da ópera.", "grego": "Νάξος", "ref": "Plutarco, Teseu 20 · Catulo 64 · Ovídio, Heroides X", "tempo": "O abandono", "certeza": "Ilha real", "sentido": "O herói fundador de Atenas tem uma mancha: quebrar a promessa a quem o salvou. Os deuses não deixam isso sem consequência.", "hoje": "Naxos é a maior das Cíclades. A Portara, portal de um templo arcaico no ilhote de Palatia, é o cartão-postal da ilha."}, {"nome": "Cabo Súnio", "moderno": "Ática", "lat": 37.65, "lon": 24.02, "texto": "Quando Teseu partiu, combinou com o pai um sinal: o navio levava velas negras, de luto. Se ele voltasse vivo, trocaria por velas brancas. Na alegria da volta (ou na tristeza por Ariadne, ou por castigo dos deuses), Teseu esquece.\n\nEgeu passa os dias vigiando o mar do alto do cabo Súnio (ou da Acrópole). Ao ver as velas negras no horizonte, acredita que o filho morreu e se lança ao mar. Desde então ele se chama mar Egeu. Teseu se torna rei de Atenas. Segundo a tradição, reúne as aldeias da Ática numa só cidade, o sinecismo, e cria as Panateneias. Os atenienses guardaram o navio dele por séculos, trocando as tábuas podres uma a uma, o que gerou o famoso paradoxo filosófico: ainda seria o mesmo navio?", "grego": "Σούνιον", "ref": "Plutarco, Teseu 22–24 · Pausânias I.22.5 · Catulo 64", "tempo": "As velas negras", "certeza": "Sítio arqueológico", "sentido": "Uma vitória que custa o pai. O “navio de Teseu” virou o problema clássico da identidade: o que continua sendo o mesmo quando todas as partes mudam?", "hoje": "No cabo Súnio fica o Templo de Poseidon (c. 440 a.C.), com colunas de mármore sobre o mar. Lord Byron gravou o próprio nome numa delas. O pôr do sol ali é um dos mais visitados da Grécia."}]}, {"id": "belerofonte", "titulo": "Belerofonte, Pégaso e a Quimera", "ciclo": "herois", "fontes": ["Ilíada VI", "Píndaro, Olímpica XIII"], "resumo": "Belerofonte é um príncipe de Corinto, neto de Sísifo e, segundo alguns, filho de Poseidon. Exilado depois de matar alguém sem querer, chega a Tirinto e se torna o primeiro herói a montar Pégaso. Sua história é de sucesso esmagador seguido de queda: depois de vencer a Quimera, as Amazonas e os inimigos da Lícia, acha que pode subir ao céu dos deuses.", "paradas": [{"nome": "Fonte de Pirene", "moderno": "Acrocorinto", "lat": 37.89, "lon": 22.87, "texto": "Belerofonte deseja montar Pégaso, o cavalo alado nascido do pescoço da Medusa, mas o animal é selvagem e ninguém o alcança. O adivinho Políido lhe aconselha a dormir no altar de Atena. Em sonho, a deusa lhe entrega uma rédea de ouro; ao acordar, a rédea está em suas mãos.\n\nEle encontra Pégaso bebendo água na fonte de Pirene, na acrópole de Corinto, joga a rédea sobre sua cabeça e o cavalo se deixa montar sem resistência. Em agradecimento, Belerofonte ergue um altar a Atena Hípia, protetora dos cavalos.", "grego": "Πειρήνη", "ref": "Píndaro, Olímpica XIII 63–92 · Pausânias II.4.1", "tempo": "A rédea de ouro", "certeza": "Sítio arqueológico", "sentido": "Pégaso era o emblema das moedas de Corinto. O mito explicava o símbolo da cidade.", "hoje": "Há duas fontes de Pirene: uma no alto do Acrocorinto e outra monumental, com fachada romana, no centro da Corinto antiga. Ambas podem ser visitadas."}, {"nome": "Tirinto", "moderno": "Argólida", "lat": 37.599, "lon": 22.799, "texto": "Exilado de Corinto, Belerofonte é recebido pelo rei Preto de Tirinto. A rainha Anteia (Estenebeia nos trágicos) se apaixona por ele e o seduz; ele recusa. Humilhada, ela acusa o hóspede de ter tentado violentá-la.\n\nPreto não pode matar um hóspede sem ofender Zeus, protetor dos estrangeiros. Manda então Belerofonte à Lícia, ao sogro, o rei Ióbates, levando uma tábua dobrada e selada com “sinais funestos”. A mensagem pedia que o portador fosse morto. É a única menção à escrita em toda a obra de Homero.", "grego": "Τίρυνς", "ref": "Ilíada VI 155–170 · Apolodoro II.3.1", "tempo": "A falsa acusação", "certeza": "Sítio arqueológico", "sentido": "O mesmo enredo da mulher de Putifar e José, na Bíblia, e de Fedra e Hipólito. Uma história que circulava por todo o Mediterrâneo oriental.", "hoje": "Tirinto conserva as muralhas e as galerias abobadadas micênicas. A expressão “carta de Belerofonte” ainda designa uma mensagem que prejudica quem a leva."}, {"nome": "Monte Quimera", "moderno": "Yanartaş, Turquia", "lat": 36.43, "lon": 30.46, "texto": "Ióbates recebe Belerofonte e o hospeda por nove dias antes de ler a tábua. Também não quer matá-lo com as próprias mãos, por causa da hospitalidade. Decide mandá-lo contra a Quimera, monstro com cabeça de leão, corpo de cabra e cauda de serpente, que cuspia fogo e devastava a Lícia.\n\nBelerofonte voa sobre Pégaso, fora do alcance das chamas, e crava flechas no monstro. Numa versão posterior, prende um bloco de chumbo na ponta da lança e o enfia na garganta da Quimera; o fogo derrete o chumbo, que a mata por dentro. Ióbates o manda então contra os Sólimos, um povo guerreiro, e depois contra as Amazonas. Ele vence todos. Por fim o rei arma uma emboscada com seus melhores guerreiros, e Belerofonte mata todos eles. Convencido de que o herói é protegido pelos deuses, Ióbates lhe dá a filha em casamento e metade do reino.", "grego": "Χίμαιρα", "ref": "Ilíada VI 171–195 · Hesíodo, Teogonia 319–325", "tempo": "A Quimera", "certeza": "Sítio identificado", "sentido": "“Quimera” virou palavra comum para algo fantasioso, impossível, feito de partes que não combinam.", "hoje": "Yanartaş, perto de Çıralı, na Turquia, é uma encosta onde jatos de gás metano saem das rochas e queimam continuamente há milênios. Os antigos marinheiros os viam do mar. Fica num caminho da Via Lícia."}, {"nome": "Planície Aleia", "moderno": "Cilícia (tradicional)", "lat": 36.9, "lon": 35.3, "texto": "No auge da glória, Belerofonte se torna arrogante. Decide voar com Pégaso até o Olimpo, como se fosse um dos deuses. Zeus manda um moscardo picar o cavalo, que dá um salto e derruba o cavaleiro.\n\nPégaso continua subindo e passa a servir Zeus, carregando seus raios; vira constelação. Belerofonte cai na planície Aleia, na Cilícia. Homero diz apenas que ele passou a vagar sozinho, odiado pelos deuses, comendo o próprio coração e evitando o caminho dos homens. Em algumas versões, fica coxo ou cego com a queda.", "grego": "Ἀλήιον πεδίον", "ref": "Ilíada VI 200–202 · Píndaro, Ístmica VII 44–48", "tempo": "A queda", "certeza": "Tradicional", "sentido": "O exemplo clássico de hýbris: o mortal que esquece seus limites. O nome Aleia significa “errância”.", "hoje": "A planície Aleia ficava na Cilícia, região de Adana, na Turquia, entre os rios Píramo e Saro, hoje Ceyhan e Seyhan. É uma das áreas agrícolas mais férteis do país."}]}, {"id": "argonautas", "titulo": "Jasão e os Argonautas", "ciclo": "argonautas", "fontes": ["Apolônio de Rodes, Argonáuticas", "Píndaro, Pítica IV", "Apolodoro I.9"], "resumo": "Pélias tomou o trono de Iolco do meio-irmão Esão. Um oráculo o avisa para temer o homem com uma sandália só. Anos depois chega Jasão, filho de Esão, criado pelo centauro Quíron, que perdeu uma sandália ao carregar uma velha (Hera disfarçada) pelo rio Anauro. Pélias promete devolver o trono se ele trouxer da Cólquida, no extremo oriental do mar Negro, o Velocino de Ouro, a pele do carneiro alado que salvou Frixo. Jasão reúne cerca de cinquenta heróis na nau Argo, o primeiro grande navio, construída por Argos com a ajuda de Atena e com uma viga de carvalho de Dodona que falava. A ida segue o caminho real dos comerciantes gregos rumo ao mar Negro; a volta, segundo Apolônio de Rodes, faz um enorme desvio pelos rios da Europa e pelo deserto da Líbia.", "paradas": [{"nome": "Iolco", "moderno": "Volos, Tessália", "lat": 39.36, "lon": 22.95, "texto": "Jasão reúne a tripulação mais famosa da mitologia: Héracles, Orfeu, os gêmeos Castor e Pólux, Peleu (pai de Aquiles), Telamon (pai de Ájax), Meléagro, Zetes e Calais (os filhos alados do Vento Norte), o vidente Mopso, o timoneiro Tífis, Linceu, que via através da terra, e, em algumas versões, Atalanta. Os heróis querem que Héracles seja o chefe, mas ele recusa e indica Jasão.\n\nNa praia de Págasas, o porto de Iolco, sacrificam a Apolo. O vidente Ídmon prevê que todos voltarão com o Velocino, menos ele. A Argo é lançada ao mar sobre troncos ao som da lira de Orfeu e parte para o leste.", "grego": "Ἰωλκός", "ref": "Apolônio de Rodes I 1–608 · Píndaro, Pítica IV", "tempo": "A partida", "certeza": "Sítio arqueológico", "sentido": "A primeira grande expedição coletiva da mitologia, uma geração antes de Troia. Muitos dos Argonautas são pais dos heróis da Ilíada.", "hoje": "Iolco corresponde à área da atual Volos. Escavações em Dimini e na colina de Kastro revelaram palácios micênicos. Uma réplica moderna da Argo foi construída ali em 2008."}, {"nome": "Lemnos", "moderno": "Mirina", "lat": 39.875, "lon": 25.06, "texto": "A primeira escala é Lemnos, onde não há homens. As mulheres da ilha haviam desprezado o culto de Afrodite, e a deusa as castigou com um odor que afastou os maridos. Eles passaram a viver com escravas trácias, e as lemnianas, numa única noite, mataram todos os homens da ilha. Só a rainha Hipsípile poupou o pai, Toante, escondendo-o numa arca lançada ao mar.\n\nAs mulheres recebem os Argonautas de braços abertos, precisando de homens para repovoar a ilha. A estadia dura meses: Jasão se une a Hipsípile, que tem dele dois filhos. É Héracles, que ficou guardando a Argo, quem envergonha os companheiros e os obriga a partir.", "grego": "Λῆμνος", "ref": "Apolônio de Rodes I 609–909 · Heródoto VI.138", "tempo": "As mulheres de Lemnos", "certeza": "Ilha real", "sentido": "A primeira tentação da viagem é o esquecimento da missão, um tema que a Odisseia retomará com Circe e Calipso.", "hoje": "Lemnos, no norte do Egeu, tem ruínas de Poliochni, uma das cidades mais antigas da Europa, e do santuário dos Cabiros. Entre os gregos, a expressão “crime lêmnio” designava algo horrível."}, {"nome": "Cízico", "moderno": "Mar de Mármara", "lat": 40.38, "lon": 27.89, "texto": "Atravessando o Helesponto, os Argonautas chegam à península de Cízico, onde reina o jovem rei de mesmo nome, recém-casado. Ele os recebe com festa. Enquanto parte da tripulação sobe o monte Díndimo, gigantes de seis braços, os Gegeneis (“nascidos da terra”), atacam a nau; Héracles os mata a flechadas.\n\nNa partida, ventos contrários empurram a Argo de volta à costa em plena noite. Os habitantes, sem reconhecê-los, os tomam por piratas e atacam. Na escuridão, Jasão mata o próprio rei Cízico. Ao amanhecer, os dois lados descobrem a tragédia. Os Argonautas fazem três dias de luto e jogos fúnebres. A jovem viúva, Clite, se enforca, e das lágrimas das ninfas nasce uma fonte com o nome dela.", "grego": "Κύζικος", "ref": "Apolônio de Rodes I 936–1077", "tempo": "O erro noturno", "certeza": "Sítio arqueológico", "sentido": "Um herói pode matar um amigo sem culpa e ainda assim ficar marcado. A tragédia grega nasce muito antes de Atenas.", "hoje": "Cízico fica perto de Erdek, na Turquia, numa península do mar de Mármara. Restam ruínas de um templo de Adriano e de um anfiteatro."}, {"nome": "Kios (Mísia)", "moderno": "Gemlik, Turquia", "lat": 40.43, "lon": 29.15, "texto": "Na Mísia, os heróis param para cortar madeira, porque Héracles quebrou o remo remando com força demais. O jovem Hilas, escudeiro e amado de Héracles, vai buscar água numa fonte. A ninfa da fonte se encanta com sua beleza à luz da lua, o abraça pelo pescoço e o puxa para o fundo das águas.\n\nPolifemo (não o Ciclope) ouve o grito e avisa Héracles, que corre pela floresta chamando Hilas, enlouquecido. Ao amanhecer, um vento favorável sopra e a Argo parte sem os dois. Os heróis brigam: Telamon acusa Jasão de ter abandonado Héracles de propósito. O deus marinho Glauco surge das ondas e diz que era a vontade de Zeus: Héracles tem seus doze trabalhos a cumprir.", "grego": "Κίος", "ref": "Apolônio de Rodes I 1172–1362 · Teócrito, Idílio XIII", "tempo": "Hilas", "certeza": "Sítio tradicional", "sentido": "A expedição perde seu maior guerreiro e, a partir daqui, terá de vencer pela astúcia e pela magia. Durante séculos os habitantes de Kios gritavam o nome de Hilas pelas montanhas num ritual anual.", "hoje": "Kios corresponde à atual Gemlik, na província de Bursa (Turquia), no golfo de mesmo nome, no mar de Mármara."}, {"nome": "Bebrícia", "moderno": "Bósforo asiático", "lat": 41.1, "lon": 29.07, "texto": "Na terra dos bébrices reina Âmico, filho de Poseidon, um gigante brutal. Todo estrangeiro deve enfrentá-lo no pugilato, e ninguém sai vivo. Ele desafia os Argonautas com desprezo.\n\nPólux, o melhor boxeador da Grécia, aceita. Âmico é mais pesado e ataca como uma onda; Pólux desvia, cansa o adversário e o atinge com um golpe acima da orelha, quebrando-lhe o crânio. Os bébrices atacam, e os heróis os põem em fuga, saqueando seus rebanhos.", "grego": "Βέβρυκες", "ref": "Apolônio de Rodes II 1–163 · Teócrito, Idílio XXII", "tempo": "O pugilato", "certeza": "Tradicional", "sentido": "Os Dióscuros, Castor e Pólux, eram protetores dos navegantes e dos atletas. Aqui o mito mostra por quê.", "hoje": "A Bebrícia ficava no lado asiático do Bósforo, perto da atual região de Beykoz, em Istambul. Os antigos mostravam ali um loureiro que teria nascido do túmulo de Âmico."}, {"nome": "Salmidesso", "moderno": "Kıyıköy, Trácia", "lat": 41.63, "lon": 28.09, "texto": "Na costa trácia vive o rei e vidente Fineu, cego e atormentado. Por ter revelado demais os planos dos deuses, Zeus o castigou: toda vez que ele se senta para comer, as Harpias, monstros alados com rosto de mulher, descem, arrebatam a comida e sujam o que sobra com um fedor insuportável. Ele está esquelético.\n\nZetes e Calais, filhos alados de Bóreas, armam uma emboscada: quando as Harpias descem, eles as perseguem pelos ares até as ilhas Estrófades, no mar Jônico. Íris, mensageira dos deuses, os detém e jura pelo Estige que as Harpias nunca mais voltarão. Agradecido, Fineu revela aos Argonautas tudo o que os espera no caminho e, sobretudo, como passar pelas rochas que se chocam.", "grego": "Σαλμυδησσός", "ref": "Apolônio de Rodes II 178–530 · Apolodoro I.9.21", "tempo": "Fineu e as Harpias", "certeza": "Sítio tradicional", "sentido": "O conhecimento é a moeda da troca: os heróis libertam o sábio, e ele lhes dá o mapa. Daqui em diante a viagem segue suas instruções.", "hoje": "Salmidesso era um trecho perigoso da costa trácia do mar Negro, famoso por naufrágios. Corresponde à região de Kıyıköy, na Turquia europeia."}, {"nome": "Simplégades", "moderno": "Entrada do Bósforo", "lat": 41.23, "lon": 29.12, "texto": "Na entrada do mar Negro ficam as Simplégades, as “rochas que se chocam”: dois rochedos que se juntam violentamente esmagando tudo o que passa, envoltos em névoa e espuma. Seguindo o conselho de Fineu, Eufemo solta uma pomba à frente do navio. Ela passa e as rochas se fecham, arrancando-lhe só as penas da cauda.\n\nQuando os rochedos se afastam de novo, os heróis remam com todas as forças. Uma onda gigantesca os empurra para trás, e Atena, com uma mão, segura uma rocha e com a outra empurra a Argo. O navio passa, perdendo apenas o ornamento da popa. As rochas ficam paradas para sempre, porque o destino era que, depois que um navio passasse, elas não se movessem mais. O mar Negro se abre aos gregos.", "grego": "Συμπληγάδες", "ref": "Apolônio de Rodes II 549–606 · Odisseia XII 69–72", "tempo": "As rochas que se chocam", "certeza": "Tradicional", "sentido": "A passagem do Bósforo, com correntes fortes e neblina, era realmente perigosa. O mito celebra o momento em que os gregos começaram a colonizar o mar Negro.", "hoje": "As Simplégades eram identificadas com as rochas Cyaneas, na boca norte do Bósforo, perto de Rumeli Feneri. Uma delas é hoje ligada à costa por um quebra-mar."}, {"nome": "Terra dos Mariandinos", "moderno": "Ereğli, Turquia", "lat": 41.28, "lon": 31.42, "texto": "Na terra dos mariandinos, o rei Lico recebe os Argonautas como amigos, porque Héracles já havia passado por ali e o ajudado contra os bébrices. Mas a escala custa caro.\n\nO vidente Ídmon, que previra a própria morte na partida, é morto por um javali selvagem nos juncos do rio. Pouco depois, o timoneiro Tífis morre de doença. Os heróis, abalados, ficam dias sem coragem de seguir, até que Hera inspira Anceu a assumir o leme. No caminho, passam pela ilha de Ares, onde são atacados pelas aves de bronze fugidas de Estínfalo; espantam-nas batendo com as espadas nos escudos.", "grego": "Μαριανδυνοί", "ref": "Apolônio de Rodes II 720–1089", "tempo": "As mortes", "certeza": "Sítio tradicional", "sentido": "A profecia de Ídmon se cumpre. Nos mitos gregos, saber o futuro raramente permite escapar dele.", "hoje": "A região dos mariandinos era a de Heracleia Pôntica, atual Karadeniz Ereğli, na Turquia. A caverna de Acherusia, ali perto, era apontada como uma das descidas de Héracles ao Hades."}, {"nome": "Ea, Cólquida", "moderno": "Kutaisi, Geórgia", "lat": 42.27, "lon": 42.7, "texto": "Na Cólquida, o rei Eetes, filho do Sol, não tem nenhuma intenção de entregar o Velocino. Impõe uma prova mortal: Jasão deve atrelar dois touros de cascos de bronze que cospem fogo, arar o campo de Ares, semear os dentes de um dragão e vencer os guerreiros armados que vão brotar da terra. Tudo num dia.\n\nHera e Atena pedem a Afrodite que faça Medeia, filha do rei e sacerdotisa de Hécate, se apaixonar por Jasão. Dividida entre o pai e o estrangeiro, Medeia passa a noite em agonia e acaba dando a Jasão um unguento que o torna invulnerável ao fogo e ao ferro por um dia. Ele doma os touros e ara o campo. Quando os guerreiros brotam, joga uma pedra no meio deles, e eles se matam uns aos outros, como Cadmo fizera em Tebas.\n\nEetes trama incendiar a Argo. Naquela noite, Medeia leva Jasão ao bosque sagrado, onde o Velocino está pendurado num carvalho guardado por um dragão que nunca dorme. Ela canta e borrifa no monstro uma poção de zimbro; o dragão adormece, e Jasão pega a pele dourada, que brilha como o relâmpago. Os dois fogem para a nau ainda de madrugada.", "grego": "Αἶα", "ref": "Apolônio de Rodes III–IV 1–240 · Píndaro, Pítica IV 211–250", "tempo": "O Velocino", "certeza": "Região real", "sentido": "O herói só vence graças à magia de uma mulher. Apolônio dedica um livro inteiro à paixão de Medeia, a primeira grande análise psicológica do amor na literatura grega.", "hoje": "A Cólquida é a planície do rio Rioni (antigo Fásis), no oeste da Geórgia. Em Vani, perto de Kutaisi, escavações encontraram tanto ouro que o sítio é chamado de “Pompeia georgiana”. Na região, o ouro era garimpado em rios com peles de carneiro, uma possível origem do mito."}, {"nome": "Foz do Danúbio (Ístro)", "moderno": "Delta do Danúbio", "lat": 45.2, "lon": 29.6, "texto": "Eetes envia uma frota atrás dos fugitivos, comandada por seu filho Apsirto. Para fugir, os Argonautas não voltam pelo Bósforo: seguem um conselho de Argos e entram pela foz do Ístro, o Danúbio, para chegar ao Adriático por rio. Apsirto os alcança e os encurrala.\n\nJasão e Medeia montam uma armadilha: ela marca um encontro com o irmão num templo de Ártemis, fingindo querer voltar para casa, e Jasão o mata na entrada. O sangue respinga no véu de Medeia. Em outras versões, mais terríveis, Medeia levou o irmão ainda criança na fuga, o despedaçou e espalhou os pedaços no mar para que o pai parasse para recolhê-los.", "grego": "Ἴστρος", "ref": "Apolônio de Rodes IV 241–551 · Apolodoro I.9.24", "tempo": "A fuga e o crime", "certeza": "Rio real (rota lendária)", "sentido": "A partir do assassinato de Apsirto, a viagem de volta é também uma busca de purificação. Zeus está irado.", "hoje": "O delta do Danúbio, na Romênia, é Patrimônio Mundial da UNESCO e uma das maiores zonas úmidas da Europa. Os antigos acreditavam que o Ístro tinha um braço que desaguava no Adriático."}, {"nome": "Erídano", "moderno": "Delta do Pó (tradicional)", "lat": 45.0, "lon": 12.3, "texto": "A viga falante da Argo, feita do carvalho de Dodona, anuncia que Zeus não perdoará o crime até que Circe os purifique. Os heróis navegam pelo Erídano, rio que os gregos associavam ao Pó, e passam pelo lugar onde Faetonte caiu fulminado: das águas ainda sobe um vapor fétido, e as irmãs dele, transformadas em choupos, choram lágrimas de âmbar.\n\nDo Erídano passam ao Ródano, através de lagos e rios da Gália, e quase se perdem rumo ao oceano do Norte, até que Hera grita do alto de um rochedo e os desvia. Saem no Mediterrâneo ocidental, entre os povos celtas e lígures, protegidos por uma névoa enviada pela deusa.", "grego": "Ἠριδανός", "ref": "Apolônio de Rodes IV 552–658", "tempo": "Os rios da Europa", "certeza": "Lendário", "sentido": "Uma geografia meio real, meio fantástica: os gregos conheciam o âmbar do Báltico, que chegava ao Mediterrâneo por rotas fluviais, e imaginavam essas rotas como rios ligados.", "hoje": "O delta do Pó, no Vêneto e na Emília-Romanha, é parque regional. A identificação do Erídano mítico com o Pó já era comum na Antiguidade."}, {"nome": "Ilha de Circe (Eea)", "moderno": "Monte Circeo, Itália", "lat": 41.23, "lon": 13.06, "texto": "Na ilha de Eea, Circe, irmã de Eetes e tia de Medeia, recebe os fugitivos sem saber quem são. Os dois se sentam em silêncio junto ao fogo, como suplicantes, com o rosto escondido, e ela entende que vêm purificar-se de um assassinato.\n\nCirce sacrifica um leitão, lava as mãos deles com seu sangue e faz libações a Zeus Purificador. Só depois pergunta quem são. Ao reconhecer na sobrinha o brilho dos olhos dos filhos do Sol e ouvir o que fizeram, Circe se horroriza e os expulsa, embora tenha cumprido o rito.", "grego": "Αἰαίη", "ref": "Apolônio de Rodes IV 659–752", "tempo": "A purificação", "certeza": "Tradicional", "sentido": "Um dos poucos rituais de purificação descritos em detalhe na literatura grega. A mesma Circe que, uma geração depois, transformará os companheiros de Odisseu em porcos.", "hoje": "O monte Circeo, na costa do Lácio, é um promontório que parece uma ilha vista do mar. Faz parte do Parque Nacional do Circeo e tem grutas com vestígios pré-históricos."}, {"nome": "Ilha das Sereias", "moderno": "Li Galli, Amalfi", "lat": 40.58, "lon": 14.43, "texto": "Tétis, a Nereida, mãe de Aquiles e esposa de Peleu, sobe à Argo por ordem de Hera e lhes indica o caminho. Ao passarem pela ilha das Sereias, ouvem o canto que atrai os marinheiros para a morte.\n\nOrfeu pega a lira e toca uma melodia rápida e vibrante, mais alta que as vozes das Sereias, e os remadores não ouvem o chamado. Só um herói, Butes, se lança ao mar fascinado; Afrodite o salva e o leva para a Sicília.", "grego": "Σειρῆνες", "ref": "Apolônio de Rodes IV 891–921", "tempo": "O canto de Orfeu", "certeza": "Tradicional", "sentido": "Duas soluções para o mesmo perigo: Odisseu se amarra ao mastro para ouvir; Orfeu vence a música com música.", "hoje": "Li Galli, três ilhotas diante da costa de Positano, na Costa Amalfitana, eram chamadas Sirenusas na Antiguidade. Pertenceram ao bailarino Rudolf Nureyev."}, {"nome": "Cila e Caríbdis", "moderno": "Estreito de Messina", "lat": 38.25, "lon": 15.63, "texto": "No estreito entre a Itália e a Sicília, a Argo enfrenta Cila, o monstro de seis cabeças que vive numa gruta, e Caríbdis, o redemoinho que engole o mar três vezes por dia. Logo adiante ficam as Rochas Errantes (Planctas), onde o fogo de Hefesto ferve.\n\nTétis e as Nereidas, suas irmãs, cercam o navio. Como meninas brincando com uma bola na praia, elas jogam a Argo de mão em mão por cima das ondas e entre as rochas, até deixá-la em águas tranquilas. Hefesto para de bater o martelo para assistir, e Hera abraça Atena de alívio.", "grego": "Σκύλλα καὶ Χάρυβδις", "ref": "Apolônio de Rodes IV 922–981", "tempo": "O estreito", "certeza": "Tradicional", "sentido": "Diferente de Odisseu, que perde seis homens para Cila, os Argonautas passam intactos: têm a proteção de Hera, e não a ira de Poseidon.", "hoje": "O Estreito de Messina tem correntes fortes e redemoinhos de verdade. Cila é associada à cidade de Scilla, na Calábria; Caríbdis, à área de Capo Peloro, na Sicília."}, {"nome": "Drépane (Esquéria)", "moderno": "Corfu", "lat": 39.62, "lon": 19.92, "texto": "Na ilha dos feácios, os Argonautas são alcançados pela segunda frota da Cólquida, que exige Medeia de volta. O rei Alcínoo, que quer evitar a guerra, decide em segredo: se Medeia ainda for virgem, voltará ao pai; se já for esposa de Jasão, ficará com ele.\n\nA rainha Arete conta a decisão a Jasão durante a noite. Os dois se casam às pressas numa caverna sagrada, sobre o Velocino estendido como leito nupcial, com as ninfas espalhando flores. De manhã, Alcínoo anuncia a sentença, e os cólquidas, sem poder levar Medeia nem voltar ao seu rei de mãos vazias, se estabelecem na ilha.", "grego": "Δρεπάνη", "ref": "Apolônio de Rodes IV 982–1222", "tempo": "O casamento", "certeza": "Tradicional", "sentido": "Os feácios ligam as duas grandes viagens marítimas: hospedam os Argonautas e, mais tarde, Odisseu.", "hoje": "Drépane (“foice”, pela forma da ilha) era um nome antigo de Corfu, que os gregos identificavam com a Esquéria de Homero. A cidade velha de Corfu é Patrimônio Mundial."}, {"nome": "Lago Tritão", "moderno": "Líbia/Tunísia (tradicional)", "lat": 33.7, "lon": 8.4, "texto": "Já à vista do Peloponeso, uma tempestade de nove dias joga a Argo para o sul, na Sirte, o golfo raso da Líbia, onde o navio encalha num mar de lama e areia sem saída. Os heróis se despedem uns dos outros esperando a morte.\n\nTrês ninfas protetoras da Líbia aparecem a Jasão e dizem que devem retribuir à mãe que os carregou por tanto tempo. Peleu entende: devem carregar a Argo. Durante doze dias e doze noites, eles levam o navio nos ombros pelo deserto até o lago Tritão. Ali, sedentos, encontram o jardim das Hespérides devastado, um dia depois da passagem de Héracles. O deus Tritão lhes indica a saída do lago para o mar e dá a Eufemo um torrão de terra que, jogado ao mar, se tornará a ilha de Tera, origem da futura colônia grega de Cirene.", "grego": "Τριτωνὶς λίμνη", "ref": "Apolônio de Rodes IV 1223–1781 · Píndaro, Pítica IV", "tempo": "O deserto", "certeza": "Lendário", "sentido": "O episódio mais surreal da viagem. Serve para justificar a fundação de Cirene, colônia grega na Líbia, cujo rei Píndaro celebrava.", "hoje": "O lago Tritão costuma ser identificado com os chotts, lagos salgados do sul da Tunísia, como o Chott el Djerid. A paisagem foi cenário de filmes como Star Wars."}, {"nome": "Creta", "moderno": "Creta", "lat": 35.3, "lon": 25.0, "texto": "Ao tentar desembarcar em Creta, os Argonautas são recebidos a pedradas por Talos, gigante de bronze forjado por Hefesto (ou o último sobrevivente da raça de bronze), que dá três voltas na ilha por dia para protegê-la. Ele tem uma única veia, que vai do pescoço ao tornozelo, fechada por um prego de bronze.\n\nMedeia, do convés, lança sobre ele um feitiço com o olhar, invocando os espíritos da morte. Talos, enfeitiçado, raspa o tornozelo numa pedra; o prego se solta, o icor (sangue dos deuses) escorre como chumbo derretido, e o gigante desaba como um pinheiro cortado.", "grego": "Τάλως", "ref": "Apolônio de Rodes IV 1638–1693 · Apolodoro I.9.26", "tempo": "O gigante de bronze", "certeza": "Ilha real", "sentido": "Talos é considerado o primeiro robô da literatura ocidental: um guardião mecânico, movido por um fluido, com um ponto fraco.", "hoje": "Talos aparece em moedas de Festos, em Creta, do século III a.C., como um jovem alado atirando uma pedra."}, {"nome": "Iolco", "moderno": "Volos", "lat": 39.36, "lon": 22.95, "texto": "De volta a Iolco, quatro meses depois, Jasão encontra o pai, Esão, morto ou forçado ao suicídio por Pélias, que não pretende devolver o trono. Medeia se encarrega da vingança.\n\nEla se apresenta às filhas de Pélias e mostra um feitiço de rejuvenescimento: corta um carneiro velho em pedaços, ferve-o num caldeirão com ervas mágicas, e dele salta um cordeiro. As filhas, acreditando poder devolver a juventude ao pai, o despedaçam e o põem no caldeirão. Medeia não diz as palavras certas. Pélias morre pelas mãos das próprias filhas. Acasto, filho de Pélias, expulsa Jasão e Medeia de Iolco.", "grego": "Ἰωλκός", "ref": "Apolodoro I.9.27 · Ovídio, Metamorfoses VII 297–349", "tempo": "O retorno", "certeza": "Sítio arqueológico", "sentido": "A conquista do Velocino não traz o trono: traz mais sangue. A magia que salvou Jasão agora assusta todos que a conhecem.", "hoje": "A Argo, diziam os antigos, foi deixada no istmo de Corinto como oferenda a Poseidon. Depois se tornou a constelação Argo Navis, que a astronomia moderna dividiu em três: Carina, Puppis e Vela."}, {"nome": "Corinto", "moderno": "Coríntia", "lat": 37.906, "lon": 22.88, "texto": "Em Corinto, Jasão e Medeia vivem por anos e têm filhos. Mas Jasão, ambicioso, aceita casar-se com Glauce (ou Creúsa), filha do rei Creonte de Corinto, e repudia Medeia, que é estrangeira e não tem mais para onde ir. Creonte ainda ordena que ela parta para o exílio.\n\nNa tragédia de Eurípides, Medeia finge aceitar e manda à noiva um vestido e uma coroa de ouro de presente, levados pelos próprios filhos. Quando Glauce os veste, eles pegam fogo e grudam na pele; ela morre em agonia, e Creonte, ao abraçá-la, morre junto. Depois, para destruir Jasão completamente, Medeia mata os próprios filhos. Foge num carro de dragões enviado por seu avô, o Sol, para Atenas, onde se casará com Egeu. Jasão, segundo uma tradição, morre velho e sozinho, atingido por um pedaço da proa da Argo apodrecida.", "grego": "Κόρινθος", "ref": "Eurípides, Medeia · Apolodoro I.9.28", "tempo": "O desfecho", "certeza": "Sítio arqueológico", "sentido": "Eurípides transforma o herói da aventura num marido mesquinho, e a feiticeira estrangeira numa das personagens mais complexas do teatro: vítima e assassina ao mesmo tempo.", "hoje": "A Corinto antiga, junto à cidade moderna, tem o templo de Apolo do século VI a.C. e a fonte de Glauce, onde, segundo Pausânias, a princesa teria se jogado para apagar o fogo do vestido."}]}, {"id": "calidon", "titulo": "A Caçada ao Javali de Cálidon", "ciclo": "herois", "fontes": ["Ilíada IX", "Ovídio VIII", "Apolodoro I.8"], "resumo": "Na festa da colheita, o rei Eneu de Cálidon oferece as primícias a todos os deuses, menos a Ártemis. A deusa se vinga com um javali gigantesco que destrói vinhedos, gado e gente. Para caçá-lo, o príncipe Meléagro reúne a maior assembleia de heróis antes da guerra de Troia: Jasão, Teseu, Castor e Pólux, Peleu, Nestor, Anfiarau e a caçadora Atalanta. A caçada termina com o javali morto e uma família destruída.", "paradas": [{"nome": "Cálidon", "moderno": "Etólia", "lat": 38.37, "lon": 21.53, "texto": "Quando Meléagro nasceu, as três Moiras apareceram para sua mãe, Alteia. Disseram que o menino viveria enquanto um tição que queimava na lareira não se consumisse. Alteia tirou o tição do fogo, apagou-o e o escondeu num baú.\n\nAnos depois, Meléagro reúne os heróis contra o javali. Alguns se recusam a caçar com uma mulher, mas ele se apaixonou por Atalanta e a impõe. Na caçada, o javali mata dois heróis; Peleu, sem querer, mata outro com a lança. Atalanta é a primeira a ferir o animal com uma flecha; Anfiarau acerta seu olho, e Meléagro o mata. Ele dá a pele e a cabeça a Atalanta, como prêmio por ter derramado o primeiro sangue.\n\nOs tios de Meléagro, irmãos de Alteia, ficam indignados de ver o prêmio ir para uma mulher e tomam a pele dela. Meléagro, furioso, os mata. Quando Alteia sabe que o filho matou seus irmãos, tira o tição do baú e o joga no fogo. Meléagro morre na hora, longe dali, consumido por dentro. Arrependida, Alteia se enforca.", "grego": "Καλυδών", "ref": "Ilíada IX 529–599 · Ovídio, Metamorfoses VIII 260–546 · Apolodoro I.8.2–3", "tempo": "A caçada", "certeza": "Sítio arqueológico", "sentido": "Na Ilíada, Fênix conta essa história a Aquiles para convencê-lo a voltar à luta. Meléagro é o herói que a fúria destrói.", "hoje": "As ruínas de Cálidon ficam perto da vila de Evinochori, na Etólia, junto ao rio Evinos. O santuário de Ártemis Láfria, escavado por arqueólogos dinamarqueses, guarda a memória do culto que Eneu negligenciou."}]}, {"id": "cadmo", "titulo": "Europa e a Fundação de Tebas", "ciclo": "tebano", "fontes": ["Ovídio II–III", "Apolodoro III.1–4"], "resumo": "Europa, princesa fenícia, filha do rei Agenor de Tiro, é raptada por Zeus disfarçado de touro e levada a Creta, onde se torna mãe da dinastia de Minos. O pai manda os filhos procurá-la e proíbe que voltem sem ela. Nenhum a encontra. Cadmo, o mais velho, acaba fundando Tebas, a cidade mais antiga e mais trágica da Grécia, e segundo Heródoto traz da Fenícia o alfabeto. A história termina com ele e a esposa, Harmonia, deixando a cidade e virando serpentes na costa do Adriático.", "paradas": [{"nome": "Tiro", "moderno": "Líbano", "lat": 33.27, "lon": 35.2, "texto": "Europa brinca com as amigas num prado junto ao mar, colhendo flores. Zeus, apaixonado, se transforma num touro branco como a neve, de chifres como meia-lua, e se mistura ao rebanho do rei Agenor. O touro é tão manso que Europa o acaricia, enfeita seus chifres com flores e, por fim, sobe em suas costas.\n\nNo mesmo instante o touro corre para a praia e entra no mar. Europa se segura num chifre, com a outra mão segura a túnica que o vento enfuna, e vê a terra ficar para trás. O touro nada sem parar até Creta.", "grego": "Τύρος", "ref": "Ovídio, Metamorfoses II 836–875 · Mosco, Europa", "tempo": "O rapto", "certeza": "Cidade real", "sentido": "O continente europeu recebeu o nome desta princesa asiática. A moeda grega de 2 euros ainda traz Europa sobre o touro.", "hoje": "Tiro, no sul do Líbano, foi a maior cidade fenícia. Suas ruínas romanas, com um hipódromo e uma necrópole, são Patrimônio Mundial da UNESCO."}, {"nome": "Gortina", "moderno": "Creta", "lat": 35.06, "lon": 24.95, "texto": "O touro chega à praia de Creta, perto de Gortina. Sob um plátano à beira de uma fonte, Zeus retoma sua forma divina e se une a Europa. Desde então, contavam os cretenses, aquele plátano nunca perde as folhas.\n\nEuropa dá à luz três filhos: Minos, que será o grande rei de Creta; Radamanto, famoso por sua justiça; e Sarpédon, que reinará na Lícia. Ela se casa depois com o rei cretense Astério, que adota os meninos. Zeus a presenteia com três dons: Talos, o gigante de bronze que guarda a ilha, um cão que nunca deixa escapar a presa e uma lança que nunca erra.", "grego": "Γόρτυς", "ref": "Apolodoro III.1.1–2 · Teofrasto, História das Plantas I.9.5", "tempo": "Em Creta", "certeza": "Sítio arqueológico", "sentido": "O mito liga a Fenícia à civilização cretense: os gregos sabiam que muito de sua cultura vinha do Oriente.", "hoje": "Gortina tem um odeon romano onde foi achado o Código de Gortina, a mais longa inscrição legal grega, de cerca de 450 a.C. Junto ao rio Lethaios, ainda se mostra um plátano sempre-verde."}, {"nome": "Delfos", "moderno": "Fócida", "lat": 38.482, "lon": 22.501, "texto": "Depois de procurar a irmã por toda parte em vão, Cadmo não pode voltar para casa. Vai a Delfos perguntar onde deve viver. A Pítia responde: desista de Europa. Ao sair do templo, siga uma vaca que nunca tenha sido atrelada ao arado, e funde uma cidade onde ela se deitar para descansar.\n\nCadmo encontra a vaca na Fócida, com uma marca branca em forma de lua cheia em cada flanco. Segue o animal por dias, através da Beócia, até que ele finalmente se deita no lugar onde seria Tebas.", "grego": "Δελφοί", "ref": "Ovídio, Metamorfoses III 6–25 · Apolodoro III.4.1", "tempo": "O oráculo", "certeza": "Sítio arqueológico", "sentido": "O nome Beócia seria derivado de boûs, “vaca”: a terra para onde a vaca conduziu Cadmo.", "hoje": "Delfos, nas encostas do Parnaso, tem o santuário de Apolo e o museu. A fonte Castália, onde os peregrinos se purificavam, ainda corre ao lado da estrada."}, {"nome": "Tebas (Cadmeia)", "moderno": "Beócia", "lat": 38.32, "lon": 23.32, "texto": "Cadmo quer sacrificar a vaca a Atena e manda os companheiros buscar água na fonte de Ares. A fonte é guardada por um dragão enorme, filho de Ares, que mata todos eles. Cadmo vai procurá-los, encontra os corpos e mata o dragão com uma pedra e a lança.\n\nAtena aparece e manda semear os dentes do monstro na terra. Dos sulcos brotam guerreiros armados, os Spartoí (“semeados”), que se voltam contra Cadmo. Ele joga uma pedra no meio deles; cada um acha que foi o vizinho, e eles se matam até restarem cinco. Esses cinco ajudam Cadmo a construir a cidadela, a Cadmeia, e se tornam os antepassados das famílias nobres de Tebas. Por ter matado o filho de Ares, Cadmo serve o deus por oito anos. Depois, recebe por esposa Harmonia, filha de Ares e Afrodite, num casamento a que todos os deuses comparecem.", "grego": "Καδμεία", "ref": "Ovídio, Metamorfoses III 26–130 · Apolodoro III.4.1–2 · Heródoto V.58", "tempo": "A fundação", "certeza": "Sítio arqueológico", "sentido": "Tebas nasce da terra e de um ato de violência; seus fundadores matam uns aos outros. É uma cidade que carrega desde o início a marca do sangue derramado em família.", "hoje": "Na Cadmeia, a colina central de Thiva, escavações revelaram um palácio micênico com tabuletas em Linear B e selos cilíndricos da Mesopotâmia. O museu arqueológico de Tebas guarda essas peças."}, {"nome": "Ilíria", "moderno": "Costa da Albânia/Montenegro", "lat": 42.0, "lon": 19.3, "texto": "O casamento traz uma maldição: o colar que Hefesto fez para Harmonia, presente de núpcias, trará desgraça a todas as suas donas. Os descendentes de Cadmo sofrem sem fim: a filha Sêmele morre fulminada por Zeus; Ino enlouquece e se joga ao mar com o filho; Agave despedaça o próprio filho Penteu; o neto Actéon é transformado em cervo e devorado pelos próprios cães.\n\nNa velhice, Cadmo e Harmonia deixam Tebas e vão viver entre os encheleus, na Ilíria. Ali, cansado, Cadmo se pergunta se a serpente que matou na juventude era sagrada, e diz que, se os deuses querem castigá-lo, que o transformem em serpente. Seu corpo começa a se alongar e a se cobrir de escamas. Harmonia o abraça e pede que os deuses a transformem também. Os dois se tornam serpentes mansas. Segundo outras versões, Zeus os leva depois aos Campos Elíseos.", "grego": "Ἰλλυρία", "ref": "Ovídio, Metamorfoses IV 563–603 · Apolodoro III.5.4", "tempo": "A velhice", "certeza": "Região real", "sentido": "O fundador termina transformado no mesmo animal que matou. O ciclo se fecha.", "hoje": "A tradição situava o túmulo de Cadmo e Harmonia perto de Budva, em Montenegro, e na região de Ohrid. Budva tem uma escultura moderna das duas serpentes."}]}, {"id": "edipo", "titulo": "Édipo", "ciclo": "tebano", "fontes": ["Sófocles, Édipo Rei e Édipo em Colono"], "resumo": "Laio, rei de Tebas, ouve do oráculo que, se tiver um filho, será morto por ele. Quando a rainha Jocasta dá à luz, ele manda abandonar o bebê na montanha. A criança sobrevive, cresce como príncipe de Corinto e, tentando fugir da mesma profecia, faz exatamente o que ela anunciava. A história de Édipo é a mais famosa tragédia grega: a do homem mais inteligente de seu tempo que não consegue enxergar a verdade sobre si mesmo.", "paradas": [{"nome": "Monte Citerão", "moderno": "Beócia/Ática", "lat": 38.18, "lon": 23.25, "texto": "Laio, apesar do aviso de Apolo, tem um filho com Jocasta, talvez numa noite de embriaguez. Apavorado, perfura os tornozelos do bebê e os amarra juntos, para que ele não sobreviva nem possa rastejar, e o entrega a um pastor para abandoná-lo no monte Citerão.\n\nO pastor tebano tem pena da criança e a entrega a outro pastor, de Corinto, que levava seus rebanhos pelo mesmo monte. O menino recebe o nome de Édipo, “pés inchados”, por causa das feridas.", "grego": "Κιθαιρών", "ref": "Sófocles, Édipo Rei 711–722, 1022–1040", "tempo": "O abandono", "certeza": "Montanha real", "sentido": "O nome do herói carrega a marca da tentativa do pai de matá-lo. A prova que vai revelar tudo está no próprio corpo dele.", "hoje": "O Citerão, entre a Beócia e a Ática, é coberto de pinheiros e abetos. É o mesmo monte das Bacantes de Dioniso e da morte de Actéon."}, {"nome": "Corinto", "moderno": "Coríntia", "lat": 37.906, "lon": 22.88, "texto": "O pastor coríntio leva o bebê ao rei Pólibo e à rainha Mérope, que não têm filhos e o criam como seu. Édipo cresce como príncipe de Corinto, sem saber que foi adotado.\n\nJá rapaz, num banquete, um bêbado o chama de bastardo, dizendo que ele não é filho do rei. Pólibo e Mérope negam com indignação, mas a dúvida não o deixa em paz. Sem avisar ninguém, Édipo parte para Delfos para perguntar a Apolo quem são seus pais.", "grego": "Κόρινθος", "ref": "Sófocles, Édipo Rei 774–793", "tempo": "A infância", "certeza": "Sítio arqueológico", "sentido": "Édipo é ao mesmo tempo amado e enganado. Sua grande qualidade, querer saber a verdade, será a causa de sua ruína.", "hoje": "A Corinto antiga fica a cerca de 7 km da cidade moderna, ao pé do Acrocorinto, a fortaleza que domina o istmo."}, {"nome": "Delfos", "moderno": "Fócida", "lat": 38.482, "lon": 22.501, "texto": "Apolo não responde à pergunta. Em vez disso, anuncia algo terrível: Édipo matará o próprio pai e se casará com a própria mãe, gerando filhos que os homens não suportarão ver.\n\nHorrorizado e convencido de que Pólibo e Mérope são seus pais, Édipo decide nunca mais voltar a Corinto. Parte na direção oposta, para a Beócia. Ao tentar escapar do destino, caminha diretamente em direção a ele.", "grego": "Δελφοί", "ref": "Sófocles, Édipo Rei 787–797", "tempo": "O oráculo", "certeza": "Sítio arqueológico", "sentido": "O oráculo diz a verdade, mas não toda a verdade. Na entrada do templo estava gravado: “Conhece-te a ti mesmo”.", "hoje": "No templo de Apolo em Delfos, a Pítia dava as respostas sentada num tripé, numa câmara interna chamada ádyton. Geólogos encontraram falhas sob o templo que liberavam gases, talvez a origem de seu transe."}, {"nome": "Encruzilhada tríplice", "moderno": "Schiste, Fócida", "lat": 38.46, "lon": 22.68, "texto": "Na estrada de Delfos, num lugar onde três caminhos se encontram, um carro vem em direção a Édipo. Um velho viaja nele com alguns servos. O arauto manda Édipo sair do caminho com brutalidade; o condutor o empurra. Quando Édipo passa ao lado, o velho o golpeia na cabeça com o aguilhão de duas pontas.\n\nÉdipo revida com o bastão e derruba o velho do carro, matando-o. Depois mata todos os servos, menos um, que foge. O velho era Laio, rei de Tebas, a caminho de Delfos para consultar o oráculo sobre a Esfinge. Ninguém sabe quem o matou.", "grego": "Σχιστὴ ὁδός", "ref": "Sófocles, Édipo Rei 798–813 · Pausânias X.5.3–4", "tempo": "O parricídio", "certeza": "Sítio tradicional", "sentido": "Um encontro casual, um conflito de trânsito, uma explosão de raiva: o momento mais banal da peça é o que realiza a profecia.", "hoje": "A encruzilhada de Schiste, na estrada entre Delfos e Daulis, perto de Distomo, é indicada por um pequeno monumento moderno. Pausânias viu ali o túmulo de Laio."}, {"nome": "Monte Fíquio", "moderno": "Beócia", "lat": 38.42, "lon": 23.2, "texto": "Tebas vive aterrorizada pela Esfinge, monstro com rosto de mulher, corpo de leão e asas de águia, enviado por Hera. Sentada num rochedo à entrada da cidade, ela propõe um enigma a quem passa e devora quem não sabe a resposta. Creonte, irmão de Jocasta e regente após a morte de Laio, promete o trono e a mão da rainha viúva a quem libertar a cidade.\n\nÉdipo chega e ouve o enigma: qual é o ser que tem uma só voz, que anda de quatro pés de manhã, com dois ao meio-dia e com três à tarde? Ele responde: o homem, que engatinha bebê, anda ereto adulto e usa bengala na velhice. Derrotada, a Esfinge se joga do rochedo.", "grego": "Φίκιον ὄρος", "ref": "Apolodoro III.5.8 · Hesíodo, Teogonia 326 · Sófocles, Édipo Rei 35–39", "tempo": "A Esfinge", "certeza": "Montanha real", "sentido": "A resposta do enigma é o próprio Édipo: bebê com os pés amarrados, homem no auge, velho cego que andará com um bastão. Ele decifra o homem e não decifra a si mesmo.", "hoje": "O monte Fíkio (hoje Fagas), a noroeste de Tebas, levaria o nome de Phix, forma beócia do nome da Esfinge."}, {"nome": "Tebas", "moderno": "Beócia", "lat": 38.32, "lon": 23.32, "texto": "Édipo se torna rei e se casa com Jocasta, a viúva de Laio. Têm quatro filhos: Etéocles, Polinices, Antígona e Ismênia. Anos depois, uma peste devasta Tebas. O oráculo diz que ela só passará quando o assassino de Laio for expulso.\n\nÉdipo conduz a investigação com determinação. O adivinho cego Tirésias lhe diz que o assassino é ele mesmo, e Édipo o acusa de conspiração. Jocasta, para acalmá-lo, conta que Laio morreu numa encruzilhada tríplice, e Édipo começa a tremer. Chega então de Corinto um mensageiro anunciando a morte de Pólibo e, para tranquilizar Édipo sobre a profecia, revela que ele foi adotado: foi o próprio mensageiro que o recebeu, bebê, das mãos de um pastor tebano. O velho pastor, trazido à força, confirma tudo. Jocasta entende antes e se enforca no palácio. Édipo encontra o corpo, arranca os broches de ouro do vestido dela e fura os próprios olhos.", "grego": "Θῆβαι", "ref": "Sófocles, Édipo Rei", "tempo": "A revelação", "certeza": "Cidade real", "sentido": "Aristóteles considerava Édipo Rei a tragédia perfeita. Freud tirou dela o nome do complexo de Édipo.", "hoje": "Thiva moderna está sobre a antiga Tebas. Das sete portas famosas da cidade, a de Electra foi localizada por arqueólogos."}, {"nome": "Colono", "moderno": "Atenas", "lat": 37.99, "lon": 23.71, "texto": "Cego e exilado, Édipo vaga por anos guiado pela filha Antígona, mendigando. Os filhos homens não o ajudam. Um oráculo diz que a terra onde ele for enterrado será protegida para sempre.\n\nEle chega a Colono, aldeia nos arredores de Atenas, e entra sem saber no bosque sagrado das Eumênides. Teseu, rei de Atenas, o acolhe e o protege contra Creonte, que tenta levá-lo de volta à força, e contra o filho Polinices, que vem pedir sua bênção para atacar Tebas; Édipo o amaldiçoa. Quando ouve trovões, sabe que chegou a hora. Caminha sozinho, sem guia, até o lugar da morte, e só Teseu vê o que acontece. Ninguém sabe onde fica o túmulo, que deve permanecer secreto para proteger Atenas.", "grego": "Κολωνός", "ref": "Sófocles, Édipo em Colono", "tempo": "A morte", "certeza": "Sítio tradicional", "sentido": "Sófocles, nascido em Colono, escreveu esta peça perto dos noventa anos. O homem amaldiçoado se torna um protetor sagrado.", "hoje": "Colono Hípio é hoje um bairro de Atenas, perto da Academia de Platão. Na pequena colina há túmulos-monumentos de arqueólogos do século XIX."}]}, {"id": "sete-contra-tebas", "titulo": "Os Sete contra Tebas e Antígona", "ciclo": "tebano", "fontes": ["Ésquilo, Sete contra Tebas", "Sófocles, Antígona"], "resumo": "Depois da queda de Édipo, os filhos Etéocles e Polinices combinam reinar em anos alternados. Ao fim do primeiro ano, Etéocles se recusa a ceder o trono e expulsa o irmão. Polinices vai a Argos, se casa com a filha do rei Adrasto e organiza uma expedição com sete chefes, um para cada porta de Tebas. A maldição de Édipo se cumpre: os irmãos morrem um pela mão do outro. Do conflito sobre o enterro de Polinices nasce Antígona, a tragédia sobre a lei dos homens e a lei dos deuses.", "paradas": [{"nome": "Argos", "moderno": "Argólida", "lat": 37.63, "lon": 22.73, "texto": "Polinices chega a Argos em plena noite e briga, à porta do palácio, com outro exilado, Tideu, de Cálidon. O rei Adrasto os separa e vê nos escudos deles um leão e um javali. Um oráculo havia lhe dito que casasse as filhas com um leão e um javali: ele dá Argia a Polinices e Deípile a Tideu, e promete devolver ambos às suas pátrias.\n\nReúnem-se sete chefes: Adrasto, Polinices, Tideu, Capaneu, Hipomedonte, Partenopeu e o adivinho Anfiarau. Anfiarau sabe que todos, menos Adrasto, vão morrer, e se recusa a partir. Polinices suborna a esposa dele, Erifile, com o colar amaldiçoado de Harmonia; ela convence o marido. Antes de sair, Anfiarau ordena aos filhos que o vinguem matando a própria mãe.", "grego": "Ἄργος", "ref": "Apolodoro III.6.1–3 · Ésquilo, Sete contra Tebas", "tempo": "A aliança", "certeza": "Cidade real", "sentido": "Mais uma vez o colar de Harmonia traz desgraça. A expedição parte já condenada, e o adivinho sabe disso.", "hoje": "Argos tem um dos maiores teatros da Grécia, com capacidade para 20 mil pessoas, escavado na encosta da colina de Lárissa."}, {"nome": "Nemeia", "moderno": "Argólida", "lat": 37.81, "lon": 22.71, "texto": "A caminho de Tebas, o exército sofre com a sede na região de Nemeia. Encontra Hipsípile, a antiga rainha de Lemnos, agora escrava, cuidando do pequeno Ofeltes, filho do rei local. Ela deixa o bebê sobre uma moita de aipo para guiar os guerreiros até uma fonte. Quando voltam, uma serpente matou a criança.\n\nAnfiarau vê no fato um presságio terrível e chama o menino de Arquêmoro, “o começo do destino”. Os chefes matam a serpente e enterram a criança com honras. Em sua memória, criam os Jogos Nemeus. Por isso, contavam, os juízes dos jogos vestiam roupas negras de luto e os vencedores eram coroados com aipo.", "grego": "Νεμέα", "ref": "Apolodoro III.6.4 · Eurípides, Hipsípile (fragmentos)", "tempo": "A morte de Ofeltes", "certeza": "Sítio arqueológico", "sentido": "O mesmo lugar tem dois mitos de fundação dos Jogos: um com Héracles e o leão, outro com o bebê morto. Os gregos guardavam ambos.", "hoje": "Em Nemeia, os arqueólogos identificaram o Heroon de Ofeltes, um recinto sagrado ao lado do templo de Zeus. Desde 1996 os Jogos Nemeus foram revividos com corridas a pé no estádio antigo."}, {"nome": "Tebas", "moderno": "Beócia", "lat": 38.32, "lon": 23.32, "texto": "Diante das sete portas de Tebas, cada atacante enfrenta um defensor. Capaneu sobe as muralhas gritando que nem Zeus o impedirá, e Zeus o fulmina com um raio. Tideu, ferido de morte, recebe de Atena uma poção que o tornaria imortal, mas, quando ela chega, encontra-o devorando o cérebro de seu inimigo; enojada, a deusa a deixa cair. Anfiarau foge e a terra se abre para engoli-lo vivo com seu carro. Na sétima porta, Etéocles e Polinices se enfrentam e se matam ao mesmo tempo.\n\nCreonte, o novo rei, ordena: Etéocles terá funeral de herói; o corpo de Polinices, o traidor, ficará para os cães e as aves, e quem o enterrar será morto. Antígona desafia a ordem e cobre o irmão com terra, dizendo que as leis não escritas dos deuses estão acima das leis de um rei. Creonte a condena a ser emparedada viva numa caverna. Tirésias o adverte; quando ele cede, é tarde: Antígona se enforcou, o filho de Creonte, Hémon, noivo dela, se mata sobre seu corpo, e a mãe de Hémon também se suicida.", "grego": "Θῆβαι", "ref": "Ésquilo, Sete contra Tebas · Sófocles, Antígona · Eurípides, Fenícias", "tempo": "O assalto e Antígona", "certeza": "Cidade real", "sentido": "Antígona é talvez a obra grega mais citada sobre desobediência civil e o conflito entre consciência individual e lei do Estado. Dez anos depois, os filhos dos Sete, os Epígonos, voltarão e tomarão Tebas.", "hoje": "No sítio de Oropos, ao norte de Atenas, funcionava o Anfiareion, santuário oracular no lugar onde Anfiarau teria sido engolido pela terra. Ruínas do teatro e do pórtico estão preservadas."}]}, {"id": "pelope", "titulo": "Tântalo, Pélope e a Maldição dos Atridas", "ciclo": "troiano", "fontes": ["Píndaro, Olímpica I", "Pausânias V"], "resumo": "Tântalo, filho de Zeus e rei da Lídia, era tão favorecido que comia com os deuses. Por arrogância ou para testá-los, cometeu o crime mais terrível: servir-lhes o próprio filho como alimento. Pélope ressuscitado vai à Grécia e funda uma dinastia que dá nome ao Peloponeso, mas o crime original e um assassinato novo pesarão sobre seus descendentes por gerações. Desta maldição vêm Agamêmnon e Menelau, os reis da guerra de Troia.", "paradas": [{"nome": "Monte Sípilo", "moderno": "Manisa, Turquia", "lat": 38.6, "lon": 27.4, "texto": "Tântalo convida os deuses para um banquete no monte Sípilo. Para testar se eles são mesmo oniscientes, mata o filho Pélope, o corta em pedaços, cozinha e serve. Todos os deuses percebem e recuam horrorizados, menos Deméter, distraída pelo luto por Perséfone, que come um pedaço do ombro.\n\nZeus manda recolher os pedaços e fervê-los num caldeirão. Pélope ressurge, mais belo do que antes; o ombro que faltava é substituído por um de marfim. Tântalo é condenado no Tártaro ao suplício que leva seu nome: fica mergulhado num lago até o queixo, sob árvores carregadas de frutos, mas a água recua toda vez que ele se abaixa para beber, e os galhos se afastam quando ele estende a mão. Píndaro rejeita a história do banquete como blasfema e conta que Poseidon se apaixonou por Pélope e o levou ao Olimpo.", "grego": "Σίπυλος", "ref": "Píndaro, Olímpica I · Odisseia XI 582–592 · Ovídio, Metamorfoses VI 401–411", "tempo": "O banquete", "certeza": "Montanha real", "sentido": "“Tantalizar” vem daqui: desejar algo que parece ao alcance e nunca se alcança.", "hoje": "O monte Sípilo (Spil Dağı) fica junto a Manisa, na Turquia. É parque nacional, e na encosta há um relevo hitita esculpido na rocha, que os gregos chamavam de imagem da Mãe dos Deuses."}, {"nome": "Pisa / Olímpia", "moderno": "Élida", "lat": 37.638, "lon": 21.63, "texto": "Pélope vai à Grécia e quer se casar com Hipodâmia, filha de Enômao, rei de Pisa. Enômao, que segundo um oráculo seria morto pelo genro (ou que desejava a própria filha), desafia cada pretendente a uma corrida de carros até o istmo de Corinto. O pretendente parte primeiro com a princesa; o rei vai atrás e, se o alcança, mata-o com a lança. Seus cavalos, presente de Ares, são imbatíveis. Treze cabeças de pretendentes já enfeitam o palácio.\n\nPoseidon dá a Pélope um carro de ouro com cavalos alados. Pélope ainda suborna Mírtilo, o cocheiro de Enômao, prometendo-lhe metade do reino (ou uma noite com Hipodâmia). Mírtilo troca os pinos das rodas do carro do rei por pinos
