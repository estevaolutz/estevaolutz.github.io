úmulo de Alexandre e coloca uma coroa de ouro sobre o corpo; diz-se que, ao tocá-lo, quebrou sem querer o nariz da múmia. O Egito vira propriedade pessoal do imperador, governado por um prefeito, e passa a alimentar Roma com trigo.","sentido":"O último reino helenístico cai, e o Egito se torna o celeiro de Roma.","hoje":"O túmulo de Alexandre e o mausoléu de Cleópatra nunca foram encontrados. O Museu Greco-Romano de Alexandria foi reaberto em 2023 após longa reforma.","ref":"Plutarco, Antônio 74–86 · Suetônio, Augusto 17–18 · Dião Cássio LI 6–16","certeza":"Local identificado"},{"nome":"Campanha na Cantábria","moderno":"Segisamo, Sasamón, Espanha","lat":42.418,"lon":-4.043,"ano":-26,"tempo":"26 a.C.","texto":"Em 27 a.C., Otaviano devolve formalmente seus poderes ao Senado e recebe em troca o nome Augusto, o venerável, e o governo das províncias com legiões. Para mostrar que é um líder militar como César, vai em pessoa à guerra contra os cântabros, no norte da Hispânia.\n\nInstala o quartel-general em Segisamo e organiza um ataque em três colunas, com apoio da frota pela costa. Mas os montanheses evitam as batalhas, emboscam as colunas e se escondem nos picos. Augusto adoece gravemente, sofre crises de saúde e quase é atingido por um raio, que mata um escravo à sua frente; ele manda erguer um templo a Júpiter Tonante em agradecimento. Volta para Tarraco e deixa a guerra para os generais. Ela só termina com Agripa, seis anos depois.","sentido":"A única campanha que Augusto liderou como imperador, e a lição de que precisava de generais melhores que ele.","hoje":"Sasamón, na província de Burgos, conserva o nome de Segisamo e restos de acampamento romano.","ref":"Dião Cássio LIII 25 · Suetônio, Augusto 20, 29 · Floro II 33","certeza":"Nome evoluído"},{"nome":"Os estandartes de Crasso","moderno":"Margem do Eufrates","lat":36.0,"lon":38.3,"ano":-20,"tempo":"20 a.C.","texto":"Em 53 a.C., Crasso foi derrotado e morto pelos partas em Carras, e as águias de suas legiões, os estandartes sagrados, ficaram expostas nos templos partos. Marco Antônio tentou vingá-lo e também perdeu. A vergonha pesava sobre Roma havia trinta anos.\n\nAugusto prefere a diplomacia à guerra. Aproveita uma disputa dinástica na Pártia, ameaça com o envio do enteado Tibério à frente de um exército na Armênia e, em 20 a.C., negocia com o rei Fraates IV. Os partas devolvem os estandartes e os prisioneiros sobreviventes sem uma batalha. Augusto transforma o acordo em triunfo de propaganda: cunha moedas com um parta ajoelhado entregando a águia, manda representá-lo na couraça de sua estátua de Prima Porta e constrói um templo a Marte Vingador para guardar as águias.","sentido":"Uma vitória diplomática vendida como militar, a especialidade de Augusto.","hoje":"A estátua de Augusto de Prima Porta, nos Museus Vaticanos, mostra a cena na couraça. O templo de Marte Vingador fica no Fórum de Augusto, em Roma.","ref":"Res Gestae 29 · Dião Cássio LIV 8 · Suetônio, Augusto 21","certeza":"Local aproximado"},{"nome":"Récia e Nórico","moderno":"Perto de Innsbruck, Áustria","lat":47.27,"lon":11.39,"ano":-15,"tempo":"15 a.C.","texto":"Os Alpes, entre a Itália e o Danúbio, ainda são habitados por povos independentes que atacam viajantes e comerciantes. Em 15 a.C., Augusto manda os dois enteados, filhos de Lívia: Druso sobe do sul pelos vales do Ádige e do Inn, enquanto Tibério vem do oeste, pelo lago de Constança, onde vence uma batalha naval no próprio lago.\n\nEm uma única campanha de verão, os récios e vindélicos são submetidos, e a fronteira chega ao Danúbio. Augusto celebra a conquista com um enorme troféu em La Turbie, sobre o mar, perto de Mônaco, com os nomes de 45 povos alpinos vencidos.","sentido":"Os Alpes viram terra romana, e o Império ganha uma fronteira natural: o Danúbio.","hoje":"O Troféu dos Alpes, em La Turbie, França, ainda está de pé, parcialmente reconstruído, e mantém a inscrição com os povos vencidos.","ref":"Dião Cássio LIV 22 · Estrabão IV 6 · Res Gestae 26","certeza":"Local aproximado"},{"nome":"Druso no Elba","moderno":"Rio Elba, perto de Magdeburgo, Alemanha","lat":52.12,"lon":11.63,"ano":-9,"tempo":"9 a.C.","texto":"Augusto decide empurrar a fronteira do Reno até o Elba. Druso comanda quatro campanhas na Germânia, entre 12 e 9 a.C. Abre um canal entre o Reno e o lago Flevo para levar a frota ao mar do Norte, constrói fortes ao longo do Lippe e derrota uma tribo após outra.\n\nEm 9 a.C., chega ao Elba, o primeiro romano a fazê-lo. Segundo Dião Cássio, uma mulher de tamanho sobre-humano aparece e lhe diz em latim que pare, porque o fim de seus dias e de seus feitos está próximo. Druso volta. No caminho, cai do cavalo e quebra a perna. A ferida infecciona, e ele morre trinta dias depois, aos 29 anos. Tibério cavalga 300 km em um dia e uma noite para chegar a tempo, e então acompanha o corpo a pé até Roma.","sentido":"A expansão até o Elba custa ao Império o seu general mais promissor.","hoje":"Um cenotáfio, o Drususstein, foi erguido para Druso em Mogúncia (Mainz), base das campanhas; seus restos ainda estão lá.","ref":"Dião Cássio LV 1–2 · Suetônio, Cláudio 1 · Valério Máximo V 5","certeza":"Local aproximado"},{"nome":"Teutoburgo","moderno":"Kalkriese, perto de Bramsche, Alemanha","lat":52.41,"lon":8.13,"ano":9,"tempo":"9 d.C.","texto":"Em 9 d.C., a Germânia entre o Reno e o Elba parece pacificada. O governador Públio Quintílio Varo, jurista sem grande experiência militar, cobra tributos como numa província antiga. Seu homem de confiança é Armínio, príncipe dos queruscos, cidadão romano e oficial das tropas auxiliares, educado em Roma.\n\nArmínio inventa uma revolta distante para atrair Varo para fora do caminho habitual. As três legiões, a Décima Sétima, a Décima Oitava e a Décima Nona, marcham com seis coortes auxiliares, mulheres, crianças e bagagem, numa coluna de quilômetros. Chove sem parar. Num corredor estreito entre uma colina coberta de floresta e um pântano, em Kalkriese, os germânicos atacam de trás de um muro de terra e grama preparado com antecedência. Durante três dias, a coluna é destruída aos pedaços. Varo e os oficiais se matam. Os prisioneiros são sacrificados nos bosques. Em Roma, Augusto bate a cabeça nas portas do palácio gritando: Quintílio Varo, devolva minhas legiões!","sentido":"Cerca de 15 mil soldados mortos, e o sonho de uma Germânia romana até o Elba enterrado na floresta.","hoje":"Em Kalkriese, desde 1987, arqueólogos acharam milhares de objetos, como moedas, pontas de pilo e uma máscara facial de cavaleiro, e o muro germânico. Há um museu e um parque no local. Os números das legiões perdidas nunca mais foram usados.","ref":"Dião Cássio LVI 18–24 · Veleio Patérculo II 117–119 · Suetônio, Augusto 23 · Tácito, Anais I 60–62","certeza":"Sítio arqueológico","batalha":{"tipo":"Emboscada","vencedor":"Germânicos","forcas":"c. 18.000 (Varo) × c. 15.000–20.000 (Armínio)","baixas":"Roma: três legiões destruídas, c. 15.000 mortos","diagrama":"teutoburgo"}},{"nome":"Morte em Nola","moderno":"Nola, Itália","lat":40.926,"lon":14.527,"ano":14,"tempo":"14 d.C.","texto":"Augusto tem 75 anos. Seus herdeiros escolhidos morreram um após o outro: o sobrinho Marcelo, o amigo Agripa, os netos Caio e Lúcio. Sobrou o enteado Tibério, que ele nunca amou. Num dos últimos atos, deixa ao Senado três documentos: instruções para o funeral, um relatório do Império, com o número de soldados e o dinheiro em caixa, e o conselho de manter o Império nas fronteiras atuais. Também deixa as Res Gestae, a lista de seus feitos, para ser gravada em bronze diante do mausoléu.\n\nEm agosto de 14 d.C., viajando pela Campânia, adoece e para em Nola, na mesma casa e no mesmo quarto onde seu pai, Caio Otávio, morrera. Segundo Suetônio, no último dia pediu um espelho, mandou pentear o cabelo e perguntou aos amigos se tinha representado bem a comédia da vida; e, se sim, que o aplaudissem. Morre nos braços de Lívia, dizendo: Lívia, lembre-se de nosso casamento e adeus.","sentido":"Um general mediano em campo, mas o estrategista que transformou uma República em guerra num Império que duraria séculos.","hoje":"O texto mais completo das Res Gestae sobrevive no Templo de Augusto e Roma em Ancara, na Turquia. O mês de agosto leva seu nome desde 8 a.C.","ref":"Suetônio, Augusto 97–101 · Dião Cássio LVI 29–31 · Tácito, Anais I 5–11","certeza":"Local aproximado"}],"era":"imperio","rivais":["agripa","cesar","germanico"]},{"id":"germanico","nome":"Germânico","latim":"Germanicus Iulius Caesar","cor":"#5f7480","vida":"15 a.C.–19 d.C.","papel":"Vingador de Teutoburgo","fontes":["Tácito, Anais I–II","Suetônio, Vida de Calígula 1–7","Dião Cássio LVI–LVII","Veleio Patérculo II"],"resumo":"Filho de Druso e neto de Lívia e Marco Antônio, Germânico herdou do pai o nome, a coragem e a popularidade. Adotado por Tibério por ordem de Augusto, era o herdeiro natural do Império. Comandou as legiões do Reno, conteve um motim, voltou ao campo de Teutoburgo para enterrar os mortos de Varo e recuperou duas das três águias perdidas. Chamado de volta por um Tibério desconfiado, morreu aos 33 anos na Síria, convencido de que fora envenenado. Seu filho Calígula e seu neto Nero seriam imperadores.","paradas":[{"nome":"A grande revolta ilírica","moderno":"Bósnia central","lat":44.1,"lon":17.9,"ano":7,"tempo":"7 d.C.","texto":"Em 6 d.C., os povos da Panônia e da Dalmácia, recrutados para uma campanha contra os marcomanos, se revoltam: cerca de 200 mil combatentes, liderados por dois chefes chamados ambos Bato. É a guerra mais séria desde as Púnicas, segundo Suetônio. Augusto teme ver os rebeldes na Itália em dez dias.\n\nTibério comanda a repressão com quinze legiões. Germânico, com 21 anos e apenas questor, é mandado com tropas recrutadas às pressas, inclusive escravos libertos. A guerra é feita de cercos nas montanhas da Dalmácia: Splonum, Raetinium, Seretium. Em Raetinium, os defensores incendeiam a cidade e se escondem nas galerias enquanto os romanos entram nas chamas. Germânico ganha experiência e prestígio. A revolta acaba em 9 d.C., poucos dias antes de chegar a notícia de Teutoburgo.","sentido":"A escola de Germânico: três anos de guerra nas montanhas dos Bálcãs.","hoje":"As fortalezas da revolta ficavam nas montanhas da atual Bósnia e Croácia; as localizações exatas são incertas.","ref":"Dião Cássio LV 29–LVI 17 · Veleio Patérculo II 110–116","certeza":"Local aproximado"},{"nome":"O motim do Reno","moderno":"Colônia, Alemanha","lat":50.938,"lon":6.958,"ano":14,"tempo":"14 d.C.","texto":"Augusto morre em agosto de 14 d.C. As quatro legiões do baixo Reno, cansadas de servir trinta ou quarenta anos por salários miseráveis, se amotinam. Matam centuriões a chicotadas e jogam os corpos no Reno. Oferecem a Germânico o Império, se ele quiser marchar sobre Roma. Ele responde que prefere morrer a trair a lealdade e saca a espada para se matar; um soldado lhe oferece a sua, dizendo que é mais afiada.\n\nNa Ara Ubiorum, os amotinados chegam a ameaçar a esposa de Germânico, Agripina, grávida, e o filho pequeno, Caio. Germânico decide mandá-los para longe, para uma cidade gaulesa. Os soldados veem a mulher do general fugir com o menino, que eles adoravam e chamavam de Calígula, por causa das botinhas de soldado, as caligae, que usava. Envergonhados, imploram que fiquem. A disciplina volta, e os próprios soldados executam os líderes do motim.","sentido":"Germânico vence um motim sem batalha, com dignidade e um menino de botinhas.","hoje":"A Ara Ubiorum, o altar dos úbios, ficava no centro da atual Colônia. Calígula se tornaria imperador em 37 d.C.","ref":"Tácito, Anais I 31–49 · Suetônio, Calígula 9","certeza":"Local identificado"},{"nome":"Os catos e Mattium","moderno":"Perto de Fritzlar, Alemanha","lat":51.13,"lon":9.27,"ano":15,"tempo":"15 d.C.","texto":"Para dar às legiões uma razão para lutar e lavar o motim, Germânico leva a guerra à Germânia. Na primavera de 15 d.C., cruza o Reno e ataca os catos de surpresa, quando a seca permite atravessar os rios a pé.\n\nOs velhos, as mulheres e as crianças são mortos ou capturados; os jovens fogem atravessando o rio Eder a nado. Germânico incendeia Mattium, a capital dos catos. Enquanto isso, Segestes, nobre querusco pró-romano, sogro de Armínio, pede socorro: Armínio o cerca. Germânico o liberta e encontra com ele a filha, Thusnelda, esposa de Armínio, grávida, que tinha sido levada à força. Ela é capturada. O filho que dará à luz será criado como prisioneiro em Ravena.","sentido":"Germânico atinge Armínio onde dói: a mulher e o filho.","hoje":"Mattium ficaria perto de Fritzlar, no norte de Hesse; a localização exata é discutida, e a hipótese mais citada é a colina de Altenburg, em Niedenstein.","ref":"Tácito, Anais I 55–59 · Estrabão VII 1","certeza":"Local debatido"},{"nome":"O campo de Varo","moderno":"Kalkriese, perto de Bramsche, Alemanha","lat":52.41,"lon":8.13,"ano":15,"tempo":"15 d.C.","texto":"No verão de 15 d.C., Germânico chega à floresta onde, seis anos antes, Varo perdera as três legiões. Tácito descreve a cena com detalhes que só um sobrevivente poderia contar.\n\nPrimeiro aparece o acampamento de Varo, com a largura da muralha e o tamanho do fosso de três legiões. Depois, uma trincheira meio derrubada, onde os restos do exército fizeram sua última resistência. No meio do campo, ossos esbranquiçados, espalhados onde os homens fugiram, amontoados onde resistiram. Fragmentos de lanças e ossos de cavalo; crânios pregados nos troncos das árvores. Nos bosques próximos, os altares bárbaros onde os tribunos e centuriões foram sacrificados. Sobreviventes mostram onde os comandantes caíram, onde as águias foram tomadas, onde Varo recebeu o primeiro ferimento e se matou. O exército inteiro, sem saber se enterrava parentes ou estranhos, enterra os ossos. Germânico coloca o primeiro torrão de grama sobre o túmulo.","sentido":"Uma cena sem batalha, só luto: uma das passagens mais fortes de toda a literatura latina.","hoje":"Em Kalkriese, arqueólogos acharam fossas com ossos humanos e de mulas misturados, enterrados alguns anos depois da morte, exatamente como Tácito descreve.","ref":"Tácito, Anais I 60–62","certeza":"Sítio arqueológico"},{"nome":"Pontes Longas","moderno":"Perto de Mehrholz/Diepholz, Alemanha","lat":52.6,"lon":8.3,"ano":15,"tempo":"15 d.C.","texto":"Na volta, o legado Aulo Cecina, com quatro legiões, deve atravessar uma estrada de troncos sobre pântanos, as Pontes Longas, construída anos antes por Lúcio Domício. As pontes estão em ruínas. Armínio, que conhece o terreno, ataca os soldados enquanto eles tentam consertá-las com lama até a cintura.\n\nNa noite seguinte, Cecina sonha que vê Varo saindo do pântano coberto de sangue e chamando por ele, e rejeita a mão estendida. No dia seguinte, o desastre se repete: as legiões perdem a bagagem, os cavalos atolam, a coluna se desfaz. Mas Armínio quer esperar; seu tio Inguiomero insiste num assalto direto ao acampamento romano. Cecina deixa os germânicos chegarem à paliçada e os ataca com tudo. A vitória salva o exército. No Reno, corre o boato de que tudo está perdido, e querem destruir a ponte. Agripina impede, recebe os soldados na cabeceira e cuida dos feridos com as próprias mãos.","sentido":"Quase uma repetição de Teutoburgo, evitada pela calma de um veterano de 40 anos de serviço.","hoje":"A localização das Pontes Longas é desconhecida. Estradas de troncos romanas foram achadas em pântanos do norte da Alemanha, perto de Diepholz.","ref":"Tácito, Anais I 63–69","certeza":"Local debatido","batalha":{"tipo":"Vitória romana defensiva","vencedor":"Roma","forcas":"4 legiões (Cecina) × c. 30.000 (Armínio e Inguiomero)","baixas":"Germânicos: pesadas perdas no assalto ao acampamento"}},{"nome":"A frota no Ems","moderno":"Foz do Ems, perto de Emden, Alemanha","lat":53.35,"lon":7.2,"ano":16,"tempo":"16 d.C.","texto":"Para evitar as florestas e emboscadas, Germânico decide levar o exército por mar. Em 16 d.C., manda construir mil navios no Reno: alguns de fundo chato para encalhar sem danos, outros largos para levar cavalos e mantimentos, outros com lemes na proa e na popa, para remar em qualquer direção.\n\nA frota se reúne na Ilha dos Batavos, desce pelo canal de Druso até o lago Flevo, sai no mar do Norte e entra pela foz do Ems. Os soldados desembarcam no coração da Germânia sem ter marchado por uma única floresta. É a maior operação anfíbia que Roma havia feito no norte.","sentido":"Germânico usa o mar para chegar aonde as estradas eram armadilhas.","hoje":"A foz do Ems fica perto de Emden, na Frísia Oriental, junto à fronteira com a Holanda. O antigo lago Flevo é hoje parte do IJsselmeer, transformado por diques.","ref":"Tácito, Anais II 5–8","certeza":"Local aproximado"},{"nome":"Idistaviso","moderno":"Vale do Weser, perto de Porta Westfalica, Alemanha","lat":52.24,"lon":8.92,"ano":16,"tempo":"16 d.C.","texto":"Os dois exércitos se encontram no Weser. Do outro lado do rio, Armínio conversa aos gritos com o irmão, Flavo, que serve fielmente a Roma e perdeu um olho em combate. Armínio fala da pátria e da mãe; Flavo, da grandeza de Roma. Precisam ser impedidos de atravessar o rio e lutar entre si.\n\nNa noite anterior à batalha, Germânico se disfarça com uma pele de animal e anda entre as barracas para ouvir o que os soldados dizem dele. Ouve elogios e decide lutar. Na manhã seguinte, na planície de Idistaviso, entre o rio e as colinas, ele vê oito águias voando em direção à floresta e grita aos soldados que sigam as aves de Roma. A cavalaria ataca pelo flanco e por trás; os germânicos são empurrados para o rio e para a floresta. Armínio escapa ferido, com o rosto sujo de sangue para não ser reconhecido. A perseguição dura 15 km.","sentido":"A vingança de Teutoburgo, numa planície cujo nome significa talvez campo das deusas da batalha.","hoje":"O local exato é desconhecido. A hipótese mais citada situa a planície no vale do Weser, perto de Porta Westfalica e Minden.","ref":"Tácito, Anais II 9–18","certeza":"Local debatido","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 8 legiões + auxiliares (Germânico) × c. 50.000 (Armínio)","baixas":"Germânicos: pesadas perdas"}},{"nome":"Muralha Angrivária","moderno":"Perto de Leese, Alemanha","lat":52.5,"lon":9.1,"ano":16,"tempo":"16 d.C.","texto":"Os germânicos se reagrupam atrás de um grande muro de terra construído pelos angrivários para marcar a fronteira com os queruscos, entre o rio e um pântano. Querem repetir a tática de Kalkriese.\n\nGermânico conhece a armadilha. Manda a infantaria atacar o muro de frente, sob uma chuva de projéteis disparados por máquinas de guerra e fundeiros, e, quando o muro cai, lidera pessoalmente o assalto sem capacete, para ser reconhecido. Os germânicos, presos entre o rio e o pântano, sem espaço para manobrar com suas lanças longas, são massacrados. Germânico ergue um troféu com a inscrição: o exército de Tibério César, depois de subjugar os povos entre o Reno e o Elba, consagra este monumento a Marte, Júpiter e Augusto. Nesse ano, uma das águias de Varo é encontrada, enterrada num bosque dos marsos.","sentido":"A segunda vitória em semanas, e duas das três águias de Varo de volta a Roma.","hoje":"A localização é discutida; escavações em Leese, perto de Stolzenau, revelaram um muro de terra e vestígios de combate que podem corresponder ao relato.","ref":"Tácito, Anais II 19–25","certeza":"Local debatido","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"Exército de Germânico × Germânicos de Armínio","baixas":"Germânicos: grandes perdas"}},{"nome":"Tempestade no mar do Norte","moderno":"Mar do Norte","lat":53.9,"lon":6.8,"ano":16,"tempo":"16 d.C.","texto":"No outono, Germânico embarca as legiões no Ems para voltar. Uma tempestade se abate sobre a frota no mar do Norte. Os navios são espalhados até ilhas distantes; os soldados jogam cavalos e bagagem ao mar para não afundar; alguns navios chegam à Britânia.\n\nGermânico, desesperado, culpa a si mesmo e quer se jogar ao mar. Os sobreviventes voltam aos poucos, contando histórias de monstros marinhos e criaturas meio humanas. Tibério usa o desastre e o custo das campanhas como argumento: chama Germânico de volta a Roma, dá-lhe um triunfo e o manda para o Oriente. A Germânia além do Reno nunca será província. Diz Tácito que Germânico pedia só mais um ano para acabar a guerra.","sentido":"O fim da tentativa de reconquistar a Germânia, decidido pela natureza e pela política.","hoje":"O mar do Norte entre a Frísia e as ilhas Frísias tem marés fortes e bancos de areia; o Mar de Wadden é hoje Patrimônio Mundial da UNESCO.","ref":"Tácito, Anais II 23–26","certeza":"Local aproximado"},{"nome":"Artaxata: um rei para a Armênia","moderno":"Artashat, Armênia","lat":39.96,"lon":44.55,"ano":18,"tempo":"18 d.C.","texto":"Tibério manda Germânico ao Oriente com poderes superiores a todos os governadores. Ele visita Atenas, as ilhas, Troia e Colofon, onde um oráculo lhe prevê, de forma velada, uma morte precoce.\n\nEm Artaxata, a capital armênia, coroa como rei o príncipe Zenão, filho do rei do Ponto, criado à maneira armênia, que adota o nome de Artaxias. Transforma a Capadócia e a Comagena em províncias. A missão é diplomática e bem-sucedida, mas aumenta o conflito com o governador da Síria, Cneu Pisão, nomeado por Tibério, que anula suas ordens e o trata com hostilidade aberta.","sentido":"Germânico resolve a Armênia com uma coroa, sem batalha.","hoje":"As ruínas de Artaxata ficam perto do mosteiro de Khor Virap, com o monte Ararat ao fundo.","ref":"Tácito, Anais II 53–58","certeza":"Sítio arqueológico"},{"nome":"A viagem ao Egito","moderno":"Alexandria e Tebas, Egito","lat":31.205,"lon":29.885,"ano":19,"tempo":"19 d.C.","texto":"Em 19 d.C., Germânico viaja ao Egito, sob o pretexto de resolver uma crise de fome. Abre os armazéns de trigo e baixa os preços, anda sem guarda, de sandálias e manto grego, como Cipião na Sicília. Sobe o Nilo de barco, visita as pirâmides, as ruínas de Tebas e os colossos de Mêmnon, que cantavam ao amanhecer.\n\nO problema é que Augusto proibira qualquer senador de entrar no Egito sem permissão do imperador, porque quem controlasse o país controlaria o trigo de Roma. Tibério critica duramente a viagem no Senado. Para muitos historiadores, foi o erro político que selou o destino de Germânico.","sentido":"Uma viagem de turismo e caridade que, para Tibério, parecia uma ameaça.","hoje":"Os colossos de Mêmnon, em Luxor, deixaram de cantar depois de uma restauração na época de Septímio Severo, por volta de 200 d.C.","ref":"Tácito, Anais II 59–61 · Suetônio, Tibério 52","certeza":"Local identificado"},{"nome":"Morte em Dafne","moderno":"Harbiye, perto de Antakya, Turquia","lat":36.13,"lon":36.14,"ano":19,"tempo":"19 d.C.","texto":"Na volta à Síria, Germânico encontra suas ordens anuladas por Pisão. Adoece gravemente em Epidafne, perto de Antioquia. Na casa, encontram restos de corpos humanos, feitiços escritos em placas de chumbo com seu nome, cinzas e outros objetos de magia.\n\nNo leito de morte, diz aos amigos que foi vítima de Pisão e da esposa dele, Plancina, e pede que levem Agripina e os filhos a Roma e mostrem ao povo a neta de Augusto. Morre em 10 de outubro de 19 d.C., aos 33 anos. Em Antioquia, o corpo nu é exposto no fórum. Comparam-no a Alexandre, também morto jovem, longe da pátria, depois de grandes vitórias. Agripina leva as cinzas a Roma numa viagem de luto que comove o Império. Pisão é processado e se mata antes do veredito. Tácito deixa no ar a pergunta que nunca foi respondida: Tibério estava por trás?","sentido":"O herdeiro mais amado de Roma morre jovem, e a suspeita envenena o reinado de Tibério.","hoje":"Harbiye, a antiga Dafne, era um subúrbio de jardins e fontes de Antioquia, famoso pelo santuário de Apolo.","ref":"Tácito, Anais II 69–83, III 1–19 · Suetônio, Calígula 1–6","certeza":"Local aproximado"}],"era":"imperio","rivais":["augusto"]},{"id":"trajano","nome":"Trajano","latim":"Marcus Ulpius Traianus","cor":"#a8732f","vida":"53–117 d.C.","papel":"Imperador-soldado · auge territorial","fontes":["Dião Cássio LXVIII (epítome)","Plínio, o Jovem, Panegírico e Cartas","Coluna de Trajano (relevos)","Eutrópio VIII","Aurélio Vítor"],"resumo":"Nascido em Itálica, na Hispânia, Trajano foi o primeiro imperador vindo das províncias. Soldado de carreira, adotado por Nerva, ganhou do Senado o título de Optimus, o melhor dos príncipes. Conquistou a Dácia em duas guerras, com uma ponte sobre o Danúbio que ficou mil anos sem rival, anexou a Arábia e levou as águias até o golfo Pérsico. Sob ele, o Império atingiu sua maior extensão. Morreu voltando da Pártia, e suas conquistas no Oriente foram abandonadas pelo sucessor, Adriano.","paradas":[{"nome":"Viminácio: a primeira travessia","moderno":"Kostolac, Sérvia","lat":44.74,"lon":21.21,"ano":101,"tempo":"101 d.C.","texto":"Desde Domiciano, Roma paga um subsídio anual a Decébalo, rei da Dácia, um reino rico em ouro, nas montanhas dos Cárpatos, ao norte do Danúbio. Os romanos acham isso humilhante. Em 101 d.C., Trajano, imperador havia três anos, decide acabar com o pagamento e com a Dácia independente.\n\nReúne cerca de dez legiões e muitos auxiliares, talvez 150 mil homens, em Viminácio, base legionária no Danúbio. A Coluna de Trajano começa com a cena da travessia: o deus-rio Danúbio, um velho barbudo, sai das águas para ver os soldados passarem em duas pontes de barcos, marchando com os estandartes. Ao longo do rio, a estrada que Trajano manda abrir na rocha das Portas de Ferro permite o movimento de tropas.","sentido":"A maior concentração de tropas romanas em décadas, contra um reino que humilhara Roma.","hoje":"O sítio de Viminacium, perto de Kostolac, é um dos maiores parques arqueológicos da Sérvia, com anfiteatro e mausoléus. A Tabula Traiana, placa na rocha que celebra a estrada, foi elevada para não ser coberta pela represa de 1972.","ref":"Coluna de Trajano, cenas I–IV · Dião Cássio LXVIII 6–8","certeza":"Sítio arqueológico"},{"nome":"Tapae","moderno":"Portas de Ferro da Transilvânia, Romênia","lat":45.506,"lon":22.725,"ano":101,"tempo":"101 d.C.","texto":"As colunas romanas avançam pelo Banato até as Portas de Ferro da Transilvânia, uma passagem entre montanhas que leva ao coração da Dácia. Ali, em Tapae, onde um exército de Domiciano fora derrotado em 86 d.C., Decébalo espera.\n\nA batalha é sangrenta. Segundo Dião Cássio, os feridos são tantos que Trajano rasga as próprias roupas para fazer ataduras. Na Coluna, Júpiter aparece no céu lançando raios contra os dácios, e soldados auxiliares lutam com cabeças cortadas presas pelos cabelos entre os dentes. Os dácios recuam. Trajano manda erguer um altar para os mortos e celebrar ritos anuais em sua memória. O inverno interrompe a campanha.","sentido":"Uma vitória custosa no mesmo lugar onde Roma fora derrotada quinze anos antes.","hoje":"Tapae ficava na passagem de Bucova, perto de Zeicani, no condado de Hunedoara, na entrada do vale de Hațeg.","ref":"Dião Cássio LXVIII 8 · Coluna de Trajano, cenas XXIV","certeza":"Local identificado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 100.000 (Trajano) × c. 50.000 (Decébalo)","baixas":"Pesadas perdas dos dois lados"}},{"nome":"Primeira paz","moderno":"Sarmizegetusa Regia, Romênia","lat":45.623,"lon":23.31,"ano":102,"tempo":"102 d.C.","texto":"No inverno, Decébalo contra-ataca ao sul do Danúbio, na Mésia, com cavaleiros sármatas roxolanos de armadura escamada, homens e cavalos cobertos de placas. Muitos se afogam quando o gelo do Danúbio se quebra. Trajano vence em Adamclisi, na atual Dobruja, uma batalha tão dura que mais tarde mandará erguer ali um monumento enorme, o Tropaeum Traiani, e um altar com os nomes de quase 4 mil soldados mortos.\n\nEm 102 d.C., os romanos avançam pelas montanhas até as fortalezas em torno de Sarmizegetusa, a capital. Decébalo se rende: entrega armas, máquinas e engenheiros romanos que desertaram, desmonta fortalezas e aceita ser rei cliente. Na Coluna, os dácios se ajoelham diante de Trajano. Mas Decébalo não pretende cumprir.","sentido":"Uma paz que nenhum dos dois lados leva a sério.","hoje":"As fortalezas dácias dos montes Orăștie, incluindo Sarmizegetusa Regia, são Patrimônio Mundial da UNESCO, com seus santuários circulares de andesito.","ref":"Dião Cássio LXVIII 9–10 · Coluna de Trajano, cenas LXXV","certeza":"Sítio arqueológico"},{"nome":"A ponte de Apolodoro","moderno":"Drobeta-Turnu Severin, Romênia","lat":44.624,"lon":22.666,"ano":105,"tempo":"105 d.C.","texto":"Para garantir que nunca mais dependerá de pontes de barcos, Trajano manda o arquiteto Apolodoro de Damasco construir uma ponte permanente sobre o Danúbio em Drobeta. São 20 pilares de pedra com cerca de 45 m de altura, separados por 50 m, sustentando arcos de madeira. O comprimento passa de 1.100 m.\n\nPara erguer os pilares, o rio é desviado e as fundações são feitas a seco, com ensecadeiras. A obra leva cerca de dois anos. Foi a ponte de arcos mais longa do mundo por mais de mil anos. Na Coluna, Trajano aparece oferecendo um sacrifício diante dela. Anos depois, Adriano mandaria retirar o tabuleiro de madeira para impedir que os bárbaros a usassem.","sentido":"Uma obra de engenharia que é também uma mensagem: Roma veio para ficar.","hoje":"Os restos de dois pilares ainda estão de pé, um em cada margem, em Drobeta-Turnu Severin (Romênia) e Kladovo (Sérvia). O Museu das Portas de Ferro tem uma maquete da ponte.","ref":"Dião Cássio LXVIII 13 · Procópio, Edifícios IV 6","certeza":"Sítio arqueológico"},{"nome":"Queda de Sarmizegetusa","moderno":"Sarmizegetusa Regia, Romênia","lat":45.623,"lon":23.31,"ano":106,"tempo":"106 d.C.","texto":"Decébalo rearma-se, ataca tribos aliadas de Roma e tenta assassinar Trajano. Captura à traição o general Longino e o usa como refém; Longino se envenena para não servir de moeda de troca. Em 105 d.C., começa a segunda guerra.\n\nTrajano avança em várias colunas pelas montanhas. Em 106 d.C., cerca Sarmizegetusa. A Coluna mostra a cidade cercada, os romanos cortando os canos de água, os dácios incendiando as próprias casas e, numa cena terrível, chefes dácios passando entre si uma taça de veneno. A capital cai. Decébalo foge para o norte com poucos cavaleiros. Cercado por cavaleiros romanos, corta a própria garganta debaixo de uma árvore. Um deles, Tibério Cláudio Máximo, leva a cabeça e a mão direita do rei a Trajano. A lápide desse soldado, encontrada em 1965, mostra a cena. O tesouro de Decébalo, escondido sob o leito de um rio desviado, é encontrado graças a um traidor: segundo algumas estimativas, toneladas de ouro e prata.","sentido":"O fim de um reino e de um rei que preferiu a morte à rendição.","hoje":"A lápide de Tibério Cláudio Máximo está no museu de Drama, na Grécia. O ouro dácio teria financiado o Fórum de Trajano e grandes jogos em Roma, com 123 dias de espetáculos.","ref":"Dião Cássio LXVIII 11–14 · Coluna de Trajano, cenas CXIX–CXLV","certeza":"Sítio arqueológico","batalha":{"tipo":"Cerco e conquista","vencedor":"Roma","forcas":"c. 100.000+ (Trajano) × Dácios de Decébalo","baixas":"Reino dácio extinto; Decébalo suicida"}},{"nome":"Bostra: a Arábia","moderno":"Bosra, Síria","lat":32.518,"lon":36.481,"ano":106,"tempo":"106 d.C.","texto":"No mesmo ano da conquista da Dácia, Trajano anexa o reino nabateu, cujo último rei, Rabel II, acabara de morrer. Os nabateus eram os senhores das rotas de caravanas do incenso, com capital em Petra, a cidade escavada na rocha.\n\nA anexação é feita sem guerra pelo governador da Síria, Cornélio Palma. Nasce a província da Arábia Petreia, com capital em Bostra. Trajano manda construir a Via Nova Traiana, uma estrada de mais de 400 km de Bostra ao mar Vermelho, em Aila. A província garante o controle das rotas comerciais do sul e prepara o caminho para a futura guerra contra a Pártia.","sentido":"O Império cresce sem batalha: as caravanas do incenso passam a pagar imposto a Roma.","hoje":"Bosra tem um dos teatros romanos mais bem conservados do mundo, transformado em fortaleza pelos árabes. A cidade foi danificada durante a guerra civil síria.","ref":"Dião Cássio LXVIII 14 · Amiano Marcelino XIV 8","certeza":"Sítio arqueológico"},{"nome":"Armênia anexada","moderno":"Perto de Erzurum, Turquia","lat":39.9,"lon":41.27,"ano":114,"tempo":"114 d.C.","texto":"Em 113 d.C., o rei parta Osroes I depõe o rei da Armênia e coloca outro em seu lugar sem consultar Roma, rompendo um acordo de meio século. Trajano, com 60 anos, decide fazer o que nenhum romano conseguiu: derrotar a Pártia.\n\nNa primavera de 114 d.C., parte de Antioquia, atravessa a Capadócia e entra na Armênia. Em Elegeia, recebe o rei armênio Partamasíris, que tira o diadema e o coloca aos pés de Trajano, esperando recebê-lo de volta. Trajano não o devolve e declara a Armênia província romana. Partamasíris é escoltado para fora e morre misteriosamente no caminho. O Senado dá a Trajano o título de Optimus.","sentido":"Trajano transforma em província um reino que Roma e a Pártia disputavam havia 150 anos.","hoje":"Elegeia ficava perto da atual Erzurum, no leste da Turquia; o lugar exato é incerto.","ref":"Dião Cássio LXVIII 17–20 · Fronto","certeza":"Local aproximado"},{"nome":"Terremoto de Antioquia","moderno":"Antakya, Turquia","lat":36.202,"lon":36.16,"ano":115,"tempo":"115 d.C.","texto":"Trajano passa o inverno em Antioquia, a terceira maior cidade do Império, cheia de soldados, embaixadores e comerciantes vindos para a corte. Em 13 de dezembro de 115 d.C., um terremoto devastador atinge a cidade.\n\nDião Cássio descreve o barulho como mugido, as árvores arrancadas, prédios inteiros desabando, gente soterrada por dias. O cônsul Pedão morre. O monte Cásio parece se inclinar sobre a cidade. Trajano escapa saindo por uma janela, guiado, segundo se dizia, por uma figura sobre-humana, e passa dias acampado no hipódromo. Uma mulher e um bebê são encontrados vivos sob os escombros, a mãe amamentando o filho e a si mesma com o próprio leite.","sentido":"O imperador do mundo sobrevive por pouco ao tremor da terra.","hoje":"Antakya foi novamente arrasada pelo terremoto de 6 de fevereiro de 2023, que matou dezenas de milhares de pessoas na Turquia e na Síria.","ref":"Dião Cássio LXVIII 24–25","certeza":"Local identificado"},{"nome":"Ctesifonte","moderno":"Salman Pak, Iraque","lat":33.093,"lon":44.58,"ano":116,"tempo":"116 d.C.","texto":"Em 116 d.C., Trajano desce a Mesopotâmia em duas frentes. Constrói barcos nas florestas de Nísibis e os leva em carroças até o Tigre. Atravessa o rio diante dos partas, que fogem ao ver a operação. Anexa a Adiabena, a antiga Assíria, e chega a Babilônia.\n\nPara levar a frota do Eufrates ao Tigre, pensa em reabrir um antigo canal, mas desiste porque o Eufrates é mais alto e poderia secar. Arrasta os barcos por terra. Ctesifonte, a capital de inverno dos partas, cai sem grande resistência. Trajano captura a filha do rei e o trono de ouro. O Senado lhe dá o título de Parthicus e o direito de celebrar quantos triunfos quiser.","sentido":"Roma toma a capital do seu maior rival, algo que nem César chegara a tentar.","hoje":"As ruínas de Ctesifonte ficam em Salman Pak, ao sul de Bagdá. O Taq Kasra, enorme arco do palácio sassânida posterior, ainda está de pé.","ref":"Dião Cássio LXVIII 26–28 · Eutrópio VIII 3","certeza":"Sítio arqueológico"},{"nome":"No golfo Pérsico","moderno":"Cárax Espasinu, perto de Basra, Iraque","lat":30.8,"lon":47.6,"ano":116,"tempo":"116 d.C.","texto":"Trajano desce o Tigre até o golfo Pérsico, onde nenhum general romano jamais estivera. Em Cárax, o porto do reino de Mesena, os comerciantes indianos e árabes o recebem bem.\n\nNa praia, vê um navio partindo para a Índia. Segundo Dião Cássio, diz que, se fosse jovem, teria ido até lá também. Fala muito de Alexandre e o chama de feliz. Escreve ao Senado que chegou mais longe que Alexandre, o que não era verdade. Em seguida, visita a Babilônia e oferece um sacrifício no quarto onde Alexandre morreu. É o ponto extremo do Império Romano. E é ali que chegam as notícias: a Mesopotâmia inteira se revoltou atrás dele, e as comunidades judaicas do Egito, de Cirene e de Chipre também se levantaram.","sentido":"O ponto mais distante que um imperador romano atingiu, e o instante em que tudo começa a desmoronar.","hoje":"Cárax Espasinu ficava em Jabal Khayyaber, ao norte de Basra. Pesquisas britânicas e iraquianas mapearam a cidade desde 2016.","ref":"Dião Cássio LXVIII 28–29","certeza":"Local aproximado"},{"nome":"Hatra","moderno":"Hatra, Iraque","lat":35.588,"lon":42.718,"ano":117,"tempo":"117 d.C.","texto":"Trajano reprime as revoltas com dureza: Selêucia é incendiada e Edessa, saqueada. Para manter alguma ordem, coroa um príncipe parta, Partamaspates, como rei cliente em Ctesifonte.\n\nNo caminho de volta, cerca Hatra, uma cidade árabe no deserto, rica e protegida por muralhas circulares e pela aridez. Ao redor, não há água, nem madeira, nem pasto. Moscas pousam na comida e na bebida dos soldados; tempestades de granizo e trovões caem quando os romanos atacam. Trajano, cavalgando sem insígnias perto das muralhas, é reconhecido pelos cabelos brancos e pelo porte; um cavaleiro de sua escolta é morto por uma flecha. O cerco fracassa. Trajano adoece e se retira. Hatra, protegida pelo deus Sol, resistiria também a Septímio Severo, oitenta anos depois.","sentido":"A primeira derrota de Trajano, diante de uma cidade no meio do nada.","hoje":"Hatra, Patrimônio Mundial da UNESCO, teve templos e estátuas destruídos pelo Estado Islâmico em 2015. Desde 2017, arqueólogos iraquianos avaliam os danos e restauram o sítio.","ref":"Dião Cássio LXVIII 31","certeza":"Sítio arqueológico","batalha":{"tipo":"Cerco fracassado","vencedor":"Hatra","forcas":"Exército de Trajano × Defensores de Hatra","baixas":"Cerco levantado"}},{"nome":"Morte em Selino","moderno":"Gazipaşa, Turquia","lat":36.268,"lon":32.293,"ano":117,"tempo":"117 d.C.","texto":"Trajano, doente, deixa o comando do Oriente com Adriano, seu primo e protegido, e embarca para Roma. Sofre um derrame que paralisa parte do corpo, e depois um edema. Acredita ter sido envenenado.\n\nO navio para em Selino, na Cilícia. Ali Trajano morre, em 8 ou 9 de agosto de 117 d.C., aos 63 anos. A esposa, Plotina, anuncia que, no leito de morte, ele adotou Adriano. Muitos desconfiaram: segundo uma tradição, um ator teria imitado a voz fraca do imperador detrás de uma cortina. Adriano abandona logo a Mesopotâmia, a Assíria e a Armênia, voltando à fronteira do Eufrates. As cinzas de Trajano são levadas a Roma e colocadas na base da sua Coluna, o primeiro imperador sepultado dentro dos limites sagrados da cidade.","sentido":"O Império nunca mais será tão grande quanto naquele dia.","hoje":"Selino passou a se chamar Trajanópolis. Na atual Gazipaşa há ruínas de um edifício identificado por alguns como o cenotáfio de Trajano. Por séculos, os novos imperadores foram saudados com o voto: que seja mais feliz que Augusto e melhor que Trajano.","ref":"Dião Cássio LXVIII 33, LXIX 1 · Eutrópio VIII 5 · História Augusta, Adriano 4","certeza":"Local identificado"}],"era":"imperio","rivais":[]}],"potencias":{"roma":{"nome":"Roma","cor":"#b8413a"},"cliente":{"nome":"Reinos clientes de Roma","cor":"#d98a7e"},"cartago":{"nome":"Cartago","cor":"#8a63b5"},"siracusa":{"nome":"Siracusa","cor":"#c79ad6"},"macedonia":{"nome":"Macedônia","cor":"#4f86c6"},"seleucida":{"nome":"Império Selêucida","cor":"#d4a03c"},"ptolomeu":{"nome":"Egito ptolomaico","cor":"#4fb3a0"},"ponto":{"nome":"Reino do Ponto","cor":"#6a9a4a"},"partia":{"nome":"Império Parta","cor":"#c4703a"},"armenia":{"nome":"Armênia","cor":"#a3824f"},"numidia":{"nome":"Numídia","cor":"#c99a6a"},"mauritania":{"nome":"Mauritânia","cor":"#b5a05a"},"iberos":{"nome":"Povos ibéricos","cor":"#9db36a"},"gauleses":{"nome":"Gália independente","cor":"#6fae8e"},"germanos":{"nome":"Povos germânicos","cor":"#7d8f9e"},"britanos":{"nome":"Britanos","cor":"#8aa7b8"},"caledonios":{"nome":"Caledônios","cor":"#9aa9a6"},"ilirios":{"nome":         const left = x - w / 2 > 70, tx = sv("text", { x: left ? x - w / 2 - 4 : x + w / 2 + 4, y: y + 3.5, "text-anchor": left ? "end" : "start", style: "font:600 9.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px" }, units); tx.textContent = u.nome; return;
      }
      const vert = Math.abs(((r || 0) % 180)) > 45;
      let ly = y - (vert ? Math.max(w, h) / 2 : h / 2) - 3;
      if (placed.some(p => Math.abs(p[0] - x) < 70 && Math.abs(p[1] - ly) < 11)) ly = y + (vert ? Math.max(w, h) / 2 : h / 2) + 11;
      placed.push([x, ly]);
      const tx = sv("text", { x: Math.max(24, Math.min(336, x)), y: Math.max(9, Math.min(216, ly)), "text-anchor": "middle", style: "font:600 9.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px" }, units);
      tx.textContent = u.nome;
    });
    if (arrowsOn) for (const [ph, s, d] of D.setas) if (ph === phase) sv("path", { d, "marker-end": `url(#ah-${id}-${s})`, style: `fill:none;stroke:${D.lados[s].cor};stroke-width:2.2;stroke-dasharray:4 2.5;opacity:.95` }, arrows);
  }
  function goPhase(n, animate = true) {
    n = (n + 4) % 4; phase = n;
    btns.forEach((b, i) => b.setAttribute("aria-pressed", i === n));
    cap.textContent = D.fases[n];
    cancelAnimationFrame(anim);
    const from = cur.map(f => f.slice()), to = D.unidades.map(u => u.f[n].map(v => v));
    if (!animate || reduce) { cur = to; render(true); return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const u = Math.min(1, (now - t0) / dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      cur = from.map((f, i) => f.map((v, j) => v + ((to[i][j] ?? v) - v) * e));
      render(u >= 1);
      if (u < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  for (let i = 0; i < 4; i++) { const b = el("button", null, String(i + 1)); b.setAttribute("aria-label", "Fase " + (i + 1)); b.onclick = e => { e.stopPropagation(); clearTimeout(playT); goPhase(i); }; btns.push(b); ctr.append(b); }
  const play = el("button", null, "▶"); play.setAttribute("aria-label", "Animar as quatro fases");
  play.onclick = e => {
    e.stopPropagation(); clearTimeout(playT);
    goPhase(0, false);
    const next = k => { playT = setTimeout(() => { goPhase(k); if (k < 3) next(k + 1); }, 2600); };
    next(1);
  };
  ctr.append(play);
  const leg = el("div", "dl");
  for (const s of ["A", "B"]) { const sp = el("span"); const i = el("i"); i.style.setProperty("--c", D.lados[s].cor); sp.append(i, document.createTextNode(D.lados[s].nome)); leg.append(sp); }
  ctr.append(leg);
  box.append(svg, ctr, cap);
  box.addEventListener("click", e => e.stopPropagation());
  goPhase(0, false);
  return box;
}

/* ---------- painel ---------- */
const panel = document.getElementById("panel");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ICON = {
  prev: '<svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg>',
  play: '<svg viewBox="0 0 16 16"><path d="M4 2v12l10-6z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>',
  restart: '<svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.6 3.9l1.9.7A4 4 0 1 0 8 4v2.5L4.5 3 8 0z"/></svg>'
};

function header() {
  const f = document.createDocumentFragment();
  f.append(el("div", "eyebrow", "SPQR · ATLAS DVCVM ROMANORVM"), el("h1", null, "Atlas dos Grandes Generais Romanos"));
  const places = new Set(GENS.flatMap(m => m.paradas.map(p => p.lat.toFixed(1) + p.lon.toFixed(1)))).size;
  const bat = GENS.reduce((a, g) => a + g.paradas.filter(p => p.batalha).length, 0);
  f.append(el("div", "stats", `${GENS.length} generais · ${places} lugares · ${bat} batalhas · 264 a.C. – 117 d.C.`));
  f.append(el("p", "intro", "Quatro séculos de campanhas, de Aníbal nos Alpes a Trajano no golfo Pérsico. Abra um general para seguir sua rota parada a parada; arraste a linha do tempo e ligue a camada política para ver as fronteiras de cada ano."));
  return f;
}

function renderList() {
  panel.innerHTML = ""; panel.append(header());
  const chips = el("div", "chips");
  for (const c of DATA.eras) {
    const b = el("button", "chip"); b.style.setProperty("--c", c.cor); b.setAttribute("aria-pressed", state.filter.has(c.id));
    b.append(el("i"), document.createTextNode(c.curto));
    b.onclick = () => {
      if (state.filter.has(c.id) && state.filter.size === DATA.eras.length) state.filter = new Set([c.id]);
      else if (state.filter.has(c.id)) { state.filter.delete(c.id); if (!state.filter.size) state.filter = new Set(DATA.eras.map(x => x.id)); }
      else state.filter.add(c.id);
      renderList(); draw();
    };
    chips.append(b);
  }
  panel.append(chips);
  for (const c of DATA.eras) {
    if (!state.filter.has(c.id)) continue;
    const g = el("section", "group"); g.style.setProperty("--c", c.cor);
    const h = el("h2"); h.append(document.createTextNode(c.nome), el("small", null, c.anos)); g.append(h);
    for (const m of GENS.filter(x => x.era === c.id)) {
      const b = el("button", "myth"); b.dataset.id = m.id; b.style.setProperty("--c", m.cor);
      const nb = m.paradas.filter(p => p.batalha).length;
      b.append(el("span", "bar"), el("span", "mt", m.nome), el("span", "mc", m.vida), el("span", "ml", m.papel + ` · ${m.paradas.length} paradas · ${nb} batalhas`),
        el("span", "mr", [...new Set(m.paradas.map(p => p.nome))].slice(0, 5).join(" → ")));
      b.onclick = () => openMyth(m.id);
      g.append(b);
    }
    panel.append(g);
  }
  panel.append(el("p", "srcnote", "Mapa-base: litoral e rios do Natural Earth; relevo real no Mediterrâneo central (AWS Terrain Tiles) e esquemático no resto. Fronteiras históricas aproximadas, desenhadas a partir de atlas de referência e recortadas pelo litoral moderno. Coordenadas de batalhas debatidas seguem a hipótese mais citada e vêm marcadas na ficha. Narrativas baseadas em Políbio, Lívio, Plutarco, César, Suetônio, Tácito e Dião Cássio."));
  updateTimeline();
}

function renderDetail() {
  const m = state.myth, era = ERAS[m.era];
  panel.innerHTML = "";
  const d = el("div", "detail"); d.style.setProperty("--c", m.cor);
  const back = el("button", "back", "← Todos os generais"); back.onclick = () => closeMyth();
  const cyc = el("div", "cyc"); cyc.append(el("i"), document.createTextNode(era.nome + " · " + m.vida));
  d.append(back, cyc, el("h1", null, m.nome), el("div", "latin", m.latim), el("div", "role", m.papel), el("p", "sum", m.resumo), el("div", "src", m.fontes.join(" · ")));
  if (m.rivais && m.rivais.length) {
    const rv = el("div", "rivals"); rv.append(document.createTextNode("Cruza com"));
    for (const id of m.rivais) { const g = GENS.find(x => x.id === id); if (!g) continue; const b = el("button"); b.style.setProperty("--c", g.cor); b.append(el("i"), document.createTextNode(g.nome)); b.onclick = () => openMyth(g.id); rv.append(b); }
    d.append(rv);
  }
  const ctr = el("div", "controls"); ctr.id = "controls"; d.append(ctr);
  const ol = el("ol", "stops"); ol.id = "stops";
  m.paradas.forEach((p, i) => {
    const li = el("li", "stop" + (p.batalha ? " bt" : "")); li.tabIndex = 0;
    li.style.setProperty("--c", m.cor);
    li.append(el("div", "sn", p.nome));
    const sm = el("div", "sm"); sm.append(el("b", null, p.tempo), document.createTextNode(" · " + p.moderno)); li.append(sm);
    const st = el("div", "st");
    String(p.texto).split(/\n\n+/).forEach(t => st.append(el("p", null, t)));
    if (p.batalha) {
      const B = p.batalha, bx = el("div", "bat");
      const bh = el("div", "bh"); bh.append(document.createTextNode("Batalha"), el("b", null, B.tipo)); bx.append(bh);
      const dl = el("dl");
      for (const [k, v] of [["Vencedor", B.vencedor], ["Forças", B.forcas], ["Baixas", B.baixas]]) dl.append(el("dt", null, k), el("dd", null, v));
      bx.append(dl);
      if (B.diagrama) { const dg = buildDiagram(B.diagrama); if (dg) bx.append(dg); }
      st.append(bx);
    }
    if (p.sentido) st.append(el("p", "mean", p.sentido));
    if (p.hoje) { const hj = el("p", "today"); hj.append(el("b", null, "Hoje "), document.createTextNode(p.hoje)); st.append(hj); }
    const meta = el("div", "meta");
    if (p.certeza) meta.append(el("span", "cert", p.certeza));
    if (p.ref) meta.append(el("span", "ref", p.ref));
    if (meta.childNodes.length) st.append(meta);
    li.append(st, el("div", "co", `${Math.abs(p.lat).toFixed(2)}° ${p.lat >= 0 ? "N" : "S"} · ${Math.abs(p.lon).toFixed(2)}° ${p.lon >= 0 ? "L" : "O"}`));
    li.onclick = () => { if (i === state.cur) return; stopPlay(); goTo(i, i === state.cur + 1); };
    li.onkeydown = e => { if (e.target === li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); stopPlay(); goTo(i, i === state.cur + 1); } };
    ol.append(li);
  });
  d.append(ol);
  panel.append(d); panel.scrollTop = 0;
  renderControls(); renderStopsState();
}
function renderControls() {
  const ctr = document.getElementById("controls"); if (!ctr) return;
  const m = state.myth, end = state.cur >= m.paradas.length - 1;
  ctr.innerHTML = "";
  const mk = (cls, icon, label, fn) => { const b = el("button", "cbtn " + cls); b.innerHTML = icon; b.setAttribute("aria-label", label); b.onclick = fn; return b; };
  ctr.append(
    mk("", ICON.prev, "Parada anterior", () => { stopPlay(); goTo(state.cur - 1, false); }),
    mk("play", state.playing ? ICON.pause : (end ? ICON.restart : ICON.play), state.playing ? "Pausar" : (end ? "Recomeçar" : "Reproduzir campanha"), togglePlay),
    mk("", ICON.next, "Próxima parada", () => { stopPlay(); goTo(state.cur + 1); })
  );
  const p = m.paradas[state.cur];
  const pr = el("span", "prog", `${String(state.cur + 1).padStart(2, "0")} / ${String(m.paradas.length).padStart(2, "0")} · ${p.tempo}`); ctr.append(pr);
}
function renderStopsState() {
  const ol = document.getElementById("stops"); if (!ol) return;
  [...ol.children].forEach((li, i) => { li.classList.toggle("cur", i === state.cur); li.classList.toggle("done", i < state.cur); });
  const cur = ol.children[state.cur];
  if (cur) {
    const pr = panel.getBoundingClientRect(), r = cur.getBoundingClientRect();
    if (r.top < pr.top + 70 || r.top > pr.bottom - 120) panel.scrollTo({ top: panel.scrollTop + r.top - pr.top - 90, behavior: reduce ? "auto" : "smooth" });
  }
  renderControls();
}
function togglePlay() {
  const m = state.myth;
  if (state.playing) return stopPlay();
  state.playing = true;
  if (state.cur >= m.paradas.length - 1) { state.cur = 0; state.seg = 1; setYear(m.paradas[0].ano, true); renderStopsState(); fitPoints(m.paradas); setTimeout(() => goTo(1), 1000 / speed); }
  else goTo(state.cur + 1);
  renderControls(); renderSweep();
}
function stopPlay() { state.playing = false; clearTimeout(playTimer); renderControls(); try { renderSweep(); } catch (e) {} }

function openMyth(id, fromHash = false) {
  const m = GENS.find(x => x.id === id); if (!m) return;
  stopPlay(); stopSweep();
  state.myth = m; state.cur = 0; state.seg = 1;
  renderDetail(); fitPoints(m.paradas); setYear(m.paradas[0].ano, true); updateTimeline();
  if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function closeMyth() {
  stopPlay(); state.myth = null;
  renderList(); fitAll(); draw();
  history.replaceState(null, "", location.pathname + location.search);
}
const CORE = [{ lon: -1.5, lat: 35.2 }, { lon: 26.5, lat: 46.0 }];
function fitAll(animate = true) { fitPoints(CORE, .98, animate); }
function fitEverything() {
  const pts = (state.myth ? state.myth.paradas : visibleMyths().flatMap(m => m.paradas));
  fitPoints(pts.length ? pts : CORE, .92, true);
}

/* clique no mapa */
let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("click", e => {
  if ((downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) || (T3 && T3.dragged())) return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 14;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } }
  if (!best) return;
  if (!state.myth) { openMyth(best.myth.id); setTimeout(() => goTo(best.i, false), 50); }
  else { stopPlay(); goTo(best.i, best.i === state.cur + 1); }
});
for (const bt of document.querySelectorAll(".layers .seg button")) bt.onclick = () => setBlend(+bt.dataset.v / 100);
document.getElementById("blend").addEventListener("input", e => setBlend(+e.target.value / 100));
document.getElementById("zin").onclick = () => zoomBy(1.6);
document.getElementById("zout").onclick = () => zoomBy(1 / 1.6);
document.getElementById("zall").onclick = () => fitEverything();
function zoomBy(f) { if (T3) T3.zoomBy(f); }
document.addEventListener("keydown", e => {
  if (!state.myth || e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") { stopPlay(); goTo(state.cur + 1); }
  if (e.key === "ArrowLeft") { stopPlay(); goTo(state.cur - 1, false); }
});

/* ---------- mapa-base (contornos de terra) ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function loadLand() {
  const srcs = [
    "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.hires.min.js",
    "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.hires.min.js",
    "https://unpkg.com/datamaps@0.5.9/dist/datamaps.world.hires.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"
  ];
  for (const s of srcs) {
    try {
      await loadScript(s);
      const D = window.Datamap || window.Datamaps;
      const topo = D && D.prototype && D.prototype.worldTopo;
      if (topo && topo.objects) {
        const obj = topo.objects[Object.keys(topo.objects)[0]];
        land = topojson.merge(topo, obj.geometries);
        if (T3) T3.setLand(land);
        coast = topojson.mesh(topo, obj, (a, b) => a === b);
        countries = topojson.feature(topo, obj).features;
        borders = topojson.mesh(topo, obj, (a, b) => a !== b);
        ensureRasters();
        baseKey = ""; draw(); return;
      }
    } catch (e) { /* tenta o próximo */ }
  }
  if (T3) T3.setLand(null);
  const n = document.getElementById("notice");
  n.textContent = "Não foi possível carregar o contorno dos continentes. As rotas e os lugares continuam disponíveis sobre a grade de coordenadas.";
  n.hidden = false;
}

/* ---------- início ---------- */
function boot() {
  resize();
  T3 = Atlas3D.create({
    host: wrap, bounds: [-10, 29.5, 48.5, 52],
    dem: GEO.dem, terr: TERR, waitLand: true, lakes: GEO.lakes,
    worldBounds: [-16, 24, 54, 58], atlasBlend: false, paintTexture: paintPoliticsTex,
    rivers: GEO.rivers.map(r => ({ sr: r.w >= 1.3 ? 8 : r.w >= 1 ? 10 : 11, pts: r.pts })),
    graticule: 5, exag: 24, tilt: 50,
    onFrame: info => {
      K3 = (87.7 / info.kmPerPx) * 180 / Math.PI;
      const cp = document.querySelector("#z-north svg"); if (cp) cp.style.transform = `rotate(${(-info.head).toFixed(3)}rad)`;
      const tb = document.getElementById("z-tilt"); if (tb) { tb.textContent = info.tilt < .15 ? "3D" : "2D"; tb.setAttribute("aria-label", info.tilt < .15 ? "Inclinar a vista em 3D" : "Ver de cima"); }
      draw();
    }
  });
  document.getElementById("z-north").onclick = () => T3.setView({ h: 0 });
  document.getElementById("z-tilt").onclick = () => T3.setView({ t: T3.view().t < .15 ? 50 * Math.PI / 180 : 0 }, 700);
  const exagIn = document.getElementById("exag"), exagTxt = document.getElementById("exagtxt"), vegBtn = document.getElementById("veg");
  let exagRaf = 0;
  exagIn.addEventListener("input", () => { exagTxt.textContent = "×" + exagIn.value; cancelAnimationFrame(exagRaf); exagRaf = requestAnimationFrame(() => T3.setExag(+exagIn.value)); });
  vegBtn.onclick = () => { const on = vegBtn.getAttribute("aria-pressed") !== "true"; vegBtn.setAttribute("aria-pressed", on); T3.setVegetation(on); };
  readColors(); buildTimeline(); setBlend(state.blend, false);
  const id = location.hash.slice(1);
  if (id && GENS.some(m => m.id === id)) {
    const m = GENS.find(x => x.id === id);
    state.myth = m; state.year = state.yearInt = m.paradas[0].ano; renderDetail(); fitPoints(m.paradas, .82, false);
  } else { renderList(); fitAll(false); }
  updateTimeline();
  requestAnimationFrame(loop);
  loadLand();
  document.fonts && document.fonts.ready.then(() => { baseKey = ""; draw(); });
}
window.addEventListener("resize", () => { const s = proj.scale(), t = proj.translate(), ow = W, oh = H; resize(); setView(s, [t[0] + (W - ow) / 2, t[1] + (H - oh) / 2]); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== state.myth?.id) openMyth(id, true); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
boot();
renderSweep();

</script>
