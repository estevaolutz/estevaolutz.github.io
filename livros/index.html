<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<title>Coleções — Livros</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: livraria de bairro no fim da tarde — calma, precisa, sem pressa
   IDEA: a prateleira — lombadas, capas inclinando, o marcador de fita
   PICTURE: a própria estante de capas; vazio = uma pilha de livros desenhada
   COLOUR: papel creme, tinta escura, vinho de encadernação, dourado de título como apoio
   TYPE/LAYOUT: Fraunces nos títulos, Inter no texto; barra, estante em grade 2:3, folhas de baixo */
:root{color-scheme:light dark;--bg:light-dark(#f6f1e7,#14110e);--card:light-dark(#fffdf8,#1e1a16);--ink:light-dark(#1b1712,#f1ebdf);--mut:light-dark(#6b6253,#a99f8e);--line:light-dark(#e2dacb,#342e27);--ac:light-dark(#8f1d2c,#e0566a);--acf:#8f1d2c;--ou:light-dark(#8a6a12,#d8b44a);--sh:0 1px 2px rgb(0 0 0/.10),0 10px 24px rgb(40 20 0/.16)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(4vw,14px) 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:30px;font-style:italic}
.brand small{color:var(--mut);font-size:14px}
.brand a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:8px 13px;border-radius:9px;min-height:40px;color:var(--mut);font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tools{margin-top:10px}
.in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.in:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grow{flex:1 1 200px}
main{padding:18px max(4vw,14px);max-width:1240px;margin:0 auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 20px}
.rec{background:none;border:0;padding:0;text-align:left;display:block;width:100%;perspective:700px}
.cov{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:var(--sh);background:var(--c,#7a1f2b);transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-origin:left center}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(0 0 0/.28) 0,rgb(255 255 255/.16) 2.5%,rgb(0 0 0/.06) 5%,transparent 9%);pointer-events:none}
.rec:hover .cov,.rec:focus-visible .cov{transform:rotateY(-14deg) translateY(-3px)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14% 12% 12% 16%;color:#f4ead2;border:0}
.ph b{font:700 17px/1.15 Fraunces,Georgia,serif;overflow-wrap:anywhere}
.ph small{font-size:12px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.ph::before{content:"";position:absolute;left:16%;right:12%;top:8%;border-top:1px solid rgb(216 180 74/.7)}
.bdg{position:absolute;right:5px;bottom:5px;display:flex;gap:3px;z-index:2}
.bdg i{font:600 10px/1 Inter,sans-serif;font-style:normal;background:rgb(20 17 14/.82);color:#f4ead2;padding:4px 5px;border-radius:4px;letter-spacing:.03em}
.bdg i.k{background:#ff9900;color:#111}
.fita{position:absolute;top:-2px;right:14%;width:12px;height:30%;background:var(--acf);z-index:2;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);box-shadow:0 1px 3px rgb(0 0 0/.3)}
.rec b{display:block;margin-top:10px;font:600 15px/1.25 Fraunces,Georgia,serif}
.rec span{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center;padding:30px 0}
.empty h2{font-size:clamp(34px,6vw,52px)}
.empty p{color:var(--mut);max-width:46ch}
.pilha{display:grid;justify-items:center;gap:0;max-width:380px;width:100%;margin:auto;padding-top:20px}
.pilha div{height:46px;border-radius:3px;box-shadow:0 3px 8px rgb(0 0 0/.25);position:relative}
.pilha div::after{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid rgb(216 180 74/.75)}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--acf);color:#fff;border-radius:999px;padding:16px 24px;font:700 18px/1 Fraunces,Georgia,serif;box-shadow:0 10px 30px rgb(143 29 44/.45);display:flex;gap:10px;align-items:center;min-height:56px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ac{background:var(--acf);color:#fff;border-color:var(--acf)}
.btn.k{background:#ff9900;color:#111;border-color:#ff9900}
.btn.lk{border:0;background:none;color:var(--ou);padding:10px 4px}
.btn:disabled{opacity:.5;cursor:default}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgb(0 0 0/.55)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.pan{background:var(--bg);width:min(780px,100%);max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) calc(24px + env(safe-area-inset-bottom));animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}}
@media(min-width:800px){.sheet.on{align-items:center}.pan{border-radius:18px}}
.ph-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph-h h2{font-size:28px;margin-right:auto}
.x{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1;flex:none}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px 12px;text-align:center;display:grid;gap:5px;place-items:center;min-height:140px;background:var(--card);position:relative;width:100%}
.drop:hover{border-color:var(--ac)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop b{font:700 18px/1.15 Fraunces,Georgia,serif}
.drop span{color:var(--mut);font-size:14px;line-height:1.35}
.note{color:var(--mut);font-size:14px}
.st{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:10px 0;font-size:15px}
.st.err{border-color:var(--ac)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.prev{display:flex;gap:12px;align-items:center;margin:12px 0}
.prev img{width:64px;height:96px;object-fit:cover;border-radius:3px}
.cands{display:grid;gap:8px;margin:12px 0}
.cand{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;width:100%}
.cand:hover{border-color:var(--ac)}
.cand .mini{width:52px;flex:none}
.cand .mini .cov{box-shadow:0 1px 3px rgb(0 0 0/.3)}
.cand .mini .ph{padding:8%}.cand .mini .ph b{font-size:9px}.cand .mini .ph small{display:none}
.cand b{display:block;line-height:1.25;font-family:Fraunces,Georgia,serif}
.cand span{color:var(--mut);font-size:14px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.det{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:22px;align-items:start}
.det h2{font-size:clamp(28px,5vw,40px)}
.det .sub{font-family:Fraunces,Georgia,serif;font-size:18px;color:var(--mut);margin:4px 0 0}
.det .who{font-size:18px;font-weight:600;margin:6px 0 2px}
.stars{display:flex;gap:2px;margin:4px 0 8px}
.stars button{border:0;background:none;font-size:26px;line-height:1;padding:4px 2px;color:var(--line);min-width:34px;min-height:40px}
.stars button.on{color:var(--ou)}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:14px 0}
.plat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-decoration:none;font-weight:600;min-height:48px;font-size:15px}
.plat i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgb(127 127 127/.5)}
.plat:hover{border-color:var(--ink)}
.blk{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.blk h3{font-size:21px}
.arqs{display:grid;gap:8px}
.arq{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.arq .ext{font:700 12px/1 Inter,sans-serif;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 7px;flex:none}
.arq .nm{flex:1 1 160px;overflow-wrap:anywhere;font-size:15px}
.arq .nm small{display:block;color:var(--mut);font-size:13px}
.dest{display:grid;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
.dest blockquote{margin:0;border-left:3px solid var(--ou);padding:4px 0 4px 12px;font-family:Fraunces,Georgia,serif;font-size:16px;line-height:1.5}
.dest blockquote small{display:block;font:13px/1.3 Inter,sans-serif;color:var(--mut);margin-top:4px}
.sin{font-size:15px;color:var(--mut);margin:10px 0}
.sin summary{cursor:pointer;color:var(--ink);font-weight:600}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label.f .in{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.form .w{grid-column:1/-1}
.lists{display:grid;gap:10px}
.list{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;width:100%;text-align:left}
.stack4{display:flex;gap:3px;width:92px;flex:none}
.stack4 .cov{flex:1;box-shadow:0 1px 3px rgb(0 0 0/.3)}
.stack4 .ph{padding:6%}.stack4 .ph b,.stack4 .ph small{display:none}
.list h3{font-size:22px}
.list span{color:var(--mut);font-size:14px}
.set{display:grid;gap:14px;max-width:680px}
.set section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.set h3{font-size:22px;margin-bottom:6px}
.set p,.set li{margin:.4em 0;color:var(--mut);font-size:15px}
.set ol{padding-left:20px;margin:8px 0}
.lote{display:grid;gap:6px;margin:10px 0;max-height:52dvh;overflow:auto}
.lote label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px}
.lote label input{width:20px;height:20px;flex:none;accent-color:var(--acf)}
.lote label span{flex:1}
.lote label small{color:var(--mut);font-size:13px;display:block}
.lote label em{font-style:normal;font-size:13px;color:var(--mut);flex:none;max-width:45%;text-align:right}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:58dvh;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;left:12%;right:12%;top:36%;bottom:36%;border:3px solid rgb(255 255 255/.9);border-radius:10px;box-shadow:0 0 0 999px rgb(0 0 0/.35)}
.mira::after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid #ff3b3b;animation:pisca 1.2s ease-in-out infinite}
@keyframes pisca{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;display:none;max-width:90vw}
.cnt{color:var(--mut);font-size:14px;margin:0 0 14px}
code{overflow-wrap:anywhere;font-size:13px}
/* leitor */
#sLer .pan{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));animation:none}
#sLer .ph-h{margin-bottom:6px;flex-wrap:wrap}
#sLer .ph-h h2{font-size:18px;flex:1 1 160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sLer select{max-width:220px}
.lerw{position:relative;flex:1;display:flex;align-items:stretch;gap:4px}
#leitor{flex:1;background:var(--card);border-radius:8px;overflow:hidden}
.vira{border:0;background:none;width:44px;flex:none;font-size:28px;color:var(--mut);border-radius:8px}
.vira:hover{background:var(--card)}
@media(max-width:600px){.brand h1{font-size:26px}.shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}.rec b{font-size:14px}.rec span{font-size:13px}.ph b{font-size:13px}.empty,.det{grid-template-columns:minmax(0,1fr)}.det>div:first-child{max-width:170px}.form{grid-template-columns:minmax(0,1fr)}.tabs{width:100%}.tabs button{flex:1;padding:8px 6px}.fab span{display:none}.fab{padding:16px 20px}.vira{width:30px}}
@media(max-width:600px){.drop{min-height:120px;padding:14px 8px}.drop b{font-size:16px}.drop span{font-size:13px}}
@media(max-width:400px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:330px){.pick{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.guia{scroll-margin-top:130px}.guia details{border-top:1px solid var(--line);padding:10px 0}.guia details:last-child{padding-bottom:0}.guia summary{cursor:pointer;font-weight:600;color:var(--ink)}.guia ol,.guia ul{padding-left:22px;margin:8px 0}.guia li{margin:6px 0;line-height:1.45}.guia code{font-family:ui-monospace,monospace;background:color-mix(in srgb,var(--line) 60%,transparent);padding:1px 5px;border-radius:5px}.guia a{word-break:break-all}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><h1>Livros</h1><small id="sub">Coleções</small><a href="../colecoes/" title="Coleção de discos de vinil">Vinis ↗</a></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="estante" aria-selected="true">Estante</button>
      <button role="tab" data-v="listas" aria-selected="false">Listas</button>
      <button role="tab" data-v="kindle" aria-selected="false">Kindle</button>
      <button role="tab" data-v="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </div>
  <div class="row tools" id="tools">
    <input class="in grow" id="q" type="search" placeholder="Buscar título, autor, editora, ISBN…" aria-label="Buscar na coleção">
    <select class="in" id="st" aria-label="Filtro">
      <option value="">Todos</option><option value="lendo">Lendo</option><option value="quero">Quero ler</option><option value="lido">Lidos</option><option value="abandonado">Abandonados</option>
      <option value="arquivo">Com .epub/.pdf</option><option value="kindle">No Kindle</option><option value="fisico">Só os de papel</option><option value="emprestado">Emprestados</option>
    </select>
    <select class="in" id="ord" aria-label="Ordem">
      <option value="recentes">Mais recentes</option><option value="autor">Autor</option><option value="titulo">Título A–Z</option><option value="ano">Ano</option><option value="nota">Nota</option>
    </select>
    <select class="in" id="flt" aria-label="Lista"><option value="">Todas as listas</option></select>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab" type="button" aria-label="Adicionar livro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg><span>Adicionar livro</span></button>

<div class="sheet" id="sAdd" role="dialog" aria-modal="true" aria-labelledby="tAdd"><div class="pan">
  <div class="ph-h"><h2 id="tAdd">Novo livro</h2><button class="x" data-close aria-label="Fechar">×</button></div>
  <div id="addBody"></div>
</div></div>

<div class="sheet" id="sDet" role="dialog" aria-modal="true"><div class="pan"><div class="ph-h"><span style="margin-right:auto"></span><button class="x" data-close aria-label="Fechar">×</button></div><div id="detBody"></div></div></div>

<div class="sheet" id="sLer" role="dialog" aria-modal="true"><div class="pan">
  <div class="ph-h"><h2 id="lerT"></h2><select class="in" id="lerToc" aria-label="Capítulos"></select><button class="btn" id="lerMenos" aria-label="Letra menor">A−</button><button class="btn" id="lerMais" aria-label="Letra maior">A+</button><button class="x" id="lerX" aria-label="Fechar">×</button></div>
  <div class="lerw"><button class="vira" id="lerAnt" aria-label="Página anterior">‹</button><div id="leitor"></div><button class="vira" id="lerProx" aria-label="Próxima página">›</button></div>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script src="../lib/colecoes-sync.js"></script>
<script>
{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u||'')?u:'';
const https=u=>u?String(u).replace(/^http:\/\//,'https://'):'';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const tituloBase=t=>norm(String(t||'').split(/[:–—]| - /)[0]);
const autorChave=a=>{const p=String(a||'').split(/,|;| e | and | & /)[0];const w=norm(p).split(' ').filter(Boolean);return w[w.length-1]||''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toast=(t,ms=2600)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)};
const tam=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const extDe=n=>(String(n).match(/\.(epub|pdf)$/i)||[,'arq'])[1].toUpperCase();
const hoje=()=>new Date().toISOString().slice(0,10);
const script=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('sem internet para carregar o leitor'));document.head.appendChild(s)});
const zipLib=async()=>{if(!window.JSZip)await script('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js')};
const baixar=(blob,nome)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)};
const LEIT={quero:'Quero ler',lendo:'Lendo',lido:'Lido',abandonado:'Abandonado'};
const FORMATOS=['Capa comum','Capa dura','Bolso','Box','Só digital','Kindle'];
const ESTADOS=['','Novo','Ótimo','Bom','Regular','Ruim'];
const CORES=['#7a1f2b','#1f4e3d','#23395b','#6b4f1d','#4a2c4f','#2f4f4f','#8a3b12','#3a3a3a','#5b2a1c','#1d3f5e'];

const P_CAPA=`Esta é a foto de um livro (pode ser a capa, a contracapa, a lombada ou a página de rosto). Identifique a obra e, se der, a edição.
Responda SOMENTE com JSON, sem texto fora dele, neste formato:
{"titulo":"","subtitulo":"","autor":"","editora":"","ano":"","isbn":"","idioma":"","confianca":0.0,"alternativas":[{"titulo":"","autor":""}]}
Escreva o título como está impresso no livro (na língua da edição). Se o ISBN estiver visível, copie só os dígitos. "confianca" vai de 0 a 1. Até 3 alternativas.`;
const P_ESTANTE=`Esta é a foto de uma estante, prateleira ou pilha de livros. Leia todas as lombadas e capas legíveis e liste cada livro.
Responda SOMENTE com JSON, sem texto fora dele, neste formato:
{"livros":[{"titulo":"","autor":""}]}
Siga a ordem da esquerda para a direita, de cima para baixo. Escreva o título como está impresso. Se não der para ler o autor, deixe vazio. Não invente livros que não dá para ler.`;
const CAMPOS_IA=['titulo','subtitulo','autor','editora','ano','isbn','idioma','confianca'];
function pegaJSON(t){t=String(t||'').replace(/```(?:json)?/gi,'').trim();
  const a=t.indexOf('['),i=t.indexOf('{');if(i<0)return null;
  if(a>=0&&a<i){const f=t.lastIndexOf(']');if(f>a){try{const v=JSON.parse(t.slice(a,f+1));if(Array.isArray(v)&&v[0]&&typeof v[0]==='object')return v[0]}catch(e){}}}
  const s=t.slice(i),j=s.lastIndexOf('}');if(j>=0){try{return JSON.parse(s.slice(0,j+1))}catch(e){}}
  /* resposta cortada no meio: resgata os campos que vieram inteiros */
  const o={};for(const k of CAMPOS_IA){const m=s.match(new RegExp('"'+k+'"\\s*:\\s*("(?:[^"\\\\]|\\\\.)*"|-?[0-9.]+)'));if(m){try{o[k]=JSON.parse(m[1])}catch(e){}}}
  return Object.keys(o).length?o:null}
function motivoVazio(d){const f=d.candidates?.[0]?.finishReason||d.promptFeedback?.blockReason||d.stop_reason||'';
  if(/RECITATION/i.test(f))return 'o Gemini se recusou a transcrever a capa ou as lombadas (bloqueio de “recitação”)';
  if(/SAFETY|PROHIBITED|BLOCK|refusal/i.test(f))return 'o filtro de segurança da IA bloqueou essa foto';
  if(/MAX_TOKENS|max_tokens/i.test(f))return 'a resposta da IA veio cortada';
  return 'a IA respondeu sem os dados do livro'+(f?' ('+f+')':'')}
async function identificarIA(b64,prompt,max=800){
  if(AJ.ia==='gemini'){const modelos=[AJ.modelo,'gemini-flash-latest','gemini-3.6-flash','gemini-3.5-flash','gemini-2.5-flash'].filter(Boolean);let ult='';
    for(const m of [...new Set(modelos)]){const r=await timeoutFetch(`https://generativelanguage.googleapis.com/v1beta/models/${E(m)}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':AJ.chave},
      body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.2}})},60000);
      if(r.status===404){ult='modelo '+m+' não encontrado';continue}
      const d=await r.json();if(!r.ok)throw new Error(d.error?.message||('erro '+r.status));
      const j=pegaJSON((d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''));if(j)return j;ult=motivoVazio(d)}
    throw new Error(ult)}
  if(AJ.ia==='anthropic'){const modelos=[AJ.modelo,'claude-haiku-5-5','claude-sonnet-5-5'].filter(Boolean);let ult='';
    for(const m of [...new Set(modelos)]){const r=await timeoutFetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AJ.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:m,max_tokens:max,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})},60000);
      const d=await r.json();if(r.status===404||d.error?.type==='not_found_error'){ult='modelo '+m+' não encontrado';continue}
      if(!r.ok)throw new Error(d.error?.message||('erro '+r.status));
      const j=pegaJSON((d.content||[]).map(p=>p.text||'').join(''));if(j)return j;ult=motivoVazio(d)}
    throw new Error(ult)}
  return null}

/* ---------- arquivos .epub / .pdf ---------- */
async function metaEpub(file){await zipLib();const z=await JSZip.loadAsync(file);const cont=await z.file('META-INF/container.xml')?.async('text');if(!cont)return{};
  const X=t=>new DOMParser().parseFromString(t,'application/xml');const path=X(cont).querySelector('rootfile')?.getAttribute('full-path');if(!path||!z.file(path))return{};
  const opf=X(await z.file(path).async('text'));const dir=path.includes('/')?path.replace(/[^/]*$/,''):'';
  const tag=n=>[...opf.getElementsByTagNameNS('*',n)].map(e=>e.textContent.trim()).filter(Boolean);
  const ids=tag('identifier').join(' ').replace(/-/g,'');const isbn=isbn13((ids.match(/97[89]\d{10}/)||ids.match(/\b\d{9}[\dX]\b/)||[])[0]);
  const man=[...opf.getElementsByTagNameNS('*','item')];const cid=[...opf.getElementsByTagNameNS('*','meta')].find(m=>m.getAttribute('name')==='cover')?.getAttribute('content');
  const it=man.find(i=>(i.getAttribute('properties')||'').includes('cover-image'))||man.find(i=>i.getAttribute('id')===cid)||man.find(i=>/cover/i.test(i.getAttribute('id')+i.getAttribute('href'))&&/image/.test(i.getAttribute('media-type')||''));
  let capaLocal='';if(it){const f=z.file(decodeURIComponent(dir+it.getAttribute('href')));if(f){try{const b=await f.async('blob');capaLocal=mini(await lerImagem(new Blob([b],{type:it.getAttribute('media-type')||'image/jpeg'}),900),480)}catch(e){}}}
  return{titulo:tag('title')[0]||'',autor:tag('creator').join(', '),isbn,idioma:tag('language')[0]||'',editora:tag('publisher')[0]||'',capaLocal}}
function metaNome(file){const base=file.name.replace(/\.(pdf|epub)$/i,'').replace(/[_+]+/g,' ').replace(/\s+/g,' ').trim();const isbn=isbn13((base.replace(/-/g,'').match(/97[89]\d{10}/)||[])[0]);
  return{titulo:base.replace(/\b97[89][\d-]{10,14}\b/,'').trim(),autor:'',isbn}}
async function metaArquivo(file){if(/\.epub$/i.test(file.name)||file.type==='application/epub+zip'){try{const m=await metaEpub(file);if(m.titulo)return m}catch(e){}}return metaNome(file)}

const KBM=`(async()=>{const H=location.host;if(!/amazon\\./.test(H)){alert('Abra read.amazon.com/kindle-library (ou ler.amazon.com.br) com a sua conta e clique de novo.');return}let o=[],t='';try{for(let i=0;i<100;i++){const r=await fetch('/kindle-library/search?query=&libraryType=BOOKS&sortType=recency&querySize=50'+(t?'&paginationToken='+encodeURIComponent(t):''),{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();o.push(...(d.itemsList||[]).map(x=>({asin:x.asin,titulo:x.title,autores:x.authors,capa:x.productUrl,lido:x.percentageRead,url:x.webReaderUrl})));t=d.paginationToken;if(!t)break}}catch(e){alert('Não consegui ler a biblioteca do Kindle ('+e.message+'). Abra '+H+'/kindle-library com a conta aberta e tente de novo.');return}const b=new Blob([JSON.stringify({app:'colecoes-livros-kindle',host:H,data:new Date().toISOString(),itens:o})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kindle-biblioteca.json';document.body.appendChild(a);a.click();alert(o.length+' livros do Kindle salvos em kindle-biblioteca.json. Volte ao app Livros e toque em Importar.')})()`;
const autorK=a=>(Array.isArray(a)?a:[a]).flatMap(x=>String(x||'').split(':')).map(x=>x.trim()).filter(Boolean).map(x=>x.includes(',')?x.split(',').map(s=>s.trim()).reverse().join(' '):x).join(', ');
const casa=(x,t,a)=>tituloBase(x.titulo)===tituloBase(t)&&(!autorChave(a)||!autorChave(x.autor)||autorChave(x.autor)===autorChave(a));

async function importarKindle(d){const host=/^[a-z.]*amazon\.[a-z.]+$/.test(d.host||'')?d.host:'read.amazon.com';let ligados=0;const novos=[];
  for(const x of d.itens){if(!x||!x.asin)continue;const k={asin:String(x.asin),host,url:safeUrl(x.url)};const t=String(x.titulo||'');const a=autorK(x.autores);

    novos.push({titulo:t,autor:a,capa:safeUrl(x.capa),kindle:k,lido:+x.lido||0})}
  AJ.kindleData=new Date().toLocaleDateString('pt-BR');saveAJ();await load();
  PEND=novos.length?{origem:'kindle',itens:novos,msg:`${ligados?ligados+' livros da coleção ligados ao Kindle. ':''}${novos.length} livros do Kindle ainda não estão na coleção. Marque os que quer adicionar:`}:null;
  toast(`${d.itens.length} livros lidos do Kindle · ${ligados} ligados à coleção`,4500);render()}
function lerClippings(txt){const out=[];for(const bl of txt.replace(/\r/g,'').replace(/﻿/g,'').split('==========')){const L=bl.split('\n').map(s=>s.trim());while(L.length&&!L[0])L.shift();if(L.length<3)continue;
  const cab=L[0];const meta=L[1].replace(/^-\s*/,'');const texto=L.slice(2).join('\n').trim();if(!texto)continue;const m=cab.match(/^(.*)\(([^()]*)\)\s*$/);
  out.push({titulo:(m?m[1]:cab).trim(),autor:m?autorK(m[2]):'',meta,texto,nota:/^(sua nota|your note|nota)/i.test(meta)})}return out}
async function importarClippings(txt){const cl=lerClippings(txt);if(!cl.length)return toast('Não achei destaques nesse arquivo',4000);
  const grupos=new Map();for(const c of cl){const k=tituloBase(c.titulo)+'|'+autorChave(c.autor);if(!grupos.has(k))grupos.set(k,{titulo:c.titulo,autor:c.autor,destaques:[]});grupos.get(k).destaques.push({texto:c.texto,meta:c.meta,nota:c.nota})}
  let n=0,lv=0;const novos=[];
  for(const g of grupos.values()){const l=LIVROS.find(y=>casa(y,g.titulo,g.autor));if(!l){novos.push(g);continue}
    const ja=new Set((l.destaques||[]).map(x=>x.texto));const add=g.destaques.filter(x=>!ja.has(x.texto));if(add.length){l.destaques=[...(l.destaques||[]),...add];await salvar(l);n+=add.length;lv++}}
  await load();PEND=novos.length?{origem:'clip',itens:novos,msg:`${n} destaques novos em ${lv} livros. ${novos.length} livros com destaques ainda não estão na coleção — marque os que quer adicionar (com os destaques):`}:null;
  toast(`${n} destaques novos em ${lv} livros`,4000);render()}
function mostrarPend(){const B=$('#kPend');if(!B)return;const P=PEND;
  B.innerHTML=`<p style="color:var(--ink)">${esc(P.msg)}</p><div class="lote">${P.itens.map((x,i)=>`<label><input type="checkbox" data-i="${i}" checked><span>${esc(x.titulo)}<small>${esc(x.autor)}${x.destaques?' · '+x.destaques.length+' destaques':''}</small></span></label>`).join('')}</div>
  <div class="row"><button class="btn" id="pTog">Desmarcar todos</button><button class="btn ac" id="pAdd">Adicionar à coleção</button><button class="btn lk" id="pX">Agora não</button></div>`;

function vistaAjustes(M){
  M.innerHTML=`<div class="set">
  <section><h3>Reconhecimento pela foto</h3><p>A IA olha a foto da capa, da lombada ou de uma prateleira inteira e diz quais livros são. A chave fica só neste aparelho e vai direto para o serviço escolhido. Se você já colou a chave no app dos Vinis, ela vem para cá sozinha.</p>
    <div class="form"><label class="f">Serviço<select class="in" id="aIa"><option value="">Nenhum (só código de barras e nome)</option><option value="gemini">Google Gemini — tem plano gratuito</option><option value="anthropic">Anthropic (Claude) — pago por uso</option></select></label>
    <label class="f">Modelo (opcional)<input class="in" id="aMod" placeholder="automático" value="${esc(AJ.modelo)}"></label>
    <label class="f w">Chave<input class="in" id="aKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="toque e segure aqui → Colar" value="${esc(AJ.chave)}" style="font-family:ui-monospace,monospace;font-size:15px"></label></div>
    <div class="row"><button class="btn pri" id="kCol" type="button">Colar a chave</button><button class="btn" id="kTes" type="button">Testar a chave</button></div>
    <p id="kSt" class="note" aria-live="polite"></p>
    <p>Ainda não tem chave? Veja o <a href="#guiaChave" data-guia>passo a passo logo abaixo</a> — com o Gemini é grátis e leva uns 2 minutos.</p></section>
    <section class="guia" id="guiaChave"><h3>Como criar a chave de IA — passo a passo</h3>
      <p>A chave é uma senha que deixa o app usar a IA do Google ou da Anthropic para reconhecer as capas. Você cria uma vez, cola aqui e pronto. A mesma chave serve para os Vinis e para os Livros.</p>
      <details open><summary>Qual escolher?</summary>
        <ul>
          <li><b>Google Gemini — recomendado.</b> Grátis, sem cartão de crédito, só precisa de uma conta Google (a do Gmail serve). O plano grátis tem um limite de uso por dia que dá folgado para fotografar a coleção; se passar, ele só pede para esperar até o dia seguinte. No plano grátis o Google pode usar o que é enviado para melhorar os produtos dele — para fotos de capas, não faz diferença.</li>
          <li><b>Anthropic (Claude).</b> Pago por uso, com créditos comprados antes (a partir de US$ 5). Cada foto custa uma fração de centavo de dólar. <b>Atenção:</b> a assinatura do app Claude (Pro/Max) não inclui a API — é uma conta e uma cobrança separadas.</li>
        </ul></details>
      <details><summary>Google Gemini (grátis) — 5 passos</summary>
        <ol>
          <li>Abra <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">https://aistudio.google.com/apikey</a> (funciona no celular ou no computador).</li>
          <li>Entre com sua conta Google. Na primeira vez aparece uma tela de termos: marque a caixa de concordância e toque em <b>Continuar</b>. Se pedir o país, escolha Brasil.</li>
          <li>Toque em <b>Create API key</b> (Criar chave de API). Se ele perguntar o projeto, escolha <b>Create API key in new project</b> (criar num projeto novo) ou o projeto que já aparecer. Em contas novas a chave às vezes já vem criada na lista (“Default Gemini API Key”) — pode usar essa.</li>
          <li>Copie a chave com o ícone de copiar ao lado dela. Ela começa com <code>AIza</code> e tem 39 caracteres.</li>
          <li>Volte para cá, toque em <b>Colar a chave</b> e depois em <b>Testar a chave</b>. Deve aparecer “✓ Chave funcionando”.</li>
        </ol>
        <p class="note">Não precisa ativar faturamento (“Billing”) nem cadastrar cartão. Sem cartão, nunca há cobrança.</p></details>
      <details><summary>Anthropic / Claude (pago) — 5 passos</summary>
        <ol>
          <li>Abra <a href="https://platform.claude.com" target="_blank" rel="noopener">https://platform.claude.com</a> (o antigo console.anthropic.com leva para lá) e crie a conta ou entre — dá para entrar com o Google.</li>
          <li>Compre créditos: vá em <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">Settings → Billing</a>, toque em <b>Buy credits</b>, cadastre o cartão e escolha o valor (US$ 5 dá para milhares de capas). Se não quiser cobranças automáticas, deixe a recarga automática (<i>auto-reload</i>) desligada.</li>
          <li>Vá em <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Settings → API keys</a> e toque em <b>Create key</b>. Dê um nome (por exemplo “Coleções”) e confirme.</li>
          <li>Copie a chave <b>na hora</b>: ela começa com <code>sk-ant-</code> e só é mostrada uma vez. Se perder, apague essa e crie outra.</li>
          <li>Volte para cá, toque em <b>Colar a chave</b> e depois em <b>Testar a chave</b>.</li>
        </ol></details>
      <details><summary>Se der erro</summary>
        <ul>
          <li><b>“A chave não é válida”</b> — quase sempre foi copiada pela metade ou com um espaço. Copie de novo pelo ícone de copiar e cole outra vez.</li>
          <li><b>“O Google bloqueou essa chave por segurança”</b> — a chave apareceu em algum lugar público e o Google a desligou. Crie uma nova no mesmo endereço. Nunca mande a chave por mensagem nem poste em lugar nenhum.</li>
          <li><b>“Muitos pedidos” / limite</b> — no Gemini grátis é o limite do dia ou do minuto. Espere um pouco; no dia seguinte volta.</li>
          <li><b>“Sem crédito”</b> (Anthropic) — o saldo acabou. Compre mais em Settings → Billing.</li>
          <li><b>O botão Colar não funciona</b> — alguns navegadores bloqueiam. Toque e segure dentro do campo Chave e escolha “Colar”.</li>
        </ul></details>
      <details><summary>Onde a chave fica guardada</summary>
        <p>Só neste aparelho e neste navegador. O app manda as fotos direto para o Google ou a Anthropic, sem passar por nenhum outro servidor. Em outro aparelho (celular e computador, por exemplo), cole a mesma chave nos Ajustes de lá. Para cancelar, apague a chave no site onde ela foi criada.</p></details>
    </section>
  <section><h3>Loja</h3><label class="f">Amazon e Kindle de<select class="in" id="aLj"><option value="amazon.com.br">Brasil (amazon.com.br)</option><option value="amazon.com">Estados Unidos (amazon.com)</option><option value="amazon.co.uk">Reino Unido</option><option value="amazon.es">Espanha</option></select></label></section>
  <section id="syncBox"></section>

  setTimeout(()=>SYNC&&SYNC.painel(document.getElementById('syncBox')));$('#aIa').value=AJ.ia;$('#aLj').value=AJ.loja;
  navigator.storage?.estimate?.().then(e=>{if(e&&$('#uso'))$('#uso').textContent=`Ocupando ${tam(e.usage||0)} de ${tam(e.quota||0)} disponíveis.`}).catch(()=>{});
  M.querySelector('[data-guia]')?.addEventListener('click',e=>{e.preventDefault();const g=$('#guiaChave');g.querySelectorAll('details')[1].open=true;g.scrollIntoView({behavior:'smooth',block:'start'})});

  const kSet=v=>{v=String(v||'').replace(/\s+/g,'');$('#aKey').value=v;if(/^AIza/.test(v))$('#aIa').value='gemini';else if(/^sk-ant-/.test(v))$('#aIa').value='anthropic';sv();
    $('#kSt').textContent=v?(AJ.ia?`Chave salva (${v.length} caracteres, ${AJ.ia==='gemini'?'Gemini':'Anthropic'}). Toque em Testar.`:'Chave salva. Escolha o serviço acima.'):''};
  $('#aKey').addEventListener('input',e=>kSet(e.target.value));
  $('#kCol').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(!t.trim())return $('#kSt').textContent='A área de transferência está vazia. Copie a chave primeiro.';kSet(t);toast('Chave colada')}
    catch(e){$('#kSt').textContent='O navegador não deixou colar por botão. Toque e segure dentro do campo Chave e escolha “Colar”.';$('#aKey').focus()}};
  $('#kTes').onclick=async e=>{sv();const st=$('#kSt');if(!AJ.chave)return st.textContent='Cole a chave primeiro.';if(!AJ.ia)return st.textContent='Escolha o serviço acima.';const G=AJ.ia==='gemini';
    e.target.disabled=true;st.textContent='Testando…';try{const r=await timeoutFetch(G?'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1':'https://api.anthropic.com/v1/models?limit=1',{headers:G?{'x-goog-api-key':AJ.chave}:{'x-api-key':AJ.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});const d=await r.json().catch(()=>({}));

  try{const r=await identificarIA(c.toDataURL('image/jpeg',.85).split(',')[1],P_ESTANTE,3000);const l=(r?.livros||[]).filter(x=>x&&x.titulo);if(!l.length)return status('A IA não conseguiu ler nenhum título. Tente uma foto mais perto, com as lombadas retas.','err');
    lote(l.map(x=>({titulo:String(x.titulo),autor:String(x.autor||'')})),'Na foto')}catch(e){status('IA: '+e.message,'err')}}
async function umArquivo(f){ADD.arquivos=[f];status('Lendo o arquivo…');const m=await metaArquivo(f);ADD.palpite=m;if(m.capaLocal)ADD.foto=m.capaLocal;
  const prev=`<div class="prev">${m.capaLocal?`<img src="${m.capaLocal}" alt="">`:''}<span class="note">${esc(f.name)} · ${tam(f.size)}</span></div>`;
  const q=m.isbn||[m.titulo,(m.autor||'').split(',')[0]].filter(Boolean).join(' ');$('#nome').value=q;procurar(q,prev)}
async function variosArquivos(fs){status('Lendo os arquivos…');const it=[];for(const f of fs){const m=await metaArquivo(f);it.push({titulo:m.titulo||f.name,autor:m.autor,isbn:m.isbn,arquivo:f,capaLocal:m.capaLocal})}lote(it,'Arquivos')}
async function procurar(q,prev='',ia=null){
  if(pareceISBN(q)){const i=isbn13(q);status('Consultando o ISBN '+i+'…');const m=await porISBN(i);if(m)return confirmar(m);
    if(ia?.titulo){q=[ia.titulo,ia.autor].filter(Boolean).join(' ');$('#nome').value=q}
    else{$('#res').innerHTML=prev+`<div class="st err">Não achei o ISBN ${esc(i)} nos catálogos. Digite o título acima e toque em Buscar.</div><button class="btn" id="manual">Salvar só com o ISBN</button>`;ADD.palpite={...(ADD.palpite||{}),isbn:i};$('#manual').onclick=()=>confirmar(null);return}}
  status('Buscando “'+q+'” nos catálogos…');let l=[];try{l=await buscarTexto(q)}catch(e){}
  const alt=(ia?.alternativas||[]).filter(a=>a&&a.titulo);
  $('#res').innerHTML=prev+(ia?`<p class="note">A IA acha que é <b>${esc(ia.titulo)}</b>${ia.autor?' — '+esc(ia.autor):''}${typeof ia.confianca==='number'?` · certeza ${Math.round(ia.confianca*100)}%`:''}. Escolha a edição:</p>`:'<p class="note">Escolha a edição:</p>')+
   (alt.length?`<div class="chips">${alt.map((a,i)=>`<button class="chip" data-alt="${i}">${esc(a.titulo)}${a.autor?' — '+esc(a.autor):''}</button>`).join('')}</div>`:'')+
   `<div class="cands">${l.map((c,i)=>`<button class="cand" data-c="${i}"><span class="mini">${capaHTML(c,false)}</span><div><b>${esc(c.titulo)}${c.subtitulo?': '+esc(c.subtitulo):''}</b><span>${esc(c.autor)}</span><span>${[c.editora,c.ano,c.paginas?c.paginas+' p.':'',c.idioma].filter(Boolean).map(esc).join(' · ')}</span></div></button>`).join('')||'<p class="note">Nada encontrado nos catálogos. Confira o nome acima ou salve assim mesmo.</p>'}</div>
   <button class="btn" id="manual">Salvar com o que eu digitei</button>`;
  $('#res').onclick=e=>{const b=e.target.closest('[data-c],[data-alt],#manual');if(!b)return;if(b.id==='manual')return confirmar(null);if(b.dataset.alt!=null){const a=alt[+b.dataset.alt];$('#nome').value=`${a.titulo} ${a.autor||''}`.trim();return procurar($('#nome').value,prev,ia)}confirmar(l[+b.dataset.c])}}
async function confirmar(c){const p=ADD.palpite||{};const t=$('#nome')?.value.trim()||'';
  const base=c||{titulo:p.titulo||(pareceISBN(t)?'':t),subtitulo:p.subtitulo,autor:p.autor,editora:p.editora,ano:p.ano,isbn:isbn13(p.isbn)||(pareceISBN(t)?isbn13(t):''),idioma:p.idioma};
  const arqs=ADD.arquivos||[];const d=novoLivro(base,{foto:ADD.foto||'',formato:arqs.length?'Só digital':'Capa comum'});if(!d.capa&&d.foto)d.usarFoto=true;
  const ex=acharExistente(d);$('#tAdd').textContent='Confirmar';
  $('#addBody').innerHTML=`<div class="det"><div>${capaHTML(d,false)}</div><div><h2>${esc(d.titulo||'Sem título')}</h2>${d.subtitulo?`<p class="sub">${esc(d.subtitulo)}</p>`:''}<p class="who">${esc(d.autor)}</p><p class="note">${[d.editora,d.ano,d.paginas?d.paginas+' páginas':'',d.isbn?'ISBN '+d.isbn:''].filter(Boolean).map(esc).join(' · ')}</p>
    ${arqs.length?`<p class="note">Cópia digital: ${arqs.map(f=>esc(f.name)+' ('+tam(f.size)+')').join(', ')}</p>`:''}
    ${ex?`<div class="st err">Você já tem <b>&nbsp;${esc(ex.titulo)}&nbsp;</b> na coleção.</div><div class="row">${arqs.length?'<button class="btn ac" id="nJ">Juntar o arquivo ao que já está lá</button>':''}<button class="btn" id="nAb">Abrir o que já está lá</button></div>`:''}</div></div>
   <div class="blk"><h3>Listas</h3></div><div class="chips" id="cL">${LISTAS.map(l=>`<button class="chip" data-l="${esc(l.id)}">${esc(l.nome)}</button>`).join('')}<button class="chip" data-nl>+ nova lista</button></div>
   <div class="chips" id="cS">${Object.entries(LEIT).map(([k,v])=>`<button class="chip" data-s="${k}">${v}</button>`).join('')}</div>
   <div class="form"><label class="f">Formato<select class="in" id="nF">${FORMATOS.map(x=>`<option ${x===d.formato?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="f">Estado<select class="in" id="nE">${ESTADOS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
   <label class="f">Onde está<input class="in" id="nL" placeholder="sala, 2ª prateleira…"></label><label class="f">Observações<input class="in" id="nO" placeholder="onde comprou, edição…"></label></div>
   <div class="row"><button class="btn ac" id="nS">${ex?'Guardar mesmo assim':'Guardar na coleção'}</button>${d.capa&&d.foto?'<label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nP"> usar a minha foto como capa</label>':''}<button class="btn lk" id="nV">Voltar</button></div>`;
  const sel=new Set();let leit='';
  $('#cL').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-nl')){const n=await perguntar('Nome da nova lista');if(!n)return;const l={id:uid(),nome:n,criado:Date.now()};await DB.put('listas',l);await load();sel.add(l.id);b.insertAdjacentHTML('beforebegin',`<button class="chip on" data-l="${esc(l.id)}">${esc(n)}</button>`);return}const id=b.dataset.l;sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('on')};
  $('#cS').onclick=e=>{const b=e.target.closest('button');if(!b)return;leit=leit===b.dataset.s?'':b.dataset.s;$('#cS').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.s===leit))};
  $('#nV').onclick=passo1;
  if($('#nAb'))$('#nAb').onclick=()=>{fechar($('#sAdd'));detalhe(ex.id)};
  if($('#nJ'))$('#nJ').onclick=async()=>{await anexar(ex,arqs);await load();fechar($('#sAdd'));render();toast(`Arquivo guardado em “${ex.titulo}”`);detalhe(ex.id)};
  $('#nS').onclick=async e=>{e.target.disabled=true;Object.assign(d,{formato:$('#nF').value,estado:$('#nE').value,local:$('#nL').value.trim(),obs:$('#nO').value.trim(),listas:[...sel],leitura:leit});if($('#nP')?.checked)d.usarFoto=true;
    await salvar(d);if(arqs.length)await anexar(d,arqs);await load();fechar($('#sAdd'));VISTA='estante';render();toast(`“${d.titulo}” entrou na coleção`)}}
function lote(itens,origem){$('#tAdd').textContent=origem==='Arquivos'?`${itens.length} arquivos`:`${itens.length} livros na foto`;
  $('#addBody').innerHTML=`<p class="note">${origem==='Arquivos'?'Cada arquivo vira a cópia digital do livro. Se o livro já estiver na coleção, o arquivo é guardado nele.':'Confira a lista: desmarque o que a IA leu errado. Os que já estão na coleção são pulados.'}</p>
   <div class="lote">${itens.map((x,i)=>{const ex=acharExistente(x);return`<label><input type="checkbox" data-i="${i}" ${ex&&!x.arquivo?'':'checked'}><span>${esc(x.titulo)}<small>${esc(x.autor||'')}${x.arquivo?' · '+esc(x.arquivo.name):''}</small></span><em id="lt${i}">${ex?(x.arquivo?'vai para o que já existe':'já na coleção'):''}</em></label>`}).join('')}</div>
   <div class="blk"><h3>Listas</h3></div><div class="chips" id="cL">${LISTAS.map(l=>`<button class="chip" data-l="${esc(l.id)}">${esc(l.nome)}</button>`).join('')}</div>
   <div class="row"><button class="btn ac" id="lAdd">Adicionar os marcados</button><button class="btn lk" id="nV">Voltar</button></div>`;
  const sel=new Set();$('#cL').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.l;sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('on')};
  $('#nV').onclick=passo1;
  $('#lAdd').onclick=async e=>{e.target.disabled=true;let n=0,j=0;const marc=[...$('#addBody').querySelectorAll('.lote input:checked')].map(c=>+c.dataset.i);
    for(const i of marc){const x=itens[i];const st=$('#lt'+i);st.textContent='buscando…';
      try{let c=x.isbn?await porISBN(isbn13(x.isbn)):null;if(!c)c=melhor(await buscarTexto([x.titulo,(x.autor||'').split(',')[0]].filter(Boolean).join(' ')),x);
        const base=c||{titulo:x.titulo,autor:x.autor,isbn:x.isbn};const ex=acharExistente(base)||acharExistente(x);
        if(ex){if(x.arquivo){await anexar(ex,[x.arquivo]);j++;st.textContent='✓ arquivo guardado'}else st.textContent='já estava';continue}
        const d=novoLivro(base,{formato:x.arquivo?'Só digital':'Capa comum',foto:x.capaLocal||'',listas:[...sel]});if(!d.capa&&d.foto)d.usarFoto=true;
        await salvar(d);LIVROS.push(d);if(x.arquivo)await anexar(d,[x.arquivo]);n++;st.textContent=c?'✓':'✓ sem dados do catálogo'}catch(err){st.textContent='erro: '+err.message}}
    await load();render();toast(`${n} ${n===1?'livro novo':'livros novos'}${j?` · ${j} ${j===1?'arquivo guardado num livro que já estava':'arquivos em livros que já estavam'}`:''}`,4000);e.target.textContent='Pronto — fechar';e.target.disabled=false;e.target.onclick=()=>fechar($('#sAdd'))}}

/* ---------- listas: ações ---------- */
async function acaoLista(e){const b=e.target.closest('button');if(!b)return;const g=k=>LISTAS.find(l=>l.id===b.dataset[k]);
  if(b.id==='addL'){const n=$('#novaL').value.trim();if(!n)return;await DB.put('listas',{id:uid(),nome:n,criado:Date.now()});await load();return render()}
  if(b.dataset.verl){VISTA='estante';render();$('#flt').value=b.dataset.verl;return render()}
  if(b.dataset.copl){const l=g('copl');const t=LIVROS.filter(d=>(d.listas||[]).includes(l.id)).map(d=>`${d.titulo}${d.autor?' — '+d.autor:''}${d.ano?' ('+d.ano+')':''}`).join('\n');
    return navigator.clipboard.writeText(`${l.nome}\n\n${t}`).then(()=>toast('Lista copiada'),()=>toast('Não deu para copiar'))}
  if(b.dataset.renl){const l=g('renl');const n=await perguntar('Novo nome',l.nome);if(n){l.nome=n;await DB.put('listas',l);await load();render()}return}
  if(b.dataset.dell){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmar?';return}const l=g('dell');for(const d of LIVROS)if((d.listas||[]).includes(l.id)){d.listas=d.listas.filter(x=>x!==l.id);await salvar(d)}await DB.del('listas',l.id);await load();return render()}}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-close]'))return fechar(t.closest('.sheet'));
  if(t.classList.contains('sheet')&&(t.id==='sAdd'||t.id==='sDet'))return fechar(t);
  const g=t.closest('[data-goto]');if(g){e.preventDefault();fechar($('#sAdd'));VISTA=g.dataset.goto;return render()}
  if(t.closest('[data-add]'))return novo();
  const r=t.closest('.rec');if(r)return detalhe(r.dataset.id);
  const tab=t.closest('.tabs button');if(tab){VISTA=tab.dataset.v;return render()}
  if(VISTA==='listas'&&t.closest('#main'))acaoLista(e)});
document.addEventListener('keydown',e=>{if(LER&&$('#sLer').classList.contains('on')){if(e.key==='ArrowRight')return LER.rend.next();if(e.key==='ArrowLeft')return LER.rend.prev()}
  if(e.key==='Escape'){const s=[...document.querySelectorAll('.sheet.on')].pop();if(s)fechar(s)}});
$('#fab').onclick=novo;
['q','ord','flt','st'].forEach(i=>$('#'+i).addEventListener('input',render));

(async()=>{try{await DB.open();await load()}catch(e){toast('Este navegador não deixou guardar dados',5000)}try{SYNC=window.ColecoesSync.criar({app:'livros',DB,itens:'livros',listas:'listas',aviso:toast,aoMudar:async()=>{await load();render()}});SYNC.painel(document.getElementById('syncBox'))}catch(e){}render();if(location.hash==='#novo')novo()})();
}
</script>
</body>
