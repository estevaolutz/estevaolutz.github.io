<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atlas da Antártida</title>

<style>
/* Layout: app de tela única — diário das expedições à esquerda (embaixo no celular), carta polar centrada no Polo Sul ocupando o resto. */
:root {
  --panel: #f5f7f9;
  --panel-2: #e9eef2;
  --ink: #16212c;
  --muted: #5a6875;
  --line: #d2dbe2;
  --accent: #9a2f1f;
  --accent-soft: #f4e2dc;
  --halo: rgba(245, 247, 249, .94);

  --sea: #0f2236;
  --f-display: "Libre Caslon Text", "Baskerville", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #11171e; --panel-2: #1a222b; --ink: #e6ecf1; --muted: #98a6b3; --line: #2a3540;
    --accent: #ec8a72; --accent-soft: #3a221c; --halo: rgba(17, 23, 30, .94);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #11171e; --panel-2: #1a222b; --ink: #e6ecf1; --muted: #98a6b3; --line: #2a3540;
  --accent: #ec8a72; --accent-soft: #3a221c; --halo: rgba(17, 23, 30, .94);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.app { height: 100%; display: grid; grid-template-columns: minmax(330px, 410px) minmax(0, 1fr); }
.panel { min-width: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 18px; padding-block: 22px 32px; }
.mapwrap { position: relative; min-width: 0; background: var(--sea); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .mapwrap { order: -1; height: 58svh; min-height: 340px; }
  .panel { border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
#map { display: block; width: 100%; height: 100%; cursor: grab; }
#map.dragging { cursor: grabbing; }

/* painel */
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 6px 0 8px; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.stats { margin-top: 10px; font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.secttl { font: 600 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
button:focus-visible, [role="button"]:focus-visible, .stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tline svg { display: block; width: 100%; height: auto; }
.tl-row { cursor: pointer; }
.tl-row text { font: 600 11px var(--f-body); fill: var(--ink); }
.tl-row .yr { font: 400 10px var(--f-mono); fill: var(--muted); }
.tl-axis text { font: 400 10px var(--f-mono); fill: var(--muted); text-anchor: middle; }
.tl-axis line { stroke: var(--line); }
.tl-row:hover text:first-child { fill: var(--accent); }

.exp { display: grid; grid-template-columns: 4px 1fr auto; gap: 2px 12px; width: 100%; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--line); padding: 12px 2px; color: var(--ink); cursor: pointer; font: inherit; }
.exp .bar { grid-row: 1 / 4; border-radius: 2px; background: var(--c); }
.exp .et { font-family: var(--f-display); font-size: 19px; line-height: 1.2; }
.exp .ey { font: 500 12px var(--f-mono); color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.exp .el { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.exp .es { grid-column: 2 / 4; font-size: 13.5px; }
.exp:hover .et { color: var(--accent); }

.back { background: none; border: 0; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 0; }
.back:hover { color: var(--ink); }
.ship { display: inline-flex; gap: 8px; align-items: center; font: 500 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.ship i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); }
.detail h1 { font-size: 30px; }
.lead { font-size: 13.5px; color: var(--muted); }
.sum { margin: 12px 0 0; max-width: 62ch; }
.outcome { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 14px; }
.outcome b { font-weight: 600; }

.crew { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.crew li { display: grid; grid-template-columns: minmax(0, 1fr); padding: 6px 0; border-top: 1px solid var(--line); }
.crew li:first-child { border-top: 0; }
.crew .cn { font-weight: 600; line-height: 1.25; }
.crew .cr { font-size: 13px; color: var(--muted); }
.crew li.lost .cn::after { content: " †"; color: var(--accent); }
details.crewbox { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
details.crewbox summary { cursor: pointer; padding: 10px 0; font: 600 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
details.crewbox summary::-webkit-details-marker { display: none; }
details.crewbox summary::after { content: "+"; font: 500 14px var(--f-mono); }
details.crewbox[open] summary::after { content: "−"; }
details.crewbox[open] { padding-bottom: 8px; }

.controls { position: sticky; top: -22px; z-index: 2; background: var(--panel); display: flex; align-items: center; gap: 8px;
  margin: 18px 0 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; }
.cbtn:disabled { opacity: .35; cursor: default; }
.cbtn.play { background: var(--c, var(--accent)); border-color: transparent; color: #fff; width: 44px; height: 44px; }
.cbtn svg { width: 16px; height: 16px; fill: currentColor; }
.prog { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.stops { list-style: none; margin: 4px 0 0; padding: 0; }
.stop { position: relative; padding: 9px 4px 9px 30px; cursor: pointer; border-radius: 6px; }
.stop::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.stop:first-child::before { top: 18px; } .stop:last-child::before { bottom: calc(100% - 18px); }
.stop .num { position: absolute; left: 0; top: 8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  font: 500 10px var(--f-mono); background: var(--panel); color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.stop.done .num { background: var(--c); color: #fff; }
.stop.cur .num { background: var(--c); color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.stop.side .num { border-radius: 4px; }
.sn { font-weight: 600; line-height: 1.3; }
.stop.cur .sn { color: var(--c); }
.sm { font: 400 12px var(--f-mono); color: var(--muted); }
.st { display: none; margin-top: 8px; max-width: 60ch; }
.stop.cur .st { display: block; }
.st p { margin: 0 0 8px; }
.st .tag { display: inline-block; font: 500 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); margin-bottom: 4px; }
.st .today { font-size: 13.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.st .today b { color: var(--ink); font-weight: 600; }
.st .coords { font: 400 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 12.5px; margin: 22px 0 0; max-width: 62ch; }

/* sobreposições do mapa */
.ov { position: absolute; background: rgba(9, 20, 32, .78); color: #e7eef5; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; backdrop-filter: blur(4px); }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(9, 20, 32, .78); color: #eef3f8;
  font: 500 18px/1 var(--f-mono); cursor: pointer; }
.zoom button.fit { font-size: 10.5px; letter-spacing: .04em; }
.layers { left: 10px; top: 10px; padding: 8px 10px; display: grid; gap: 8px; }
.layers .seg { display: inline-flex; gap: 3px; }
.layers .seg button { font: 600 12px/1 var(--f-body); color: #c3d0dc; background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.layers .seg button[aria-pressed="true"] { background: #e7eef5; color: #0f2236; border-color: #e7eef5; }
.layers input { width: 100%; accent-color: #e7eef5; }
.scale { left: 10px; bottom: 10px; padding: 6px 9px; font: 400 10.5px var(--f-mono); display: flex; align-items: center; gap: 8px; pointer-events: none; }
#scalebar { display: block; height: 5px; border: 1.5px solid #e7eef5; border-top: 0; }
.hint { position: absolute; right: 10px; bottom: 10px; font: 400 10.5px var(--f-mono); color: rgba(231, 238, 245, .55); pointer-events: none; }
@media (max-width: 560px) { .hint { display: none; } }
.loadmsg { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; font: 400 12px var(--f-mono); pointer-events: none; text-align: center; max-width: 80%; }

/* camadas do SVG */
.grat { fill: none; stroke: rgba(210, 228, 245, .09); stroke-width: 1; }
.grat.circle { stroke: rgba(210, 228, 245, .28); stroke-dasharray: 5 4; }
.grat-lbl { fill: rgba(210, 228, 245, .5); font-family: var(--f-mono); }
.coast { fill: none; stroke: #5d7b96; stroke-width: .8; stroke-linejoin: round; }
.ice-coast { fill: none; stroke: #7f9bb4; stroke-width: 1; stroke-linejoin: round; }
.shelf { fill: #e9f1f7; stroke: #a9bfd1; stroke-width: .8; stroke-dasharray: 3 2; }
.claim { fill: none; stroke: #c2546a; stroke-width: 1; stroke-dasharray: 6 4; }
.ridge-hi { fill: none; stroke: rgba(255,255,255,.9); stroke-linecap: round; stroke-linejoin: round; }
.ridge-lo { fill: none; stroke: rgba(92, 112, 132, .55); stroke-linecap: round; stroke-linejoin: round; }

.route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.route.all { stroke-width: 1.6; opacity: .55; }
.route.all.hot { opacity: 1; stroke-width: 2.6; }
.route.base { stroke-width: 1.3; stroke-dasharray: 2 5; opacity: .85; }
.route.case { stroke: rgba(255,255,255,.95); stroke-width: 5; }
.route.done { stroke-width: 2.6; }
.route.alt { stroke-dasharray: 7 4; }
.route-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }

.mk { cursor: pointer; }
.mk circle.dot { stroke: #fff; stroke-width: 1.8; }
.mk.side circle.dot { stroke-dasharray: 2 1.5; }
.mk text.num { fill: #fff; font: 500 9.5px var(--f-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.future circle.dot { opacity: .55; }
.mk .ring { fill: none; stroke-width: 1.6; opacity: 0; }
.mk.current .ring { opacity: 1; animation: pulse 2.2s ease-out infinite; transform-origin: 0 0; }
.mk .lbl { font: 600 11px var(--f-body); fill: #0f1c2a; paint-order: stroke; stroke: rgba(255,255,255,.92); stroke-width: 3.4px; stroke-linejoin: round; pointer-events: none; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mk.current .ring { animation: none; opacity: .8; transform: scale(1.45); } }
.pin text { font: italic 600 11px var(--f-body); paint-order: stroke; stroke: rgba(9, 20, 32, .85); stroke-width: 3px; stroke-linejoin: round; }

.lab { transition: opacity .2s; }
.lab.hid { opacity: 0; pointer-events: none; }
.sub { opacity: 0; transition: opacity .25s; }
.zoom-mid .sub.mid { opacity: 1; }
.l-sea { fill: rgba(205, 222, 240, .62); font-family: var(--f-display); font-style: italic; letter-spacing: .1em; text-anchor: middle; }
.l-land { fill: #5f7690; font-family: var(--f-display); letter-spacing: .2em; text-transform: uppercase; text-anchor: middle; paint-order: stroke; stroke: rgba(255,255,255,.75); stroke-width: 2.4px; stroke-linejoin: round; }
.l-land.dark { fill: #c9d6e2; stroke: rgba(9, 20, 32, .6); }
.l-feat { fill: #3f5670; font: italic 400 10px var(--f-display); paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.6px; stroke-linejoin: round; }
.l-feat.sea { fill: #cfe0ef; stroke: rgba(9, 20, 32, .65); }
.l-mount path { fill: #5d6f82; }
.l-pt circle { fill: #2b3f55; }
.l-pt text { font: 600 10.5px var(--f-body); fill: #24384d; paint-order: stroke; stroke: rgba(255,255,255,.88); stroke-width: 2.6px; stroke-linejoin: round; }
.l-pt text.sub { font: 400 8.5px var(--f-mono); fill: #4d6378; }
.l-pt.dark text { fill: #dbe6f0; stroke: rgba(9, 20, 32, .8); }
.l-pt.dark circle { fill: #dbe6f0; }
.m-st rect { fill: #b3243c; }
.m-st text { font: 600 10px var(--f-body); fill: #6e1426; paint-order: stroke; stroke: rgba(255,255,255,.9); stroke-width: 2.6px; stroke-linejoin: round; }
.m-claim { font: 600 10.5px var(--f-body); letter-spacing: .14em; text-transform: uppercase; fill: #a63a50; text-anchor: middle; paint-order: stroke; stroke: rgba(255,255,255,.8); stroke-width: 2.4px; stroke-linejoin: round; }
.m-claim.sub2 { font: 400 9px var(--f-mono); letter-spacing: .02em; text-transform: none; fill: #7c4552; }
.m-sea { fill: rgba(220, 236, 250, .72); font: italic 400 11px var(--f-body); letter-spacing: .08em; text-anchor: middle; }
.m-land { fill: #4a6178; font: 600 11px var(--f-body); letter-spacing: .2em; text-transform: uppercase; text-anchor: middle; paint-order: stroke; stroke: rgba(255,255,255,.75); stroke-width: 2.4px; }
.m-land.dark { fill: #d6e1eb; stroke: rgba(9, 20, 32, .6); }
</style>

<div class="app">
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <div class="mapwrap" id="mapbox">
    <svg id="map" role="img" aria-label="Carta polar da Antártida com as rotas das expedições"></svg>
    <div class="ov layers">
      <div class="seg" role="group" aria-label="Camada do mapa">
        <button type="button" id="l-era" data-v="0" aria-pressed="true">1910</button>
        <button type="button" id="l-mix" data-v="50" aria-pressed="false">Mesclar</button>
        <button type="button" id="l-now" data-v="100" aria-pressed="false">Hoje</button>
      </div>
      <input type="range" id="blend" min="0" max="100" value="0" aria-label="Mesclar mapa da época e atual">
    </div>
    <div class="zoom">
      <button type="button" id="z-in" aria-label="Aproximar">+</button>
      <button type="button" id="z-out" aria-label="Afastar">−</button>
      <button type="button" id="z-fit" class="fit" aria-label="Enquadrar a expedição ou o continente">TUDO</button>
    </div>
    <div class="ov scale" aria-hidden="true"><i id="scalebar"></i><span id="scaletxt">100 km</span></div>
    <div class="hint">arraste · pince · role para zoom</div>
    <div class="ov loadmsg" id="loadmsg">Carregando o litoral…</div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------- Projeção azimutal equidistante centrada no Polo Sul (0° de longitude para cima) ---------- */
const K = 10, RMAX = 57;
const P = ([lon, lat]) => { const r = (90 + lat) * K, a = lon * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; };
const KM_PER_UNIT = 111.2 / K;

/* ---------- Expedições ---------- */
const EXP = [
{ id: "belgica", ship: "Belgica", name: "Expedição Antártica Belga", years: [1897, 1899], c: "#4d8a1f",
  leader: "Adrien de Gerlache · com Roald Amundsen como imediato",
  line: "O primeiro inverno humano na Antártida, preso no gelo.",
  sum: "Um pequeno baleeiro norueguês reformado leva cientistas de cinco países para mapear o oeste da Península Antártica. No fim do verão, de Gerlache avança demais para o sul e o navio fica preso no mar de Bellingshausen. A tripulação passa treze meses à deriva, no escuro do inverno polar, com escorbuto e loucura a bordo.",
  outcome: "<b>Resultado:</b> primeira invernada na Antártida e escola polar de Amundsen e do médico Frederick Cook, que salvam a tripulação com carne fresca de foca e pinguim.",
  crew: [["Adrien de Gerlache","Comandante, oficial da marinha belga"],["Georges Lecointe","Imediato e astrônomo"],["Roald Amundsen","Segundo imediato, 25 anos, sem salário"],["Frederick Cook","Médico e fotógrafo, norte-americano"],["Henryk Arctowski","Geólogo e oceanógrafo polonês"],["Emil Racoviță","Biólogo romeno"],["Antoni Dobrowolski","Meteorologista polonês"],["Émile Danco","Geofísico", 1],["Carl Wiencke","Marinheiro norueguês, caiu no mar", 1]],
  stops: [
  { n: "Punta Arenas", d: "14 dez. 1897", at: [-70.91,-53.16],
    s: "Depois de quatro meses desde Antuérpia, a Belgica deixa o porto chileno no estreito de Magalhães rumo ao sul. Na travessia da passagem de Drake, o marinheiro Carl Wiencke cai no mar durante uma tempestade e desaparece.",
    t: "Punta Arenas segue como porto de partida para a Península Antártica e para voos à base chilena Presidente Eduardo Frei." },
  { n: "Estreito de Gerlache", d: "jan.–fev. 1898", at: [-62.5,-64.5], via: [[-66,-57],[-64,-61.5]],
    s: "Durante três semanas, a expedição percorre e mapeia um canal entre a Península e um rosário de ilhas, fazendo cerca de vinte desembarques. Racoviță coleta líquens, musgos e insetos sem asas; Arctowski estuda as rochas. É a primeira pesquisa científica sistemática no continente.",
    t: "O canal leva o nome de Gerlache. Ilhas e cabos da região homenageiam os patrocinadores belgas, como Anvers, Brabante e Liège." },
  { n: "Presa no gelo", d: "2 mar. 1898", at: [-85.25,-71.5], via: [[-66,-66.5],[-75,-69.5]],
    s: "Em vez de voltar ao fim do verão, de Gerlache força o navio para o sul no mar de Bellingshausen. O gelo se fecha ao redor da Belgica a 71°30′ S. A decisão é discutida até hoje: parte da tripulação acreditava que ele queria a invernada desde o início.",
    t: "Posição aproximada. O mar de Bellingshausen continua um dos trechos de gelo marinho mais extensos da Antártida." },
  { n: "A noite polar", d: "mai.–jul. 1898", at: [-92,-70.6], via: [[-89,-71.2]],
    s: "O sol some por 70 dias. O escorbuto se espalha, o comandante e o capitão ficam de cama e um marinheiro enlouquece. Émile Danco morre do coração em junho. Cook e Amundsen obrigam todos a comer carne fresca de foca e pinguim e a se expor ao calor de um fogão, o que faz os doentes se recuperarem.",
    t: "Amundsen leva dessa noite as lições que aplicará na Fram: comida fresca contra o escorbuto, roupas de pele à maneira inuit e esquis." },
  { n: "Livre do gelo", d: "14 mar. 1899", at: [-102,-70.2], via: [[-97,-70.2]],
    s: "Com o fim do verão chegando e o medo de um segundo inverno, a tripulação passa semanas abrindo um canal no gelo com serras e explosivos até um lago de água aberta. Em março de 1899, a Belgica finalmente se solta e volta a Punta Arenas.",
    t: "Posição aproximada. A deriva de um ano rendeu a primeira série de observações meteorológicas de um ano inteiro ao sul do Círculo Polar." }
  ] },

{ id: "discovery", ship: "Discovery", name: "Expedição Antártica Nacional Britânica", years: [1901, 1904], c: "#6a49c8",
  leader: "Robert Falcon Scott · com Ernest Shackleton e Edward Wilson",
  line: "A primeira grande exploração por terra do mar de Ross.",
  sum: "A Royal Geographical Society e a Marinha mandam um navio feito sob medida para a Antártida. Scott, um oficial da marinha sem experiência polar, monta base em Hut Point, na ilha de Ross. Em trenós, a expedição avança pela Grande Barreira de Gelo e sobe ao planalto. Aqui nasce a rivalidade entre Scott e Shackleton.",
  outcome: "<b>Resultado:</b> recorde de 82°17′ S, descoberta do planalto polar e da Terra do Rei Eduardo VII, e uma enorme coleção científica.",
  crew: [["Robert Falcon Scott","Comandante, Marinha Real"],["Albert Armitage","Navegador e imediato"],["Ernest Shackleton","Terceiro oficial, mandado para casa doente em 1903"],["Edward Wilson","Médico, zoólogo e pintor"],["Reginald Koettlitz","Médico e botânico"],["Louis Bernacchi","Físico"],["Hartley Ferrar","Geólogo"],["Reginald Skelton","Engenheiro-chefe e fotógrafo"],["Edgar Evans","Suboficial"],["William Lashly","Foguista"],["Tom Crean","Marinheiro irlandês"],["Frank Wild","Marinheiro"],["George Vince","Marinheiro, caiu de um penhasco no gelo", 1]],
  stops: [
  { n: "Lyttelton", d: "21 dez. 1901", at: [172.72,-43.6],
    s: "A Discovery parte da Nova Zelândia. Lyttelton, porto de Christchurch, será a porta de entrada de quase todas as expedições britânicas ao mar de Ross.",
    t: "Christchurch abriga hoje o Centro Internacional da Antártida, base logística dos programas dos EUA, da Nova Zelândia e da Itália." },
  { n: "Cabo Adare", d: "9 jan. 1902", at: [170.2,-71.3], via: [[176,-52],[178,-62],[172,-69]],
    s: "Primeira parada no continente, onde a expedição de Borchgrevink havia passado o inverno de 1899. Deixam mensagens num poste e seguem para o sul pela costa da Terra de Vitória.",
    t: "As cabanas de Borchgrevink, as construções mais antigas da Antártida, estão de pé no meio de uma colônia de pinguins-de-adélia." },
  { n: "Balão sobre a Barreira", d: "4 fev. 1902", at: [-164,-78.4], via: [[172,-74],[175,-77.7],[-175,-78.0]],
    s: "Navegando ao longo da Barreira, Scott chega a uma enseada perto do que depois seria a Baía das Baleias e descobre a Terra do Rei Eduardo VII. Ali sobe num balão cativo de hidrogênio, o Eva, a cerca de 250 m de altura, o primeiro voo da Antártida. Shackleton sobe em seguida e tira fotografias.",
    t: "A enseada desapareceu com o desprendimento de icebergs. A Terra do Rei Eduardo VII é hoje a península Eduardo VII." },
  { n: "Hut Point", d: "fev. 1902", at: [166.64,-77.85], via: [[-175,-78.15],[172,-77.75]],
    s: "O navio fica preso no gelo do estreito McMurdo, e a expedição monta uma cabana pré-fabricada australiana na ponta da ilha de Ross. Em março, o marinheiro George Vince escorrega de um penhasco gelado durante uma nevasca e morre no mar. Uma cruz marca o local.",
    t: "A cabana da Discovery está preservada pelo Antarctic Heritage Trust, ao lado da base americana McMurdo. A Cruz de Vince continua no alto do promontório." },
  { n: "Ponto mais ao sul", d: "30 dez. 1902", at: [163.5,-82.28], via: [[168,-78.6],[170.5,-80.2],[167,-81.6]],
    s: "Scott, Wilson e Shackleton partem em novembro com cães que não sabem conduzir. Os cães adoecem e morrem; os homens passam a puxar os trenós. Chegam a 82°17′ S, cerca de 850 km do polo. Na volta, Shackleton cospe sangue de escorbuto e mal consegue andar. Em março, Scott o manda para casa no navio de socorro. Shackleton nunca perdoa a humilhação.",
    t: "Posição aproximada, perto da entrada de Shackleton, ao pé dos Montes Transantárticos." },
  { n: "Rumo ao oeste", d: "nov.–dez. 1903", at: [146.55,-77.98], from: 3, via: [[163.5,-77.7],[158,-77.9]], side: true,
    s: "Na segunda temporada, Scott, Edgar Evans e Lashly sobem a geleira Ferrar e avançam mais de 300 km sobre o planalto da Terra de Vitória, um deserto branco a mais de 2.000 m de altitude. Na descida, Scott e Evans caem numa fenda e se salvam escalando a corda do trenó. Logo depois, encontram um vale sem gelo.",
    t: "O vale é um dos Vales Secos de McMurdo, uma das regiões mais áridas do planeta, estudada pela NASA como análogo de Marte." },
  { n: "Libertação da Discovery", d: "16 fev. 1904", at: [166.4,-77.83], from: 3, jump: true,
    s: "Dois navios de socorro chegam com ordem de abandonar a Discovery se ela não se soltasse. Com explosivos e serras, as tripulações abrem caminho no gelo, e o navio se liberta no último momento. Scott volta à Inglaterra como herói.",
    t: "A Discovery está ancorada como navio-museu em Dundee, na Escócia, onde foi construída." }
  ] },

{ id: "nimrod", ship: "Nimrod", name: "Expedição Antártica Britânica", years: [1907, 1909], c: "#d4700b",
  leader: "Ernest Shackleton · com Frank Wild, Douglas Mawson e Edgeworth David",
  line: "A 180 km do polo, Shackleton dá meia-volta.",
  sum: "Com um velho baleeiro e financiamento privado, Shackleton volta à Antártida para chegar ao polo. Promete a Scott não usar a base de McMurdo, mas o gelo o obriga a quebrar a promessa. Leva pôneis da Manchúria, um automóvel e um grupo de cientistas de primeira linha. A expedição sobe o Erebus, chega ao polo sul magnético e abre o caminho para o polo geográfico.",
  outcome: "<b>Resultado:</b> recorde de 88°23′ S, descoberta da geleira Beardmore e do planalto polar, primeira subida do Erebus e o polo sul magnético. Shackleton vira Sir Ernest.",
  crew: [["Ernest Shackleton","Comandante"],["Jameson Adams","Meteorologista, grupo do sul"],["Eric Marshall","Médico e cartógrafo, grupo do sul"],["Frank Wild","Grupo do sul"],["Edgeworth David","Geólogo galês-australiano, 50 anos, líder do grupo do polo magnético"],["Douglas Mawson","Físico australiano, grupo do polo magnético"],["Alistair Mackay","Médico, grupo do polo magnético"],["Raymond Priestley","Geólogo"],["Philip Brocklehurst","Jovem patrocinador, perdeu um dedo no Erebus"],["George Marston","Artista"],["Ernest Joyce","Encarregado dos cães e provisões"],["Rupert England","Capitão do Nimrod na primeira viagem"]],
  stops: [
  { n: "Lyttelton", d: "1º jan. 1908", at: [172.72,-43.6],
    s: "Sobrecarregado, o Nimrod é rebocado pelo vapor Koonya até o Círculo Polar Antártico para economizar carvão. Multidões assistem à partida.",
    t: "O Nimrod naufragou em 1919 no mar do Norte; apenas dois dos tripulantes sobreviveram." },
  { n: "Promessa quebrada", d: "23–25 jan. 1908", at: [-164,-78.3], via: [[178,-60],[-178,-70],[-170,-76]],
    s: "Shackleton havia prometido a Scott ficar longe de McMurdo e montar base na Baía das Baleias ou na Terra do Rei Eduardo VII. Mas a enseada da Barreira se partira em icebergs, e o gelo impede o desembarque na terra. Com pouco carvão, ele ruma para o estreito McMurdo. Escreve à esposa que nunca passara por um sofrimento moral como aquele.",
    t: "Ainda é a Baía das Baleias, uma reentrância que se forma e se desfaz na frente da Plataforma de Gelo Ross." },
  { n: "Cabo Royds", d: "fev. 1908", at: [166.17,-77.55], via: [[-178,-78.2],[170,-77.55]],
    s: "A cabana é erguida no cabo Royds, ao lado de uma colônia de pinguins-de-adélia, a uns 37 km de Hut Point. Quinze homens passam o inverno ali. Imprimem o primeiro livro feito na Antártida, o Aurora Australis.",
    t: "A cabana está preservada com as caixas de comida originais. Em 2006 foram achadas sob o piso caixas de uísque da expedição, ainda cheias." },
  { n: "Monte Erebus", d: "10 mar. 1908", at: [167.15,-77.53], from: 2, side: true,
    s: "Seis homens fazem a primeira subida do vulcão ativo mais austral do mundo, a 3.794 m. Sem crampons, numa nevasca a –30 °C, Brocklehurst congela os pés. No topo, olham para dentro da cratera fumegante.",
    t: "O Erebus tem um dos raros lagos de lava permanentes do mundo. Em 1979, um voo turístico da Air New Zealand caiu em sua encosta, matando 257 pessoas." },
  { n: "Geleira Beardmore", d: "3–17 dez. 1908", at: [171.27,-83.52], from: 2, via: [[167.5,-78.3],[169.5,-80.5],[171,-82.3]],
    s: "Shackleton, Wild, Marshall e Adams partem com quatro pôneis. Ao chegar às montanhas, sobem uma passagem que chamam de Portão e veem uma geleira imensa, que batizam com o nome do patrocinador William Beardmore. Socks, o último pônei, cai numa fenda e quase leva Wild junto. Dali em diante, eles puxam os trenós.",
    t: "Com cerca de 200 km de comprimento, a Beardmore é uma das maiores geleiras de vale do mundo. O Monte Hope marca o Portão." },
  { n: "88°23′ S", d: "9 jan. 1909", at: [162,-88.38], via: [[168,-84.6],[164,-85.6],[162,-87]],
    s: "No planalto a 3.000 m, com rações cortadas e disenteria, os quatro fazem uma última arrancada sem trenó. A 180 km do polo, Shackleton finca a bandeira e decide voltar, sabendo que não sobreviveriam ao retorno se continuassem. Mais tarde diria à esposa que um burro vivo é melhor que um leão morto.",
    t: "O recorde só foi superado por Amundsen em 7 de dezembro de 1911. Ao passar por ele, Amundsen ergueu a bandeira norueguesa em homenagem a Shackleton." },
  { n: "Polo sul magnético", d: "16 jan. 1909", at: [155.27,-72.42], from: 2, via: [[165,-76.5],[163.5,-75.4],[160.5,-74],[157,-73]], side: true,
    s: "Enquanto isso, David, Mawson e Mackay puxam um trenó por mais de 2.000 km, subindo pela costa da Terra de Vitória e pelo planalto, sem cães nem pôneis. Chegam ao polo magnético segundo os cálculos de David, a 72°25′ S, e erguem a bandeira britânica. Na volta, quase perdem o navio e Mawson cai numa fenda.",
    t: "Recálculos indicam que talvez não tenham chegado ao ponto exato. O polo magnético migra cerca de 10 km por ano e hoje está no mar, ao largo da Terra Adélia." },
  { n: "Volta a Hut Point", d: "28 fev. 1909", at: [166.64,-77.85], from: 5, via: [[164,-85.6],[171,-83.6],[170,-80.5],[168,-78.6]],
    s: "Marshall adoece e Adams fica com ele, enquanto Shackleton e Wild andam 53 km sem parar até a velha cabana da Discovery para pedir socorro ao navio. O Nimrod volta para buscá-los, e todos os quatro sobrevivem. A expedição parte em 4 de março.",
    t: "A cabana de Hut Point serviu de abrigo a quase todas as expedições seguintes, inclusive à de Scott em 1912." }
  ] },

{ id: "fram", ship: "Fram", name: "Expedição Norueguesa ao Polo Sul", years: [1910, 1912], c: "#c92a2a",
  leader: "Roald Amundsen · com Bjaaland, Hanssen, Hassel e Wisting",
  line: "Esquis, cães e um plano de precisão: o primeiro a chegar ao polo.",
  sum: "Amundsen planejava ir ao polo norte, mas Cook e Peary disseram tê-lo alcançado em 1909. Em segredo, ele muda de rumo: só conta à tripulação na ilha da Madeira, e manda a Scott um telegrama curto avisando que segue para a Antártida. Monta base na Baía das Baleias, 100 km mais perto do polo que McMurdo, e usa cães da Groenlândia, esquis e roupas de pele, como aprendera com os inuítes.",
  outcome: "<b>Resultado:</b> primeira chegada ao Polo Sul, em 14 de dezembro de 1911, 34 dias antes de Scott, por uma rota nova pela geleira Axel Heiberg. Todos voltam vivos, em 99 dias.",
  crew: [["Roald Amundsen","Chefe da expedição"],["Olav Bjaaland","Campeão de esqui e carpinteiro, grupo do polo"],["Helmer Hanssen","Condutor de cães, grupo do polo"],["Sverre Hassel","Condutor de cães, grupo do polo"],["Oscar Wisting","Grupo do polo, encarregado do equipamento"],["Hjalmar Johansen","Veterano da Fram com Nansen, afastado após discutir com Amundsen"],["Kristian Prestrud","Líder do grupo da Terra do Rei Eduardo VII"],["Jørgen Stubberud","Carpinteiro, grupo de Prestrud"],["Adolf Lindstrøm","Cozinheiro de Framheim"],["Thorvald Nilsen","Capitão da Fram"]],
  stops: [
  { n: "Framheim", d: "14 jan. 1911", at: [-163.6,-78.64], approach: [[20,-36],[60,-48],[110,-56],[150,-62],[175,-68],[-170,-75],[-165,-77.8]],
    s: "Depois de dar a volta ao mundo pelo sul, pelos oceanos Atlântico e Índico, a Fram chega à Baía das Baleias. Amundsen aposta que a Barreira ali está apoiada em terra firme e monta a cabana Framheim sobre o gelo. Ele chega com 97 cães da Groenlândia.",
    t: "Framheim já não existe: o gelo onde estava se partiu e foi para o mar como icebergs." },
  { n: "Depósitos até 82° S", d: "fev.–abr. 1911", at: [-163.5,-82], via: [[-163.6,-80],[-163.5,-81]],
    s: "Antes do inverno, os noruegueses levam mais de 3 toneladas de comida para depósitos a 80°, 81° e 82° S. Marcam cada um com fileiras de bandeirolas de bambu perpendiculares à rota, para achá-los mesmo saindo do curso.",
    t: "O método de marcação foi uma das chaves do sucesso: na volta, os depósitos foram encontrados sem erro." },
  { n: "Partida para o polo", d: "20 out. 1911", at: [-163.6,-78.64], from: 1, jump: true,
    s: "Uma primeira tentativa em setembro termina em retirada caótica, com temperaturas abaixo de –50 °C. Johansen critica Amundsen em público e é afastado do grupo do polo. Em 20 de outubro partem cinco homens: Amundsen, Bjaaland, Hanssen, Hassel e Wisting, com 52 cães e quatro trenós.",
    t: "Johansen nunca se recuperou da humilhação e se suicidou em 1913." },
  { n: "Geleira Axel Heiberg", d: "17–21 nov. 1911", at: [-163,-85.4], from: 0, via: [[-163.6,-81],[-163.5,-83.5],[-164,-84.8]],
    s: "Diante das montanhas, que chamam de Montanhas da Rainha Maud, os noruegueses procuram uma passagem e sobem uma geleira desconhecida e íngreme, com cerca de 3.000 m de desnível em quatro dias. Batizam-na com o nome de um patrocinador.",
    t: "A Axel Heiberg é uma rota mais curta e íngreme que a Beardmore. Hoje fica dentro de uma Área Antártica Especialmente Protegida." },
  { n: "O Açougue", d: "21 nov. 1911", at: [-165,-85.6], via: [[-164,-85.5]],
    s: "No topo do planalto, como previsto desde o início, matam 24 cães para alimentar os outros e a si mesmos. Amundsen escreve que foi um momento duro. Chamam o lugar de Açougue. Dali seguem com 18 cães, os mais fortes.",
    t: "Posição aproximada, a 85°36′ S. O cálculo de quantos cães comer e quando estava pronto ainda na Noruega." },
  { n: "Polo Sul", d: "14 dez. 1911", at: [0,-90], via: [[-166,-86.3],[-168,-87.6],[-170,-88.6]],
    s: "Às 15h, os condutores gritam alto e os cinco chegam juntos ao polo. Plantam a bandeira norueguesa e fazem medições durante três dias para garantir a posição. Deixam a barraca Polheim com equipamentos, uma carta para o rei Haakon VII e outra para Scott, pedindo que a entregasse caso eles não voltassem.",
    t: "A base americana Amundsen–Scott está no polo desde 1956. A Polheim, enterrada pela neve, nunca foi encontrada." },
  { n: "De volta a Framheim", d: "25 jan. 1912", at: [-163.6,-78.64], from: 5, via: [[-168,-87.6],[-165,-85.6],[-163.5,-83],[-163.6,-80.5]],
    s: "O retorno é rápido: com depósitos bem marcados e cães e homens bem alimentados, eles fazem até 50 km por dia. Chegam a Framheim às 4h da manhã, 99 dias e cerca de 3.000 km depois de partir, com 11 cães.",
    t: "Amundsen percorreu o caminho de volta mais rápido que o de ida." },
  { n: "Hobart", d: "7 mar. 1912", at: [147.33,-42.88], via: [[-170,-72],[175,-62],[160,-50]],
    s: "Na Tasmânia, Amundsen manda telegramas ao irmão e ao rei anunciando a conquista. O mundo fica sabendo do polo antes de saber o destino de Scott, que naquele momento ainda tentava voltar pela Barreira.",
    t: "Hobart continua a ser porta de entrada da Antártida, sede do programa antártico australiano e base do quebra-gelo Nuyina." }
  ] },

{ id: "terranova", ship: "Terra Nova", name: "Expedição Antártica Britânica", years: [1910, 1913], c: "#1c64b4",
  leader: "Robert Falcon Scott · com Wilson, Bowers, Oates e Edgar Evans",
  line: "Chegam ao polo e encontram a bandeira norueguesa. Nenhum dos cinco volta.",
  sum: "Scott volta ao mar de Ross com um grande programa científico e um plano misto: trenós motorizados, pôneis siberianos, cães e, na parte final, homens puxando os trenós. Os motores quebram, os pôneis sofrem no frio e os cães voltam cedo. Cinco homens chegam ao polo em 17 de janeiro de 1912 e descobrem que Amundsen chegara antes. Morrem todos na volta.",
  outcome: "<b>Resultado:</b> segundo grupo no polo, morte do grupo polar e um dos maiores acervos científicos da Era Heroica, incluindo os ovos de pinguim-imperador e fósseis de Glossopteris.",
  crew: [["Robert Falcon Scott","Comandante", 1],["Edward Wilson","Chefe científico, médico e pintor", 1],["Henry \"Birdie\" Bowers","Oficial da Marinha da Índia, encarregado das provisões", 1],["Lawrence Oates","Capitão da cavalaria, cuidava dos pôneis", 1],["Edgar Evans","Suboficial, veterano da Discovery", 1],["Edward \"Teddy\" Evans","Imediato, voltou no último grupo de apoio"],["Tom Crean","Último grupo de apoio; caminhou 56 km sozinho para buscar socorro"],["William Lashly","Último grupo de apoio"],["Apsley Cherry-Garrard","Zoólogo assistente; autor de A Pior Viagem do Mundo"],["Edward Atkinson","Médico, comandou a base em 1912"],["Herbert Ponting","Fotógrafo e cinegrafista"],["Tryggve Gran","Esquiador norueguês"],["Cecil Meares e Dimitri Gerov","Condutores de cães"],["Victor Campbell","Líder do Grupo Norte"]],
  stops: [
  { n: "Port Chalmers", d: "29 nov. 1910", at: [170.62,-45.82],
    s: "Em Melbourne, Scott recebe o telegrama de Amundsen. Com 65 homens, 33 cães, 19 pôneis e três trenós motorizados, a Terra Nova deixa a Nova Zelândia. Quase afunda numa tempestade no início de dezembro, quando as bombas entopem e a tripulação passa a noite tirando água com baldes.",
    t: "Um obelisco em Port Chalmers homenageia a expedição." },
  { n: "Cabo Evans", d: "4 jan. 1911", at: [166.42,-77.64], via: [[176,-55],[178,-66],[172,-72],[167.5,-76]],
    s: "A cabana é erguida num cabo da ilha de Ross batizado em homenagem a Teddy Evans. É grande, iluminada a acetileno, com laboratório e câmara escura de Ponting. Ali 25 homens passam o inverno de 1911.",
    t: "A cabana está preservada com móveis, roupas e mantimentos originais. É o lugar mais visitado pelos turistas no mar de Ross." },
  { n: "Depósito de Uma Tonelada", d: "fev. 1911", at: [169,-79.48], via: [[167.5,-78.1],[168.5,-78.8]],
    s: "Os pôneis fraquejam, e Scott decide deixar o principal depósito de comida a 79°29′ S, uns 55 km antes do planejado. Oates insiste em seguir e matar os pôneis para fazer depósitos de carne; Scott recusa. Na volta, vários pôneis se perdem quando o gelo marinho se parte. A distância desse depósito será fatal em março de 1912.",
    t: "O depósito estava sobre a Plataforma de Gelo Ross, que se move cerca de 1 km por ano em direção ao mar." },
  { n: "A Pior Viagem do Mundo", d: "27 jun.–1º ago. 1911", at: [169.3,-77.47], from: 1, via: [[167.5,-77.85],[168.5,-77.65]], side: true,
    s: "Em pleno inverno, no escuro, Wilson, Bowers e Cherry-Garrard puxam trenós por 105 km até o cabo Crozier, a –60 °C, para coletar ovos de pinguim-imperador e testar uma teoria evolutiva. Uma nevasca leva a barraca, e eles passam dois dias deitados na neve. Voltam com três ovos.",
    t: "Os ovos estão no Museu de História Natural de Londres. A colônia de imperadores do cabo Crozier continua lá." },
  { n: "Camp Shambles", d: "9 dez. 1911", at: [171.1,-83.55], from: 1, via: [[167.5,-78.2],[169,-79.48],[170.3,-81.5]],
    s: "O grupo parte em 1º de novembro. Uma nevasca de quatro dias, fora de época, segura todos na entrada da Beardmore. Os últimos pôneis, exaustos, são mortos no lugar que chamam de Camp Shambles. Os cães voltam à base, e daqui em diante os homens puxam os trenós geleira acima.",
    t: "O acampamento ficava ao pé do Portão de Shackleton, perto do Monte Hope." },
  { n: "Último grupo de apoio", d: "4 jan. 1912", at: [160,-87.53], via: [[170,-84.3],[164,-85.2],[160.5,-86.3]],
    s: "A 87°32′ S, Scott escolhe os cinco do polo e acrescenta Bowers, a pé, quando o plano previa quatro. Teddy Evans, Crean e Lashly voltam. Evans adoece de escorbuto na Barreira; Lashly o puxa no trenó e Crean caminha 56 km sozinho, em 18 horas, até Hut Point para pedir socorro. Os dois recebem a Medalha Albert.",
    t: "Posição registrada no diário de Scott. Crean voltaria à Antártida com Shackleton na Endurance." },
  { n: "Polo Sul", d: "17 jan. 1912", at: [0,-90], via: [[160,-88.6]],
    s: "No dia anterior, Bowers vê uma bandeira preta presa a um trenó e as marcas de esquis e cães. No polo, Scott escreve: \"Great God! this is an awful place\". No dia 18 encontram a barraca Polheim, com a carta de Amundsen. Tiram uma fotografia, os rostos sérios, e começam a volta de 1.300 km.",
    t: "A fotografia, tirada por Bowers com um cordão, é uma das imagens mais famosas da exploração polar." },
  { n: "Morte de Edgar Evans", d: "17 fev. 1912", at: [170.6,-83.75], via: [[159,-87.5],[161,-86.2],[164,-85.1],[169,-84.3]],
    s: "O homem mais forte do grupo enfraquece desde o polo, com a mão cortada infeccionada e queimaduras de frio. Na descida da Beardmore, provavelmente depois de bater a cabeça numa queda, ele desaba e morre na barraca, perto da base da geleira.",
    t: "Seu corpo nunca foi encontrado. Ficou dentro do gelo da geleira." },
  { n: "Oates sai da barraca", d: "17 mar. 1912", at: [169.4,-79.95], via: [[171,-83],[170.5,-81.6],[169.8,-80.7]],
    s: "Na Barreira, o frio é bem pior que o esperado, perto de –40 °C. O querosene dos depósitos tinha evaporado em parte. Oates, com os pés congelados e gangrenados, pede para ser deixado para trás e o grupo recusa. No dia do seu 32º aniversário, diz \"I am just going outside and may be some time\" e sai na nevasca.",
    t: "O corpo de Oates nunca foi encontrado. Um marco de pedras com uma cruz foi erguido perto do local pelo grupo de busca." },
  { n: "A última barraca", d: "c. 29 mar. 1912", at: [169.3,-79.67], via: [[169.35,-79.8]],

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (parent, attrs, str) => { const t = el("text", attrs, parent); t.textContent = str; return t; };
const fx = v => v.toFixed(1);
const ringD = pts => { let d = ""; pts.forEach((p, i) => { const [x, y] = P(p); d += (i ? "L" : "M") + fx(x) + "," + fx(y); }); return d + "Z"; };
const lineD = pts => { let d = ""; pts.forEach((p, i) => { const [x, y] = P(p); d += (i ? "L" : "M") + fx(x) + "," + fx(y); }); return d; };
/* linha com interpolação geográfica (curva corretamente sobre a projeção) */
const geoLine = (pts, step = 1.2) => {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [a0, b0] = pts[i - 1]; let [a1, b1] = pts[i];
    let dl = a1 - a0; if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
    if (b0 <= -89.9 || b1 <= -89.9) { out.push(pts[i]); continue; }
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dl) * Math.cos((b0 + b1) / 2 * Math.PI / 180), Math.abs(b1 - b0)) / step));
    for (let k = 1; k <= n; k++) out.push([a0 + dl * k / n, b0 + (b1 - b0) * k / n]);
  }
  return out;
};
const smooth = pts => {
  const q = geoLine(pts).map(P);
  if (q.length === 2) return `M${fx(q[0][0])},${fx(q[0][1])}L${fx(q[1][0])},${fx(q[1][1])}`;
  let d = `M${fx(q[0][0])},${fx(q[0][1])}`;
  for (let i = 1; i < q.length - 1; i++) {
    const m = [(q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2];
    const end = i === q.length - 2 ? q[i + 1] : m;
    d += `Q${fx(q[i][0])},${fx(q[i][1])} ${fx(end[0])},${fx(end[1])}`;
  }
  return d;
};

const setLand = (rings) => {
  let ice = "", other = "", cIce = "", cOther = "";
  rings.forEach(r => {
    if (r.length < 3) return;
    const isAnt = r.some(p => p[1] < -60) && r.every(p => p[1] < -59);
    let fill = "", st = "", pen = false, lx = 1e9, ly = 1e9, n = 0;
    for (const p of r) {
      const [x, y] = P(p);
      fill += (n ? "L" : "M") + fx(x) + "," + fx(y); n++;
      if (p[1] < -89.5 || (Math.abs(Math.abs(p[0]) - 180) < 1e-6 && p[1] < -84)) { pen = false; continue; }
      if (pen && Math.abs(x - lx) + Math.abs(y - ly) < .3) continue;
      st += (pen ? "L" : "M") + fx(x) + "," + fx(y); pen = true; lx = x; ly = y;
    }
    fill += "Z";
    if (r.every(p => p[1] > -89.5)) st += "Z";
    if (isAnt) { ice += fill; cIce += st; } else { other += fill; cOther += st; }
  });
  landIce.setAttribute("d", ice); coastIce.setAttribute("d", cIce);
  landOther.setAttribute("d", other); landOtherNow.setAttribute("d", other); coastOther.setAttribute("d", cOther);

    p.style.transition = "none";
    if (!animate || reduce) { p.style.strokeDasharray = ""; p.style.strokeDashoffset = 0; return; }
    const L = sg.len / curS + 4;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.addEventListener("transitionend", () => { p.style.strokeDasharray = ""; }, { once: true });
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${Math.min(2.4, .8 + sg.len / 400)}s cubic-bezier(.45,.05,.3,1)`;
    p.style.strokeDashoffset = 0;
  });
};

const updateMap = animate => {
  const e = cur && cur.e;
  EXP.forEach(x => { x.allPath.style.display = !e ? "" : "none"; });
  if (!e) { gRoutes.replaceChildren(); gMarkers.replaceChildren(); marks = []; for (let i = LABELS.length - 1; i >= 0; i--) if (LABELS[i].mk) LABELS.splice(i, 1); apply(); return; }
  e.stops.forEach((s, i) => {
    const sg = segEls[i]; if (!sg) return;
    const show = i <= cur.i;
    sg.dn.style.display = sg.cs.style.display = show ? "" : "none";
    if (show) drawSeg(sg, animate && i === cur.i);
  });
  marks.forEach(m => { m.cur = m.i === cur.i; m.g.classList.toggle("current", m.cur); m.g.classList.toggle("future", m.i > cur.i); });
  gMarkers.appendChild(marks[cur.i].g);
  apply();
};

/* ---------- Painel: visão geral ---------- */
const Y0 = 1897, Y1 = 1922;
const renderOverview = () => {
  stopPlay();
  const nStops = EXP.reduce((a, e) => a + e.stops.length, 0);
  const rowH = 30, W = 360, padL = 86, padR = 10, H = EXP.length * rowH + 30;
  const xs = y => padL + (y - Y0) / (Y1 - Y0) * (W - padL - padR);
  let tl = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Linha do tempo das expedições">`;
  tl += `<g class="tl-axis">`;
  [1900, 1905, 1910, 1915, 1920].forEach(y => { tl += `<line x1="${xs(y)}" x2="${xs(y)}" y1="0" y2="${H - 18}" stroke-dasharray="2 3"/><text x="${xs(y)}" y="${H - 4}">${y}</text>`; });
  tl += `</g>`;
  EXP.forEach((e, k) => {
    const y = k * rowH + 6;
    const end = e.id === "endurance" ? 1917.1 : e.years[1] + .3;
    tl += `<g class="tl-row" data-k="${k}" tabindex="0" role="button" aria-label="${esc(e.ship)}, ${e.years.join(" a ")}">
      <text x="0" y="${y + 12}">${esc(e.ship)}</text>
      <rect x="${xs(e.years[0] + .6)}" y="${y + 3}" width="${Math.max(4, xs(end) - xs(e.years[0] + .6))}" height="12" rx="6" fill="${e.c}"/>
      ${e.id === "endurance" ? `<circle cx="${xs(1922)}" cy="${y + 9}" r="4" fill="none" stroke="${e.c}" stroke-width="2"/>` : ""}
    </g>`;
  });
  tl += `</svg>`;
  panel.innerHTML = `
    <div class="eyebrow">Era Heroica · 1897–1922</div>
    <h1>Atlas da Antártida</h1>
    <p class="lede">Seis expedições e a corrida ao Polo Sul: Amundsen e seus esquiadores noruegueses, Scott e seus companheiros que não voltaram, Shackleton e os homens da Endurance que voltaram todos. Escolha uma expedição para seguir parada por parada.</p>
    <div class="stats">${EXP.length} expedições · ${nStops} paradas · 25 anos</div>
    <div class="secttl">Linha do tempo</div>
    <div class="tline">${tl}</div>
    <div class="secttl">Expedições</div>
    <div class="explist">${EXP.map(e => `
      <button type="button" class="exp" data-k="${e.k}" style="--c:${e.c}">
        <span class="bar"></span><span class="et">${esc(e.ship)}</span><span class="ey">${e.years[0]}–${String(e.years[1]).slice(2)}</span>
        <span class="el">${esc(e.leader)}</span><span class="es">${esc(e.line)}</span>
      </button>`).join("")}
    </div>
    <p class="note">As rotas seguem os diários e relatos publicados, com posições aproximadas onde as fontes não dão coordenadas. O litoral é o atual (Natural Earth, via Datamaps) e inclui as plataformas de gelo como terra; o recorte das plataformas, as cordilheiras e as reivindicações territoriais são desenhados à mão e esquemáticos. Em 1910, boa parte da costa ainda não tinha sido vista por ninguém.</p>`;
  panel.querySelectorAll(".exp, .tl-row").forEach(b => {
    b.addEventListener("click", () => openExp(+b.dataset.k));
    b.addEventListener("keydown", ev => { if (b.classList.contains("tl-row") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openExp(+b.dataset.k); } });
  });
  panel.scrollTop = 0;
};

/* ---------- Painel: expedição ---------- */
const ICON = {
  prev: '<svg viewBox="0 0 16 16"><path d="M10.5 2.5 4.5 8l6 5.5z"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M5.5 2.5 11.5 8l-6 5.5z"/></svg>',
  play: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>'
};
const renderExp = e => {
  panel.innerHTML = `
    <div class="detail" style="--c:${e.c}">
      <button type="button" class="back" id="back">← Todas as expedições</button>
      <div class="ship"><i></i>${esc(e.ship)} · ${e.years[0]}–${e.years[1]}</div>
      <h1>${esc(e.name)}</h1>
      <div class="lead">${esc(e.leader)}</div>
      <p class="sum">${esc(e.sum)}</p>
      <p class="outcome">${e.outcome}</p>
      <details class="crewbox"><summary>Quem estava lá · ${e.crew.length}</summary>
        <ul class="crew">${e.crew.map(([n, r, lost]) => `<li class="${lost ? "lost" : ""}"><span class="cn">${esc(n)}</span><span class="cr">${esc(r)}</span></li>`).join("")}</ul>
      </details>
      <div class="controls">
        <button type="button" class="cbtn" id="c-prev" aria-label="Parada anterior">${ICON.prev}</button>
        <button type="button" class="cbtn play" id="c-play" aria-label="Reproduzir a viagem">${ICON.play}</button>
        <button type="button" class="cbtn" id="c-next" aria-label="Próxima parada">${ICON.next}</button>
        <div class="prog" id="c-prog"></div>
      </div>
      <ol class="stops" id="stops">${e.stops.map((s, i) => `
        <li class="stop${s.side ? " side" : ""}" data-i="${i}" tabindex="0" role="button" aria-label="${i + 1}. ${esc(s.n)}">
          <span class="num">${i + 1}</span>
          <div class="sn">${esc(s.n)}</div>
          <div class="sm">${esc(s.d)}${s.side ? " · grupo paralelo" : ""}${s.alt ? " · grupo do Aurora" : ""}</div>
          <div class="st">
            <p>${esc(s.s)}</p>
            <p class="today"><b>Hoje.</b> ${esc(s.t)}</p>
            <div class="coords">${fmt(s.at)}${s.km ? ` · trecho de ≈ ${(Math.round(s.km / 10) * 10).toLocaleString("pt-BR")} km` : ""}</div>
          </div>
        </li>`).join("")}
      </ol>
    </div>`;
  panel.querySelector("#back").onclick = closeExp;
  panel.querySelector("#c-prev").onclick = () => { stopPlay(); go(cur.i - 1, false); };
  panel.querySelector("#c-next").onclick = () => { stopPlay(); go(cur.i + 1, true); };
  panel.querySelector("#c-play").onclick = togglePlay;
  panel.querySelectorAll(".stop").forEach(li => {
    li.addEventListener("click", () => { stopPlay(); go(+li.dataset.i, +li.dataset.i === cur.i + 1); if (innerWidth <= 820) box.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); });
    li.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); stopPlay(); go(+li.dataset.i, false); } });
  });
  panel.scrollTop = 0;
};
const updatePanel = () => {
  const e = cur.e;
  panel.querySelectorAll(".stop").forEach((li, i) => { li.classList.toggle("cur", i === cur.i); li.classList.toggle("done", i < cur.i); li.setAttribute("aria-current", i === cur.i ? "step" : "false"); });
  panel.querySelector("#c-prev").disabled = cur.i <= 0;
  panel.querySelector("#c-next").disabled = cur.i >= e.stops.length - 1;
  panel.querySelector("#c-prog").textContent = `${cur.i + 1} de ${e.stops.length}`;
};

const openExp = k => {
  const e = EXP[k];
  e.stops.forEach(s => { if (s.pts) { let a = 0; for (let j = 1; j < s.pts.length; j++) a += hav(s.pts[j - 1], s.pts[j]); s.km = s.approach ? 0 : a; } });
  cur = { e, i: 0 };
  renderExp(e);
  buildExpLayer(e);
  updatePanel();
  curS = clampVB(expView(e)).w / (box.clientWidth || 600);
  updateMap(false);
  animateTo(expView(e), 1000);
  if (innerWidth <= 820) box.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
};
const closeExp = () => {
  stopPlay();
  cur = null;
  renderOverview();
  updateMap(false);
  animateTo(homeView(), 900);
};
const go = (i, animate) => {
  if (!cur || i < 0 || i >= cur.e.stops.length) return;
  cur.i = i;
  const tgt = clampVB(stopView(cur.e, i));
  curS = tgt.w / (box.clientWidth || 600);
  updatePanel();
  updateMap(animate);
  animateTo(tgt, 900);
  const li = panel.querySelector(`.stop[data-i="${i}"]`);
  if (li && innerWidth > 820) { const top = li.offsetTop - 90; if (top < panel.scrollTop || top > panel.scrollTop + panel.clientHeight - 200) panel.scrollTo({ top, behavior: reduce ? "auto" : "smooth" }); }
};
function stopPlay() {
  if (playing) { clearInterval(playing); playing = null; }
  const b = panel.querySelector("#c-play"); if (b) { b.innerHTML = ICON.play; b.setAttribute("aria-label", "Reproduzir a viagem"); }
}
function togglePlay() {
  if (playing) { stopPlay(); return; }
  if (cur.i >= cur.e.stops.length - 1) go(0, false);
  const b = panel.querySelector("#c-play"); b.innerHTML = ICON.pause; b.setAttribute("aria-label", "Pausar");
  const tick = () => { if (cur.i >= cur.e.stops.length - 1) { stopPlay(); return; } go(cur.i + 1, true); };
  tick();
  playing = setInterval(tick, 4200);
}
document.addEventListener("keydown", ev => {
  if (!cur || (ev.target.closest && ev.target.closest("input,textarea,summary"))) return;
  if (ev.key === "ArrowRight") { stopPlay(); go(cur.i + 1, true); }
  if (ev.key === "ArrowLeft") { stopPlay(); go(cur.i - 1, false); }
  if (ev.key === "Escape") closeExp();
});

/* ---------- Camadas ---------- */
const blend = document.getElementById("blend");
const presetBtns = [...document.querySelectorAll(".layers .seg button")];
const setBlend = v => {
  const t = v / 100; blendT = t;
  [seaNow, landOtherNow, gClaims, gNow].forEach(x => x.setAttribute("opacity", t));
  gEra.setAttribute("opacity", 1 - t);
  gShelf.setAttribute("opacity", 1 - .4 * t);
  presetBtns.forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === +v ? "true" : "false"));
  apply();
};
blend.addEventListener("input", () => setBlend(+blend.value));
presetBtns.forEach(b => b.onclick = () => { blend.value = b.dataset.v; setBlend(+b.dataset.v); });

function updateScale(s) {
  const pxPerKm = 1 / KM_PER_UNIT / s;
  const nice = [5, 10, 20, 50, 100, 200, 500, 1000, 2000];
  let km = nice[0]; for (const n of nice) if (n * pxPerKm <= 100) km = n;
  document.getElementById("scalebar").style.width = (km * pxPerKm).toFixed(1) + "px";
  document.getElementById("scaletxt").textContent = km.toLocaleString("pt-BR") + " km";
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { LABELS.forEach(L => L.bb = null); apply(); });

/* ---------- Litoral real: Natural Earth via Datamaps (CDN) ---------- */
const loadmsg = document.getElementById("loadmsg");
const loadScript = src => new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = src; sc.async = true; sc.onload = () => res(); sc.onerror = () => rej(new Error(src)); document.head.appendChild(sc); });
const firstOf = async (srcs, ok) => { for (const s of srcs) { try { await loadScript(s); if (ok()) return true; } catch (_) {} } return ok(); };
const geomRings = g => g.type === "Polygon" ? g.coordinates : g.type === "MultiPolygon" ? g.coordinates.flat() : [];
(async () => {
  try {
    const okT = () => typeof window.topojson === "object" && typeof window.topojson.feature === "function";
    const okD = () => !!(window.Datamap && window.Datamap.prototype && window.Datamap.prototype.worldTopo && window.Datamap.prototype.worldTopo.objects);
    const hasT = await firstOf(["https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js", "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js", "https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"], okT);
    let stubbed = false;
    if (typeof window.d3 === "undefined") { const stub = new Proxy(function () {}, { get: (t, k) => k === Symbol.toPrimitive ? () => "" : stub, apply: () => stub }); window.d3 = stub; stubbed = true; }
    const hasD = hasT && await firstOf(["https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.hires.min.js", "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.hires.min.js", "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.all.hires.min.js", "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"], okD);
    if (stubbed) { try { delete window.d3; } catch (_) { window.d3 = undefined; } }
    if (!hasD) throw new Error("sem dados");
    const topo = window.Datamap.prototype.worldTopo;
    const obj = topo.objects[Object.keys(topo.objects)[0]];
    const feats = window.topojson.feature(topo, obj).features;
    const keep = obj.geometries.filter((g, i) => feats[i] && feats[i].geometry && geomRings(feats[i].geometry).some(r => r.some(p => p[1] < -28)));
    const land = window.topojson.merge(topo, keep);
    const rings = geomRings(land).filter(r => r.some(p => p[1] < -26));
    if (rings.length) setLand(rings);
    LABELS.forEach(L => L.bb = null); apply();
    loadmsg.hidden = true;
  } catch (err) {
    loadmsg.textContent = "Litoral detalhado indisponível agora; o mapa usa um contorno simplificado.";
    setTimeout(() => { loadmsg.hidden = true; }, 5000);
  }
})();

/* ---------- início ---------- */
resize();
vb = clampVB(homeView());
renderOverview();
updateMap(false);
setBlend(0);
})();
</script>
