<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Coleções — Vinis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: loja de discos à noite, direta e calorosa; ferramenta de uso diário
   IDEA: a caixa de discos — capas em fileira, o vinil saindo da capa
   PICTURE: a própria estante de capas; vazio = um disco grande desenhado
   COLOUR: preto vinil, branco de papel, laranja-vermelho de selo, azul de selo como apoio
   TYPE/LAYOUT: Archivo condensado pesado nos títulos, Inter no texto; barra, estante em grade, folhas de baixo */
:root{color-scheme:light dark;--bg:light-dark(#fafaf7,#0f0f10);--card:light-dark(#ffffff,#19191b);--ink:light-dark(#141414,#f2f1ec);--mut:light-dark(#62605a,#a3a19a);--line:light-dark(#e2dfd6,#2c2c30);--ac:#ff4b1f;--ac2:light-dark(#1f3cff,#7d8cff);--vin:#111;--sh:0 1px 2px rgb(0 0 0/.08),0 8px 24px rgb(0 0 0/.10)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;font-stretch:75%;font-weight:850;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(4vw,14px) 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:30px}
.brand small{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;min-height:40px;color:var(--mut);font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tools{margin-top:10px}
.in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.in:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grow{flex:1 1 200px}
main{padding:18px max(4vw,14px);max-width:1240px;margin:0 auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.rec{background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.slv{position:relative;aspect-ratio:1;margin-right:14%}
.slv::before{content:"";position:absolute;inset:3% -14% 3% 30%;border-radius:50%;background:radial-gradient(circle,var(--ac) 0 13%,#000 13.5% 15%,#1c1c1c 15.5%,#0b0b0b 30%,#202020 31%,#0b0b0b 45%,#1d1d1d 46%,#090909 70%);box-shadow:0 2px 8px rgb(0 0 0/.35),inset 0 0 0 1px rgb(255 255 255/.14);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.rec:hover .slv::before,.rec:focus-visible .slv::before{transform:translateX(9%) rotate(40deg)}
.slv img,.slv .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:3px;box-shadow:var(--sh);background:#222}
.ph{display:grid;place-items:center;color:#fff;font:800 22px/1 Archivo,sans-serif;font-stretch:75%;padding:10px;text-align:center;background:linear-gradient(135deg,#2b2b2e,#151517)}
.rec b{display:block;margin-top:9px;font-size:15px;line-height:1.25}
.rec span{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.rec .ck{position:absolute;top:8px;left:8px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgb(0 0 0/.5);border:2px solid #fff;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1}
.rec.sel .ck{background:var(--ac);border-color:var(--ac)}.rec.sel .slv{outline:3px solid var(--ac);outline-offset:3px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--sh);white-space:nowrap;max-width:94vw}
.selbar .lixo{display:flex;gap:8px;align-items:center;border:0;background:var(--ac);color:#fff;border-radius:999px;min-height:48px;padding:0 18px;font-weight:700}.selbar .lixo:disabled{opacity:.4}
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center;padding:30px 0}
.empty h2{font-size:clamp(34px,6vw,52px)}
.empty p{color:var(--mut);max-width:44ch}
.disc{aspect-ratio:1;border-radius:50%;max-width:380px;width:100%;margin:auto;background:radial-gradient(circle,var(--bg) 0 3%,var(--ac) 3.5% 17%,#000 17.5% 19%,#1d1d1d 19.5%,#0a0a0a 32%,#242424 33%,#0a0a0a 47%,#222 48%,#080808 66%,#1a1a1a 67%,#080808 70%);box-shadow:0 20px 50px rgb(0 0 0/.35);animation:gira 9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--ac);color:#fff;border-radius:999px;padding:16px 24px;font:800 18px/1 Archivo,sans-serif;font-stretch:85%;box-shadow:0 10px 30px rgb(255 75 31/.45);display:flex;gap:10px;align-items:center;min-height:56px}
.fab2{position:fixed;right:calc(max(4vw,16px) + 76px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:6;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:12px 16px;min-height:44px;font-weight:600;box-shadow:var(--sh)}
@media(min-width:601px){.fab2{right:calc(max(4vw,16px) + 230px)}}
.camv{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;color:#fff}
.camv[hidden]{display:none}
.camv video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.guia{position:absolute;left:50%;top:calc(45% - 40px);width:min(82vw,62vh);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgb(255 255 255/.85);border-radius:6px;box-shadow:0 0 0 100vmax rgb(0 0 0/.35);pointer-events:none}
.cmsg{z-index:1;position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top));margin:0;text-align:center;font-weight:600;text-shadow:0 1px 3px #000;padding:0 16px}
.camb{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px calc(20px + env(safe-area-inset-bottom));background:#000}
.cbt{background:none;border:1px solid rgb(255 255 255/.4);color:#fff;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.cbt.alt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ac);border:0}
.shut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--ac);flex:none}
.shut:active{transform:scale(.94)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.lk{border:0;background:none;color:var(--ac2);padding:10px 4px}
.btn:disabled{opacity:.5;cursor:default}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgb(0 0 0/.55)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.pan{background:var(--bg);width:min(760px,100%);max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) calc(24px + env(safe-area-inset-bottom));animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(30px);opacity:.4}}
@media(min-width:800px){.sheet.on{align-items:center}.pan{border-radius:18px}}
.ph-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph-h h2{font-size:28px;margin-right:auto}
.x{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{color:inherit;font:inherit;width:100%;cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:grid;gap:6px;place-items:center;min-height:150px;background:var(--card);position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{font-family:Archivo,sans-serif;font-stretch:80%;font-size:20px}
.drop span{color:var(--mut);font-size:14px}
.note{color:var(--mut);font-size:14px}
.st{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin:10px 0;font-size:15px}
.st.err{border-color:var(--ac)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:gira .8s linear infinite;flex:none}
.prev{display:flex;gap:12px;align-items:center;margin:12px 0}
.prev img{width:84px;height:84px;object-fit:cover;border-radius:6px}
.cands{display:grid;gap:8px;margin:12px 0}
.cand{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;width:100%}
.cand:hover{border-color:var(--ac)}
.cand img{width:64px;height:64px;border-radius:4px;object-fit:cover;flex:none;background:#222}
.cand b{display:block;line-height:1.25}
.cand span{color:var(--mut);font-size:14px}.dg h3{font-size:20px;margin:14px 0 6px}.dg{margin-top:8px}.nenhum{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:12px}.nenhum .btn{flex:none}.cand span.onde{display:block;font-size:12px;margin-top:2px;color:var(--ac2,var(--mut))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.det{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:start}
.det .slv{margin-right:16%}
.det h2{font-size:clamp(28px,5vw,40px)}
.det .who{font-size:18px;font-weight:600;margin:4px 0 2px}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.plat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-decoration:none;font-weight:600;min-height:48px}
.plat i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgb(127 127 127/.5)}
.plat small{margin-left:auto;color:var(--mut);font-weight:400;font-size:12px}
.plat:hover{border-color:var(--ink)}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label.f .in{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.form .w{grid-column:1/-1}
.lists{display:grid;gap:10px}
.list{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;width:100%;text-align:left}
.stack4{display:grid;grid-template-columns:1fr 1fr;width:76px;height:76px;flex:none;border-radius:4px;overflow:hidden;background:#222}
.stack4 img{width:100%;height:100%;object-fit:cover}
.list h3{font-size:22px}
.list.art{cursor:pointer}.list.art:hover{border-color:var(--ink)}
.alfa{font-family:inherit;font-size:13px;letter-spacing:.12em;color:var(--mut);margin:18px 0 6px}
.list span{color:var(--mut);font-size:14px}
.set{display:grid;gap:14px;max-width:640px}
.set section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.set h3{font-size:22px;margin-bottom:6px}
.set p{margin:.4em 0;color:var(--mut);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-weight:600;display:none;max-width:90vw}
.cnt{color:var(--mut);font-size:14px;margin:0 0 14px}
code{overflow-wrap:anywhere;font-size:14px}
@media(max-width:600px){.brand h1{font-size:26px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}.empty,.det,.pick{grid-template-columns:minmax(0,1fr)}.det .slv{max-width:240px}.form{grid-template-columns:minmax(0,1fr)}.tabs{width:100%}.tabs button{flex:1}.fab span{display:none}.fab{padding:16px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.passos{scroll-margin-top:130px}.passos details{border-top:1px solid var(--line);padding:10px 0}.passos details:last-child{padding-bottom:0}.passos summary{cursor:pointer;font-weight:600;color:var(--ink)}.passos ol,.passos ul{padding-left:22px;margin:8px 0}.passos li{margin:6px 0;line-height:1.45}.passos code{font-family:ui-monospace,monospace;background:color-mix(in srgb,var(--line) 60%,transparent);padding:1px 5px;border-radius:5px}.passos a{word-break:break-all}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><h1>Vinis</h1><small id="sub">Coleções</small><a href="../livros/" title="Coleção de livros" style="font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px">Livros ↗</a></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="estante" aria-selected="true">Estante</button>
      <button role="tab" data-v="artistas" aria-selected="false">Artistas</button>
      <button role="tab" data-v="listas" aria-selected="false">Listas</button>
      <button role="tab" data-v="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </div>
  <div class="row tools" id="tools">
    <input class="in grow" id="q" type="search" placeholder="Buscar artista, disco, ano, gravadora…" aria-label="Buscar na coleção">
    <select class="in" id="ord" aria-label="Ordem">
      <option value="recentes">Mais recentes</option>
      <option value="artista">Artista A–Z</option>
      <option value="album">Disco A–Z</option>
      <option value="ano">Ano</option>
    </select>
    <select class="in" id="flt" aria-label="Lista"><option value="">Todas as listas</option></select>
    <button class="btn" id="selB" type="button">Selecionar</button>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab" type="button" aria-label="Adicionar disco"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><span>Fotografar disco</span></button>
<div class="camv" id="camV" hidden role="dialog" aria-label="Câmera">
  <video id="camVid" playsinline muted autoplay></video><div class="guia" id="camGuia"></div>
  <p class="cmsg" id="camMsg">Enquadre a capa no quadrado</p>
  <div class="camb"><button type="button" class="cbt" id="camX">Fechar</button><button type="button" class="shut" id="camS" aria-label="Tirar foto"></button>
  <label class="cbt">Galeria<input type="file" accept="image/*" id="camG" hidden></label></div>
  <label class="cbt alt" id="camAlt" hidden>Usar a câmera do celular<input type="file" accept="image/*" capture="environment" id="cam" hidden></label>
</div>
<button class="fab2" id="fab2" type="button" aria-label="Adicionar digitando o nome">Digitar</button>

<!-- Adicionar -->
<div class="sheet" id="sAdd" role="dialog" aria-modal="true" aria-labelledby="tAdd"><div class="pan">
  <div class="ph-h"><h2 id="tAdd">Novo disco</h2><button class="x" data-close aria-label="Fechar">×</button></div>
  <div id="addBody"></div>
</div></div>

<!-- Detalhe -->
<div class="sheet" id="sDet" role="dialog" aria-modal="true"><div class="pan"><div class="ph-h"><span style="margin-right:auto"></span><button class="x" data-close aria-label="Fechar">×</button></div><div id="detBody"></div></div></div>

<div class="toast" id="toast" role="status"></div>

<script src="../lib/colecoes-sync.js"></script>
<script>
{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u||'')?u:'';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toast=(t,ms=2600)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)};
const AJ_KEY='colecoes-ajustes-v1';
const TIDAL_ID_PADRAO='j0HQzvMChBaLAKlO';
let AJ={ia:'',chave:'',modelo:'',pais:'BR',plataforma:'tidal',servico:'tidal',tidalId:TIDAL_ID_PADRAO,tidalColecao:true,spotifyId:''};
try{Object.assign(AJ,JSON.parse(localStorage.getItem(AJ_KEY)||'{}'))}catch(e){}
const saveAJ=()=>{try{localStorage.setItem(AJ_KEY,JSON.stringify(AJ))}catch(e){}};
if(!AJ.chave){try{const v=JSON.parse(localStorage.getItem('colecoes-livros-ajustes-v1')||'{}');if(v.chave&&v.ia){AJ.ia=v.ia;AJ.chave=v.chave;AJ.modelo=v.modelo||'';saveAJ()}}catch(e){}}
if(!AJ.tidalId){AJ.tidalId=TIDAL_ID_PADRAO;saveAJ()}
if(!AJ.v){AJ.plataforma='tidal';AJ.servico='tidal';if(AJ.tidalColecao==null)AJ.tidalColecao=true;AJ.v=2;saveAJ()}

/* ---------- banco (IndexedDB) ---------- */
const DB={db:null,
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('colecoes',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('discos',{keyPath:'id'});d.createObjectStore('listas',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
  all(s){return new Promise((ok,no)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  put(s,v){return new Promise((ok,no)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
  del(s,k){return new Promise((ok,no)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
};
let DISCOS=[],LISTAS=[];
const load=async()=>{DISCOS=await DB.all('discos');LISTAS=await DB.all('listas');LISTAS.sort((a,b)=>a.nome.localeCompare(b.nome))};

/* ---------- plataformas ---------- */
const PLAT=[
  ['tidal','Tidal','#888888',q=>`https://listen.tidal.com/search/albums?q=${encodeURIComponent(q)}`],
  ['spotify','Spotify','#1db954',q=>`https://open.spotify.com/search/${encodeURIComponent(q)}/albums`],
  ['appleMusic','Apple Music','#fa2d48',q=>`https://music.apple.com/br/search?term=${encodeURIComponent(q)}`],
  ['youtubeMusic','YouTube Music','#ff0033',q=>`https://music.youtube.com/search?q=${encodeURIComponent(q)}`],
  ['deezer','Deezer','#a238ff',q=>`https://www.deezer.com/search/${encodeURIComponent(q)}/album`],
  ['amazonMusic','Amazon Music','#25d1da',q=>`https://music.amazon.com.br/search/${encodeURIComponent(q)}`],
  ['discogs','Discogs (prensagens)','#e8e8e8',q=>`https://www.discogs.com/search/?q=${encodeURIComponent(q)}&type=all&format_exact=Vinyl`]
];
const DIGITAIS=['tidal','spotify','appleMusic','deezer','youtubeMusic','amazonMusic'];
const semVersao=d=>!DIGITAIS.some(k=>(d.links||{})[k]);
/* Discogs: busca de prensagens em vinil (precisa de um token pessoal grátis, em Ajustes) */
async function buscaDiscogs(d,q){const t=(AJ.discogsToken||'').trim();if(!t){const e=new Error('sem token');e.semToken=true;throw e}
  const um=async P=>{P.set('type','release');P.set('format','Vinyl');P.set('per_page','25');
    const r=await timeoutFetch('https://api.discogs.com/database/search?'+P,{headers:{Authorization:'Discogs token='+t}},15000);const j=await r.json().catch(()=>({}));

function pegaJSON(t){t=String(t||'').replace(/```(?:json)?/gi,'').trim();

  const s=t.slice(i),j=s.lastIndexOf('}');if(j>=0){try{return JSON.parse(s.slice(0,j+1))}catch(e){}}
  /* resposta cortada no meio: resgata os campos que vieram inteiros */
  const o={};for(const k of CAMPOS_IA){const m=s.match(new RegExp('"'+k+'"\\s*:\\s*("(?:[^"\\\\]|\\\\.)*"|-?[0-9.]+)'));if(m){try{o[k]=JSON.parse(m[1])}catch(e){}}}

async function identificarIA(b64,aviso=()=>{},sinal){const fim=Date.now()+90000;
  if(/^AIza/.test(AJ.chave))AJ.ia='gemini';else if(/^sk-ant-/.test(AJ.chave))AJ.ia='anthropic';

  let ult='';
  for(let volta=0;volta<3;volta++){let ocupado=false;
    if(volta){aviso('Tentando de novo com a mesma foto…');await new Promise(ok=>setTimeout(ok,2500*volta))}

    <section class="passos" id="guiaChave"><h3>Como criar a chave de IA — passo a passo</h3>
      <p>A chave é uma senha que deixa o app usar a IA do Google ou da Anthropic para reconhecer as capas. Você cria uma vez, cola aqui e pronto. A mesma chave serve para os Vinis e para os Livros.</p>
      <details open><summary>Qual escolher?</summary>
        <ul>
          <li><b>Google Gemini — recomendado.</b> Grátis, sem cartão de crédito, só precisa de uma conta Google (a do Gmail serve). O plano grátis tem um limite de uso por dia que dá folgado para fotografar a coleção; se passar, ele só pede para esperar até o dia seguinte. No plano grátis o Google pode usar o que é enviado para melhorar os produtos dele — para fotos de capas, não faz diferença.</li>

        </ul></details>
      <details><summary>Google Gemini (grátis) — 5 passos</summary>
        <ol>
          <li>Abra <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">https://aistudio.google.com/apikey</a> (funciona no celular ou no computador).</li>
          <li>Entre com sua conta Google. Na primeira vez aparece uma tela de termos: marque a caixa de concordância e toque em <b>Continuar</b>. Se pedir o país, escolha Brasil.</li>
          <li>Toque em <b>Create API key</b> (Criar chave de API). Se ele perguntar o projeto, escolha <b>Create API key in new project</b> (criar num projeto novo) ou o projeto que já aparecer. Em contas novas a chave às vezes já vem criada na lista (“Default Gemini API Key”) — pode usar essa.</li>
          <li>Copie a chave com o ícone de copiar ao lado dela. Ela começa com <code>AIza</code> e tem 39 caracteres.</li>
          <li>Volte para cá, toque em <b>Colar a chave</b> e depois em <b>Testar a chave</b>. Deve aparecer “✓ Chave funcionando”.</li>
        </ol>
        <p class="note">Não precisa ativar faturamento (“Billing”) nem cadastrar cartão. Sem cartão, nunca há cobrança.</p></details>
      <details><summary>Anthropic / Claude (pago) — 5 passos</summary>
        <ol>
          <li>Abra <a href="https://platform.claude.com" target="_blank" rel="noopener">https://platform.claude.com</a> (o antigo console.anthropic.com leva para lá) e crie a conta ou entre — dá para entrar com o Google.</li>
          <li>Compre créditos: vá em <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">Settings → Billing</a>, toque em <b>Buy credits</b>, cadastre o cartão e escolha o valor (US$ 5 dá para milhares de capas). Se não quiser cobranças automáticas, deixe a recarga automática (<i>auto-reload</i>) desligada.</li>
          <li>Vá em <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Settings → API keys</a> e toque em <b>Create key</b>. Dê um nome (por exemplo “Coleções”) e confirme.</li>
          <li>Copie a chave <b>na hora</b>: ela começa com <code>sk-ant-</code> e só é mostrada uma vez. Se perder, apague essa e crie outra.</li>
          <li>Volte para cá, toque em <b>Colar a chave</b> e depois em <b>Testar a chave</b>.</li>
        </ol></details>
      <details><summary>Se der erro</summary>
        <ul>
          <li><b>“A chave não é válida”</b> — quase sempre foi copiada pela metade ou com um espaço. Copie de novo pelo ícone de copiar e cole outra vez.</li>
          <li><b>“O Google bloqueou essa chave por segurança”</b> — a chave apareceu em algum lugar público e o Google a desligou. Crie uma nova no mesmo endereço. Nunca mande a chave por mensagem nem poste em lugar nenhum.</li>
          <li><b>“Muitos pedidos” / limite</b> — no Gemini grátis é o limite do dia ou do minuto. Espere um pouco; no dia seguinte volta.</li>
          <li><b>“Sem crédito”</b> (Anthropic) — o saldo acabou. Compre mais em Settings → Billing.</li>
          <li><b>O botão Colar não funciona</b> — alguns navegadores bloqueiam. Toque e segure dentro do campo Chave e escolha “Colar”.</li>
        </ul></details>
      <details><summary>Onde a chave fica guardada</summary>
        <p>Só neste aparelho e neste navegador. O app manda as fotos direto para o Google ou a Anthropic, sem passar por nenhum outro servidor. Em outro aparelho (celular e computador, por exemplo), cole a mesma chave nos Ajustes de lá. Para cancelar, apague a chave no site onde ela foi criada.</p></details>

function passo1(){$('#addBody').innerHTML=`<div class="pick">
  <button type="button" class="drop" data-cam="capa"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><b>Foto da capa</b><span>${AJ.ia?'A IA reconhece o disco':'Sem chave de IA: digite o nome depois'}</span></button>
  <button type="button" class="drop" data-cam="verso"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg><b>Código de barras</b><span>Foto do verso, onde tem o código</span></button></div>
  <div class="row" style="margin-top:14px"><input class="in grow" id="nome" placeholder="Ou digite: artista e nome do disco"><button class="btn pri" id="bus">Buscar</button></div>
  ${AJ.ia?'':'<p class="note">Dica: com uma chave de IA (grátis no Gemini) o app reconhece a capa sozinho. <a href="#" data-goto="ajustes">Configurar</a></p>'}<div id="res"></div>`;
  $('#addBody').querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>camera(b.dataset.cam));
  const go=()=>{const q=$('#nome').value.trim();if(q)procurar(q)};$('#bus').onclick=go;$('#nome').onkeydown=e=>{if(e.key==='Enter')go()}}
const status=(t,tipo='')=>{$('#res').innerHTML=`<div class="st ${tipo}">${tipo?'':'<span class="spin"></span>'}<span>${esc(t)}</span></div>`};
async function foto(file,lado){let c;try{c=await lerImagem(file,1400)}catch(e){return status('Não consegui abrir essa foto.','err')}
  if(lado==='capa'||!ADD.foto)ADD.foto=quadrado(c,420);
  const prev=`<div class="prev"><img src="${ADD.foto}" alt=""><span class="note">Foto ${lado==='capa'?'da capa':'do verso'}</span></div>`;
  status('Procurando código de barras…');const code=await codigoDeBarras(c);
  if(code){status('Código '+code+' — consultando o MusicBrainz…');try{const m=await musicbrainzBarcode(code);if(m){ADD.palpite=m;$('#nome').value=`${m.artista} ${m.album}`;return procurar(`${m.artista} ${m.album}`,prev)}}catch(e){}}
  if(AJ.ia&&AJ.chave){status('A IA está olhando a foto…');try{const b64=c.toDataURL('image/jpeg',.85).split(',')[1];const ctl=new AbortController();const st=t=>{status(t);const bt=document.createElement('button');bt.className='btn lk';bt.textContent='Parar e digitar o nome';bt.onclick=()=>ctl.abort();$('#res .st').appendChild(bt)};st('A IA está olhando a foto…');ADD.ctl=ctl;
      const r=await identificarIA(b64,st,ctl.signal);if(ADD.ctl!==ctl)return;
      if(r&&(r.album||r.artista)){ADD.palpite=r;$('#nome').value=[r.artista,r.album].filter(Boolean).join(' ');return procurar($('#nome').value,prev,r)}
      status('A IA não conseguiu ler essa foto.','err');deNovo(file,lado)}catch(e){if(e.message==='parado')status('Digite o artista e o nome do disco acima e toque em Buscar.','err');else{status('A IA não conseguiu agora: '+e.message+'.','err');deNovo(file,lado)}}}
  else status(lado==='verso'&&!('BarcodeDetector' in window)?'Este navegador não lê código de barras (funciona no Chrome do Android). Digite o nome acima.':'Digite o artista e o nome do disco acima e toque em Buscar.','err');
  $('#res').insertAdjacentHTML('afterbegin',prev);if(!$('#deNovo'))$('#nome').focus()}
function deNovo(file,lado){const st=$('#res .st');if(!st)return;st.insertAdjacentHTML('afterend','<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0"><button class="btn" id="deNovo">Tentar de novo com esta foto</button></div><p class="note" style="margin-top:8px">Dica: foto de frente, sem reflexo do plástico, pegando a capa inteira. Digitar o nome fica como último recurso.</p>');
  $('#deNovo').onclick=()=>foto(file,lado)}
async function procurar(q,prev='',ia=null){status('Buscando “'+q+'” no '+['Tidal','Spotify','Apple Music','Deezer','MusicBrainz'].filter(n=>n==='Tidal'?TD.on:n==='Spotify'?SP.on:true).join(', ')+'…');let l=[];try{l=await buscar(q)}catch(e){}
  ADD.cands=l;const alt=(ia?.alternativas||[]).filter(a=>a&&a.album);
  $('#res').innerHTML=prev+(ia?`<p class="note">A IA acha que é <b>${esc(ia.album)}</b> — ${esc(ia.artista)}${ia.ano?' ('+esc(ia.ano)+')':''}${typeof ia.confianca==='number'?` · certeza ${Math.round(ia.confianca*100)}%`:''}. Escolha a versão certa:</p>`:'<p class="note">Escolha a versão certa:</p>')+
   (alt.length?`<div class="chips">${alt.map((a,i)=>`<button class="chip" data-alt="${i}">${esc(a.artista)} — ${esc(a.album)}</button>`).join('')}</div>`:'')+
   `<div class="cands">${l.map((c,i)=>`<button class="cand" data-c="${i}"><img src="${esc(safeUrl(c.capa))}" alt="" loading="lazy"><div><b>${esc(c.album)}</b><span>${esc(c.artista)}${c.ano?' · '+esc(c.ano):''}${c.faixas?' · '+esc(c.faixas)+' faixas':''}</span><span class="onde">${esc(Object.keys(c.links||{}).map(p=>NOME_PLAT[p]||p).join(' · '))}</span></div></button>`).join('')||'<p class="note">Nada encontrado em nenhuma plataforma. Confira o nome acima ou salve assim mesmo.</p>'}</div>
   <div class="nenhum"><button class="btn pri" id="manual">Nenhum desses</button><span class="note">Guarda o disco com ${ia?"o que a IA reconheceu":"o nome digitado"} e a sua foto, sem ligar a nenhuma versão digital errada. Os botões das plataformas abrem a busca pelo nome.</span></div>`;
  $('#res').onclick=e=>{const b=e.target.closest('[data-c],[data-alt],#manual');if(!b)return;if(b.id==='manual')return confirmar(null);if(b.dataset.alt!=null){const a=alt[+b.dataset.alt];$('#nome').value=`${a.artista} ${a.album}`;return procurar($('#nome').value,prev,ia)}confirmar(l[+b.dataset.c])}}
async function confirmar(c){const p=ADD.palpite||{};semDigital=!c;const t=$('#nome').value.trim();
  const d={id:uid(),criado:Date.now(),tipo:'vinil',...(c?{}:{semDigital:true}),artista:c?.artista||p.artista||'',album:c?.album||p.album||t,ano:c?.ano||p.ano||'',gravadora:p.gravadora||'',genero:c?.genero||'',faixas:c?.faixas||'',capa:safeUrl(c?.capa),foto:ADD.foto||'',formato:'LP 12"',estado:'',obs:'',listas:[],links:{}};
  if(c){status('Encontrando o disco no Tidal, Spotify, YouTube Music…');d.links=c.urls.length?await odesli(c.urls):{};for(const[k,v]of Object.entries(c.links||{}))if(!d.links[k]&&safeUrl(v))d.links[k]=v}
  const achou=PLAT.slice(0,6).filter(p=>d.links[p[0]]).map(p=>p[1]);
  $('#addBody').innerHTML=`<div class="det"><div class="slv">${capaHTML(d)}</div><div><h2>${esc(d.album)}</h2><p class="who">${esc(d.artista)}</p><p class="note">${achou.length?'Encontrado em: '+esc(achou.join(', ')):'Sem links diretos — os botões vão abrir a busca em cada plataforma.'}</p></div></div>
   <h3 style="font-size:20px;margin:14px 0 4px">Adicionar às listas</h3><div class="chips" id="cL">${LISTAS.map(l=>`<button class="chip" data-l="${esc(l.id)}">${esc(l.nome)}</button>`).join('')}<button class="chip" data-nl>+ nova lista</button></div>
   <div class="form"><label class="f">Formato<select class="in" id="nF">${['LP 12"','Duplo','Compacto 7"','EP','10"','Box'].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="f">Estado<select class="in" id="nE">${['','Novo / lacrado','Ótimo','Bom','Regular','Ruim'].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>
   <label class="f w">Observações<input class="in" id="nO" placeholder="prensagem, onde comprou…"></label></div>
   <div class="row"><button class="btn ac" id="nS">Guardar na coleção</button>${d.capa&&d.foto?'<label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nP"> usar a minha foto como capa</label>':''}<button class="btn lk" id="nV">Voltar</button></div>`;
  const sel=new Set();
  $('#cL').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-nl')){const n=await perguntar('Nome da nova lista');if(!n)return;const l={id:uid(),nome:n,criado:Date.now()};await DB.put('listas',l);await load();sel.add(l.id);b.insertAdjacentHTML('beforebegin',`<button class="chip on" data-l="${esc(l.id)}">${esc(n)}</button>`);return}const id=b.dataset.l;sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('on')};
  $('#nV').onclick=passo1;
  $('#nS').onclick=async()=>{d.formato=$('#nF').value;d.estado=$('#nE').value;d.obs=$('#nO').value.trim();d.listas=[...sel];if($('#nP')?.checked)d.capa='';
    await DB.put('discos',d);await load();fechar($('#sAdd'));VISTA='estante';render();toast(`“${d.album}” entrou na coleção`);if(TD.on&&AJ.tidalColecao!==false&&!semDigital){try{toast(await TD.colecao(d)?`“${d.album}” entrou na coleção e no Tidal`:'Guardado aqui — não achei esse disco no Tidal',3500)}catch(e){toast('Tidal: '+e.message,5000)}}
    for(const l of d.listas)autoPlaylist(d,l)}}

/* ---------- listas: ações ---------- */
async function acaoLista(e){const b=e.target.closest('button');if(!b)return;const g=k=>LISTAS.find(l=>l.id===b.dataset[k]);
  if(b.id==='addL'){const n=$('#novaL').value.trim();if(!n)return;await DB.put('listas',{id:uid(),nome:n,criado:Date.now()});await load();return render()}
  if(b.dataset.verl){VISTA='estante';render();$('#flt').value=b.dataset.verl;return render()}
  if(b.dataset.copl){const l=g('copl');const t=DISCOS.filter(d=>(d.listas||[]).includes(l.id)).map(d=>`${d.artista} — ${d.album}${d.ano?' ('+d.ano+')':''}\n${linkFor(d,PLAT.find(p=>p[0]===AJ.plataforma)||PLAT[0]).url}`).join('\n\n');
    return navigator.clipboard.writeText(`${l.nome}\n\n${t}`).then(()=>toast('Lista copiada com os links'),()=>toast('Não deu para copiar'))}
  if(b.dataset.renl){const l=g('renl');const n=await perguntar('Novo nome',l.nome);if(n){l.nome=n;await DB.put('listas',l);await load();render()}return}
  if(b.dataset.dell){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmar?';return}const l=g('dell');for(const d of DISCOS)if((d.listas||[]).includes(l.id)){d.listas=d.listas.filter(x=>x!==l.id);await DB.put('discos',d)}await DB.del('listas',l.id);await load();return render()}
  if(b.dataset.spl){const S=SERV();if(!S.on){toast(`Conecte o ${S.nome} em Ajustes primeiro`,3500);VISTA='ajustes';return render()}const l=g('spl');b.disabled=true;b.textContent='Enviando…';
    try{const r=await S.sincronizar(l);await load();render();toast(`Playlist “${l.nome}”: ${r.faixas} faixas${r.sem?` · ${r.sem} disco(s) não achado(s) no ${S.nome}`:''}`,4500)}catch(err){b.disabled=false;b.textContent='Tentar de novo';toast(S.nome+': '+err.message,5000)}}}

/* ---------- eventos ---------- */
/* segurar o dedo num disco liga a seleção já com ele marcado */
let PRESSAO=false,_tp=null;
document.addEventListener('pointerdown',e=>{PRESSAO=false;const r=e.target.closest('.rec');if(!r||SEL)return;clearTimeout(_tp);const x=e.clientX,y=e.clientY;
  _tp=setTimeout(()=>{PRESSAO=true;SEL=new Set([r.dataset.id]);render();navigator.vibrate?.(30)},550);
  const fim=ev=>{if(ev.type!=='pointermove'||Math.hypot(ev.clientX-x,ev.clientY-y)>10){clearTimeout(_tp);removeEventListener('pointermove',fim);removeEventListener('pointerup',fim);removeEventListener('pointercancel',fim)}};
  addEventListener('pointermove',fim);addEventListener('pointerup',fim);addEventListener('pointercancel',fim)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.rec'))e.preventDefault()});
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-close]'))return fechar(t.closest('.sheet'));
  if(t.classList.contains('sheet')&&(t.id==='sAdd'||t.id==='sDet'))return fechar(t);
  const g=t.closest('[data-goto]');if(g){e.preventDefault();fechar($('#sAdd'));fechar($('#sDet'));REV=null;VISTA=g.dataset.goto;return render()}
  if(t.closest('[data-add]'))return camera();
  if(t.closest('[data-nome]'))return $('#fab2').click();
  if(t.closest('[data-revdg]')){REV=filtrados().map(d=>d.id);return REV.length&&detalhe(REV[0])}
  if(t.closest('#selB'))return selecao(!SEL);
  if(t.closest('[data-selx]'))return selecao(false);
  const lx=t.closest('[data-lixo]');if(lx&&SEL&&SEL.size){if(!lx.dataset.ok){lx.dataset.ok=1;lx.querySelector('span').textContent=`Tirar ${SEL.size}? Toque de novo`;return}
    (async()=>{const ids=[...SEL];for(const id of ids)await DB.del('discos',id);SEL=null;await load();render();toast(ids.length===1?'Disco tirado da coleção':ids.length+' discos tirados da coleção')})();return}
  const r=t.closest('.rec');if(r){if(PRESSAO){PRESSAO=false;return}if(SEL){const id=r.dataset.id;SEL.has(id)?SEL.delete(id):SEL.add(id);return render()}return detalhe(r.dataset.id)}
  const tab=t.closest('.tabs button');if(tab){VISTA=tab.dataset.v;ARTISTA=null;SEL=null;return render()}
  if(VISTA==='artistas'&&t.closest('#main')){const a=t.closest('[data-art]');if(a){ARTISTA=a.dataset.art;scrollTo(0,0);return render()}
    if(t.closest('[data-voltart]')){ARTISTA=null;return render()}
    if(t.closest('[data-copart]')){const g=artistas().find(x=>x.k===ARTISTA);if(!g)return;const tx=g.discos.map(d=>`${d.album}${d.ano?' ('+d.ano+')':''}\n${linkFor(d,PLAT.find(p=>p[0]===AJ.plataforma)||PLAT[0]).url}`).join('\n\n');
      return navigator.clipboard.writeText(`${g.nome}\n\n${tx}`).then(()=>toast('Discos copiados com os links'),()=>toast('Não deu para copiar'))}}
  if(VISTA==='listas'&&t.closest('#main'))acaoLista(e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.art){ARTISTA=e.target.dataset.art;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#camV').hidden)return fecharCam();if(e.key==='Escape')document.querySelectorAll('.sheet.on').forEach(fechar)});
$('#fab').onclick=()=>camera('capa');
['q','ord','flt'].forEach(i=>$('#'+i).addEventListener('input',render));

(async()=>{try{await DB.open();await load()}catch(e){toast('Este navegador não deixou guardar dados',5000)}setTimeout(capasDiscogs,4000);try{SYNC=window.ColecoesSync.criar({app:'vinis',DB,itens:'discos',listas:'listas',aviso:toast,aoMudar:async()=>{await load();render()}});SYNC.painel(document.getElementById('syncBox'))}catch(e){}
  const st=new URLSearchParams(location.search).get('state');if(st==='tidal')await TD.retorno();else await SP.retorno();render();
  if(location.hash==='#novo')novo()})();
}
</script>
</body>
</html>
