<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Granizo — Collatz</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#cfd6dd}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:5;cursor:pointer;transition:opacity 2.5s}
  #start h1{font-weight:200;letter-spacing:.5em;font-size:22px;margin:0 0 0 .5em;color:#e8edf2}
  #start p{font-weight:300;font-size:12px;letter-spacing:.25em;opacity:.45;margin:0}
  #start.hide{opacity:0;pointer-events:none}
  #num{position:fixed;left:28px;top:22px;font-weight:200;font-size:28px;letter-spacing:.08em;opacity:0;transition:opacity .6s;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
  #num.on{opacity:.55}
  #op{position:fixed;left:30px;top:62px;font-weight:300;font-size:17px;letter-spacing:.06em;opacity:0;transition:opacity .6s;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2;white-space:nowrap}
  #op.on{opacity:.75}
  #op .par{color:#8fb3cc}
  #op .imp{color:#d8f0ff}
  #seq{position:fixed;left:30px;top:96px;right:60px;max-height:40%;font-weight:300;font-size:12.5px;line-height:1.75;letter-spacing:.03em;opacity:0;transition:opacity .6s;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2;overflow:hidden}
  #seq.cheio{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38px);mask-image:linear-gradient(to bottom,transparent 0,#000 38px)}
  #seq span.o{white-space:nowrap;margin-right:1.4em;display:inline-block}
  #seq.on{opacity:.45}
  #seq b{font-weight:500;opacity:1}
  #seq .up{color:#bfe4ff}
  #dot{position:fixed;right:14px;top:14px;width:30px;height:30px;border-radius:50%;z-index:4;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.18;transition:opacity .4s}
  #dot:hover{opacity:.7}
  #dot::after{content:"";width:5px;height:5px;border-radius:50%;background:#fff}
  #panel{position:fixed;right:14px;top:52px;width:260px;max-height:calc(100% - 70px);overflow:auto;background:rgba(10,12,16,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;z-index:4;font-size:12px;display:none}
  #panel.on{display:block}
  #panel h2{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin:14px 0 8px}
  #panel h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  .row label{opacity:.8;flex:0 0 92px}
  .row input[type=range]{flex:1;accent-color:#9fb8d0}
  .row select,.row input[type=number]{flex:1;background:#151a21;color:#cfd6dd;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 6px;font-size:12px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .btns button{flex:1;background:#151a21;color:#cfd6dd;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 4px;font-size:11px;cursor:pointer}
  .btns button:active{background:#232b36}
  .hint{opacity:.4;font-size:10.5px;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="num" class="on"></div><div id="op" class="on"></div><div id="seq" class="on"></div>
<div id="start"><h1>GRANIZO</h1><p>toque para começar</p></div>
<div id="dot" title="Controles (M)"></div>
<div id="panel">
  <h2>Números</h2>
  <div class="row"><label>Origem</label>
    <select id="mode">
      <option value="seq" selected>Contagem (2, 3, 4…)</option>
      <option value="rand">Acaso</option>
      <option value="rec">Recordes (27, 97, 871…)</option>
    </select></div>
  <div class="row"><label>Tocar número</label><input type="number" id="seedIn" min="2" placeholder="ex.: 27"></div>
  <div class="row"><label>Velocidade</label><input type="range" id="speed" min="0.6" max="14" step="0.1" value="3"></div>
  <div class="row"><label>Pausa no 1</label><input type="range" id="gap" min="0.5" max="10" step="0.1" value="3.5"></div>
  <h2>Som</h2>
  <div class="row"><label>Modo</label>
    <select id="scale">
      <option value="jonico">Jônico (maior)</option>
      <option value="dorico" selected>Dórico</option>
      <option value="frigio">Frígio</option>
      <option value="lidio">Lídio</option>
      <option value="mixolidio">Mixolídio</option>
      <option value="eolio">Eólio (menor)</option>
      <option value="locrio">Lócrio</option>
      <option value="menorHarm">Menor harmônica</option>
      <option value="menorMel">Menor melódica</option>
      <option value="frigioDom">Frígio dominante</option>
      <option value="hungara">Húngara menor</option>
      <option value="penta">Pentatônica menor</option>
      <option value="pentaMaior">Pentatônica maior</option>
      <option value="hirajoshi">Hirajoshi</option>
      <option value="tons">Tons inteiros</option>
    </select></div>
  <div class="row"><label>Volume</label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.75"></div>
  <div class="row"><label>Drone</label><input type="range" id="drone" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="row"><label>Troca de timbre</label><input type="range" id="xfade" min="0.5" max="30" step="0.5" value="10"></div>
  <div class="row"><label>Reverb</label><input type="range" id="verb" min="0" max="1" step="0.01" value="0.55"></div>
  <h2>Imagem</h2>
  <div class="row"><label>Curva par</label><input type="range" id="aEven" min="0" max="0.5" step="0.005" value="0.135"></div>
  <div class="row"><label>Curva ímpar</label><input type="range" id="aOdd" min="0" max="0.8" step="0.005" value="0.27"></div>
  <div class="row"><label>Inclinação</label><input type="range" id="tilt" min="-1.2" max="1.2" step="0.01" value="0"></div>
  <div class="row"><label>Zoom</label><input type="range" id="zoom" min="0.3" max="3" step="0.01" value="1"></div>
  <div class="row"><label>Memória</label><input type="range" id="mem" min="0" max="1" step="0.01" value="0.9"></div>
  <div class="row"><label>Cor</label>
    <select id="color">
      <option value="gelo" selected>Gelo</option>
      <option value="arco">Arco-íris</option>
      <option value="brasa">Brasa</option>
      <option value="branco">Branco</option>
    </select></div>
  <div class="row"><label>Mostrar número</label><input type="checkbox" id="showNum" checked></div>
  <div class="row"><label>Gráfico</label><input type="checkbox" id="graph" checked></div>
  <div class="btns">
    <button id="bClear">Limpar coral</button>
    <button id="bFull">Tela cheia</button>
  </div>
  <div class="hint">Par → ÷2 (o som desce). Ímpar → ×3+1 (o som sobe).<br>Todo caminho termina no 1 e no laço 4 → 2 → 1.<br>Teclas: M controles · F tela cheia · C limpar · N números · G gráfico · Espaço próximo.</div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const coral = document.createElement('canvas'), cctx = coral.getContext('2d');
let W = 0, H = 0, DPR = 1, CDPR = 1;
const MARGIN = 1.6;           // o coral é desenhado numa área maior que a tela, para o zoom abrir sem buracos

// ---------- parâmetros ----------
const P = {};
const ids = ['mode','speed','gap','scale','vol','drone','verb','aEven','aOdd','tilt','zoom','mem','color','showNum','graph','xfade'];
function readP(){
  for (const k of ids){ const el = $(k); P[k] = el.type === 'checkbox' ? el.checked : (el.tagName === 'SELECT' ? el.value : parseFloat(el.value)); }
}
readP();
for (const k of ids) $(k).addEventListener('input', () => {
  const oldSpeed = P.speed;
  readP();
  if (k === 'speed' && cur && !cur.done){ const p = (now() - cur.t0) * oldSpeed; cur.t0 = now() - p / P.speed; cur.next = Math.max(cur.next, Math.floor(p) + 1); }
  if (['aEven','aOdd','tilt'].includes(k)) relayoutAll();
  if (k === 'scale' && cur) setHarmony(cur.seq.length - 1, now());
  if (k === 'showNum') { $('num').classList.toggle('on', P.showNum); $('seq').classList.toggle('on', P.showNum); $('op').classList.toggle('on', P.showNum); }
  applyMix();
});

// ---------- matemática ----------
function collatz(n){
  const s = [n];
  while (n !== 1){ n = (n % 2 === 0) ? n/2 : 3*n+1; s.push(n); }
  return s;
}
const RECORDS = [27, 97, 871, 6171, 77031, 837799, 8400511, 63728127];
let seqCounter = 2, recIdx = 0;
function nextSeed(){
  if (P.mode === 'seq') return seqCounter++;
  if (P.mode === 'rec') { const r = RECORDS[recIdx % RECORDS.length]; recIdx++; return r; }
  return Math.max(2, Math.round(Math.pow(2, 1.5 + Math.random()*17)));
}
// caminho em coordenadas do mundo (passo = 1), da raiz (1) até a ponta (n)
function layout(seq){
  const m = seq.length - 1, pos = new Float32Array((m+1)*2);
  let x = 0, y = 0, a = -2.0 + P.tilt;
  for (let j = 1; j <= m; j++){
    a += (seq[m-j] % 2 === 0) ? P.aEven : -P.aOdd;
    x += Math.cos(a); y += Math.sin(a);
    pos[j*2] = x; pos[j*2+1] = y;
  }
  return pos; // ponto j = valor seq[m-j]
}
function bboxOf(pos, from, to, bb){
  for (let j = from; j <= to; j++){ const x = pos[j*2], y = pos[j*2+1];
    if (x < bb[0]) bb[0] = x; if (y < bb[1]) bb[1] = y; if (x > bb[2]) bb[2] = x; if (y > bb[3]) bb[3] = y; }
  return bb;
}

// ---------- cor ----------
function colorFor(n, t, alpha){
  const lg = Math.log2(n+1);
  switch (P.color){
    case 'arco':   return `hsla(${(lg*22 + t*40) % 360},70%,62%,${alpha})`;
    case 'brasa':  return `hsla(${12 + Math.min(lg,24)*1.6},85%,${45 + Math.min(lg,24)*1.2}%,${alpha})`;
    case 'branco': return `hsla(0,0%,92%,${alpha})`;
    default:       return `hsla(${200 - Math.min(lg,30)*2.2},${45 + Math.min(lg,30)}%,${60 + Math.min(lg,30)*0.8}%,${alpha})`;
  }
}

// ---------- câmera ----------
const cam = { s: 1, cx: 0, cy: 0 };      // escala (px por passo) e centro do mundo na tela
const camR = { s: 1, cx: 0, cy: 0 };     // câmera com que o coral foi desenhado
let worldBB = [-1, -1, 1, 1];
function camTarget(){
  const bb = worldBB.slice();
  if (cur) bboxOf(cur.pos, 0, cur.seq.length - 1, bb);
  const bw = Math.max(bb[2]-bb[0], 1), bh = Math.max(bb[3]-bb[1], 1);
  const maxS = Math.min(W, H) / 7;                  // começa bem perto
  const s = Math.min(maxS, W*0.84/bw, (H - GH)*0.78/bh) * P.zoom;
  return { s, cx: (bb[0]+bb[2])/2, cy: (bb[1]+bb[3])/2 };
}
let CY = 0, GH = 0;   // centro vertical do coral e altura do gráfico (suavizados)
function toScreen(x, y){ return [(x - cam.cx)*cam.s + W/2, (y - cam.cy)*cam.s + CY]; }

// ---------- coral (memória dos caminhos) ----------
let paths = [];   // {n, seq, pos, upto, w, t}
function relayoutAll(){
  worldBB = [-1, -1, 1, 1];
  for (const p of paths){ p.pos = layout(p.seq); bboxOf(p.pos, 0, p.upto, worldBB); }
  if (cur) cur.pos = layout(cur.seq);
  redrawCoral();
}
function drawPathOn(g, p, alphaMul, c){
  const m = p.seq.length - 1;
  g.lineWidth = 1.1;
  // agrupa por cor em trechos para não fazer um traço por segmento
  let i = 1;
  while (i <= p.upto){
    const col = colorFor(p.seq[i], p.t, 0.22*p.w*alphaMul);
    const end = Math.min(p.upto, i + 11);
    g.strokeStyle = col; g.beginPath();
    let j = m - i + 1; g.moveTo((p.pos[j*2]-c.cx)*c.s + c.ox, (p.pos[j*2+1]-c.cy)*c.s + c.oy);
    for (let k = i; k <= end; k++){ j = m - k; g.lineTo((p.pos[j*2]-c.cx)*c.s + c.ox, (p.pos[j*2+1]-c.cy)*c.s + c.oy); }
    g.stroke(); i = end + 1;
  }
}
function coralView(){ return { s: camR.s, cx: camR.cx, cy: camR.cy, ox: W*MARGIN/2, oy: H*MARGIN/2 + (camR.CY - H/2) }; }
function redrawCoral(){
  camR.s = cam.s; camR.cx = cam.cx; camR.cy = cam.cy; camR.CY = CY;
  cctx.setTransform(CDPR,0,0,CDPR,0,0);
  cctx.globalCompositeOperation = 'source-over'; cctx.clearRect(0, 0, W*MARGIN, H*MARGIN);
  cctx.globalCompositeOperation = 'lighter'; cctx.lineCap = 'round'; cctx.lineJoin = 'round';
  const c = coralView();
  for (const p of paths) drawPathOn(cctx, p, 1, c);
}
function commit(c, upto, t){
  if (upto < 1) return;
  const fade = (1 - P.mem) * 0.5;
  if (fade > 0){
    for (const p of paths) p.w *= (1 - fade);
    paths = paths.filter(p => p.w > 0.03);
    cctx.globalCompositeOperation = 'destination-out'; cctx.fillStyle = `rgba(0,0,0,${fade})`; cctx.fillRect(0,0,W*MARGIN,H*MARGIN);
  }
  const p = { n: c.seq[0], seq: c.seq, pos: c.pos, upto, w: 1, t };
  paths.push(p); if (paths.length > 4000) paths.shift();
  bboxOf(p.pos, 0, upto, worldBB);
  cctx.globalCompositeOperation = 'lighter'; cctx.lineCap = 'round'; cctx.lineJoin = 'round';
  drawPathOn(cctx, p, 1, coralView());
}
function clearCoral(){ rings = []; paths = []; worldBB = [-1,-1,1,1]; redrawCoral(); }

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); CDPR = Math.min(DPR, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  coral.width = Math.ceil(W*MARGIN*CDPR); coral.height = Math.ceil(H*MARGIN*CDPR);
  redrawCoral();
}
addEventListener('resize', resize);

// ---------- áudio ----------
let analyser = null, specData = null;
let AC = null, master, comp, verbIn, verbOut, dryBus, delay, droneG, droneF;
const SCALES = {
  jonico:[0,2,4,5,7,9,11], dorico:[0,2,3,5,7,9,10], frigio:[0,1,3,5,7,8,10], lidio:[0,2,4,6,7,9,11],
  mixolidio:[0,2,4,5,7,9,10], eolio:[0,2,3,5,7,8,10], locrio:[0,1,3,5,6,8,10],
  menorHarm:[0,2,3,5,7,8,11], menorMel:[0,2,3,5,7,9,11], frigioDom:[0,1,4,5,7,8,10], hungara:[0,2,3,6,7,8,11],
  penta:[0,3,5,7,10], pentaMaior:[0,2,4,7,9], hirajoshi:[0,2,3,7,8], tons:[0,2,4,6,8,10]
};
const NOTAS = ['Ré','Mi♭','Mi','Fá','Fá♯','Sol','Lá♭','Lá','Si♭','Si','Dó','Dó♯'];
// harmonia de cada número: o grau do acorde e do drone vem do número de passos até o 1
let harm = { chord: [0,3,7,10,14], root: 0, fifth: 7, name: 'Ré menor' };
function harmonyFor(m){
  const sc = SCALES[P.scale], k = sc.length, deg = m % k;
  const st = d => sc[((d % k) + k) % k] + 12*Math.floor(d / k);
  const rel = k === 7 ? [0,2,4,6,8] : k === 5 ? [0,1,2,3,5] : [0,1,2,3,4];
  const chord = rel.map(r => st(deg + r));
  const r0 = st(deg), root = ((r0 % 12) + 12) % 12;
  let fifth = 7, name = NOTAS[root];
  if (k === 7){
    const third = st(deg+2) - r0; fifth = st(deg+4) - r0;
    const q = third === 4 && fifth === 7 ? 'maior' : third === 3 && fifth === 7 ? 'menor' : third === 3 && fifth === 6 ? 'diminuto' : third === 4 && fifth === 8 ? 'aumentado' : '';
    if (q) name += ' ' + q;
  } else if (k === 5){ fifth = st(deg+3) - r0; }
  return { chord, root, fifth, name, deg };
}
let droneOscs = [];
function setHarmony(m, t){
  harm = harmonyFor(m);
  if (!AC) return;
  const r = ROOT * Math.pow(2, harm.root/12), f5 = r * Math.pow(2, harm.fifth/12);
  const tg = [r/2, r, r*1.004, f5];
  droneOscs.forEach((o, i) => o.frequency.setTargetAtTime(tg[i], t, 1.2));
}
const ROOT = 73.416; // Ré2
const now = () => AC ? AC.currentTime : performance.now()/1000;

function initAudio(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  try { AC = new Ctx({ latencyHint: 'playback' }); } catch (e) { AC = new Ctx(); }
  master = AC.createGain();
  comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.4;
  master.connect(comp); comp.connect(AC.destination);
  analyser = AC.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.82; comp.connect(analyser);
  specData = new Uint8Array(analyser.frequencyBinCount);
  dryBus = AC.createGain(); dryBus.connect(master);
  // reverb leve: filtros de pente com amortecimento (bem mais barato que convolução)
  verbIn = AC.createGain(); verbOut = AC.createGain(); verbOut.connect(master);
  const merger = AC.createChannelMerger(2); merger.connect(verbOut);
  const pre = AC.createBiquadFilter(); pre.type = 'lowpass'; pre.frequency.value = 3200; pre.Q.value = -12;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220; hp.Q.value = -12;
  verbIn.connect(hp); hp.connect(pre);
  [0.0797,0.0911,0.1013,0.1129,0.1237,0.1373].forEach((dt, i) => {
    const d = AC.createDelay(0.3); d.delayTime.value = dt;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = -12;
    const fb = AC.createGain(); fb.gain.value = 0.68;
    const o = AC.createGain(); o.gain.value = 0.2;
    pre.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(o); o.connect(merger, 0, i % 2);
  });
  delay = AC.createDelay(2); delay.delayTime.value = 0.42;
  const fb = AC.createGain(); fb.gain.value = 0.28;
  const dLp = AC.createBiquadFilter(); dLp.type = 'lowpass'; dLp.frequency.value = 2200; dLp.Q.value = -12;
  delay.connect(dLp); dLp.connect(fb); fb.connect(delay); dLp.connect(verbIn); dLp.connect(dryBus);
  droneG = AC.createGain(); droneG.gain.value = 0;
  droneF = AC.createBiquadFilter(); droneF.type = 'lowpass'; droneF.frequency.value = 220; droneF.Q.value = 0.7;
  droneF.connect(droneG); droneG.connect(dryBus);
  [[ROOT/2,'sine',0.55],[ROOT,'sawtooth',0.10],[ROOT*1.004,'sawtooth',0.10],[ROOT*1.4983,'sawtooth',0.06]].forEach(([f,type,g]) => {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
    const gg = AC.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(droneF); o.start(); droneOscs.push(o);
  });
  applyMix();
}
function applyMix(){
  if (!AC) return;
  const t = AC.currentTime;
  master.gain.setTargetAtTime(P.vol, t, 0.1);
  verbOut.gain.setTargetAtTime(P.verb*1.4, t, 0.1);
  dryBus.gain.setTargetAtTime(1 - P.verb*0.45, t, 0.1);
  droneG.gain.setTargetAtTime(P.drone*0.32, t, 1.5);
}
function degreeFor(n){ return Math.min(30, Math.round(Math.log2(n) * 1.35)); }
function freqForDegree(d, base){
  const sc = SCALES[P.scale], k = sc.length;
  const oct = Math.floor(d / k), semi = sc[((d % k)+k)%k] + 12*oct;
  return base * Math.pow(2, semi/12);
}
function out(node, x, send, dly){
  const last = node;
  last.connect(dryBus);
  const s = AC.createGain(); s.gain.value = send; last.connect(s); s.connect(verbIn);
  if (dly > 0){ const d = AC.createGain(); d.gain.value = dly; last.connect(d); d.connect(delay); }
}
// a cauda das notas encurta quando a velocidade sobe (menos vozes ao mesmo tempo)
const tail = base => Math.min(base, 0.5 + 5/P.speed);
// ---------- timbres: cada número escolhe uma família, e o tamanho de cada valor muda o brilho ----------
// up = subida (×3+1), dn = descida (÷2): onda, parcial (razão, ganho), filtro (× freq), ataque, duração
const TIMBRES = [
  { nome: 'vidro',   up: { w:'sine',     r:2.76, pg:0.5,  cut:0,  a:0.006, d:3.2 }, dn: { w:'triangle', r:0,    pg:0,    cut:6, a:0.025, d:1.6 } },

// cada parte do timbre vira número para poder misturar dois timbres aos poucos
const SPECTRA = (() => {

  return {
    sine: mk(n => n === 1 ? 1 : 0),
    triangle: mk(n => n % 2 ? 8/(Math.PI*Math.PI*n*n) * (((n-1)/2) % 2 ? -1 : 1) : 0),
    sawtooth: mk(n => 2/(Math.PI*n) * (n % 2 ? 1 : -1)),
    square: mk(n => n % 2 ? 4/(Math.PI*n) : 0)

})();
function norm(spec){   // forma numérica de uma voz
  return { w: spec.w, r: spec.r || 2, pg: spec.r ? spec.pg : 0, cut: spec.cut || 30, a: spec.a, d: spec.d,
           lv: spec.w === 'sawtooth' || spec.w === 'square' ? 0.55 : 1 };
}
let timFrom = { up: norm(TIMBRES[0].up), dn: norm(TIMBRES[0].dn) }, timTo = timFrom, tim = TIMBRES[0], timT0 = -1e9;
function timbreFor(seq){
  let odd = 0; for (let q = 0; q < seq.length - 1; q++) if (seq[q] % 2) odd++;

}
function timK(t){ const u = Math.max(0, Math.min(1, (t - timT0) / P.xfade)); return u*u*(3 - 2*u); }

           a: Math.exp(L(Math.log(A.a), Math.log(B.a))), d: L(A.d, B.d), lv: L(A.lv, B.lv) };

function withSpec(sp){ const n = norm(sp); n.spec = SPECTRA[sp.w]; return n; }
function setTimbre(T, t){

timFrom = { up: withSpec(TIMBRES[0].up), dn: withSpec(TIMBRES[0].dn) }; timTo = timFrom;
const waveCache = new Map();

  const g = AC.createGain();
  const o = AC.createOscillator(); o.setPeriodicWave(waveFor(s.spec)); o.frequency.value = f;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.5;
  const c0 = Math.min(18000, f*s.cut*(0.7 + bright*2.2));
  lp.frequency.setValueAtTime(c0, t); const open = Math.max(0, Math.min(1, (s.cut - 8)/22));

    p = AC.createOscillator(); p.frequency.value = f*s.r;
    const pg = AC.createGain();
    pg.gain.setValueAtTime(s.pg*(0.6 + bright), t); pg.gain.exponentialRampToValueAtTime(0.001, t + Math.min(0.9, dur));
    p.connect(pg); pg.connect(g);

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(lvl, t + s.a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
function bell(f, x, vel, t, v){ voice('up', f, x, vel, t, v || f, 0.6, 0.3, 0.16); }   // subida (×3+1)
function soft(f, x, vel, t, v){ voice('dn', f, x, vel, t, v || f, 0.45, 0.15, 0.14); } // descida (÷2)
function resolveChord(x, t){       // chegada ao 1
  harm.chord.forEach((semi,i) => {
    const f = ROOT*2 * Math.pow(2, semi/12), ti = t + i*0.09;
    const o = AC.createOscillator(), g = AC.createGain();

    g.gain.setValueAtTime(0.0001, ti); g.gain.exponentialRampToValueAtTime(0.06, ti+1.2); g.gain.exponentialRampToValueAtTime(0.0001, ti+7);
    o.connect(g); out(g, x + (i-2)*40, 0.9, 0);

function loopPulse(i, x, t){       // laço 4 → 2 → 1
  const f = ROOT * Math.pow(2, harm.root/12) * [4,2,1][i];
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f*1.02, t); o.frequency.exponentialRampToValueAtTime(f, t+0.15);

// ---------- estado da obra ----------
let cur = null;   // {seq, pos, t0, next, done}
let ripples = [], sparks = [], rings = [];
let nextAt = 0, running = false, lastShown = -1, arrivals = 0, rootHue = 0, rootSat = 0;
const LOOK = 0.6;   // agenda as notas com antecedência no relógio do áudio

function begin(n){
  const t = now();
  if (cur && !cur.done) commit(cur, Math.min(cur.seq.length-1, Math.floor((t - cur.t0)*P.speed)), t);
  const seq = collatz(n);
  cur = { seq, pos: layout(seq), t0: t + 0.08, next: 0, done: false }; lastShown = -1;
  setHarmony(seq.length - 1, t); { const T = timbreFor(seq); if (T !== tim) setTimbre(T, t); }
}
function scheduleStep(i, t){
  const c = cur, m = c.seq.length - 1, v = c.seq[i];
  const [x] = toScreen(c.pos[(m-i)*2], c.pos[(m-i)*2+1]);
  droneF.frequency.setTargetAtTime(160 + Math.log2(v)**2 * 7, t, 0.6);
  const f = freqForDegree(degreeFor(v), ROOT*2);
  if (i === 0) { bell(f, x, 0.9, t, v); soft(f/2, x, 0.7, t, v); }
  else if (c.seq[i-1] % 2 === 1) { bell(f, x, 0.75, t, v); sparks.push({ i: m-i, c, t, n: v }); }
  else soft(f, x, 0.8, t, v);

    for (let k = 0; k < 3; k++){ loopPulse(k, x, t + 0.9 + k*iv); ripples.push({ t: t + 0.9 + k*iv, k, hue }); }

// ---------- espectro: a cor de cada onda vem da energia da sua frequência no som ----------
function specRead(){ if (analyser) analyser.getByteFrequencyData(specData); }
function bandEnergy(f){
  if (!analyser) return 0;
  const hz = AC.sampleRate / analyser.fftSize; let e = 0, cnt = 0;
  for (const mult of [1, 2, 3, 4]){
    const b = Math.round(f*mult / hz);
    for (let d = -1; d <= 1; d++){ const v = specData[b + d]; if (v !== undefined){ e += v * (mult === 1 ? 1.4 : 0.7); cnt++; } }
  }

}
function centroid(){
  if (!analyser) return 400;

  for (let b = 2; b < specData.length/4; b++){ const v = specData[b]; num += v*b*hz; den += v; }

// frequência → cor do arco-íris (grave = vermelho, agudo = violeta), como a luz
const hueOfFreq = (f, lo, hi) => 285 * Math.max(0, Math.min(1, Math.log2(f/lo) / Math.log2(hi/lo)));
const specE = [0,0,0,0,0]; let specC = 400;

// ---------- ondas do acorde (fundo do gráfico) ----------
const waves = { r: [1,1.19,1.5,1.78,2.24], a: [0,0,0,0,0], ph: [0,1.3,2.1,0.7,2.9], last: 0, swell: 0 };
function drawChordWaves(c, i, peak, x0, x1, y0, y1, t, life){
  const dt = Math.min(0.1, Math.max(0, t - (waves.last || t))); waves.last = t;
  const n = harm.chord.length, mid = (y0 + y1)/2, band = (y1 - y0)/2;
  // altura do número atual faz as ondas crescerem; a chegada ao 1 dá um sopro
  const alt = Math.log2(Math.max(2, c.seq[i])) / Math.log2(Math.max(4, peak));
  if (c.done && t - c.tDone < 0.05) waves.swell = 1;
  waves.swell *= Math.exp(-dt*0.45);
  const amp = band * (0.3 + 0.5*alt + 0.5*waves.swell);
  const N = 140, w = x1 - x0;
  specRead();
  specC += (centroid() - specC) * 0.08;
  const sum = new Float32Array(N+1);
  for (let j = 0; j < n; j++){
    const target = Math.pow(2, harm.chord[j]/12);
    waves.r[j] += (target - waves.r[j]) * (1 - Math.exp(-dt*0.9));     // glissando entre acordes
    waves.a[j] += ((1 - j*0.12) - waves.a[j]) * (1 - Math.exp(-dt*0.6));
    waves.ph[j] += dt * (0.55 + waves.r[j]*0.45);
    const fj = ROOT*2 * Math.pow(2, harm.chord[j]/12);
    const eNow = bandEnergy(fj); specE[j] += (eNow - specE[j]) * (eNow > specE[j] ? 0.35 : 0.06);
    const e = specE[j];
    const r = waves.r[j], A = amp * waves.a[j] * (0.45 + 0.35*Math.sin(t*0.21 + j*1.7) + 0.8*e);

    ctx.strokeStyle = `hsla(${hue},${55 + e*40}%,${52 + e*30}%,${(0.14 + 0.55*e + 0.12*waves.swell)*Math.max(life,0.5)})`;
    ctx.lineWidth = 1 + e*2.2;
    ctx.beginPath();
    for (let q = 0; q <= N; q++){
      const u = q/N, x = x0 + u*w, env = Math.sin(Math.PI*u);
      const wob = Math.sin(u*3.1 + t*0.33 + j) * 0.35;                 // ondulação lenta, orgânica

  // a soma segue o centro de gravidade do espectro (som escuro = quente, som brilhante = frio)
  const eAll = specE.reduce((a, b) => a + b, 0) / n;
  const bh = hueOfFreq(specC, 250, 3500);
  for (const [lw, al] of [[7, 0.06], [1.6, 0.4]]){
    ctx.strokeStyle = `hsla(${bh},${60 + eAll*35}%,${70 + eAll*15}%,${(al*(0.6 + eAll*1.2) + al*0.6*waves.swell)*Math.max(life,0.5)})`;

    ctx.stroke();
  }

// ---------- gráfico da sequência (voo do granizo) ----------
function fmt(v){ return v.toLocaleString('pt-BR'); }
function drawGraph(c, i, frac, t){
  const m = c.seq.length - 1, x0 = 30, x1 = W - 30, y1 = H - 26, y0 = H - GH + 34;
  if (y1 - y0 < 30) return;

  ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(x0, Y(peak) + 0.5); ctx.lineTo(x1, Y(peak) + 0.5); ctx.stroke(); ctx.setLineDash([]);

  ctx.beginPath(); ctx.moveTo(X(0), Y(c.seq[0])); for (let q = 1; q <= m; q++) ctx.lineTo(X(q), Y(c.seq[q])); ctx.stroke();

    const up = c.seq[q-1] % 2 === 1;

    ctx.lineWidth = up ? 1.8 : 1.2;
    ctx.beginPath(); ctx.moveTo(X(q-1), Y(c.seq[q-1])); ctx.lineTo(X(q), Y(c.seq[q])); ctx.stroke();
  }
  // ponto atual

    const hx = X(i + e*(i < m ? 1 : 0)), hy = Y(v0) + (Y(v1) - Y(v0))*e;
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 12);
    g.addColorStop(0, colorFor(v0, t*0.02, 0.95)); g.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  ctx.textAlign = 'right';
  ctx.fillText(`pico ${fmt(peak)} (passo ${pk})`, x1, H - GH + 22);

// ---------- desenho ----------
function frame(){
  const t = now();
  if (running){
    if (cur && !cur.done){
      const m = cur.seq.length - 1;
      while (cur.next <= m && cur.t0 + cur.next/P.speed < t + LOOK){ scheduleStep(cur.next, Math.max(t, cur.t0 + cur.next/P.speed)); cur.next++; }
      if ((t - cur.t0)*P.speed >= m){ cur.done = true; cur.tDone = t; if (cur.hue != null) rootHue = cur.hue; commit(cur, m, t); nextAt = t + P.gap + 1.8; }
    } else if (t >= nextAt) begin(nextSeed());
  }

  const ghT = P.graph ? Math.min(190, H*0.24) : 0;
  GH += (ghT - GH)*0.08; CY = (H - GH)/2;
  if (Math.abs(CY - camR.CY) > 3 && Math.abs(ghT - GH) < 0.5) redrawCoral();
  // câmera: aproxima no começo e abre a cada expansão
  const tg = camTarget(), k = 0.035;
  cam.s = Math.exp(Math.log(cam.s) + (Math.log(tg.s) - Math.log(cam.s))*k);
  cam.cx += (tg.cx - cam.cx)*k; cam.cy += (tg.cy - cam.cy)*k;
  const ratio = cam.s / camR.s;
  const settled = Math.abs(Math.log(tg.s/cam.s)) < 0.01 && Math.hypot(tg.cx-cam.cx, tg.cy-cam.cy)*cam.s < 2;
  if (Math.abs(Math.log(ratio)) > 0.4 || (settled && (Math.abs(Math.log(ratio)) > 0.02 || Math.hypot(camR.cx-cam.cx, camR.cy-cam.cy)*cam.s > 2))) redrawCoral();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  { const r = cam.s / camR.s, bw = W*MARGIN, bh = H*MARGIN;
    const ox = W/2 - bw/2*r + (camR.cx - cam.cx)*cam.s, oy = CY - (H*MARGIN/2 + (camR.CY - H/2))*r + (camR.cy - cam.cy)*cam.s;
    ctx.drawImage(coral, ox, oy, bw*r, bh*r); }

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (cur){
    const c = cur, m = c.seq.length - 1;
    const p = c.done ? m : Math.max(0, (t - c.t0)*P.speed);
    const i = Math.min(m, Math.floor(p)), frac = c.done ? 0 : p - i;
    const P2 = j => toScreen(c.pos[j*2], c.pos[j*2+1]);
    const si = c.done ? m : i;
    if (si !== lastShown){
      lastShown = si; const i = si;
      $('num').textContent = c.seq[i].toLocaleString('pt-BR');
      const v = fmt(c.seq[i]);
      if (i === 0) $('op').innerHTML = `${v} é ${c.seq[0] % 2 ? '<span class="imp">ímpar</span>' : '<span class="par">par</span>'}`;
      else { const pv = c.seq[i-1], a = fmt(pv);
        $('op').innerHTML = pv % 2 ? `<span class="imp">${a} × 3 + 1</span> = ${v}` : `<span class="par">${a} ÷ 2</span> = ${v}`; }
      // todas as contas da sequência, sem cortes; as mais novas ficam sempre à vista
      const parts = [];
      for (let q = 1; q <= i; q++){
        const pv = c.seq[q-1], up = pv % 2 === 1, txt = up ? `${fmt(pv)} × 3 + 1 = ${fmt(c.seq[q])}` : `${fmt(pv)} ÷ 2 = ${fmt(c.seq[q])}`;
        parts.push(q === i ? `<span class="o"><b${up ? ' class="up"' : ''}>${txt}</b></span>` : `<span class="o${up ? ' up' : ''}">${txt}</span>`);
      }
      const el = $('seq'); el.innerHTML = parts.join('');
      el.style.maxHeight = Math.max(60, H - GH - 96 - 40) + 'px';
      el.scrollTop = el.scrollHeight;
      el.classList.toggle('cheio', el.scrollHeight > el.clientHeight + 2);
    }
    if (P.graph && GH > 20) drawGraph(c, i, frac, t);
    // fantasma do caminho que falta
    if (!c.done && i < m){
      ctx.strokeStyle = colorFor(c.seq[i], t*0.02, 0.07); ctx.lineWidth = 1;
      ctx.beginPath(); let q = P2(m - i); ctx.moveTo(q[0], q[1]);
      for (let j = m - i - 1; j >= 0; j--){ q = P2(j); ctx.lineTo(q[0], q[1]); }
      ctx.stroke();
    }
    // trecho percorrido
    const life = c.done ? Math.max(0, 1 - (t - c.tDone)/(P.gap + 1.8)) : 1;
    if (life > 0.01 && i >= 1){
      const FRESH = 30, cut = Math.max(1, i - FRESH);
      if (cut > 1){       // parte antiga num único traço
        ctx.strokeStyle = colorFor(c.seq[cut], t*0.02, 0.25*life); ctx.lineWidth = 1;
        ctx.beginPath(); let q = P2(m); ctx.moveTo(q[0], q[1]);
        for (let s = 1; s <= cut; s++){ q = P2(m - s); ctx.lineTo(q[0], q[1]); }
        ctx.stroke();
      }
      for (let s = cut; s <= i; s++){
        if (s < 1) continue;
        const a = P2(m-s+1), b = P2(m-s), age = i - s;
        ctx.strokeStyle = colorFor(c.seq[s], t*0.02, (0.25 + 0.75*Math.exp(-age/14))*life);
        ctx.lineWidth = 1 + 2.2*Math.exp(-age/10);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }
    // cabeça
    if (!c.done){
      const a = P2(m - i), b = P2(Math.max(0, m - i - 1)), e = frac*frac*(3-2*frac);
      const hx = a[0] + (b[0]-a[0])*e, hy = a[1] + (b[1]-a[1])*e;
      const r = 14 + Math.log2(c.seq[i])*1.4;
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
      g.addColorStop(0, colorFor(c.seq[i], t*0.02, 0.95)); g.addColorStop(0.25, colorFor(c.seq[i], t*0.02, 0.35)); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI*2); ctx.fill();
    }
  }
  // anéis vivos: cada 1 alcançado deixa um círculo que respira e ondula
  if (rings.length){
    const [ox, oy] = toScreen(0, 0), NR = rings.length;
    let maxM = 1; for (const r of rings) if (r.m > maxM) maxM = r.m;
    for (let ri = 0; ri < NR; ri++){
      const r = rings[ri]; if (t < r.born) continue;
      const age = t - r.born, fromNewest = NR - 1 - ri;
      const fade = fromNewest > 90 ? Math.max(0, 1 - (fromNewest - 90)/50) : 1;
      const grow = 1 - Math.exp(-age*1.4);                              // nasce do centro e se abre
      const R0 = Math.min(W, H - GH) * (0.04 + 0.42*Math.sqrt(r.m / maxM)) * grow;
      const breath = 1 + 0.035*Math.sin(t*0.5 + r.seed);
      const al = (0.09 + 0.55*Math.exp(-age/3)) * fade;
      if (al < 0.01) continue;
      ctx.strokeStyle = `hsla(${r.hue},70%,${66 + 10*Math.exp(-age/3)}%,${al})`;
      ctx.lineWidth = 1 + 1.5*Math.exp(-age/2.5);
      ctx.beginPath();
      const K = 96, rot = t*0.04*(ri % 2 ? 1 : -1) + r.seed;
      for (let q = 0; q <= K; q++){
        const a = q/K*Math.PI*2;
        const w = 0.045*Math.sin(3*a + rot + t*0.23) + 0.03*Math.sin(5*a - rot*1.3 + r.seed) + 0.02*Math.sin(2*a + t*0.11 + r.seed*0.7);
        const rr = R0 * breath * (1 + w);
        const x = ox + Math.cos(a)*rr, y = oy + Math.sin(a)*rr;
        q ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }
  // faíscas nas subidas
  sparks = sparks.filter(s => t - s.t < 1.6);
  ctx.lineWidth = 1;
  for (const s of sparks){
    if (t < s.t) continue;
    const k2 = (t - s.t)/1.6, [x, y] = toScreen(s.c.pos[s.i*2], s.c.pos[s.i*2+1]);
    ctx.strokeStyle = colorFor(s.n, t*0.02, 0.5*(1-k2));
    ctx.beginPath(); ctx.arc(x, y, 4 + k2*26, 0, Math.PI*2); ctx.stroke();
  }
  // a raiz: o 1, e as ondas do laço 4-2-1
  const [rx, ry] = toScreen(0, 0);
  ripples = ripples.filter(r => t - r.t < 6);
  ctx.lineWidth = 1.2;
  for (const r of ripples){
    if (t < r.t) continue;
    const k2 = (t - r.t)/6, rad = 10 + Math.pow(k2, 0.6) * Math.min(W,H) * (0.55 - r.k*0.12);
    ctx.strokeStyle = `hsla(${r.hue},75%,${68 - r.k*8}%,${0.45*(1-k2)})`;
    ctx.beginPath(); ctx.arc(rx, ry, rad, 0, Math.PI*2); ctx.stroke();
  }
  if (running){
    const pulse = 0.5 + 0.5*Math.sin(t*1.3), g = ctx.createRadialGradient(rx, ry, 0, rx, ry, 22);
    rootSat += ((arrivals ? 70 : 0) - rootSat)*0.05;
    g.addColorStop(0, `hsla(${rootHue},${rootSat}%,82%,${0.4 + pulse*0.25})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(rx, ry, 22, 0, Math.PI*2); ctx.fill();
    ctx.font = '300 13px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = `hsla(${rootHue},${rootSat}%,85%,0.7)`; ctx.fillText('1', rx, ry + 16);
  }
  requestAnimationFrame(frame);
}

// ---------- interação ----------
function startPiece(){
  if (running) return;
  initAudio(); running = true;
  $('start').classList.add('hide');
  nextAt = now() + 0.8;
}
$('start').addEventListener('pointerdown', e => { e.stopPropagation(); startPiece(); });
$('dot').addEventListener('click', () => $('panel').classList.toggle('on'));
$('bClear').addEventListener('click', clearCoral);
$('bFull').addEventListener('click', toggleFull);
$('seedIn').addEventListener('change', e => { const n = Math.floor(+e.target.value); if (n >= 2 && n < 1e12 && running) begin(n); });
function toggleFull(){
  const d = document;
  try {
    if (!d.fullscreenElement && !d.webkitFullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
    else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch (e) {}
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'm') $('panel').classList.toggle('on');
  else if (k === 'f') toggleFull();
  else if (k === 'c') clearCoral();
  else if (k === 'n') { $('showNum').checked = !$('showNum').checked; readP(); $('num').classList.toggle('on', P.showNum); $('seq').classList.toggle('on', P.showNum); $('op').classList.toggle('on', P.showNum); }
  else if (k === 'g') { $('graph').checked = !$('graph').checked; readP(); }
  else if (k === ' ') { e.preventDefault(); if (!running) startPiece(); else begin(nextSeed()); }
});

resize();
cam.s = camR.s = Math.min(W, H)/7; GH = P.graph ? Math.min(190, H*0.24) : 0; CY = camR.CY = (H - GH)/2; redrawCoral();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
