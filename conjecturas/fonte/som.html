  <h2>Som</h2>
  <div class="row"><label>Modo</label>
    <select id="scale">
      <option value="jonico">Jônico (maior)</option>
      <option value="dorico" selected>Dórico</option>
      <option value="frigio">Frígio</option>
      <option value="lidio">Lídio</option>
      <option value="mixolidio">Mixolídio</option>
      <option value="eolio">Eólio (menor)</option>
      <option value="menorHarm">Menor harmônica</option>
      <option value="menorMel">Menor melódica</option>
      <option value="frigioDom">Frígio dominante</option>
      <option value="hungara">Húngara menor</option>
      <option value="penta">Pentatônica menor</option>
      <option value="pentaMaior">Pentatônica maior</option>
      <option value="hirajoshi">Hirajoshi</option>
      <option value="tons">Tons inteiros</option>
    </select></div>
  <div class="row"><label>Volume</label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.75"></div>
  <div class="row"><label>Drone</label><input type="range" id="drone" min="0" max="1" step="0.01" value="0.45"></div>
  <div class="row"><label>Reverb</label><input type="range" id="verb" min="0" max="1" step="0.01" value="0.55"></div>
