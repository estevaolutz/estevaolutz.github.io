<style>
/* Layout: painel de leitura à esquerda (embaixo no celular), mapa ocupando o resto, linha do tempo na base do mapa */
:root {
  --sea: #93b9cf; --sea-pol: #d4e4ee; --land: #d7dcae; --coast: #8a979a; --grat: rgba(40,70,90,.10);
  --river: #5b86a6; --mount: #7a6142; --label-anc: #76664d; --label-halo: rgba(246,245,238,.82); --sea-label: #2f5871; --border: #8a5f6a;
  --panel: #f7f5f1; --panel-2: #ece8e1; --ink: #1f1d1b; --muted: #6a645c; --line: #ddd6cb;
  --gold: #a3302a; --gold-2: #9a6a12; --halo: rgba(247,245,241,.93);
  --f-display: "GFS Didot", "Didot", "Bodoni 72", Georgia, serif;
  --f-roman: "Cinzel", "Trajan Pro", "GFS Didot", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #1d263d; --sea-pol: #1b2031; --land: #3f4433; --coast: #6d6378; --grat: rgba(220,200,240,.07);
  --river: #7194b4; --mount: #bea684; --label-anc: #b09e84; --label-halo: rgba(28,22,24,.8); --sea-label: #9fb0cc; --border: #b48d99;
  --panel: #18141a; --panel-2: #231d24; --ink: #efe8e4; --muted: #ab9fa3; --line: #322a31;
  --gold: #e8796d; --gold-2: #e2b04a; --halo: rgba(24,20,26,.92); color-scheme: dark; } }
:root[data-theme="dark"] {
  --sea: #1d263d; --sea-pol: #1b2031; --land: #3f4433; --coast: #6d6378; --grat: rgba(220,200,240,.07);
  --river: #7194b4; --mount: #bea684; --label-anc: #b09e84; --label-halo: rgba(28,22,24,.8); --sea-label: #9fb0cc; --border: #b48d99;
  --panel: #18141a; --panel-2: #231d24; --ink: #efe8e4; --muted: #ab9fa3; --line: #322a31;
  --gold: #e8796d; --gold-2: #e2b04a; --halo: rgba(24,20,26,.92); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(320px, 400px) 1fr; }
.panel { min-width: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 20px 28px; }
.mapwrap { position: relative; min-width: 0; background: var(--sea); }
canvas#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#map:active { cursor: grabbing; }

.eyebrow { font-family: var(--f-roman); letter-spacing: .22em; font-size: 12px; font-weight: 600; color: var(--gold); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.intro { margin: 12px 0 0; font-size: 14px; color: var(--muted); max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font: 600 12px/1 var(--f-body); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--muted); opacity: .55; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
button:focus-visible, .myth:focus-visible, .stop:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.group h2 { font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin: 22px 0 6px; display: flex; align-items: center; gap: 8px; }
.group h2 small { font: 500 11px var(--f-mono); letter-spacing: 0; text-transform: none; margin-left: auto; }
.myth { display: grid; grid-template-columns: 6px 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--line); padding: 10px 2px; color: var(--ink); cursor: pointer; font: inherit; }
.myth .bar { grid-row: 1 / 4; width: 4px; border-radius: 2px; background: var(--c); margin-top: 3px; }
.myth.dim { opacity: .5; }
.myth:hover .mt { color: var(--gold); }
.mt { font-family: var(--f-display); font-size: 19px; line-height: 1.2; }
.mc { font: 500 12px var(--f-mono); color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.ml { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); }
.mr { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.back { background: none; border: 0; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 0; }
.back:hover { color: var(--ink); }
.cyc { display: inline-flex; gap: 6px; align-items: center; font: 600 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.cyc i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.detail h1 { font-size: 31px; margin-top: 6px; }
.latin { font-family: var(--f-roman); font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.role { font-size: 13px; color: var(--muted); margin-top: 4px; }
.src { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.sum { margin: 12px 0 0; max-width: 65ch; }
.rivals { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.rivals button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  font: 600 12px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.rivals button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.controls { position: sticky; top: -20px; z-index: 2; background: var(--panel); display: flex; align-items: center; gap: 8px;
  margin: 16px 0 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; }
.cbtn.play { background: var(--gold); border-color: var(--gold); color: var(--panel); width: 44px; height: 44px; }
.cbtn svg { width: 16px; height: 16px; fill: currentColor; }
.prog { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.stops { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.stop { position: relative; padding: 9px 0 9px 26px; cursor: pointer; border-radius: 6px; }
.stop::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.stop:first-child::before { top: 18px; } .stop:last-child::before { bottom: calc(100% - 18px); }
.stop::after { content: ""; position: absolute; left: 3px; top: 13px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--c); }
.stop.bt::after { border-radius: 2px; transform: rotate(45deg); }
.stop.done::after { background: var(--c); }
.stop.cur::after { background: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent); }
.sn { font-weight: 600; line-height: 1.3; }
.stop.cur .sn { color: var(--gold); }
.sm { font-size: 12px; color: var(--muted); }
.sm b { font: 500 11.5px var(--f-mono); color: var(--ink); font-weight: 500; }
.st { display: none; margin-top: 6px; max-width: 60ch; }
.stop.cur .st { display: block; }
.st p { margin: 0 0 8px; }
.st .mean { font-family: var(--f-display); font-size: 16.5px; line-height: 1.4; }
.st .today { font-size: 13.5px; color: var(--muted); }
.st .today b { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cert { font: 500 11px var(--f-mono); padding: 3px 7px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); }
.ref { font-size: 12px; color: var(--muted); font-style: italic; }
.co { font: 400 11px var(--f-mono); color: var(--muted); margin-top: 4px; display: none; }
.stop.cur .co { display: block; }

/* ficha de batalha */
.bat { margin: 10px 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; }
.bat .bh { display: flex; align-items: baseline; gap: 8px; font: 600 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bat .bh b { color: var(--gold); letter-spacing: .06em; }
.bat dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 0; font-size: 13px; }
.bat dt { color: var(--muted); }
.bat dd { margin: 0; font-variant-numeric: tabular-nums; }
.diag { margin-top: 10px; }
.diag svg { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.diag .dc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.diag .dc button { min-width: 32px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 600 12px var(--f-mono); cursor: pointer; }
.diag .dc button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.diag .dc .dl { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.diag .dc .dl span { display: inline-flex; align-items: center; gap: 5px; }
.diag .dc .dl i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.diag .cap { font-size: 13.5px; margin: 8px 0 0; min-height: 3.2em; }
.diag .dt { font: 600 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 18px var(--f-body); cursor: pointer; }
.zoom button.zall { font: 600 9.5px var(--f-mono); letter-spacing: .04em; }
.layers { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: grid; gap: 6px; padding: 6px;
  background: var(--halo); border: 1px solid var(--line); border-radius: 10px; }
.layers .seg { display: flex; gap: 2px; }
.layers .seg button { font: 600 12px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer; }
.layers .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.layers input { width: 100%; margin: 0; accent-color: var(--gold); }
.layers input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.polkey { display: none; flex-wrap: wrap; gap: 4px 10px; max-width: 230px; padding: 2px 4px 0; font-size: 11px; color: var(--muted); }
.polkey.on { display: flex; }
.polkey span { display: inline-flex; align-items: center; gap: 5px; }
.polkey i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.srcnote { margin-top: 24px; font-size: 12px; color: var(--muted); max-width: 60ch; }
.notice { position: absolute; left: 12px; top: 120px; right: 60px; font-size: 12.5px; color: var(--muted); background: var(--halo); padding: 8px 10px; border-radius: 6px; }

/* linha do tempo */
.timeline { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  background: var(--halo); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 6px; }
.tl-head { display: flex; align-items: center; gap: 10px; }
.tl-play { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--gold); color: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tl-play svg { width: 12px; height: 12px; fill: currentColor; }
.tl-play:focus-visible, .tl-speed button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tl-speed { flex: none; display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); }
.tl-sl { font: 600 10px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 6px 0 4px; }
.tl-speed button { min-width: 30px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 600 12px var(--f-mono); cursor: pointer; padding: 0 4px; }
.tl-speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tl-year { font: 600 18px var(--f-roman); letter-spacing: .04em; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 92px; }
.tl-note { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-hint { font: 500 11px var(--f-mono); color: var(--muted); }
.tl-track { position: relative; height: 46px; margin-top: 2px; }
.tl-lanes { position: absolute; inset: 0 0 16px 0; }
.tl-lane { position: absolute; height: 3px; border-radius: 2px; background: var(--c); opacity: .45; }
.tl-lane.on { opacity: 1; height: 5px; }
.tl-ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; font: 500 10px var(--f-mono); color: var(--muted); }
.tl-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-ticks span::before { content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 4px; background: var(--muted); opacity: .6; }
.tl-mark { position: absolute; top: 0; bottom: 16px; width: 1px; background: var(--line); }
.tl-track input { position: absolute; left: -8px; right: -8px; width: calc(100% + 16px); top: 6px; height: 30px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.tl-track input::-webkit-slider-runnable-track { height: 30px; background: transparent; }
.tl-track input::-moz-range-track { height: 30px; background: transparent; }
.tl-track input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 30px; border-radius: 4px; background: var(--gold); border: 2px solid var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.tl-track input::-moz-range-thumb { width: 12px; height: 26px; border-radius: 4px; background: var(--gold); border: 2px solid var(--panel); }
.tl-track input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 54% 46%; }
  .mapwrap { order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
  h1 { font-size: 28px; } .detail h1 { font-size: 25px; }
  .controls { top: -14px; }
  .layers .seg button { padding: 7px 8px; font-size: 11.5px; }
  .tl-ticks span.minor { display: none; }
  .tl-sl { display: none; }
  .tl-speed button { min-width: 26px; padding: 0 2px; font-size: 11px; }
  .tl-year { min-width: 0; }
  .polkey { max-width: 180px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<style>
/* ===== Maquete 3D (Atlas3D) ===== */
:root {
  --m3-sky1: #eef1ef; --m3-sky2: #cfd8d9; --m3-floor: rgba(40, 52, 58, .16);
  --m3-wall-land: #9c8462; --m3-wall-sea: #5f8faa; --m3-wall-base: #4f4234;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --m3-sky1: #222838; --m3-sky2: #0f121a; --m3-floor: rgba(0, 0, 0, .35);
  --m3-wall-land: #5b4b3a; --m3-wall-sea: #24324b; --m3-wall-base: #16120f; } }
:root[data-theme="dark"] {
  --m3-sky1: #222838; --m3-sky2: #0f121a; --m3-floor: rgba(0, 0, 0, .35);
  --m3-wall-land: #5b4b3a; --m3-wall-sea: #24324b; --m3-wall-base: #16120f; }

.mapbox.m3, .mapbox.m3[data-layer] { background: radial-gradient(130% 95% at 50% 10%, var(--m3-sky1), var(--m3-sky2)) !important; }
@media (min-width: 980px) { .mapbox { height: min(66vh, 700px); } }
.mapbox canvas.t3 { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.mapbox.dragging canvas.t3 { cursor: grabbing; }
.mapbox #map { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; cursor: auto; overflow: visible; }
#map .mk { pointer-events: auto; }
#map .stem { stroke: var(--am-ink); stroke-width: 1.3; opacity: .45; }
#map .stem.ida { stroke: var(--ida); opacity: .7; }
#map .stem.volta { stroke: var(--volta); opacity: .7; }
#map .route.base { stroke-width: 1.6; opacity: .75; }
#map .route.done { stroke-width: 2.8; }

.mapbox .zoom .compass { display: grid; place-items: center; padding: 0; }
.mapbox .zoom .compass svg { width: 22px; height: 22px; transition: transform .08s linear; }
.compass .cn { fill: var(--accent); }
.compass .cs { fill: var(--am-muted); opacity: .55; }
.mapbox .hint { left: 50%; right: auto; top: 10px; bottom: auto; transform: translateX(-50%); background: var(--am-ctl); padding: 4px 8px; border-radius: 6px; white-space: nowrap; text-align: center; }
@media (max-width: 860px) { .mapbox .hint { display: none; } }
.t3msg { position: absolute; inset: auto 16px 50% 16px; transform: translateY(50%); text-align: center; padding: 14px 16px; font: 500 .95rem var(--f-body); }

.exagwrap { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.exagwrap .lbl { white-space: nowrap; }
.exagwrap #exagtxt { font: 400 .74rem var(--f-mono); color: var(--muted); min-width: 3ch; font-variant-numeric: tabular-nums; }
#exag { flex: 1; min-width: 0; accent-color: var(--accent); }
#exag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .mapbox { aspect-ratio: 4 / 4.9; }
  .mapbox .zoom button { width: 34px; height: 34px; }
  .mapbox .navarrow { top: 62%; }
}
:root { --m3-tree-conifer: #3c6644; --m3-tree-broad: #5b8748; --m3-tree-shrub: #8c9a5c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --m3-tree-conifer: #2c4a33; --m3-tree-broad: #3f6036; --m3-tree-shrub: #626c42; } }
:root[data-theme="dark"] { --m3-tree-conifer: #2c4a33; --m3-tree-broad: #3f6036; --m3-tree-shrub: #626c42; }
.vegbtn {
  font: 500 .85rem/1 var(--f-body); color: var(--muted); background: var(--page);
  border: 1px solid var(--rule); border-radius: 999px; padding: .5rem .8rem; cursor: pointer;
}
.vegbtn[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.vegbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mapwrap.m3 { background: radial-gradient(130% 95% at 50% 10%, var(--m3-sky1), var(--m3-sky2)) !important; }
.mapwrap canvas#map { position: absolute; inset: 0; z-index: 1; background: transparent; }
.mapwrap .zoom, .mapwrap .layers, .mapwrap .legend, .mapwrap .notice, .mapwrap .hint3 { z-index: 2; }
.mapwrap.dragging canvas { cursor: grabbing; }
.zoom .compass { display: grid; place-items: center; padding: 0; }
.zoom .compass svg { width: 20px; height: 20px; transition: transform .08s linear; }
.zoom button.zall, .zoom button.ztilt { font: 600 9.5px var(--f-mono); letter-spacing: .04em; }
.layers .row3 { display: flex; align-items: center; gap: 8px; }
.layers .row3 span { font: 600 10.5px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

      let q = rand() * (wc + wb + ws), k = q < wc ? 0 : q < wc + wb ? 1 : 2;
      kinds[k].push(x, z, (.5 + rand() * .45) * SCALE, rand() * 6.283, rand());
      got++;
    }
    const geos = [
      new THREE.ConeGeometry(.5, 2.1, 6).translate(0, 1.05 + .15, 0),
      new THREE.IcosahedronGeometry(.62, 0).scale(1, 1.1, 1).translate(0, .85, 0),
      new THREE.IcosahedronGeometry(.42, 0).scale(1.15, .62, 1.15).translate(0, .2, 0)
    ];
    trees = kinds.map((arr, k) => {
      const n = arr.length / 5, mesh = new THREE.InstancedMesh(geos[k], new THREE.MeshLambertMaterial({ color: 0xffffff }), Math.max(1, n));
      mesh.count = n; mesh.frustumCulled = false; scene.add(mesh);
      return { mesh, arr, n, k };
    });
    recolorTrees();
  }
  const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3(), YA = new THREE.Vector3(0, 1, 0);
  function applyTrees() {
    if (!trees) return;
    for (const t of trees) {
      for (let j = 0; j < t.n; j++) {
        const a = t.arr, o5 = j * 5, x = a[o5], z = a[o5 + 1], s = a[o5 + 2];
        V.set(x, heightW(x, z) - .08, z); Q.setFromAxisAngle(YA, a[o5 + 3]); SC.set(s, s * (.85 + .3 * a[o5 + 4]), s);
        t.mesh.setMatrixAt(j, M4.compose(V, Q, SC));
      }
      t.mesh.instanceMatrix.needsUpdate = true;
      t.mesh.visible = vegOn;
    }
  }
  function recolorTrees() {
    if (!trees) return;
    const base = ["--m3-tree-conifer", "--m3-tree-broad", "--m3-tree-shrub"].map((n, i) => new THREE.Color(cssVar(n, ["#3c6644", "#5b8748", "#8c9a5c"][i])));
    const c = new THREE.Color(), hsl = {};
    for (const t of trees) {
      base[t.k].getHSL(hsl);
      for (let j = 0; j < t.n; j++) {
        const r = t.arr[j * 5 + 4];
        c.setHSL(hsl.h + (r - .5) * .05, hsl.s * (.85 + r * .3), hsl.l * (.82 + ((r * 7.31) % 1) * .36)).convertSRGBToLinear();
        t.mesh.setColorAt(j, c);
      }
      if (t.mesh.instanceColor) t.mesh.instanceColor.needsUpdate = true;
    }
  }

  /* ---- câmera ---- */
  const S = { x: 0, z: 0, d: 1000, h: 0, t: (o.tilt == null ? 52 : o.tilt) * DEG };
  const TMAX = 74 * DEG, MIND = o.minDist || 45 * SCALE;
  let W = 1, Hh = 1, fullD = 1000, ty = 0;
  const tanV = () => Math.tan(cam.fov * DEG / 2);
  const fitDist = (w, h, t) => Math.max(w / (2 * tanV() * cam.aspect), h * Math.max(.5, Math.cos(t)) / (2 * tanV())) * 1.06;
  const clampAll = () => {
    S.d = Math.min(fullD * 1.3, Math.max(MIND, S.d));
    S.t = Math.min(TMAX, Math.max(0, S.t));
    S.x = Math.min(WX / 2, Math.max(-WX / 2, S.x)); S.z = Math.min(WZ / 2, Math.max(-WZ / 2, S.z));
  };
  function place() {
    const st = Math.sin(S.t), ct = Math.cos(S.t), sh = Math.sin(S.h), ch = Math.cos(S.h);
    ty += (heightW(S.x, S.z) * .7 - ty) * (anim ? 1 : .35);
    let cx = S.x - sh * st * S.d, cz = S.z + ch * st * S.d, cy = ty + S.d * ct;
    cy = Math.max(cy, heightW(cx, cz) + 2);
    cam.position.set(cx, cy, cz);
    cam.up.set(sh, 0, -ch);
    cam.lookAt(S.x, ty, S.z);
    cam.near = Math.max(.5, S.d / 80); cam.far = S.d * 3 + Math.hypot(WX, WZ) * 1.5;
    cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  }
  function resize() {
    W = Math.max(1, host.clientWidth); Hh = Math.max(1, host.clientHeight);
    renderer.setSize(W, Hh, false);
    cam.aspect = W / Hh; cam.updateProjectionMatrix();
    fullD = fitDist(WX, WZ, 52 * DEG) * 1.14;
    clampAll(); req();
  }
  new ResizeObserver(resize).observe(host);

  /* ---- animação ---- */
  let anim = null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  function flyTo(tg, dur = 1000) {
    const to = { ...S, ...tg };
    to.h = S.h + wrap(to.h - S.h);
    if (reduce || !dur) { Object.assign(S, to); clampAll(); anim = null; req(); return; }
    const from = { ...S }, dx = to.x - from.x, dz = to.z - from.z, far = Math.hypot(dx, dz);
    const lift = far > Math.max(from.d, to.d) * .9 ? Math.min(fullD, far * .55) : 0;   // arco de voo em trajetos longos
    anim = { from, to, lift, t0: performance.now(), dur: lift ? dur * 1.25 : dur };
    req();
  }
  function stepAnim(now) {
    const a = anim, t = Math.min(1, (now - a.t0) / a.dur), e = ease(t);
    for (const k of ["x", "z", "h", "t"]) S[k] = a.from[k] + (a.to[k] - a.from[k]) * e;
    S.d = a.from.d + (a.to.d - a.from.d) * e + a.lift * Math.sin(Math.PI * t);
    if (t >= 1) anim = null;
  }
  function fit(pts, opt = {}) {
    const h = opt.h != null ? opt.h : S.h, t = opt.t != null ? opt.t : S.t;
    const rx = Math.cos(h), rz = Math.sin(h), fx = Math.sin(h), fz = -Math.cos(h);
    let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
    pts.forEach(([lon, lat]) => { const [x, z] = toW(lon, lat), u = x * rx + z * rz, v = x * fx + z * fz; u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v); });
    const pad = opt.pad == null ? 110 : opt.pad, minKm = opt.minKm || 300;
    const w = Math.max(minKm, u1 - u0 + pad * 2), hh = Math.max(minKm / cam.aspect, v1 - v0 + pad * 2);
    const uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
    const tg = { x: uc * rx + vc * fx, z: uc * rz + vc * fz, d: fitDist(w, hh, t), h, t };
    tg.d = Math.min(fullD * 1.3, Math.max(MIND, tg.d));
    flyTo(tg, opt.dur == null ? 1000 : opt.dur);
  }

  /* ---- gestos ---- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  const ground = (cx, cy) => {
    const r = host.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    const d = ray.ray.direction; if (d.y > -.02) return null;
    const k = (ty - ray.ray.origin.y) / d.y; if (k > cam.far) return null;
    hit.copy(ray.ray.origin).addScaledVector(d, k);
    return { x: hit.x, z: hit.z };
  };
  function zoomAt(f, cx, cy) {
    place();
    const g = ground(cx, cy) || { x: S.x, z: S.z };
    const nd = Math.min(fullD * 1.3, Math.max(MIND, S.d / f)), k = nd / S.d;
    S.x = g.x + (S.x - g.x) * k; S.z = g.z + (S.z - g.z) * k; S.d = nd; clampAll(); req();
  }
  const ptrs = new Map();
  let gmode = null, grab = null, moved = false, start = null, last2 = null;
  host.addEventListener("pointerdown", e => {
    if (e.target.closest && e.target.closest("button, input, a, .layerbar")) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    anim = null;
    if (ptrs.size === 1) {
      moved = false; start = { x: e.clientX, y: e.clientY };
      gmode = (e.button === 2 || e.ctrlKey || e.shiftKey || e.altKey || e.metaKey) ? "rot" : "pan";
      place(); grab = ground(e.clientX, e.clientY);
    } else last2 = null;
  });
  host.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId), p = { x: e.clientX, y: e.clientY };
    ptrs.set(e.pointerId, p);
    if (ptrs.size === 1) {
      if (!moved && Math.hypot(p.x - start.x, p.y - start.y) < 5) return;
      if (!moved) { moved = true; host.classList.add("dragging"); try { host.setPointerCapture(e.pointerId); } catch (_) {} }
      if (gmode === "pan") {
        place(); const g = ground(p.x, p.y);
        if (g && grab) { S.x += grab.x - g.x; S.z += grab.z - g.z; clampAll(); }
      } else { S.h += (p.x - prev.x) * .006; S.t -= (p.y - prev.y) * .005; clampAll(); }
      req();
    } else if (ptrs.size === 2) {
      moved = true;
      const [a, b] = [...ptrs.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (last2) {
        zoomAt(dist / last2.dist, mid.x, mid.y);
        S.h -= wrap(ang - last2.ang);
        S.t -= (mid.y - last2.mid.y) * .004;
        clampAll(); req();
      }
      last2 = { dist, ang, mid };
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    last2 = null;
    if (ptrs.size === 1) { const [p] = [...ptrs.values()]; gmode = "pan"; place(); grab = ground(p.x, p.y); }
    if (ptrs.size === 0) { host.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); }
  };
  host.addEventListener("pointerup", endPtr);
  host.addEventListener("pointercancel", endPtr);
  host.addEventListener("contextmenu", e => e.preventDefault());
  host.addEventListener("wheel", e => { e.preventDefault(); anim = null; zoomAt(Math.exp(-e.deltaY * .0022), e.clientX, e.clientY); }, { passive: false });

  /* ---- tema ---- */
  const retheme = () => { recolor(); recolorTrees(); texDirty = true; req(); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(retheme, 30)); } catch (_) {}
  new MutationObserver(() => setTimeout(retheme, 30)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---- quadro ---- */
  let need = false;
  function req() { if (!need) { need = true; requestAnimationFrame(frame); } }
  const info = () => ({ zoom: fullD / S.d, kmPerPx: 2 * S.d * tanV() / Hh, head: S.h, tilt: S.t, width: W, height: Hh });
  function frame(now) {
    need = false;
    if (anim) { stepAnim(now); req(); }
    if (texDirty) { texDirty = false; paintExtras(); tex.needsUpdate = true; }
    place();
    if (Math.abs(heightW(S.x, S.z) * .7 - ty) > .05) req();
    renderer.render(scene, cam);
    if (o.onFrame) o.onFrame(info());
  }
  const v3 = new THREE.Vector3();
  function project([lon, lat], extra = 0) {
    const [x, z] = toW(lon, lat);
    v3.set(x, heightW(x, z) + extra, z).project(cam);
    const front = v3.z > -1 && v3.z < 1, ok = front && Math.abs(v3.x) < 1.5 && Math.abs(v3.y) < 1.5;
    return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * Hh, ok, front];
  }

  resize();
  return {
    ok: true, project, fit, flyTo, info,
    view: () => ({ ...S }),
    setView(v, dur = 600) { flyTo(v, dur); },
    centerOn([lon, lat], dur = 700) { const [x, z] = toW(lon, lat); flyTo({ x, z }, dur); },
    zoomBy(f, dur = 380) { flyTo({ d: Math.min(fullD * 1.3, Math.max(MIND, S.d / f)) }, dur); },
    fitAll(dur = 1000) { const t = (WX / WZ > 1.8 ? 36 : 52) * DEG; flyTo({ x: 0, z: 0, d: Math.min(fullD * 1.3, fitDist(WX, WZ, t) * 1.12), h: 0, t }, dur); },
    setBlend(t) { blendNow = t; if (o.atlasBlend === false) atlas.draw(true); else atlas.setBlend(t); req(); },
    refreshTexture() { if (refreshPending) return; refreshPending = true; requestAnimationFrame(() => { refreshPending = false; atlas.draw(true); }); },
    setLand(geo) { if (geo) landRings = polyRings(geo); if (landResolve) landResolve(); },
    setExag(k) { exag = k; applyExag(); req(); },
    setVegetation(on) { vegOn = !!on; if (trees) trees.forEach(t => { t.mesh.visible = vegOn; }); req(); },
    requestRender: req,
    dragged: () => moved
  };
}
return { create };
})();

</script>
<script>
const DATA = {"projeto":"Atlas dos Grandes Generais Romanos","eras":[{"id":"punicas","nome":"Guerras Púnicas","curto":"Púnicas","anos":"237–183 a.C.","cor":"#8a63b5"},{"id":"crise","nome":"Crise da República","curto":"Crise da República","anos":"134–48 a.C.","cor":"#2f8f5b"},{"id":"fim","nome":"César e o fim da República","curto":"Fim da República","anos":"75–12 a.C.","cor":"#c9a227"},{"id":"imperio","nome":"Alto Império","curto":"Império","anos":"44 a.C.–117 d.C.","cor":"#a8732f"}],"generais":[{"id":"anibal","nome":"Aníbal Barca","latim":"Hannibal Barca","cor":"#6d3a8c","vida":"247–183 a.C.","papel":"Cartaginês · inimigo de Roma","fontes":["Políbio, Histórias III, VII–XV","Tito Lívio, Ab Urbe Condita XXI–XXX","Cornélio Nepos, Vida de Aníbal","Apiano, Guerra de Aníbal"],"resumo":"Filho de Amílcar Barca, Aníbal cresceu na Hispânia jurando nunca ser amigo de Roma. Aos 29 anos atravessou os Pireneus, o Ródano e os Alpes com elefantes, destruiu três exércitos romanos em três anos e passou dezesseis anos na Itália sem perder uma batalha de campo ali. Nunca tomou Roma. Chamado de volta para defender Cartago, perdeu em Zama para o aluno que melhor o havia estudado, e terminou a vida em fuga pelos reinos do Oriente.","paradas":[{"nome":"O juramento","moderno":"Cartago, Tunísia","lat":36.853,"lon":10.323,"ano":-237,"tempo":"237 a.C.","texto":"Aníbal tem nove anos. Seu pai, Amílcar Barca, comandou Cartago na Primeira Guerra Púnica e saiu dela invicto em terra, mas derrotado pela política: a cidade aceitou a paz, perdeu a Sicília e, logo depois, a Sardenha e a Córsega, arrancadas por Roma num momento de fraqueza. Antes de partir para a Hispânia, onde pretende reconstruir o poder da família, Amílcar oferece um sacrifício a Baal Hammon.\n\nO menino pede para ir junto. O pai concorda com uma condição: leva-o ao altar, faz que ponha a mão sobre a vítima e jure que jamais será amigo dos romanos. A cena é contada pelo próprio Aníbal, já velho, ao rei Antíoco III, para provar que suas intenções eram sinceras. É a origem da expressão que atravessou os séculos como “ódio de Aníbal”.","sentido":"Tudo o que vem depois é a execução, ao longo de uma vida inteira, de uma promessa feita por uma criança.","hoje":"As ruínas de Cartago ficam num subúrbio de Túnis. O que se vê hoje é sobretudo a cidade romana reconstruída por César e Augusto; da Cartago púnica restam o tofet de Salammbô, os portos circulares e o bairro de Byrsa.","ref":"Políbio III 11 · Lívio XXI 1","certeza":"Sítio arqueológico"},{"nome":"Gades","moderno":"Cádiz, Espanha","lat":36.529,"lon":-6.292,"ano":-237,"tempo":"237 a.C.","texto":"A família Barca desembarca em Gades, a velha colônia fenícia além das Colunas de Hércules. A partir dali, Amílcar conquista o vale do Bétis (Guadalquivir), com suas minas de prata, e transforma o sul da Hispânia num reino quase pessoal, que paga a indenização de guerra a Roma e sustenta um exército profissional.\n\nAníbal cresce nos acampamentos. Aprende com mercenários líbios, ibéricos, baleares e gauleses; fala várias línguas; vê o pai morrer afogado num rio em 229 a.C., durante uma retirada. O cunhado, Asdrúbal, o Belo, assume, funda Cartago Nova e é assassinado em 221 a.C. O exército, sem consultar Cartago, aclama Aníbal comandante. Ele tem 25 anos.","sentido":"A Hispânia é a fábrica da guerra: prata para pagar soldados e soldados que nunca viram Roma.","hoje":"Cádiz se considera a cidade mais antiga do Ocidente. Do santuário de Melqart, onde Aníbal fez votos antes da expedição, não resta nada visível; estátuas de bronze do deus foram achadas no mar ao largo de Sancti Petri.","ref":"Políbio II 1, III 10 · Lívio XXI 2–4","certeza":"Nome preservado"},{"nome":"Sagunto","moderno":"Sagunto, Espanha","lat":39.679,"lon":-0.276,"ano":-219,"tempo":"219 a.C.","texto":"Sagunto é uma cidade ibérica ao sul do rio Ebro, a fronteira acordada entre Roma e Cartago em 226 a.C. Mas os saguntinos se declaram amigos de Roma e se envolvem em brigas com vizinhos aliados de Cartago. Aníbal decide que a cidade é a provocação perfeita: se Roma não reagir, perde a face; se reagir, terá começado a guerra que ele deseja.\n\nO cerco dura oito meses. Aníbal é ferido na coxa por uma lança; os saguntinos defendem cada muro com uma arma incendiária chamada falárica. Roma manda embaixadores, que são recebidos com frieza. Quando a cidade cai, muitos habitantes preferem queimar seus bens e a si mesmos. Em Cartago, um embaixador romano dobra a toga e diz que ali traz a paz ou a guerra; os cartagineses respondem que escolha ele. Ele solta a dobra: guerra.","sentido":"O estopim da Segunda Guerra Púnica, escolhido a dedo por Aníbal.","hoje":"O castelo de Sagunto, sobre a colina, guarda camadas ibéricas, romanas e árabes. O teatro romano, restaurado de forma polêmica nos anos 1990, fica logo abaixo.","ref":"Políbio III 17 · Lívio XXI 7–15","certeza":"Sítio arqueológico"},{"nome":"Cartago Nova","moderno":"Cartagena, Espanha","lat":37.6,"lon":-0.983,"ano":-218,"tempo":"218 a.C.","texto":"Na primavera de 218 a.C., Aníbal reúne em Cartago Nova cerca de 90 mil soldados de infantaria, 12 mil cavaleiros e 37 elefantes. Deixa o irmão Asdrúbal guardando a Hispânia e manda tropas ibéricas para a África, enquanto traz líbios para a Hispânia: assim ninguém luta perto de casa e as deserções ficam mais difíceis.\n\nO plano é inédito. Roma domina o mar; uma invasão naval seria suicídio. Aníbal vai por terra, mais de 1.500 km, atravessando territórios hostis, para chegar à Itália pelo norte, onde os gauleses da planície do Pó acabaram de ser derrotados por Roma e estão prontos a se rebelar. Antes de partir, conta-se que sonhou com um guia divino e uma serpente enorme devastando tudo atrás de si: a destruição da Itália.","sentido":"A estratégia inteira cabe numa frase: levar a guerra para dentro da Itália e desmontar a rede de aliados de Roma.","hoje":"Cartagena preserva parte da muralha púnica (Muralla Púnica) e um grande teatro romano descoberto em 1988. O porto continua sendo base naval espanhola.","ref":"Políbio III 33–35 · Lívio XXI 21–23","certeza":"Sítio arqueológico"},{"nome":"Travessia do Ródano","moderno":"Perto de Fourques/Roquemaure, França","lat":43.95,"lon":4.7,"ano":-218,"tempo":"218 a.C.","texto":"Os volcas esperam na margem leste do Ródano, gritando e batendo nos escudos. Aníbal compra todos os barcos e canoas da região e manda, à noite, o oficial Hanão subir o rio com uma tropa, atravessar num ponto mais calmo e se esconder. Ao sinal de fumaça, Hanão ataca os gauleses pelas costas enquanto o grosso do exército atravessa remando.\n\nOs elefantes são o problema. Os engenheiros constroem jangadas enormes, cobertas de terra para parecerem chão firme, e as unem à margem como um cais. Fêmeas vão na frente. No meio do rio, as jangadas são soltas; alguns animais entram em pânico e caem na água, mas atravessam andando no fundo, com a tromba para fora. Três dias depois, o cônsul Públio Cornélio Cipião chega ao local com seu exército e encontra o acampamento vazio.","sentido":"O primeiro sinal de que Aníbal resolve problemas que outros generais nem imaginam ter.","hoje":"O ponto exato da travessia é desconhecido; as hipóteses vão de Fourques, perto de Arles, até Roquemaure, mais ao norte, a quatro dias de marcha do mar, como diz Políbio.","ref":"Políbio III 42–46 · Lívio XXI 26–28","certeza":"Local debatido"},{"nome":"Passo dos Alpes","moderno":"Col de la Traversette (hipótese), França–Itália","lat":44.68,"lon":7.03,"ano":-218,"tempo":"218 a.C.","texto":"É fim de outubro. Os alóbroges atacam a coluna nos desfiladeiros, rolando pedras sobre os animais de carga; Aníbal contra-ataca tomando as alturas à noite. No nono dia chega ao cume. Neva. Os soldados, exaustos, querem desistir; Aníbal os leva a um ponto de onde se vê a planície do Pó e diz que ali estão as muralhas de Roma.\n\nA descida é pior que a subida. Um deslizamento destruiu a trilha. Segundo Lívio, os soldados acendem fogueiras sobre a rocha e jogam vinagre para rachá-la, abrindo caminho para os elefantes. Quinze dias depois de começar a escalada, Aníbal chega à Itália com cerca de 20 mil soldados de infantaria e 6 mil cavaleiros. Perdeu quase metade do exército que tinha no Ródano.","sentido":"A travessia virou o símbolo da audácia militar, mas custou caríssimo: Aníbal chega à Itália com um exército menor que o de um único cônsul.","hoje":"O passo exato é a mais longa discussão da história antiga. Col du Clapier, Mont Cenis, Petit Saint-Bernard e Col de la Traversette têm defensores. Em 2016, uma equipe liderada por William Mahaney achou no Traversette uma camada de solo revolvido rica em resíduos de animais, datada da época certa.","ref":"Políbio III 50–56 · Lívio XXI 32–38","certeza":"Local debatido"},{"nome":"Ticino","moderno":"Perto de Pavia, Itália","lat":45.2,"lon":8.95,"ano":-218,"tempo":"218 a.C.","texto":"O cônsul Públio Cipião voltou às pressas por mar e encontra Aníbal na planície ao norte do Pó. Os dois saem para reconhecer o terreno com a cavalaria e os vélites, e as vanguardas se chocam junto ao rio Ticino.\n\nA cavalaria númida de Aníbal, montada em pelo, sem freio, contorna os flancos romanos e cai sobre os vélites pela retaguarda. Cipião é gravemente ferido; segundo a tradição, seu filho de 17 anos, o futuro Africano, avança sozinho e o tira do cerco. Os romanos recuam e destroem a ponte atrás de si. Foi uma escaramuça, mas mostrou a superioridade da cavalaria cartaginesa. Logo depois, tribos gaulesas começam a passar para o lado de Aníbal.","sentido":"O primeiro encontro: pequeno, mas suficiente para que a Gália Cisalpina mude de lado.","hoje":"A batalha teria ocorrido na margem oeste do Ticino, entre Vigevano e Pavia; não há vestígios arqueológicos identificados.","ref":"Políbio III 64–65 · Lívio XXI 45–46","certeza":"Local aproximado","batalha":{"tipo":"Escaramuça de cavalaria","vencedor":"Cartago","forcas":"c. 6.000 cav. (Aníbal) × c. 4.000 cav. + vélites (Roma)","baixas":"Cipião ferido; perdas romanas moderadas"}},{"nome":"Trébia","moderno":"Rio Trebbia, perto de Piacenza, Itália","lat":45.05,"lon":9.6,"ano":-218,"tempo":"218 a.C.","texto":"Dezembro. O outro cônsul, Semprônio Longo, junta-se a Cipião, que ainda se recupera do ferimento e aconselha prudência. Semprônio quer vencer antes do fim do mandato. Aníbal percebe o temperamento do adversário e prepara a armadilha.\n\nNa véspera, esconde seu irmão Magão com mil cavaleiros e mil infantes num leito de riacho coberto de mato. Ao amanhecer, manda os númidas provocarem o acampamento romano. Semprônio tira os soldados da cama sem café, faz que atravessem o Trébia gelado com água no peito, debaixo de neve, e os alinha do outro lado, tremendo. Os cartagineses tinham comido e se untado de óleo junto às fogueiras. Quando a batalha está engajada, Magão sai da emboscada e ataca pela retaguarda. Dos 40 mil romanos, só cerca de 10 mil rompem o cerco.","sentido":"Aníbal derrota primeiro a mente do adversário e só depois o exército.","hoje":"O campo de batalha fica entre Rivergaro e a confluência do Trebbia com o Pó. A cidade de Piacenza (Placentia), colônia romana fundada naquele mesmo ano, resistiu ao cerco.","ref":"Políbio III 70–74 · Lívio XXI 52–56","certeza":"Local aproximado","batalha":{"tipo":"Vitória cartaginesa","vencedor":"Cartago","forcas":"c. 40.000 (Aníbal) × c. 40.000 (Roma)","baixas":"Roma: c. 20.000–30.000 mortos ou capturados"}},{"nome":"Lago Trasimeno","moderno":"Tuoro sul Trasimeno, Itália","lat":43.2,"lon":12.07,"ano":-217,"tempo":"217 a.C.","texto":"Na primavera, Aníbal atravessa os pântanos do Arno. Por quatro dias a coluna marcha com água até os joelhos; os soldados dormem em cima dos cadáveres dos animais. Aníbal pega uma infecção e perde a visão de um olho. Depois devasta a Etrúria debaixo dos olhos do cônsul Caio Flamínio, para provocá-lo.\n\nNa margem norte do lago Trasimeno, a estrada passa por uma faixa estreita entre a água e as colinas. Aníbal esconde o exército inteiro nas encostas. Em 21 de junho, numa manhã de névoa densa, Flamínio entra no corredor sem reconhecer o terreno. Ao sinal, todos descem ao mesmo tempo. Os romanos não conseguem nem formar fileiras; muitos se afogam tentando fugir pelo lago. Flamínio é morto por um cavaleiro gaulês. Foi talvez a maior emboscada da história.","sentido":"Um exército inteiro destruído em três horas, sem chance de formar linha de batalha.","hoje":"Entre Tuoro e Passignano há um percurso histórico com mirantes. Escavações acharam valas comuns com cinzas, os chamados ustrini, embora sua datação seja debatida; um riacho local ainda se chama Sanguineto.","ref":"Políbio III 82–85 · Lívio XXII 4–7","certeza":"Local identificado","batalha":{"tipo":"Emboscada","vencedor":"Cartago","forcas":"c. 50.000 (Aníbal) × c. 25.000 (Roma)","baixas":"Roma: c. 15.000 mortos, 6.000–15.000 capturados"}},{"nome":"Canas","moderno":"Canne della Battaglia, Itália","lat":41.306,"lon":16.132,"ano":-216,"tempo":"216 a.C.","texto":"Em Roma, o Senado nomeia ditador Quinto Fábio Máximo, que adota a estratégia de seguir Aníbal sem nunca aceitar batalha. Ganha o apelido de Cunctator, o protelador, e a impaciência pública. Para 216 a.C., Roma reúne o maior exército de sua história: oito legiões e aliados, cerca de 86 mil homens, sob os cônsules Lúcio Emílio Paulo e Caio Terêncio Varrão, que comandam em dias alternados.\n\nNo dia de Varrão, 2 de agosto, os romanos atacam numa planície junto ao rio Áufido. Aníbal coloca no centro gauleses e iberos em formato de meia-lua, avançada contra o inimigo; nas pontas, os veteranos líbios. O centro recua devagar, de propósito, e os romanos se amontoam empurrando para dentro. Enquanto isso, a cavalaria pesada de Asdrúbal destrói a cavalaria romana, contorna o campo, ajuda os númidas a dispersar a cavalaria aliada e cai sobre a retaguarda das legiões. Os líbios giram e fecham os flancos. Dezenas de milhares de romanos ficam presos num bolsão sem espaço para usar as armas.","sentido":"Canas é o modelo de batalha de aniquilação estudado em academias militares até hoje. É também a prova de que vencer batalhas não basta para vencer uma guerra.","hoje":"Em Canne della Battaglia há um antiquarium e as ruínas da cidadela medieval. A posição exata do campo de batalha, se na margem norte ou sul do Ofanto, continua em debate.","ref":"Políbio III 107–117 · Lívio XXII 40–52","certeza":"Local aproximado","batalha":{"tipo":"Duplo envolvimento","vencedor":"Cartago","forcas":"c. 50.000 (Aníbal) × c. 86.000 (Roma)","baixas":"Roma: 50.000–70.000 mortos; Cartago: c. 6.000","diagrama":"canas"}},{"nome":"Cápua","moderno":"Santa Maria Capua Vetere, Itália","lat":41.081,"lon":14.254,"ano":-216,"tempo":"216 a.C.","texto":"Depois de Canas, Maharbal, chefe da cavalaria, quer marchar imediatamente sobre Roma. Aníbal recusa: não tem máquinas de cerco, e a cidade tem muralhas e homens de sobra. Maharbal teria respondido que Aníbal sabe vencer, mas não sabe aproveitar a vitória.\n\nO plano dele é outro: desmontar a confederação itálica. Cápua, a segunda cidade da Itália, passa para o lado cartaginês, seguida por boa parte do sul. O exército inverna ali, e a tradição romana conta que o luxo da cidade amoleceu os soldados, as famosas “delícias de Cápua”. A verdade é mais simples: a maioria dos aliados latinos e das colônias romanas permanece fiel. Em 211 a.C., Roma cerca Cápua. Aníbal não consegue romper o cerco, a cidade cai e seus líderes são executados.","sentido":"A aposta estratégica de Aníbal, desfazer a aliança itálica, só funcionou pela metade, e isso decidiu a guerra.","hoje":"O anfiteatro de Santa Maria Capua Vetere, a antiga Cápua, é o segundo maior da Itália. Foi na escola de gladiadores da cidade que, mais de um século depois, começou a revolta de Espártaco.","ref":"Políbio IX 3–9 · Lívio XXIII 1–18, XXVI 1–16","certeza":"Sítio arqueológico"},{"nome":"Portas de Roma","moderno":"Roma, Itália","lat":41.905,"lon":12.505,"ano":-211,"tempo":"211 a.C.","texto":"Para forçar os romanos a levantar o cerco de Cápua, Aníbal faz o impensável: marcha sobre a própria Roma. Acampa a cerca de 5 km das muralhas, junto ao rio Anio, e cavalga com 2 mil cavaleiros até a Porta Colina para inspecionar as defesas.\n\nO pânico na cidade é enorme, e a frase “Hannibal ad portas” vira, dali em diante, o grito de alarme romano por excelência. Mas Roma não morde a isca: o exército de Cápua fica onde está, e há legiões suficientes na cidade para defendê-la. Lívio conta que, por duas vezes, uma tempestade violenta impediu a batalha, e que o terreno onde Aníbal acampava foi vendido em leilão no Fórum, pelo preço normal, enquanto ele ainda estava lá. Aníbal recua.","sentido":"O momento em que Aníbal esteve mais perto de Roma foi também a prova de que não poderia tomá-la.","hoje":"A Porta Colina ficava perto da atual Via XX Settembre; dela restam fragmentos da Muralha Serviana, como o trecho visível junto à estação Termini.","ref":"Políbio IX 5–7 · Lívio XXVI 7–11","certeza":"Local aproximado"},{"nome":"Metauro","moderno":"Rio Metauro, perto de Fano, Itália","lat":43.72,"lon":12.9,"ano":-207,"tempo":"207 a.C.","texto":"Em 208 a.C., o irmão de Aníbal, Asdrúbal, escapa da Hispânia e repete a travessia dos Alpes com um segundo exército. Se os dois irmãos se unirem, Roma pode cair. Mas os mensageiros de Asdrúbal são capturados com as cartas que indicam o ponto de encontro.\n\nO cônsul Caio Cláudio Nero, que vigia Aníbal no sul, toma uma decisão ousadíssima: sai à noite com 7 mil homens escolhidos, marcha cerca de 400 km para o norte em uma semana e se junta em segredo ao colega Lívio Salinator. Asdrúbal só percebe quando ouve as trombetas tocarem duas vezes no acampamento romano: há dois cônsules. Tenta recuar, se perde junto ao rio Metauro e é obrigado a lutar. Morre na batalha. Nero volta ao sul e manda jogar a cabeça de Asdrúbal diante dos postos avançados de Aníbal. Diz-se que Aníbal, ao reconhecê-la, falou que agora via o destino de Cartago.","sentido":"O fim da esperança de reforços. Depois do Metauro, Aníbal fica encurralado no sul da Itália.","hoje":"O local da batalha é discutido ao longo do baixo Metauro. Em Fano, a antiga Fanum Fortunae, um arco de Augusto marca o fim da Via Flamínia.","ref":"Políbio XI 1–3 · Lívio XXVII 43–51","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (Asdrúbal) × c. 40.000 (Roma)","baixas":"Cartago: c. 10.000–20.000 mortos; Asdrúbal morto"}},{"nome":"Crotona","moderno":"Crotone, Itália","lat":39.081,"lon":17.127,"ano":-203,"tempo":"203 a.C.","texto":"Durante quatro anos, Aníbal resiste no Brútio, a ponta da bota italiana, invicto mas imobilizado. Em 204 a.C., Cipião desembarca na África. Cartago chama Aníbal de volta.\n\nAntes de partir, no santuário de Hera Lacínia, perto de Crotona, ele manda gravar uma inscrição bilíngue, em púnico e grego, com o relato de suas campanhas e o número de tropas. Políbio, que a leu, usou esses números. Conta-se também que Aníbal massacrou os soldados itálicos que se recusaram a segui-lo, episódio provavelmente exagerado pela propaganda romana. Depois de quinze anos na Itália, ele embarca e, segundo Lívio, olha para trás enquanto a costa desaparece, amaldiçoando a si mesmo por não ter marchado sobre Roma depois de Canas.","sentido":"Quinze anos de vitórias terminam numa partida silenciosa por mar.","hoje":"Do templo de Hera Lacínia, no Capo Colonna, sobra uma única coluna dórica de pé, diante do mar Jônico.","ref":"Políbio III 33, 56 · Lívio XXVIII 46, XXX 20","certeza":"Sítio arqueológico"},{"nome":"Zama","moderno":"Perto de Sakiet Sidi Youssef ou Jama, Tunísia","lat":36.1,"lon":9.0,"ano":-202,"tempo":"202 a.C.","texto":"Aníbal desembarca em Leptis Minor e reúne um exército heterogêneo: veteranos da Itália, mercenários de Magão, recrutas cartagineses e 80 elefantes. Antes da batalha, pede um encontro pessoal com Cipião. Os dois generais conversam entre as linhas, com apenas intérpretes, e não chegam a acordo.\n\nNo dia seguinte, Aníbal lança os elefantes primeiro. Cipião deixou corredores entre os manípulos e manda tocar trombetas: os animais assustados correm pelos corredores ou se voltam contra a própria cavalaria cartaginesa. As infantarias se chocam em três linhas de cada lado. O combate fica equilibrado até a cavalaria de Lélio e do rei númida Masinissa voltar da perseguição e cair sobre a retaguarda de Aníbal. É Canas ao contrário. Aníbal escapa para Hadrumeto e aconselha Cartago a aceitar a paz.","sentido":"A única derrota de Aníbal em batalha campal decidiu a guerra.","hoje":"O local exato é desconhecido. Zama Regia foi identificada em Jama, perto de Siliana, mas Lívio situa o acampamento de Cipião em Naraggara, a atual Sakiet Sidi Youssef, na fronteira com a Argélia. O ponto no mapa fica entre as duas hipóteses.","ref":"Políbio XV 1–19 · Lívio XXX 29–35","certeza":"Local debatido","batalha":{"tipo":"Vitória romana decisiva","vencedor":"Roma","forcas":"c. 40.000 + 80 elefantes (Aníbal) × c. 35.000 (Cipião)","baixas":"Cartago: c. 20.000 mortos e 20.000 capturados; Roma: c. 2.500","diagrama":"zama"}},{"nome":"Exílio e morte","moderno":"Libissa, perto de Gebze, Turquia","lat":40.77,"lon":29.43,"ano":-183,"tempo":"183 a.C.","texto":"Depois da guerra, Aníbal é eleito sufete em Cartago e faz reformas que irritam a oligarquia, que o denuncia a Roma. Em 195 a.C., foge de noite para Tiro, a cidade-mãe de Cartago, e daí para a corte de Antíoco III em Éfeso. Diz-se que ali reencontrou Cipião, que lhe perguntou quem era o maior general da história. Aníbal respondeu: Alexandre, depois Pirro, depois ele mesmo. E se tivesse vencido Cipião? Então seria o primeiro.\n\nAntíoco não lhe dá comando de exército e é derrotado em Magnésia. Roma exige a entrega de Aníbal. Ele passa por Creta, onde engana os habitantes deixando ânforas cheias de chumbo no templo, e chega à Bitínia, cujo rei Prúsias I o usa contra Pérgamo. Numa batalha naval, Aníbal manda lançar nos navios inimigos potes cheios de serpentes venenosas. Em 183 a.C., quando soldados romanos cercam sua casa em Libissa, toma o veneno que carregava num anel, dizendo que livraria os romanos de sua longa ansiedade.","sentido":"O homem que fez Roma tremer morre como fugitivo, no mesmo ano que seu vencedor.","hoje":"Libissa ficava perto da atual Gebze, a leste de Istambul. Um memorial moderno a Aníbal foi erguido na região em 1981.","ref":"Lívio XXXIX 51 · Nepos, Aníbal 9–12 · Plutarco, Flaminino 20","certeza":"Local aproximado"}],"era":"punicas","rivais":["cipiao"]},{"id":"cipiao","nome":"Cipião Africano","latim":"Publius Cornelius Scipio Africanus","cor":"#c0392b","vida":"236–183 a.C.","papel":"Vencedor de Aníbal","fontes":["Políbio, Histórias X, XI, XIV–XV","Tito Lívio XXI–XXXVIII","Apiano, Guerras Ibéricas e Líbicas","Valério Máximo"],"resumo":"Filho e sobrinho de cônsules mortos por Cartago, Cipião viu Roma quase acabar em Canas. Aos 25 anos, sem ter sido cônsul, pediu o comando da Hispânia que ninguém queria. Tomou Cartago Nova num golpe, venceu três exércitos cartagineses e levou a guerra para a África, onde derrotou Aníbal com as táticas que aprendera dele. Ganhou o nome Africano, foi o homem mais poderoso de Roma e terminou a vida em autoexílio, acusado de corrupção pelos inimigos políticos.","paradas":[{"nome":"Ticino: o primeiro feito","moderno":"Perto de Pavia, Itália","lat":45.2,"lon":8.95,"ano":-218,"tempo":"218 a.C.","texto":"Cipião tem 17 anos e cavalga ao lado do pai, o cônsul Públio Cornélio Cipião, no primeiro choque com Aníbal. A cavalaria númida envolve os romanos; o cônsul é ferido e fica cercado com poucos homens.\n\nSegundo Políbio, que ouviu a história de Lélio, amigo íntimo de Cipião, o rapaz grita para a escolta acompanhá-lo; como ela hesita, ele avança sozinho contra os inimigos. Os outros, envergonhados, o seguem, e o cônsul é salvo. Cipião recusa a coroa cívica, a mais alta condecoração para quem salva um cidadão, dizendo que o feito era recompensa suficiente. Lívio menciona outra versão, em que o salvador teria sido um escravo lígure, mas prefere a do filho.","sentido":"A lenda de Cipião começa com um ato de coragem pessoal num dia de derrota.","hoje":"O local da escaramuça é aproximado, entre Vigevano e Pavia, na margem oeste do rio Ticino.","ref":"Políbio X 3 · Lívio XXI 46","certeza":"Local aproximado"},{"nome":"Canusium","moderno":"Canosa di Puglia, Itália","lat":41.222,"lon":16.066,"ano":-216,"tempo":"216 a.C.","texto":"Canas acabou de acontecer. Cipião, tribuno militar, está entre os cerca de 10 mil sobreviventes refugiados em Canusium. Correm boatos de que Roma está perdida, e um grupo de jovens nobres liderado por Lúcio Cecílio Metelo planeja fugir da Itália e oferecer seus serviços a algum rei estrangeiro.\n\nCipião entra na sala onde eles conspiram com a espada desembainhada e obriga cada um a jurar, um por um, que não abandonará Roma, sob ameaça de morte. Em seguida, junto com Ápio Cláudio, assume a organização dos sobreviventes. Esses homens, desonrados pela derrota, serão mandados para a Sicília como punição e esquecidos por uma década. Cipião não os esquecerá.","sentido":"No pior momento da história de Roma, um rapaz de 20 anos se recusa a desistir.","hoje":"Canosa conserva hipogeus daúnios, um arco romano e a catedral de São Sabino. A cidade era aliada fiel de Roma e acolheu os fugitivos de Canas.","ref":"Lívio XXII 53 · Valério Máximo V 6","certeza":"Sítio arqueológico"},{"nome":"Tarraco","moderno":"Tarragona, Espanha","lat":41.116,"lon":1.255,"ano":-210,"tempo":"210 a.C.","texto":"Em 211 a.C., o pai e o tio de Cipião, que comandavam a guerra na Hispânia, são mortos com seus exércitos, um após o outro, nas batalhas do alto Bétis. A Hispânia romana se reduz a uma faixa ao norte do Ebro. Em Roma, ninguém quer o comando.\n\nCipião, com 25 anos e sem ter sido nem pretor, apresenta-se nos comícios. O povo o elege por unanimidade, num gesto sem precedentes. Ele desembarca em Tarraco com 10 mil soldados de reforço e passa o inverno estudando. Descobre que os três exércitos cartagineses na Hispânia estão a mais de dez dias de marcha de sua base principal, e que os generais cartagineses brigam entre si. Cipião cultiva desde já a imagem de favorito dos deuses: passa horas sozinho no templo de Júpiter e deixa circular o rumor de que é filho de uma serpente divina.","sentido":"Um comando que ninguém queria, entregue a um jovem que já tinha um plano.","hoje":"Tarragona, capital da Hispânia Citerior romana, é Patrimônio Mundial da UNESCO: muralhas, anfiteatro diante do mar, circo e pretório.","ref":"Políbio X 6–7 · Lívio XXVI 18–20","certeza":"Sítio arqueológico"},{"nome":"Cartago Nova","moderno":"Cartagena, Espanha","lat":37.6,"lon":-0.983,"ano":-209,"tempo":"209 a.C.","texto":"Cipião marcha 500 km para o sul em sete dias e aparece diante de Cartago Nova, a capital cartaginesa na Hispânia, guardada por apenas mil soldados. A cidade fica numa península entre o mar e uma laguna. Pescadores de Tarraco lhe contaram que, no fim da tarde, a laguna fica rasa o bastante para atravessar a pé.\n\nNo primeiro dia, os ataques pela frente fracassam. Cipião diz aos soldados que Netuno lhe apareceu em sonho prometendo ajuda. Quando o nível da laguna baixa, 500 homens atravessam a água com escadas e sobem pela muralha desguarnecida, enquanto o ataque frontal prende os defensores. A cidade cai em um dia. Cipião captura o tesouro, os estaleiros e 300 reféns ibéricos, que devolve às famílias. Diz-se que lhe trouxeram uma jovem cativa de grande beleza; ao saber que estava prometida a um chefe celtibero, Cipião a devolveu intacta e deu o resgate como presente de casamento.","sentido":"Num único dia, Cartago perde a capital, o dinheiro e os reféns que mantinham a Hispânia em ordem.","hoje":"Em Cartagena, o Museu do Teatro Romano e o Centro de Interpretação da Muralha Púnica contam o cerco. A laguna, o Almarjal, foi drenada no século XIX.","ref":"Políbio X 8–20 · Lívio XXVI 41–51","certeza":"Sítio arqueológico","batalha":{"tipo":"Assalto anfíbio","vencedor":"Roma","forcas":"c. 27.500 (Cipião) × c. 1.000 soldados + milícia (Cartago)","baixas":"Baixas leves para Roma"}},{"nome":"Baécula","moderno":"Perto de Bailén, Espanha","lat":38.08,"lon":-3.77,"ano":-208,"tempo":"208 a.C.","texto":"Cipião enfrenta Asdrúbal Barca, irmão de Aníbal, entrincheirado numa colina de dois níveis. Lança a infantaria leve contra a frente para fixar o inimigo e, ao mesmo tempo, sobe com metade das legiões por um flanco, enquanto Lélio sobe pelo outro. O exército de Asdrúbal é empurrado para fora da colina.\n\nMas Asdrúbal já tinha previsto a retirada: escapa com o tesouro, os elefantes e o grosso das tropas e segue para o norte, rumo aos Pireneus e à Itália. Cipião não o persegue, o que mais tarde será criticado. Depois da batalha, os iberos aclamam Cipião como rei. Ele recusa o título, que um romano jamais poderia aceitar, e pede que o chamem de imperator, o general vitorioso.","sentido":"Uma vitória tática que deixou escapar o adversário, e o perigo seguiu para a Itália.","hoje":"O campo de batalha foi identificado em 2014, por arqueólogos da Universidade de Jaén, no Cerro de las Albahacas, perto de Santo Tomé, graças a projéteis de funda e restos de acampamento.","ref":"Políbio X 38–40 · Lívio XXVII 17–20","certeza":"Sítio arqueológico","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 35.000 (Cipião) × c. 25.000 (Asdrúbal)","baixas":"Cartago: c. 8.000 mortos, 12.000 capturados"}},{"nome":"Ilipa","moderno":"Alcalá del Río, Espanha","lat":37.519,"lon":-5.982,"ano":-206,"tempo":"206 a.C.","texto":"Os cartagineses reúnem seu último grande exército na Hispânia, sob Asdrúbal Giscão e Magão: cerca de 54 mil homens e 32 elefantes. Por vários dias, os dois exércitos se alinham diante dos acampamentos sem lutar, sempre na mesma ordem: legiões romanas no centro, aliados ibéricos nas pontas; veteranos líbios no centro cartaginês.\n\nNo dia decisivo, Cipião inverte tudo. Ataca ao amanhecer, antes de os inimigos comerem, com as legiões nas alas e os ibéricos, menos confiáveis, no centro, avançando devagar. Os líbios, a melhor tropa cartaginesa, ficam presos no centro diante de adversários que não chegam a atacar, enquanto as legiões giram nas pontas e esmagam as alas fracas e os elefantes. É Canas aprendida e melhorada. Uma tempestade salva o exército cartaginês da destruição total, mas a Hispânia está perdida para Cartago.","sentido":"Cipião vence aplicando o envolvimento de Aníbal com uma manobra ainda mais complexa.","hoje":"Ilipa ficava em Alcalá del Río, junto ao Guadalquivir, ao norte de Sevilha. Perto dali, Cipião fundou Itálica para seus veteranos, cidade natal dos imperadores Trajano e Adriano.","ref":"Políbio XI 20–24 · Lívio XXVIII 12–16","certeza":"Local aproximado","batalha":{"tipo":"Envolvimento invertido","vencedor":"Roma","forcas":"c. 48.000 (Cipião) × c. 54.000 + 32 elefantes (Cartago)","baixas":"Cartago: a maior parte do exército destruída na perseguição"}},{"nome":"Siracusa","moderno":"Siracusa, Itália","lat":37.075,"lon":15.286,"ano":-205,"tempo":"205 a.C.","texto":"Cipião volta a Roma, é eleito cônsul aos 30 anos e propõe levar a guerra à África. Fábio Máximo e a velha guarda do Senado se opõem: Aníbal ainda está na Itália. O Senado concede apenas a Sicília, com permissão para cruzar se quiser, mas sem recrutamento.\n\nCipião se vira. Na Sicília estão as duas legiões de sobreviventes de Canas, castigadas há onze anos. Ele as transforma no núcleo de seu exército, junta voluntários e manda construir 30 navios em 45 dias com madeira cortada ainda verde. Em Siracusa, treina a tropa em manobras novas e escandaliza os conservadores andando de manto grego e frequentando o ginásio. Uma comissão do Senado chega para investigar e encontra um exército impecável; vai embora convencida.","sentido":"Os soldados desonrados de Canas viram o exército que vai vencer Aníbal.","hoje":"Em Siracusa ficam o teatro grego, a orelha de Dionísio e a ilha de Ortígia. Arquimedes defendera a cidade contra Roma até 212 a.C., poucos anos antes.","ref":"Lívio XXVIII 40–46, XXIX 19–22","certeza":"Sítio arqueológico"},{"nome":"Desembarque em Útica","moderno":"Perto de Utique, Tunísia","lat":37.056,"lon":10.062,"ano":-204,"tempo":"204 a.C.","texto":"Cerca de 400 navios de transporte e 40 de guerra atravessam o canal da Sicília. Ao ver a costa, Cipião pergunta o nome do promontório. É o Belo Promontório, e ele o toma como bom presságio. Desembarca perto de Útica, a segunda cidade púnica da África.\n\nAli encontra Masinissa, príncipe númida que perdera o trono para o rival Sífax, aliado de Cartago. Masinissa, que conhecera Cipião na Hispânia, traz cavalaria excelente e uma motivação pessoal. O cerco de Útica fracassa, e o exército romano inverna numa península que ganhará o nome de Castra Cornelia.","sentido":"Pela primeira vez desde Régulo, cinquenta anos antes, um exército romano pisa a África.","hoje":"Útica fica hoje a vários quilômetros do mar por causa do assoreamento do rio Medjerda. Há ruínas romanas e um pequeno museu.","ref":"Políbio XIV 1 · Lívio XXIX 24–35","certeza":"Sítio arqueológico"},{"nome":"Grandes Planícies","moderno":"Souk el-Kremis, Tunísia","lat":36.48,"lon":9.2,"ano":-203,"tempo":"203 a.C.","texto":"Sífax e Asdrúbal Giscão acampam perto de Útica com dois exércitos. Durante o inverno, Cipião abre negociações de paz e manda centuriões disfarçados de escravos com os embaixadores, para estudar os acampamentos. Descobrem que os númidas vivem em cabanas de junco e esteira, e os cartagineses, em barracas de madeira.\n\nNuma noite de primavera, Cipião rompe as negociações e ataca. Lélio e Masinissa incendeiam o acampamento númida. Os cartagineses acham que é um acidente e saem desarmados para ajudar; Cipião os ataca e incendeia o acampamento deles também. Semanas depois, nas Grandes Planícies, Cipião vence em campo aberto os exércitos reconstruídos. Sífax é capturado por Masinissa, e Cartago chama Aníbal de volta.","sentido":"Uma operação que hoje seria chamada de guerra psicológica, seguida de vitória em campo aberto.","hoje":"As Grandes Planícies ficavam no vale médio do Medjerda, perto de Souk el-Kremis; o local exato é aproximado.","ref":"Políbio XIV 2–8 · Lívio XXX 3–8","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (Cipião) × c. 30.000 (Cartago e Númidas)","baixas":"Cartago: graves perdas; Sífax capturado"}},{"nome":"Zama","moderno":"Perto de Sakiet Sidi Youssef ou Jama, Tunísia","lat":36.1,"lon":9.0,"ano":-202,"tempo":"202 a.C.","texto":"Diante de Aníbal, Cipião muda a formação romana tradicional. Em vez dos manípulos dispostos em xadrez, alinha-os uns atrás dos outros, deixando corredores retos de ponta a ponta, preenchidos com vélites. Quando os 80 elefantes avançam, os vélites recuam pelos corredores, as trombetas soam e a maioria dos animais passa direto ou foge para os flancos, desorganizando a cavalaria cartaginesa.\n\nLélio e Masinissa expulsam a cavalaria inimiga do campo e a perseguem. As infantarias se enfrentam: os hastados romanos destroem a primeira linha de mercenários, que recua sobre a segunda. Aníbal mantém os veteranos da Itália em reserva, fora do alcance. Cipião reorganiza seus homens com calma, estende a linha e enfrenta os veteranos de igual para igual. O choque fica equilibrado até a cavalaria romana voltar e atacar a retaguarda. É o fim do exército de Aníbal.","sentido":"O aluno vence o mestre com as lições do próprio mestre: a cavalaria que fecha a armadilha por trás.","hoje":"O local exato é desconhecido. Zama Regia foi identificada em Jama, perto de Siliana, mas Lívio situa o acampamento de Cipião em Naraggara, hoje Sakiet Sidi Youssef.","ref":"Políbio XV 9–16 · Lívio XXX 32–35","certeza":"Local debatido","batalha":{"tipo":"Vitória romana decisiva","vencedor":"Roma","forcas":"c. 35.000 (Cipião) × c. 40.000 + 80 elefantes (Aníbal)","baixas":"Cartago: c. 20.000 mortos e 20.000 capturados; Roma: c. 2.500","diagrama":"zama"}},{"nome":"Magnésia","moderno":"Perto de Manisa, Turquia","lat":38.62,"lon":27.43,"ano":-190,"tempo":"190 a.C.","texto":"Doze anos depois, Roma enfrenta Antíoco III, rei selêucida que invadiu a Grécia com Aníbal como conselheiro. O cônsul é o irmão de Cipião, Lúcio, e o Africano o acompanha como legado. Diz-se que Antíoco capturou o filho de Cipião e o devolveu sem resgate, num gesto de cortesia.\n\nNa véspera da batalha, Cipião adoece e fica em Eleia. O comando efetivo cabe a Cneu Domício Enobarbo. Os carros de foice selêucidas são desbaratados por arqueiros e fundeiros, os elefantes indianos entram em pânico, e a falange se transforma num bloco imóvel crivado de dardos. Antíoco perde o império na Ásia Menor. Lúcio ganha o nome Asiático. Mas os inimigos dos Cipiões em Roma começam a perguntar onde foram parar os 500 talentos pagos por Antíoco.","sentido":"A vitória que leva Roma à Ásia, e o começo da queda política dos Cipiões.","hoje":"Magnésia do Sípilo é a atual Manisa. A batalha ocorreu na planície do rio Hermo (Gediz), ao norte da cidade.","ref":"Lívio XXXVII 37–44 · Apiano, Síria 30–36","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (Roma) × c. 70.000 (Antíoco III)","baixas":"Selêucidas: c. 50.000; Roma: c. 350"}},{"nome":"Literno","moderno":"Lago Patria, Itália","lat":40.93,"lon":14.03,"ano":-183,"tempo":"183 a.C.","texto":"Em Roma, Catão, o Velho, lidera os ataques aos Cipiões. Lúcio é acusado de desviar dinheiro de Antíoco. Quando os tribunos exigem as contas, o Africano pega os livros diante do Senado e os rasga em pedaços. Em 187 a.C., ele próprio é processado. No dia do julgamento, que coincide com o aniversário de Zama, Cipião sobe à tribuna e diz que nesse dia não convém discutir, e sim subir ao Capitólio para agradecer aos deuses. A multidão inteira o segue, e os acusadores ficam sozinhos.\n\nMesmo assim, ele se retira para sua propriedade em Literno, na costa da Campânia, e nunca mais volta a Roma. Sêneca, que visitou a casa, descreveu o banheiro escuro e simples. Cipião morre em 183 a.C., provavelmente no mesmo ano que Aníbal. Segundo a tradição, pediu que se gravasse no túmulo: Pátria ingrata, não terás nem os meus ossos.","sentido":"O salvador de Roma termina como o primeiro grande exemplo de um general maior que a República.","hoje":"Liternum fica junto ao lago Patria, ao norte de Nápoles; há ruínas do fórum e um parque arqueológico. A frase do epitáfio é tradição tardia, citada por Valério Máximo.","ref":"Lívio XXXVIII 50–56 · Sêneca, Cartas 86 · Valério Máximo V 3","certeza":"Sítio arqueológico"}],"era":"punicas","rivais":["anibal"]},{"id":"mario","nome":"Caio Mário","latim":"Gaius Marius","cor":"#d9822b","vida":"157–86 a.C.","papel":"Reformador do exército · sete vezes cônsul","fontes":["Plutarco, Vida de Mário","Salústio, A Guerra de Jugurta","Apiano, Guerras Civis I","Floro, Epítome"],"resumo":"Nascido em Arpino, filho de uma família sem nobreza, Mário subiu por mérito militar até ser eleito cônsul sete vezes, um recorde. Abriu as legiões aos cidadãos sem propriedade, transformou o exército numa força profissional e salvou a Itália da invasão dos cimbros e teutões. Mas os soldados passaram a dever lealdade ao general que os pagava, não à República. Na velhice, a rivalidade com Sula o levou à fuga, ao exílio e a uma volta sangrenta a Roma.","paradas":[{"nome":"Numância","moderno":"Garray, perto de Soria, Espanha","lat":41.81,"lon":-2.44,"ano":-134,"tempo":"134 a.C.","texto":"Numância é uma cidade celtibera no alto Douro que humilhou exércitos romanos por vinte anos. Em 134 a.C., Roma manda Cipião Emiliano, o destruidor de Cartago, para acabar com ela. Mário, com uns 23 anos, serve como oficial de cavalaria.\n\nCipião não ataca: cerca a cidade inteira com um muro de 9 km, sete acampamentos e torres, e bloqueia o rio com troncos cheios de lâminas. Durante oito meses, a fome faz o trabalho. Os numantinos acabam comendo os mortos; a maioria se suicida antes da rendição. Mário se destaca pela disciplina e por matar um inimigo em combate singular, à vista do general. Plutarco conta que, num jantar, perguntaram a Cipião quem seria o próximo grande general de Roma; ele bateu no ombro de Mário e disse: talvez este.","sentido":"A escola de Mário: disciplina, engenharia e paciência, as armas que Roma usará pelos séculos seguintes.","hoje":"As ruínas de Numância, no cerro de La Muela, mostram a cidade celtibera e a romana posterior. Os acampamentos do cerco foram escavados por Adolf Schulten no começo do século XX.","ref":"Plutarco, Mário 3 · Apiano, Ibérica 84–98","certeza":"Sítio arqueológico"},{"nome":"Eleito cônsul","moderno":"Roma, Itália","lat":41.893,"lon":12.483,"ano":-107,"tempo":"107 a.C.","texto":"A guerra contra Jugurta, rei da Numídia, vai mal: generais romanos foram subornados, e um exército inteiro passou sob o jugo em 110 a.C. Mário serve na África como legado de Quinto Cecílio Metelo, um nobre de família poderosa. Quando pede licença para ir a Roma disputar o consulado, Metelo responde com desprezo que ele poderia se candidatar junto com o filho de Metelo, que tinha 20 anos.\n\nMário vai assim mesmo, faz campanha acusando a nobreza de incompetência e é eleito por esmagadora maioria. A assembleia lhe dá o comando da guerra, tirando-o de Metelo. Para formar o exército, ele faz algo decisivo: aceita como voluntários os capite censi, os cidadãos sem propriedade, que até então não podiam servir. O Estado lhes fornece armas e pagamento. Os soldados passam a esperar do general terras ao fim do serviço.","sentido":"A reforma que cria o soldado profissional, leal ao general, e prepara as guerras civis.","hoje":"O Fórum Romano, onde se reuniam as assembleias, era o centro dessa política. A Cúria atual é a reconstrução de Diocleciano.","ref":"Salústio, Jugurta 63–86 · Plutarco, Mário 7–9","certeza":"Sítio arqueológico"},{"nome":"Capsa","moderno":"Gafsa, Tunísia","lat":34.425,"lon":8.784,"ano":-107,"tempo":"107 a.C.","texto":"Jugurta evita batalhas e se refugia em cidades fortificadas no deserto. Capsa é uma delas, cercada de areia e com uma única fonte. Mário quer mostrar que nenhum lugar está fora de alcance.\n\nManda os soldados carregarem água em odres de couro feitos dos animais do comboio e marcha só à noite, escondendo-se de dia. Na terceira madrugada, chega a 3 km da cidade sem ser visto. Ao amanhecer, quando os habitantes saem pelos portões, a cavalaria ataca e toma as entradas. A cidade se rende. Mário a manda incendiar, mata os homens adultos e vende o resto como escravos, contra os costumes de guerra, segundo Salústio, porque os habitantes eram instáveis e não podiam ser contidos de outro modo.","sentido":"Uma marcha pelo deserto que mostrou aos númidas que Roma podia chegar a qualquer lugar.","hoje":"Gafsa, no sul da Tunísia, ainda tem as piscinas romanas alimentadas pela mesma fonte. É hoje centro da mineração de fosfato.","ref":"Salústio, Jugurta 89–91","certeza":"Nome preservado"},{"nome":"Fortaleza do Muluccha","moderno":"Vale do rio Moulouya, Marrocos","lat":34.8,"lon":-2.8,"ano":-106,"tempo":"106 a.C.","texto":"Perto do rio Muluccha, que separa a Numídia da Mauritânia, Jugurta guarda parte do tesouro numa fortaleza sobre um rochedo isolado, acessível por um único caminho estreito. Os ataques romanos falham por dias.\n\nUm soldado lígure, que saíra para colher caracóis comestíveis, vai subindo a encosta dos fundos atrás deles e descobre uma rota pelo rochedo. Mário manda trombeteiros e soldados escolhidos subirem por ali, descalços, com as espadas nas costas e escudos de couro. No momento combinado, as trombetas soam atrás dos defensores, enquanto o ataque frontal recomeça. A fortaleza cai. Salústio admite que a sorte ajudou Mário tanto quanto o talento.","sentido":"Às vezes uma guerra se decide graças a um soldado com fome procurando caracóis.","hoje":"A localização exata é desconhecida; a fortaleza ficava perto do rio Moulouya, no nordeste do atual Marrocos.","ref":"Salústio, Jugurta 92–94","certeza":"Local debatido"},{"nome":"A captura de Jugurta","moderno":"Mauritânia (Marrocos)","lat":35.1,"lon":-4.5,"ano":-105,"tempo":"105 a.C.","texto":"Jugurta se alia ao sogro, Bocco, rei da Mauritânia. Depois de duas batalhas difíceis, Bocco decide trocar de lado e pede que Mário mande alguém de confiança. Mário envia seu questor, um jovem patrício de família empobrecida: Lúcio Cornélio Sula.\n\nSula atravessa território hostil com escolta mínima e passa dias na corte de Bocco, que hesita entre entregar Jugurta aos romanos ou Sula a Jugurta. No fim, Bocco arma uma emboscada para o genro durante uma conferência de paz, e Jugurta é entregue acorrentado a Sula. Mário recebe o triunfo, mas Sula manda gravar um anel com a cena da entrega e o usa pelo resto da vida. Anos depois, Bocco dedica no Capitólio estátuas que mostram o mesmo episódio. Mário se enfurece. Nasce ali a rivalidade que vai incendiar Roma.","sentido":"A guerra termina, mas a briga sobre quem merece o crédito começa.","hoje":"Jugurta desfilou no triunfo de Mário em 104 a.C. e morreu de fome no Tuliano, a prisão sob o Capitólio.","ref":"Salústio, Jugurta 102–113 · Plutarco, Mário 10, Sula 3","certeza":"Local aproximado"},{"nome":"Fossa Mariana","moderno":"Delta do Ródano, França","lat":43.4,"lon":4.8,"ano":-104,"tempo":"104 a.C.","texto":"Em 105 a.C., os cimbros e os teutões, povos germânicos em migração, aniquilam dois exércitos romanos em Arausio, a atual Orange: talvez 80 mil soldados mortos, a pior derrota desde Canas. O pânico toma a Itália. Mário é eleito cônsul de novo, ainda ausente e contra a lei, e depois reeleito todo ano até 100 a.C.\n\nOs germânicos se desviam para a Hispânia, o que dá a Mário dois anos para preparar o exército. Ele treina os soldados com marchas longas carregando o próprio equipamento, cerca de 30 kg cada um. Por isso foram chamados de “mulas de Mário”. Para garantir o abastecimento, manda escavar um canal que liga o Ródano ao mar, contornando os bancos de areia da foz: a Fossa Mariana. Também padroniza o pilo, a lança de arremesso, trocando um rebite de metal por um pino de madeira que se parte no impacto, para que o inimigo não possa reaproveitá-la.","sentido":"Dois anos de preparação que transformaram recrutas em máquina de guerra.","hoje":"O traçado da Fossa Mariana é incerto. A cidade de Fos-sur-Mer guarda o nome do canal (Fossae Marianae).","ref":"Plutarco, Mário 13–15 · Estrabão IV 1","certeza":"Local aproximado"},{"nome":"Aquae Sextiae","moderno":"Perto de Aix-en-Provence, França","lat":43.52,"lon":5.62,"ano":-102,"tempo":"102 a.C.","texto":"Os teutões e ambrões avançam pela Provença rumo aos Alpes. Mário recusa a batalha e fica no acampamento fortificado, deixando os soldados se acostumarem à aparência e aos gritos dos inimigos. Os teutões passam diante do acampamento durante seis dias e perguntam, rindo, se os romanos têm recados para as esposas em Roma.\n\nMário os segue e acampa numa colina perto de Aquae Sextiae. Uma briga pela água no rio provoca um primeiro combate em que os ambrões são massacrados. Dois dias depois, Mário escolhe o terreno: espera os teutões no alto da colina, deixa que subam cansados e os empurra encosta abaixo. Na véspera, tinha escondido 3 mil homens sob o comando de Marcelo num bosque atrás do inimigo. No momento certo, Marcelo ataca pela retaguarda. O exército teutão é destruído. Segundo Plutarco, os habitantes da região usaram os ossos para cercar vinhedos, e a terra ficou tão fértil que deu colheitas enormes por anos.","sentido":"A vitória que salvou a Itália, conseguida com paciência e uma reserva escondida.","hoje":"A Montagne Sainte-Victoire, pintada tantas vezes por Cézanne, domina a planície onde a batalha teria ocorrido. Uma tradição local liga o nome da montanha à vitória de Mário.","ref":"Plutarco, Mário 15–21","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 40.000 (Mário) × c. 100.000
