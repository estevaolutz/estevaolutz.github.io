<script>
'use strict';
/* =====================================================================
   Tudo o que você disser · versão web da obra do TouchDesigner
   (Obras audiovisuais/Tudo_o_que_voce_disser_TD, tudo_o_que_voce_disser_atual.toe)

   - a fala vira texto pelo reconhecimento de voz do navegador (Web Speech, pt-BR)
   - cada palavra é escrita numa grade de letras; "Multiplicar" cria pontos de
     escrita que releem a fala (ecos); as letras nascem, brilham e esmaecem
   - dentro da silhueta (MediaPipe) a letra leva a luz e a sombra do rosto;
     fora dela vira uma trama fria e fraca
   - o dedo indicador (MediaPipe Hands) pesca a palavra para que ela cresça
   ===================================================================== */

/* ---------------- controles ---------------- */
const CHAVE = 'tudo-o-que-voce-disser-v1';
const celular = Math.min(innerWidth, innerHeight) < 600;
const DEF = [
  ['TEXTO'],
  ['Colunas', 'Colunas de letras', celular ? 90 : 200, 40, 320, 1],
  ['Aspecto', 'Altura da letra (× largura)', 1.47, 1, 2.4, 0.01],
  ['Multiplicar', 'Multiplicar palavras', 7, 0, 8, 0.1],
  ['Formar', 'Rapidez para formar', 6, 0, 20, 0.1],
  ['Vida', 'Vida de cada palavra (s)', 49, 3, 180, 1],
  ['Velocidade', 'Velocidade de digitação (letras/s)', 45, 4, 120, 1],
  ['Entrada', 'Entrada do texto', 'palavra', [['palavra', 'Palavra inteira'], ['esqdir', 'Esquerda → direita'], ['diresq', 'Direita → esquerda'], ['baixo', 'De baixo para cima'], ['cima', 'De cima para baixo']]],
  ['ROSTO'],
  ['Contraste', 'Contraste do rosto', 4, 0.2, 10, 0.1],
  ['Detalhe', 'Detalhe do rosto', 4, 0, 10, 0.1],
  ['Estabilidade', 'Estabilidade (menos pisca)', 0.31, 0, 0.95, 0.01],
  ['Gama', 'Gama (sombras)', 1.8, 0.3, 4, 0.05],
  ['Brilho', 'Brilho geral', 2.4, 0.2, 5, 0.05],
  ['Brilhomin', 'Brilho mínimo da letra', 0.04, 0, 1, 0.01],
  ['Escalamin', 'Tamanho mínimo da letra', 0.55, 0.05, 1, 0.01],
  ['Autoexposicao', 'Exposição automática', 1, 0, 1, 0.01],
  ['Cor', 'Cor do rosto', 0, 0, 1, 0.01],
  ['Saturacao', 'Saturação', 1.6, 0, 4, 0.05],
  ['Misturacamera', 'Mistura da câmera (P&B)', 0, 0, 1, 0.01],
  ['Espelhar', 'Espelhar câmera', true],
  ['FUNDO'],
  ['Fundo', 'Fundo (intensidade)', 0.42, 0, 2, 0.01],
  ['Fundotextura', 'Textura do fundo', 'texto', [['pontos', 'Pontos'], ['texto', 'Texto apagado']]],
  ['SILHUETA'],
  ['Mascara', 'Silhueta', 'pessoa', [['pessoa', 'Pessoa (rastreada)'], ['tela', 'Tela inteira']]],
  ['Borda', 'Suavidade da borda', 1.2, 0, 4, 0.05],
  ['FALA'],
  ['Ouvir', 'Ouvir (microfone)', true],
  ['Esperar', 'Esperar a frase fechar (mais fiel)', true],
  ['Confianca', 'Confiança mínima da fala', 0.6, 0, 1, 0.01],
  ['Idioma', 'Idioma da fala', 'pt-BR', [['pt-BR', 'Português (Brasil)'], ['pt-PT', 'Português (Portugal)'], ['es-ES', 'Espanhol'], ['en-US', 'Inglês'], ['fr-FR', 'Francês'], ['it-IT', 'Italiano']]],
  ['PESCAR PALAVRAS'],
  ['Pescar', 'Pescar com o dedo', true],
  ['Tempoescolha', 'Tempo apontando para pescar (s)', 0.24, 0.05, 2, 0.01],
  ['Tempoampliacao', 'Tempo da ampliação (s)', 2.5, 0.2, 8, 0.1],
  ['Tamanhomax', 'Tamanho máximo (solta)', 79, 10, 300, 1],
  ['Duracaopescada', 'Tempo ampliada antes de sumir (s)', 5, 0.5, 20, 0.1],
  ['Brilhopescada', 'Brilho da palavra pescada', 0.94, 0.1, 1, 0.01],
  ['Mostrarmao', 'Mostrar o dedo (calibração)', false],
];
const P = {};
const PADRAO = {};
for (const d of DEF) if (d.length > 1) { P[d[0]] = d[2]; PADRAO[d[0]] = d[2]; }
try { Object.assign(P, JSON.parse(localStorage.getItem(CHAVE)) || {}); } catch (e) {}
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(P)); } catch (e) {} };

/* ---------------- WebGL ---------------- */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
const video = document.getElementById('video');
let W = 0, H = 0, DPR = 1, CW = 0, CH = 0;   // W,H em pixels do canvas; CW,CH em px CSS
function redimensionar() {
  DPR = Math.min(2, devicePixelRatio || 1);
  CW = innerWidth; CH = innerHeight;
  const esc = Math.min(DPR, 2560 / CW);
  W = Math.round(CW * esc); H = Math.round(CH * esc);
  cv.width = W; cv.height = H;
  hud.width = Math.round(CW * DPR); hud.height = Math.round(CH * DPR);
  criarFbos();
}

function shader(tipo, src) {
  const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
function programa(fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const u = {}; const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(pr, i); u[a.name] = gl.getUniformLocation(pr, a.name); }
  return { pr, u };
}
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function textura(filtro, wrap) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtro || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtro === gl.NEAREST ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap || gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap || gl.CLAMP_TO_EDGE);
  return t;
}

/* câmera + silhueta → textura pequena alinhada à tela, com média no tempo (rgb = cor, a = silhueta) */
const FS_CAM = `#version 300 es
precision highp float;
uniform sampler2D uVid, uMasc, uAnt;
uniform vec2 uRes, uEsc;      // tamanho do fbo · escala do "cover"
uniform float uEsp, uEstab, uTemMasc, uPrimeiro, uTemVid;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;             // y = 0 no topo (a textura é lida do mesmo jeito)
  vec2 t = (uv - .5) * uEsc + .5;
  if (uEsp > .5) t.x = 1. - t.x;
  vec3 c = uTemVid > .5 ? texture(uVid, t).rgb : vec3(0.);
  float m = uTemMasc > .5 ? texture(uMasc, t).r : 1.;
  vec4 cur = vec4(c, m);
  vec4 ant = texture(uAnt, uv);
  o = uPrimeiro > .5 ? cur : mix(cur, ant, uEstab);
}`;

/* retrato tipográfico (porte do GLSL "retrato" + "pescadas" do TD) */
const FS_RET = `#version 300 es
precision highp float;
uniform sampler2D uCam, uLetras, uAtlas;
uniform vec2 uRes, uCel;         // resolução · (largura, altura) da célula em px
uniform float uRows, uAtlasCel;  // linhas da grade · largura da célula do atlas
uniform vec4 uB;  // limiar da silhueta, contraste, gama, escala mínima
uniform vec4 uC;  // brilho, borda (lod), -, brilho mínimo
uniform vec4 uD;  // centro do tom, ganho automático, -, -
uniform vec4 uE;  // fundo: intensidade, textura, tempo, -
uniform vec4 uF;  // detalhe, mistura da câmera, -, -
uniform vec4 uG;  // cor, saturação, -, -
uniform float uLodBlur;
out vec4 o;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float glifo(float g, vec2 loc, float s){
  vec2 q = (loc - .5) / max(s, .05) + .5;
  if (q.x < 0. || q.x > 1. || q.y < 0. || q.y > 1.) return 0.;
  float gx = mod(g, 16.), gy = floor(g / 16.);
  float lod = max(0., log2(uAtlasCel / max(1., uCel.x * s)));
  return textureLod(uAtlas, vec2((gx + q.x) / 16., (gy + q.y) / 16.), lod).r;
}
void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);   // y para baixo
  float cx = floor(px.x / uCel.x), cy = floor(px.y / uCel.y);
  vec2 loc = vec2(fract(px.x / uCel.x), fract(px.y / uCel.y));
  vec2 cUV = vec2((cx + .5) * uCel.x, (cy + .5) * uCel.y) / uRes;
  vec4 letra = texelFetch(uLetras, ivec2(int(cx), int(cy)), 0);
  float cod = floor(letra.r * 255. + .5), alfa = letra.g, dir = floor(letra.b * 255. + .5), prog = letra.a;
  vec3 cor = vec3(0.);
  float m = textureLod(uCam, cUV, uC.y).a;
  if (m > uB.x) {
    vec3 cc = textureLod(uCam, cUV, .6).rgb;
    float lum = dot(cc, vec3(.299, .587, .114));
    float lumB = dot(textureLod(uCam, cUV, uLodBlur).rgb, vec3(.299, .587, .114));
    lum = lum + uF.x * (lum - lumB);                              // realce local (olhos, nariz, boca)
    float t = clamp((lum - uD.x) * uB.y * uD.y + .5, 0., 1.);
    t = pow(t, uB.z);
    if (alfa > .001 && cod > 0.) {
      float s = mix(uB.w, 1., t);
      float g = glifo(cod, loc, s);
      if (dir > .5 && dir < 1.5) g *= step(1. - prog, loc.y);     // de baixo para cima
      else if (dir > 1.5) g *= step(loc.y, prog);                 // de cima para baixo
      float lc = max(lum, .04);
      vec3 croma = clamp(mix(vec3(1.), cc / lc, uG.y), 0., 2.5);
      vec3 tinta = mix(vec3(1.), croma, uG.x);
      cor = tinta * (g * alfa * mix(uC.w, 1., t) * uC.x);
    }
    if (uF.y > 0.) {
      float cam = dot(textureLod(uCam, gl_FragCoord.xy * vec2(1., -1.) / uRes + vec2(0., 1.), 0.).rgb, vec3(.299, .587, .114));
      cor += vec3(cam * uF.y * .6);
    }
  } else if (uE.x > 0.) {
    float n = .7 + .3 * sin(uE.z * .5 + hash(vec2(cx, cy)) * 6.2832);
    float v = 0.;
    if (uE.y > .5) {
      if (alfa > .001 && cod > 0.) v = glifo(cod, loc, .8) * alfa;
    } else {
      float d = length((loc - .5) * vec2(1., uCel.y / uCel.x));
      v = smoothstep(.13, .06, d);
    }
    cor = vec3(.72, .82, 1.) * v * uE.x * n;
  }
  o = vec4(cor, 1.);
}`;

let progCam, progRet;
try { progCam = programa(FS_CAM); progRet = programa(FS_RET); } catch (e) { console.error(e); }

/* atlas de letras: 16 × 16 células */
const CHARSET = ' ' + Array.from({ length: 94 }, (_, i) => String.fromCharCode(33 + i)).join('') +
  'áàâãäéèêëíìîïóòôõöúùûüçñÁÀÂÃÄÉÈÊËÍÌÎÏÓÒÔÕÖÚÙÛÜÇÑ';
const IDX = {}; for (let i = 0; i < CHARSET.length; i++) IDX[CHARSET[i]] = i;
const DESCONHECIDA = IDX['?'];
const FONTE = '"SF Mono", Menlo, Monaco, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace';
const ATL_W = 64, ATL_H = 96;
const atlasT = textura(gl.LINEAR_MIPMAP_LINEAR);
function desenharAtlas() {
  const c = document.createElement('canvas'); c.width = ATL_W * 16; c.height = ATL_H * 16;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `500 ${Math.round(ATL_H * 0.78)}px ${FONTE}`;
  for (let i = 1; i < CHARSET.length; i++) {
    const gx = i % 16, gy = Math.floor(i / 16);
    x.save(); x.translate((gx + 0.5) * ATL_W, (gy + 0.5) * ATL_H);
    const m = x.measureText(CHARSET[i]).width;
    const k = m > ATL_W * 0.92 ? (ATL_W * 0.92) / m : 1;       // não deixa a letra sair da célula
    x.scale(k, 1); x.fillText(CHARSET[i], 0, ATL_H * 0.04); x.restore();
  }
  gl.bindTexture(gl.TEXTURE_2D, atlasT);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.generateMipmap(gl.TEXTURE_2D);
}

const vidT = textura(gl.LINEAR);
const mascT = textura(gl.LINEAR);
gl.bindTexture(gl.TEXTURE_2D, mascT);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([0]));
const letrasT = textura(gl.NEAREST);

let fbos = [], fboI = 0, FW = 0, FH = 0, primeiro = true;
function criarFbos() {
  fbos.forEach((f) => { gl.deleteTexture(f.t); gl.deleteFramebuffer(f.f); });
  FW = 320; FH = Math.max(16, Math.round(FW * H / W));
  fbos = [0, 1].map(() => {
    const t = textura(gl.LINEAR_MIPMAP_LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FW, FH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.generateMipmap(gl.TEXTURE_2D);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, f };
  });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  primeiro = true;
}

/* ---------------- câmera ---------------- */
const CAM = { on: false, stream: null, novo: false, ultT: -1 };
async function ligarCamera() {
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
    video.srcObject = CAM.stream; await video.play(); CAM.on = true;
  } catch (e) { console.warn(e); CAM.on = false; estado.camera = 'sem câmera (' + (e.name || e) + ')'; }
}
addEventListener('camera-trocada', () => { if (video.srcObject) video.play().catch(() => {}); });
function camEscala() {          // quanto do vídeo aparece na tela (cobre a tela inteira, sem faixas)
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9, va = vw / vh, a = W / H;
  return va > a ? [a / va, 1] : [1, va / a];
}
// ponto do vídeo (0–1, y para baixo) → ponto da tela (0–1, y para baixo)
function vidParaTela(x, y) { const e = camEscala(); if (P.Espelhar) x = 1 - x; return [(x - 0.5) / e[0] + 0.5, (y - 0.5) / e[1] + 0.5]; }

/* ---------------- MediaPipe: silhueta e mão ---------------- */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15';
const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const IA = { seg: null, mao: null, ts: -1, n: 0, temMasc: false, mascF: null, mascW: 0, mascH: 0, dedo: null, dedoT: 0 };
async function carregarIA() {
  try {
    const mod = await import(MP + '/vision_bundle.mjs');
    const vision = await mod.FilesetResolver.forVisionTasks(MP + '/wasm');
    const os = (d) => ({ baseOptions: { modelAssetPath: SEG_MODEL, delegate: d }, runningMode: 'VIDEO', outputConfidenceMasks: true, outputCategoryMask: false });
    try { IA.seg = await mod.ImageSegmenter.createFromOptions(vision, os('GPU')); } catch (e) { IA.seg = await mod.ImageSegmenter.createFromOptions(vision, os('CPU')); }
    estado.silhueta = 'pronta';
    const om = (d) => ({ baseOptions: { modelAssetPath: HAND_MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 1,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
    try { IA.mao = await mod.HandLandmarker.createFromOptions(vision, om('GPU')); } catch (e) { IA.mao = await mod.HandLandmarker.createFromOptions(vision, om('CPU')); }
    estado.mao = 'pronta';
  } catch (e) { console.warn(e); estado.silhueta = 'não carregou (sem internet?)'; }
}
let mascU8 = null;
function rastrear() {
  if (!CAM.on || !CAM.novo || video.readyState < 2) return;
  let ts = performance.now(); if (ts <= IA.ts) ts = IA.ts + 1; IA.ts = ts;
  IA.n++;
  if (IA.seg && P.Mascara === 'pessoa') {
    try {
      IA.seg.segmentForVideo(video, ts, (r) => {

    else if (Array.isArray(a)) h += `<div class="ln"><label for="c_${id}">${rot}</label><select id="c_${id}">${a.map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>`;
    else h += `<div class="ln"><label for="c_${id}">${rot}</label><input type="range" id="c_${id}" min="${a}" max="${b}" step="${passo}"><span class="v" id="v_${id}"></span></div>`;
    if (id === 'Idioma') h += `<div id="estado"></div><div id="ultimas"></div>`;
  }
  h += `<h3>Testes</h3>
  <input id="escrever" placeholder="Escreva e aperte Enter para testar" autocomplete="off">
  <div class="bts"><button id="b_testar">Testar com frase</button><button id="b_limpar">Limpar palavras</button><button id="b_tela">Tela cheia</button><button id="b_padrao">Ajustes padrão</button></div>
  <p class="dica">Teclas: M controles · F tela cheia · T testar · L limpar. Botões no canto inferior esquerdo (aparecem ao mexer o mouse): câmera e janela de projeção (Shift+P).</p>`;
  painel.innerHTML = h;
  for (const d of DEF) {
    if (d.length === 1) continue;
    const id = d[0], el = document.getElementById('c_' + id);
    const ev = el.type === 'range' ? 'input' : 'change';
    el.addEventListener(ev, () => {
      P[id] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
      mostrarValor(id); salvar(); mudou(id);
    });
  }
  document.getElementById('b_testar').onclick = () => teste();
  document.getElementById('b_limpar').onclick = limpar;
  document.getElementById('b_tela').onclick = telaCheia;
  document.getElementById('b_padrao').onclick = () => { Object.assign(P, PADRAO); salvar(); lerPainel(); reiniciarFala(); };
  const esc = document.getElementById('escrever');
  esc.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { teste(esc.value); esc.value = ''; }
  });
  lerPainel();
}
function mostrarValor(id) {
  const v = document.getElementById('v_' + id); if (!v) return;
  const x = +P[id]; v.textContent = Math.abs(x) >= 10 ? x.toFixed(0) : x.toFixed(2);
}
function lerPainel() {
  for (const d of DEF) {
    if (d.length === 1) continue;
    const el = document.getElementById('c_' + d[0]);
    if (el.type === 'checkbox') el.checked = !!P[d[0]]; else el.value = P[d[0]];
    mostrarValor(d[0]);
  }
}
function mudou(id) {
  if (id === 'Ouvir') { if (P.Ouvir) ligarFala(); else desligarFala(); }
  if (id === 'Idioma' || id === 'Esperar') reiniciarFala();
  if (id === 'Mascara' && P.Mascara !== 'pessoa') IA.temMasc = false;
  if (id === 'Pescar' && !P.Pescar) { IA.dedo = null; }
}
function painelEstado() {
  const el = document.getElementById('estado'); if (!el) return;
  el.innerHTML = `Fala: <b>${estado.fala}</b>${estado.descartadas ? ` · ${estado.descartadas} frase(s) descartadas por pouca confiança` : ''}<br>Câmera: <b>${CAM.on ? 'ligada' : estado.camera}</b> · silhueta: <b>${estado.silhueta}</b> · dedo: <b>${estado.mao}</b>`;
}
function painelUltimas() {
  const el = document.getElementById('ultimas'); if (!el) return;
  el.textContent = registro.length ? 'Ouvidas: ' + registro.slice(-18).join(' ') : '';
}
function alternarPainel() { painel.classList.toggle('on'); painelEstado(); painelUltimas(); }
document.getElementById('dot').onclick = alternarPainel;
function telaCheia() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}
addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'm') alternarPainel();
  else if (k === 'escape') painel.classList.remove('on');
  else if (k === 'f') telaCheia();
  else if (k === 't') teste();
  else if (k === 'l') limpar();
});
let idleT = 0;
function acordar() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
addEventListener('pointermove', acordar); addEventListener('pointerdown', acordar);

/* ---------------- início ---------------- */
const inicio = document.getElementById('inicio');
if (!SR) { const av = document.getElementById('aviso'); av.hidden = false; av.textContent = 'Este navegador não reconhece a fala. Use o Chrome, o Edge ou o Safari. Dá para testar escrevendo no painel.'; }
async function comecar() {
  if (comecou) return;
  comecou = true; inicio.classList.add('hide');
  acordar();
  if (P.Ouvir) ligarFala();
  await ligarCamera();
  carregarIA();
}
inicio.addEventListener('click', comecar);
addEventListener('resize', () => { redimensionar(); G = null; });
redimensionar();
desenharAtlas();
grade();
montarPainel();
requestAnimationFrame(quadro);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__obra = { P, novaPalavra, teste, limpar, estado, get G() { return G; }, IA, pescadas };
</script>
