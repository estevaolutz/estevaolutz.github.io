de cera. Na corrida, as rodas se soltam e Enômao morre arrastado. Pélope vence, mas, em vez de pagar Mírtilo, o joga ao mar de um penhasco. Antes de morrer, o cocheiro amaldiçoa Pélope e toda a sua descendência.", "grego": "Πίσα", "ref": "Píndaro, Olímpica I · Pausânias V.10, VI.21 · Apolodoro, Epítome II.3–9", "tempo": "A corrida trapaceada", "certeza": "Sítio arqueológico", "sentido": "O frontão leste do templo de Zeus em Olímpia mostra os preparativos dessa corrida. A competição mais sagrada da Grécia tinha um mito fundador baseado numa trapaça e num assassinato.", "hoje": "Em Olímpia, Patrimônio Mundial, fica o Pelópion, recinto do túmulo de Pélope, ao lado do templo de Zeus. A chama olímpica é acesa ali, no templo de Hera, antes de cada Olimpíada."}, {"nome": "Micenas", "moderno": "Argólida", "lat": 37.731, "lon": 22.756, "texto": "A maldição de Mírtilo se cumpre nos filhos de Pélope. Atreu e Tiestes disputam o trono de Micenas. Tiestes seduz a mulher de Atreu e rouba o carneiro de lã dourada que garantia o direito ao reino. Zeus, para mostrar quem estava certo, faz o Sol inverter seu curso e se pôr no leste. Atreu fica com o trono e prepara a vingança.\n\nFingindo reconciliação, convida Tiestes para um banquete e lhe serve a carne dos próprios filhos. Depois mostra ao irmão as mãos e as cabeças das crianças. Tiestes vomita, amaldiçoa a casa de Atreu e foge. Um oráculo lhe diz que um filho gerado com a própria filha, Pelópia, vai vingá-lo. Desse filho, Egisto, virá a morte de Atreu e, mais tarde, a de Agamêmnon, filho de Atreu.", "grego": "Μυκῆναι", "ref": "Ésquilo, Agamêmnon 1583–1602 · Sêneca, Tiestes · Apolodoro, Epítome II.10–14", "tempo": "O banquete de Atreu", "certeza": "Sítio arqueológico", "sentido": "O crime de Tântalo se repete na terceira geração: pai que serve filho, irmão que serve sobrinhos. A casa dos Atridas é a família mais amaldiçoada da mitologia.", "hoje": "Micenas, perto de Argos, tem a Porta dos Leões e o Tesouro de Atreu, túmulo de cúpula do século XIV a.C. Heinrich Schliemann achou ali, em 1876, a máscara de ouro que chamou de “máscara de Agamêmnon”."}]}, {"id": "guerra-troia", "titulo": "A Guerra de Troia", "ciclo": "troiano", "fontes": ["Homero, Ilíada", "Ciclo Épico", "Eurípides"], "resumo": "A guerra de Troia começa num casamento e termina com uma cidade em chamas. Zeus queria reduzir a população humana; a disputa entre três deusas por uma maçã de ouro, a escolha de um príncipe troiano e o rapto da mulher mais bela do mundo foram os instrumentos. Mil navios, dez anos de cerco, a morte dos maiores heróis da Grécia e da Ásia e, no fim, um cavalo de madeira. A Ilíada narra só cinquenta dias do décimo ano; o resto vem do Ciclo Épico e dos trágicos.", "paradas": [{"nome": "Monte Pélion", "moderno": "Tessália", "lat": 39.4, "lon": 23.05, "texto": "Todos os deuses são convidados para o casamento de Peleu, rei mortal da Ftia, com a Nereida Tétis, celebrado na caverna do centauro Quíron no monte Pélion. Só Éris, a deusa da discórdia, fica de fora. Ela aparece mesmo assim e joga sobre a mesa uma maçã de ouro com a inscrição: “Para a mais bela”.\n\nHera, Atena e Afrodite reivindicam a maçã. Nenhum deus quer julgar, e Zeus manda Hermes levar as três a um pastor no monte Ida, perto de Troia. Do casamento nascerá Aquiles, o maior guerreiro da guerra que essa maçã vai provocar.", "grego": "Πήλιον", "ref": "Cantos Cíprios (resumo de Proclo) · Apolodoro, Epítome III.2", "tempo": "O pomo da discórdia", "certeza": "Montanha real", "sentido": "“Pomo da discórdia” virou expressão para o motivo de uma disputa. O próprio casamento é a origem da guerra e do herói que a decidirá.", "hoje": "O Pélion é uma península montanhosa e verde perto de Volos, com vilas de casas de pedra e telhados de ardósia. Os gregos o chamam de montanha dos Centauros."}, {"nome": "Monte Ida", "moderno": "Kaz Dağı, Turquia", "lat": 39.7, "lon": 26.85, "texto": "Páris, filho do rei Príamo de Troia, cresceu como pastor no monte Ida porque, antes de seu nascimento, sua mãe sonhou que paria uma tocha que incendiava a cidade. Hermes aparece com as três deusas e lhe pede que escolha.\n\nCada uma oferece um suborno. Hera promete poder e domínio sobre a Ásia; Atena, sabedoria e vitória na guerra; Afrodite, o amor da mulher mais bela do mundo, Helena, esposa do rei Menelau de Esparta. Páris dá a maçã a Afrodite. A partir de então, Hera e Atena serão inimigas mortais de Troia.", "grego": "Ἴδη", "ref": "Ilíada XXIV 25–30 · Eurípides, Troianas 924–932", "tempo": "O Julgamento", "certeza": "Montanha real", "sentido": "Entre poder, sabedoria e desejo, o jovem escolhe o desejo. Rubens e muitos outros pintaram a cena.", "hoje": "O monte Ida asiático (Kaz Dağı, 1.774 m) fica na província de Çanakkale, Turquia. É parque nacional, e a tradição local aponta o pico Sarıkız como lugar do julgamento."}, {"nome": "Esparta", "moderno": "Lacônia", "lat": 37.07, "lon": 22.43, "texto": "Páris viaja à Grécia e é recebido como hóspede no palácio de Menelau, em Esparta. Pouco depois, Menelau parte para Creta para o enterro do avô, deixando Helena para receber o visitante. Com a ajuda de Afrodite, Páris a seduz, e ela parte com ele levando tesouros e servas.\n\nMenelau volta e invoca o juramento que os pretendentes de Helena haviam feito anos antes, a conselho de Odisseu: todos defenderiam quem fosse escolhido como marido. Agamêmnon, irmão de Menelau e rei de Micenas, convoca os reis gregos. Em uma versão alternativa (Estesícoro e Eurípides), Helena nunca foi a Troia: os deuses mandaram um fantasma, e a verdadeira passou a guerra no Egito.", "grego": "Σπάρτη", "ref": "Cantos Cíprios · Ilíada III · Eurípides, Helena", "tempo": "O rapto de Helena", "certeza": "Sítio arqueológico", "sentido": "Raptada ou fugida por vontade própria? Os gregos discutiam a culpa de Helena desde a Antiguidade. Ao violar a hospitalidade, Páris comete o crime que Zeus pune.", "hoje": "Perto de Esparta, no Menelaion, em Therapne, fica um santuário dedicado a Menelau e Helena, sobre uma mansão micênica. A cidade moderna de Esparti foi fundada em 1834."}, {"nome": "Áulis", "moderno": "Beócia", "lat": 38.43, "lon": 23.6, "texto": "A frota grega, mais de mil navios segundo o Catálogo das Naus, se reúne em Áulis, na Beócia. Agamêmnon é o comandante supremo. Mas os ventos param de soprar: Ártemis está irada, porque Agamêmnon matou um cervo sagrado e se gabou de caçar melhor que a deusa.\n\nO adivinho Calcas revela o preço: Agamêmnon deve sacrificar a filha Ifigênia. O rei manda buscá-la em Micenas com o pretexto de casá-la com Aquiles. Ifigênia chega com a mãe, Clitemnestra, e descobre a verdade no altar. Em Ésquilo, ela é amordaçada e sacrificada. Em Eurípides, aceita morrer pela Grécia, e no último instante Ártemis a substitui por uma corça e a leva para Táuris. Os ventos voltam a soprar, e a frota parte.", "grego": "Αὐλίς", "ref": "Ésquilo, Agamêmnon 184–247 · Eurípides, Ifigênia em Áulis", "tempo": "O sacrifício", "certeza": "Sítio arqueológico", "sentido": "A guerra começa com o sacrifício de uma filha pelo pai. É esse crime que Clitemnestra vingará dez anos depois.", "hoje": "Em Avlida, perto de Calcis, foi escavado um templo de Ártemis com uma fonte e base de altar. É uma área hoje industrial, junto ao estreito de Euripo."}, {"nome": "Tênedos", "moderno": "Bozcaada", "lat": 39.82, "lon": 26.03, "texto": "Na viagem, a frota para numa pequena ilha para sacrificar. Filoctetes, herdeiro do arco e das flechas de Héracles, é picado no pé por uma serpente quando se aproxima do altar. A ferida apodrece, exala um cheiro insuportável, e ele grita de dor dia e noite, perturbando os sacrifícios.\n\nPor conselho de Odisseu, os gregos o abandonam dormindo em Lemnos (em outras versões, numa ilhota perto de Tênedos). Dez anos depois, um oráculo dirá que Troia só cairá com o arco de Héracles. Odisseu e Neoptólemo terão de buscar o homem que traíram. Na tragédia de Sófocles, só a aparição de Héracles divinizado convence Filoctetes a ir a Troia, onde é curado e mata Páris com uma flecha.", "grego": "Τένεδος", "ref": "Ilíada II 718–725 · Sófocles, Filoctetes · Pequena Ilíada", "tempo": "O abandono de Filoctetes", "certeza": "Ilha real", "sentido": "Os gregos precisam do homem que abandonaram. A guerra não se vence só pela força, mas pela reparação.", "hoje": "Tênedos (Bozcaada), na entrada dos Dardanelos, pertence à Turquia. Na Eneida, é atrás dela que a frota grega se esconde enquanto os troianos levam o Cavalo para dentro da cidade."}, {"nome": "Troia", "moderno": "Hisarlık, Turquia", "lat": 39.957, "lon": 26.239, "texto": "O cerco dura dez anos. No décimo, Agamêmnon toma de Aquiles a cativa Briseida, e o herói se retira da luta com sua cólera, o tema da Ilíada. Sem ele, os gregos são empurrados até os navios. Pátroclo, amigo de Aquiles, veste a armadura dele e é morto por Heitor, o maior herói troiano. Aquiles volta à luta, mata Heitor diante das muralhas e arrasta o corpo atrás do carro. O velho Príamo entra à noite no acampamento grego e beija as mãos do assassino de seu filho para pedir o corpo; Aquiles chora com ele e o devolve.\n\nDepois chegam aliados de Troia: a amazona Pentesileia e o etíope Mêmnon, ambos mortos por Aquiles. O próprio Aquiles cai, atingido no calcanhar por uma flecha de Páris guiada por Apolo. A cidade enfim cai pela astúcia de Odisseu: os gregos constroem um enorme cavalo de madeira, escondem nele os melhores guerreiros e fingem partir. O troiano Laocoonte avisa (“temo os gregos mesmo quando trazem presentes”) e é morto por serpentes saídas do mar; Cassandra profetiza e ninguém acredita. O Cavalo entra na cidade. À noite os guerreiros saem, abrem as portas, e Troia é saqueada e queimada. Príamo é morto no altar; Astíanax, filho de Heitor, é jogado das muralhas; as troianas são levadas como escravas. Eneias foge com o pai nas costas e o filho pela mão.", "grego": "Ἴλιον", "ref": "Homero, Ilíada · Odisseia VIII 492–520 · Virgílio, Eneida II · Eurípides, Troianas", "tempo": "O cerco e a queda", "certeza": "Sítio arqueológico", "sentido": "A Ilíada começa com a palavra “cólera” e termina com o funeral do inimigo. É um poema sobre a guerra que não esconde o sofrimento dos dois lados.", "hoje": "Hisarlık, perto de Çanakkale, na Turquia, foi escavada por Heinrich Schliemann a partir de 1870. Há pelo menos nove cidades sobrepostas. A camada VIIa, destruída por volta de 1180 a.C., é a principal candidata à Troia de Homero. Patrimônio Mundial da UNESCO."}]}, {"id": "oresteia", "titulo": "Oréstia: o Retorno de Agamêmnon", "ciclo": "troiano", "fontes": ["Ésquilo, Oréstia", "Eurípides, Ifigênia em Táuris"], "resumo": "Agamêmnon volta vitorioso de Troia, mas em casa o esperam dez anos de ódio. Clitemnestra nunca perdoou o sacrifício de Ifigênia e governou Micenas ao lado do amante Egisto, filho de Tiestes, que tem a sua própria vingança contra a casa de Atreu. A Oréstia de Ésquilo, a única trilogia trágica completa que sobreviveu, conta como a cadeia de vinganças familiares só é rompida quando a justiça passa das mãos da família para um tribunal.", "paradas": [{"nome": "Micenas", "moderno": "Argólida", "lat": 37.731, "lon": 22.756, "texto": "Clitemnestra organizou uma cadeia de fogueiras de montanha em montanha, de Troia a Micenas, para saber no mesmo dia que a cidade caiu. Quando Agamêmnon chega, ela o recebe com honras exageradas e estende tapetes púrpura para ele entrar no palácio, como se fosse um deus. Ele traz como concubina Cassandra, princesa troiana. Cassandra prevê sua própria morte e a do rei, mas, como sempre, ninguém acredita.\n\nNo banho, Clitemnestra joga sobre o marido um manto sem saída, como uma rede, e o golpeia três vezes com um machado (ou uma espada); depois mata Cassandra. Sete anos mais tarde, Orestes, que fora mandado para longe criança, volta adulto com o amigo Pílades por ordem de Apolo. Reencontra a irmã Electra junto ao túmulo do pai e, disfarçado de mensageiro que traz a notícia de sua própria morte, entra no palácio. Mata Egisto. Clitemnestra mostra o seio que o amamentou e implora; Orestes hesita, Pílades lembra a ordem de Apolo, e ele a mata.", "grego": "Μυκῆναι", "ref": "Ésquilo, Agamêmnon e Coéforas · Sófocles e Eurípides, Electra", "tempo": "O assassinato e a vingança", "certeza": "Sítio arqueológico", "sentido": "Cada vingança é justa e criminosa ao mesmo tempo. A filha vingada pela mãe, o pai vingado pelo filho: a cadeia parece não ter fim.", "hoje": "Em Micenas, há a Porta dos Leões, o Círculo de Túmulos A e o Tesouro de Clitemnestra, túmulo de cúpula assim batizado pela tradição. O palácio fica no alto da cidadela."}, {"nome": "Delfos", "moderno": "Fócida", "lat": 38.482, "lon": 22.501, "texto": "Logo depois do matricídio, Orestes começa a ver as Erínias, as Fúrias, deusas antigas que vingam o sangue derramado entre parentes: mulheres negras, com serpentes nos cabelos e sangue escorrendo dos olhos. Elas o perseguem sem descanso. Ele foge para Delfos e se agarra ao ônfalo, no santuário de Apolo, o deus que ordenou o crime.\n\nApolo o purifica com sangue de porco e faz as Erínias adormecerem. Mas o fantasma de Clitemnestra as acorda, e elas acusam Apolo de proteger um matricida. O deus admite que não pode resolver sozinho e manda Orestes a Atenas, para se pôr sob a proteção de Atena.", "grego": "Δελφοί", "ref": "Ésquilo, Eumênides 1–234", "tempo": "As Erínias", "certeza": "Sítio arqueológico", "sentido": "O conflito é também entre deuses: as Erínias, antigas, representam o sangue e a família; Apolo, jovem, representa a ordem e a razão.", "hoje": "A peça começa no templo de Apolo em Delfos, cujas fundações e algumas colunas restauradas podem ser vistas no santuário."}, {"nome": "Areópago", "moderno": "Atenas", "lat": 37.972, "lon": 23.723, "texto": "Em Atenas, Orestes se abraça à antiga estátua de Atena. A deusa decide que o caso é grave demais para uma só pessoa julgar e institui, na colina de Ares, um tribunal de cidadãos atenienses: o Areópago. As Erínias acusam; Apolo defende, argumentando que a mãe é só a nutriz da semente e que matar o pai é crime maior que matar a mãe.\n\nOs votos se empatam. Atena dá o voto decisivo a favor de Orestes, e estabelece que, em caso de empate, o réu deve ser absolvido. As Erínias, humilhadas, ameaçam lançar a peste sobre Atenas. Atena as convence a aceitar um lugar de honra na cidade, numa gruta sob a colina, como protetoras. Elas se tornam as Eumênides, “as benevolentes”.", "grego": "Ἄρειος Πάγος", "ref": "Ésquilo, Eumênides 235–1047", "tempo": "O julgamento", "certeza": "Sítio identificado", "sentido": "O mito da passagem da vingança privada para a justiça pública. Ésquilo encenou a peça em 458 a.C., quando o Areópago real acabava de perder poderes numa reforma democrática.", "hoje": "O Areópago é um rochedo nu entre a Acrópole e a Ágora de Atenas, com degraus esculpidos na pedra. Ali também o apóstolo Paulo pregou aos atenienses. O Supremo Tribunal grego se chama Areios Pagos até hoje."}, {"nome": "Táuris", "moderno": "Crimeia", "lat": 44.5, "lon": 33.6, "texto": "Nem todas as Erínias aceitam o veredicto, e algumas continuam a perseguir Orestes. Apolo lhe diz que, para se libertar, deve trazer da terra dos tauros a antiga estátua de Ártemis, caída do céu. Os tauros sacrificam à deusa todos os estrangeiros que chegam à costa.\n\nOrestes e Pílades são capturados. A sacerdotisa que deve prepará-los para o sacrifício é Ifigênia, que todos acreditavam morta em Áulis, salva por Ártemis. Ela não reconhece o irmão, que deixou bebê. Oferece salvar um dos dois se ele levar uma carta à Grécia, para o irmão Orestes. O reconhecimento vem pela carta. Os três tramam a fuga: Ifigênia diz ao rei Toante que a estátua foi contaminada pelos matricidas e precisa ser lavada no mar. Fogem de navio com a estátua. Atena aparece e ordena que a levem para Brauron, na Ática, onde Ifigênia será sacerdotisa até a morte.", "grego": "Ταυρική", "ref": "Eurípides, Ifigênia em Táuris · Heródoto IV.103", "tempo": "O resgate de Ifigênia", "certeza": "Tradicional", "sentido": "A família destruída por sacrifícios encontra um final de reencontro. Goethe fez desta história a sua Ifigênia em Táuride.", "hoje": "A Táurica era a Crimeia. A tradição situava o templo perto do cabo Fiolent, junto a Sebastopol, onde há um mosteiro de São Jorge. Em Brauron (Vravrona), na Ática, há um santuário de Ártemis com o túmulo atribuído a Ifigênia."}]}, {"id": "orfeu", "titulo": "Orfeu e Eurídice", "ciclo": "metamorfoses", "fontes": ["Virgílio, Geórgicas IV", "Ovídio X–XI"], "resumo": "Orfeu era o maior músico que já existiu: quando cantava com a lira, as feras se acalmavam, as árvores se moviam e os rios paravam para ouvir. Argonauta, ele salvou a tripulação das Sereias. Sua história mais famosa é a do amor que atravessa a morte e se perde por um único olhar. O que ele teria trazido do mundo dos mortos deu origem ao orfismo, uma corrente religiosa que prometia aos iniciados um destino melhor depois da morte.", "paradas": [{"nome": "Píeria", "moderno": "Macedônia (Leibethra)", "lat": 40.15, "lon": 22.5, "texto": "Orfeu nasce na Piéria, junto ao Olimpo, filho de Calíope, a musa da poesia épica, e do rei trácio Eagro (ou do próprio Apolo). Apolo lhe dá a lira, e as Musas lhe ensinam a tocá-la.\n\nEle se casa com a ninfa Eurídice. Pouco depois do casamento, ela foge pelo campo do pastor Aristeu, que a deseja, e pisa numa serpente escondida na grama. Morre com a picada. Orfeu chora e canta sua dor por montanhas e vales, até que decide fazer o que nenhum vivo havia feito: descer ao reino dos mortos para pedi-la de volta.", "grego": "Πιερία", "ref": "Virgílio, Geórgicas IV 453–527 · Ovídio, Metamorfoses X 1–10", "tempo": "A perda", "certeza": "Região real", "sentido": "A Piéria era a terra das Musas. O mito liga a música ao luto: o primeiro grande canto de Orfeu é um lamento.", "hoje": "Em Leibethra, ao pé do Olimpo, perto de Litóchoro, ficava o túmulo de Orfeu segundo uma tradição. O sítio é escavado e fica no Parque Arqueológico de Dion."}, {"nome": "Cabo Tênaro", "moderno": "Lacônia", "lat": 36.39, "lon": 22.48, "texto": "Orfeu desce por uma caverna no cabo Tênaro. Com a lira, encanta Caronte, que o leva na barca pelo rio Estige, e Cérbero, que deixa de latir. Diante do trono de Hades e Perséfone, canta. Ovídio diz que Tântalo parou de buscar a água fugidia, a roda de Íxion parou de girar, Sísifo sentou-se sobre a pedra, e pela primeira vez as Erínias choraram.\n\nHades e Perséfone concedem que Eurídice volte com ele, com uma condição: Orfeu deve caminhar na frente e não olhar para trás até estarem fora do mundo subterrâneo. Eles sobem pelo caminho escuro e silencioso. Quase na saída, já vendo a luz, Orfeu não ouve os passos dela, sente medo de que não esteja ali e se vira. Eurídice ainda está lá, mas é puxada de volta para a escuridão. Diz um último adeus que ele mal escuta e desaparece. Orfeu tenta voltar, mas Caronte não o deixa atravessar de novo.", "grego": "Ταίναρον", "ref": "Ovídio, Metamorfoses X 11–77 · Virgílio, Geórgicas IV 467–506", "tempo": "A descida", "certeza": "Sítio identificado", "sentido": "O olhar para trás tornou-se símbolo do amor que não consegue confiar, e da impossibilidade de recuperar o passado. Rilke, Monteverdi e Gluck voltaram a esse instante.", "hoje": "No cabo Tênaro, ponta sul da Lacônia, há uma pequena gruta junto às ruínas do templo de Poseidon, apontada como entrada do Hades. O caminho até o farol de Tênaro é uma trilha popular."}, {"nome": "Rio Hebro", "moderno": "Maritsa/Evros", "lat": 40.73, "lon": 26.03, "texto": "Depois de perder Eurídice pela segunda vez, Orfeu vaga sete meses pela Trácia, chorando e cantando, recusando qualquer outra mulher. Torna-se devoto de Apolo, o Sol, e despreza Dioniso.\n\nAs Mênades, seguidoras de Dioniso, ofendidas com sua recusa (ou por ordem do deus), o atacam numa noite de culto. Primeiro jogam pedras, mas a música é tão bela que as pedras caem a seus pés sem tocá-lo. Então elas gritam e batem tambores até abafar a lira, e o despedaçam. Jogam a cabeça e a lira no rio Hebro. A cabeça desce pelo rio ainda cantando e chamando o nome de Eurídice, e as margens respondem com o eco. Na morte, Orfeu enfim reencontra a esposa nos campos dos bem-aventurados.", "grego": "Ἕβρος", "ref": "Ovídio, Metamorfoses XI 1–66 · Virgílio, Geórgicas IV 507–527", "tempo": "A morte", "certeza": "Rio real", "sentido": "O poeta é destruído pelo excesso de paixão que ele mesmo recusou. Para os órficos, o corpo despedaçado lembrava o de Dioniso menino, também despedaçado pelos Titãs.", "hoje": "O rio Hebro (Maritsa/Évros) nasce na Bulgária e marca hoje a fronteira entre a Grécia e a Turquia até desaguar no Egeu, num delta protegido."}, {"nome": "Antissa", "moderno": "Lesbos", "lat": 39.25, "lon": 26.0, "texto": "Levada pela correnteza, a cabeça de Orfeu atravessa o mar e chega à praia de Lesbos, perto de Antissa. Uma serpente tenta mordê-la, e Apolo transforma a cobra em pedra.\n\nOs habitantes enterram a cabeça num santuário de Dioniso (ou numa caverna), onde ela passa a dar oráculos tão famosos que os santuários de Delfos e Claros ficam vazios. Apolo, com ciúmes, manda que ela se cale. A lira foi levada ao céu pelas Musas e virou a constelação de Lira, cuja estrela principal é Vega. Por causa da cabeça cantora, contavam, Lesbos se tornou a ilha dos maiores poetas líricos, como Safo e Alceu.", "grego": "Ἄντισσα", "ref": "Ovídio, Metamorfoses XI 50–60 · Filóstrato, Heroico 28", "tempo": "A cabeça cantora", "certeza": "Sítio arqueológico", "sentido": "O mito explica por que uma pequena ilha produziu tantos poetas: a canção de Orfeu chegou até ela.", "hoje": "As ruínas de Antissa ficam no noroeste de Lesbos, perto da vila moderna de Antissa e da floresta petrificada de Sigri, Geoparque Mundial da UNESCO."}]}, {"id": "dedalo-icaro", "titulo": "Dédalo e Ícaro", "ciclo": "metamorfoses", "fontes": ["Ovídio VIII", "Diodoro IV"], "resumo": "Dédalo é o maior artesão e inventor de Atenas: a ele se atribuem a serra, o compasso, o machado, estátuas que pareciam andar. Mas o talento vem com ciúme e crime. Exilado em Creta, ele constrói para o rei Minos as obras mais famosas da mitologia, até ficar preso por elas. A fuga com o filho pelo céu é a história do primeiro voo humano e da primeira queda.", "paradas": [{"nome": "Cnossos", "moderno": "Creta", "lat": 35.298, "lon": 25.163, "texto": "Dédalo foge de Atenas depois de empurrar da Acrópole o sobrinho e aprendiz Talo (ou Perdix), que inventou a serra copiando a espinha de um peixe e ameaçava superá-lo. Em Creta, entra a serviço do rei Minos.\n\nA rainha Pasífae, por castigo de Poseidon, está apaixonada pelo touro sagrado. Dédalo constrói para ela uma vaca de madeira oca coberta de couro, onde ela se esconde. Dessa união nasce o Minotauro. Para esconder o monstro, Minos encomenda a Dédalo o Labirinto, um edifício de corredores tão intrincados que nem o próprio construtor consegue sair com facilidade. Quando Teseu mata o Minotauro com a ajuda do fio que Dédalo sugeriu a Ariadne, Minos tranca o inventor e seu filho Ícaro dentro do Labirinto (ou numa torre).", "grego": "Κνωσός", "ref": "Ovídio, Metamorfoses VIII 152–235 · Apolodoro III.15.8, Epítome I.12–15", "tempo": "O Labirinto", "certeza": "Sítio arqueológico", "sentido": "O inventor é prisioneiro das próprias criações. Dédalo serve tanto ao crime de Pasífae quanto à solução de Ariadne.", "hoje": "O palácio de Cnossos, com mais de 1.300 salas, ficou famoso pela reconstrução parcial de Arthur Evans. Na Ilíada, Homero fala de uma pista de dança que Dédalo fez para Ariadne em Cnossos."}, {"nome": "Icária", "moderno": "Ikaria", "lat": 37.6, "lon": 26.15, "texto": "Minos controla o mar e a terra, mas não o céu, pensa Dédalo. Junta penas de pássaros em ordem de tamanho, prende as maiores com fio e as menores com cera, e as curva como asas de verdade. Ícaro brinca com as penas, sem entender que está tocando seu próprio destino.\n\nAntes de partir, Dédalo avisa: voe no meio. Baixo demais, o mar pesará as penas; alto demais, o sol derreterá a cera. Os dois levantam voo; pescadores e lavradores os veem passar e acreditam que são deuses. Passam por Delos, Paros e Samos. Ícaro, encantado com o voo, se afasta do pai e sobe em direção ao céu. O sol amolece a cera, as penas se soltam, ele agita os braços nus e cai no mar gritando o nome do pai. Dédalo encontra as penas flutuando, recolhe o corpo, enterra-o numa ilha e amaldiçoa a própria arte.", "grego": "Ἰκαρία", "ref": "Ovídio, Metamorfoses VIII 183–235 · Ars Amatoria II 21–96", "tempo": "O voo e a queda", "certeza": "Ilha real", "sentido": "O mito da ousadia juvenil e da técnica que vai mais longe que a prudência. A pintura de Bruegel mostra a queda como um detalhe que ninguém nota.", "hoje": "Icária, no Egeu oriental, carrega o nome de Ícaro, assim como o mar Icário ao redor. Famosa hoje pela longevidade dos moradores, é uma das “zonas azuis” do mundo."}, {"nome": "Cámico", "moderno": "Sant'Angelo Muxaro, Sicília", "lat": 37.48, "lon": 13.55, "texto": "Dédalo pousa em Cumas, na Itália, onde dedica as asas a Apolo, e segue para a Sicília. Em Cámico, o rei Cócalo o acolhe. Minos o persegue por todo o Mediterrâneo com uma armadilha: oferece uma recompensa a quem conseguir passar um fio por dentro de uma concha em espiral.\n\nCócalo leva a concha a Dédalo, que resolve o enigma: amarra o fio a uma formiga, faz um furo na ponta da concha e passa mel ali. A formiga atravessa a espiral. Quando Cócalo traz a solução, Minos sabe que Dédalo está ali e exige que seja entregue. Cócalo finge aceitar e oferece um banho ao rei. As filhas de Cócalo (com a ajuda de Dédalo, que instalou canos no palácio) despejam água fervente sobre Minos, que morre. Minos se torna um dos juízes do mundo dos mortos.", "grego": "Καμικός", "ref": "Diodoro IV.77–79 · Heródoto VII.170 · Apolodoro, Epítome I.14–15", "tempo": "O refúgio", "certeza": "Sítio tradicional", "sentido": "A última invenção de Dédalo é uma solução elegante para um problema impossível, e é ela que o denuncia.", "hoje": "Cámico é identificada com Sant'Angelo Muxaro, na província de Agrigento, onde há túmulos de cúpula escavados na rocha. Na Eneida, Dédalo esculpe as portas do templo de Apolo em Cumas."}]}, {"id": "io", "titulo": "Io", "ciclo": "metamorfoses", "fontes": ["Ésquilo, Prometeu Acorrentado", "Ovídio I"], "resumo": "Io é sacerdotisa de Hera em Argos, filha do rei-rio Ínaco. Zeus a deseja e, para escondê-la da esposa, a transforma numa novilha branca. Hera não se deixa enganar: pede a vaca de presente, a põe sob vigilância e depois a persegue com um inseto que a faz correr pelo mundo. A fuga de Io atravessa a Europa e a Ásia e dá nome a mares e estreitos. Termina no Egito, onde ela recupera a forma humana e funda a linhagem de onde virão Perseu, Héracles e os reis de Argos.", "paradas": [{"nome": "Argos (Heraion)", "moderno": "Argólida", "lat": 37.69, "lon": 22.77, "texto": "Zeus envolve Io numa nuvem para escondê-la, mas Hera desconfia da nuvem no céu limpo e desce. Zeus transforma Io numa novilha branca e jura que nunca a tocou. Hera, sem acreditar, pede a novilha de presente. Zeus não pode recusar sem se trair.\n\nHera a confia a Argos Panoptes, gigante de cem olhos, que sempre deixa alguns abertos enquanto os outros dormem. Io passa os dias pastando amarrada, sem poder falar; só consegue se identificar ao pai escrevendo seu nome na areia com o casco. Zeus manda Hermes libertá-la. Disfarçado de pastor, Hermes toca a siringe e conta histórias até fazer todos os cem olhos de Argos fecharem, e então lhe corta a cabeça. Hera recolhe os olhos do gigante e os coloca na cauda de sua ave favorita, o pavão.", "grego": "Ἡραῖον", "ref": "Ovídio, Metamorfoses I 583–723 · Apolodoro II.1.3", "tempo": "A transformação", "certeza": "Sítio arqueológico", "sentido": "Um dos títulos de Hermes é Argeifontes, “matador de Argos”. O mito explica também a cauda do pavão.", "hoje": "O Heraion de Argos, grande santuário de Hera entre Argos e Micenas, tem ruínas de vários templos sobrepostos em terraços. Fica perto da vila de Chonikas."}, {"nome": "Mar Jônico", "moderno": "Mar Jônico", "lat": 38.5, "lon": 19.5, "texto": "Livre de Argos, Io não está livre de Hera. A deusa envia um moscardo (ou o próprio fantasma de Argos) que a pica sem parar e a enlouquece. Io corre, saltando por terra e mar, sem rumo e sem descanso.\n\nPrimeiro segue para oeste, ao longo da costa da Grécia, e atravessa o grande golfo entre a Grécia e a Itália. Segundo Ésquilo, esse mar passou a se chamar Jônico por causa dela, Iónios póntos, o mar de Io.", "grego": "Ἰόνιον πέλαγος", "ref": "Ésquilo, Prometeu Acorrentado 836–841", "tempo": "A fuga para o oeste", "certeza": "Etimologia antiga", "sentido": "Os linguistas modernos acham mais provável que o nome venha dos jônios, mas os gregos gostavam de ligar a geografia aos mitos.", "hoje": "O mar Jônico separa a Grécia da Itália. É o mar mais profundo do Mediterrâneo, chegando a mais de 5.000 m na fossa Calipso."}, {"nome": "Cáucaso", "moderno": "Geórgia", "lat": 42.7, "lon": 44.52, "texto": "A fuga a leva para o norte e o leste, por montanhas desconhecidas, até o Cáucaso. Ali, no fim do mundo, encontra Prometeu acorrentado ao rochedo. São duas vítimas de Zeus frente a frente: uma que se move sem parar, outra que não pode se mover.\n\nPrometeu lhe revela o futuro. Ela vai cruzar a Cítia, encontrar as Amazonas, atravessar um estreito, passar pelas Górgonas e chegar ao Nilo, onde Zeus a tocará com a mão e lhe devolverá a forma. E mais: de sua descendência, na décima terceira geração, nascerá o herói que libertará Prometeu, Héracles.", "grego": "Καύκασος", "ref": "Ésquilo, Prometeu Acorrentado 561–886", "tempo": "O encontro com Prometeu", "certeza": "Tradicional", "sentido": "Ésquilo une dois mitos para mostrar dois lados da tirania de Zeus e a esperança de que ela terminará.", "hoje": "A cordilheira do Grande Cáucaso, entre o mar Negro e o Cáspio, abriga o monte Elbrus (5.642 m), o mais alto da Europa, e o Kazbek, tradicionalmente o rochedo de Prometeu."}, {"nome": "Bósforo", "moderno": "Istambul", "lat": 41.12, "lon": 29.07, "texto": "Seguindo a profecia, Io atravessa o estreito que separa a Europa da Ásia. Daí em diante ele se chama Bósforo, de boûs (vaca) e póros (passagem): a passagem da vaca.\n\nEm outra versão, ela cruza o Bósforo Cimério, o estreito entre a Crimeia e o mar de Azov. Os bizantinos posteriores diziam que sua cidade, Bizâncio, tinha sido fundada por uma neta de Io, e mostravam uma estátua de vaca na margem asiática.", "grego": "Βόσπορος", "ref": "Ésquilo, Prometeu Acorrentado 732–735 · Apolodoro II.1.3", "tempo": "A passagem da vaca", "certeza": "Etimologia antiga", "sentido": "Um estreito que até hoje separa dois continentes leva o nome de uma moça transformada em vaca.", "hoje": "O Bósforo atravessa Istambul, com cerca de 30 km de extensão. É cruzado por três pontes suspensas e dois túneis. Na margem asiática, Kadıköy era a antiga Calcedônia."}, {"nome": "Mênfis", "moderno": "Egito", "lat": 29.85, "lon": 31.25, "texto": "Depois de passar por toda a Ásia, Io chega ao Egito, às margens do Nilo. Ali Zeus a toca suavemente (ou sopra sobre ela), e ela recupera a forma humana: os pelos caem, os chifres diminuem, os olhos voltam a ser humanos. Com medo de mugir, ela fala pela primeira vez com hesitação.\n\nDesse toque nasce Épafo, cujo nome viria de epaphân, “tocar”. Hera ainda o faz raptar pelos Curetes; Io o procura por toda parte e o encontra na Síria. Épafo se torna rei do Egito e funda Mênfis. Os gregos identificavam Io com a deusa egípcia Ísis, representada com chifres de vaca. Seus descendentes incluem Dânao e Egito, Agenor, Cadmo, Europa, Perseu e Héracles.", "grego": "Μέμφις", "ref": "Ésquilo, Suplicantes · Apolodoro II.1.3–4 · Heródoto II.41", "tempo": "A volta à forma humana", "certeza": "Sítio arqueológico", "sentido": "O mito liga a Grécia ao Egito pela genealogia. Para os gregos, as grandes famílias de heróis tinham raízes no Oriente.", "hoje": "As ruínas de Mênfis, perto de Mit Rahina, ao sul do Cairo, incluem o colosso deitado de Ramsés II. Fazem parte do Patrimônio Mundial junto com as pirâmides de Gizé e Sacara."}]}, {"id": "danaides", "titulo": "As Danaides", "ciclo": "metamorfoses", "fontes": ["Ésquilo, As Suplicantes", "Apolodoro II.1"], "resumo": "Dois irmãos descendentes de Io disputam o reino do Egito: Dânao, pai de cinquenta filhas, e Egito, pai de cinquenta filhos. Egito quer casar todos os filhos com as primas para dominar o irmão. Dânao foge com as filhas para Argos, a terra de sua bisavó Io. A história das Danaides é a de uma noite de núpcias sangrenta, de uma única filha que desobedece por amor e de um castigo eterno no Hades.", "paradas": [{"nome": "Egito", "moderno": "Delta do Nilo", "lat": 30.8, "lon": 31.0, "texto": "Os gêmeos Dânao e Egito são filhos do rei Belo, neto de Épafo. Belo divide o reino: Egito fica com a Arábia e Dânao com a Líbia. Egito conquista ainda o vale do Nilo, que passa a ter seu nome.\n\nTemendo os filhos do irmão, Dânao, aconselhado por Atena, constrói o primeiro navio de cinquenta remos e foge com as filhas pelo mar. As Danaides se recusam a casar com os primos, por consanguinidade ou porque um oráculo havia dito a Dânao que seria morto por um genro.", "grego": "Αἴγυπτος", "ref": "Apolodoro II.1.4–5 · Ésquilo, Suplicantes", "tempo": "A disputa", "certeza": "Região real", "sentido": "O mito explica o nome do Egito e liga o povo grego dos dânaos (como Homero chama os gregos) a um ancestral egípcio.", "hoje": "O delta do Nilo, ao norte do Cairo, é uma das regiões mais densamente povoadas do mundo e responde pela maior parte da agricultura egípcia."}, {"nome": "Argos", "moderno": "Argólida", "lat": 37.63, "lon": 22.73, "texto": "Em Argos, as cinquenta jovens se põem como suplicantes nos altares, com ramos de oliveira. O rei Pelasgo hesita: protegê-las significa guerra com o Egito; recusar é ofender Zeus, protetor dos suplicantes. Ele submete a decisão à assembleia do povo, que vota pela proteção. Pouco depois, Dânao se torna rei de Argos.\n\nOs filhos de Egito chegam com um exército e exigem os casamentos. Dânao finge aceitar, mas na noite de núpcias entrega a cada filha um punhal e ordena que matem os maridos durante o sono. Quarenta e nove obedecem. Só Hipermnestra poupa seu noivo, Linceu, porque ele respeitou sua virgindade (ou porque ela o amou), e o ajuda a fugir. Dânao a leva a julgamento; Afrodite a defende, e ela é absolvida. Linceu e Hipermnestra herdam o trono, e deles descendem Perseu e Héracles.", "grego": "Ἄργος", "ref": "Ésquilo, Suplicantes · Apolodoro II.1.5 · Píndaro, Pítica IX 112–116", "tempo": "A noite de núpcias", "certeza": "Cidade real", "sentido": "Ésquilo mostra numa das peças mais antigas que restaram uma assembleia votando, um eco da democracia ateniense projetado no passado mítico.", "hoje": "Pausânias viu em Argos o túmulo de Hipermnestra e Linceu, e um templo de Apolo Lício fundado por Dânao. A cidade moderna cobre boa parte da antiga."}, {"nome": "Lerna", "moderno": "Argólida", "lat": 37.55, "lon": 22.72, "texto": "As quarenta e nove Danaides cortam as cabeças dos maridos e as enterram em Lerna; os corpos recebem funerais diante da cidade. Atena e Hermes, por ordem de Zeus, purificam as jovens. Dânao as casa depois com os vencedores de uma corrida a pé.\n\nNo Hades, porém, a tradição posterior diz que elas pagam pelo crime. Estão condenadas a encher de água um grande jarro (ou uma banheira) que tem o fundo furado, transportando a água em peneiras ou em jarros quebrados. A tarefa nunca termina.", "grego": "Λέρνη", "ref": "Apolodoro II.1.5 · Platão, Górgias 493b · Horácio, Odes III.11", "tempo": "O castigo eterno", "certeza": "Sítio arqueológico", "sentido": "O “tonel das Danaides” virou expressão para qualquer trabalho inútil e sem fim, como uma despesa que nunca se completa.", "hoje": "Lerna, ao sul de Argos, é a mesma terra da Hidra. Dânao teria descoberto ali as nascentes que tornaram a Argólida fértil."}]}, {"id": "faetonte", "titulo": "Faetonte", "ciclo": "metamorfoses", "fontes": ["Ovídio I–II"], "resumo": "Faetonte é filho de Hélio, o Sol, e da ninfa Clímene, mas cresceu sem conhecer o pai. Quando um colega zomba dele, dizendo que a história do pai divino é mentira da mãe, Faetonte viaja até o palácio do Sol para ter certeza. O pedido que faz lá é a catástrofe mais espetacular das Metamorfoses de Ovídio: o dia em que o mundo pegou fogo.", "paradas": [{"nome": "Palácio do Sol", "moderno": "Oriente (Etiópia/Índia, lendário)", "lat": 15.0, "lon": 40.0, "texto": "Faetonte atravessa a Etiópia e a Índia até o palácio do Sol, no extremo oriente, com colunas de ouro e portas de prata cinzeladas por Hefesto. Hélio está sentado num trono de esmeraldas, cercado pelos Dias, Meses, Anos, Séculos e as Estações. Tira a coroa de raios para o filho poder se aproximar, e jura pelo rio Estige que lhe dará qualquer prova que pedir.\n\nFaetonte pede para conduzir o carro do Sol por um dia. Hélio se arrepende na hora: nem Zeus conseguiria guiar aqueles cavalos que soltam fogo pelas narinas, num caminho íngreme de subida, vertiginoso no meio e desabando para o oeste, entre o Touro, o Leão, o Escorpião e o Caranguejo. Implora para que o filho peça outra coisa. Faetonte insiste. Preso ao juramento, Hélio lhe passa um unguento contra as chamas, põe a coroa de raios na cabeça dele e dá o último conselho: não suba muito nem desça demais, siga as marcas das rodas.", "grego": "Ἡλίου βασίλεια", "ref": "Ovídio, Metamorfoses I 750–II 149", "tempo": "O pedido", "certeza": "Lendário", "sentido": "Uma promessa irrefletida feita por amor. O juramento pelo Estige obriga até os deuses.", "hoje": "O palácio do Sol é um lugar imaginário no extremo oriente, para além da Índia. O ponto no mapa é apenas uma indicação."}, {"nome": "Líbia", "moderno": "Saara", "lat": 26.0, "lon": 17.0, "texto": "Os cavalos percebem logo que o carro está leve e que a mão do condutor é fraca. Saem do caminho. Faetonte, apavorado, solta as rédeas. O carro sobe tanto que congela a Terra, depois desce tão baixo que o mundo pega fogo.\n\nAs montanhas queimam: o Ida, o Hélicon, o Etna, o Parnaso, o Cáucaso, os Alpes. Os rios fervem, o Nilo foge e esconde a cabeça, que nunca mais foi encontrada (por isso ninguém conhecia suas nascentes). Os campos da Líbia viram deserto, e o sangue dos etíopes, chamuscado, fica escuro, dizia Ovídio, ecoando uma crença antiga. A própria Gaia, sufocada, ergue o rosto e implora a Zeus que salve o mundo.", "grego": "Λιβύη", "ref": "Ovídio, Metamorfoses II 150–300", "tempo": "O incêndio do mundo", "certeza": "Lendário", "sentido": "Um mito para explicar desertos, a nascente misteriosa do Nilo e as diferenças de clima entre as regiões da Terra.", "hoje": "O Saara é o maior deserto quente do mundo, com mais de 9 milhões de km². Hoje se sabe que era verde e cheio de lagos há cerca de 6.000 anos."}, {"nome": "Erídano", "moderno": "Rio Pó", "lat": 45.0, "lon": 12.3, "texto": "Zeus sobe ao ponto mais alto do céu e lança um raio que atinge Faetonte. O carro se despedaça; os cavalos se soltam; o jovem cai como uma estrela cadente, com os cabelos em chamas, e mergulha no rio Erídano, longe da pátria. As ninfas da Itália o enterram e escrevem no túmulo que ele não conseguiu guiar o carro do pai, mas caiu tentando algo grandioso.\n\nSuas irmãs, as Helíades, choram junto ao túmulo por quatro meses. Os pés delas criam raízes, o corpo se cobre de casca, os braços viram galhos. Transformadas em choupos, continuam chorando, e as lágrimas endurecidas ao sol caem no rio como gotas de âmbar. Cicno, primo e amigo de Faetonte, chora tanto que se transforma em cisne. O Sol, de luto, se recusa a nascer por um dia, e o mundo fica iluminado só pelo fogo dos incêndios.", "grego": "Ἠριδανός", "ref": "Ovídio, Metamorfoses II 301–380 · Apolônio de Rodes IV 595–626", "tempo": "A queda", "certeza": "Tradicional", "sentido": "A queda de Faetonte foi lida como alerta contra a ambição e também como elogio da coragem. O âmbar, em grego, se chama élektron, de onde vem a palavra eletricidade.", "hoje": "O rio Pó, o maior da Itália, era identificado com o Erídano já na Antiguidade. Os choupos ainda são a árvore típica de suas margens."}]}, {"id": "aracne-midas-niobe", "titulo": "Castigos da Ásia Menor: Aracne, Midas e Níobe", "ciclo": "metamorfoses", "fontes": ["Ovídio VI e XI"], "resumo": "A Ásia Menor, terra de reinos ricos como a Lídia e a Frígia, foi para os gregos o cenário de várias histórias de mortais que se acharam iguais aos deuses: uma tecelã que desafia Atena, um rei que quer ouro e que julga mal a música de Apolo, uma rainha que se gaba dos filhos diante de uma deusa. Todas terminam com uma transformação que permanece visível no mundo.", "paradas": [{"nome": "Hipepa (Lídia)", "moderno": "Ödemiş, Turquia", "lat": 38.23, "lon": 27.97, "texto": "Aracne, filha de um tintureiro de púrpura da Lídia, é tão hábil no tear que as ninfas deixam os rios e as vinhas para vê-la trabalhar. Todos dizem que ela aprendeu com Atena. Aracne nega e desafia a deusa para um concurso. Atena aparece disfarçada de velha e aconselha humildade; Aracne zomba. A deusa se revela, e o concurso começa.\n\nAtena tece a sua disputa com Poseidon por Atenas, com os doze deuses em majestade, e nos cantos mortais castigados por desafiar os deuses. Aracne tece os enganos amorosos dos deuses: Zeus como touro com Europa, como cisne com Leda, como chuva de ouro com Dânae, Poseidon, Apolo, Dioniso. O trabalho é perfeito; nem a Inveja acharia defeito. Atena, furiosa, rasga a tapeçaria e golpeia Aracne com a lançadeira. Humilhada, a jovem se enforca. Atena, com pena, a salva, mas a condena a continuar pendurada e tecendo para sempre: borrifa-a com ervas de Hécate, e ela vira aranha.", "grego": "Ὕπαιπα", "ref": "Ovídio, Metamorfoses VI 1–145", "tempo": "Aracne", "certeza": "Sítio tradicional", "sentido": "Ovídio deixa a dúvida: Aracne é castigada pela arrogância, ou por ter mostrado a verdade sobre os deuses melhor que a própria deusa? O nome da classe das aranhas, Arachnida, vem dela.", "hoje": "Hipepa, pequena cidade lídia, ficava perto de Ödemiş, na província de İzmir. A região era famosa pela produção de tecidos e tinturas."}, {"nome": "Górdio (Frígia)", "moderno": "Yassıhüyük, Turquia", "lat": 39.65, "lon": 31.98, "texto": "Midas, rei da Frígia, encontra o velho Sileno, mestre de Dioniso, bêbado e perdido em seus jardins de rosas. Trata-o com honras por dez dias e o devolve ao deus. Dioniso, agradecido, oferece qualquer desejo. Midas pede que tudo o que tocar vire ouro.\n\nNo começo, é maravilhoso: galhos, pedras, espigas, maçãs viram ouro. Mas quando se senta para comer, o pão endurece em seus dentes e o vinho escorre como ouro líquido. Midas, morrendo de fome e sede, odiando o que desejou, implora a Dioniso que o liberte. Em versões posteriores, até a filha que o abraça vira estátua. Górdio, a capital, era também a cidade do famoso nó amarrado ao carro do fundador, Górdio, pai de Midas: quem o desatasse dominaria a Ásia. Séculos depois, Alexandre, o Grande, o cortou com a espada.", "grego": "Γόρδιον", "ref": "Ovídio, Metamorfoses XI 85–145 · Arriano, Anábase II.3", "tempo": "Midas e o ouro", "certeza": "Sítio arqueológico", "sentido": "O “toque de Midas” virou expressão para quem transforma tudo em dinheiro. O mito avisa que a riqueza sem medida mata.", "hoje": "Górdio fica perto de Yassıhüyük, a 90 km de Ancara. O Grande Túmulo (Tumulus MM), de 53 m de altura, é atribuído ao pai do Midas histórico, rei frígio do século VIII a.C. É Patrimônio Mundial desde 2023."}, {"nome": "Rio Pactolo", "moderno": "Sardes, Turquia", "lat": 38.49, "lon": 28.04, "texto": "Dioniso manda Midas se lavar na nascente do rio Pactolo, perto de Sardes. Midas mergulha a cabeça, e o poder do ouro passa dele para a água. Desde então, as areias do rio passaram a brilhar com ouro.\n\nMidas, desgostoso da riqueza, vai viver nos campos com Pã. Quando Pã desafia Apolo num concurso de música, o deus da montanha Tmolo julga a favor de Apolo. Midas é o único a discordar, preferindo a flauta rústica de Pã. Apolo, ofendido, alonga as orelhas do rei e as cobre de pelos cinzentos: orelhas de burro. Midas as esconde sob um turbante púrpura. Só o barbeiro sabe. Incapaz de guardar o segredo, ele cava um buraco na terra, sussurra “o rei Midas tem orelhas de burro” e o cobre. Ali nascem juncos, que, quando o vento passa, repetem o segredo ao mundo.", "grego": "Πακτωλός", "ref": "Ovídio, Metamorfoses XI 136–193 · Heródoto I.93, V.101", "tempo": "O rio de ouro e as orelhas", "certeza": "Rio real", "sentido": "O rio tinha mesmo ouro: o electro de suas areias permitiu a Creso e aos reis lídios cunhar algumas das primeiras moedas do mundo, no século VII a.C.", "hoje": "O Pactolo (Sart Çayı) passa pelas ruínas de Sardes, perto de Salihli, na Turquia. Arqueólogos encontraram ali uma refinaria de ouro do tempo de Creso."}, {"nome": "Monte Sípilo", "moderno": "Manisa", "lat": 38.6, "lon": 27.4, "texto": "Níobe, filha de Tântalo e rainha de Tebas, tem sete filhos e sete filhas. No festival de Leto, ela interrompe os ritos e diz que merece mais honra que a deusa, que só teve dois filhos.\n\nLeto pede vingança aos gêmeos. Apolo mata a flechadas os sete filhos de Níobe enquanto treinavam a cavalo; Ártemis mata as filhas, uma a uma, até restar a caçula, que a mãe tenta proteger com o corpo. Também ela morre. O marido, Anfião, se mata. Níobe, sentada entre os corpos, fica rígida de dor: o rosto empalidece, os olhos param, a língua congela. Um redemoinho a leva até o monte Sípilo, na terra natal, onde ela continua como uma rocha da qual escorrem lágrimas sem fim. Na Ilíada, Aquiles conta essa história a Príamo, lembrando que até Níobe, depois de tudo, voltou a comer.", "grego": "Σίπυλος", "ref": "Ovídio, Metamorfoses VI 146–312 · Ilíada XXIV 602–617", "tempo": "Níobe", "certeza": "Sítio identificado", "sentido": "O orgulho de mãe que vira catástrofe. A imagem da mulher de pedra que chora tornou-se símbolo do luto inconsolável.", "hoje": "Na encosta do monte Sípilo, perto de Manisa, há uma rocha que, vista de certo ângulo e com água escorrendo pela frente, parece um rosto de mulher chorando. É chamada “Ağlayan Kaya”, a pedra que chora."}]}, {"id": "amores-chipre", "titulo": "Pigmalião e Adônis", "ciclo": "metamorfoses", "fontes": ["Ovídio X"], "resumo": "Chipre era a ilha de Afrodite, e Ovídio dedica um livro inteiro das Metamorfoses aos amores ligados a ela: um escultor que se apaixona pela própria obra, e o neto dele, que nasce de um amor proibido e se torna amante da própria deusa. As duas histórias são contadas por Orfeu, cantando seu luto depois de perder Eurídice.", "paradas": [{"nome": "Amatunte", "moderno": "Limassol, Chipre", "lat": 34.71, "lon": 33.14, "texto": "Pigmalião, escultor de Chipre, vive sozinho, enojado com as mulheres da ilha (as Propétides, que negaram a divindade de Afrodite e foram transformadas nas primeiras prostitutas e depois em pedra). Esculpe em marfim uma mulher mais bela que qualquer mulher real, e se apaixona por ela.\n\nBeija a estátua, imagina que ela retribui, dá-lhe presentes, conchas, flores, colares, veste-a, deita-a em almofadas. No festival de Afrodite, pede timidamente à deusa uma esposa “semelhante” à estátua. Em casa, beija a escultura, e o marfim parece morno. Toca de novo: a pele cede aos dedos como cera ao sol, as veias pulsam. A estátua abre os olhos e vê, ao mesmo tempo, o céu e o homem que a ama. Afrodite comparece ao casamento. Nove meses depois nasce Pafos, que dá nome à cidade.", "grego": "Ἀμαθοῦς", "ref": "Ovídio, Metamorfoses X 238–297", "tempo": "Pigmalião", "certeza": "Sítio arqueológico", "sentido": "O artista apaixonado pela criação. A estátua só ganhou o nome Galateia muito depois, no século XVIII. A peça Pigmalião, de Bernard Shaw, deu origem a My Fair Lady.", "hoje": "Amatunte, junto a Limassol, foi um dos reinos antigos de Chipre, com um santuário de Afrodite na acrópole. Um enorme vaso de pedra de 14 toneladas dali está hoje no Louvre."}, {"nome": "Rio Adônis", "moderno": "Nahr Ibrahim, Biblos", "lat": 34.07, "lon": 35.64, "texto": "Mirra, bisneta de Pigmalião, é tomada por um amor proibido pelo próprio pai, o rei Cíniras. Com a ajuda da ama, une-se a ele no escuro, sem ser reconhecida. Quando ele descobre, tenta matá-la. Ela foge grávida até a Arábia e pede aos deuses que a tirem do mundo dos vivos e dos mortos. É transformada na árvore da mirra, e suas lágrimas são a resina perfumada. Da casca nasce um menino, Adônis.\n\nAdônis cresce tão belo que Afrodite, ferida sem querer por uma flecha de Eros, se apaixona por ele. Abandona o Olimpo para caçar com ele nas florestas, e o adverte a evitar feras perigosas. Adônis não escuta, persegue um javali, que crava as presas em sua virilha. Afrodite ouve os gemidos e chega tarde. Do sangue de Adônis, ela faz nascer a anêmona, flor vermelha e frágil, que dura tão pouco quanto ele, derrubada pelo vento. Em outra versão, Perséfone também o ama, e Zeus decide que ele passe parte do ano com cada deusa.", "grego": "Ἄδωνις ποταμός", "ref": "Ovídio, Metamorfoses X 298–739 · Luciano, Sobre a Deusa Síria 6–8 · Apolodoro III.14.4", "tempo": "Adônis", "certeza": "Rio real", "sentido": "Adônis vem do culto semítico a Tammuz, deus que morre e renasce. Seu nome vem de adon, “senhor”. As Adônias eram festas de luto celebradas por mulheres gregas.", "hoje": "O rio Adônis (Nahr Ibrahim), perto de Biblos, no Líbano, fica avermelhado a cada primavera por causa da terra vermelha arrastada das montanhas. Os antigos diziam que era o sangue de Adônis. Na nascente, em Afqa, havia um templo de Afrodite."}]}, {"id": "narciso-sisifo", "titulo": "Narciso, Sísifo e outros castigos", "ciclo": "metamorfoses", "fontes": ["Ovídio III", "Odisseia XI"], "resumo": "Duas histórias de castigos famosos, unidas pela região onde se passam. Narciso é o jovem tão belo que despreza todos que o amam, até se apaixonar pela única pessoa que não pode alcançar. Sísifo é o rei mais esperto da Grécia, que enganou a própria Morte e por isso ganhou o castigo mais conhecido do mundo dos mortos.", "paradas": [{"nome": "Téspias", "moderno": "Beócia", "lat": 38.31, "lon": 23.15, "texto": "Quando Narciso nasceu, o adivinho Tirésias disse que ele viveria muito, se nunca conhecesse a si mesmo. Aos dezesseis anos, rapazes e moças o desejam, e ele recusa todos. A ninfa Eco se apaixona por ele. Hera a havia castigado: por distraí-la com conversas enquanto Zeus a traía, Eco só podia repetir as últimas palavras dos outros. Ela segue Narciso pela floresta e responde a ele com os próprios fins de suas frases. Quando se mostra e tenta abraçá-lo, ele a repele. Eco se esconde nas cavernas e definha até restarem só os ossos, que viram pedra, e a voz.\n\nUm dos rejeitados pede aos deuses que Narciso ame e não possa ter o que ama. Nêmesis ouve. Num dia de calor, Narciso se debruça para beber numa fonte límpida e vê na água um rosto que o encanta. Tenta beijá-lo, abraçá-lo. Demora a entender que é ele mesmo. Quando entende, já não consegue sair dali. Definha junto à fonte, enquanto Eco repete seu último adeus. Até no rio Estige ele continua se olhando. Quando as ninfas vão buscar o corpo para a pira, encontram no lugar uma flor amarela com pétalas brancas: o narciso.", "grego": "Θεσπιαί", "ref": "Ovídio, Metamorfoses III 339–510 · Pausânias IX.31.7–9", "tempo": "Narciso e Eco", "certeza": "Sítio tradicional", "sentido": "O oposto do “conhece-te a ti mesmo” de Delfos: aqui, conhecer-se é a ruína. A psicanálise transformou o nome dele no conceito de narcisismo.", "hoje": "Pausânias situa a fonte de Narciso em Donakon, no território de Téspias, na Beócia, junto ao monte Hélicon. As ruínas de Téspias ficam perto da vila moderna de Thespies."}, {"nome": "Corinto (Éfira)", "moderno": "Coríntia", "lat": 37.906, "lon": 22.88, "texto": "Sísifo, fundador de Éfira (Corinto), é o mais astuto dos homens. Quando Zeus rapta a ninfa Egina, Sísifo conta ao pai dela, o rio Asopo, quem é o culpado, em troca de uma fonte para sua cidadela. Zeus, furioso, envia Tânatos, a Morte, para levá-lo. Sísifo pergunta, com fingida curiosidade, como funcionam as correntes que ela traz, e acorrenta a própria Morte. Enquanto Tânatos está preso, ninguém morre no mundo, e Ares, irritado porque as guerras não fazem mais vítimas, o liberta.\n\nAntes de morrer, Sísifo pede à esposa que não lhe faça funeral. No Hades, se queixa a Perséfone de que a mulher o desonrou e pede para voltar à vida só para castigá-la. Já na Terra, não volta mais e vive até a velhice. Quando enfim morre de novo, é condenado a empurrar uma enorme pedra até o alto de uma montanha. Sempre que está quase no topo, a pedra rola de volta, e ele recomeça. Para sempre.", "grego": "Ἐφύρα", "ref": "Odisseia XI 593–600 · Ferecides · Apolodoro I.9.3", "tempo": "Sísifo", "certeza": "Sítio arqueológico", "sentido": "Albert Camus fez dele o símbolo do absurdo da existência humana, e concluiu: é preciso imaginar Sísifo feliz.", "hoje": "No Acrocorinto, a fortaleza que domina Corinto, ainda corre a fonte de Pirene alta, que segundo o mito Asopo deu a Sísifo em troca da revelação."}]}], "pendentes_para_proximas_versoes": ["Amazonas e Pentesileia", "Atalanta e a corrida das maçãs", "Castor e Pólux (Dióscuros) e Leda", "Héracles: trabalhos secundários (Anteu, Caco, Alceste, morte no Eta)", "Retornos (Nostoi): Menelau no Egito, Diomedes na Itália, Ájax Lócrio", "Eneias (ponte com Roma)", "Mitos de Creta: Minos, Pasífae, Glauco", "Asclépio, Íxion, Endimião, Calisto", "Lugares do além: Tártaro, Campos Elíseos, Ilhas dos Bem-Aventurados, rios do Hades"]};

function fitPoints(pts, pad = 0.82, animate = true) {
  const s0 = proj.scale(), t0 = proj.translate();
  proj.scale(1).translate([0, 0]);
  const xy = pts.map(p => proj([p.lon, p.lat]));
  proj.scale(s0).translate(t0);
  let [x0, y0, x1, y1] = [Infinity, Infinity, -Infinity, -Infinity];
  xy.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
  const dx = Math.max(x1 - x0, 0.02), dy = Math.max(y1 - y0, 0.02);
  const k = Math.min(Math.max(pad * Math.min(W / dx, H / dy), 300), 9000);
  const t = [W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2];
  flyTo(k, t, animate ? 900 : 0);
}
let flyRaf = 0;
function flyTo(k1, t1, dur) {
  cancelAnimationFrame(flyRaf);
  const k0 = proj.scale(), t0 = proj.translate();
  if (reduce || !dur) return setView(k1, t1);
  // interpola em espaço "mundo" para não deslizar de lado durante o zoom
  const c0 = [(W / 2 - t0[0]) / k0, (H / 2 - t0[1]) / k0], c1 = [(W / 2 - t1[0]) / k1, (H / 2 - t1[1]) / k1];
  const start = performance.now();
  const step = now => {
    let u = Math.min((now - start) / dur, 1); u = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const k = Math.exp(Math.log(k0) + (Math.log(k1) - Math.log(k0)) * u);
    const c = [c0[0] + (c1[0] - c0[0]) * u, c0[1] + (c1[1] - c0[1]) * u];
    setView(k, [W / 2 - c[0] * k, H / 2 - c[1] * k]);
    if (u < 1) flyRaf = requestAnimationFrame(step);
  };
  flyRaf = requestAnimationFrame(step);
}

const RANGE_INK = { light: ["rgba(110,85,55,.30)","rgba(150,125,90,.30)","rgba(255,252,240,.45)"], dark: ["rgba(0,0,0,.40)","rgba(105,92,88,.45)","rgba(190,175,160,.20)"] };
const DOT = { light: "rgba(160,128,80,.5)", dark: "rgba(170,150,115,.4)" };

const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const ramp = stops => { const s = stops.map(([v, c]) => [v, hexRGB(c)]); return v => {
  if (v <= s[0][0]) return s[0][1];
  for (let i = 1; i < s.length; i++) if (v <= s[i][0]) { const t = (v - s[i - 1][0]) / (s[i][0] - s[i - 1][0]), a = s[i - 1][1], b = s[i][1]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  return s[s.length - 1][1]; }; };

/* modelo de elevação (AWS Terrain Tiles, 0,08°) do Mediterrâneo central */
const DEM = (() => {
  const D = GEO.dem, n = D.cols * D.rows, lv = new Uint8Array(n); let i = 0, m; const re = /([^0-9])(\d*)/g;
  while ((m = re.exec(D.d))) { const v = D.alph.indexOf(m[1]), c = m[2] ? +m[2] : 1; lv.fill(v, i, i + c); i += c; }
  const SEA = [-3400, -2500, -1500, -650, -200, -40], e = new Float32Array(n);

  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
  return [mx - dy * .16, my + dx * .16];
}
function bez(a, c, b, t) { const u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; }
const P = p => proj([p.lon, p.lat]);
/* pontos (em tela) do trecho que chega à parada i; usa "via" quando o mito traz a rota marítima detalhada */
function legPts(m, i) {
  const a = P(m.paradas[i - 1]), b = P(m.paradas[i]), v = m.paradas[i].via;
  if (v) return [a, ...v.map(q => proj(q)), b];
  const k = ctrl(a, b), out = [];
  for (let j = 0; j <= 24; j++) out.push(bez(a, k, b, j / 24));
  return out;
}
function trace(c, pts, t = 1) {
  c.moveTo(pts[0][0], pts[0][1]);
  if (t >= 1) { for (let j = 1; j < pts.length; j++) c.lineTo(pts[j][0], pts[j][1]); return pts[pts.length - 1]; }
  let L = 0; const ds = [];
  for (let j = 1; j < pts.length; j++) { const d = Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]); ds.push(d); L += d; }
  let rem = L * t;
  for (let j = 1; j < pts.length; j++) {
    if (rem <= ds[j - 1]) { const u = ds[j - 1] ? rem / ds[j - 1] : 0, p = [pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * u, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * u]; c.lineTo(p[0], p[1]); return p; }
    rem -= ds[j - 1]; c.lineTo(pts[j][0], pts[j][1]);
  }
  return pts[pts.length - 1];
}
const stopColor = (m, i) => (m.trechos && m.paradas[i].trecho && m.trechos[m.paradas[i].trecho].cor) || CYC[m.ciclo].cor;
function legLen(m, i) { const p = legPts(m, i); let L = 0; for (let j = 1; j < p.length; j++) L += Math.hypot(p[j][0] - p[j - 1][0], p[j][1] - p[j - 1][1]); return L; }

function visibleMyths() { return MYTHS.filter(m => state.filter.has(m.ciclo)); }

let hits = [];
function draw() {
  if (!W) return;
  drawBase();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(base, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hits = [];
  const display = getComputedStyle(document.documentElement).getPropertyValue("--f-display");
  const body = getComputedStyle(document.documentElement).getPropertyValue("--f-body");

  if (!state.myth) {
    // visão geral: todas as rotas finas + pontos por ciclo
    for (const m of visibleMyths()) {
      const col = CYC[m.ciclo].cor, xy = m.paradas.map(P);
      ctx.beginPath();
      for (let i = 1; i < xy.length; i++) trace(ctx, legPts(m, i));
      ctx.strokeStyle = col; ctx.globalAlpha = .35; ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
      xy.forEach(([x, y], i) => {
        ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = colors.halo; ctx.stroke();
        hits.push({ x, y, myth: m, i });
      });
    }
    return;
  }

  const m = state.myth, xy = m.paradas.map(P);
  // rota completa tracejada
  ctx.setLineDash([3, 5]); ctx.globalAlpha = .55; ctx.lineWidth = 1.4;
  for (let i = 1; i < xy.length; i++) { ctx.beginPath(); trace(ctx, legPts(m, i)); ctx.strokeStyle = stopColor(m, i); ctx.stroke(); }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  // trecho percorrido
  let head = xy[0];
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 1; i <= state.cur; i++) {
    const pts = legPts(m, i);
    ctx.beginPath(); const h = trace(ctx, pts, i === state.cur ? state.seg : 1);
    if (i === state.cur) head = h;
    ctx.strokeStyle = colors.halo; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = stopColor(m, i); ctx.lineWidth = 3; ctx.stroke();
  }
  // paradas
  xy.forEach(([x, y], i) => {
    const done = i < state.cur || (i === state.cur && state.seg >= 1), col = stopColor(m, i);
    ctx.beginPath(); ctx.arc(x, y, i === state.cur ? 6 : 4.5, 0, 7);
    ctx.fillStyle = done ? col : colors.halo; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
    hits.push({ x, y, myth: m, i });
  });
  // cabeça animada / pulso
  const t = performance.now() / 1000;
  const pr = 8 + (t * 14 % 14);
  ctx.beginPath(); ctx.arc(head[0], head[1], pr, 0, 7);
  ctx.strokeStyle = colors.gold; ctx.globalAlpha = Math.max(0, 1 - (pr - 8) / 14); ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(head[0], head[1], 4, 0, 7); ctx.fillStyle = colors.gold; ctx.fill();

  // rótulos com desvio de colisão (atual primeiro)
  const order = [state.cur, ...xy.map((_, i) => i).filter(i => i !== state.cur)];
  const boxes = [], seen = new Set();
  for (const i of order) {
    const p = m.paradas[i], name = p.nome.replace(/^\d+\.\s*/, "");
    const key = name + p.lat; if (seen.has(key) && i !== state.cur) continue;
    const isCur = i === state.cur;
    ctx.font = (isCur ? "600 14px " : "12px ") + (isCur ? body : body);
    const w = ctx.measureText(name).width, [x, y] = xy[i];
    const cands = [[x + 10, y + 4], [x - 10 - w, y + 4], [x - w / 2, y - 12], [x - w / 2, y + 20]];
    let placed = null;
    for (const [lx, ly] of cands) {
      const b = [lx - 3, ly - 13, lx + w + 3, ly + 4];
      if (b[2] < 0 || b[0] > W || b[3] < 0 || b[1] > H) continue;
      if (!boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) { placed = [lx, ly, b]; break; }
    }
    if (!placed) continue;
    boxes.push(placed[2]); seen.add(key);
    ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = colors.halo; ctx.strokeText(name, placed[0], placed[1]);
    ctx.fillStyle = isCur ? colors.gold : colors.ink; ctx.fillText(name, placed[0], placed[1]);
  }
}

/* loop de animação: roda enquanto há trecho sendo traçado ou pulso visível */
let segStart = 0, segDur = 1100, playTimer = 0;
function loop(now) {
  if (state.myth && state.seg < 1) {
    state.seg = reduce ? 1 : Math.min((now - segStart) / segDur, 1);
    if (state.seg >= 1) { renderStopsState(); schedulePlay(); }
  }
  draw();
  requestAnimationFrame(loop);
}

function goTo(i, animate = true) {
  const m = state.myth; if (!m) return;
  i = Math.max(0, Math.min(m.paradas.length - 1, i));
  const forward = i === state.cur + 1;
  state.cur = i;
  state.seg = (animate && forward && i > 0) ? 0 : 1;
  segStart = performance.now();
  // distância em tela define a duração
  if (i > 0) segDur = Math.min(2600, Math.max(700, legLen(m, i) * 4));
  ensureVisible(m.paradas[i]);
  renderStopsState();
  if (state.seg >= 1) schedulePlay();
}
function ensureVisible(p) {
  const [x, y] = proj([p.lon, p.lat]), m = 50;
  if (x < m || y < m || x > W - m || y > H - m) {
    const k = proj.scale(), t = proj.translate();
    flyTo(k, [t[0] + W / 2 - x, t[1] + H / 2 - y], 700);
  }
}
function schedulePlay() {
  clearTimeout(playTimer);
  if (!state.playing || !state.myth) return;
  if (state.cur >= state.myth.paradas.length - 1) { state.playing = false; renderControls(); return; }
  { const _p = state.myth.paradas[state.cur] || {}; const _len = String(_p.texto || "").length + String(_p.sentido || "").length; playTimer = setTimeout(() => goTo(state.cur + 1), Math.min(70000, Math.max(reduce ? 4000 : 2600, _len * 40))); }
}

ta","Tecer uma mortalha em um dia","Ganhar uma corrida de carros"],"Só o mendigo, Odisseu disfarçado, consegue. Em seguida ele mata os pretendentes."]],"titanomaquia":[["Qual dos filhos de Reia Cronos não chegou a engolir?",["Zeus","Poseidon","Hades","Hera"],"Zeus, o sexto filho, foi escondido em Creta. Os outros cinco foram engolidos ao nascer."],["O que Reia deu a Cronos no lugar do recém-nascido?",["Uma pedra enrolada em cueiros","Um cordeiro","Uma estátua de madeira","Um tronco de carvalho"],"Cronos engoliu a pedra sem desconfiar. Mais tarde ela virou o Ônfalo de Delfos."],["Em que ilha Zeus nasceu e cresceu escondido?",["Creta","Delos","Naxos","Rodes"],"Reia deu à luz numa caverna de Creta, longe da corte de Cronos."],["Quem dançava batendo lanças contra escudos para abafar o choro do bebê Zeus?",["Os Curetes","Os Ciclopes","Os Sátiros","As Mênades"],"Os Curetes, jovens guerreiros cretenses, faziam barulho diante da caverna para Cronos não ouvir."],["Qual é o nome da cabra que amamentou Zeus?",["Amalteia","Métis","Égina","Io"],"Amalteia (em algumas versões, uma ninfa) alimentou o deus; de seu chifre nasceu a Cornucópia."],["Quem ajudou Zeus a fazer Cronos vomitar os filhos?",["Métis, a deusa da prudência","Têmis","Hécate","Nix, a Noite"],"Métis preparou a droga que fez Cronos devolver a pedra e os cinco irmãos de Zeus."],["Em que monte os Titãs se instalaram durante a guerra?",["Ótris","Olimpo","Parnaso","Ida"],"Os Titãs ocuparam o Ótris, na Tessália; os deuses jovens, o Olimpo, do outro lado da planície."],["O que os Ciclopes forjaram para Zeus depois de libertados do Tártaro?",["O raio e o trovão","O tridente","O elmo da invisibilidade","A égide"],"O raio foi para Zeus, o tridente para Poseidon e o elmo da invisibilidade para Hades."],["Quantos anos durou a Titanomaquia?",["Dez","Três","Sete","Cem"],"Por dez anos nenhum lado venceu, até Zeus libertar Ciclopes e Hecatônquiros."],["Que castigo próprio o Titã Atlas recebeu?",["Sustentar o céu nos ombros","Ser ac
