function htmlLista(){
  const q = semAcento($("#busca").value.trim());
  const L = S.rede.linhas;
  let idx = L.map((l, i) => i).filter(i => ativo(L[i].t)).sort((a, b) => (TRILHO(L[b].t) - TRILHO(L[a].t)) || a - b);
  let html = "";
  if (q){
    const exato = idx.filter(i => semAcento(L[i].n) === q);
    const comeca = idx.filter(i => !exato.includes(i) && semAcento(L[i].n).startsWith(q));
    const resto = idx.filter(i => !exato.includes(i) && !comeca.includes(i) && L[i]._busca.includes(q));
    idx = [...exato, ...comeca, ...resto];
    const pts = q.length >= 3 ? S.rede.pontos.map((p, i) => i).filter(i => S.rede.pontos[i]._busca.includes(q)).slice(0, 30) : [];
    if (!idx.length && !pts.length && !(S.bairros && S.bairros.some(b => b._busca.includes(q)))) return `<div class="vazio">Nada encontrado para “${esc($("#busca").value)}”.</div>`;
    const bs = S.bairros && q.length >= 3 ? S.bairros.map((b, i) => i).filter(i => S.bairros[i]._busca.includes(q)).slice(0, 6) : [];
    if (bs.length) html += `<div class="secao">Bairros</div>` + bs.map(i => `<div class="lin" data-bairro-busca="${i}"><span class="num" style="background:#ffcc33">${IC.bairro}</span><div class="nome"><b>${esc(S.bairros[i].n)}</b><small>${S.bairros[i].z} · ${S.bairros[i]._linhas.length} linhas</small></div></div>`).join("");
    if (idx.length) html += `<div class="secao">Linhas · ${idx.length}</div>` + idx.slice(0, 200).map(i => linhaHTML(L[i], i)).join("");
    if (pts.length) html += `<div class="secao">Pontos</div>` + pts.map(i => {
      const p = S.rede.pontos[i];
      return `<div class="lin" data-p="${i}"><span class="num" style="background:#fff">${p[4] === 2 ? esc((PREFIXO[S.rede.linhas[p[3][0]].t] || "Estação").trim()) : "●"}</span><div class="nome"><b>${esc(p[0])}</b><small>${p[3].length} linha${p[3].length>1?"s":""}</small></div></div>`;
    }).join("");
    return html;
  }
  idx = idx.filter(i => passa(L[i]));
  const vis = `<div class="vistas"><button class="${S.vista === "lista" ? "on" : ""}" data-vista="lista" title="Lista">☰</button><button class="${S.vista === "grade" ? "on" : ""}" data-vista="grade" title="Só os números">▦</button></div>`;
  const titulo = S.lugar ? `${idx.length} linhas passam por ${esc(nomeLugar())}` : `${idx.length} linhas`;
  if (!idx.length) return `<div class="cabLista"><span>${titulo}</span>${vis}</div><div class="vazio">Nenhuma linha com esses filtros. <button class="lk" data-tira-tudo>Limpar filtros</button></div>`;
  const grupos = ORDEM_TIPO.map(t => [t, idx.filter(i => L[i].t === t)]).filter(g => g[1].length);
  return `<div class="cabLista"><span>${titulo}</span>${vis}</div>` + grupos.map(([t, is]) =>
    `<div class="gcab"><i class="bol" style="background:${PADRAO[t]}"></i>${NOME_GRUPO[t]}<em>${is.length}</em></div>` +
    (S.vista === "grade"
      ? `<div class="lgrade">${is.map(i => `<span data-l="${i}" title="${esc(L[i].l)}">${selo(L[i])}</span>`).join("")}</div>`
      : is.map(i => linhaHTML(L[i], i)).join(""))).join("");
}

function htmlLinha(){
  const l = S.rede.linhas[S.linha], d = l.d[S.dir] || l.d[0];
  const P = S.rede.pontos;
  const fatos = [];
  if (l.$ != null) fatos.push(`<div class="fato"><b>R$ ${l.$.toFixed(2).replace(".",",")}</b>tarifa</div>`);
  if (l.i) fatos.push(`<div class="fato"><b>${l.i} min</b>intervalo no pico</div>`);
  fatos.push(`<div class="fato"><b>${d.s.length}</b>${TRILHO(l.t) ? "estações" : "pontos neste sentido"}</div>`);
  fatos.push(`<div class="fato"><b>${kmDe(l._coords[S.dir] || l._coords[0])} km</b>percurso</div>`);
  const sent = l.d.length > 1 ? `<div class="sentidos">${l.d.map((x, i) =>
      `<button data-dir="${i}" class="${i===S.dir?"on":""}"><span>sentido</span>${esc(x.h || (i ? "volta" : "ida"))}</button>`).join("")}</div>` : "";
  const seq = d.s.map((pi, k) => {
    const p = P[pi]; const outras = p[3].length - 1;
    const cls = (k === 0 || k === d.s.length - 1) ? "ponta" : "";
    const nota = !outras ? "" : TRILHO(l.t)
      ? `<small>integração: ${p[3].filter(i => i !== S.linha).map(i => esc(S.rede.linhas[i].n)).join(" · ")}</small>`
      : `<small>+${outras} linha${outras>1?"s":""} neste ponto</small>`;
    return `<li class="${cls}" data-p="${pi}">${esc(p[0])}${nota}</li>`;
  }).join("");
  return `<div class="det">
    <button class="voltar" data-voltar>← todas as linhas</button>
    <div class="cab">${selo(l)}<div><h2>${esc(l.l)}</h2><div class="meta">${NOME_TIPO[l.t]||""} · ${esc(l.a)}</div></div></div>
    <div class="fatos">${fatos.join("")}</div>
    ${sent}
    <div class="acoes"><button data-enq>Enquadrar no mapa</button><button data-comp>Compartilhar</button></div>
    ${htmlBairrosLinha(d)}
    <ol class="seq" style="--cor:${l._cor}">${seq || '<li>Sem pontos cadastrados neste sentido.</li>'}</ol>
  </div>`;
}

function htmlBairrosLinha(d){
  if (!S.bairros) return "";
  const seq = [];
  for (const i of d.s){ const b = S.rede.pontos[i]._b; if (b >= 0 && seq[seq.length - 1] !== b) seq.push(b); }
  // tira idas e voltas curtas (A, B, A → A, B)
  const vistos = new Set(), lista = seq.filter(b => vistos.has(b) ? false : (vistos.add(b), true));
  if (!lista.length) return "";
  return `<div class="secao" style="padding-left:0;margin-top:12px">Passa por ${lista.length} bairro${lista.length > 1 ? "s" : ""}</div>
    <div class="bseq">${lista.map(b => `<button data-bai-ir="${b}">${esc(S.bairros[b].n)}</button>`).join("<span>›</span>")}</div>`;
}

function htmlPonto(pi){
  const p = S.rede.pontos[pi], L = S.rede.linhas;
  const ls = p[3].filter(i => ativo(L[i].t));
  const estacao = p[4] === 2;
  const tipoEst = estacao ? [...new Set(p[3].map(i => NOME_TIPO[L[i].t]))].join(" e ") : "";
  // integração: ônibus perto da estação, ou estações perto do ponto de ônibus
  const P = S.rede.pontos, aqui = [p[2], p[1]];
  const vizinhos = P.map((q, j) => [j, q]).filter(([j, q]) => j !== pi && (estacao ? q[4] !== 2 : q[4] === 2))
    .map(([j, q]) => [j, dist(aqui, [q[2], q[1]])]).filter(x => x[1] <= (estacao ? 300 : 500)).sort((a, b) => a[1] - b[1]);
  let integra = "";
  if (estacao){
    const bus = [...new Set(vizinhos.flatMap(([j]) => P[j][3]))].filter(i => ativo(L[i].t)).sort((a, b) => a - b);
    if (bus.length) integra = `<div class="secao" style="padding-left:0;margin-top:14px">Ônibus a até 300 m · ${bus.length} linhas</div>
      <div class="grade">${bus.map(i => `<span data-l="${i}" title="${esc(L[i].l)}">${selo(L[i])}</span>`).join("")}</div>`;
  } else if (vizinhos.length){
    integra = `<div class="secao" style="padding-left:0;margin-top:14px">Metrô, trem, VLT e barcas perto</div>` + vizinhos.slice(0, 4).map(([j, m]) =>
      `<div class="lin" data-p="${j}" style="padding-left:0;padding-right:0"><span class="num mono" style="background:#fff;font-size:12px">${Math.round(m)} m</span><div class="nome"><b>${PREFIXO[L[P[j][3][0]].t] || "Estação "}${esc(P[j][0])}</b><small>${P[j][3].map(i => esc(L[i].n)).join(" · ")}</small></div></div>`).join("");
  }
  return `<div class="det pt">
    <button class="voltar" data-voltar>← ${S.perto ? "pontos perto de você" : "todas as linhas"}</button>
    <h2>${estacao ? (PREFIXO[L[p[3][0]].t] || "Estação ") : ""}${esc(p[0])}</h2>
    <div class="meta" style="color:var(--mut);font-size:12.5px">${S.bairros && p._b >= 0 ? `<button class="lk" data-bai-ir="${p._b}">${esc(S.bairros[p._b].n)}</button> · ` : ""}${estacao ? tipoEst + " · " : ""}${p[3].length} linha${p[3].length>1?"s":""} passa${p[3].length>1?"m":""} aqui${p[4] === 1 ? " · estação BRT" : ""}</div>
    <div class="acoes"><button data-rde="${pi}">Sair daqui</button><button data-rpara="${pi}">Ir para cá</button></div>
    <div class="grade">${ls.map(i => `<span data-l="${i}" title="${esc(L[i].l)}">${selo(L[i])}</span>`).join("")}</div>
    ${integra}
    <div class="secao" style="padding-left:0;margin-top:12px">${estacao ? "Linhas" : "Destinos"}</div>
    ${ls.map(i => linhaHTML(L[i], i)).join("")}
  </div>`;
}

function htmlPerto(){
  const {lista} = S.perto;
  if (!lista.length) return `<div class="det"><button class="voltar" data-voltar>← todas as linhas</button><div class="vazio">Nenhum ponto de ônibus num raio de 600 m.</div></div>`;
  const L = S.rede.linhas, todas = new Set();
  lista.forEach(([pi]) => S.rede.pontos[pi][3].forEach(i => todas.add(i)));
  return `<div class="det"><button class="voltar" data-voltar>← todas as linhas</button>
    <h2 style="margin:0;font-family:Archivo,sans-serif;font-size:18px">Perto de você</h2>
    <div style="color:var(--mut);font-size:12.5px">${lista.length} pontos e ${todas.size} linhas a até 600 m</div></div>` +
    lista.map(([pi, m]) => { const p = S.rede.pontos[pi];
      return `<div class="lin" data-p="${pi}"><span class="num mono" style="background:#fff;font-size:12px">${Math.round(m)} m</span><div class="nome"><b>${esc(p[0])}</b><small>${p[3].slice(0,8).map(i => esc(L[i].n)).join(" · ")}${p[3].length>8?" …":""}</small></div></div>`; }).join("");
}

function kmDe(partes){
  let m = 0;
  for (const co of partes) for (let i = 1; i < co.length; i++) m += dist(co[i-1], co[i]);
  return (m/1000).toFixed(1).replace(".", ",");
}
function dist(a, b){
  const R = 6371000, toR = Math.PI/180;
  const dLat = (b[1]-a[1])*toR, dLon = (b[0]-a[0])*toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

// ---------- interação no painel ----------
$("#corpo").addEventListener("click", e => {
  const t = e.target;
  // folhas de filtro
  if (t.closest("[data-fechar-aba]")){ S.aba = null; S._qBairro = ""; mudouFiltro(); return; }
  const tps = t.closest("[data-tipos]");
  if (tps){ const v = tps.dataset.tipos;
    S.tipos = new Set(v === "todos" ? Object.keys(TIPOS) : v === "trilhos" ? ["metro","trem","vlt","barca"] : ["bus","brt"]); mudouFiltro(); return; }
  if (t.closest("[data-emps]")){ S.empresas.clear(); mudouFiltro(); return; }
  const z = t.closest("[data-zona]"); if (z){ escolherLugar(S.lugar && S.lugar.z === z.dataset.zona ? null : {z:z.dataset.zona}); return; }
  const bai = t.closest("[data-bai]"); if (bai){ escolherLugar(S.lugar && S.lugar.b === +bai.dataset.bai ? null : {b:+bai.dataset.bai}); return; }
  const bir = t.closest("[data-bai-ir], [data-bairro-busca]");
  if (bir){ const i = +(bir.dataset.baiIr ?? bir.dataset.bairroBusca); $("#busca").value = ""; S.linha = null; S.ponto = null; S.perto = null; escolherLugar({b:i}); return; }
  const vt = t.closest("[data-vista]"); if (vt){ S.vista = vt.dataset.vista; try { localStorage.setItem("onibusRioVista", S.vista); } catch(e){} render(); return; }
  if (t.closest("[data-tira-tudo]")){ S.lugar = null; S.empresas.clear(); S.tipos = new Set(Object.keys(TIPOS)); mudouFiltro(); return; }
  if (t.closest("[data-voltar]")){ voltar(); return; }
  const dirB = t.closest("[data-dir]"); if (dirB){ S.dir = +dirB.dataset.dir; aplicarEstado(); render(); enquadrarLinha(); return; }
  if (t.closest("[data-enq]")){ enquadrarLinha(); recolherNoCelular(); return; }
  if (t.closest("[data-comp]")){ compartilhar(); return; }
  const lb = t.closest("[data-l]"); if (lb){ selecionarLinha(+lb.dataset.l); return; }
  const pb = t.closest("[data-p]");
  if (pb){
    const pi = +pb.dataset.p;
    if (S.linha !== null){ // dentro da linha: só voa até o ponto
      document.querySelectorAll("ol.seq li.ativo").forEach(x => x.classList.remove("ativo"));
      pb.classList.add("ativo"); voarPonto(pi, 16); recolherNoCelular();
    } else selecionarPonto(pi, true);
  }
});

function voltar(){
  if (S.modo === "rota"){ Rota.sair(); return; }
  if (S.aba){ S.aba = null; mudouFiltro(); return; }
  if (S.linha !== null && S.ponto !== null){ S.linha = null; }
  else if (S.ponto !== null && S.perto){ S.ponto = null; }
  else { S.linha = null; S.ponto = null; S.perto = null; }
  aplicarEstado(); render(); atualizarEndereco();
}

function selecionarLinha(li, dir=0, enq=true){
  S.linha = li; S.dir = Math.min(dir, S.rede.linhas[li].d.length - 1);
  esconderEscolha(); aplicarEstado(); render(); atualizarEndereco(); expandir();
  if (enq) enquadrarLinha();
}
function selecionarPonto(pi, voar){
  S.ponto = pi; S.linha = null; esconderEscolha(); aplicarEstado(); render(); atualizarEndereco(); expandir();
  if (voar) voarPonto(pi, Math.max(map.getZoom(), 15.5));
}
function voarPonto(pi, z){
  const p = S.rede.pontos[pi];
  if (map.getSource("destaque")) map.getSource("destaque").setData({type:"FeatureCollection",
    features:[{type:"Feature", properties:{}, geometry:{type:"Point", coordinates:[p[2], p[1]]}}]});
  map.easeTo({center:[p[2], p[1]], zoom:z, padding:padMapa(), duration:700});
}
function padMapa(){
  if (deitado()){
    const w = document.body.classList.contains("semPainel") ? 0 : $("#painel").getBoundingClientRect().width;
    return {top:30, bottom:30, left:w + 30, right:60};
  }
  const topo = $("#barra").getBoundingClientRect().bottom;
  const fundo = innerHeight - $("#painel").getBoundingClientRect().top;
  return {top:topo + 20, bottom:fundo + 20, left:30, right:56};
}
function enquadrarLinha(){
  if (S.linha === null) return;
  const co = S.rede.linhas[S.linha]._coords.flat(2);
  if (!co.length) return;
  const b = co.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(co[0], co[0]));
  map.fitBounds(b, {padding:padMapa(), duration:800, maxZoom:15});
}

// ---------- estado -> mapa ----------
function aplicarEstado(){
  if (!map.getLayer || !map.getLayer("rede")) return;
  const L = S.rede.linhas;
  // filtros: tipo, companhia e bairro
  const tiposOn = ["literal", [...S.tipos]];
  const porLinha = (S.empresas.size || S._bset)
    ? ["in", ["get","li"], ["literal", L.map((l, i) => passa(l) ? i : -1).filter(i => i >= 0)]] : true;
  map.setFilter("rede", ["all", ["in", ["get","t"], tiposOn], porLinha]);
  const semBarca = ["all", ["in", ["get","t"], tiposOn], ["!=", ["get","t"], "barca"], porLinha];
  map.setFilter("trilhos", semBarca);
  map.setFilter("trilhos-casco", semBarca);
  map.setFilter("barcas", ["all", ["==", ["get","t"], "barca"], ativo("barca"), porLinha]);
  map.setFilter("trilhos-trem", ["all", ["==", ["get","t"], "trem"], ativo("trem"), porLinha]);
  const noBairro = S._bset ? ["in", ["get","b"], ["literal", [...S._bset]]] : true;
  const fEst = ["all", ["any", ...["metro","trem","vlt","barca"].map(k => ["all", ativo(k), ["==", ["get",k], 1]])], noBairro];
  map.setFilter("estacoes", fEst);
  if (map.getLayer("estacoes-rot")) map.setFilter("estacoes-rot", fEst);
  map.setFilter("pontos", noBairro);
  map.setLayoutProperty("pontos", "visibility", ["bus","brt","exec"].some(ativo) ? "visible" : "none");
  // bairros: contorno do escolhido; na folha de bairros, todos os contornos e nomes
  if (map.getLayer("bairro-sel")){
    map.setFilter("bairro-sel", S._bset ? ["in", ["get","i"], ["literal", [...S._bset]]] : ["==", ["get","i"], -1]);
    const mostrar = S.aba === "bairro" ? "visible" : "none";
    map.setLayoutProperty("bairros-linha", "visibility", mostrar);
    if (map.getLayer("bairros-rot")) map.setLayoutProperty("bairros-rot", "visibility", mostrar);
    map.setPaintProperty("bairros-fill", "fill-opacity", S._bset ? ["case", ["in", ["get","i"], ["literal", [...S._bset]]], 0.07, 0] : 0);
  }
  // linhas que passam pelo ponto escolhido ficam acesas
  let acesas = null;
  if (S.modo === "rota") acesas = [];
  else if (S.linha !== null) acesas = [S.linha];
  else if (S.ponto !== null) acesas = S.rede.pontos[S.ponto][3];
  else { const q = semAcento($("#busca").value.trim()); if (q) acesas = L.map((l,i)=>i).filter(i => L[i]._busca.includes(q)); }
  const opT = acesas && acesas.length < L.length
    ? ["case", ["in", ["get","li"], ["literal", acesas]], S.linha !== null ? 0 : 1, 0.12] : 1;
  map.setPaintProperty("trilhos", "line-opacity", opT);
  map.setPaintProperty("barcas", "line-opacity", opT);
  map.setPaintProperty("trilhos-trem", "line-opacity", acesas && acesas.length < L.length
    ? ["case", ["in", ["get","li"], ["literal", acesas]], S.linha !== null ? 0 : 0.8, 0.1] : 0.8);
  map.setPaintProperty("trilhos-casco", "line-opacity", acesas && acesas.length < L.length ? 0.4 : 0.9);
  if (acesas && acesas.length < L.length){
    map.setPaintProperty("rede", "line-opacity", ["case", ["in", ["get","li"], ["literal", acesas]], S.linha !== null ? 0 : 0.95, S.linha !== null ? 0.035 : 0.07]);
    map.setPaintProperty("rede", "line-width", ["case", ["in", ["get","li"], ["literal", acesas]],
      ["interpolate",["linear"],["zoom"],10,2,15,4.5], ["interpolate",["linear"],["zoom"],10,0.6,14,1.4]]);
  } else {
    map.setPaintProperty("rede", "line-opacity", 0.42);
    map.setPaintProperty("rede", "line-width", ["interpolate",["linear"],["zoom"],10,0.8,14,2,17,4]);
  }
  map.setPaintProperty("pontos", "circle-opacity", S.linha !== null ? 0.25 : 0.75);
  const estAcesas = S.modo === "rota" ? [] : S.linha !== null ? L[S.linha].d.flatMap(d => d.s) : S.ponto !== null ? [S.ponto] : null;
  const opE = estAcesas ? ["case", ["in", ["get","i"], ["literal", estAcesas]], 1, 0.3] : 1;
  map.setPaintProperty("estacoes", "circle-opacity", opE);
  map.setPaintProperty("estacoes", "circle-stroke-opacity", opE);
  // linha selecionada
  if (S.linha !== null){
    const l = L[S.linha];
    const fsel = {type:"FeatureCollection", features:l._coords.map((co, di) => ({type:"Feature",
      properties:{ativo: di === S.dir ? 1 : 0, cor:l._cor}, geometry:{type:"MultiLineString", coordinates:co}}))};
    map.getSource("sel").setData(fsel);
    map.getSource("selSetas").setData({type:"FeatureCollection", features:fsel.features.filter(f => f.properties.ativo)});
    const d = l.d[S.dir] || l.d[0];
    const fpts = {type:"FeatureCollection", features:d.s.map((pi, k) => { const p = S.rede.pontos[pi];
      return {type:"Feature", properties:{i:pi, nome:p[0], cor:l._cor, ponta:(k===0||k===d.s.length-1)?1:0},
        geometry:{type:"Point", coordinates:[p[2], p[1]]}}; })};
    map.getSource("selPontos").setData(fpts);
    map.getSource("selRotulos").setData(fpts);
  } else {
    for (const id of ["sel","selPontos","selSetas","selRotulos"]) map.getSource(id).setData(vazio());
  }
  if (S.ponto === null && S.linha === null && !S.perto) map.getSource("destaque").setData(vazio());
}

// ---------- clique no mapa ----------
map.on("click", e => {
  if (!S.rede || !map.getLayer("rede")) return;
  if (typeof Rota !== "undefined" && Rota.clique(e)) return;
  if (S.aba === "bairro" && map.getLayer("bairros-fill")){
    const f = map.queryRenderedFeatures(e.point, {layers:["bairros-fill"]});
    if (f.length){ escolherLugar({b:f[0].properties.i}); return; }
  }
  const r = 8, bb = [[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]];
  const camadasP = ["sel-pontos", "estacoes", "pontos"].filter(id => map.getLayer(id));
  const fp = map.queryRenderedFeatures(bb, {layers:camadasP});
  if (fp.length){
    const pi = fp[0].properties.i;
    if (S.linha !== null && fp[0].layer.id === "sel-pontos"){
      document.querySelectorAll("ol.seq li").forEach(x => x.classList.toggle("ativo", +x.dataset.p === pi));
      const li = document.querySelector(`ol.seq li[data-p="${pi}"]`); if (li) li.scrollIntoView({block:"center", behavior:"smooth"});
      voarPonto(pi, map.getZoom());
      return;
    }
    selecionarPonto(pi, false); voarPonto(pi, map.getZoom()); return;
  }
  const fl = map.queryRenderedFeatures(bb, {layers:["sel", "trilhos", "barcas", "rede"]});
  const vis = new Set();
  fl.forEach(f => {
    const li = f.layer.id === "sel" ? S.linha : f.properties.li;
    if (!ativo(S.rede.linhas[li].t)) return;
    vis.add(li);
  });
  const ls = [...vis];
  if (!ls.length){ if (S.linha !== null || S.ponto !== null){ /* clique no vazio: mantém */ } esconderEscolha(); return; }
  if (ls.length === 1){ selecionarLinha(ls[0], 0, S.linha !== ls[0]); return; }
  mostrarEscolha(e.point, ls);
});
map.on("mousemove", e => {
  if (!map.getLayer("rede")) return;
  const r = 6; const f = map.queryRenderedFeatures([[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]], {layers:["rede","trilhos","barcas","estacoes","pontos","sel-pontos"]});
  map.getCanvas().style.cursor = f.length ? "pointer" : "";
});
function mostrarEscolha(pt, ls){
  const L = S.rede.linhas, el = $("#escolha");
  ls.sort((a, b) => (TRILHO(L[b].t) - TRILHO(L[a].t)) || a - b);
  el.innerHTML = `<div class="secao" style="padding:4px 8px">${ls.length} linhas passam aqui</div>` + ls.map(i => linhaHTML(L[i], i)).join("");
  el.style.display = "block";
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.min(pt.x + 10, innerWidth - w - 10) + "px";
  el.style.top = Math.min(pt.y + 10, innerHeight - h - 10) + "px";
}
function esconderEscolha(){ $("#escolha").style.display = "none"; }
$("#escolha").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) selecionarLinha(+b.dataset.l); });
map.on("movestart", esconderEscolha);

// ---------- perto de mim ----------
$("#bPerto").addEventListener("click", () => {
  if (!navigator.geolocation){ alertaSuave("Seu navegador não informa a localização."); return; }
  $("#bPerto").classList.add("on");
  navigator.geolocation.getCurrentPosition(pos => {
    const eu = [pos.coords.longitude, pos.coords.latitude];
    const lista = S.rede.pontos.map((p, i) => [i, dist(eu, [p[2], p[1]])]).filter(x => x[1] <= 600).sort((a,b) => a[1]-b[1]).slice(0, 40);
    S.perto = {eu, lista}; S.linha = null; S.ponto = null;
    aplicarEstado(); render(); expandir();
    map.getSource("destaque").setData({type:"FeatureCollection", features:[{type:"Feature", properties:{}, geometry:{type:"Point", coordinates:eu}}]});
    map.easeTo({center:eu, zoom:16, padding:padMapa(), duration:900});
    $("#bPerto").classList.remove("on");
  }, err => { $("#bPerto").classList.remove("on"); alertaSuave("Não foi possível obter sua localização."); }, {enableHighAccuracy:true, timeout:12000});
});
function alertaSuave(msg){ $("#corpo").insertAdjacentHTML("afterbegin", `<div class="vazio" style="color:#ffcc33">${esc(msg)}</div>`); }

$("#bTudo").addEventListener("click", () => map.fitBounds(RIO, {padding:padMapa(), duration:900}));
// troca do mapa de fundo sem recarregar o estilo (as camadas de transporte ficam)
S.fundo = (() => { try { return localStorage.getItem("onibusRioFundo") || "escuro"; } catch(e){ return "escuro"; } })();
if (!FUNDOS[S.fundo]) S.fundo = "escuro";
function aplicarFundo(nome){
  if (!map.getLayer("f-ruas")) return;
  S.fundo = nome; try { localStorage.setItem("onibusRioFundo", nome); } catch(e){}
  for (const [k, f] of Object.entries(FUNDOS)) for (const id of f.camadas) map.setLayoutProperty(id, "visibility", "none");
  for (const id of FUNDOS[nome].camadas) map.setLayoutProperty(id, "visibility", "visible");
  const claro = FUNDOS[nome].claro;
  S.tema = claro ? "claro" : "escuro";
  document.documentElement.style.setProperty("--bg", claro ? "#e9ebee" : "#0b0d12");
  map.setPaintProperty("fundo", "background-color", claro ? "#e9ebee" : "#0b0d12");
  document.querySelectorAll("#menuFundo [data-fundo]").forEach(b => b.classList.toggle("on", b.dataset.fundo === nome));
  if (!map.getLayer("pontos")) return;
  map.setPaintProperty("pontos", "circle-color", claro ? "#1b2230" : "#ffffff");
  map.setPaintProperty("pontos", "circle-stroke-color", claro ? "#ffffff" : "#0b0d12");
  map.setPaintProperty("trilhos-casco", "line-color", claro ? "#ffffff" : "#0b0d12");
  map.setPaintProperty("estacoes", "circle-stroke-color", claro ? "#1b2230" : "#0b0d12");
  map.setPaintProperty("rede", "line-color", claro ? ["get","corEsc"] : ["get","cor"]);
  map.setPaintProperty("sel-pontos", "circle-color", ["case",["==",["get","ponta"],1],["get","cor"], claro ? "#ffffff" : "#0b0d12"]);
  for (const id of ["estacoes-rot", "sel-rotulos"]) if (map.getLayer(id)){
    map.setPaintProperty(id, "text-color", claro ? "#111" : "#fff");
    map.setPaintProperty(id, "text-halo-color", claro ? "#fff" : "#0b0d12");
  }
  map.setPaintProperty("sel-casco", "line-color", claro ? "#ffffff" : "#000000");
}
$("#bTema").addEventListener("click", e => { e.stopPropagation(); $("#menuFundo").classList.toggle("aberto"); });
$("#menuFundo").addEventListener("click", e => { const b = e.target.closest("[data-fundo]"); if (!b) return; aplicarFundo(b.dataset.fundo); $("#menuFundo").classList.remove("aberto"); });
document.addEventListener("click", e => { if (!e.target.closest("#menuFundo")) $("#menuFundo").classList.remove("aberto"); });

// ---------- gaveta no celular ----------
// ---------- gaveta (em pé) e painel lateral (deitado) ----------
const deitado = () => matchMedia("(orientation:landscape) and (max-height:600px)").matches;
function alturas(){
  const p = $("#painel"), cab = $("#cabSheet");
  const max = p.getBoundingClientRect().bottom - $("#barra").getBoundingClientRect().bottom - 10;
  return {baixo:Math.min(cab.scrollHeight + 4, max), meio:Math.round(Math.min(max, Math.max(260, innerHeight * 0.5))), cheio:Math.round(max)};
}
function snap(nome, semAnimar){
  const p = $("#painel");
  if (deitado()){ p.dataset.snap = "cheio"; delete document.body.dataset.snap; document.body.classList.remove("semPainel"); return; }
  p.dataset.snap = nome; document.body.dataset.snap = nome;
  if (semAnimar) p.classList.add("arrastando");
  document.documentElement.style.setProperty("--h", alturas()[nome] + "px");
  if (semAnimar) requestAnimationFrame(() => p.classList.remove("arrastando"));
}
function expandir(){ if (deitado()) document.body.classList.remove("semPainel"); else if ($("#painel").dataset.snap === "baixo") snap("meio"); }
function recolherNoCelular(){ if (!deitado()) snap("baixo"); }
// o cabeçalho muda de altura (pílulas de filtro): a gaveta baixa acompanha
new ResizeObserver(() => { if ($("#painel").dataset.snap === "baixo" && !deitado()) snap("baixo", true); }).observe($("#cabSheet"));
addEventListener("resize", () => snap(deitado() ? "cheio" : ($("#painel").dataset.snap || "baixo"), true));
// arrastar a alça / cabeçalho
(() => {
  const p = $("#painel"), cab = $("#cabSheet");
  let y0 = 0, h0 = 0, t0 = 0, arrastou = false, ativo = false;
  cab.addEventListener("pointerdown", e => {
    if (deitado() || e.target.closest("button:not(.alca), input, a")) return;
    ativo = true; arrastou = false; y0 = e.clientY; h0 = p.getBoundingClientRect().height; t0 = performance.now();
    cab.setPointerCapture(e.pointerId);
  });
  cab.addEventListener("pointermove", e => {
    if (!ativo) return;
    const dy = e.clientY - y0;
    if (Math.abs(dy) > 6) arrastou = true;
    if (!arrastou) return;
    const a = alturas();
    p.classList.add("arrastando");
    document.documentElement.style.setProperty("--h", Math.max(a.baixo * 0.8, Math.min(a.cheio, h0 - dy)) + "px");
  });
  const fim = e => {
    if (!ativo) return; ativo = false;
    p.classList.remove("arrastando");
    const a = alturas(), h = p.getBoundingClientRect().height;
    if (!arrastou){ // toque na alça: sobe um degrau (ou volta para baixo do topo)
      if (e.target.closest(".alca")) snap({baixo:"meio", meio:"cheio", cheio:"baixo"}[p.dataset.snap] || "meio");
      return;
    }
    const v = (e.clientY - y0) / Math.max(1, performance.now() - t0); // px/ms, positivo = descendo
    let alvo;
    if (v > 0.6) alvo = h > a.meio + 10 ? "meio" : "baixo";
    else if (v < -0.6) alvo = h < a.meio - 10 ? "meio" : "cheio";
    else alvo = Object.entries(a).sort((x, y) => Math.abs(x[1] - h) - Math.abs(y[1] - h))[0][0];
    snap(alvo);
  };
  cab.addEventListener("pointerup", fim);
  cab.addEventListener("pointercancel", fim);
})();
map.on("dragstart", () => { if (!deitado() && $("#painel").dataset.snap === "cheio") snap("meio"); });
// abas
function marcarAba(){
  const aba = S.modo === "rota" ? "rota" : S.perto ? "perto" : "linhas";
  document.querySelectorAll("#abas [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === aba || (b.dataset.tab === "mapa" && $("#menuFundo").classList.contains("aberto"))));
}
$('#abas [data-tab="linhas"]').addEventListener("click", () => {
  if (S.modo === "rota") Rota.sair();
  S.linha = null; S.ponto = null; S.perto = null; S.aba = null;
  montarFiltros(); aplicarEstado(); render(); atualizarEndereco();
  snap($("#painel").dataset.snap === "baixo" ? "meio" : $("#painel").dataset.snap);
});
$("#bRota").addEventListener("click", () => setTimeout(() => { if (!deitado()) snap("cheio"); }, 0));
$("#bPerto").addEventListener("click", () => marcarAba());
$("#bTema").addEventListener("click", () => setTimeout(marcarAba, 0));
document.addEventListener("click", () => setTimeout(marcarAba, 0));
// busca no topo
$("#busca").addEventListener("focus", () => { if (S.modo === "rota") Rota.sair(); if (!deitado()) snap("cheio"); });
$("#busca").addEventListener("input", () => $(".campoBusca").classList.toggle("tem", !!$("#busca").value));
$("#busca").addEventListener("keydown", e => { if (e.key === "Enter") $("#busca").blur(); });
$("#limpaBusca").addEventListener("click", () => { $("#busca").value = ""; $(".campoBusca").classList.remove("tem"); $("#busca").dispatchEvent(new Event("input")); });
// deitado: botão para esconder o painel e ver o mapa todo
$("#bPainel").addEventListener("click", () => document.body.classList.toggle("semPainel"));
// créditos do mapa: começam recolhidos no botão "i" (abertos cobririam o mapa no celular)
(() => {
  let tocou = false;
  const fechar = () => { const a = document.querySelector(".maplibregl-ctrl-attrib"); if (a && !tocou) a.classList.remove("maplibregl-compact-show"); };
  document.addEventListener("click", e => { if (e.target.closest(".maplibregl-ctrl-attrib")) tocou = true; }, true);
  map.on("idle", fechar); map.on("resize", () => setTimeout(fechar, 0)); setTimeout(fechar, 300);
})();
// o teclado do celular encolhe a tela: refaz as alturas
if (window.visualViewport) visualViewport.addEventListener("resize", () => { if (!deitado()) snap($("#painel").dataset.snap, true); });

// ---------- endereço compartilhável (#linha=474) ----------
function atualizarEndereco(){
  let h = "";
  if (S.linha !== null) h = "#linha=" + encodeURIComponent(S.rede.linhas[S.linha].n) + (S.dir ? "&sentido=2" : "");
  else if (S.ponto !== null) h = "#ponto=" + S.ponto;
  history.replaceState(null, "", location.pathname + location.search + h);
}
function lerEndereco(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("linha")){
    const n = semAcento(p.get("linha")); const li = S.rede.linhas.findIndex(l => semAcento(l.n) === n);
    if (li >= 0){ S.linha = li; S.dir = p.get("sentido") === "2" ? 1 : 0; map.once("idle", enquadrarLinha); }
  } else if (p.get("ponto") && S.rede.pontos[+p.get("ponto")]){
    S.ponto = +p.get("ponto"); map.once("idle", () => voarPonto(S.ponto, 16));
  }
}
function compartilhar(){
  atualizarEndereco();
  const l = S.rede.linhas[S.linha];
  const dados = {title:`Linha ${l.n} — ${l.l}`, url:location.href};
  if (navigator.share) navigator.share(dados).catch(() => {});
  else navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => alertaSuave("Link copiado."));
}
addEventListener("keydown", e => { if (e.key === "Escape") voltar(); if (e.key === "/" && document.activeElement !== $("#busca")){ e.preventDefault(); $("#busca").focus(); } });
