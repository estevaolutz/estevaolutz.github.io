<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one-screen app — painel de leitura à esquerda (embaixo no celular), mapa do "mar cor de vinho" ocupando o resto */
:root {
  --sea: #93b9cf; --sea-pol: #d4e4ee; --land: #d7dcae; --coast: #8a979a; --grat: rgba(40,70,90,.10);
  --river: #5b86a6; --mount: #7a6142; --label-anc: #76664d; --label-halo: rgba(246,245,238,.82); --sea-label: #2f5871; --border: #8a5f6a;
  --panel: #f6f7f6; --panel-2: #eceeed; --ink: #1c2227; --muted: #5b676d; --line: #d3dadb;
  --gold: #9a6a12; --halo: rgba(246,247,246,.92);
  --f-display: "GFS Didot", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #1d263d; --sea-pol: #1b2031; --land: #3f4433; --coast: #6d6378; --grat: rgba(220,200,240,.07);
  --river: #7194b4; --mount: #bea684; --label-anc: #b09e84; --label-halo: rgba(28,22,34,.8); --sea-label: #9fb0cc; --border: #b48d99;
  --panel: #17121c; --panel-2: #211a28; --ink: #ede6f0; --muted: #a79bb0; --line: #2f2738;
  --gold: #e2b04a; --halo: rgba(23,18,28,.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --sea: #1d263d; --sea-pol: #1b2031; --land: #3f4433; --coast: #6d6378; --grat: rgba(220,200,240,.07);
  --river: #7194b4; --mount: #bea684; --label-anc: #b09e84; --label-halo: rgba(28,22,34,.8); --sea-label: #9fb0cc; --border: #b48d99;
  --panel: #17121c; --panel-2: #211a28; --ink: #ede6f0; --muted: #a79bb0; --line: #2f2738;
  --gold: #e2b04a; --halo: rgba(23,18,28,.9); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(320px, 380px) 1fr; }
.panel { min-width: 0; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 20px 28px; }
.mapwrap { position: relative; min-width: 0; background: var(--sea); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }

.eyebrow { font-family: var(--f-display); letter-spacing: .18em; font-size: 12px; color: var(--gold); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font: 600 12px/1 var(--f-body); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--muted); opacity: .55; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
button:focus-visible, .myth:focus-visible, .stop:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.group h2 { font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin: 20px 0 6px; display: flex; align-items: center; gap: 8px; }
.group h2 i { width: 14px; height: 2px; background: var(--c); }
.myth { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0;
  border-top: 1px solid var(--line); padding: 10px 2px; color: var(--ink); cursor: pointer; font: inherit; }
.myth:hover .mt { color: var(--gold); }
.mt { font-family: var(--f-display); font-size: 18px; line-height: 1.2; }
.mc { font: 500 12px var(--f-mono); color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }
.mr { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.back { background: none; border: 0; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 0; }
.back:hover { color: var(--ink); }
.cyc { display: inline-flex; gap: 6px; align-items: center; font: 600 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.cyc i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.detail h1 { font-size: 30px; margin-top: 6px; }
.src { font-size: 12.5px; color: var(--muted); font-style: italic; }
.sum { margin: 12px 0 0; max-width: 65ch; }
.controls { position: sticky; top: -20px; z-index: 2; background: var(--panel); display: flex; align-items: center; gap: 8px;
  margin: 16px 0 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; }
.cbtn.play { background: var(--gold); border-color: var(--gold); color: var(--panel); width: 44px; height: 44px; }
.cbtn svg { width: 16px; height: 16px; fill: currentColor; }
.prog { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.stops { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.stop { position: relative; padding: 9px 0 9px 26px; cursor: pointer; border-radius: 6px; }
.stop::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.stop:first-child::before { top: 18px; } .stop:last-child::before { bottom: calc(100% - 18px); }
.stop::after { content: ""; position: absolute; left: 3px; top: 13px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--c); }
.stop.done::after { background: var(--c); }
.stop.cur::after { background: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 25%, transparent); }
.sn { font-weight: 600; line-height: 1.3; }
.stop.cur .sn { color: var(--gold); }
.sm { font-size: 12px; color: var(--muted); }
.st { display: none; margin-top: 6px; max-width: 60ch; }
.stop.cur .st { display: block; }
.gk { font-family: var(--f-display); font-weight: 400; color: var(--gold); }
.st p { margin: 0 0 8px; }
.st .mean { font-family: var(--f-display); font-size: 16px; line-height: 1.4; }
.st .today { font-size: 13.5px; color: var(--muted); }
.st .today b { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cert { font: 500 11px var(--f-mono); padding: 3px 7px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); }
.ref { font-size: 12px; color: var(--muted); font-style: italic; }
.legs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.legs span { display: inline-flex; align-items: center; gap: 6px; }
.legs i { width: 18px; height: 3px; border-radius: 2px; }
.co { font: 400 11px var(--f-mono); color: var(--muted); margin-top: 4px; display: none; }
.stop.cur .co { display: block; }

.legend { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; font: 500 11px var(--f-mono); color: var(--muted);
  background: var(--halo); padding: 6px 9px; border-radius: 6px; pointer-events: none; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 18px var(--f-body); cursor: pointer; }
.layers { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: grid; gap: 6px; padding: 6px;
  background: var(--halo); border: 1px solid var(--line); border-radius: 10px; }
.layers .seg { display: flex; gap: 2px; }
.layers .seg button { font: 600 12px/1 var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer; }
.layers .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.layers input { width: 100%; margin: 0; accent-color: var(--gold); }
.layers input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.srcnote { margin-top: 24px; font-size: 12px; color: var(--muted); max-width: 60ch; }
.zoom button.zall { font: 600 9.5px var(--f-mono); letter-spacing: .04em; }
.notice { position: absolute; left: 12px; bottom: 12px; right: 140px; font-size: 12.5px; color: var(--muted); background: var(--halo); padding: 8px 10px; border-radius: 6px; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
  .mapwrap { order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
  h1 { font-size: 28px; } .detail h1 { font-size: 25px; }
  .controls { top: -14px; }
}

/* Quiz: um por mito, dentro do painel de leitura */
:root { --ok: #2f7d4f; --ok-bg: #e3f1e8; --bad: #b0413e; --bad-bg: #f7e4e2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #7fcf9b; --ok-bg: #1d3326; --bad: #f0928c; --bad-bg: #3a1f22; } }
:root[data-theme="dark"] { --ok: #7fcf9b; --ok-bg: #1d3326; --bad: #f0928c; --bad-bg: #3a1f22; }
.qcta { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 12px 14px; text-align: left; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; }
.qcta:hover { border-color: var(--gold); }
.qcta:focus-visible, .qopt:focus-visible, .qbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.qcta .qg { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--gold); width: 28px; text-align: center; }
.qcta .qt { display: grid; gap: 1px; min-width: 0; }
.qcta .qt b { font-weight: 600; }
.qcta .qt span { font-size: 12.5px; color: var(--muted); }
.qcta .qa { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.mc .qs { color: var(--gold); }
.quiz h1 { font-size: 26px; margin-top: 6px; }
.qbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 16px 0 6px; }
.qbar i { height: 5px; border-radius: 3px; background: var(--line); }
.qbar i.cur { background: var(--gold); }
.qbar i.ok { background: var(--ok); }
.qbar i.bad { background: var(--bad); }
.qnum { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
.qq { font-family: var(--f-display); font-size: 22px; line-height: 1.25; margin: 14px 0 14px; text-wrap: balance; max-width: 34ch; }
.qopts { display: grid; gap: 8px; }
.qopt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; color: var(--ink); font: inherit; line-height: 1.35; }
.qopt:hover:not(:disabled) { border-color: var(--gold); background: var(--panel-2); }
.qopt .ql { font-family: var(--f-display); font-size: 17px; color: var(--gold); line-height: 1.2; text-align: center; }
.qopt:disabled { cursor: default; }
.qopt.ok { border-color: var(--ok); background: var(--ok-bg); }
.qopt.ok .ql { color: var(--ok); }
.qopt.bad { border-color: var(--bad); background: var(--bad-bg); }
.qopt.bad .ql { color: var(--bad); }
.qopt.dim { opacity: .5; }
.qfb { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--c, var(--gold)); background: var(--panel-2); border-radius: 0 8px 8px 0; }
.qfb.ok { --c: var(--ok); } .qfb.bad { --c: var(--bad); }
.qfb b { color: var(--c); font-weight: 600; }
.qfb p { margin: 4px 0 0; max-width: 60ch; }
.qnav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.qbtn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 600 14px var(--f-body); padding: 10px 16px; border-radius: 999px; cursor: pointer; }
.qbtn.pri { background: var(--gold); border-color: var(--gold); color: var(--panel); }
.qscore { font-family: var(--f-display); font-size: 64px; line-height: 1; margin: 18px 0 4px; font-variant-numeric: tabular-nums; }
.qscore small { font-size: 28px; color: var(--muted); }
.qverd { font-family: var(--f-display); font-size: 19px; color: var(--gold); margin: 0; }
.qbest { font-size: 13px; color: var(--muted); margin-top: 4px; }
.qrev { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 0; }
.qrev li { border-top: 1px solid var(--line); padding: 10px 0; font-size: 13.5px; }
.qrev li b { display: block; font-weight: 600; margin-bottom: 2px; }
.qrev .y { color: var(--bad); } .qrev .r { color: var(--ok); }
.qrev h2 { font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
const DATA = {"projeto": "Atlas da Mitologia Grega", "versao": "0.3 — histórias completas em todos os mitos", "nota": "Coordenadas de lugares míticos seguem identificações tradicionais antigas ou modernas (marcadas com 'tradicional'); são aproximadas. Fontes-base: Hesíodo (Teogonia), Homero, Apolodoro (Biblioteca), Apolônio de Rodes (Argonáuticas), Ovídio (Metamorfoses), Pausânias, tragediógrafos.", "ciclos": [{"id": "odisseia", "nome": "A Odisseia", "cor": "#3a9e8f"}, {"id": "origens", "nome": "Origens do Cosmos e dos Deuses", "cor": "#8b5cf6"}, {"id": "deuses", "nome": "Mitos dos Deuses Olímpicos", "cor": "#f59e0b"}, {"id": "herois", "nome": "Grandes Heróis", "cor": "#ef4444"}, {"id": "argonautas", "nome": "Ciclo dos Argonautas", "cor": "#0ea5e9"}, {"id": "tebano", "nome": "Ciclo Tebano", "cor": "#10b981"}, {"id": "troiano", "nome": "Ciclo Troiano", "cor": "#d97706"}, {"id": "metamorfoses", "nome": "Amores, Castigos e Metamorfoses", "cor": "#ec4899"}], "mitos": [{"id": "odisseia", "titulo": "A Odisseia", "ciclo": "odisseia", "fontes": ["Homero, Odisseia (Cantos IX–XIII)", "Ilíada", "Ciclo Épico (Cantos Cíprios)"], "resumo": "De Ítaca a Troia e o longo caminho de volta, em vinte paradas. A ida segue a Ilíada e o ciclo épico: Odisseu tenta fugir da guerra, desmascara Aquiles em Esciros e parte de Áulis. A volta segue os relatos do próprio Odisseu aos Feácios: dez anos de errância, perseguido pela ira de Poseidon, até chegar sozinho a Ítaca.", "trechos": {"ida": {"nome": "Ida · Ilíada e ciclo épico", "cor": "#d4952f"}, "volta": {"nome": "Volta · Odisseia", "cor": "#3a9e8f"}}, "paradas": [{"nome": "Ítaca", "moderno": "Ítaca, Grécia", "lat": 38.38, "lon": 20.7, "texto": "Odisseu é rei de uma ilha pequena e rochosa, onde vive com Penélope, o filho recém-nascido Telêmaco e o pai, Laertes. Quando os reis gregos são convocados para resgatar Helena, ele tenta escapar fingindo loucura: atrela um boi e um burro ao arado e semeia sal. Palamedes desmascara o truque ao colocar o bebê diante do arado, e Odisseu desvia. Parte com doze navios, segundo o Catálogo das Naus da Ilíada.", "grego": "Ἰθάκη", "ref": "Ilíada II · Cantos Cíprios", "tempo": "Partida", "certeza": "Tradição antiga", "sentido": "Ítaca é o começo e o fim de tudo. A Odisseia inteira é a história do retorno a esta ilha, o nóstos.", "hoje": "A ilha de Ítaca (Ithaki), no mar Jônico, carrega o nome antigo. A descrição de Homero nem sempre bate com ela: o poema diz que Ítaca é a mais a oeste das ilhas, e não é. Por isso há teorias que propõem Lefkada (Wilhelm Dörpfeld) ou a península de Paliki, em Cefalônia (Robert Bittlestone).", "trecho": "ida"}, {"nome": "Esciros", "moderno": "Skyros, Grécia", "lat": 38.88, "lon": 24.55, "texto": "Um oráculo diz que Troia não cairá sem Aquiles. Para salvá-lo da guerra, sua mãe, Tétis, o esconde vestido de moça entre as filhas do rei Licomedes, nesta ilha. Odisseu chega disfarçado de mercador e espalha presentes: joias, tecidos e, no meio deles, armas. Então faz soar uma trombeta de guerra. As moças fogem; Aquiles agarra a lança e o escudo, e se revela.", "grego": "Σκῦρος", "ref": "Apolodoro III · Estácio, Aquileida", "tempo": "Antes da guerra", "certeza": "Nome preservado", "sentido": "Antes de qualquer batalha, Odisseu já vence pela métis, a astúcia que define o personagem.", "hoje": "Ilha de Skyros, nas Espórades, Grécia. O nome se preserva desde a Antiguidade, e a tradição local liga a ilha também ao túmulo de Teseu.", "trecho": "ida", "via": [[20.4, 37.8], [21.2, 36.6], [22.6, 36], [23.5, 36.15], [24.3, 37.2], [24.95, 38], [24.95, 38.6]]}, {"nome": "Áulis", "moderno": "Avlida, Grécia", "lat": 38.42, "lon": 23.58, "texto": "Toda a frota grega se reúne neste porto da Beócia, diante da Eubeia. Os ventos não sopram, porque Ártemis está irada com Agamêmnon. O adivinho Calcas anuncia que a deusa exige o sacrifício de Ifigênia, filha do rei. Segundo a tradição, é Odisseu quem vai buscá-la em Micenas, com o falso pretexto de um casamento com Aquiles. Na Ilíada, ele lembra ainda o presságio da serpente que devorou nove pardais: nove anos de guerra, vitória no décimo.", "grego": "Αὐλίς", "ref": "Ilíada II 303–332 · Eurípides", "tempo": "Reunião da frota", "certeza": "Sítio arqueológico", "sentido": "O ponto de partida da expedição e o primeiro preço da guerra.", "hoje": "Perto da atual Avlida, junto a Calcis, no estreito de Euripo. Arqueólogos escavaram ali um templo de Ártemis com oferendas de vários séculos.", "trecho": "ida", "via": [[24.95, 38.4], [24.82, 37.95], [24.3, 37.85], [23.95, 38.2]]}, {"nome": "Lemnos", "moderno": "Limnos, Grécia", "lat": 39.9, "lon": 25.22, "texto": "Na viagem, o arqueiro Filoctetes, dono do arco de Héracles, é picado por uma serpente. A ferida não fecha e exala um cheiro insuportável. Por conselho de Odisseu, os gregos o abandonam sozinho em Lemnos. Dez anos depois, um oráculo revela que Troia só cairá com aquele arco, e é o próprio Odisseu quem volta para buscá-lo.", "grego": "Λῆμνος", "ref": "Ilíada II 721–725 · Sófocles, Filoctetes", "tempo": "A caminho", "certeza": "Nome preservado", "sentido": "O lado frio e calculista do herói: abandona um companheiro quando convém e o reconquista quando precisa.", "hoje": "Ilha de Lemnos (Limnos), no norte do Egeu, Grécia. Algumas versões situam a picada na pequena ilha vizinha de Crise, hoje desaparecida.", "trecho": "ida", "via": [[23.95, 38.2], [24.3, 37.85], [24.82, 37.95], [25.15, 38.6], [25.05, 39.45]]}, {"nome": "Tênedos", "moderno": "Bozcaada, Turquia", "lat": 39.83, "lon": 26.03, "texto": "A última ilha antes de Troia, a poucos quilômetros da costa. No ciclo épico, os gregos desembarcam aqui primeiro, e Aquiles mata o rei Tenes. No fim da guerra, é atrás de Tênedos que a frota se esconde, fingindo ter partido, enquanto o cavalo de madeira fica sozinho na praia.", "grego": "Τένεδος", "ref": "Cantos Cíprios · Eneida II", "tempo": "Última escala", "certeza": "Nome preservado", "sentido": "Base avançada no começo e esconderijo do golpe final.", "hoje": "Ilha de Bozcaada, província de Çanakkale, Turquia.", "trecho": "ida"}, {"nome": "Troia", "moderno": "Hisarlik, Turquia", "lat": 39.96, "lon": 26.24, "texto": "Dez anos de guerra. Odisseu vai na embaixada que pede Helena de volta, faz com Diomedes a missão noturna em que matam o espião Dólon e roubam os cavalos de Reso, e furta o Paládio, a estátua que protegia a cidade. É dele a ideia do cavalo de madeira: entra na barriga do cavalo com os melhores guerreiros, e Troia cai numa noite.", "grego": "Ἴλιος · Τροίη", "ref": "Ilíada · Odisseia IV e VIII", "tempo": "10 anos de cerco", "certeza": "Sítio arqueológico", "sentido": "Fim da ida e começo da volta. A vitória pela astúcia, e os sacrilégios do saque, despertam a ira dos deuses contra os gregos no caminho de casa.", "hoje": "Sítio arqueológico de Hisarlik, na Turquia, escavado desde Heinrich Schliemann em 1870 e Patrimônio Mundial da UNESCO. As camadas Troia VI e VIIa, por volta de 1250 a 1180 a.C., são as mais associadas à guerra.", "trecho": "ida"}, {"nome": "Ísmaro · Cícones", "moderno": "Maroneia, Grécia", "lat": 40.86, "lon": 25.52, "texto": "Primeira parada depois de Troia. Odisseu e seus homens saqueiam a cidade dos Cícones, aliados dos troianos. Ele manda partir logo, mas os marinheiros ficam comendo e bebendo na praia. Os Cícones voltam com reforços ao amanhecer, e cada navio perde seis homens. Aqui Odisseu ganha de Máron, um sacerdote de Apolo que ele poupou, um vinho tão forte que se bebia com vinte partes de água.", "grego": "Ἴσμαρος", "ref": "Odisseia IX 39–66", "tempo": "Dias", "certeza": "Identificação provável", "sentido": "O primeiro erro da tripulação. E o vinho de Máron será a arma contra o Ciclope.", "hoje": "Costa da Trácia, perto da antiga Maroneia, região de Ródope, Grécia. O monte Ismaros ainda guarda o nome.", "trecho": "volta", "via": [[25.95, 39.9], [25.38, 40.25], [25.35, 40.65]]}, {"nome": "Cabo Maleia", "moderno": "Cabo Maleas, Grécia", "lat": 36.42, "lon": 23.24, "texto": "Quase em casa, ao contornar a ponta sudeste do Peloponeso, uma tempestade do norte arrasta a frota para alto-mar. Por nove dias os navios são levados pelo vento, para longe de qualquer terra conhecida.", "grego": "Μάλεια", "ref": "Odisseia IX 80–81", "tempo": "9 dias de tempestade", "certeza": "Nome preservado", "sentido": "O momento em que a viagem sai do mapa real. A partir daqui, a geografia é a dos monstros e dos deuses.", "hoje": "Cabo Maleas, na Lacônia, Grécia, famoso entre os navegadores antigos pelos ventos traiçoeiros. Um ditado grego dizia: quem dobra o Maleia, esqueça a sua casa.", "trecho": "volta", "via": [[25.3, 40.3], [25.05, 39.4], [24.9, 38.55], [24.6, 37.5], [23.8, 36.6]]}, {"nome": "Lotófagos", "moderno": "Djerba, Tunísia", "lat": 33.8, "lon": 10.95, "texto": "No décimo dia chegam à terra dos comedores de lótus. Três homens mandados para explorar provam o fruto, doce como mel, e perdem toda vontade de voltar para casa. Odisseu os arrasta chorando até os navios e os amarra sob os bancos de remo.", "grego": "Λωτοφάγοι", "ref": "Odisseia IX 82–104", "tempo": "1 dia", "certeza": "Tradição antiga", "sentido": "A primeira tentação do esquecimento: desistir do retorno.", "hoje": "Tradicionalmente a ilha de Djerba, na Tunísia. Heródoto já situava os lotófagos na costa da Líbia, e o lótus costuma ser identificado com a jujuba.", "trecho": "volta", "via": [[22.5, 36], [19, 35], [15, 34], [12.2, 33.95]]}, {"nome": "Ciclope", "moderno": "Aci Trezza, Sicília", "lat": 37.55, "lon": 15.17, "texto": "Na terra dos Ciclopes, gigantes de um olho só, Odisseu entra com doze homens na caverna de Polifemo, filho de Poseidon. O gigante fecha a entrada com uma rocha e devora seis deles. Odisseu o embriaga com o vinho de Máron e diz que se chama Ninguém. Com uma estaca em brasa, fura o olho do Ciclope. Quando os vizinhos perguntam quem o ataca, Polifemo grita: Ninguém! Os gregos fogem presos à barriga dos carneiros. Já no mar, Odisseu revela o nome verdadeiro por orgulho, e Polifemo pede ao pai que o castigue.", "grego": "Πολύφημος", "ref": "Odisseia IX 105–566", "tempo": "Dias", "certeza": "Tradição antiga", "sentido": "O episódio que causa toda a odisseia: a ira de Poseidon, que perseguirá Odisseu até o fim.", "hoje": "A tradição antiga põe os Ciclopes na Sicília, junto ao Etna. Em Aci Trezza, perto de Catânia, os Faraglioni são chamados de Rochas dos Ciclopes: seriam as pedras que Polifemo atirou contra o navio. Outras hipóteses: Favignana e o Monte Érice, no oeste da Sicília (Ernle Bradford), ou a região de Nápoles.", "trecho": "volta", "via": [[12.5, 34.5], [14.5, 35.6], [15.4, 36.6], [15.48, 37.15]]}, {"nome": "Eólia · Éolo", "moderno": "Lipari, Ilhas Eólias", "lat": 38.5, "lon": 14.95, "texto": "Éolo, guardião dos ventos, vive numa ilha flutuante cercada por uma muralha de bronze. Hospeda Odisseu por um mês e lhe dá um odre de couro com todos os ventos presos, deixando solto só o Zéfiro, que sopra rumo a casa. Em nove dias eles avistam Ítaca. Odisseu adormece; os marinheiros, achando que o odre guarda ouro, o abrem. Os ventos escapam e jogam os navios de volta à Eólia. Éolo os expulsa: quem é tão odiado pelos deuses não merece ajuda.", "grego": "Αἰολίη", "ref": "Odisseia X 1–79", "tempo": "1 mês", "certeza": "Tradição antiga", "sentido": "A casa à vista e perdida por desconfiança. No mapa, a linha que sai daqui faz esse desvio até perto de Ítaca e volta.", "hoje": "As Ilhas Eólias, ao norte da Sicília, especialmente Lipari ou Stromboli. O nome do arquipélago vem do próprio Éolo.", "trecho": "volta", "via": [[15.42, 37.85], [15.58, 38.1], [15.655, 38.24], [15.6, 38.37], [15.25, 38.47]]}, {"nome": "Lestrigões", "moderno": "Bonifácio, Córsega", "lat": 41.38, "lon": 9.17, "texto": "Depois de seis dias remando, chegam a Telépilo, cidade com um porto fechado por penhascos altos. Onze navios entram no porto; Odisseu amarra o seu do lado de fora. Os Lestrigões são gigantes canibais: atiram rochas do alto, despedaçam os navios e arpoam os homens como peixes. Só o navio de Odisseu escapa.", "grego": "Λαιστρυγόνες", "ref": "Odisseia X 80–132", "tempo": "6 dias de remo", "certeza": "Hipótese moderna", "sentido": "A maior perda da viagem: de doze navios, resta um.", "hoje": "Bonifácio, no sul da Córsega, cujo porto estreito entre falésias lembra a cena homérica. Os romanos preferiam situar os Lestrigões em Fórmia, na costa do Lácio.", "trecho": "volta", "via": [[15.25, 38.47], [15.6, 38.37], [15.655, 38.24], [15.58, 38.1], [16.3, 37.72], [18.8, 37.95], [20.25, 38.22], [18.8, 38.08], [16.4, 37.78], [15.58, 38.1], [15.655, 38.24], [15.6, 38.37], [15, 38.65], [13.4, 39.5], [11, 40.6], [9.62, 41.3]]}, {"nome": "Eeia · Circe", "moderno": "Monte Circeo, Itália", "lat": 41.22, "lon": 13.05, "texto": "Metade da tripulação explora a ilha e encontra um palácio cercado de lobos e leões mansos. A feiticeira Circe oferece uma bebida aos homens e os transforma em porcos. Só Euríloco escapa e avisa Odisseu. No caminho, Hermes dá ao herói a erva móli, que o protege do feitiço. Circe não consegue transformá-lo, devolve a forma humana aos homens e os acolhe. Ficam um ano. Antes da partida, ela manda Odisseu ao reino dos mortos para ouvir o adivinho Tirésias.", "grego": "Αἰαίη · Κίρκη", "ref": "Odisseia X 133–574", "tempo": "1 ano", "certeza": "Tradição antiga", "sentido": "A ameaça que vira guia: é Circe quem ensina como passar pelas Sereias e por Cila e Caríbdis.", "hoje": "Monte Circeo, no Lácio, Itália: um promontório que, visto do mar, parece uma ilha. Os romanos já o associavam a Circe.", "trecho": "volta", "via": [[9.62, 41.25], [11, 41], [12.5, 41.08]]}, {"nome": "Mundo dos Mortos", "moderno": "Lago Averno, Itália", "lat": 40.83, "lon": 14.06, "texto": "Nos confins do mundo, onde corre o rio Oceano, Odisseu cava uma vala e derrama sangue de carneiros. As almas se aproximam para beber. Tirésias anuncia que ele voltará para casa sozinho, num navio alheio, e o adverte a não tocar no gado do Sol. Odisseu reencontra a mãe, Anticleia, que morreu de saudade dele, e fala com Agamêmnon e Aquiles. Ájax, ressentido, se recusa a responder.", "grego": "Νέκυια", "ref": "Odisseia XI", "tempo": "Uma noite", "certeza": "Hipótese moderna", "sentido": "A descida ao mundo dos mortos, a prova máxima do herói. Ele sai sabendo o que o espera.", "hoje": "Homero situa a entrada no extremo oeste, além do Oceano. Os antigos a localizavam no Lago Averno, cratera vulcânica perto de Cumas e Pozzuoli, na Campânia, a mesma entrada usada por Eneias na Eneida.", "trecho": "volta", "via": [[13.3, 41.12], [13.75, 41], [14, 40.74]]}, {"nome": "Sereias", "moderno": "Li Galli, Itália", "lat": 40.56, "lon": 14.43, "texto": "De volta a Eeia e seguindo o conselho de Circe, Odisseu tapa com cera os ouvidos dos remadores e se faz amarrar ao mastro, para ouvir o canto sem morrer. As Sereias prometem a ele o conhecimento de tudo o que acontece no mundo. Odisseu implora para ser solto; os homens apertam as cordas e remam até o canto sumir. Em volta da ilha delas apodrecem ossos de marinheiros.", "grego": "Σειρῆνες", "ref": "Odisseia XII 154–200", "tempo": "Uma passagem", "certeza": "Tradição antiga", "sentido": "A tentação do saber. Odisseu é o único que ouve o canto e sobrevive.", "hoje": "As ilhotas Li Galli, também chamadas Sirenuse, na Costa Amalfitana, diante de Positano, Itália. A península de Sorrento tinha um santuário antigo dedicado às Sereias.", "trecho": "volta", "via": [[14, 40.74], [13.6, 41.05], [13.12, 41.14], [13.65, 40.95], [14.05, 40.65], [14.25, 40.5]]}, {"nome": "Cila e Caríbdis", "moderno": "Estreito de Messina", "lat": 38.24, "lon": 15.66, "texto": "Um estreito entre dois monstros. De um lado, num penhasco, Cila: seis cabeças em pescoços compridos, cada boca com três fileiras de dentes. Do outro, Caríbdis, que três vezes ao dia engole o mar e o devolve num redemoinho. Circe aconselha passar rente a Cila: melhor perder seis homens do que o navio. E assim acontece. Mais tarde, náufrago, Odisseu é arrastado de volta até Caríbdis e se salva agarrado a uma figueira na rocha, até o redemoinho devolver os destroços do barco.", "grego": "Σκύλλα · Χάρυβδις", "ref": "Odisseia XII 201–259 e 426–446", "tempo": "Uma passagem", "certeza": "Identificação provável", "sentido": "A escolha entre dois males, que virou expressão: estar entre Cila e Caríbdis.", "hoje": "Estreito de Messina, entre a Sicília e a Calábria. A rocha de Scilla fica do lado calabrês; os redemoinhos perto do Capo Peloro, na Sicília, são identificados com Caríbdis desde a Antiguidade.", "trecho": "volta", "via": [[14.8, 40.3], [15.2, 39.6], [15.5, 38.7], [15.6, 38.37]]}, {"nome": "Trinácria", "moderno": "Sicília", "lat": 36.76, "lon": 15.08, "texto": "A ilha onde pastam as vacas sagradas de Hélio, o Sol. Odisseu queria passar ao largo, mas a tripulação exausta insiste em desembarcar. Ventos contrários os prendem ali por um mês. Sem comida, enquanto Odisseu dorme, Euríloco convence os homens a sacrificar as vacas. Hélio exige vingança: assim que o navio zarpa, Zeus o parte com um raio. Todos morrem, menos Odisseu.", "grego": "Θρινακίη", "ref": "Odisseia XII 260–419", "tempo": "1 mês", "certeza": "Tradição antiga", "sentido": "O fim da tripulação. A profecia de Tirésias se cumpre.", "hoje": "A Sicília, chamada Trinacria pelos antigos, a ilha dos três cabos, cujo símbolo até hoje é a triskelion. A tradição situava os rebanhos de Hélio perto de Milazzo; o marcador está no sudeste, junto ao Cabo Passero.", "trecho": "volta", "via": [[15.58, 38.1], [15.42, 37.8], [15.48, 37.15], [15.32, 36.72]]}, {"nome": "Ogígia · Calipso", "moderno": "Gozo, Malta", "lat": 36.06, "lon": 14.25, "texto": "Depois de passar de novo por Caríbdis e de nove dias à deriva, Odisseu chega à ilha da ninfa Calipso, uma gruta cercada de vinhas e fontes. Ela o ama e o retém por sete anos, oferecendo a imortalidade se ele ficar. Odisseu passa os dias chorando na praia, olhando o mar. Atena intercede, e Zeus manda Hermes ordenar sua libertação. Calipso o ajuda a construir uma jangada.", "grego": "Ὠγυγίη · Καλυψώ", "ref": "Odisseia V e VII 244–266", "tempo": "7 anos", "certeza": "Hipótese moderna", "sentido": "A imortalidade recusada. Odisseu escolhe a vida humana, Penélope e a morte.", "hoje": "A tradição maltesa identifica Ogígia com Gozo, onde uma gruta sobre a baía de Ramla é chamada de Gruta de Calipso. Outras hipóteses vão do mar Jônico à ilha de Perejil, perto de Gibraltar.", "trecho": "volta", "via": [[15.32, 36.72], [15.48, 37.15], [15.42, 37.8], [15.6, 38.18], [15.42, 37.8], [15.48, 37.15], [15, 36.4], [14.45, 36]]}, {"nome": "Esquéria · Feácios", "moderno": "Corfu, Grécia", "lat": 39.67, "lon": 19.72, "texto": "Poseidon desfaz a jangada numa tempestade, e Odisseu nada até a terra dos Feácios. A princesa Nausícaa o encontra na praia e o leva ao palácio do rei Alcínoo. Num banquete, um aedo canta a queda de Troia e Odisseu chora. Então revela quem é e narra toda a viagem: os Cantos IX a XII, com Ciclope, Circe, Sereias e Cila, são esse relato em primeira pessoa. Os Feácios, navegadores mágicos, o levam para casa dormindo. Na volta, Poseidon transforma o navio deles em pedra.", "grego": "Σχερίη", "ref": "Odisseia VI–XIII", "tempo": "Dias", "certeza": "Identificação provável", "sentido": "O lugar onde a história é contada. O herói vira narrador de si mesmo.", "hoje": "Corfu (Kérkyra), identificação que vem da Antiguidade. Os moradores apontam um rochedo diante de Palaiokastritsa, ou a ilhota de Pontikonisi, como o navio petrificado.", "trecho": "volta", "via": [[15, 36.3], [17.5, 37.5], [19.2, 38.8], [19.5, 39.5]]}, {"nome": "Ítaca · Retorno", "moderno": "Ítaca, Grécia", "lat": 38.38, "lon": 20.7, "texto": "Odisseu acorda numa praia que não reconhece, a baía de Fórcis. Atena o disfarça de mendigo velho. Ele se abriga com o porqueiro Eumeu, reencontra Telêmaco e entra no próprio palácio, tomado por mais de cem pretendentes que disputam Penélope e devoram seus bens. Só o velho cão Argos o reconhece, e morre. Penélope propõe uma prova: casará com quem armar o arco de Odisseu e fizer a flecha atravessar doze machados. Só o mendigo consegue. Ele mata os pretendentes e se revela a Penélope pelo segredo da cama, construída sobre um tronco de oliveira.", "grego": "Ἰθάκη", "ref": "Odisseia XIII–XXIV", "tempo": "20 anos longe", "certeza": "Tradição antiga", "sentido": "O fim do nóstos: vinte anos depois da partida, dez de guerra e dez de viagem.", "hoje": "Ilha de Ítaca. A baía de Vathy é tradicionalmente a de Fórcis, e a gruta de Marmarospilia é apontada como a gruta das Ninfas onde Odisseu escondeu os presentes dos Feácios. Veja as teorias de Lefkada e Paliki na parada 1.", "trecho": "volta", "via": [[19.85, 39.3], [20.3, 38.9], [20.47, 38.55]]}]}, {"id": "titanomaquia", "titulo": "Nascimento de Zeus e Titanomaquia", "ciclo": "origens", "fontes": ["Hesíodo, Teogonia", "Apolodoro I.1–2"], "resumo": "No princípio havia o Caos; dele surgiram Gaia, a Terra, e depois Urano, o Céu. Urano prendia os filhos no ventre de Gaia, até que o caçula, Cronos, o castrou com uma foice de diamante e tomou o poder. Mas uma profecia anunciou que também Cronos seria destronado por um filho, e ele passou a engolir cada criança que Reia paria: Héstia, Deméter, Hera, Hades e Poseidon. Esta é a história de como o sexto filho escapou, cresceu escondido em Creta, libertou os irmãos e travou contra os Titãs a guerra de dez anos que deu o mundo aos Olímpicos.", "paradas": [{"nome": "Caverna de Dicte", "moderno": "Psychro, Creta", "lat": 35.162, "lon": 25.445, "texto": "Grávida pela sexta vez e cansada de ver os filhos desaparecerem na garganta do marido, Reia pede ajuda aos próprios pais, Gaia e Urano. Eles a mandam para Creta. Ali, numa caverna da montanha, ela dá à luz Zeus em segredo e o entrega a Gaia para que o esconda.\n\nDe volta à corte de Cronos, Reia enrola uma pedra em cueiros e a oferece ao marido como se fosse o recém-nascido. Cronos a engole inteira, sem desconfiar. A pedra no estômago do pai será, anos depois, a prova de que o truque funcionou.", "grego": "Δίκτη", "ref": "Hesíodo, Teogonia 453–491", "tempo": "O nascimento", "certeza": "Sítio arqueológico", "sentido": "O primeiro grande ato de astúcia da mitologia é de uma mãe. O mundo dos deuses começa com um engano que salva uma vida.", "hoje": "A caverna de Psychro, no planalto de Lassithi, é identificada desde o século XIX com a Caverna Dicteia. Escavações revelaram milhares de oferendas votivas, do período minoico ao arcaico. É aberta à visitação."}, {"nome": "Monte Ida (caverna Idaia)", "moderno": "Creta", "lat": 35.205, "lon": 24.84, "texto": "Para que o choro do bebê não chegue aos ouvidos de Cronos, os Curetes, jovens guerreiros cretenses, dançam diante da caverna batendo lanças contra escudos de bronze. Zeus é amamentado pela cabra Amalteia (em algumas versões, uma ninfa com esse nome) e alimentado com o mel das abelhas da montanha.\n\nConta-se que, já adulto, Zeus quebrou um dos chifres da cabra e o deu às ninfas que o criaram: dele brotava toda comida que se desejasse. É a Cornucópia, o chifre da abundância. Com a pele de Amalteia, Zeus teria feito a égide, o escudo que depois emprestaria a Atena.", "grego": "Ἴδη", "ref": "Apolodoro I.1.6–7 · Calímaco, Hino a Zeus", "tempo": "A infância escondida", "certeza": "Sítio arqueológico", "sentido": "A dança armada dos Curetes era lembrada em rituais cretenses reais. O mito explica um culto e dá ao deus supremo uma infância frágil, protegida por outros.", "hoje": "A caverna Idaia fica a cerca de 1.500 m de altitude no monte Psiloritis, o mais alto de Creta. Ali foram achados escudos de bronze votivos do século VIII a.C., que ecoam o próprio mito dos Curetes."}, {"nome": "Monte Ótris", "moderno": "Tessália", "lat": 39.05, "lon": 22.62, "texto": "Adulto, Zeus volta para enfrentar o pai. Com a ajuda de Métis, a deusa da prudência, faz Cronos beber uma droga que o obriga a vomitar tudo o que engoliu: primeiro a pedra, depois Poseidon, Hades, Hera, Deméter e Héstia, já crescidos.\n\nComeça então a Titanomaquia. Os Titãs, liderados por Cronos e com Atlas como grande guerreiro, ocupam o monte Ótris, na Tessália. Os deuses jovens se instalam no Olimpo, do outro lado da planície. Por dez anos nenhum dos dois lados consegue vencer. Alguns Titãs, como Têmis, e o jovem Prometeu passam para o lado de Zeus.", "grego": "Ὄθρυς", "ref": "Hesíodo, Teogonia 492–506, 629–640", "tempo": "Dez anos de guerra", "certeza": "Montanha real", "sentido": "A geografia do mito é literal: duas montanhas que se encaram sobre a planície da Tessália viram dois exércitos de deuses.", "hoje": "O monte Óthrys (1.726 m) fica no sul da Tessália, de frente para o Olimpo do outro lado da planície de Larissa. É uma área de florestas e pastoreio, pouco visitada."}, {"nome": "Monte Olimpo", "moderno": "Tessália/Macedônia", "lat": 40.085, "lon": 22.358, "texto": "Gaia revela a Zeus o caminho da vitória: libertar os prisioneiros de Urano. Ele desce ao Tártaro e solta os três Ciclopes e os três Hecatônquiros, gigantes de cem braços e cinquenta cabeças. Agradecidos, os Ciclopes forjam o raio e o trovão para Zeus, o tridente para Poseidon e o elmo da invisibilidade para Hades.\n\nA batalha final é descrita por Hesíodo como um cataclismo: a terra ferve, o mar transborda, o céu treme. Zeus lança raios sem parar, enquanto os Hecatônquiros arremessam trezentas rochas de uma só vez. Os Titãs são enterrados sob as pedras e lançados ao Tártaro, tão fundo que uma bigorna levaria nove dias para chegar lá. Os Hecatônquiros ficam de guardas. Atlas recebe um castigo próprio: sustentar o céu nos ombros, no extremo ocidente. Os três irmãos então tiram a sorte: Zeus fica com o céu, Poseidon com o mar, Hades com o mundo subterrâneo.", "grego": "Ὄλυμπος", "ref": "Hesíodo, Teogonia 617–735", "tempo": "A vitória", "certeza": "Montanha real", "sentido": "A ordem olímpica nasce de uma aliança com as forças primitivas que o pai e o avô haviam acorrentado. Zeus vence porque liberta.", "hoje": "O monte Olimpo (2.917 m, pico Mytikas) é o mais alto da Grécia, na divisa entre Tessália e Macedônia. É parque nacional desde 1938, com trilhas a partir de Litóchoro."}, {"nome": "Delfos (Ônfalo)", "moderno": "Fócida", "lat": 38.482, "lon": 22.501, "texto": "Terminada a guerra, Zeus recolhe a pedra que Cronos vomitou, a mesma que o substituiu no berço, e a fixa em Pito, nos vales do Parnaso, como memória e sinal para os mortais.\n\nOutra tradição explica por que Delfos seria o centro do mundo: Zeus soltou duas águias, uma de cada ponta da Terra, e elas se encontraram exatamente ali. A pedra passou a ser o Ônfalo, o “umbigo” do mundo, e o local se tornou o oráculo mais importante da Grécia.", "grego": "Ὀμφαλός", "ref": "Hesíodo, Teogonia 497–500 · Pausânias X.16.3", "tempo": "Depois da guerra", "certeza": "Sítio arqueológico", "sentido": "O objeto que salvou Zeus vira o centro geográfico e religioso do mundo grego. Origem e destino da história se encontram numa pedra.", "hoje": "Delfos é Patrimônio Mundial da UNESCO. No museu do sítio há um ônfalo de mármore coberto por uma rede esculpida (agrenon), cópia de época romana ou helenística do original."}]}, {"id": "gigantomaquia", "titulo": "Gigantomaquia e Tifão", "ciclo": "origens", "fontes": ["Apolodoro I.6", "Píndaro"], "resumo": "Furiosa porque seus filhos Titãs foram trancados no Tártaro, Gaia gera uma nova raça, os Gigantes, nascidos do sangue de Urano que caiu sobre a terra. Um oráculo diz que os deuses só os vencerão com a ajuda de um mortal, e Zeus convoca seu filho Héracles. Vencidos os Gigantes, Gaia se une ao Tártaro e dá à luz seu último e mais terrível filho, Tifão, o monstro que por pouco não derruba o próprio Zeus.", "paradas": [{"nome": "Flegra", "moderno": "Península de Cassandra (Palene)", "lat": 40.05, "lon": 23.4, "texto": "Os Gigantes surgem armados e vestidos de bronze, com cabelos longos e, em muitas versões, pernas em forma de serpente. Liderados por Porfírion e Alcioneu, atacam o céu atirando rochas e troncos em chamas e empilhando montanhas para alcançar o Olimpo.\n\nGaia procura uma erva mágica que tornaria seus filhos imortais até para a mão humana, mas Zeus proíbe a Aurora, a Lua e o Sol de brilharem e colhe a erva antes dela. Na batalha em Flegra, cada deus enfrenta seu adversário: Atena esmaga Encélado sob a ilha da Sicília, Poseidon arranca um pedaço de Cós e o lança sobre Polibotes, Dioniso derruba Êurito com o tirso. Mas quem dá o golpe final é sempre Héracles, com suas flechas. Alcioneu, imortal enquanto pisa sua terra natal, só morre quando Héracles o arrasta para fora dela.", "grego": "Φλέγρα", "ref": "Apolodoro I.6.1–2 · Píndaro, Nemeia I", "tempo": "A revolta da Terra", "certeza": "Tradicional", "sentido": "A batalha preferida dos escultores gregos: está no friso do Altar de Pérgamo e na decoração do Partenon. Simbolizava a vitória da civilização sobre a barbárie.", "hoje": "Flegra era o nome antigo da península de Palene, hoje Kassandra, na Calcídica. Outra tradição põe Flegra nos Campos Flégreos, a área vulcânica perto de Nápoles. Em ambas, terrenos de fumaça e calor explicavam o mito."}, {"nome": "Caverna Coriciana", "moderno": "Cilícia, Turquia", "lat": 36.455, "lon": 34.105, "texto": "Tifão é o maior de todos os filhos de Gaia: mais alto que as montanhas, a cabeça tocando as estrelas, os braços estendidos de um extremo ao outro do mundo. Dos ombros saem cem cabeças de serpente; dos olhos, fogo. Quando ataca o Olimpo, os deuses fogem apavorados para o Egito e se disfarçam de animais. Só Zeus e Atena ficam.\n\nNo combate corpo a corpo, Tifão enlaça Zeus com seus anéis, arranca-lhe os tendões das mãos e dos pés com a foice e o leva preso para esta caverna, na Cilícia, deixando os tendões sob a guarda da dragoa Delfine. Hermes e Pã recuperam os tendões em segredo e os recolocam no deus. Zeus volta ao céu num carro de cavalos alados e retoma a perseguição.", "grego": "Κωρύκιον ἄντρον", "ref": "Apolodoro I.6.3 · Hesíodo, Teogonia 820–868", "tempo": "O último monstro", "certeza": "Sítio identificado", "sentido": "O único momento em que Zeus é derrotado. O rei dos deuses depende de dois ajudantes improváveis para continuar existindo.", "hoje": "As cavernas Cennet ve Cehennem (“Céu e Inferno”), perto de Silifke, na Turquia, são grandes dolinas de calcário identificadas com a caverna Coriciana. Há uma capela bizantina dentro da maior delas."}, {"nome": "Monte Etna", "moderno": "Sicília", "lat": 37.751, "lon": 14.993, "texto": "A perseguição atravessa o mundo. Tifão arremessa montanhas inteiras contra Zeus no monte Hemo, na Trácia, e o sangue que escorre dele dá nome à montanha (haima, sangue). As Moiras o enganam dando-lhe frutos que o enfraquecem em vez de fortalecê-lo.\n\nPor fim, quando Tifão tenta atravessar o mar da Sicília, Zeus ergue o monte Etna e o lança sobre ele. O monstro fica preso sob a montanha, e as erupções do vulcão seriam seu hálito de fogo e seus movimentos tentando se soltar. De Tifão nasceriam também os ventos violentos e irregulares, os tufões.", "grego": "Αἴτνη", "ref": "Apolodoro I.6.3 · Píndaro, Pítica I 15–28 · Ésquilo, Prometeu 351–372", "tempo": "O sepultamento", "certeza": "Vulcão real", "sentido": "A explicação grega para o vulcanismo: a força bruta da Terra não foi destruída, só contida. Ela ainda ruge debaixo da montanha.", "hoje": "O Etna (cerca de 3.350 m) é o vulcão ativo mais alto da Europa, com erupções frequentes. É Patrimônio Mundial da UNESCO desde 2013."}]}, {"id": "prometeu", "titulo": "Prometeu, Pandora e o Dilúvio", "ciclo": "origens", "fontes": ["Hesíodo", "Ésquilo, Prometeu Acorrentado", "Ovídio I"], "resumo": "Prometeu, filho do Titã Jápeto, havia lutado ao lado de Zeus. Mas seu afeto era pelos humanos, a quem segundo uma tradição ele próprio modelou do barro. Por eles, engana Zeus duas vezes: na divisão do sacrifício e no roubo do fogo. O castigo cai sobre os dois lados: Prometeu é acorrentado no fim do mundo, e os homens recebem Pandora. Quando a humanidade se corrompe de vez, Zeus manda o dilúvio, e só um casal sobrevive para recomeçar.", "paradas": [{"nome": "Mecone", "moderno": "Sícion, Peloponeso", "lat": 37.98, "lon": 22.71, "texto": "Em Mecone, deuses e homens se reúnem para decidir o que caberia a cada um nos sacrifícios. Prometeu abate um grande boi e o divide em duas porções. Numa, esconde a carne e as vísceras gordas dentro do estômago do animal, uma aparência pobre. Na outra, embrulha os ossos limpos numa camada brilhante de gordura.\n\nZeus escolhe a porção bonita e descobre os ossos. Desde então, nos sacrifícios gregos, os homens queimam os ossos para os deuses e comem a carne. Furioso, Zeus tira dos humanos o fogo. Prometeu sobe ao céu, acende um ramo de funcho (cujo miolo queima devagar) no fogo divino e o traz escondido de volta à Terra.", "grego": "Μηκώνη", "ref": "Hesíodo, Teogonia 535–569 · Trabalhos e Dias 47–58", "tempo": "O engano e o roubo", "certeza": "Tradicional", "sentido": "O mito explica um costume real do sacrifício grego e estabelece a separação definitiva entre homens e deuses, que antes comiam juntos.", "hoje": "Mecone era um nome antigo de Sícion, perto do golfo de Corinto. As ruínas de Sícion, com teatro e ginásio, ficam junto à vila de Vasiliko."}, {"nome": "Monte Cáucaso", "moderno": "Kazbek, Geórgia (tradicional)", "lat": 42.7, "lon": 44.52, "texto": "Zeus ordena que Hefesto, com a ajuda de Cratos (o Poder) e Bia (a Força), acorrente Prometeu a um rochedo do Cáucaso, no limite do mundo conhecido. Todos os dias uma águia, filha de Tifão e Equidna, vem devorar seu fígado; à noite o órgão se regenera, porque Prometeu é imortal. O castigo deveria durar para sempre.\n\nNa tragédia de Ésquilo, Prometeu recusa se submeter: ele sabe um segredo que pode derrubar Zeus, o de que o filho de Tétis seria maior que o pai. Gerações mais tarde, Héracles passa por ali a caminho das Hespérides, mata a águia com uma flecha e liberta o Titã. Em troca, Prometeu revela o segredo, e Zeus desiste de Tétis, que se casará com o mortal Peleu e será mãe de Aquiles.", "grego": "Καύκασος", "ref": "Ésquilo, Prometeu Acorrentado · Apolodoro II.5.11", "tempo": "O castigo", "certeza": "Tradicional", "sentido": "Prometeu virou símbolo da rebelião contra a tirania e do preço do conhecimento. O nome significa “o que pensa antes”.", "hoje": "A tradição georgiana liga o mito ao monte Kazbek (5.047 m), e há em Gergeti uma igreja da Trindade no sopé da montanha. Lendas locais falam de Amirani, um herói acorrentado parecido com Prometeu."}, {"nome": "Monte Parnaso", "moderno": "Fócida", "lat": 38.536, "lon": 22.62, "texto": "Antes do dilúvio, há Pandora. Zeus manda Hefesto modelar do barro a primeira mulher; cada deus lhe dá um dom (beleza, astúcia, voz) e Hermes a entrega a Epimeteu, irmão de Prometeu, que aceita o presente apesar dos avisos. Pandora abre o jarro que trazia e dele escapam as doenças, a fadiga e todos os males. Só a Esperança fica presa na borda.\n\nMais tarde, revoltado com a crueldade dos homens da Idade do Bronze, Zeus inunda a Terra. Prometeu avisa o filho, Deucalião, que constrói uma arca com a esposa, Pirra, filha de Pandora. Depois de nove dias e nove noites, a arca encalha no alto do Parnaso. O oráculo de Têmis diz que repovoem o mundo jogando para trás os “ossos da grande mãe”. Pirra entende: são as pedras da Terra. As pedras que Deucalião joga viram homens; as de Pirra, mulheres.", "grego": "Παρνασσός", "ref": "Hesíodo, Trabalhos e Dias 59–105 · Ovídio, Metamorfoses I 313–415 · Apolodoro I.7.2", "tempo": "O dilúvio", "certeza": "Montanha real", "sentido": "Um relato de dilúvio parecido com os da Mesopotâmia e da Bíblia. Em grego, “povo” (laós) e “pedra” (laas) soam quase iguais, e o mito brinca com isso.", "hoje": "O Parnaso (2.457 m) domina Delfos. Hoje tem estações de esqui e o pico Liákoura, onde a tradição põe o encalhe da arca."}]}, {"id": "persefone", "titulo": "O Rapto de Perséfone", "ciclo": "deuses", "fontes": ["Hino Homérico a Deméter", "Ovídio V"], "resumo": "Perséfone, também chamada Core (“a moça”), é filha de Zeus e Deméter, deusa dos grãos. Hades a deseja como esposa e Zeus consente sem consultar a mãe. O rapto lança o mundo na fome, e a disputa entre a mãe que procura e o deus que retém só se resolve com um acordo que divide o ano. É o mito fundador das estações e dos Mistérios de Elêusis, o culto secreto mais famoso da Grécia.", "paradas": [{"nome": "Ena", "moderno": "Enna, Sicília (versão romana)", "lat": 37.567, "lon": 14.279, "texto": "Perséfone colhe flores num prado com as filhas de Oceano: rosas, violetas, açafrões. Gaia, a pedido de Zeus, faz brotar um narciso de cem flores, tão perfeito que a moça se afasta para pegá-lo. Quando o arranca, a terra se abre e Hades surge num carro de cavalos negros. Ela grita chamando o pai, mas ninguém ouve, a não ser Hécate, em sua caverna, e Hélio, o Sol, que tudo vê.\n\nOvídio situa a cena junto ao lago Pérgusa, perto de Ena, no coração da Sicília, um bosque de primavera eterna. A Sicília inteira era considerada a ilha de Deméter, por causa de seus campos de trigo.", "grego": "Ἔννα", "ref": "Hino Homérico a Deméter 1–39 · Ovídio, Metamorfoses V 385–408", "tempo": "O rapto", "certeza": "Tradicional (versão romana)", "sentido": "A flor que seduz a moça é a mesma que leva o nome de Narciso: beleza que leva à morte.", "hoje": "O lago Pergusa, a poucos quilômetros de Enna, é hoje cercado por um autódromo. Em Enna, a Rocca di Cerere guarda vestígios do antigo santuário de Deméter."}, {"nome": "Fonte Ciane", "moderno": "Siracusa, Sicília", "lat": 37.04, "lon": 15.23, "texto": "Hades corre com o carro para o leste da Sicília. Perto de Siracusa, a ninfa Ciane ergue-se das águas e bloqueia o caminho, dizendo que uma moça deve ser pedida, não roubada. Hades, furioso, golpeia a fonte com o cetro, a terra se abre e o carro mergulha no mundo subterrâneo.\n\nCiane chora tanto pela moça raptada e pelo desrespeito à sua fonte que se dissolve em água. Quando Deméter chega procurando a filha, Ciane já não tem voz para contar, mas mostra na superfície o cinto de Perséfone, que havia caído ali.", "grego": "Κυάνη", "ref": "Ovídio, Metamorfoses V 409–470", "tempo": "A fuga para o submundo", "certeza": "Nome preservado", "sentido": "O nome Ciane significa “azul-escura”, e a fonte ainda tem essa cor profunda. O mito dá voz a uma paisagem.", "hoje": "A Fonte Ciane, nascente do rio Ciane perto de Siracusa, é reserva natural. É um dos poucos lugares da Europa onde cresce papiro selvagem."}, {"nome": "Elêusis", "moderno": "Ática", "lat": 38.041, "lon": 23.54, "texto": "Por nove dias Deméter vaga com tochas, sem comer nem se lavar. Hélio enfim conta a verdade. Revoltada com Zeus, ela abandona o Olimpo, disfarça-se de velha e senta junto ao Poço das Virgens, em Elêusis. As filhas do rei Céleo a levam ao palácio, onde ela cuida do príncipe Demofonte e tenta torná-lo imortal pondo-o no fogo à noite, até ser flagrada pela mãe. Então se revela, pede um templo e se tranca nele.\n\nEm luto, faz a terra parar de dar frutos. A humanidade está à beira da fome, e os deuses perdem seus sacrifícios. Zeus manda Hermes buscar Perséfone. Hades a deixa ir, mas antes lhe dá sementes de romã. Quem come no reino dos mortos fica preso a ele: Perséfone passará um terço do ano (em outras versões, metade) com o marido, e o resto com a mãe. Quando ela volta, a terra floresce. Antes de partir, Deméter ensina seus ritos ao príncipe Triptólemo, que espalha a agricultura pelo mundo.", "grego": "Ἐλευσίς", "ref": "Hino Homérico a Deméter 40–495", "tempo": "O luto e o retorno", "certeza": "Sítio arqueológico", "sentido": "Os Mistérios de Elêusis, celebrados por quase dois mil anos, prometiam aos iniciados uma vida melhor depois da morte. O segredo foi tão bem guardado que até hoje não se sabe exatamente o que acontecia ali.", "hoje": "O sítio de Elêusis, em Elefsina, a oeste de Atenas, mostra o Telestério, salão de iniciação, e o Poço Calícoro. Elefsina foi Capital Europeia da Cultura em 2023."}]}, {"id": "nascimentos-divinos", "titulo": "Nascimentos de Afrodite, Apolo, Ártemis e Hermes", "ciclo": "deuses", "fontes": ["Hesíodo", "Hinos Homéricos"], "resumo": "Cada deus olímpico tem um nascimento que diz quem ele é. Afrodite surge adulta da espuma do mar; Apolo e Ártemis nascem de uma mãe perseguida, numa ilha que ninguém queria; Hermes, no primeiro dia de vida, já é inventor e ladrão. Este percurso liga os lugares onde esses deuses vieram ao mundo, do sul do Peloponeso a Chipre e às Cíclades.", "paradas": [{"nome": "Citera", "moderno": "Kythira", "lat": 36.25, "lon": 23.0, "texto": "Quando Cronos castra Urano com a foice e lança seus órgãos ao mar, forma-se ao redor deles uma espuma branca (aphrós). Dela cresce uma jovem. Segundo Hesíodo, a primeira terra que ela avista é a ilha sagrada de Citera.\n\nPor esse nascimento, Afrodite é mais antiga que os próprios Olímpicos: é filha do Céu, não de Zeus. Homero conta outra versão, em que ela seria filha de Zeus e Dione. Os gregos às vezes distinguiam duas Afrodites, a Urânia, celeste, e a Pandemos, popular.", "grego": "Κύθηρα", "ref": "Hesíodo, Teogonia 176–200", "tempo": "Da espuma do mar", "certeza": "Tradição antiga", "sentido": "O amor nasce de um ato de violência primordial. Para Hesíodo, Eros e Afrodite são forças anteriores à ordem de Zeus.", "hoje": "Kythira fica entre o Peloponeso e Creta. Na colina de Paleokastro há vestígios de um santuário de Afrodite Urânia, citado por Pausânias como o mais antigo da Grécia."}, {"nome": "Pafos (Petra tou Romiou)", "moderno": "Chipre", "lat": 34.664, "lon": 32.627, "texto": "De Citera, levada pelo vento Zéfiro sobre as ondas, Afrodite chega à costa de Chipre. As Horas, deusas das estações, a recebem na praia, vestem-na com roupas imortais, coroa de ouro e brincos de flores, e a conduzem até os deuses. Por onde ela pisa, brota a grama.\n\nPor isso a deusa era chamada de Cípria e Citereia. Pafos tinha o seu santuário mais famoso, onde ela era adorada sob a forma de uma pedra cônica negra, e não de estátua.", "grego": "Πάφος", "ref": "Hino Homérico VI a Afrodite · Hesíodo, Teogonia 191–200", "tempo": "A chegada", "certeza": "Sítio tradicional", "sentido": "É a cena da pintura de Botticelli. Chipre, ponte entre a Grécia e o Oriente, tinha cultos a deusas do amor muito antes dos gregos.", "hoje": "Petra tou Romiou, a “pedra do grego”, um rochedo no mar a 25 km de Pafos, é o lugar tradicional do nascimento. O santuário antigo fica em Kouklia, Patrimônio Mundial da UNESCO."}, {"nome": "Delos", "moderno": "Cíclades", "lat": 37.396, "lon": 25.27, "texto": "Leto está grávida de gêmeos de Zeus, e Hera, ciumenta, proíbe que qualquer terra firme sob o sol a receba. Leto vaga por toda a Grécia e as ilhas; todas recusam, com medo de Hera ou do filho poderoso que vai nascer. Só Delos, ilha pequena e rochosa que flutuava solta pelo mar, aceita, em troca da promessa de que ali nasceria um templo rico.\n\nO parto dura nove dias, porque Hera retém Ilitia, a deusa dos partos. As outras deusas a subornam com um colar de ouro e âmbar. Leto se agarra a uma palmeira e dá à luz Ártemis e depois Apolo; segundo outra tradição, Ártemis nasce antes, em Ortígia, e ajuda no parto do irmão. Para recompensar a ilha, Zeus a prende ao fundo do mar com colunas.", "grego": "Δῆλος", "ref": "Hino Homérico III a Apolo 30–139 · Calímaco, Hino a Delos", "tempo": "Os gêmeos", "certeza": "Sítio arqueológico", "sentido": "Delos se tornou o centro religioso das Cíclades. Os atenienses chegaram a proibir que alguém nascesse ou morresse na ilha, para mantê-la pura.", "hoje": "Delos é inteiramente um sítio arqueológico, Patrimônio Mundial da UNESCO, acessível de barco a partir de Míconos. O Terraço dos Leões e o lago sagrado, hoje seco, ficam junto ao lugar do parto."}, {"nome": "Monte Cilene", "moderno": "Arcádia", "lat": 37.94, "lon": 22.4, "texto": "Maia, filha de Atlas, dá à luz Hermes numa caverna do monte Cilene. Ao amanhecer ele nasce; ao meio-dia já está tocando música; à noite rouba as vacas de Apolo. No caminho para fora da caverna encontra uma tartaruga, esvazia o casco, estica cordas de tripa e inventa a lira.\n\nDepois desce à Piéria e rouba cinquenta vacas de Apolo, fazendo-as andar de costas e usando sandálias de galhos para confundir os rastros. Sacrifica duas e volta ao berço como se nada fosse. Apolo descobre o ladrão e o leva a Zeus, que ri da esperteza do bebê. A paz se faz quando Hermes dá a lira ao irmão, que em troca lhe deixa as vacas e o caduceu.", "grego": "Κυλλήνη", "ref": "Hino Homérico IV a Hermes", "tempo": "O deus de um dia", "certeza": "Montanha real", "sentido": "Hermes é o deus das trocas, dos ladrões, dos viajantes e dos mensageiros. Seu primeiro dia resume todas as funções que terá.", "hoje": "O monte Kyllini (Ziria, 2.376 m), no norte do Peloponeso, é a segunda montanha mais alta da península. Uma caverna perto do cume ainda é apontada como a de Maia."}, {"nome": "Delfos", "moderno": "Fócida", "lat": 38.482, "lon": 22.501, "texto": "Com quatro dias de vida, Apolo pede arco e flechas e sai em busca de um lugar para seu oráculo. Em Pito, sob o Parnaso, encontra Píton, a serpente-dragão que guardava o santuário de Gaia (e que, segundo algumas versões, tinha perseguido sua mãe grávida). Apolo a mata a flechadas e deixa o corpo apodrecer ao sol: daí o nome Pito, de pýthein, “apodrecer”.\n\nPara se purificar do sangue derramado, Apolo vai servir oito anos na Tessália. Depois volta e toma Delfos como seu santuário. Ali a sacerdotisa, chamada Pítia, sentada sobre um tripé, passa a dar os oráculos do deus. Para lembrar a vitória, criam-se os Jogos Píticos.", "grego": "Δελφοί", "ref": "Hino Homérico III a Apolo 281–374 · Ovídio, Metamorfoses I 438–451", "tempo": "A fundação do oráculo", "certeza": "Sítio arqueológico", "sentido": "Um deus novo tomando um santuário antigo de uma deusa da Terra. Muitos estudiosos leem aqui a lembrança de uma mudança real de culto.", "hoje": "Em Delfos se veem o Templo de Apolo (século IV a.C.), o teatro, o estádio dos Jogos Píticos e o Tesouro dos Atenienses. O museu guarda o célebre Auriga de bronze."}]}, {"id": "atenas-poseidon", "titulo": "A Disputa por Atenas", "ciclo": "deuses", "fontes": ["Apolodoro III.14", "Heródoto VIII"], "resumo": "No tempo do rei Cécrops, metade homem e metade serpente, os deuses decidem escolher cada um as cidades onde seriam honrados. Atena e Poseidon querem a mesma: a cidade que ainda não tinha nome, na planície da Ática. A disputa é decidida por presentes, e a vencedora dá à cidade o seu nome. A derrota, porém, tem consequências.", "paradas": [{"nome": "Acrópole de Atenas", "moderno": "Atenas", "lat": 37.971, "lon": 23.726, "texto": "Poseidon chega primeiro. Sobe à Acrópole e golpeia a rocha com o tridente: brota uma fonte de água salgada, um “mar” no alto da colina, sinal do poder naval que oferecia. Atena vem depois, chama Cécrops como testemunha e planta uma oliveira, a primeira da Ática.\n\nOs juízes, segundo Apolodoro, são os doze deuses (outras versões falam de Cécrops ou do povo). A oliveira vence: dá alimento, óleo para as lâmpadas e madeira, e é presente de paz. A cidade passa a se chamar Atenas. Poseidon, furioso, inunda a planície de Elêusis. Uma versão tardia, de Varrão, diz que votaram homens e mulheres, que as mulheres eram maioria e escolheram Atena; para aplacar Poseidon, os homens tiraram delas o direito ao voto.\n\nQuando os persas incendiaram a Acrópole em 480 a.C., a oliveira sagrada queimou. Heródoto conta que, no dia seguinte, já tinha brotado de novo um ramo do tamanho de um braço.", "grego": "Ἀκρόπολις", "ref": "Apolodoro III.14.1 · Heródoto VIII.55 · Agostinho, Cidade de Deus XVIII.9", "tempo": "A disputa", "certeza": "Sítio arqueológico", "sentido": "A disputa estava esculpida no frontão oeste do Partenon, voltado para quem chegava. Atenas escolhia a sabedoria e a agricultura, mas viveria do mar.", "hoje": "No Erecteion, na Acrópole, mostrava-se a marca do tridente na rocha e o poço de água salgada. Uma oliveira foi replantada ao lado do templo, no lugar da antiga."}]}, {"id": "dioniso", "titulo": "As Viagens de Dioniso", "ciclo": "deuses", "fontes": ["Eurípides, As Bacantes", "Nono, Dionisíacas", "Apolodoro III"], "resumo": "Dioniso é o único olímpico filho de uma mortal, e por isso precisa conquistar o reconhecimento que os outros deuses têm por nascimento. Nasce duas vezes, é perseguido por Hera, criado longe por ninfas e, adulto, percorre o mundo com seu cortejo de Mênades e Sátiros ensinando o cultivo da videira. Quem o recebe ganha o vinho e a festa; quem o rejeita enlouquece. Sua história termina num casamento, com a princesa que Teseu abandonou.", "paradas": [{"nome": "Tebas", "moderno": "Beócia", "lat": 38.32, "lon": 23.32, "texto": "Zeus se apaixona por Sêmele, filha de Cadmo, rei de Tebas. Hera descobre e, disfarçada de velha ama, planta a dúvida: como ela pode ter certeza de que o amante é mesmo Zeus? Que ele prove, aparecendo como aparece para Hera.\n\nSêmele faz Zeus jurar pelo rio Estige que realizará um desejo dela, e só então pede. Preso ao juramento, Zeus se mostra em sua glória de raios, e a mortal é consumida pelo fogo. Ele resgata o feto de seis meses das cinzas, costura-o na própria coxa e, quando chega a hora, Dioniso nasce pela segunda vez. Daí um de seus títulos, Dimetor, “o de duas mães”.", "grego": "Θῆβαι", "ref": "Ovídio, Metamorfoses III 253–315 · Eurípides, Bacantes 1–42", "tempo": "O duplo nascimento", "certeza": "Cidade real", "sentido": "Um deus que nasce de uma mortal e do corpo de um deus fica entre os dois mundos, como o próprio vinho, que leva o humano para fora de si.", "hoje": "A atual Thiva está sobre a cidade antiga. Na Cadmeia, a acrópole tebana, escavações revelaram um palácio micênico. O túmulo de Sêmele era mostrado aos visitantes ainda no tempo de Pausânias."}, {"nome": "Nisa", "moderno": "local lendário (tradicional: Ásia Menor)", "lat": 37.98, "lon": 28.15, "texto": "Para escondê-lo de Hera, Hermes leva o recém-nascido primeiro a Ino, irmã de Sêmele, que o veste de menina. Hera enlouquece Ino e o marido. Zeus então transforma Dioniso em cabrito e Hermes o leva às ninfas do monte Nisa, que o criam numa caverna. Mais tarde, essas ninfas viram as estrelas Híades.\n\nFoi em Nisa que o jovem deus descobriu a videira e aprendeu a fazer vinho. Hera, porém, o encontrou e o enlouqueceu; Dioniso passou a vagar pelo mundo, até ser curado pela deusa Cibele, na Frígia, que o iniciou em seus ritos.", "grego": "Νῦσα", "ref": "Apolodoro III.4.3 · Hino Homérico XXVI", "tempo": "A infância", "certeza": "Local lendário", "sentido": "Nisa não tem lugar fixo: os antigos a puseram na Etiópia, na Arábia, na Índia, na Trácia. É uma terra imaginária, distante, de origem.", "hoje": "Entre várias cidades com esse nome, Nisa, na Cária (perto de Sultanhisar, Turquia), tem ruínas romanas, um teatro e uma biblioteca antiga. A posição no mapa é uma das muitas propostas."}, {"nome": "Índia", "moderno": "vale do Indo (lendário)", "lat": 31.5, "lon": 72.0, "texto": "Dioniso parte com seu exército para o Oriente: Mênades com peles de corça e tirsos (bastões com pinhas na ponta), Sátiros, o velho Sileno, panteras puxando seu carro. Atravessa a Síria, a Mesopotâmia, cruza o Eufrates sobre uma ponte de hera e videira, e chega até a Índia, onde vence os reis locais e ensina o cultivo da uva.\n\nEsse relato cresceu muito depois de Alexandre, o Grande. Seus soldados acharam hera no Hindu Kush e acreditaram estar seguindo os passos do deus. A partir daí, o triunfo indiano de Dioniso passou a ser imitado em procissões de reis helenísticos e de imperadores romanos.", "grego": "Ἰνδική", "ref": "Diodoro III.65 · Arriano, Anábase V.1–2 · Nono, Dionisíacas", "tempo": "A conquista do Oriente", "certeza": "Lendário", "sentido": "O deus estrangeiro que volta à pátria trazendo o mundo. A lenda alimentou a imagem de Alexandre e, depois, a dos césares.", "hoje": "A antiga Nisa indiana foi associada ao vale do Kunar, entre Afeganistão e Paquistão, onde Alexandre teria encontrado uma cidade que dizia ter sido fundada por Dioniso."}, {"nome": "Tebas", "moderno": "Beócia", "lat": 38.32, "lon": 23.32, "texto": "De volta à Grécia, Dioniso chega a Tebas disfarçado de jovem estrangeiro. As tias negavam que Sêmele tivesse se unido a Zeus, e o rei Penteu, primo do deus, proíbe o culto. Como castigo, Dioniso enlouquece as mulheres tebanas, que deixam as casas e vão para o monte Citerão em êxtase.\n\nPenteu manda prender o estrangeiro, mas as correntes caem sozinhas e o palácio treme. Então o deus o seduz com a curiosidade: por que não espiar as Bacantes? Vestido de mulher, Penteu sobe numa árvore para ver. As mulheres o descobrem e, guiadas pela própria mãe dele, Agave, o despedaçam com as mãos nuas, acreditando caçar um leão. Agave volta a Tebas com a cabeça do filho espetada no tirso, e só aos poucos recobra a razão.", "grego": "Κιθαιρών", "ref": "Eurípides, As Bacantes", "tempo": "O castigo de Penteu", "certeza": "Cidade real", "sentido": "A última tragédia de Eurípides. Mostra o perigo de negar o lado irracional da vida: quem o reprime é destruído por ele.", "hoje": "O monte Citerão (1.409 m) separa a Beócia da Ática. É o mesmo monte onde Édipo foi abandonado bebê."}, {"nome": "Naxos", "moderno": "Cíclades", "lat": 37.1, "lon": 25.38, "texto": "Teseu, de volta de Creta com Ariadne, a deixa adormecida na praia de Naxos e parte. Quando ela acorda e vê o navio desaparecendo no horizonte, se desespera. Nas versões mais antigas, foi Dioniso quem exigiu que Teseu a deixasse; em outras, Teseu simplesmente a esqueceu.\n\nDioniso chega com seu cortejo de música e tochas, encontra Ariadne e a toma como esposa. Dá-lhe de presente uma coroa feita por Hefesto, que depois ele lança ao céu, onde se torna a constelação da Coroa Boreal. Ariadne é das poucas mortais a se tornar imortal, como mulher de um deus.", "grego": "Νάξος", "ref": "Hesíodo, Teogonia 947–949 · Catulo 64 · Ovídio, Metamorfoses VIII 174–182", "tempo": "O casamento", "certeza": "Ilha real", "sentido": "O abandono vira encontro. A cena foi pintada por Ticiano e virou ópera de Richard Strauss.", "hoje": "Na entrada do porto de Naxos, no ilhote de Palatia, ergue-se a Portara, um enorme portal de mármore de um templo inacabado do século VI a.C., que a tradição local liga a Dioniso e Ariadne."}]}, {"id": "hercules", "titulo": "Os 12 Trabalhos de Héracles", "ciclo": "herois", "fontes": ["Apolodoro II.5", "Diodoro IV", "Pausânias"], "resumo": "Héracles é filho de Zeus e da mortal Alcmena, e Hera o odeia desde antes de nascer: atrasa seu parto para que o primo Euristeu nasça primeiro e herde o trono de Micenas, e manda duas serpentes ao berço, que o bebê estrangula. Adulto e casado com Mégara, princesa de Tebas, é tomado por uma loucura enviada pela deusa e mata a mulher e os filhos. Para se purificar, o oráculo de Delfos o manda servir Euristeu por doze anos. Os doze trabalhos começam no Peloponeso, onde cada monstro aterroriza uma região, e depois avançam até os limites do mundo: o mar Negro, o oceano ocidental e o reino dos mortos. No fim, Héracles é o único herói a ganhar a imortalidade e um lugar no Olimpo.", "paradas": [{"nome": "Tirinto", "moderno": "Argólida", "lat": 37.599, "lon": 22.799, "texto": "Euristeu, rei de Tirinto e Micenas, é tudo o que Héracles não é: fraco, covarde, desconfiado. Por ordem do oráculo de Delfos, que pela primeira vez chama o herói de Héracles (“glória de Hera”), ele se apresenta para servir o primo. A Pítia promete que, cumpridas as tarefas, ele se tornará imortal.\n\nOriginalmente seriam dez trabalhos. Euristeu recusou contar dois deles, a Hidra (porque Iolau ajudou) e os estábulos de Áugias (porque Héracles cobrou pagamento), e impôs mais dois. Depois de ver a pele do Leão de Nemeia, o rei sente tanto medo que proíbe Héracles de entrar na cidade: as ordens passam a ser dadas por um arauto, e Euristeu manda fazer um grande jarro de bronze enterrado no chão para se esconder quando o herói chega.", "grego": "Τίρυνς", "ref": "Apolodoro II.4.12 · II.5.1", "tempo": "O início do serviço", "certeza": "Sítio arqueológico", "sentido": "O maior herói da Grécia a serviço do pior dos reis. A humilhação faz parte da expiação.", "hoje": "Tirinto, perto de Náuplio, conserva as muralhas ciclópicas micênicas, com blocos de várias toneladas que os gregos achavam obra de gigantes. É Patrimônio Mundial da UNESCO junto com Micenas."}, {"nome": "1. Nemeia", "moderno": "Argólida", "lat": 37.81, "lon": 22.71, "texto": "Um leão filho de Tifão (ou caído da Lua, segundo outra versão) devasta os arredores de Nemeia. Sua pele não pode ser furada por nenhuma arma. Héracles se hospeda na casa do pobre lavrador Molorco, que quer sacrificar seu único carneiro; o herói pede que espere trinta dias. Se não voltar, que sacrifique a ele, como a um morto; se voltar, a Zeus.\n\nAs flechas ricocheteiam no leão, a espada se dobra. Héracles então bloqueia uma das saídas da caverna de duas bocas, entra pela outra, agarra o leão pelo pescoço e o estrangula. Para tirar a pele, nenhuma lâmina serve, até ele usar as próprias garras do animal. A partir daí veste a pele como armadura, com a cabeça do leão como elmo. Chega à casa de Molorco no trigésimo dia, quando o lavrador já preparava o sacrifício ao herói morto.", "grego": "Νεμέα", "ref": "Apolodoro II.5.1 · Calímaco, Aitia III", "tempo": "1º trabalho", "certeza": "Sítio arqueológico", "sentido": "A pele do leão vira o símbolo de Héracles em toda a arte antiga. Os Jogos Nemeus, em honra de Zeus, eram associados a essa vitória.", "hoje": "O sítio de Nemeia tem o templo de Zeus, com três colunas restauradas, e um estádio com o túnel de entrada dos atletas. Uma caverna nos morros próximos é mostrada como a do leão."}, {"nome": "2. Lerna", "moderno": "Argólida", "lat": 37.55, "lon": 22.72, "texto": "Nos pântanos de Lerna vive a Hidra, serpente de nove cabeças (o número varia de cinco a cem), a do meio imortal, criada por Hera para enfrentar Héracles. O hálito dela mata. O herói chega num carro guiado pelo sobrinho Iolau, força a Hidra a sair da toca com flechas incendiárias e a agarra.\n\nA cada cabeça que ele esmaga com a clava, nascem duas. Hera ainda manda um caranguejo gigante morder o pé dele; Héracles o pisoteia e a deusa o põe no céu como a constelação de Câncer. A solução vem de Iolau: ele incendeia parte do bosque e, com tições, cauteriza cada pescoço cortado, para que nada mais brote. A cabeça imortal é enterrada sob uma rocha pesada. Antes de sair, Héracles mergulha as flechas no sangue venenoso da Hidra. Esse veneno vai matar muitos inimigos e, um dia, o próprio Héracles.", "grego": "Λέρνη", "ref": "Apolodoro II.5.2 · Eurípides, Héracles 419–424", "tempo": "2º trabalho", "certeza": "Sítio arqueológico", "sentido": "Um problema que cresce quando é atacado do jeito errado. A Hidra virou metáfora universal para males que se multiplicam.", "hoje": "Lerna fica junto à vila de Myloi, ao sul de Argos. Ali se escavou a Casa das Telhas, uma construção de cerca de 2200 a.C. As nascentes e o antigo pântano foram em grande parte drenados."}, {"nome": "3. Cerineia", "moderno": "Acaia/Arcádia", "lat": 38.17, "lon": 22.08, "texto": "A corça de Cerineia tem chifres de ouro e cascos de bronze, e pertence a Ártemis. Matá-la seria sacrilégio, então Euristeu exige que Héracles a traga viva. Ela é tão veloz que o herói a persegue durante um ano inteiro, por montanhas e florestas. Segundo Píndaro, a caçada chega até a terra dos Hiperbóreos, no extremo norte.\n\nPor fim, exausta, a corça para para beber no rio Ládon, na Arcádia. Héracles a fere de leve com uma flecha entre os ossos e os tendões das patas, sem derramar sangue, e a carrega nos ombros. No caminho, encontra Ártemis e Apolo. A deusa o acusa de ferir seu animal sagrado; Héracles explica que obedecia a Euristeu, e Ártemis o perdoa e o deixa seguir.", "grego": "Κερύνεια", "ref": "Apolodoro II.5.3 · Píndaro, Olímpica III 26–34", "tempo": "3º trabalho", "certeza": "Tradicional", "sentido": "O único trabalho que é pura paciência. Não se vence um animal divino pela força, só pela persistência e pelo respeito.", "hoje": "O nome Keryneia sobrevive numa área montanhosa da Acaia, perto de Egio. O rio Ládon corre por gargantas arborizadas da Arcádia e tem uma represa moderna."}, {"nome": "4. Monte Erimanto", "moderno": "Arcádia/Acaia", "lat": 37.97, "lon": 21.8, "texto": "Um javali enorme desce do monte Erimanto e devasta os campos de Psófis. A caminho, Héracles se hospeda com o centauro Folo, que lhe serve carne assada. O herói pede vinho, e Folo, relutante, abre o jarro que pertencia a todos os centauros. O cheiro atrai os outros, que chegam armados de pedras e troncos. Na luta, Héracles os afugenta com flechas envenenadas.\n\nA tragédia acontece sem querer: uma flecha atravessa o braço de um centauro e atinge o joelho do sábio Quíron, mestre de Aquiles e de Asclépio. Imortal, Quíron não pode morrer, mas não suporta a dor; acaba cedendo sua imortalidade a Prometeu. Folo também morre, ao deixar cair uma flecha no próprio pé enquanto a examinava. Héracles enterra o amigo e segue. Força o javali a sair da toca com gritos, o empurra para a neve profunda, onde o animal atola, e o amarra numa rede. Ao trazê-lo, Euristeu se esconde no jarro de bronze.", "grego": "Ἐρύμανθος", "ref": "Apolodoro II.5.4 · Diodoro IV.12", "tempo": "4º trabalho", "certeza": "Montanha real", "sentido": "Uma vitória que custa os amigos. A cena de Euristeu dentro do jarro era uma das favoritas dos pintores de vasos.", "hoje": "O monte Erymanthos (2.224 m) fica entre a Acaia e a Élida. As ruínas de Psófis estão perto da vila de Tripotamo, na Arcádia."}, {"nome": "5. Élida", "moderno": "Élida", "lat": 37.89, "lon": 21.38, "texto": "Áugias, rei da Élida e filho de Hélio, tem os maiores rebanhos do mundo, e seus estábulos nunca foram limpos. Euristeu manda Héracles limpá-los em um dia, um trabalho humilhante, sujo, indigno de um herói. Héracles propõe ao rei: se terminar em um dia, receberá um décimo do gado. Áugias aceita, certo de que é impossível.\n\nHéracles abre buracos nas paredes do estábulo e desvia os rios Alfeu e Peneu, que atravessam o curral e levam toda a sujeira. Áugias se recusa a pagar e nega ter prometido; o filho dele, Fileu, testemunha a favor do herói e é expulso. Euristeu, por sua vez, não aceita o trabalho porque Héracles cobrou por ele. Anos depois, Héracles volta com um exército, mata Áugias e, segundo Píndaro, funda os Jogos Olímpicos em Olímpia com o espólio.", "grego": "Ἦλις", "ref": "Apolodoro II.5.5 · Píndaro, Olímpica X", "tempo": "5º trabalho", "certeza": "Região real", "sentido": "A força bruta não serve: o problema é resolvido por engenharia. Desviar rios era trabalho de verdade no mundo antigo.", "hoje": "A antiga cidade de Élis fica perto de Amaliada. Uma das métopas do templo de Zeus em Olímpia, hoje no museu do sítio, mostra Atena ajudando Héracles nessa tarefa."}, {"nome": "6. Lago Estínfalo", "moderno": "Coríntia", "lat": 37.86, "lon": 22.45, "texto": "No lago de Estínfalo, cercado por um bosque espesso, se escondem bandos de aves que se multiplicaram assustadoramente. Em versões posteriores, elas têm penas, bicos e garras de bronze, comem gente e lançam as penas como flechas. O pântano é mole demais para andar e fundo demais para nadar.\n\nAtena dá a Héracles um par de crótalos, castanholas de bronze forjadas por Hefesto. Ele sobe a uma montanha próxima e as faz soar. Assustadas com o barulho, as aves levantam voo de uma só vez e o herói as abate com flechas. As que escapam fogem para a ilha de Ares, no mar Negro, onde os Argonautas as encontrarão anos depois.", "grego": "Στύμφαλος", "ref": "Apolodoro II.5.6 · Apolônio de Rodes II 1052–1057", "tempo": "6º trabalho", "certeza": "Sítio arqueológico", "sentido": "Ao contrário do resto, o inimigo é um enxame. A solução é tirar o inimigo do esconderijo antes de lutar.", "hoje": "O lago Stymfalia, na Coríntia, é uma zona úmida protegida, importante para aves migratórias. Há um pequeno museu ambiental e as ruínas da cidade antiga às margens."}, {"nome": "7. Creta", "moderno": "Cnossos", "lat": 35.298, "lon": 25.163, "texto": "O rei Minos havia prometido sacrificar a Poseidon o touro que o deus faria sair do mar. O animal era tão belo que Minos o guardou e sacrificou outro. Como castigo, Poseidon enlouqueceu o touro, que passou a devastar Creta, e fez a rainha Pasífae se apaixonar por ele. Dessa união nasceria o Minotauro.\n\nHéracles navega até Creta. Minos lhe dá permissão, mas nenhuma ajuda. O herói captura o touro sozinho, o doma e atravessa o mar montado nele, até o Peloponeso. Mostra-o a Euristeu e o solta. O animal vaga por Esparta, pela Arcádia, cruza o istmo e se instala em Maratona, na Ática, onde mais tarde será morto por Teseu.", "grego": "Κρήτη", "ref": "Apolodoro II.5.7 · III.1.3–4", "tempo": "7º trabalho", "certeza": "Sítio arqueológico", "sentido": "Os trabalhos começam a sair do Peloponeso. O touro liga Héracles a Teseu e ao ciclo cretense do Minotauro.", "hoje": "Cnossos, a 5 km de Heraklion, é o maior palácio minoico. Os afrescos de saltadores de touros mostram que o animal era central na religião cretense."}, {"nome": "8. Trácia", "moderno": "Abdera", "lat": 40.95, "lon": 24.98, "texto": "Diomedes, rei dos bístones na Trácia e filho de Ares, alimenta suas quatro éguas com carne humana, os estrangeiros que chegam ao seu reino. Héracles parte com alguns companheiros, entre eles o jovem Abdero, seu amigo querido. Vence os guardas e leva as éguas para a costa.\n\nQuando os bístones o perseguem, ele deixa as éguas com Abdero e vai lutar. Ao voltar, descobre que os animais devoraram o rapaz. Furioso, Héracles mata Diomedes e o dá de comer às próprias éguas; saciadas, elas se acalmam. Junto ao túmulo de Abdero, o herói funda uma cidade com o nome do amigo. As éguas são levadas a Euristeu, que as consagra a Hera e
