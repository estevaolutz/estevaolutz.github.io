<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Quadro de Pixels</title>
<style>
:root{--bg:#000;--pn:#12151c;--ln:#2a303c;--tx:#e9ecf2;--mt:#8b93a3;--ac:#e8b04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body.saida{overflow:hidden;cursor:crosshair}
body.saida.limpo{cursor:none}
#out{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#pn{position:fixed;top:0;right:0;bottom:0;width:320px;background:#12151cf2;border-left:1px solid var(--ln);padding:14px;overflow-y:auto;transform:translateX(100%);transition:transform .2s;cursor:default}
#pn.ab{transform:none}
#pn .lin input[type=number]{width:56px}
#dica{position:fixed;left:12px;bottom:10px;color:#8b93a3;font-size:12px;pointer-events:none}
body.limpo #pn{position:fixed;top:0;right:0;bottom:0;width:320px;background:#12151cf2;border-left:1px solid var(--ln);padding:14px;overflow-y:auto;transform:translateX(100%);transition:transform .2s;cursor:default}
#pn.ab{transform:none}
#pn .lin input[type=number]{width:56px}
#dica{display:none}
/* controle */
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#esq{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
#dir{background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:16px 14px 40px}
h1{font-size:18px;margin:0;font-weight:650}
h1 small{color:var(--mt);font-weight:400;font-size:13px;margin-left:8px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);margin:18px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.cx{background:#07080b;border:1px solid var(--ln);border-radius:10px;padding:10px}

#prev{width:100%;display:block;image-rendering:pixelated;cursor:pointer;border-radius:4px}

@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#dir{border-left:0;border-top:1px solid var(--ln)}}
</style>
</head>
<body>
<script>
"use strict";
const SAIDA = new URLSearchParams(location.search).has('saida');
const CHAVE = 'quadro-de-pixels-v1';
const canal = ('BroadcastChannel' in window) ? new BroadcastChannel('quadro-de-pixels') : null;

const PADRAO = {
  cols: 30, rows: 24,
  cantos: [[0.254,0.15],[0.746,0.15],[0.746,0.85],[0.254,0.85]], // sup-esq, sup-dir, inf-dir, inf-esq (fração da janela de saída)
  fresta: 0.10,     // espaço apagado entre blocos (fração do bloco)
  brilho: 1,
  calib: true,      // mostrar contorno e cantos na projeção
  numeros: false,
  efeito: 'grade',
  texto: 'QUADRO DE PIXELS', camModo: 'cor', camEspelho: true, camContraste: 1.3, camZoom: 1, camInverter: false, camDev: '', camCongelar: false, ganho: 1.5, auto: false, autoSeg: 20,
  vel: 1,
  cor: '#ffffff',
  sel: 0            // canto selecionado
};
let S = carregar();
function carregar(){
  try{ const s = JSON.parse(localStorage.getItem(CHAVE)); if(s && s.cantos) return Object.assign({}, PADRAO, s); }catch(e){}
  return JSON.parse(JSON.stringify(PADRAO));
}
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(e){} }

/* ---------- homografia: quadrado unitário -> quadrilátero ---------- */
function homografia(q){
  const [x0,y0]=q[0],[x1,y1]=q[1],[x2,y2]=q[2],[x3,y3]=q[3];
  const dx1=x1-x2, dx2=x3-x2, dy1=y1-y2, dy2=y3-y2;
  const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  let g=0,h=0;
  if(Math.abs(sx)>1e-12 || Math.abs(sy)>1e-12){
    const d=dx1*dy2-dx2*dy1;
    g=(sx*dy2-dx2*sy)/d; h=(dx1*sy-sx*dy1)/d;
  }
  const a=x1-x0+g*x1, b=x3-x0+h*x3, c=x0;
  const d2=y1-y0+g*y1, e=y3-y0+h*y3, f=y0;
  return (u,v)=>{ const w=g*u+h*v+1; return [(a*u+b*v+c)/w,(d2*u+e*v+f)/w]; };
}

/* ---------- desenho da projeção (usado na saída e na miniatura) ---------- */
function desenhar(ctx, W, H, px, opc){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const q=S.cantos.map(([x,y])=>[x*W,y*H]);
  const T=homografia(q);
  const C=S.cols, R=S.rows, g=S.fresta/2;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    const i=(r*C+c)*3;
    const cr=px?px[i]:0, cg=px?px[i+1]:0, cb=px?px[i+2]:0;
    if(cr+cg+cb===0) continue;
    const u0=(c+g)/C,u1=(c+1-g)/C,v0=(r+g)/R,v1=(r+1-g)/R;
    const a=T(u0,v0),b=T(u1,v0),d=T(u1,v1),e=T(u0,v1);
    ctx.fillStyle=`rgb(${cr},${cg},${cb})`;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.lineTo(e[0],e[1]);ctx.closePath();ctx.fill();
  }
  if(S.numeros){
    const tam=Math.max(6,Math.hypot(q[1][0]-q[0][0],q[1][1]-q[0][1])/C*0.32);
    ctx.font=`${tam}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const p=T((c+.5)/C,(r+.5)/R);
      ctx.fillStyle='#e8b04a'; ctx.fillText(`${c+1}·${r+1}`,p[0],p[1]);
    }
  }
  if(S.calib || opc.sempreCantos){
    ctx.lineWidth=opc.linha||2; ctx.strokeStyle='#e8b04a';
    ctx.beginPath(); q.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
    const rr=opc.raio||14;
    q.forEach((p0,k)=>{
      const p=[Math.min(W-rr,Math.max(rr,p0[0])),Math.min(H-rr,Math.max(rr,p0[1]))];
      const fora=p[0]!==p0[0]||p[1]!==p0[1];
      ctx.setLineDash(fora?[4,4]:[]);
      ctx.beginPath();ctx.arc(p[0],p[1],rr,0,Math.PI*2);
      ctx.fillStyle=k===S.sel?'#e8b04a':'#0008';ctx.fill();ctx.strokeStyle='#e8b04a';ctx.stroke();
      ctx.fillStyle=k===S.sel?'#111':'#e8b04a';ctx.font=`bold ${rr}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(k+1,p[0],p[1]+1);
      ctx.setLineDash([]);
    });
  }
}

/* ---------- arrastar cantos (saída e miniatura) ---------- */
function arrastavel(cv, aoMudar){
  // Perto de um canto: pega aquele canto. Longe de todos: arrasta o canto selecionado à distância
  // (serve para cantos fora da tela). Com Shift, arrasta a grade inteira.
  let modo=null, ult=null;
  const pos=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height,r];};
  cv.addEventListener('pointerdown',ev=>{
    if(!S.calib && SAIDA) return;
    const [x,y,r]=pos(ev); let melhor=-1,dm=1e9;
    S.cantos.forEach(([cx,cy],k)=>{const px=Math.min(1,Math.max(0,cx)),py=Math.min(1,Math.max(0,cy));
      const d=Math.hypot((px-x)*r.width,(py-y)*r.height); if(d<dm){dm=d;melhor=k;}});
    if(ev.shiftKey) modo='todos'; else { if(dm<50) S.sel=melhor; modo='um'; }
    ult=[x,y]; cv.setPointerCapture(ev.pointerId); aoMudar();
  });
  cv.addEventListener('pointermove',ev=>{ if(!modo) return; const [x,y]=pos(ev);
    const dx=x-ult[0], dy=y-ult[1]; ult=[x,y];
    const lim=v=>Math.min(6,Math.max(-5,v));
    (modo==='todos'?S.cantos:[S.cantos[S.sel]]).forEach(p=>{p[0]=lim(p[0]+dx);p[1]=lim(p[1]+dy);});
    aoMudar(); });
  cv.addEventListener('pointerup',()=>{modo=null;});
}
function escalar(fx,fy){ // estica/encolhe a grade a partir do centro
  const cx=S.cantos.reduce((a,p)=>a+p[0],0)/4, cy=S.cantos.reduce((a,p)=>a+p[1],0)/4;
  S.cantos.forEach(p=>{p[0]=cx+(p[0]-cx)*fx;p[1]=cy+(p[1]-cy)*fy;});
}
function teclas(aoMudar){
  addEventListener('keydown',ev=>{
    if(ev.target.tagName==='INPUT') return;
    if(['1','2','3','4'].includes(ev.key)){S.sel=+ev.key-1;aoMudar();return;}
    const passo=(ev.altKey?50:ev.shiftKey?10:1)/ (SAIDA?innerWidth:1920);
    const esc={'+':[1.02,1.02],'=':[1.02,1.02],'-':[0.98,0.98],'PageUp':[1,1.02],'PageDown':[1,0.98],']':[1,1.02],'[':[1,0.98]}[ev.key];
    if(esc){ev.preventDefault();escalar(...esc);aoMudar();return;}
    if(ev.key==='0'){S.cantos=JSON.parse(JSON.stringify(PADRAO.cantos));aoMudar();return;}
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
    if(m){ev.preventDefault(); const p=S.cantos[S.sel]; const ar=SAIDA?innerWidth/innerHeight:16/9;
      p[0]+=m[0]*passo; p[1]+=m[1]*passo*ar; aoMudar(); }
    if(ev.key==='c'||ev.key==='C'){S.calib=!S.calib;aoMudar();}
    if(ev.key==='n'||ev.key==='N'){S.numeros=!S.numeros;aoMudar();}
    if((ev.key==='f'||ev.key==='F')&&SAIDA){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }
  });
}

/* ---------- motor de efeitos (comum às duas janelas) ---------- */
let px=new Uint8ClampedArray(S.cols*S.rows*3);
let pintura=new Uint8Array(S.cols*S.rows);
const TESTES=[['grade','Grade xadrez'],['branco','Tudo aceso'],['bordas','Só a moldura'],['varredura','Varredura'],['umporum','Um por um'],['cantos4','Cantos coloridos']];
const VISUAIS=[['onda','Onda'],['chuva','Chuva'],['cintilar','Cintilar'],['plasma','Plasma'],['vida','Jogo da Vida'],['fogo','Fogo'],['espiral','Espiral'],['respirar','Respirar'],['madeira','Brasa na madeira'],['raio','Luz rasante']];
const SONOROS=[['espectro','Espectro (30 bandas)'],['vu','VU circular'],['pulso','Pulso no grave']];
const SEUS=[['texto','Texto'],['midia','Imagem/vídeo'],['camera','Pixelador (câmera)'],['desenhar','Desenhar']];
const EFEITOS=[...VISUAIS,...SONOROS,...SEUS];
const AUTO=VISUAIS.map(e=>e[0]);

/* ---------- som (microfone) ---------- */
let ac=null, an=null, fdat=null, bandas=null, nivel=0, mediaGrave=0, ondas=[];
async function ligarMic(){
  if(an) return true;
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)(); an=ac.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=0.75;
    ac.createMediaStreamSource(st).connect(an); fdat=new Uint8Array(an.frequencyBinCount); return true;
  }catch(e){ alert('Não consegui abrir o microfone.'); return false; }
}
function lerAudio(C){
  if(!an){ bandas=null; return; }
  an.getByteFrequencyData(fdat);
  const hz=ac.sampleRate/an.fftSize, g=S.ganho; bandas=new Float32Array(C); let soma=0;
  for(let c=0;c<C;c++){ const f0=40*Math.pow(300,c/C), f1=40*Math.pow(300,(c+1)/C);
    let a=Math.floor(f0/hz), z=Math.max(a+1,Math.ceil(f1/hz)), m=0; for(let i=a;i<z&&i<fdat.length;i++) m=Math.max(m,fdat[i]);
    bandas[c]=Math.min(1,Math.pow(m/255,1.6)*g); soma+=bandas[c]; }
  nivel=soma/C;
  let grave=0; for(let i=1;i<Math.ceil(150/hz);i++) grave+=fdat[i]; grave/=Math.max(1,Math.ceil(150/hz)-1);
  if(grave>mediaGrave*1.35 && grave>60) ondas.push({r:0,f:Math.min(1,grave/255*g)});
  mediaGrave=mediaGrave*0.92+grave*0.08;
}

/* ---------- texto e mídia ---------- */
const tcv=document.createElement('canvas'), tctx=tcv.getContext('2d',{willReadFrequently:true});
let midia=null;
function carregarMidia(arq){ if(!arq) return; const url=URL.createObjectURL(arq);
  if(arq.type.startsWith('video')){ const v=document.createElement('video'); v.src=url; v.loop=true; v.muted=true; v.playsInline=true; v.play(); midia=v; }
  else { const i=new Image(); i.src=url; midia=i; }
  S.efeito='midia'; }
function amostrar(fonte,fw,fh,C,R,espelhar){
  tcv.width=C; tcv.height=R; tctx.fillStyle='#000'; tctx.fillRect(0,0,C,R);
  const e=Math.max(C/fw,R/fh), w=fw*e, h=fh*e;
  tctx.save(); if(espelhar){tctx.translate(C,0);tctx.scale(-1,1);} tctx.drawImage(fonte,(C-w)/2,(R-h)/2,w,h); tctx.restore();
  return tctx.getImageData(0,0,C,R).data;
}
function extrasHTML(){
  const op=(k,l)=>`<option value="${k}"${S.camModo===k?' selected':''}>${l}</option>`;
  const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
  return `<h2>Pixelador (câmera)</h2>
   <div class="bts"><button class="b${S.efeito==='camera'?' on':''}" data-x="cam">${video?'Câmera ligada':'Ligar câmera'}</button><button class="b${S.camCongelar?' on':''}" data-x="congelar">${S.camCongelar?'Descongelar':'Congelar imagem'}</button></div>
   ${cameras.length>1?`<div class="lin"><label>Câmera</label><select data-k="camDev" style="flex:1;background:#0b0d12;color:#e9ecf2;border:1px solid #2a303c;border-radius:8px;padding:6px">${cameras.map((c,i)=>`<option value="${esc(c.deviceId)}"${S.camDev===c.deviceId?' selected':''}>${esc(c.label||'Câmera '+(i+1))}</option>`).join('')}</select></div>`:''}
   <div class="lin"><label>Modo</label><select data-k="camModo" style="flex:1;background:#0b0d12;color:#e9ecf2;border:1px solid #2a303c;border-radius:8px;padding:6px">${op('cor','Cores reais')}${op('mono','Uma cor (tons)')}${op('niveis','Uma cor, 4 níveis')}${op('pb','Uma cor, aceso/apagado')}</select></div>
   <div class="lin"><label>Contraste</label><input type="range" data-k="camContraste" min="0.5" max="3" step="0.05" value="${S.camContraste}"></div>
   <div class="lin"><label>Zoom</label><input type="range" data-k="camZoom" min="1" max="4" step="0.05" value="${S.camZoom}"></div>
   <label class="ck"><input type="checkbox" data-k="camEspelho" ${S.camEspelho?'checked':''}> Espelhar (como um espelho)</label>
   <label class="ck"><input type="checkbox" data-k="camInverter" ${S.camInverter?'checked':''}> Inverter (negativo)</label>
   <h2>Som</h2>
   <div class="bts"><button class="b${an?' on':''}" data-x="mic">${an?'Microfone ligado':'Ligar microfone'}</button></div>
   <div class="lin"><label>Sensibilidade</label><input type="range" data-k="ganho" min="0.3" max="5" step="0.05" value="${S.ganho}"></div>
   <h2>Texto</h2>
   <div class="lin"><input type="text" data-k="texto" value="${String(S.texto).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}" style="flex:1;background:#0b0d12;color:#e9ecf2;border:1px solid #2a303c;border-radius:8px;padding:6px 8px;font:inherit"></div>
   <h2>Imagem ou vídeo</h2>
   <input type="file" data-f="1" accept="image/*,video/*" style="color:#8b93a3;font-size:12px">
   <h2>Sequência automática</h2>
   <label class="ck"><input type="checkbox" data-k="auto" ${S.auto?'checked':''}> Trocar de efeito sozinho a cada <input type="number" data-k="autoSeg" min="3" max="600" value="${S.autoSeg}" style="width:56px;background:#0b0d12;color:#e9ecf2;border:1px solid #2a303c;border-radius:6px;padding:3px"> s</label>`;
}
function valorDe(el){ return el.type==='checkbox'?el.checked : (el.type==='color'||el.type==='text'||el.tagName==='SELECT')?el.value : +el.value; }
// botões e campos extras comuns às duas janelas; devolve true se o painel precisa ser redesenhado
async function acaoExtra(x){
  if(x==='mic'){ await ligarMic(); return true; }
  if(x==='cam'){ S.efeito='camera'; await ligarCamera(); return true; }
  if(x==='congelar'){ S.camCongelar=!S.camCongelar; return true; }
  return false;
}
/* câmera */
let video=null, camUlt=null; const vcv=document.createElement('canvas'), vctx=vcv.getContext('2d',{willReadFrequently:true});
let cameras=[];
async function ligarCamera(trocar){
  if(video && !trocar) return;
  try{
    if(video&&video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    const st=await navigator.mediaDevices.getUserMedia({video:S.camDev?{deviceId:{exact:S.camDev},width:640,height:480}:{width:640,height:480}});
    video=video||document.createElement('video'); video.srcObject=st; video.muted=true; video.playsInline=true; await video.play();
    cameras=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  }catch(e){ alert('Não consegui abrir a câmera.'); }
}

/* jogo da vida */
let vida=null, vidaT=0;
function semearVida(){ vida=new Uint8Array(S.cols*S.rows).map(()=>Math.random()<.3?1:0); }

/* ---------- efeitos: devolvem [r,g,b] 0..1 por bloco ---------- */
function hex(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function hsv(h,s,v){ const f=n=>{const k=(n+h*6)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));}; return [f(5),f(3),f(1)]; }
const ruido=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
let chuva=[], calor=null, autoT=0, autoI=0;
function calcular(t){
  const C=S.cols,R=S.rows,N=C*R, cor=hex(S.cor), b=S.brilho, T=t*S.vel;
  if(px.length!==N*3) px=new Uint8ClampedArray(N*3);
  const set=(k,rgb,m=1)=>{px[k*3]=rgb[0]*m*b*255;px[k*3+1]=rgb[1]*m*b*255;px[k*3+2]=rgb[2]*m*b*255;};
  px.fill(0);
  if(S.auto && t-autoT>S.autoSeg){ autoT=t; autoI=(AUTO.indexOf(S.efeito)+1)%AUTO.length; S.efeito=AUTO[autoI]; if(S.efeito==='vida') semearVida(); salvar(); }
  if(!S.auto) autoT=t;
  lerAudio(C);
  ondas.forEach(o=>o.r+=0.6*Math.max(.2,S.vel)); ondas=ondas.filter(o=>o.r<Math.hypot(C,R)/2+4);
  if(S.efeito==='fogo'){ if(!calor||calor.length!==N) calor=new Float32Array(N);
    for(let c=0;c<C;c++) calor[(R-1)*C+c]=0.55+Math.random()*0.45;
    for(let r=0;r<R-1;r++) for(let c=0;c<C;c++){ const a=calor[(r+1)*C+(c+C-1)%C], m=calor[(r+1)*C+c], z=calor[(r+1)*C+(c+1)%C], e=calor[Math.min(R-1,r+2)*C+c];
      calor[r*C+c]=Math.max(0,(a+m+z+e)/4-0.045*(0.6+Math.random()*0.8)*(24/R)); } }
  let txt=null;
  if(S.efeito==='texto'){ tcv.width=C; tcv.height=R; tctx.fillStyle='#000'; tctx.fillRect(0,0,C,R);
    tctx.font=`bold ${Math.round(R*0.8)}px system-ui,sans-serif`; tctx.textBaseline='middle'; tctx.fillStyle='#fff';
    const w=tctx.measureText(S.texto||' ').width; tctx.fillText(S.texto||'',C-((T*7)%(w+C)),R/2+1); txt=tctx.getImageData(0,0,C,R).data; }
  if(S.efeito==='vida' && !vida) semearVida();
  if(S.efeito==='vida' && t-vidaT>0.35/Math.max(.05,S.vel)){ vidaT=t; const n=new Uint8Array(N);
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){let v=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr||dc)v+=vida[((r+dr+R)%R)*C+(c+dc+C)%C];}
      const k=r*C+c; n[k]=(v===3||(v===2&&vida[k]))?1:0;}
    vida=n; if(!vida.some(x=>x)) semearVida(); }
  if(S.efeito==='chuva'){ if(Math.random()<0.5*S.vel) chuva.push({c:Math.floor(Math.random()*C),y:0,v:6+Math.random()*10});
    chuva.forEach(g=>g.y+=g.v/60*S.vel); chuva=chuva.filter(g=>g.y<R+6); }
  const umk=Math.floor(T*4)%N;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    const k=r*C+c, u=c/(C-1||1), v=r/(R-1||1);
    switch(S.efeito){
      case 'grade': set(k,cor,(r+c)%2?0.25:1); break;
      case 'branco': set(k,cor); break;
      case 'bordas': if(r===0||c===0||r===R-1||c===C-1) set(k,cor); break;
      case 'varredura': { const fase=Math.floor(T*6)%(R+C); if(fase<R? r===fase : c===fase-R) set(k,cor); break; }
      case 'umporum': if(k===umk) set(k,cor); break;
      case 'cantos4': { const cs=[[0,0,[1,0,0]],[C-1,0,[0,1,0]],[C-1,R-1,[0,0,1]],[0,R-1,[1,1,0]]];
        for(const [cc,rr,co] of cs) if(Math.abs(c-cc)<=1&&Math.abs(r-rr)<=1) set(k,co); if(r===Math.floor(R/2)&&c===Math.floor(C/2)) set(k,[1,1,1]); break; }
      case 'onda': { const d=Math.hypot(c-C/2,(r-R/2)); set(k,cor,0.5+0.5*Math.sin(d*0.6-T*3)); break; }
      case 'cintilar': { const f=ruido(c,r); set(k,cor,Math.pow(0.5+0.5*Math.sin(T*(1+f*3)+f*50),8)); break; }
      case 'plasma': { const s=Math.sin(u*6+T)+Math.sin(v*5-T*1.3)+Math.sin((u+v)*4+T*.7)+Math.sin(Math.hypot(u-.5,v-.5)*10-T*2);
        set(k,hsv((s/8+T*.05)%1+1,0.8,1)); break; }
      case 'vida': if(vida[k]) set(k,cor); break;
      case 'desenhar': if(pintura[k]) set(k,cor); break;
      case 'fogo': { const h=calor[k]; set(k,[Math.min(1,h*2.2),Math.max(0,Math.min(1,h*2.2-0.9)),Math.max(0,h*2.2-1.7)]); break; }
      case 'espiral': { const ang=Math.atan2(r-R/2+.5,c-C/2+.5), d=Math.hypot(c-C/2+.5,r-R/2+.5);
        set(k,hsv(((ang/Math.PI+1)/2+T*.05)%1,0.85,Math.pow(0.5+0.5*Math.sin(ang*3+d*0.55-T*3),2))); break; }
      case 'respirar': set(k,cor,0.08+0.92*(0.5-0.5*Math.cos(T*1.2))); break;
      case 'madeira': { const f=ruido(c,r), m=0.5+0.5*Math.sin(T*(0.3+f*0.7)+f*40); set(k,hsv(0.03+f*0.06,0.85,0.15+0.85*m*m)); break; }
      case 'raio': { const ph=((T*0.25)%1.6)-0.3, x=u*0.75+v*0.25; set(k,cor,Math.exp(-Math.pow(x-ph,2)*90)); break; }
      case 'espectro': { if(!bandas) { set(k,cor,(r===R-1)?0.3:0); break; } const alt=bandas[c]*R; const lin=R-1-r;
        if(lin<alt) set(k,hsv(0.33-0.33*(lin/(R-1)),0.9,Math.min(1,alt-lin))); break; }
      case 'vu': { const d=Math.hypot(c-C/2+.5,(r-R/2+.5)), lim=nivel*Math.hypot(C,R)/2*1.4;
        if(d<lim) set(k,hsv(0.33-0.33*Math.min(1,d/(Math.hypot(C,R)/2)),0.9,Math.min(1,lim-d))); break; }
      case 'pulso': { const d=Math.hypot(c-C/2+.5,(r-R/2+.5)); let m=nivel*0.25;
        for(const o of ondas) m+=o.f*Math.max(0,1-Math.abs(d-o.r)/1.6)*Math.max(0,1-o.r/(Math.hypot(C,R)/2));
        set(k,cor,Math.min(1,m)); break; }
      case 'texto': set(k,cor,txt[k*4]/255); break;
    }
  }
  if(S.efeito==='chuva') chuva.forEach(g=>{ for(let i=0;i<5;i++){ const r=Math.floor(g.y)-i; if(r>=0&&r<R){ const k=r*C+g.c; const m=1-i/5; px[k*3]=Math.max(px[k*3],cor[0]*m*b*255);px[k*3+1]=Math.max(px[k*3+1],cor[1]*m*b*255);px[k*3+2]=Math.max(px[k*3+2],cor[2]*m*b*255);} } });
  if(S.efeito==='midia' && midia){ const fw=midia.videoWidth||midia.naturalWidth, fh=midia.videoHeight||midia.naturalHeight;
    if(fw&&fh){ const d=amostrar(midia,fw,fh,C,R,false); for(let k=0;k<N;k++){px[k*3]=d[k*4]*b;px[k*3+1]=d[k*4+1]*b;px[k*3+2]=d[k*4+2]*b;} } }
  if(S.efeito==='camera' && video && video.readyState>=2){
    if(!S.camCongelar || !camUlt || camUlt.length!==N*4){
      // recorte com o mesmo formato do quadro (30×24), zoom no centro
      const fw=video.videoWidth, fh=video.videoHeight, e=Math.max(C/fw,R/fh)*S.camZoom, w=fw*e, h=fh*e;
      vcv.width=C; vcv.height=R; vctx.save(); if(S.camEspelho){vctx.translate(C,0);vctx.scale(-1,1);}
      vctx.drawImage(video,(C-w)/2,(R-h)/2,w,h); vctx.restore(); camUlt=vctx.getImageData(0,0,C,R).data; }
    const d=camUlt, ct=S.camContraste;
    for(let k=0;k<N;k++){
      let rr=d[k*4],gg=d[k*4+1],bb=d[k*4+2];
      rr=(rr-128)*ct+128; gg=(gg-128)*ct+128; bb=(bb-128)*ct+128;
      let l=Math.max(0,Math.min(255,0.299*rr+0.587*gg+0.114*bb))/255;
      if(S.camInverter){ l=1-l; rr=255-rr; gg=255-gg; bb=255-bb; }
      let out;
      if(S.camModo==='cor') out=[rr/255,gg/255,bb/255].map(x=>Math.max(0,Math.min(1,x)));
      else if(S.camModo==='mono') out=cor.map(x=>x*l);
      else if(S.camModo==='niveis') out=cor.map(x=>x*Math.round(l*3)/3);
      else out=cor.map(x=>x*(l>0.5?1:0));
      px[k*3]=out[0]*b*255; px[k*3+1]=out[1]*b*255; px[k*3+2]=out[2]*b*255;
    }
  }
}

prev.addEventListener('pointerup',()=>pintando=-1);
function celula(ev){ const r=prev.getBoundingClientRect(); const c=Math.floor((ev.clientX-r.left)/r.width*S.cols), l=Math.floor((ev.clientY-r.top)/r.height*S.rows);
  return (c<0||l<0||c>=S.cols||l>=S.rows)?-1:l*S.cols+c; }

function desenharPrev(){
  const C=S.cols,R=S.rows, lado=Math.floor(Math.min(prev.clientWidth/C, 420/R));
  const W=C*lado,H=R*lado, d=devicePixelRatio||1;
  if(prev.width!==W*d){ prev.width=W*d; prev.height=H*d; }
  prev.style.maxWidth=W+'px';
  pctx.setTransform(d,0,0,d,0,0); pctx.fillStyle='#000'; pctx.fillRect(0,0,W,H);
  const g=Math.max(1,lado*0.08);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){ const i=(r*C+c)*3;
    pctx.fillStyle=`rgb(${px[i]},${px[i+1]},${px[i+2]})`;
    if(px[i]+px[i+1]+px[i+2]===0) pctx.fillStyle='#14100c';
    pctx.fillRect(c*lado+g/2,r*lado+g/2,lado-g,lado-g); }
  if(S.efeito==='umporum'){ const k=Math.floor((performance.now()-t0)/1000*S.vel*4)%(C*R); $('info').textContent=`${C} × ${R} = ${C*R} pixels · aceso: coluna ${k%C+1}, linha ${Math.floor(k/C)+1}`; }
}
function desenharMini(){
  const w=mini.clientWidth, h=Math.round(w*9/16), d=devicePixelRatio||1;
  if(mini.width!==w*d){ mini.width=w*d; mini.height=h*d; mini.style.height=h+'px'; }
  desenhar(mctx,mini.width,mini.height,px,{sempreCantos:true,raio:9*d,linha:1.5*d});
}
ui();
(function loop(now){
  const t=(now-t0)/1000;
  calcular(t);
  canal&&canal.postMessage({tipo:'quadro',px});
  desenharPrev(); desenharMini();
  requestAnimationFrame(loop);
})(performance.now());
}
</script>
