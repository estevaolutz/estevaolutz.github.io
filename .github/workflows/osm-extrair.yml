name: extrair OSM (temporário)
on:
  push:
    branches: [osm-extrair]
    paths: [".github/workflows/osm-extrair.yml"]
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -fsS -m 400 --data-urlencode data@onibus-rio/build/trilhos.overpassql "$u" -o bruto.json && python3 -c "import json;d=json.load(open('bruto.json'));print(len(d['elements']))" && break
          done
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bruto.json && git commit -m "bruto" && git push
