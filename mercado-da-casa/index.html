<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado da Casa</title>
<meta name="theme-color" content="#2c7a4b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f1f4ee;--card:#fff;--ink:#1b2620;--muted:#66746b;--line:#dbe2d7;--accent:#2c7a4b}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1b231f;--ink:#e7eee8;--muted:#97a69c;--line:#2c3832;--accent:#4fb37a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:420px;width:100%;text-align:center}
img{width:88px;height:88px;border-radius:22px}
h1{font-size:28px;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 22px}
a.b{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:16px}
.dica{margin-top:26px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--muted)}
.dica b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <img src="icone-192.png" alt="">
  <h1>Mercado da Casa</h1>
  <p>A lista de compras compartilhada da família. Abrindo no Claude…</p>
  <a class="b" id="ir" href="https://claude.ai/artifact/VGFJQbVsy2cV7bpCPy2Usd">Abrir a lista</a>
  <div class="dica"><b>Para ter no celular como app:</b> abra esta página no navegador e use “Adicionar à tela inicial”. A lista abre no Claude com a sua conta, e tudo o que alguém marcar aparece para todos.</div>
</main>
<script>
// Abre a lista direto, a não ser que a pessoa tenha voltado para cá
if(!sessionStorage.getItem("mc-voltou")){sessionStorage.setItem("mc-voltou","1");setTimeout(()=>location.href=document.getElementById("ir").href,600)}
</script>
</body>
</html>
