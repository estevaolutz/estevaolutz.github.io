<style>
:root{--bg:#000;--panel:#0d0c0bf0;--panel2:#1a1714;--line:#2e281f;--text:#ece4d4;--dim:#9d927f;--gold:#d9a84b;

.ui{transition:opacity .6s}

.btn.gold{background:var(--gold);color:#1a1307;border-color:var(--gold);font-weight:600}
select{background:#0009;border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:330px;min-width:0}

  transform:translateX(calc(100% + 20px));transition:transform .3s, opacity .6s;backdrop-filter:blur(8px)}

  border-radius:14px;padding:6px;width:min(620px,calc(100vw - 150px));z-index:5;backdrop-filter:blur(6px)}

  <section><h3>Cores</h3>
    <div class="row"><label>Cada cor é</label><select id="cor">
      <option value="lados">um lado (pretas × brancas)</option>
      <option value="tempo">um momento da partida (abertura → fim)</option>
      <option value="regiao">uma região do tabuleiro</option></select></div>
    <div class="row"><label>Fios de luz</label><select id="fio">
      <option value="resposta">lance → resposta (os lados se misturam)</option>

  </section>
  <section><h3>Pincel e luz</h3>
    <div class="row"><label>Brilho</label><input type="range" id="brilho" min="0.3" max="2.2" step="0.05"><span class="val" id="vBrilho"></span></div>
    <div class="row"><label>Traço</label><input type="range" id="traco" min="0.4" max="2.6" step="0.05"><span class="val" id="vTraco"></span></div>
    <div class="row"><label>Rastro</label><input type="range" id="rastro" min="0" max="1" step="0.01"><span class="val" id="vRastro"></span></div>
    <label class="check"><input type="checkbox" id="grade"> mostrar a grade fantasma do goban</label>
    <label class="check"><input type="checkbox" id="hudOn"> mostrar lances e nomes na tela</label>
  </section>
  <section><h3>Relógio</h3>
    <label class="check"><input type="checkbox" id="relogioOn"> ritmo pelo tempo que cada jogador pensou</label>
    <div class="row"><label>Peso</label><input type="range" id="relogio" min="0.2" max="1.2" step="0.05"><span class="val" id="vRelogio"></span></div>
    <p class="small" id="clkInfo"></p>
  </section>
  <section><h3>Som</h3>
    <label class="check"><input type="checkbox" id="somOn"> tocar a partida</label>
    <div class="row"><label>Andamento</label><input type="range" id="bpm" min="30" max="200" step="1"><span class="val" id="vBpm"></span></div>
    <div class="row"><label>Escala</label><select id="scale"></select></div>
    <div class="row"><label>Volume</label><input type="range" id="vol" min="0" max="1.2" step="0.01"></div>
    <div class="row"><label>Espaço</label><input type="range" id="espaco" min="0" max="1" step="0.01"></div>
    <label class="check"><input type="checkbox" id="acomp"> sino do templo e shō ao longe</label>

  <section><h3>Pintura</h3>

</div>

  <div class="acts"><button class="btn" id="bFile">Abrir arquivo…</button><span style="flex:1"></span><button class="btn" id="bCancel">Cancelar</button><button class="btn gold" id="bPasteOk">Carregar</button></div>
</div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(s){ s=String(s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let s=seed|0||1;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
const hsl=(c,a,dl=0)=>`hsla(${c[0]},${c[1]}%,${Math.min(100,c[2]+dl)}%,${a})`;


/* ================= Go ================= */
const COLS='ABCDEFGHJKLMNOPQRSTUVWXYZ';
const SCALES={yo:[0,2,5,7,9],in:[0,1,5,7,8],hirajoshi:[0,2,3,7,8],kumoi:[0,2,3,7,9],iwato:[0,1,5,6,10],ryukyu:[0,4,5,7,11],gong:[0,2,4,7,9],shang:[0,2,5,7,10],yu:[0,3,5,7,10]};
const SCALE_NOMES={yo:'Yo — japonesa, serena',in:'In / Miyako-bushi — japonesa, melancólica',hirajoshi:'Hirajōshi — afinação do koto',kumoi:'Kumoi — japonesa',iwato:'Iwato — japonesa, sombria',ryukyu:'Ryūkyū — Okinawa',gong:'Gōng — chinesa',shang:'Shāng — chinesa',yu:'Yǔ — chinesa'};
const CHAVE='go-de-luz';
const S=Object.assign({bpm:44,scale:'yo',tonic:50,vol:.85,espaco:.7,acomp:true,prep:true,tecnica:'nanquim',fundo:'xuan',relogioOn:true,relogio:.7,oriental:true,harm:true,withVars:false,cor:'lados',fio:'resposta',paleta:'indigo',brilho:1,traco:1,rastro:1,grade:false,hud:true,som:true,assina:true},loadPrefs());
let UNITS=20,game=null;

function decodeSGF(buf){
  const bytes=new Uint8Array(buf);let head='';for(let i=0;i<Math.min(bytes.length,4000);i++)head+=String.fromCharCode(bytes[i]);
  const m=head.match(/CA\s*\[([^\]]+)\]/i);const tries=[m&&m[1].trim(),'utf-8','gb18030','shift_jis','euc-kr','windows-1252'].filter(Boolean);
  for(const lab of tries){ try{ const t=new TextDecoder(lab,{fatal:lab==='utf-8'}).decode(bytes);if(!/\uFFFD/.test(t)||lab==='windows-1252')return t; }catch(e){} }
  return new TextDecoder().decode(bytes);
}
function parseSGF(txt){
  let i=0;const n=txt.length,roots=[];
  const skip=()=>{while(i<n&&/\s/.test(txt[i]))i++;};
  function readValue(){ i++;let v='';while(i<n&&txt[i]!==']'){ if(txt[i]==='\\'){i++;if(txt[i]==='\n'||txt[i]==='\r'){i++;if(txt[i]==='\n'&&txt[i-1]==='\r')i++;continue;}} v+=txt[i++]; } i++;return v; }
  function readTree(parent){
    i++;let last=parent,first=null;
    while(i<n){
      skip();const ch=txt[i];
      if(ch===';'){ i++;const node={props:{},children:[],parent:last};
        while(true){ skip();const m=/^[A-Za-z]+/.exec(txt.slice(i,i+20));if(!m)break;i+=m[0].length;const id=m[0].replace(/[a-z]/g,'');
          skip();const vals=[];while(txt[i]==='['){vals.push(readValue());skip();} if(id)(node.props[id]=node.props[id]||[]).push(...vals); }
        if(last)last.children.push(node);if(!first)first=node;last=node; }
      else if(ch==='('){ const sub=readTree(last);if(!last&&sub)roots.push(sub); }
      else if(ch===')'){ i++;return first; }
      else i++;
    }
    return first;
  }
  while(i<n){ skip();if(txt[i]==='('){const r=readTree(null);if(r&&!roots.includes(r))roots.push(r);} else i++; }
  return roots;
}
function sgfOut(root){
  const esc=v=>v.replace(/\\/g,'\\\\').replace(/]/g,'\\]');
  const node=p=>';'+Object.entries(p).map(([k,vs])=>k+vs.map(v=>'['+esc(v)+']').join('')).join('');
  function tree(nd){ let s='(',cur=nd;while(true){s+=node(cur.props);if(cur.children.length===1){cur=cur.children[0];continue;}
    cur.children.forEach(c=>s+=tree(c));break;} return s+')'; }
  return tree(root);
}

/* ================= Regras do go ================= */
function neighbors(i,N){ const x=i%N,y=(i/N)|0,r=[];if(x>0)r.push(i-1);if(x<N-1)r.push(i+1);if(y>0)r.push(i-N);if(y<N-1)r.push(i+N);return r; }
function groupOf(b,N,i){ const c=b[i],st=[i],seen=new Set([i]),libs=new Set();
  while(st.length){const j=st.pop();for(const k of neighbors(j,N)){ if(b[k]===0)libs.add(k);else if(b[k]===c&&!seen.has(k)){seen.add(k);st.push(k);} }}
  return {stones:[...seen],libs}; }
function ptOf(s,N){ if(!s||s.length<2)return -1;const x=s.charCodeAt(0)-97,y=s.charCodeAt(1)-97;if(x<0||y<0||x>=N||y>=N)return -1;return y*N+x; }
function ptsOf(vals,N){ const out=[];for(const v of vals){ if(v.includes(':')){const[a,b]=v.split(':');const x0=a.charCodeAt(0)-97,y0=a.charCodeAt(1)-97,x1=b.charCodeAt(0)-97,y1=b.charCodeAt(1)-97;
  for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)if(x<N&&y<N)out.push(y*N+x);} else {const p=ptOf(v,N);if(p>=0)out.push(p);} } return out; }
const coordName=(p,N)=>p<0?'passa':COLS[p%N]+(N-((p/N)|0));

/* ================= Jogo: árvore de posições ================= */
function buildGame(sroot){
  const P=sroot.props,szs=(P.SZ&&P.SZ[0])||'19',N=clamp(parseInt(szs)||19,2,25);
  const G={N,props:P,nodes:[],root:null,lanes:1};
  const info=k=>(P[k]&&P[k][0])||'';
  G.headers={black:info('PB')||'Pretas',white:info('PW')||'Brancas',br:info('BR'),wr:info('WR'),result:info('RE'),date:info('DT'),event:info('EV'),place:info('PC'),
    name:info('GN'),komi:info('KM'),ha:info('HA'),rules:info('RU'),gc:info('GC')};
  const laneEnd=[];
  function mk(sn,parent){
    const p=sn.props,b=parent?parent.board.slice():new Int8Array(N*N),pr=parent?parent.pris.slice():[0,0];
    (p.AE?ptsOf(p.AE,N):[]).forEach(i=>b[i]=0);(p.AB?ptsOf(p.AB,N):[]).forEach(i=>b[i]=1);(p.AW?ptsOf(p.AW,N):[]).forEach(i=>b[i]=2);
    const nd={id:G.nodes.length,props:p,parent,children:[],board:b,pris:pr,color:0,pt:-1,captured:[],atari:[],ko:false,friends:[],diag:[],groupSize:0,libs:0,
      depth:parent?parent.depth:0,lane:0,vlevel:0,annot:'',comment:(p.C&&p.C[0])||'',setup:!!(p.AB||p.AW||p.AE)};
    const mv=p.B?['B',1]:p.W?['W',2]:null;
    if(mv){ nd.color=mv[1];nd.depth++;const v=p[mv[0]][0];let pt=ptOf(v,N);if(v==='tt'&&N<=19)pt=-1;nd.pt=pt;
      if(pt>=0){ const c=mv[1],o=3-c;
        if(b[pt]!==0){ b[pt]=0; }
        b[pt]=c;
        for(const k of neighbors(pt,N)){ if(b[k]===o){const g=groupOf(b,N,k);if(g.libs.size===0){g.stones.forEach(s=>{b[s]=0;nd.captured.push(s);});}} }
        let g=groupOf(b,N,pt);
        if(g.libs.size===0){ g.stones.forEach(s=>{b[s]=0;nd.captured.push(s);});pr[o-1]+=g.stones.length;nd.suicide=true; }
        else{ pr[c-1]+=nd.captured.length;nd.groupSize=g.stones.length;nd.libs=g.libs.size;
          const at=new Set();for(const k of neighbors(pt,N)){ if(b[k]===o){const og=groupOf(b,N,k);if(og.libs.size===1)og.stones.forEach(s=>at.add(s));}} nd.atari=[...at];
          nd.ko=nd.captured.length===1&&g.stones.length===1&&g.libs.size===1;
          nd.selfAtari=g.libs.size===1&&!nd.ko;
          nd.friends=neighbors(pt,N).filter(k=>b[k]===c);
          const x=pt%N,y=(pt/N)|0;[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([dx,dy])=>{const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N&&b[Y*N+X]===c)nd.diag.push(Y*N+X);}); } }
      if(p.MN)nd.depth=parseInt(p.MN[0])||nd.depth; }
    nd.annot=p.TE?'!':p.BM?'?':p.IT?'!?':p.DO?'?!':'';
    G.nodes.push(nd);return nd;
  }
  // percurso em profundidade com pilha explícita
  const root=mk(sroot,null);G.root=root;laneEnd[0]=1e9;
  const chainEnd=sn=>{let d=0,c=sn;while(c){if(c.props.B||c.props.W)d++;c=c.children[0];}return d;};
  const stack=[[sroot,root]];
  while(stack.length){
    const [sn,nd]=stack.pop();
    sn.children.forEach((sc,k)=>{
      const ch=mk(sc,nd);nd.children.push(ch);

const TINTA=()=>S.tecnica!=='luz';

let RUN=[];

  const r=.07+.42*(W8(node)-.42)/.58;s.pool={at:pa.at,hsl:pa.hsl,r,seed:hash('pool'+node.id)};

/* ---------- linha do tempo ---------- */
const stepMs=()=>60000/S.bpm;
/* ---------- relógio da partida: quanto tempo cada jogador pensou em cada lance ---------- */
const CLOCK={has:false,med:60,n:0};
function hms(t){ return String(t).split(':').map(Number).reduce((a,b)=>a*60+b,0); }
function prepClock(nodes){
  const ts=nodes.map(n=>n.think).filter(t=>t!=null&&t>=0);
  CLOCK.n=ts.length;CLOCK.has=ts.length>=Math.max(4,nodes.length*.5);
  const pos=ts.filter(t=>t>0).sort((a,b)=>a-b);CLOCK.med=Math.max(5,pos.length?pos[Math.floor(pos.length/2)]:60);
  CLOCK.max=pos.length?pos[pos.length-1]:60;
  nodes.forEach(n=>{ n.weight=CLOCK.has&&n.think!=null?clamp(Math.log2(1+n.think/CLOCK.med)/3.2,0,1):.4;
    n.press=n.left!=null&&CLOCK.has?clamp(1-n.left/600,0,1):0; });
  drawTimeline();
}
const useClock=()=>CLOCK.has&&S.relogioOn;
const W8=n=>useClock()&&n?n.weight:.4;          // peso do pensamento: 0 = lance instantâneo, 1 = reflexão muito longa
const PRESS=n=>useClock()&&n?n.press:0;         // aperto de tempo: relógio abaixo de 10 minutos
function gapFor(node){ const base=stepMs();if(!node||!useClock()||node.think==null)return base;
  return base*clamp(Math.pow(Math.max(.02,node.think/CLOCK.med),S.relogio),.22,7); }
function fmtT(t){ t=Math.round(t);if(t<60)return t+' s';const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min${s&&m<10?' '+s+' s':''}`; }
function clockLine(n){ if(!n||!CLOCK.has)return ''; const a=[];if(n.think!=null)a.push(n.think<3?'jogou na hora':'pensou '+fmtT(n.think));if(n.left!=null)a.push('restam '+fmtT(n.left)+' no relógio');return a.join(' · '); }

function drawTimeline(){
  const c=$('#tline');if(!c)return;const w=c.clientWidth||300,h=c.clientHeight||18,g=c.getContext('2d');c.width=w*2;c.height=h*2;g.scale(2,2);g.clearRect(0,0,w,h);

  const mx=Math.log2(1+CLOCK.max/CLOCK.med)||1;
  SEQ.forEach((n,i)=>{ if(n.think==null)return;const x=(i+.5)/SEQ.length*w,v=Math.log2(1+n.think/CLOCK.med)/mx;
    g.fillStyle=n.press>.01?`rgba(230,90,60,${.5+.5*n.press})`:(i%2?'rgba(120,170,230,.8)':'rgba(230,190,110,.8)');g.fillRect(x-.6,h-v*h,1.2,Math.max(1,v*h)); });
}

function resetTo(k){

  pctx.setTransform(1,0,0,1,0,0);pctx.globalCompositeOperation='source-over';pctx.clearRect(0,0,paint.width,paint.height);

}

  $('#who').innerHTML=S.hud?INFO.who+(INFO.meta?`<small>${INFO.meta}</small>`:''):'';

/* ---------- áudio: piano calmo (Satie / Cage) — tudo agendado no relógio do áudio, sem setTimeout ---------- */
let AC=null,MASTER=null,DRY=null,WET=null,ACOMP=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function makeIR(sec){
  const r=AC.sampleRate,n=Math.floor(sec*r),b=AC.createBuffer(2,n,r);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<n;i++){ const t=i/n;lp=lp*.55+(Math.random()*2-1)*.45;d[i]=lp*Math.pow(1-t,2.6)*(i<r*.012?i/(r*.012):1); } }
  return b;
}
function ensureAudio(){
  if(!S.som)return;
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain();MASTER.gain.value=S.vol;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=2.5;comp.attack.value=.02;comp.release.value=.4;
    DRY=AC.createGain();WET=AC.createGain();const rev=AC.createConvolver();rev.buffer=makeIR(4.6);
    const pre=AC.createDelay(.2);pre.delayTime.value=.035;
    DRY.connect(MASTER);WET.connect(pre);pre.connect(rev);rev.connect(MASTER);MASTER.connect(comp);comp.connect(AC.destination);
    setSpace();
  }
  if(AC.state==='suspended')AC.resume();
}
function setSpace(){ if(!AC)return; DRY.gain.value=1-S.espaco*.55;WET.gain.value=S.espaco*1.1;MASTER.gain.value=S.vol; }
/* uma nota de piano: parciais levemente inarmônicos, martelo suave, decaimento longo.
   prep = piano preparado (Cage): parafuso entre as cordas → parciais tortos, som curto e de madeira */
function pianoNote(midi,t,vel,dur,pan,prep){
  if(!AC)return; vel=clamp(vel,0,1);if(vel<=0)return;
  const f=mtof(midi),out=AC.createGain(),pn=AC.createStereoPanner?AC.createStereoPanner():null,lp=AC.createBiquadFilter();
  lp.type='lowpass';const cut=Math.min(9000,f*(prep?3:5)+600+vel*2600);lp.frequency.setValueAtTime(cut,t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.5,300),t+dur*.8);lp.Q.value=.3;

  if(pn){ pn.pan.value=clamp(pan||0,-1,1);lp.connect(pn);pn.connect(DRY);pn.connect(WET); } else { lp.connect(DRY);lp.connect(WET); }
  const parts=prep?[[1,1,.5],[2.31,.55,.32],[3.87,.35,.2],[5.42,.22,.12],[7.3,.12,.06]]
                  :[[1,1,1],[2,.38,.62],[3,.16,.42],[4,.07,.3],[5,.04,.22],[6,.02,.16]];
  const B=.00035,low=midi<55?1.5:1,end=t+dur*(prep?.45:1)+.1;
  for(const [n,a,tc] of parts){
    const fr=prep?f*n:f*n*Math.sqrt(1+B*n*n);if(fr>16000)continue;
    const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=fr;
    if(!prep&&n===1){ const o2=AC.createOscillator();o2.frequency.value=fr*1.0012;const g2=AC.createGain();g2.gain.value=.5;o2.connect(g2);g2.connect(g);o2.start(t);o2.stop(end); }
    const tau=(prep?.18:1.25)*tc*low*dur/3;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+(prep?.003:.006));g.gain.setTargetAtTime(0,t+.01,Math.max(.05,tau));
    o.connect(g);g.connect(out);o.start(t);o.stop(end);
  }
  // martelo: um sopro de ruído muito curto
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*.04),AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,3);
  const ns=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();ns.buffer=nb;bp.type='bandpass';bp.frequency.value=Math.min(6000,f*(prep?2:4));bp.Q.value=prep?3:1.2;
  ng.gain.value=(prep?.5:.12)*vel;ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start(t);
}
function soundMove(node){
  if(!AC)return; const ev=quietMove(node),t0=AC.currentTime+.04;
  const w=W8(node),kv=useClock()?.7+.6*w:1,kd=useClock()?.45+1.1*w:1;
  ev.forEach(e=>playInst(e.inst,e.midi,t0+(e.t||0),e.vel*kv,(e.dur||4.5)*kd,e.pan||0,e.prep&&S.prep));
  if(useClock()&&w>.78&&ev[0]) pianoNote(ev[0].midi-19,t0+.03,.16,8,e0pan(ev),false);   // reflexão longa: um grave que segura a decisão
  if(typeof ambient==='function'){ if(S.acomp)ambient(node,t0); }
  else if(S.acomp){ ACOMP++; if(ACOMP%2===1){ const ch=accompChord(node),beat=stepSec();
      pianoNote(ch.bass,t0,.2,7,-.15,false);
      ch.notes.forEach((m,i)=>pianoNote(m,t0+beat*.5+i*.012,.09,6,.1+i*.05,false)); } }
}
const stepSec=()=>60/S.bpm;
function degToMidi(deg,base){ const sc=SCALES[S.scale],n=sc.length; const o=Math.floor(deg/n),i=((deg%n)+n)%n; return base+o*12+sc[i]; }
/* acompanhamento à maneira das Gymnopédies: baixo e acorde de sétima, alternando dois graus; quem está na frente escolhe a cor */
function accompChord(node){
  const bal=balanceOf(node),k=Math.floor(ACOMP/2)%2,t=S.tonic-12;
  const roots=bal<-.5?[9,2]:[0,5],r=roots[k],q=bal<-.5?[3,7,10]:[4,7,11];
  return {bass:t-12+r,notes:q.map(i=>t+r+i)};
}

function e0pan(ev){ return ev[0]&&ev[0].pan||0; }
/* enquanto o próximo jogador pensa: silêncio. Se o relógio dele está apertado (menos de 10 min), um tique-taque de piano preparado, cada vez mais rápido */
function scheduleWait(node,sec){
  if(!AC||!S.som||!node||!useClock())return; const p=PRESS(node);if(p<=0||sec<.3)return;
  const per=.95-.6*p,t0=AC.currentTime+.15;let k=0;
  for(let t=per*.5;t<sec-.1&&k<40;t+=per,k++) S.oriental?playInst('moku',84+(k%2?0:3),t0+t,.06+.12*p,.2,(k%2?-.5:.5)):pianoNote(96+(k%2?0:2),t0+t,.05+.1*p,.4,(k%2?-.5:.5),true);
}

/* ---------- instrumentos orientais ---------- */
function playInst(inst,midi,t,vel,dur,pan,prep){
  switch(inst){
    case 'koto': return pluck(midi,t,vel,dur,pan,.996,.5,true);
    case 'qin': return pluck(midi,t,vel,dur,pan,.9985,.22,false,true);
    case 'shaku': return shaku(midi,t,vel,dur,pan);
    case 'rin': return bell(midi,t,vel,dur,pan,[1,2.71,5.12,8.43],[1,.45,.22,.1]);

function bindCheck(id,key,fn){ const el=$('#'+id);el.checked=!!S[key];el.onchange=()=>{ S[key]=el.checked;savePrefs();fn&&fn(); }; }
function initUI(){
  const pal=$('#paleta');Object.entries(PALETAS).forEach(([k,p])=>{const o=document.createElement('option');o.value=k;o.textContent=p.nome;pal.appendChild(o);});
  if(!PALETAS[S.paleta])S.paleta=Object.keys(PALETAS)[0];
  pal.value=S.paleta;pal.onchange=()=>{S.paleta=pal.value;refreshLook();};
  const cor=$('#cor');if(![...cor.options].some(o=>o.value===S.cor))S.cor=cor.options[0].value;cor.value=S.cor;cor.onchange=()=>{S.cor=cor.value;refreshLook();};
  const fio=$('#fio');if(fio){fio.value=S.fio;fio.onchange=()=>{S.fio=fio.value;refreshLook();};}
  const sc=$('#scale');scaleOptions().forEach(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;sc.appendChild(o);});
  if(!SCALES[S.scale])S.scale=Object.keys(SCALES)[0];sc.value=S.scale;sc.onchange=()=>{S.scale=sc.value;savePrefs();};
  bindRange('brilho','brilho',v=>v.toFixed(2));bindRange('traco','traco',v=>v.toFixed(2));
  bindRange('rastro','rastro',v=>v>=1?'∞':Math.round(v*100)+'%');bindRange('bpm','bpm',v=>Math.round(v));
  bindCheck('grade','grade');bindCheck('hudOn','hud',syncUI);bindCheck('assina','assina');
  bindCheck('somOn','som',()=>{ if(!S.som&&AC)AC.suspend(); else if(S.som)ensureAudio(); });
  bindCheck('acomp','acomp');
  bindCheck('relogioOn','relogioOn',()=>{refreshLook();});
  { const el=$('#relogio');el.value=S.relogio;const vv=$('#vRelogio'),sh=()=>vv.textContent=Math.round(S.relogio*100)+'%';sh();el.oninput=()=>{S.relogio=+el.value;sh();savePrefs();}; }
  addEventListener('resize',drawTimeline);bindCheck('prep','prep');
  for(const [id,key] of [['vol','vol'],['espaco','espaco']]){ const el=$('#'+id);el.value=S[key];el.oninput=()=>{S[key]=+el.value;setSpace();savePrefs();}; }
  for(const [id,key] of [['tecnica','tecnica'],['fundo','fundo']]){ const el=$('#'+id);if(![...el.options].some(o=>o.value===S[key]))S[key]=el.options[0].value;el.value=S[key];
    el.onchange=()=>{S[key]=el.value;if(key==='tecnica'){ const f=(S.oriental?{nanquim:'xuan',aquarela:'xuan',ceramica:'porcelana'}:{tinta:'linho',aquarela:'papel',guache:'papel'})[S.tecnica];if(f){S.fundo=f;$('#fundo').value=f;} } refreshLook();}; }
  bindCheck('vars','withVars',()=>{ if(game)rebuildSeq(); });
  $('#legend').innerHTML=legendHTML();
  $('#bPanel').onclick=()=>{ $('#panel').classList.toggle('open');idleSoon(); };
  $('#bPlay').onclick=()=>playing?stop():play();
  $('#bStart').onclick=()=>{ stop();resetTo(0); };
  $('#bStep').onclick=()=>{ stop();ensureAudio();step(true); };
  $('#scrub').oninput=e=>{ stop();resetTo(+e.target.value); };
  $('#bAll').onclick=()=>{ stop();resetTo(SEQ.length);toast('Partida inteira pintada'); };
  $('#bSave').onclick=savePNG;
  $('#game').onchange=e=>{ stop();selectGame(+e.target.value); };
  $('#bOpen').onclick=()=>$('#pasteM').classList.add('open');
  $('#bCancel').onclick=()=>$('#pasteM').classList.remove('open');
  $('#bFile').onclick=()=>$('#file').click();
  $('#bPasteOk').onclick=()=>{ const t=$('#pasteT').value.trim();if(t&&LOADER.text(t,'Partidas carregadas')){ $('#pasteM').classList.remove('open');stop(); } };
  $('#file').onchange=async e=>{ const f=e.target.files[0];if(f&&await LOADER.file(f)){ $('#pasteM').classList.remove('open');stop(); } e.target.value=''; };
  addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging');});
  addEventListener('dragleave',e=>{ if(!e.relatedTarget)document.body.classList.remove('dragging'); });
  addEventListener('drop',async e=>{ e.preventDefault();document.body.classList.remove('dragging');const f=e.dataTransfer.files[0];if(f){stop();await LOADER.file(f);} });
  addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();playing?stop():play();}
    else if(e.code==='ArrowRight'){stop();ensureAudio();step(false);}
    else if(e.code==='ArrowLeft'){stop();resetTo(idx-1);}
    else if(e.code==='Home'){stop();resetTo(0);}
    else if(e.code==='End'){stop();resetTo(SEQ.length);}
    else if(e.code==='Escape'){$('#panel').classList.remove('open');$('#pasteM').classList.remove('open');}
  });
  addEventListener('resize',resize);resize();requestAnimationFrame(frame);
}
function loadPrefs(){ try{ const o=JSON.parse(localStorage.getItem('prefs2:'+CHAVE)||'{}');return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem('prefs2:'+CHAVE,JSON.stringify(S)); }catch(e){} }
initUI();
start();

</script>
</body>
</html>
