<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="../lib/projecao.js"></script><script src="../lib/gravacao.js"></script><script src="../lib/camera.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dedalus II · Tinta Viva</title>
<style>
:root{--bg:#090b10;--panel:#131722;--bd:#262d3f;--tx:#e8ecf6;--mu:#8e98b0;--ac:#5eead4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(19,23,34,.9);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;max-width:calc(100% - 24px);max-height:calc(100vh - 24px);overflow:auto}
#ui.hide{display:none}
#mainBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
#advTab{width:100%}
#advTab>summary{cursor:pointer;color:var(--mu);padding:2px 0}
#advBody{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
button,select{padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:#1b2131;color:var(--tx);font:inherit;cursor:pointer}
button:hover{background:#252d42}
.vrow{display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px}
.vrow label{color:var(--tx)}
.vrow input[type=range]{width:90px}
.seq-cell{width:28px;padding:7px 0;text-align:center;font-size:11px;font-family:ui-monospace,monospace}
.seq-cell.beat{margin-left:6px}
.seq-cell.on{background:#9f1239;border-color:#fb7185;color:#fff}
.seq-cell.now{outline:2px solid var(--ac);outline-offset:1px}
/* botão para reabrir o painel: semitransparente, só aparece com o painel escondido e some após 3 s sem mexer o mouse */
#showUi{position:fixed;left:12px;top:12px;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(19,23,34,.55)}
#ui:not(.hide) ~ #showUi{display:none}
body.awake #ui.hide ~ #showUi{opacity:.4;pointer-events:auto}
#ui.hide ~ #showUi:hover,#ui.hide ~ #showUi:focus-visible{opacity:1;pointer-events:auto}
#wiz{position:fixed;left:12px;width:min(640px,calc(100% - 24px));display:none;background:rgba(9,11,16,.88);border:1px solid rgba(251,191,36,.7);border-radius:10px;padding:10px 14px;text-align:center;z-index:4;pointer-events:none}
#wiz b{display:block;color:#fbbf24;font-size:15px;margin-bottom:4px}
#wiz .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin:8px 0 6px;overflow:hidden}
#wiz .bar i{display:block;height:100%;width:0;background:#fbbf24}
#wiz small{color:var(--mu);font-size:11px}
#ui label{display:flex;align-items:center;gap:6px;color:var(--mu)}
#gl{z-index:0;background:#000}#cv{z-index:1}
button.on{background:#134e4a;border-color:var(--ac)}
#somBar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;padding-top:8px;border-top:1px solid var(--bd)}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--bd);border-radius:8px}
.grp b{font-size:11px;letter-spacing:.06em;color:var(--mu)}
.grp input[type=range]{width:74px}
button:disabled{opacity:.45;cursor:default}
video{display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<video id="video" playsinline muted></video>
<div id="ui">
  <div id="mainBar">
    <b style="letter-spacing:.08em">DEDALUS II · TINTA VIVA</b>
    <button id="bCam">Ligar câmera</button>
    <button id="bWiz" disabled title="Identifica cada mão: distância · mão esquerda · mão direita (tecla G)">Identificar mãos</button>
    <button id="bCalD" disabled title="Alcance da mão direita: alto, baixo, dentro, fora, perto, longe, aberta, fechada (tecla M)">Calibrar mão direita</button>
    <button id="bCalE" disabled title="Alcance da mão esquerda, espelhado (tecla L)">Calibrar mão esquerda</button>
    <button id="bPzD" disabled title="Pinças da mão direita: aberta, depois indicador, médio, anelar, mínimo (tecla P)">Pinças D</button>
    <button id="bPzE" disabled title="Pinças da mão esquerda (tecla O)">Pinças E</button>
    <label><input type="checkbox" id="cHud" checked> Leituras</label>
    <label><input type="checkbox" id="cMirror" checked> Espelhar</label>
    <label title="Opacidade da imagem da câmera">Câmera <input id="rCamA" type="range" min="0" max="1" step=".05" value=".1"></label>
    <label>Modelo de pose <select id="selPose"><option value="lite">lite</option><option value="full" selected>full</option><option value="heavy">heavy</option></select></label>
    <label><input type="checkbox" id="cHands" checked> Palma das mãos</label>
    <button id="bHide" title="Esconder o painel (tecla H)">✕</button>
  </div>
  <div id="somBar">
    <button id="bSom" title="Liga/desliga o som (tecla S)">Ligar som</button>
    <span class="grp"><b style="color:#fb7185">BAIXO PROPHET</b>
      <label>Timbre <select id="bxTimbre"><option value="0">1 · Serra clássica</option><option value="1">2 · Pulso redondo</option><option value="2">3 · Sync (poly-mod)</option></select></label>
      <label title="Registro do baixo">Oitava <select id="bxOit"><option value="-2">−2</option><option value="-1">−1</option><option value="0" selected>0</option><option value="1">+1</option><option value="2">+2</option></select></label>
      <label>Volume <input id="bxVol" type="range" min="0" max="1" step=".01" value=".8"></label>
      <label title="Corte do filtro com a mão direita toda para a DIREITA (perto do corpo = 4 oitavas abaixo)">Cutoff <input id="bxCut" type="range" min="200" max="12000" step="10" value="3200"></label>
      <label>Resson. <input id="bxRes" type="range" min="0" max="1" step=".01" value=".25"></label>
      <label title="Quanto o envelope do filtro abre o corte (em oitavas)">Env→filtro <input id="bxEnv" type="range" min="0" max="5" step=".05" value="2.5"></label>
    </span>
    <span class="grp"><b>AMP ADSR</b>
      <label>A <input id="ampA" type="range" min=".001" max="2" step=".001" value=".005"></label>
      <label>D <input id="ampD" type="range" min=".01" max="3" step=".01" value=".3"></label>
      <label>S <input id="ampS" type="range" min="0" max="1" step=".01" value=".7"></label>
      <label>R <input id="ampR" type="range" min=".01" max="4" step=".01" value=".25"></label>
    </span>
    <span class="grp"><b>FILTER ADSR</b>
      <label>A <input id="fltA" type="range" min=".001" max="2" step=".001" value=".005"></label>
      <label>D <input id="fltD" type="range" min=".01" max="3" step=".01" value=".35"></label>
      <label>S <input id="fltS" type="range" min="0" max="1" step=".01" value=".3"></label>
      <label>R <input id="fltR" type="range" min=".01" max="4" step=".01" value=".3"></label>
    </span>
    <span class="grp"><b style="color:#38bdf8">LEAD THEREMIN</b>
      <label>Oitava <select id="ldOit"><option value="-1">−1</option><option value="0" selected>0</option><option value="1">+1</option></select></label>
      <label>Volume <input id="ldVol" type="range" min="0" max="1" step=".01" value=".7"></label>
      <label title="Corte do filtro com a mão esquerda toda para a ESQUERDA">Cutoff <input id="ldCut" type="range" min="300" max="12000" step="10" value="5000"></label>
      <label title="Deslize entre uma nota e a próxima (segundos)">Glide <input id="ldGlide" type="range" min="0" max=".4" step=".005" value="0"></label>
      <label title="Profundidade do vibrato (cents)">Vibrato <input id="ldVib" type="range" min="0" max="40" step="1" value="12"></label>
      <label title="Velocidade do vibrato (Hz)">Vel. vib. <input id="ldVibR" type="range" min="2" max="8" step=".1" value="5.2"></label>
      <label title="Quanto do lead vai para o reverb">Reverb <input id="ldRev" type="range" min="0" max="1" step=".01" value=".4"></label>
    </span>
    <span class="grp"><b>LEAD ADSR</b>
      <label>A <input id="ldA" type="range" min=".001" max="2" step=".001" value=".06"></label>
      <label>D <input id="ldD" type="range" min=".01" max="3" step=".01" value=".4"></label>
      <label>S <input id="ldS" type="range" min="0" max="1" step=".01" value=".8"></label>
      <label>R <input id="ldR" type="range" min=".01" max="4" step=".01" value=".6"></label>
    </span>
    <span class="grp"><b>ARPEJO</b>
      <label>Tônica <select id="sRoot"></select></label>
      <label>Escala <select id="sScale"><option value="dorian">Dórico</option><option value="aeolian">Eólio (menor)</option><option value="ionian">Jônico (maior)</option><option value="mixolydian">Mixolídio</option><option value="lydian">Lídio</option><option value="phrygian">Frígio</option><option value="harmonicMinor">Menor harmônica</option><option value="pentMinor">Pentatônica menor</option></select></label>
      <label>BPM <input id="sBpm" type="range" min="40" max="160" step="1" value="90"><span id="vBpm">90</span></label>
      <label>Padrão <select id="arpPat"><option value="up">Subindo</option><option value="down">Descendo</option><option value="updown">Sobe e desce</option><option value="random">Aleatório</option></select></label>
      <label>Divisão <select id="arpRate"><option value="1">1/16</option><option value="2" selected>1/8</option><option value="4">1/4</option></select></label>
      <label>Oitavas <select id="arpOct"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
      <label><input type="checkbox" id="arpSev" checked> 7ª</label>
      <label title="Duração de cada nota em relação ao passo">Gate <input id="arpGate" type="range" min=".1" max="1.5" step=".05" value=".8"></label>
    </span>
  </div>
</div>
<div id="wiz"><b id="wizT"></b><div id="wizN"></div><div class="bar"><i id="wizB"></i></div><small id="wizS">Esc cancela</small></div>
<button id="showUi" aria-label="Mostrar painel de controle">☰ Painel</button>
<script type="module">
import { FilesetResolver, PoseLandmarker, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15/vision_bundle.mjs';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15/wasm';
const POSE_URL = v => `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${v}/float16/1/pose_landmarker_${v}.task`;
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
/* =====================================================================================================
   DEDALUS II — base de controle (sem som). Mesma detecção da v84 do Dedalus: Pose + palmas, trava de lado
   (direita / esquerda), calibração de alcance por mão e pinças. O motor de som novo entra a partir daqui:
   ele só precisa ler o objeto CTRL (atualizado a cada quadro) e ouvir os eventos de pinça (onPinca).
   ===================================================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const S = { sens: 1.5 };
const HUD = { ab: { 1: null, 2: null } };
/* ---------- Corpo: pontos rastreados (0 cabeça · 1 mão direita · 2 mão esquerda · 3/4 pés, desligados) ---------- */
const LIMBS = [
  { n: 'cabeça', role: 'pad',   c: '#fbbf24', bx: 0,    by: .65 },
  { n: 'mão D',  role: 'bass', c: '#fb7185', bx: .5,  by: .15 },
  { n: 'mão E',  role: 'lead', c: '#38bdf8', bx: -.5,  by: .15 },
  { n: 'pé E',   role: 'bass', c: '#a78bfa', bx: -.25, by: -.65 },
  { n: 'pé D',   role: 'bass', c: '#34d399', bx: .25,  by: -.65 }
].map((l, i) => ({ ...l, on: i === 1 || i === 2, arp: 0, x: l.bx, y: l.by, vx: l.bx, vy: l.by, z: 0, gate: false, speed: 0, idx: 3, pending: false, hot: false, lastHit: 0, vol: .8, lastSeen: -9, out: false, tp: null, tv: { x: 0, y: 0 }, tpT: 0, tz: 0, coastStart: 0 }));
const IDX = [0, 16, 15, 27, 28];   // cabeça, mão D (baixo), mão E (lead), pé E, pé D (MediaPipe Pose)
const cam = { on: false, landmarker: null, stream: null, lm: null, detected: false, msg: '', lastVT: -1, lastTs: -1, zBase: new Array(33).fill(0), zGain: 2.5, zCurve: 1.5, wrist: { 1: 16, 2: 15 }, roll: 0, roll0: 0, rawHands: null, ref0: 0, face: null, mouth: null, mouthOpen: 0, mouthFace: false, zFar: {}, zNearM: {}, hs0: {}, sw0: null, hg: 2.2, hc: { x: 0, y: .35 }, norm: false, hr: 1, ref: null, hands: null, vision: null, useHands: true, handsOut: { 1: null, 2: null }, handPts: { 1: null, 2: null }, tgt: [] };
const video = document.getElementById('video');
const mirror = () => document.getElementById('cMirror').checked;
// recorte "cover" do vídeo na tela: imagem e landmarks usam o mesmo mapeamento (ficam alinhados)
function crop() {
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9, tr = innerWidth / innerHeight, vr = vw / vh;
  return vr > tr ? { vw, vh, sh: vh, sw: vh * tr, sx: (vw - vh * tr) / 2, sy: 0 } : { vw, vh, sw: vw, sh: vw / tr, sx: 0, sy: (vh - vw / tr) / 2 };
}
function camXY(p) {
  const c = crop(); let u = (p.x * c.vw - c.sx) / c.sw; const v = (p.y * c.vh - c.sy) / c.sh;
  if (mirror()) u = 1 - u;
  return { x: clamp(u * 2 - 1, -1, 1), y: clamp(-(v * 2 - 1), -1, 1) };
}
const seen = p => p && (p.visibility ?? 1) > .3;
// Referência do corpo: centro e largura dos ombros (em pixels do vídeo, suavizados). As mãos passam a ser medidas em "larguras de ombro".
function bodyRef(lm) {
  const a = lm[11], b = lm[12];
  if (!seen(a) || !seen(b)) return null;
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const w = Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh);
  if (w < vw * .022) return null;                       // ombros inválidos (longe demais ou mal detectados)
  const cx = (a.x + b.x) / 2 * vw, cy = (a.y + b.y) / 2 * vh, r = cam.ref;
  cam.ref = r ? { w: lerp(r.w, w, .15), cx: lerp(r.cx, cx, .15), cy: lerp(r.cy, cy, .15) } : { w, cx, cy };
  return cam.ref;
}
function bodyXY(p) {
  const r = cam.ref, vw = video.videoWidth || 16, vh = video.videoHeight || 9, k = r.w * 1.7;   // 1,7 largura de ombro ≈ alcance do braço
  const x = (p.x * vw - r.cx) / k * cam.hr * (mirror() ? -1 : 1);
  const y = -((p.y * vh - (r.cy + .6 * r.w)) / k) * cam.hr;   // zero na altura do peito
  return { x: clamp(x, -1, 1), y: clamp(y, -1, 1) };
}
// ---- Centro de cada mão ----
// Preferência: palma do Hand Landmarker (média de pulso + 4 nós dos dedos); sem ele, média dos pontos da mão no Pose (pulso, mindinho, indicador, polegar).
const PALM = [0, 5, 9, 13, 17];
// ---- Travamento de identidade ----
// Cada mão é um ALVO com trilha própria (posição + velocidade). Depois de adquirida, só a continuidade decide quem é quem
// (nunca "esquerda/direita da tela"): as mãos podem cruzar e cada uma continua no seu instrumento.
const imgD = (a, b) => { const vw = video.videoWidth || 16, vh = video.videoHeight || 9; return Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh) / vw; };   // em larguras de imagem
const trackOf = k => (LIMBS[k].tp && performance.now() / 1000 - LIMBS[k].lastSeen < .6) ? LIMBS[k].tp : null;   // última posição aceita (some após .6 s perdida)
const gateOf = k => .10 + 1.5 * clamp(performance.now() / 1000 - LIMBS[k].lastSeen, .03, .6);                    // raio máximo de salto: cresce com o tempo perdido
const palmCenter = h => { let sx = 0, sy = 0; PALM.forEach(j => { sx += h[j].x; sy += h[j].y; }); return { x: sx / PALM.length, y: sy / PALM.length }; };
function predOf(k) {   // onde a mão deve estar agora (última posição + velocidade)
  const tr = trackOf(k); if (!tr) return null;
  const L = LIMBS[k], dt = clamp(performance.now() / 1000 - L.tpT, 0, .3);
  return { x: tr.x + L.tv.x * dt * .8, y: tr.y + L.tv.y * dt * .8 };
}
function poseHandAvg(g, lm) {   // centro da mão no Pose: média de pulso, mindinho, indicador e polegar
  const w0 = cam.wrist[g], ids = [w0, w0 + 2, w0 + 4, w0 + 6], pw = lm[ids[0]];
  if (!seen(pw)) return null;
  let sx = 0, sy = 0, n = 0; ids.forEach(j => { const q = lm[j]; if (seen(q)) { sx += q.x; sy += q.y; n++; } });
  return n >= 2 ? { x: sx / n, y: sy / n, z: pw.z, visibility: pw.visibility ?? 1 } : { x: pw.x, y: pw.y, z: pw.z, visibility: pw.visibility ?? 1 };
}
const zNear = (lm, p) => { let best = null, bd = 9; [15, 16].forEach(j => { const q = lm[j]; if (q) { const d = imgD(p, q); if (d < bd) { bd = d; best = q; } } }); return best ? best.z : 0; };   // Z do pulso mais próximo (não depende do rótulo L/R)
// Profundidade pelo TAMANHO APARENTE: mão/ombros maiores na imagem = mais perto da câmera (muito mais estável que o z do Pose)
const handSize = h => { const d = (a, b) => imgD(h[a], h[b]); return (d(0, 9) + d(0, 5) + d(0, 17) + d(5, 17)) / 4; };
const log2 = x => Math.log(x) / Math.LN2;
function resolveHands(lm, raw) {
  const now = performance.now() / 1000, cands = [];
  ((raw && raw.landmarks) || []).forEach((h, i) => { const c = palmCenter(h), hd = raw.handedness && raw.handedness[i] && raw.handedness[i][0]; cands.push({ kind: 'palm', x: c.x, y: c.y, h, label: hd && hd.categoryName, score: hd ? hd.score : 0 }); });
  // ---- TRAVA DE LADO: cada mão física pertence a UM timbre (direita = baixo · esquerda = lead), nunca aos dois ----
  // 1) a mesma mão detectada duas vezes (palmas sobrepostas) vira uma só
  for (let i = cands.length - 1; i >= 0; i--) for (let j = 0; j < i; j++) if (imgD(cands[i], cands[j]) < .1) { if ((cands[i].score || 0) > (cands[j].score || 0)) cands[j] = cands[i]; cands.splice(i, 1); break; }
  // 2) lado de cada palma: pelo pulso do Pose (anatômico) quando ele está colado na palma; senão pelo rótulo do detector de mãos
  const grpR = cam.wrist[1] === 16 ? 1 : 2;   // grupo da mão DIREITA do performer
  const labSide = l => l === 'Left' ? grpR : l === 'Right' ? 3 - grpR : null;   // vídeo não espelhado: "Left" do detector = mão direita do performer
  cands.forEach(c => {
    let side = null, bd = .09;
    [1, 2].forEach(g => { const w = lm[cam.wrist[g]]; if (w && (w.visibility ?? 1) > .6) { const d = imgD(c.h[0], w); if (d < bd) { bd = d; side = g; } } });
    if (!side && c.score >= .75) side = labSide(c.label);
    c.side = side;
  });
  if (cands.length === 2 && cands[0].side && cands[0].side === cands[1].side) {   // duas palmas com o mesmo lado: na imagem (não espelhada) a direita do performer fica à esquerda
    const [a, b] = cands[0].x < cands[1].x ? [cands[0], cands[1]] : [cands[1], cands[0]]; a.side = grpR; b.side = 3 - grpR;
  }
  cands.forEach(c => { if (c.side) c.grp = c.side; });
  // 3) pulsos do Pose: só servem ao próprio lado, e somem se estiverem em cima de uma palma do OUTRO lado (fantasma da mão que não está na tela)
  [1, 2].forEach(g => {
    const p = poseHandAvg(g, lm); if (!p) return;
    const palms = cands.filter(c => c.kind === 'palm');
    if (palms.some(c => c.side && c.side !== g && imgD(c, p) < .22)) return;
    if ((p.visibility ?? 1) < .7 && palms.some(c => imgD(c, p) < .25)) return;
    cands.push({ kind: 'pose', grp: g, x: p.x, y: p.y, z: p.z, visibility: p.visibility });
  });
  // ---- Modelo do braço (cotovelo): descarta "mãos" que na verdade são o cotovelo ----
  // O Hand Landmarker às vezes vê um cotovelo dobrado como punho, e o Pose pode colar o pulso no cotovelo. Cada braço tem um comprimento de antebraço
  // aprendido (F0, em larguras de imagem; começa em ~0,62 × largura dos ombros). Uma palma bem mais perto do cotovelo que do pulso é rejeitada ANTES da fusão.
  cam.fore = cam.fore || [0, 0];
  const vwv = video.videoWidth || 16, arms = [[15, 13], [16, 14]].map(([w, e], ix) => {
    const E = lm[e], Wp = lm[w], eOk = E && (E.visibility ?? 1) > .5, wOk = seen(Wp), F0 = cam.fore[ix] || (cam.ref ? .62 * cam.ref.w / vwv : .12);
    return { ix, E: eOk ? E : null, W: wOk ? Wp : null, F0, F: eOk && wOk ? imgD(E, Wp) : null };
  });
  const dbg = { rej: [], elbows: arms.filter(a => a.E).map(a => ({ x: a.E.x, y: a.E.y })) };
