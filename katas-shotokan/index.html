<title>Guia de Katas Shotokan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: dojo floor — tabs as wooden name plaques (nafuda), kata cards as seal-stamped tiles, kata page = embusen floor plan beside the kyodo ledger */
:root{
  --bg:#eef0f2;          /* washi grey */
  --paper:#f9fafb;
  --ink:#1b2230;         /* sumi */
  --muted:#5d6676;
  --line:#d3d8e0;
  --tatami:#e2e6ec;
  --ai:#24407a;          /* ai-zome indigo */
  --ai-soft:#dfe5f2;
  --hanko:#b8322a;       /* seal red, kiai only */
  --hanko-soft:#f6e1df;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d;--paper:#171c26;--ink:#e6e9ef;--muted:#98a1b2;--line:#2a3140;--tatami:#1f2531;
  --ai:#8fa9e6;--ai-soft:#1e2a45;--hanko:#e2665b;--hanko-soft:#3a1f1e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d;--paper:#171c26;--ink:#e6e9ef;--muted:#98a1b2;--line:#2a3140;--tatami:#1f2531;
  --ai:#8fa9e6;--ai-soft:#1e2a45;--hanko:#e2665b;--hanko-soft:#3a1f1e;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* header */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 18px;border-bottom:1px solid var(--line)}
.masthead h1{font-size:clamp(26px,4vw,38px);font-weight:900;letter-spacing:.01em}
.masthead h1 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0;flex:0 1 280px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none}
.search svg{flex:none;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:600;font-size:14px;
  padding:9px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:baseline;gap:8px}
.tab .k{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.tab .c{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.tab[aria-selected="true"] .k,.tab[aria-selected="true"] .c{color:var(--paper);opacity:.85}
.grouplede{color:var(--muted);max-width:68ch;margin:14px 0 20px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;text-decoration:none;color:inherit;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ai);transform:translateY(-2px)}
.card .kanji{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1.1;color:var(--ai)}
.card h3{font-size:18px;font-weight:700;margin-top:6px}
.card .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.card .meta b{color:var(--hanko);font-weight:500}
.card svg{width:92px;height:92px}
.card .num{position:absolute;top:10px;right:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0}

/* kata page */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-weight:600;text-decoration:none;font-size:14px}
.katahead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding-block:14px 20px;border-bottom:1px solid var(--line)}
.seal{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,7vw,64px);line-height:1;color:var(--ai);writing-mode:vertical-rl;letter-spacing:.06em}
.katahead h1{font-size:clamp(28px,4.5vw,42px);font-weight:900}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{max-width:68ch;margin:8px 0 0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:999px;background:var(--ai-soft);color:var(--ai)}
.chip.draft{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.chip.kiai{background:var(--hanko-soft);color:var(--hanko)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;margin-top:24px;align-items:start}
.floor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.floor h2{font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.floor h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.floor svg{width:100%;height:auto;max-height:70vh;display:block;margin-top:10px}
.floor .shape{font-weight:600;margin-top:10px}
.floor p{font-size:13px;color:var(--muted);margin:6px 0 0}
.src{font-size:13px;color:var(--muted);margin-top:14px}

.ledger h2{font-size:20px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);width:44px}
td.t{font-weight:600}
tr.kiai{background:var(--hanko-soft)}
tr.kiai td.n{color:var(--hanko)}
.kmark{display:inline-block;font-family:var(--f-display);font-weight:900;font-size:12px;color:var(--paper);background:var(--hanko);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.slow{display:inline-block;font-size:11px;font-weight:600;color:var(--ai);border:1px solid var(--ai);border-radius:3px;padding:0 5px;margin-left:6px}
tr.dim{display:none}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.pager a{flex:1 1 200px;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pager a:hover{border-color:var(--ai)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager strong{font-family:var(--f-display);font-size:17px}
.pager .next{text-align:right}

/* svg tokens */
.em-grid{stroke:var(--tatami);stroke-width:.25}
.em-path{stroke:var(--ai);fill:none;stroke-linecap:round;stroke-linejoin:round}
.em-start{fill:var(--hanko)}
.em-label{fill:var(--muted);font-family:var(--f-body);font-size:3.2px}
.em-front{fill:var(--ink);font-family:var(--f-display);font-size:3.8px;font-weight:700}


.st-path{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2.4;opacity:.55}
.st-dot{fill:var(--paper);stroke:var(--ai);stroke-width:1.6}
.st-dot.kiai{stroke:var(--hanko)}
.st-dot.on{fill:var(--ai)}
.st-start{fill:var(--hanko)}
.st-arrow{stroke:var(--ai);stroke-width:2}
.st-head{fill:var(--ai)}
.st-front{fill:var(--ink);font-family:var(--f-display);font-size:7px;font-weight:700}
.st-b rect{fill:var(--paper);stroke:var(--line);stroke-width:.8}
.st-b text{fill:var(--ink);font-family:var(--f-mono);font-size:6px;font-weight:500}
.st-b.kiai rect{fill:var(--hanko-soft);stroke:var(--hanko)}
.st-b.kiai text{fill:var(--hanko)}
.st-b.yoi rect{fill:var(--bg);stroke:var(--hanko);stroke-dasharray:1.5 1}
.st-b.on rect{fill:var(--ai);stroke:var(--ai)}
.st-b.on text{fill:var(--paper);font-weight:700}
.stepkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.stepkey span{display:inline-flex;align-items:center;gap:5px}
.kb{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--paper);display:inline-block}
.kb.kiai{background:var(--hanko-soft);border-color:var(--hanko)}
.kb.yoi{border:1px dashed var(--hanko)}
.kb.on{background:var(--ai);border-color:var(--ai)}
tr.yoirow td{color:var(--muted)}
.stepctl{display:flex;gap:6px;margin-top:10px}
.stepctl button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
.stepctl #splay{flex:1}
.speed{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.speed span{font-size:12px;color:var(--muted);margin-right:2px}
.speed button{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.speed button[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:500}
.stepnow{margin-top:10px;font-size:14px;min-height:1.5em}
.stepnow b{font-family:var(--f-mono);color:var(--ai);margin-right:6px}
.stepnow span{color:var(--muted)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--ai-soft)}
tr.on td{background:var(--ai-soft)}
tr.on td.n{color:var(--ai);font-weight:700}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .floor{position:static}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const byId = Object.fromEntries(KATAS.map(k=>[k.id,k]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

function embusenSVG(n, big){
  /* Desenho do card: sai dos mesmos dados do passo a passo (STEPS), para os dois nunca divergirem */
  const e = EMB[n]; const pts=[[0,0,0],...STEPS[n]];
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const span=Math.max(x1-x0,y1-y0,1), k=(big?84:80)/span, ox=50-(x0+x1)/2*k, oy=(big?52:50)+(y0+y1)/2*k;
  const P=p=>`${(ox+p[0]*k).toFixed(1)},${(oy-p[1]*k).toFixed(1)}`;
  let g = "";
  if(big){ for(let i=1;i<10;i++){ g+=`<line class="em-grid" x1="${i*10}" y1="4" x2="${i*10}" y2="100"/><line class="em-grid" x1="0" y1="${i*10+4}" x2="100" y2="${i*10+4}"/>`; } }
  const p = `<polyline class="em-path" stroke-width="${big?1.6:2.4}" points="${pts.map(P).join(" ")}"/>`;
  const [sx,sy]=P(pts[0]).split(",");
  const start = `<circle class="em-start" cx="${sx}" cy="${sy}" r="${big?2.2:3.2}"/>`;
  const labels = big ? `<text class="em-front" x="50" y="3.4" text-anchor="middle">正面 · shomen</text>` : "";
  return `<svg viewBox="0 ${big?-1:0} 100 ${big?104:100}" role="img" aria-label="Embusen de ${esc(KATAS[n-1].name)}: ${esc(e.shape)}">${g}${p}${start}${labels}</svg>`;
}

function rangeLabel(arr){
  const out=[]; let a=arr[0], b=arr[0];
  for(let i=1;i<=arr.length;i++){ const v=arr[i]; if(v===b+1){b=v;continue;} out.push(a===b?`${a}`:(b===a+1?`${a}·${b}`:`${a}–${b}`)); a=b=v; }
  return out.join(" · ");
}

const DIAG = {1:"heian-shodan",2:"heian-nidan",3:"heian-sandan",4:"heian-yondan",5:"heian-godan",6:"tekki-shodan",7:"tekki-nidan",8:"tekki-sandan"};
const REV = new Set([9,10,11,12]);   /* revisados com o diagrama de Pflüger, sem conferência completa */
const PFL = n => `https://www.karatedo.asia/wp-content/uploads/2013/10/${DIAG[n]||REVD[n]}.gif`;
const REVD = {9:"bassai-dai",10:"kanku-dai",11:"empi",12:"jion",13:"hangetsu",14:"jitte",15:"gankaku",16:"bassai-sho",17:"kanku-sho",18:"chinte",19:"unsu",20:"sochin",21:"nijushiho",22:"gojushiho-dai",23:"gojushiho-sho",24:"meikyo",25:"wankan"};
function embStatus(n){ return DIAG[n]?"conferido":(REV.has(n)?"revisado":"rascunho"); }
function embNote(n){
  const st=embStatus(n);
  if(st==="conferido") return `Traçado conferido com o <a href="${PFL(n)}" target="_blank" rel="noopener">diagrama de A. Pflüger</a>.`;
  if(st==="revisado") return `Traçado revisado com o <a href="${PFL(n)}" target="_blank" rel="noopener">diagrama de A. Pflüger</a> e descrições do kata; alguns trechos ainda pedem conferência.`;
  return `<b>Rascunho:</b> traçado montado a partir da tabela de kyodo, ainda sem conferência com diagrama.`;
}

function stepsSVG(k, active){
  const pts = [[0,0,0], ...STEPS[k.n]];          /* índice 0 = yoi */
  const U = 40, B = 10, G = 2.4;                 /* distância entre posições, lado do selo, folga */
  const groups = new Map();
  pts.forEach((p,i)=>{ const key=p[0].toFixed(2)+","+p[1].toFixed(2); if(!groups.has(key)) groups.set(key,{x:p[0]*U,y:-p[1]*U,ks:[]}); groups.get(key).ks.push(i); });
  const gl=[...groups.values()];
  const dots = gl.map(g=>({x0:g.x-5,y0:g.y-5,x1:g.x+5,y1:g.y+5}));
  const placed=[];
  const hit=(r,list)=>list.some(o=>r.x0<o.x1&&r.x1>o.x0&&r.y0<o.y1&&r.y1>o.y0);
  gl.forEach(g=>{
    const n=g.ks.length, cols=Math.min(n,n>6?4:3), rows=Math.ceil(n/cols);
    const w=cols*B+(cols-1)*G, h=rows*B+(rows-1)*G;
    const opts=[]; for(const d of [7,16,28,42]) opts.push([d,-h/2],[-d-w,-h/2],[-w/2,d],[-w/2,-d-h],[d,d],[-d-w,d],[d,-d-h],[-d-w,-d-h]);
    let best=null;
    for(const [ox,oy] of opts){ const r={x0:g.x+ox-1,y0:g.y+oy-1,x1:g.x+ox+w+1,y1:g.y+oy+h+1}; if(!hit(r,placed)&&!hit(r,dots.filter(o=>!(o.x0===g.x-5&&o.y0===g.y-5)))){best=[ox,oy,r];break;} }
    if(!best){ const [ox,oy]=opts[0]; best=[ox,oy,{x0:g.x+ox,y0:g.y+oy,x1:g.x+ox+w,y1:g.y+oy+h}]; }
    placed.push(best[2]); g.bx=g.x+best[0]; g.by=g.y+best[1]; g.cols=cols; g.r=best[2];
  });
  const all=[...placed,...dots];
  const minX=Math.min(...all.map(r=>r.x0))-8, maxX=Math.max(...all.map(r=>r.x1))+8;
  const minY=Math.min(...all.map(r=>r.y0))-34, maxY=Math.max(...all.map(r=>r.y1))+16;
  const W=Math.max(maxX-minX,120), H=maxY-minY, cx=(minX+maxX)/2;
  const vx=cx-W/2;
  const path = `<polyline class="st-path" points="${pts.map(p=>`${p[0]*U},${-p[1]*U}`).join(" ")}"/>`;
  let marks="", badges="";
  gl.forEach(g=>{
    const isStart = g.ks.includes(0);
    const isKiai = g.ks.some(n=>k.kiai.includes(String(n)));
    const isAct = g.ks.includes(active);
    marks += isStart ? `<rect class="st-start" x="${g.x-4}" y="${g.y-4}" width="8" height="8" rx="1.6"/>` : "";
    marks += `<circle class="st-dot${isKiai?" kiai":""}${isAct?" on":""}" cx="${g.x}" cy="${g.y}" r="${isStart?2.2:3.4}"/>`;
    g.ks.forEach((n,j)=>{
      const bx=g.bx+(j%g.cols)*(B+G), by=g.by+Math.floor(j/g.cols)*(B+G);
      const cls = n===active?"on":(n===0?"yoi":(k.kiai.includes(String(n))?"kiai":""));
      badges += `<g class="st-b ${cls}"><rect x="${bx}" y="${by}" width="${B}" height="${B}" rx="2"/><text x="${bx+B/2}" y="${by+B/2+2.3}" text-anchor="middle">${n}</text></g>`;
    });
  });
  const a=pts[active], ax=a[0]*U, ay=-a[1]*U, rad=a[2]*Math.PI/180;
  const arrow=`<line class="st-arrow" x1="${ax}" y1="${ay}" x2="${(ax+Math.sin(rad)*17).toFixed(1)}" y2="${(ay-Math.cos(rad)*17).toFixed(1)}" marker-end="url(#arr)"/>`;
  return `<svg viewBox="${vx.toFixed(1)} ${minY.toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" role="img" aria-label="Embusen passo a passo de ${esc(k.name)}, kyodo ${active} destacado">
    <defs><marker id="arr" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L6,3 L0,6 z" class="st-head"/></marker></defs>
    <text class="st-front" x="${cx.toFixed(1)}" y="${(minY+9).toFixed(1)}" text-anchor="middle">正面 shomen ↑</text>
    ${path}${marks}${arrow}${badges}
  </svg>`;
}

const app = document.getElementById("app");
let currentGroup = "heian", query = "";
try{ currentGroup = localStorage.getItem("kata-tab") || "heian"; }catch(e){}

function header(){
  return `<header class="masthead"><h1><small>Shotokan · JKA · 25 katas</small>Guia de Katas</h1>
    <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar kata ou técnica" value="${esc(query)}" autocomplete="off"></label></header>`;
}

function card(k){
  return `<a class="card" href="#${k.id}"><span class="num">${String(k.n).padStart(2,"0")}</span>
    <div><div class="kanji">${esc(k.kanji)}</div><h3>${esc(k.name)}</h3>
    <div class="meta"><span>${k.rows.length} kyodo</span><span>kiai <b>${k.kiai.join(" · ")}</b></span></div></div>
    ${embusenSVG(k.n,false)}</a>`;
}

function renderHome(){
  document.title = "Guia de Katas Shotokan";
  const q = query.trim().toLowerCase();
  let body;
  if(q){
    const hits = KATAS.filter(k=>k.name.toLowerCase().includes(q) || k.rows.some(r=>r[1].toLowerCase().includes(q)));
    body = `<p class="grouplede">${hits.length} kata${hits.length===1?"":"s"} com “${esc(query)}” no nome ou nas técnicas.</p>
      ${hits.length?`<div class="grid">${hits.map(card).join("")}</div>`:`<p class="empty">Nenhum kata encontrado. Tente um nome de técnica, como “manji-uke” ou “nukite”.</p>`}`;
  } else {
    const g = GROUPS.find(x=>x.id===currentGroup) || GROUPS[0];
    body = `<p class="grouplede">${esc(g.lede)}</p><div class="grid">${g.n.map(n=>card(KATAS[n-1])).join("")}</div>`;
  }
  const tabs = `<nav class="tabs" role="tablist" aria-label="Grupos de katas">${GROUPS.map(g=>`<button class="tab" role="tab" aria-selected="${!q && g.id===currentGroup}" data-g="${g.id}"><span class="k">${g.kanji}</span>${g.name}<span class="c">${g.n.length}</span></button>`).join("")}</nav>`;
  app.innerHTML = header() + tabs + body;
  bindHome();
}

function bindHome(){
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentGroup=b.dataset.g;query="";try{localStorage.setItem("kata-tab",currentGroup)}catch(e){}; if(location.hash.slice(1)!==currentGroup){location.hash=currentGroup;}else{renderHome();}});
  const qi = document.getElementById("q");
  qi.oninput = ()=>{ query = qi.value; const pos=qi.selectionStart; renderHome(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); };
}

function renderKata(k){
  document.title = `${k.name} · Guia de Katas`;
  const e = EMB[k.n]; const g = k.group;
  const idx = g.n.indexOf(k.n);
  const prev = idx>0 ? KATAS[g.n[idx-1]-1] : null, next = idx<g.n.length-1 ? KATAS[g.n[idx+1]-1] : null;
  const slowCount = k.rows.filter(r=>/Lento/i.test(r[4])).length;
  const rows = k.rows.map(r=>{
    const kiai = /KIAI/.test(r[4]); const slow = /Lento/i.test(r[4]);
    const obs = r[4].replace(/,?\s*\*\*KIAI\*\*/,"").replace(/^,\s*/,"").trim();
    return `<tr class="${kiai?"kiai":""}" data-kiai="${kiai}" data-slow="${slow}"><td class="n">${esc(r[0])}</td>
      <td class="t">${esc(r[1])}${kiai?'<span class="kmark">気合</span>':''}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${md(obs)}</td></tr>`;
  }).join("");
  app.innerHTML = `<a class="back" href="#${g.id}">← ${esc(g.name)}</a>
    <header class="katahead"><div class="seal" aria-hidden="true">${esc(k.kanji)}</div>
      <div><div class="eyebrow">${esc(g.name)} · kata ${k.n} de 25</div><h1>${esc(k.name)}</h1>
      <p class="lede">${md(k.intro)}</p>
      <div class="chips"><span class="chip">${k.rows.length} kyodo</span><span class="chip kiai">kiai ${k.kiai.join(" e ")}</span>${slowCount?`<span class="chip">${slowCount} lentos</span>`:""}<span class="chip${embStatus(k.n)==="rascunho"?" draft":""}">embusen ${embStatus(k.n)}</span></div></div></header>
    <div class="layout">
      <aside class="floor">${STEPS[k.n] ? `<h2>Embusen <span>kyodo a kyodo</span></h2>
        <div id="stepfig">${stepsSVG(k,1)}</div>
        <div class="stepkey"><span><i class="kb yoi"></i>0 · yoi (início)</span><span><i class="kb kiai"></i>kiai</span><span><i class="kb on"></i>kyodo atual</span></div>
        <div class="stepctl"><button id="sp" aria-label="Kyodo anterior">←</button><button id="splay">▶ Reproduzir</button><button id="sn" aria-label="Próximo kyodo">→</button></div>
        <div class="speed" role="group" aria-label="Velocidade da simulação"><span>Velocidade</span><button data-s="2200">0,5×</button><button data-s="1100" aria-pressed="true">1×</button><button data-s="700">1,5×</button><button data-s="450">2,5×</button></div>
        <div class="stepnow" id="stepnow"></div>
        <p>O passo 0 é o yoi, a posição de partida. Cada ponto é onde o corpo termina o kyodo, e os números ao lado dizem quais kyodo acontecem ali. A seta mostra para onde o karateca está virado. Clique numa linha da tabela para destacá-la. ${embNote(k.n)} Confira com o vídeo da JKA.</p>`
      : `<h2>Embusen <span>esquemático</span></h2>${embusenSVG(k.n,true)}
        <div class="shape">${esc(e.shape)}</div><p>${esc(e.note)}</p>
        <p>Forma geral do traçado no chão. O passo a passo deste kata ainda está em preparação; os giros exatos estão na coluna Obs.</p>`}</aside>
      <section class="ledger"><h2>Kyodo<div class="filters" role="group" aria-label="Filtrar movimentos">
        <button aria-pressed="true" data-f="all">Todos</button><button aria-pressed="false" data-f="kiai">Kiai</button><button aria-pressed="false" data-f="slow">Lentos</button></div></h2>
        <div class="tablewrap"><table><thead><tr><th>#</th><th>Técnica</th><th>Base</th><th>Nível</th><th>Obs.</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${k.src?`<p class="src">${md(k.src)}</p>`:""}</section>
    </div>
    <nav class="pager">${prev?`<a href="#${prev.id}"><small>← anterior</small><strong>${esc(prev.name)}</strong></a>`:"<span></span>"}${next?`<a class="next" href="#${next.id}"><small>próximo →</small><strong>${esc(next.name)}</strong></a>`:"<span></span>"}</nav>`;
  app.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const f=b.dataset.f;
    app.querySelectorAll("tbody tr").forEach(tr=>tr.classList.toggle("dim", f!=="all" && tr.dataset[f]!=="true"));
  });

  if(STEPS[k.n]){
    let cur=0, timer=null, delay=1100; const total=k.rows.length;
    try{ delay=+localStorage.getItem("kata-speed")||1100; }catch(e){}
    const sb=[...app.querySelectorAll(".speed button")];
    const markSpeed=()=>sb.forEach(b=>b.setAttribute("aria-pressed",+b.dataset.s===delay));
    markSpeed();
    sb.forEach(b=>b.onclick=()=>{ delay=+b.dataset.s; markSpeed(); try{localStorage.setItem("kata-speed",delay)}catch(e){}
      if(timer){ clearInterval(timer); timer=setInterval(tick,delay); } });
    const tick=()=>{ if(cur>=total) return stop(); show(cur+1,true); };
    const tb=app.querySelector("tbody");
    tb.insertAdjacentHTML("afterbegin",`<tr class="yoirow" data-kiai="false" data-slow="false"><td class="n">0</td><td class="t">Yoi</td><td>${YOI[k.n]||"Hachiji-dachi"}</td><td>—</td><td>Posição de partida, parado e alerta</td></tr>`);
    const trs=[...app.querySelectorAll("tbody tr")];
    const show=(i,scroll)=>{ cur=Math.max(0,Math.min(total,i));
      document.getElementById("stepfig").innerHTML=stepsSVG(k,cur);
      const r = cur===0 ? ["0","Yoi",YOI[k.n]||"Hachiji-dachi"] : k.rows[cur-1];
      document.getElementById("stepnow").innerHTML=`<b>${cur}</b> ${esc(r[1])} <span>${esc(r[2])}</span>`;
      trs.forEach((tr,j)=>tr.classList.toggle("on",j===cur));
      if(scroll){ trs[cur].scrollIntoView({block:"nearest"}); } };
    const stop=()=>{ clearInterval(timer); timer=null; document.getElementById("splay").textContent="▶ Reproduzir"; };
    document.getElementById("sp").onclick=()=>{stop();show(cur-1,true);};
    document.getElementById("sn").onclick=()=>{stop();show(cur+1,true);};
    document.getElementById("splay").onclick=()=>{ if(timer) return stop();
      if(cur>=total) show(0,true); document.getElementById("splay").textContent="❚❚ Pausar";
      timer=setInterval(tick,delay); };
    trs.forEach((tr,j)=>{ tr.classList.add("pick"); tr.onclick=()=>{stop();show(j,false);}; });
    show(0,false);
    window.addEventListener("hashchange",stop,{once:true});
  }
  window.scrollTo(0,0);
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(byId[h]) return renderKata(byId[h]);
  if(GROUPS.some(g=>g.id===h)){ currentGroup=h; query=""; }
  renderHome();
}
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
