   luz e sombra esculpindo o volume, mais partículas nos detalhes (olhos, boca, dobras), foco e desfoque (bokeh),
   névoa de profundidade, brilho difuso (bloom) e grão.
   v3: camada fina de centenas de milhares de partículas calculada na placa de vídeo, com a luz lida da câmera em
   resolução cheia (olhos, boca, cabelo, barba), e detector de rosto que concentra partículas e nitidez no rosto.

   e os ataques desprendem pedaços que voam em direção a quem olha. Sem ninguém na frente, as partículas flutuam soltas em 3D.

   v6: as mãos também tocam os efeitos do som — abrir/fechar a mão abre/fecha o filtro, a velocidade das mãos

// ---------------- efeitos do som tocados pelas mãos: filtro → drive → delay (entram no Motor Knick antes do limitador) ----------------
const FX = { no: null, filtro: 1, drive: 0, delay: 0, hz: 18000 };
function montarFX(AC) {
  const ent = AC.createGain(), sai = AC.createGain();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000; lp.Q.value = 0.7;
  // drive: pré-ganho → saturação (tanh) → compensação, misturado com o som limpo
  const pre = AC.createGain(), sh = AC.createWaveShaper(), pos = AC.createGain(), seco = AC.createGain(), sujo = AC.createGain();
  const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * 2.2) / Math.tanh(2.2); }
  sh.curve = c; sh.oversample = '4x'; seco.gain.value = 1; sujo.gain.value = 0;
  const mix = AC.createGain();
  ent.connect(lp); lp.connect(seco); seco.connect(mix); lp.connect(pre); pre.connect(sh); sh.connect(pos); pos.connect(sujo); sujo.connect(mix);
  // delay pingue-pongue no andamento, com realimentação escurecendo a cada volta
  const envio = AC.createGain(); envio.gain.value = 0;
  const dL = AC.createDelay(2), dR = AC.createDelay(2), fbL = AC.createGain(), fbR = AC.createGain(), cor = AC.createBiquadFilter();
  cor.type = 'lowpass'; cor.frequency.value = 2800; fbL.gain.value = fbR.gain.value = 0.3;
  const mg = AC.createChannelMerger(2), ret = AC.createGain(); ret.gain.value = 0.9;
  mix.connect(sai); mix.connect(envio); envio.connect(cor); cor.connect(dL); dL.connect(fbL); fbL.connect(dR); dR.connect(fbR); fbR.connect(cor);
  dL.connect(mg, 0, 0); dR.connect(mg, 0, 1); mg.connect(ret); ret.connect(sai);
  FX.no = { AC, lp, pre, pos, seco, sujo, envio, dL, dR, fbL, fbR };
  return { entrada: ent, saida: sai };
}
function aplicarFX(dt, mm, asp) {
  const P = O.P;
  // filtro: abertura média das mãos (sem mãos = aberto)
  const ab = mm.length ? mm.reduce((s, m) => s + m.ab, 0) / mm.length : 1;
  FX.filtro += (ab - FX.filtro) * Math.min(1, dt * 10);
  // drive: velocidade da mão mais rápida (sobe rápido, desce devagar)
  let vel = 0; for (const m of mm) vel = Math.max(vel, m.ref === mouse ? (m.ref.vel || 0) : (m.ref.vista ? m.ref.vel || 0 : 0));
  const dAlvo = mm.length ? clamp((vel - 0.12) / 1.1, 0, 1) : 0;
  FX.drive += (dAlvo - FX.drive) * Math.min(1, dt * (dAlvo > FX.drive ? 12 : 1.6));
  // delay: afastamento entre as duas mãos; com uma só, a proximidade da câmera (palma maior)
  let lAlvo = 0;
  if (mm.length >= 2) lAlvo = sst(0.15, 0.75, Math.hypot((mm[0].x - mm[1].x) * asp, mm[0].y - mm[1].y));
  else if (mm.length === 1) lAlvo = sst(0.09, 0.24, mm[0].ref.palma || 0);
  FX.delay += (lAlvo - FX.delay) * Math.min(1, dt * (lAlvo > FX.delay ? 5 : 1.2));
  const F = FX.no; if (!F) return;
  const t = F.AC.currentTime, k = 0.04;
  const f = P.FxFiltro, fe = Math.pow(FX.filtro, 0.9);
  FX.hz = 18000 * Math.pow(160 / 18000, f * (1 - fe));
  F.lp.frequency.setTargetAtTime(FX.hz, t, k);
  F.lp.Q.setTargetAtTime(0.7 + P.FxRes * 11 * f * (1 - fe * 0.6), t, k);
  const d = clamp(FX.drive * P.FxDrive, 0, 1.5);
  F.pre.gain.setTargetAtTime(1 + d * 14, t, k); F.pos.gain.setTargetAtTime(1 / (1 + d * 2.2), t, k);
  F.sujo.gain.setTargetAtTime(Math.min(1, d * 1.2), t, k); F.seco.gain.setTargetAtTime(1 - Math.min(0.75, d * 0.6), t, k);
  const l = FX.delay * P.FxDelay, bpm = (O.M && O.M.S && O.M.S.bpm) || 90, b = 60 / bpm;
  F.dL.delayTime.setTargetAtTime(Math.min(1.9, b * 0.75), t, 0.2); F.dR.delayTime.setTargetAtTime(Math.min(1.9, b), t, 0.2);
  F.envio.gain.setTargetAtTime(l * 0.85, t, 0.06);
  const fb = 0.15 + l * 0.6; F.fbL.gain.setTargetAtTime(fb, t, 0.1); F.fbR.gain.setTargetAtTime(fb, t, 0.1);
}

// ---------------- partículas (x, y em 0–1 da tela; z = profundidade, + perto de quem olha) ----------------
const N = matchMedia('(pointer:coarse)').matches ? 24000 : 42000;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N), vz = new Float32Array(N);
const tx = new Float32Array(N), ty = new Float32Array(N), tu = new Float32Array(N), tv = new Float32Array(N), tj = new Int32Array(N).fill(-1), fz = new Float32Array(N);
const solto = new Float32Array(N), br = new Float32Array(N), az = new Float32Array(N), sem = new Float32Array(N), luzP = new Float32Array(N).fill(1);
for (let i = 0; i < N; i++) {
  px[i] = tx[i] = Math.random(); py[i] = ty[i] = Math.random();
  fz[i] = pz[i] = (Math.random() * 2 - 1) * 1.4;
  br[i] = 0.3 + Math.pow(Math.random(), 0.7) * 0.7; sem[i] = Math.random();
}

// ---------------- grades do corpo (coordenadas do vídeo) ----------------
const MW = 256, MH = 192, NG = MW * MH;
const mascara = new Float32Array(NG), lumRaw = new Float32Array(NG).fill(0.5), lumN = new Float32Array(NG);
const dist = new Float32Array(NG), Z = new Float32Array(NG), SH = new Float32Array(NG).fill(1), LG = new Float32Array(NG).fill(1), ED = new Float32Array(NG);
const gradeDados = new Float32Array(NG * 4);   // textura para a camada fina: máscara, profundidade, luz, pele
let gradeNova = false, lumMed = 0.5, lumDp = 0.2;
// rosto (coordenadas do vídeo, suavizado)
const rosto = { u0: 0, v0: 0, u1: 0, v1: 0, c: 0 };
const cdf = new Float32Array(NG); let cdfTot = 0, dentroN = 0, temPessoa = 0, ultPessoa = -10;
const lumCv = document.createElement('canvas'); lumCv.width = MW; lumCv.height = MH;
const lumCtx = lumCv.getContext('2d', { willReadFrequently: true });

const video = document.getElementById('vid');
let camOn = false;
const temCorpo = () => camOn && temPessoa > 0.02;
// mapeia (u, v) do vídeo para a tela, cobrindo e espelhando
function vidParaTela(u, v) {
  const vw = video.videoWidth || 4, vh = video.videoHeight || 3, s = Math.max(O.W / vw, O.H / vh);
  const x = (1 - u - 0.5) * vw * s / O.W + 0.5, y = (v - 0.5) * vh * s / O.H + 0.5; return [x, y];
}

// lê a luz da câmera (sem mostrá-la) e transforma silhueta + luz em volume, relevo, sombra e mapa de detalhes
function analisarGrades(t) {
  const P = O.P;
  if (video.readyState >= 2) {
    try {
      lumCtx.drawImage(video, 0, 0, MW, MH);
      const d = lumCtx.getImageData(0, 0, MW, MH).data;
      for (let i = 0, k = 0; i < NG; i++, k += 4) lumRaw[i] += ((0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]) / 255 - lumRaw[i]) * 0.6;
    } catch (e) {}
  }
  // contraste local: normaliza a luz só dentro do corpo (funciona com pouca ou muita luz no ambiente)
  let n = 0, s = 0, s2 = 0;
  for (let i = 0; i < NG; i++) if (mascara[i] > 0.5) { const l = lumRaw[i]; s += l; s2 += l * l; n++; }
  dentroN = n; if (!n) { cdfTot = 0; return; }
  const med = s / n, dp = Math.sqrt(Math.max(1e-4, s2 / n - med * med)); lumMed = med; lumDp = dp;
  for (let i = 0; i < NG; i++) lumN[i] = clamp((lumRaw[i] - med) / (dp * 3) + 0.5, 0, 1);
  // distância até a borda (chamfer 3-4) → volume arredondado do corpo
  const G = 1e6;
  for (let i = 0; i < NG; i++) { const x = i % MW, y = (i / MW) | 0; dist[i] = mascara[i] > 0.5 && x > 0 && y > 0 && x < MW - 1 && y < MH - 1 ? G : 0; }
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    const i = y * MW + x; if (!dist[i]) continue;
    dist[i] = Math.min(dist[i], dist[i - 1] + 3, dist[i - MW] + 3, dist[i - MW - 1] + 4, dist[i - MW + 1] + 4);
  }
  let dmax = 1;
  for (let y = MH - 2; y > 0; y--) for (let x = MW - 2; x > 0; x--) {
    const i = y * MW + x; if (!dist[i]) continue;
    const v = Math.min(dist[i], dist[i + 1] + 3, dist[i + MW] + 3, dist[i + MW + 1] + 4, dist[i + MW - 1] + 4);
    dist[i] = v; if (v > dmax) dmax = v;
  }
  // profundidade: bojo da silhueta + relevo da luz (como uma litofania)
  const vol = P.Volume, rel = P.Relevo;
  for (let i = 0; i < NG; i++) {
    const dn = dist[i] / dmax, bojo = Math.sqrt(dn);
    Z[i] = dist[i] ? vol * (1.7 * bojo - 0.6) + rel * (lumN[i] - 0.5) * 1.5 * Math.min(1, dn * 5) : -0.6 * vol;
  }
  // normais → luz principal (gira devagar), luz de recorte nas bordas e "pele" a partir da luz da câmera
  const la = t * 0.21, Lx = Math.cos(la) * 0.5, Ly = -0.55, Lz = 0.68, ll = Math.hypot(Lx, Ly, Lz);
  const kz = 7 * (0.4 + P.Profund * 0.6), luz = P.Luz;
  let emed = 0;
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    const i = y * MW + x; if (!dist[i]) { SH[i] = 1; LG[i] = 1; ED[i] = 0; continue; }
    // x da grade é espelhado na tela
    const nx = (Z[i + 1] - Z[i - 1]) * kz, ny = -(Z[i + MW] - Z[i - MW]) * kz, nl = Math.hypot(nx, ny, 1);
    const difusa = Math.max(0, (nx * Lx + ny * Ly + Lz) / (nl * ll)), recorte = Math.pow(1 - 1 / nl, 1.5);
    const pele = 0.12 + 1.35 * Math.pow(lumN[i], 1.2);
    LG[i] = 0.22 + 1.05 * difusa + 0.9 * recorte;
    SH[i] = 1 + luz * (LG[i] * pele - 1);
    // detalhe: Sobel da luz normalizada (olhos, boca, sobrancelhas, dobras da roupa)
    const a = lumN[i - MW - 1], b = lumN[i - MW], c = lumN[i - MW + 1], d = lumN[i - 1], f = lumN[i + 1], g = lumN[i + MW - 1], h = lumN[i + MW], k = lumN[i + MW + 1];
    const gx = (c + 2 * f + k) - (a + 2 * d + g), gy = (g + 2 * h + k) - (a + 2 * b + c);
    ED[i] = Math.hypot(gx, gy); emed += ED[i];
  }

  // densidade: mais partículas nas bordas, nos detalhes e nas áreas iluminadas
  const wc = P.Contorno * 3, wd = P.Detalhe * 2.6, wl = luz * 0.8;
  // rosto: concentra partículas (e mais peso nos detalhes) dentro da caixa do rosto, um pouco ampliada
  const rc = rosto.c > 0.3 ? P.Rosto : 0, rw = rosto.u1 - rosto.u0, rh = rosto.v1 - rosto.v0;
  const fx0 = (rosto.u0 - rw * 0.2) * MW, fx1 = (rosto.u1 + rw * 0.2) * MW, fy0 = (rosto.v0 - rh * 0.35) * MH, fy1 = (rosto.v1 + rh * 0.15) * MH;
  let acc = 0;
  for (let i = 0; i < NG; i++) {
    if (dist[i]) {
      const e = Math.min(1, ED[i] / emed); ED[i] = e;
      const borda = dist[i] <= 4 ? 1 : 0, x = i % MW, y = (i / MW) | 0;
      const nr = rc > 0 && x >= fx0 && x <= fx1 && y >= fy0 && y <= fy1 ? rc : 0;
      acc += (0.55 + wc * borda + wd * (1 + nr * 1.5) * e * e + wl * 1.6 * Math.pow(lumN[i], 1.5)) * (1 + nr * 4);
    }
    cdf[i] = acc;
  }
  cdfTot = acc;
  for (let i = 0, k = 0; i < NG; i++, k += 4) { gradeDados[k] = dist[i] ? mascara[i] : 0; gradeDados[k + 1] = Z[i]; gradeDados[k + 2] = LG[i]; gradeDados[k + 3] = lumN[i]; }
  gradeNova = true;
}
function amostra() {
  const r = Math.random() * cdfTot; let lo = 0, hi = NG - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < r) lo = m + 1; else hi = m; }
  return lo;
}
// cada partícula guarda um ponto fixo do corpo (coordenadas do vídeo): o desenho fica nítido e estável.
// Uma pequena parte é redistribuída a cada quadro, e quem ficou fora do corpo (a pessoa se mexeu) ganha lugar novo.
function alvoNovo(i) {
  if (sem[i] < 0.07) return;   // ~7% ficam como poeira solta no ar, dando profundidade ao espaço
  const j = amostra(); tj[i] = j;
  tu[i] = ((j % MW) + Math.random()) / MW; tv[i] = (Math.floor(j / MW) + Math.random()) / MH;
}
let varre = 0;
function realvo(frac) {
  if (!cdfTot || !temCorpo()) return;
  const n = Math.floor(N * frac);
  for (let k = 0; k < n; k++) alvoNovo((Math.random() * N) | 0);
  const lote = N >> 4;
  for (let k = 0; k < lote; k++) { const i = (varre + k) % N; if ((tj[i] < 0 && sem[i] >= 0.07) || (tj[i] >= 0 && mascara[tj[i]] < 0.4)) alvoNovo(i); }
  varre = (varre + lote) % N;
}

// ---------------- câmera + MediaPipe ----------------
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.15';
const SEG = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const MAO = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const ROSTO = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
let movCorpoBruto = 0, movCorpo = 0, energiaMus = 0;
let seg = null, det = null, face = null, tsAnt = -1, alterna = 0, semRastreio = false, quadroNovo = true, temRVFC = false, ultVid = -1;
async function iniciarCamera() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }, audio: false });
    video.srcObject = st; await video.play(); camOn = true;
    if (video.requestVideoFrameCallback) { const cb = () => { quadroNovo = true; video.requestVideoFrameCallback(cb); }; video.requestVideoFrameCallback(cb); temRVFC = true; }
  } catch (e) { O.dica('sem câmera — o mouse faz a mão', 3500); return; }
  O.dica('carregando o rastreamento…', 2500);

    gl.uniform1f(u.uResp, resp); gl.uniform1f(u.uInfla, inflar); gl.uniform1f(u.uPres, presenca);
    gl.uniform1f(u.uScat, scat); gl.uniform1f(u.uScatX, scatX); gl.uniform1f(u.uLuz, P.Luz);
    gl.uniform1f(u.uMed, lumMed); gl.uniform1f(u.uDp, lumDp); gl.uniform1f(u.uVid, vidOk ? 1 : 0);
    gl.uniform1f(u.uR, P.Raio); gl.uniform1f(u.uEsp, P.Espalha); gl.uniform1f(u.uJun, P.Junta); gl.uniform1f(u.uFlu, P.Fluxo); gl.uniform1f(u.uAz, P.Acento);
    maoU.fill(0); mm.slice(0, 2).forEach((m, k) => { maoU[k * 4] = m.x; maoU[k * 4 + 1] = m.y; maoU[k * 4 + 2] = m.ab; maoU[k * 4 + 3] = 1; });
    gl.uniform4fv(u.uMao, maoU);
    SG.forEach((g, k) => { sgU[k * 4] = g.x; sgU[k * 4 + 1] = g.y; sgU[k * 4 + 2] = g.g; sgU[k * 4 + 3] = g.r; });
    gl.uniform4fv(u.uSg, sgU); gl.uniform1f(u.uRoOn, ro ? 1 : 0); gl.uniform1f(u.uHZ, Z_MAO);
    if (ro) gl.uniform4f(u.uRo, ro.cx, ro.cy, ro.hx, ro.hy);
    gl.bindVertexArray(vaoF); gl.drawArrays(gl.POINTS, 0, nDesenha);
    gl.activeTexture(gl.TEXTURE0);
  }
  // 2c) partículas das mãos
  if (P.MaoPart > 0.01 && (VAGA[0].vis > 0.01 || VAGA[1].vis > 0.01)) {
    VAGA.forEach((v, k) => {
      const r = v.ref;
      if (r && r.pts) for (let j = 0; j < 21; j++) { const o = (k * 21 + j) * 3; lmU[o] = r.pts[j][0]; lmU[o + 1] = r.pts[j][1]; lmU[o + 2] = r.pz ? r.pz[j] : 0; }
      mhU[k * 4] = v.vis; mhU[k * 4 + 1] = v.ab; mhU[k * 4 + 2] = v.suga * P.Suga; mhU[k * 4 + 3] = v.palma;
    });
    gl.useProgram(progM.p); const u = progM.u;
    gl.uniform3fv(u.uLm, lmU); gl.uniform4fv(u.uMH, mhU);
    gl.uniform1f(u.uPt, P.Tamanho * O.DPR * Math.sqrt(Math.min(W, H) / 700) * 1.5);
    gl.uniform1f(u.uB, 1); gl.uniform1f(u.uBF, P.Brilho * P.MaoPart * (HDR ? 0.8 : 0.5) * Math.sqrt(12000 / NHM));
    gl.uniform1f(u.uAsp, asp); gl.uniform1f(u.uYaw, yaw); gl.uniform1f(u.uPitch, pitch); gl.uniform1f(u.uDep, dep);
    gl.uniform1f(u.uFoco, P.Foco * 2); gl.uniform1f(u.uDesf, P.Desfoque); gl.uniform1f(u.uT, t); gl.uniform1f(u.uMax, MAXPT);
    gl.uniform1f(u.uAz, P.Acento); gl.uniform1f(u.uHZ, Z_MAO); gl.uniform1f(u.uEspD, P.MaoEsp);
    gl.bindVertexArray(vaoM); gl.drawArrays(gl.POINTS, 0, NHM * 2);
  }
  // 3) brilho difuso (bloom) em 1/4 da resolução
  gl.disable(gl.BLEND); gl.bindVertexArray(vaoQ);
  const qx = 1 / RT.b1.w, qy = 1 / RT.b1.h;
  passo(blur, RT.b1, RT.ac.tex, qx, 0); passo(blur, RT.b2, RT.b1.tex, 0, qy);
  passo(blur, RT.b1, RT.b2.tex, qx * 2.5, 0); passo(blur, RT.b2, RT.b1.tex, 0, qy * 2.5);
  // 4) composição final na tela
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.useProgram(final.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.ac.tex); gl.uniform1i(final.u.uA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, RT.b2.tex); gl.uniform1i(final.u.uBl, 1);
  gl.uniform1f(final.u.uGlow, P.Glow); gl.uniform1f(final.u.uGrao, P.Grao); gl.uniform1f(final.u.uT, t); gl.uniform1f(final.u.uHdr, HDR ? 1 : 0);
  gl.uniform2f(final.u.uRes, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0); gl.bindVertexArray(null);

  // ---------------- dados ----------------
  const hx = O.hx; hx.clearRect(0, 0, W, H);
  const ha = O.mostrarHud ? P.Hud : 0; if (ha <= 0.01) return;
  // caixa do corpo
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (let i = 0; i < N; i += 37) { if (solto[i] > 0) continue; x0 = Math.min(x0, tx[i]); x1 = Math.max(x1, tx[i]); y0 = Math.min(y0, ty[i]); y1 = Math.max(y1, ty[i]); }
  if (corpo && x1 > x0) HUD.caixa(hx, x0 * W - 10, y0 * H - 10, (x1 - x0) * W + 20, (y1 - y0) * H + 20, `CORPO · ${N + Math.floor(NF * P.Fina) + (P.MaoPart > 0.01 ? NHM * 2 : 0)} PTS · ${(temPessoa * 100).toFixed(1)}% · Z ${dep.toFixed(2)}`, ha * 0.45);
  if (corpo && rosto.c > 0.3) { const p0 = vidParaTela(rosto.u1, rosto.v0), p1 = vidParaTela(rosto.u0, rosto.v1); HUD.caixa(hx, p0[0] * W, p0[1] * H, (p1[0] - p0[0]) * W, (p1[1] - p0[1]) * H, `ROSTO ${(rosto.c * 100) | 0}%`, ha * 0.6); }
  for (const m of mm) {
    const r = m.ref, nome = r === mouse ? 'CURSOR' : 'MÃO';
    const vg = VAGA.find((v) => v.ref === r), sug = vg && vg.suga * P.Suga > 0.05 ? ` · SUGANDO ${(vg.suga * P.Suga * 100) | 0}%` : '';
    HUD.caixa(hx, m.x * W - 34, m.y * H - 34, 68, 68, `${nome} ${m.ab > 0.5 ? 'ABERTA' : 'FECHADA'} ${(m.ab * 100) | 0}%${sug}`, ha * 0.8, `rgba(90,120,255,${P.Acento})`);
    if (r.pts && P.Esqueleto) {
      hx.save(); hx.globalAlpha = ha * 0.5; hx.strokeStyle = '#fff'; hx.lineWidth = 1; hx.beginPath();
      for (const [a, b] of LIG) { hx.moveTo(r.pts[a][0] * W, r.pts[a][1] * H); hx.lineTo(r.pts[b][0] * W, r.pts[b][1] * H); }
      hx.stroke(); hx.restore();
    }
  }
  const fw = Math.min(W * 0.4, 300);
  HUD.faixa(hx, A, 24, H - 80, fw, 40, ha * 0.8);
  HUD.texto(hx, `${A.db.toFixed(1)} dBFS   ${A.hz ? A.hz.toFixed(1) : '—'} Hz  ${HUD.nota(A.hz)}`, 24, H - 22, ha * 0.7);
  HUD.texto(hx, 'CORPO DE PARTÍCULAS', 24, 34, ha * 0.9);
  if (O.fonte === 'motor') HUD.texto(hx, `MOVIMENTO ${(energiaMus * 100) | 0}% · CORPO ${(eCorpo * 100) | 0}% · MÃOS ${(eMao * 100) | 0}%`, 24, 62, ha * 0.5);
  if (O.fonte === 'motor') HUD.texto(hx, `FILTRO ${FX.hz >= 1000 ? (FX.hz / 1000).toFixed(1) + ' kHz' : (FX.hz | 0) + ' Hz'} · DRIVE ${(FX.drive * P.FxDrive * 100) | 0}% · DELAY ${(FX.delay * P.FxDelay * 100) | 0}%`, 24, 76, ha * 0.5);
  HUD.texto(hx, camOn ? (seg ? 'RASTREAMENTO ATIVO' : semRastreio ? 'SEM RASTREAMENTO · MOUSE = MÃO' : 'CARREGANDO RASTREAMENTO') : 'SEM CÂMERA · MOUSE = MÃO', 24, 48, ha * 0.5);
});
</script>
