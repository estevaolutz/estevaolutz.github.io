<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Quadro de Pixels</title>
<style>
:root{--bg:#000;--pn:#12151c;--ln:#2a303c;--tx:#e9ecf2;--mt:#8b93a3;--ac:#e8b04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body.saida{overflow:hidden;cursor:crosshair}
body.saida.limpo{cursor:none}
#out{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#dica{position:fixed;left:12px;bottom:10px;color:#8b93a3;font-size:12px;pointer-events:none}
body.limpo #dica{display:none}
/* controle */
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#esq{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
#dir{background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:16px 14px 40px}
h1{font-size:18px;margin:0;font-weight:650}
h1 small{color:var(--mt);font-weight:400;font-size:13px;margin-left:8px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);margin:18px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.cx{background:#07080b;border:1px solid var(--ln);border-radius:10px;padding:10px}
.cx p{margin:0 0 8px;color:var(--mt);font-size:12px}
#prev{width:100%;display:block;image-rendering:pixelated;cursor:pointer;border-radius:4px}
#mini{width:100%;display:block;background:#000;border-radius:4px;touch-action:none}
.lin{display:flex;align-items:center;gap:8px;margin:6px 0}
.lin label{flex:0 0 92px;color:var(--mt);font-size:13px}
.lin input[type=range]{flex:1;accent-color:var(--ac)}
.lin input[type=number]{width:64px;background:#0b0d12;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 6px;font:inherit}
.lin input[type=color]{width:44px;height:30px;border:1px solid var(--ln);border-radius:6px;background:none;padding:0}
.lin output{width:40px;text-align:right;color:var(--mt);font-size:12px}
button.b{background:#1b2029;border:1px solid var(--ln);border-radius:8px;color:var(--tx);font:inherit;font-size:13px;padding:7px 10px;cursor:pointer}
button.b:hover{border-color:var(--ac)}
button.b.on{background:var(--ac);color:#111;border-color:var(--ac)}
button.big{width:100%;padding:11px;font-weight:600;background:var(--ac);color:#111;border:0}
.bts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ck{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--mt);font-size:13px}
.ck input{accent-color:var(--ac)}
#info{color:var(--mt);font-size:12px}
.nota{color:var(--mt);font-size:12px;margin:6px 0}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#dir{border-left:0;border-top:1px solid var(--ln)}}
</style>
</head>
<body>
<script>
"use strict";
const SAIDA = new URLSearchParams(location.search).has('saida');
const CHAVE = 'quadro-de-pixels-v1';
const canal = ('BroadcastChannel' in window) ? new BroadcastChannel('quadro-de-pixels') : null;

const PADRAO = {
  cols: 30, rows: 24,
  cantos: [[0.254,0.15],[0.746,0.15],[0.746,0.85],[0.254,0.85]], // sup-esq, sup-dir, inf-dir, inf-esq (fração da janela de saída)
  fresta: 0.10,     // espaço apagado entre blocos (fração do bloco)
  brilho: 1,
  calib: true,      // mostrar contorno e cantos na projeção
  numeros: false,
  efeito: 'grade',
  vel: 1,
  cor: '#ffffff',
  sel: 0            // canto selecionado
};
let S = carregar();
function carregar(){
  try{ const s = JSON.parse(localStorage.getItem(CHAVE)); if(s && s.cantos) return Object.assign({}, PADRAO, s); }catch(e){}
  return JSON.parse(JSON.stringify(PADRAO));
}
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(e){} }

/* ---------- homografia: quadrado unitário -> quadrilátero ---------- */
function homografia(q){
  const [x0,y0]=q[0],[x1,y1]=q[1],[x2,y2]=q[2],[x3,y3]=q[3];
  const dx1=x1-x2, dx2=x3-x2, dy1=y1-y2, dy2=y3-y2;
  const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  let g=0,h=0;
  if(Math.abs(sx)>1e-12 || Math.abs(sy)>1e-12){
    const d=dx1*dy2-dx2*dy1;
    g=(sx*dy2-dx2*sy)/d; h=(dx1*sy-sx*dy1)/d;
  }
  const a=x1-x0+g*x1, b=x3-x0+h*x3, c=x0;
  const d2=y1-y0+g*y1, e=y3-y0+h*y3, f=y0;
  return (u,v)=>{ const w=g*u+h*v+1; return [(a*u+b*v+c)/w,(d2*u+e*v+f)/w]; };
}

/* ---------- desenho da projeção (usado na saída e na miniatura) ---------- */
function desenhar(ctx, W, H, px, opc){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const q=S.cantos.map(([x,y])=>[x*W,y*H]);
  const T=homografia(q);
  const C=S.cols, R=S.rows, g=S.fresta/2;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    const i=(r*C+c)*3;
    const cr=px?px[i]:0, cg=px?px[i+1]:0, cb=px?px[i+2]:0;
    if(cr+cg+cb===0) continue;
    const u0=(c+g)/C,u1=(c+1-g)/C,v0=(r+g)/R,v1=(r+1-g)/R;
    const a=T(u0,v0),b=T(u1,v0),d=T(u1,v1),e=T(u0,v1);
    ctx.fillStyle=`rgb(${cr},${cg},${cb})`;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.lineTo(e[0],e[1]);ctx.closePath();ctx.fill();
  }
  if(S.numeros){
    const tam=Math.max(6,Math.hypot(q[1][0]-q[0][0],q[1][1]-q[0][1])/C*0.32);
    ctx.font=`${tam}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const p=T((c+.5)/C,(r+.5)/R);
      ctx.fillStyle='#e8b04a'; ctx.fillText(`${c+1}·${r+1}`,p[0],p[1]);
    }
  }
  if(S.calib || opc.sempreCantos){
    ctx.lineWidth=opc.linha||2; ctx.strokeStyle='#e8b04a';
    ctx.beginPath(); q.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
    const rr=opc.raio||14;
    q.forEach((p,k)=>{
      ctx.beginPath();ctx.arc(p[0],p[1],rr,0,Math.PI*2);
      ctx.fillStyle=k===S.sel?'#e8b04a':'#0008';ctx.fill();ctx.strokeStyle='#e8b04a';ctx.stroke();
      ctx.fillStyle=k===S.sel?'#111':'#e8b04a';ctx.font=`bold ${rr}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(k+1,p[0],p[1]+1);
    });
  }
}

/* ---------- arrastar cantos (saída e miniatura) ---------- */
function arrastavel(cv, aoMudar){
  let ativo=-1;
  const pos=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height,r];};
  cv.addEventListener('pointerdown',ev=>{
    if(!S.calib && SAIDA) return;
    const [x,y,r]=pos(ev); let melhor=-1,dm=1e9;
    S.cantos.forEach(([cx,cy],k)=>{const d=Math.hypot((cx-x)*r.width,(cy-y)*r.height); if(d<dm){dm=d;melhor=k;}});
    if(dm<60){ativo=melhor;S.sel=melhor;cv.setPointerCapture(ev.pointerId);aoMudar();}
  });
  cv.addEventListener('pointermove',ev=>{ if(ativo<0) return; const [x,y]=pos(ev);
    S.cantos[ativo]=[Math.min(1.2,Math.max(-.2,x)),Math.min(1.2,Math.max(-.2,y))]; aoMudar(); });
  cv.addEventListener('pointerup',()=>{ativo=-1;});
}
function teclas(aoMudar){
  addEventListener('keydown',ev=>{
    if(ev.target.tagName==='INPUT') return;
    if(['1','2','3','4'].includes(ev.key)){S.sel=+ev.key-1;aoMudar();return;}
    const passo=(ev.shiftKey?10:1)/ (SAIDA?innerWidth:1920);
    const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
    if(m){ev.preventDefault(); const p=S.cantos[S.sel]; const ar=SAIDA?innerWidth/innerHeight:16/9;
      p[0]+=m[0]*passo; p[1]+=m[1]*passo*ar; aoMudar(); }
    if(ev.key==='c'||ev.key==='C'){S.calib=!S.calib;aoMudar();}
    if(ev.key==='n'||ev.key==='N'){S.numeros=!S.numeros;aoMudar();}
    if((ev.key==='f'||ev.key==='F')&&SAIDA){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }
  });
}

/* ================= JANELA DE SAÍDA (projetor) ================= */
if(SAIDA){
  document.body.className='saida';
  document.title='Quadro de Pixels — saída';
  document.body.innerHTML='<canvas id="out"></canvas><div id="dica">Arraste os cantos · 1–4 escolhe canto · setas ajustam (Shift = 10×) · F tela cheia · C esconde contorno · N números</div>';
  const cv=document.getElementById('out'), ctx=cv.getContext('2d');
  let px=null, ultimo=0;
  function ajustar(){ const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; }
  addEventListener('resize',ajustar); ajustar();
  const mudou=()=>{ salvar(); canal&&canal.postMessage({tipo:'estado',S}); };
  arrastavel(cv,mudou); teclas(mudou);
  cv.addEventListener('dblclick',()=>document.documentElement.requestFullscreen().catch(()=>{}));
  if(canal) canal.onmessage=ev=>{ const m=ev.data;
    if(m.tipo==='quadro'){ px=m.px; ultimo=performance.now(); }
    if(m.tipo==='estado'){ S=Object.assign(S,m.S); }
  };
  canal&&canal.postMessage({tipo:'ola'});
  (function loop(){
    document.body.classList.toggle('limpo',!S.calib);
    // sem controle aberto: mostra a grade de teste
    const dados = (performance.now()-ultimo<1500) ? px : gradeTeste();
    desenhar(ctx,cv.width,cv.height,dados,{raio:16*(devicePixelRatio||1),linha:2*(devicePixelRatio||1)});
    requestAnimationFrame(loop);
  })();
  function gradeTeste(){ const a=new Uint8ClampedArray(S.cols*S.rows*3);
    for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++){const v=(r+c)%2?70:200,i=(r*S.cols+c)*3;a[i]=a[i+1]=a[i+2]=v;} return a; }
}

/* ================= JANELA DE CONTROLE ================= */
else {
document.body.innerHTML=`
<div id="app">
 <div id="esq">
  <h1>Quadro de Pixels<small>difusor de madeira · cada bloco = 1 pixel</small></h1>
  <div class="cx"><p>Os pixels do quadro (clique para pintar no efeito “Desenhar”)</p><canvas id="prev"></canvas></div>
  <div class="cx"><p>Janela do projetor (arraste os cantos aqui ou direto na projeção)</p><canvas id="mini"></canvas></div>
  <div id="info"></div>
 </div>
 <div id="dir">
  <button class="b big" id="abrir">Abrir janela do projetor</button>
  <p class="nota">Arraste a janela para a tela do projetor e dê duplo clique (ou F) para tela cheia.</p>

  <h2>Grade do quadro</h2>
  <div class="lin"><label>Colunas</label><input type="number" id="cols" min="1" max="200"><label style="flex:0 0 48px">Linhas</label><input type="number" id="rows" min="1" max="200"></div>
  <div class="lin"><label>Fresta</label><input type="range" id="fresta" min="0" max="0.45" step="0.01"><output id="o-fresta"></output></div>
  <p class="nota">A fresta apaga a borda de cada bloco, para a luz não escorrer para o vizinho nem para a lateral.</p>

  <h2>Calibração</h2>
  <div class="bts" id="cantos"></div>
  <div class="bts">
   <button class="b" data-n="-1,0">←</button><button class="b" data-n="1,0">→</button>
   <button class="b" data-n="0,-1">↑</button><button class="b" data-n="0,1">↓</button>
   <button class="b" id="fino">Passo fino</button>
  </div>
  <label class="ck"><input type="checkbox" id="calib"> Mostrar contorno e cantos na projeção</label>
  <label class="ck"><input type="checkbox" id="numeros"> Numerar blocos (coluna·linha)</label>
  <div class="bts"><button class="b" id="resetar">Recentralizar cantos</button><button class="b" id="exportar">Exportar mapeamento</button><button class="b" id="importar">Importar</button></div>

  <h2>Teste</h2>
  <div class="bts" id="testes"></div>
  <h2>Efeitos (primeiros rascunhos)</h2>
  <div class="bts" id="efeitos"></div>

  <h2>Ajustes</h2>
  <div class="lin"><label>Brilho</label><input type="range" id="brilho" min="0" max="1" step="0.01"><output id="o-brilho"></output></div>
  <div class="lin"><label>Velocidade</label><input type="range" id="vel" min="0" max="4" step="0.05"><output id="o-vel"></output></div>
  <div class="lin"><label>Cor</label><input type="color" id="cor"></div>
  <p class="nota">Teclas: 1–4 canto · setas movem (Shift = 10×) · C contorno · N números.</p>
 </div>
</div>`;

const $=id=>document.getElementById(id);
const TESTES=[['grade','Grade xadrez'],['branco','Tudo aceso'],['bordas','Só a moldura'],['varredura','Varredura'],['umporum','Um por um'],['cantos4','Cantos coloridos']];
const EFEITOS=[['onda','Onda'],['chuva','Chuva'],['cintilar','Cintilar'],['plasma','Plasma'],['vida','Jogo da Vida'],['desenhar','Desenhar'],['camera','Câmera']];
let px=new Uint8ClampedArray(S.cols*S.rows*3);
let pintura=new Uint8Array(S.cols*S.rows);
let passoFino=false, t0=performance.now();

function botoes(alvo,lista){ $(alvo).innerHTML=lista.map(([k,n])=>`<button class="b" data-e="${k}">${n}</button>`).join(''); }
botoes('testes',TESTES); botoes('efeitos',EFEITOS);
$('cantos').innerHTML=['Sup. esq.','Sup. dir.','Inf. dir.','Inf. esq.'].map((n,k)=>`<button class="b" data-c="${k}">${k+1} · ${n}</button>`).join('');

function ui(){
  $('cols').value=S.cols; $('rows').value=S.rows;
  for(const k of ['fresta','brilho','vel']){ $(k).value=S[k]; $('o-'+k).textContent=(+S[k]).toFixed(2); }
  $('cor').value=S.cor; $('calib').checked=S.calib; $('numeros').checked=S.numeros;
  document.querySelectorAll('[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e===S.efeito));
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',+b.dataset.c===S.sel));
  $('fino').classList.toggle('on',passoFino);
  $('info').textContent=`${S.cols} × ${S.rows} = ${S.cols*S.rows} pixels`;
}
function mudou(){ salvar(); canal&&canal.postMessage({tipo:'estado',S}); ui(); }
if(canal) canal.onmessage=ev=>{ const m=ev.data;
  if(m.tipo==='estado'){ S=Object.assign(S,m.S); ui(); }
  if(m.tipo==='ola'){ canal.postMessage({tipo:'estado',S}); }
};

$('abrir').onclick=()=>window.open(location.pathname+'?saida','quadro_saida','popup,width=1280,height=720');
document.addEventListener('click',ev=>{
  const e=ev.target.closest('[data-e]'); if(e){ S.efeito=e.dataset.e; if(S.efeito==='camera') ligarCamera(); if(S.efeito==='vida') semearVida(); mudou(); }
  const c=ev.target.closest('[data-c]'); if(c){ S.sel=+c.dataset.c; mudou(); }
  const n=ev.target.closest('[data-n]'); if(n){ const [dx,dy]=n.dataset.n.split(',').map(Number); const p=passoFino?0.0005:0.004; S.cantos[S.sel][0]+=dx*p; S.cantos[S.sel][1]+=dy*p*16/9; mudou(); }
});
$('fino').onclick=()=>{passoFino=!passoFino;ui();};
function redimensionar(){ S.cols=Math.max(1,Math.min(200,+$('cols').value||30)); S.rows=Math.max(1,Math.min(200,+$('rows').value||24));
  px=new Uint8ClampedArray(S.cols*S.rows*3); pintura=new Uint8Array(S.cols*S.rows); vida=null; mudou(); }
$('cols').onchange=redimensionar; $('rows').onchange=redimensionar;
for(const k of ['fresta','brilho','vel']) $(k).oninput=()=>{S[k]=+$(k).value;mudou();};
$('cor').oninput=()=>{S.cor=$('cor').value;mudou();};
$('calib').onchange=()=>{S.calib=$('calib').checked;mudou();};
$('numeros').onchange=()=>{S.numeros=$('numeros').checked;mudou();};
$('resetar').onclick=()=>{S.cantos=JSON.parse(JSON.stringify(PADRAO.cantos));mudou();};
$('exportar').onclick=()=>{
  const dados={quadro:'difusor de madeira',cols:S.cols,rows:S.rows,fresta:S.fresta,cantos_normalizados:S.cantos,ordem_cantos:['sup-esq','sup-dir','inf-dir','inf-esq']};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}));
  a.download='quadro-de-pixels-mapeamento.json'; a.click();
};
$('importar').onclick=()=>{ const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=async()=>{ try{ const d=JSON.parse(await i.files[0].text()); S.cols=d.cols;S.rows=d.rows;S.fresta=d.fresta;S.cantos=d.cantos_normalizados; redimensionar(); }catch(e){alert('Arquivo inválido');} }; i.click(); };
teclas(mudou);

/* pré-visualização plana + pintura */
const prev=$('prev'), pctx=prev.getContext('2d');
const mini=$('mini'), mctx=mini.getContext('2d');
arrastavel(mini,mudou);
let pintando=-1;
prev.addEventListener('pointerdown',ev=>{ const k=celula(ev); if(k<0)return; pintando=pintura[k]?0:1; pintura[k]=pintando; if(S.efeito!=='desenhar'){S.efeito='desenhar';mudou();} prev.setPointerCapture(ev.pointerId); });
prev.addEventListener('pointermove',ev=>{ if(pintando<0)return; const k=celula(ev); if(k>=0) pintura[k]=pintando; });
prev.addEventListener('pointerup',()=>pintando=-1);
function celula(ev){ const r=prev.getBoundingClientRect(); const c=Math.floor((ev.clientX-r.left)/r.width*S.cols), l=Math.floor((ev.clientY-r.top)/r.height*S.rows);
  return (c<0||l<0||c>=S.cols||l>=S.rows)?-1:l*S.cols+c; }

/* câmera */
let video=null; const vcv=document.createElement('canvas'), vctx=vcv.getContext('2d',{willReadFrequently:true});
async function ligarCamera(){ if(video) return; try{ const st=await navigator.mediaDevices.getUserMedia({video:true}); video=document.createElement('video'); video.srcObject=st; video.muted=true; video.playsInline=true; await video.play(); }catch(e){ alert('Não consegui abrir a câmera.'); } }

/* jogo da vida */
let vida=null, vidaT=0;
function semearVida(){ vida=new Uint8Array(S.cols*S.rows).map(()=>Math.random()<.3?1:0); }

/* ---------- efeitos: devolvem [r,g,b] 0..1 por bloco ---------- */
function hex(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }
function hsv(h,s,v){ const f=n=>{const k=(n+h*6)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));}; return [f(5),f(3),f(1)]; }
const ruido=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
let chuva=[];
function calcular(t){
  const C=S.cols,R=S.rows,N=C*R, cor=hex(S.cor), b=S.brilho, T=t*S.vel;
  if(px.length!==N*3) px=new Uint8ClampedArray(N*3);
  const set=(k,rgb,m=1)=>{px[k*3]=rgb[0]*m*b*255;px[k*3+1]=rgb[1]*m*b*255;px[k*3+2]=rgb[2]*m*b*255;};
  px.fill(0);
  if(S.efeito==='vida' && !vida) semearVida();
  if(S.efeito==='vida' && t-vidaT>0.35/Math.max(.05,S.vel)){ vidaT=t; const n=new Uint8Array(N);
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){let v=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr||dc)v+=vida[((r+dr+R)%R)*C+(c+dc+C)%C];}
      const k=r*C+c; n[k]=(v===3||(v===2&&vida[k]))?1:0;}
    vida=n; if(!vida.some(x=>x)) semearVida(); }
  if(S.efeito==='chuva'){ if(Math.random()<0.5*S.vel) chuva.push({c:Math.floor(Math.random()*C),y:0,v:6+Math.random()*10});
    chuva.forEach(g=>g.y+=g.v/60*S.vel); chuva=chuva.filter(g=>g.y<R+6); }
  const umk=Math.floor(T*4)%N;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    const k=r*C+c, u=c/(C-1||1), v=r/(R-1||1);
    switch(S.efeito){
      case 'grade': set(k,cor,(r+c)%2?0.25:1); break;
      case 'branco': set(k,cor); break;
      case 'bordas': if(r===0||c===0||r===R-1||c===C-1) set(k,cor); break;
      case 'varredura': { const fase=Math.floor(T*6)%(R+C); if(fase<R? r===fase : c===fase-R) set(k,cor); break; }
      case 'umporum': if(k===umk) set(k,cor); break;
      case 'cantos4': { const cs=[[0,0,[1,0,0]],[C-1,0,[0,1,0]],[C-1,R-1,[0,0,1]],[0,R-1,[1,1,0]]];
        for(const [cc,rr,co] of cs) if(Math.abs(c-cc)<=1&&Math.abs(r-rr)<=1) set(k,co); if(r===Math.floor(R/2)&&c===Math.floor(C/2)) set(k,[1,1,1]); break; }
      case 'onda': { const d=Math.hypot(c-C/2,(r-R/2)); set(k,cor,0.5+0.5*Math.sin(d*0.6-T*3)); break; }
      case 'cintilar': { const f=ruido(c,r); set(k,cor,Math.pow(0.5+0.5*Math.sin(T*(1+f*3)+f*50),8)); break; }
      case 'plasma': { const s=Math.sin(u*6+T)+Math.sin(v*5-T*1.3)+Math.sin((u+v)*4+T*.7)+Math.sin(Math.hypot(u-.5,v-.5)*10-T*2);
        set(k,hsv((s/8+T*.05)%1+1,0.8,1)); break; }
      case 'vida': if(vida[k]) set(k,cor); break;
      case 'desenhar': if(pintura[k]) set(k,cor); break;
    }
  }
  if(S.efeito==='chuva') chuva.forEach(g=>{ for(let i=0;i<5;i++){ const r=Math.floor(g.y)-i; if(r>=0&&r<R){ const k=r*C+g.c; const m=1-i/5; px[k*3]=Math.max(px[k*3],cor[0]*m*b*255);px[k*3+1]=Math.max(px[k*3+1],cor[1]*m*b*255);px[k*3+2]=Math.max(px[k*3+2],cor[2]*m*b*255);} } });
  if(S.efeito==='camera' && video && video.readyState>=2){
    vcv.width=C; vcv.height=R; vctx.save(); vctx.scale(-1,1); vctx.drawImage(video,-C,0,C,R); vctx.restore();
    const d=vctx.getImageData(0,0,C,R).data; for(let k=0;k<N;k++){px[k*3]=d[k*4]*b;px[k*3+1]=d[k*4+1]*b;px[k*3+2]=d[k*4+2]*b;}
  }
}

function desenharPrev(){
  const C=S.cols,R=S.rows, lado=Math.floor(Math.min(prev.clientWidth/C, 420/R));
  const W=C*lado,H=R*lado, d=devicePixelRatio||1;
  if(prev.width!==W*d){ prev.width=W*d; prev.height=H*d; }
  prev.style.maxWidth=W+'px';
  pctx.setTransform(d,0,0,d,0,0); pctx.fillStyle='#000'; pctx.fillRect(0,0,W,H);
  const g=Math.max(1,lado*0.08);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){ const i=(r*C+c)*3;
    pctx.fillStyle=`rgb(${px[i]},${px[i+1]},${px[i+2]})`;
    if(px[i]+px[i+1]+px[i+2]===0) pctx.fillStyle='#14100c';
    pctx.fillRect(c*lado+g/2,r*lado+g/2,lado-g,lado-g); }
  if(S.efeito==='umporum'){ const k=Math.floor((performance.now()-t0)/1000*S.vel*4)%(C*R); $('info').textContent=`${C} × ${R} = ${C*R} pixels · aceso: coluna ${k%C+1}, linha ${Math.floor(k/C)+1}`; }
}
function desenharMini(){
  const w=mini.clientWidth, h=Math.round(w*9/16), d=devicePixelRatio||1;
  if(mini.width!==w*d){ mini.width=w*d; mini.height=h*d; mini.style.height=h+'px'; }
  desenhar(mctx,mini.width,mini.height,px,{sempreCantos:true,raio:9*d,linha:1.5*d});
}
ui();
(function loop(now){
  const t=(now-t0)/1000;
  calcular(t);
  canal&&canal.postMessage({tipo:'quadro',px});
  desenharPrev(); desenharMini();
  requestAnimationFrame(loop);
})(performance.now());
}
</script>
