","Epimeteu e Pandora","Cadmo e Harmonia","Peleu e Tétis"],"A arca encalhou no Parnaso. As pedras que eles jogaram para trás viraram homens e mulheres."]],"persefone":[["Qual é o outro nome de Perséfone, que significa “a moça”?",["Core","Hebe","Íris","Nix"],"Antes do rapto, ela era chamada Core."],["Quem é a mãe de Perséfone?",["Deméter","Hera","Leto","Reia"],"Perséfone é filha de Zeus e de Deméter, deusa dos grãos."],["Que flor Perséfone estava arrancando quando a terra se abriu?",["Um narciso","Uma rosa","Uma anêmona","Uma violeta"],"Gaia fez brotar, a pedido de Zeus, um narciso de cem flores para atraí-la."],["Em que ilha, segundo Ovídio, aconteceu o rapto?",["Sicília","Creta","Chipre","Lesbos"],"Junto ao lago Pérgusa, perto de Ena, no coração da Sicília, a ilha de Deméter."],["Quem ouviu ou viu o rapto de Perséfone?",["Hécate e Hélio","Hermes e Apolo","Ártemis e Atena","Eco e Pã"],"Hécate ouviu de sua caverna; Hélio, o Sol, que tudo vê, contou depois a verdade a Deméter."],["Qual ninfa tentou barrar o carro de Hades perto de Siracusa?",["Ciane","Eco","Calipso","Aretusa"],"Ciane disse que uma moça deve ser pedida, não roubada. Depois se dissolveu em água de tanto chorar."],["Em que cidade Deméter se disfarçou de velha e foi acolhida no palácio?",["Elêusis","Atenas","Delfos","Argos"],"Ela se sentou junto ao Poço das Virgens, em Elêusis, e foi levada ao palácio do rei Céleo."],["Que príncipe Deméter tentou tornar imortal colocando-o no fogo?",["Demofonte","Triptólemo","Penteu","Ganimedes"],"A mãe do menino flagrou o rito e Deméter se revelou."],["O que Hades deu a Perséfone antes de deixá-la partir?",["Sementes de romã","Uma maçã de ouro","Um figo","Um cacho de uvas"],"Quem come no reino dos mortos fica preso a ele: por isso ela volta ao marido parte do ano."],["Quem espalhou a agricultura pelo mundo depois de aprender os ritos de Deméter?",["Triptólemo","Demofonte","Céleo","Hermes"],"Antes de voltar ao Olimpo, Deméter ensinou seus ritos ao príncipe Triptólemo."]],"nascimentos-divinos":[["Do que nasce Afrodite, segundo Hesíodo?",["Da espuma do mar","Da coxa de Zeus","Da cabeça de Zeus","De um ovo de cisne"],"Da espuma (aphrós) formada ao redor dos órgãos de Urano lançados ao mar por Cronos."],["Qual é a primeira terra que Afrodite avista ao sair do mar?",["Citera","Chipre","Delos","Rodes"],"Primeiro Citera; depois o vento Zéfiro a leva até Chipre."],["Quem recebe Afrodite na praia de Chipre e a veste?",["As Horas, deusas das estações","As Musas","As Moiras","As Nereidas"],"As Horas lhe dão roupas imortais, coroa de ouro e brincos de flores."],["Quem é a mãe de Apolo e Ártemis?",["Leto","Maia","Dione","Sêmele"],"Leto, perseguida por Hera, não encontrava terra que a recebesse para o parto."],["Qual ilha aceitou receber Leto para o parto?",["Delos","Citera","Creta","Naxos"],"Delos, que flutuava solta pelo mar, aceitou em troca de um templo rico. Depois Zeus a fixou com colunas."],["Que deusa dos partos Hera reteve para atrasar o nascimento dos gêmeos?",["Ilitia","Hebe","Hécate","Têmis"],"As outras deusas subornaram Ilitia com um colar de ouro e âmbar."],["Onde Hermes nasceu?",["Numa caverna do monte Cilene","No monte Ida","No Olimpo","No Parnaso"],"Maia, filha de Atlas, deu à luz Hermes no monte Cilene, na Arcádia."],["Com o que Hermes fez a primeira lira?",["Com o casco de uma tartaruga","Com um chifre de cabra","Com uma concha","Com uma cabaça"],"Esvaziou o casco e esticou cordas de tripa, no primeiro dia de vida."],["O que o bebê Hermes roubou de Apolo?",["Cinquenta vacas","Seu arco","Sua lira","Seus cavalos"],"Fez as vacas andarem de costas para confundir os rastros. A paz veio quando deu a lira a Apolo."],["Qual serpente-dragão Apolo matou para tomar Delfos?",["Píton","Ládon","Equidna","Tifão"],"Do apodrecimento do corpo (pýthein) viria o nome Pito; a sacerdotisa passou a se chamar Pítia."]],"atenas-poseidon":[["Quem era o rei da Ática na época da disputa?",["Cécrops","Egeu","Teseu","Céleo"],"Cécrops foi testemunha do presente de Atena."],["Como era o corpo do rei Cécrops?",["Metade homem, metade serpente","Homem com cabeça de touro","Gigante de cem braços","Gigante de um olho só"],"Cécrops é descrito como metade homem e metade serpente."],["Quais dois deuses disputaram a cidade?",["Atena e Poseidon","Atena e Ares","Hera e Poseidon","Apolo e Dioniso"],"Os dois queriam a mesma cidade, ainda sem nome, na planície da Ática."],["Em que colina aconteceu a disputa?",["Na Acrópole","No Areópago","No Olimpo","No Parnaso"],"Poseidon golpeou a rocha da Acrópole; Atena plantou ali sua oliveira."],["O que brotou quando Poseidon golpeou a rocha com o tridente?",["Uma fonte de água salgada","Uma fonte de água doce","Uma vinha","Uma figueira"],"Era um “mar” no alto da colina, sinal do poder naval que ele oferecia."],["Qual foi o presente de Atena?",["Uma oliveira","Uma vinha","Um campo de trigo","Uma figueira"],"A oliveira dava alimento, óleo para as lâmpadas e madeira, e era presente de paz."],["Segundo Apolodoro, quem julgou a disputa?",["Os doze deuses","Zeus sozinho","As Musas","Páris"],"Outras versões falam de Cécrops ou do próprio povo como juízes."],["O que Poseidon fez, furioso, depois de perder?",["Inundou a planície de Elêusis","Derrubou as muralhas de Atenas","Afundou a frota ateniense","Secou todos os rios da Ática"],"A derrota teve consequências: a planície de Elêusis ficou sob as águas."],["Na versão de Varrão, por que Atena venceu?",["As mulheres votaram e eram maioria","Zeus desempatou a seu favor","Poseidon desistiu","Cécrops foi subornado"],"Para aplacar Poseidon, os homens teriam tirado das mulheres o direito ao voto."],["O que aconteceu à oliveira sagrada quando os persas incendiaram a Acrópole em 480 a.C.?",["Queimou e brotou de novo no dia seguinte","Foi levada para a Pérsia","Foi cortada pelos espartanos","Secou para sempre"],"Heródoto conta que um ramo do tamanho de um braço já tinha brotado no dia seguinte."]],"dioniso":[["Quem é a mãe de Dioniso?",["Sêmele, filha de Cadmo","Leto","Io","Alcmena"],"Dioniso é o único olímpico filho de uma mortal, Sêmele, princesa de Tebas."],["Quem plantou em Sêmele a dúvida sobre a identidade de seu amante?",["Hera, disfarçada de velha ama","Atena","Éris","Afrodite"],"Hera sugeriu que Sêmele pedisse a Zeus para se mostrar como se mostra à esposa."],["Onde Zeus costurou o feto de Dioniso depois da morte de Sêmele?",["Na própria coxa","No braço","Na cabeça","No peito"],"Dioniso nasceu pela segunda vez da coxa de Zeus."],["O que significa o título Dimetor, dado a Dioniso?",["O de duas mães","O nascido do fogo","O filho do raio","O errante"],"Ele foi gerado por Sêmele e terminou a gestação no corpo de Zeus."],["Em que monte as ninfas criaram Dioniso escondido de Hera?",["Nisa","Ida","Cilene","Pélion"],"Foi em Nisa que o jovem deus descobriu a videira e aprendeu a fazer vinho."],["Qual deusa curou Dioniso da loucura enviada por Hera?",["Cibele, na Frígia","Deméter","Ártemis","Atena"],"Cibele o curou e o iniciou em seus ritos."],["Como se chama o bastão com uma pinha na ponta levado pelas Mênades?",["Tirso","Caduceu","Cetro","Clava"],"O tirso é o símbolo do cortejo de Dioniso. O caduceu é o bastão de Hermes."],["Qual rei de Tebas, primo do deus, proibiu o culto de Dioniso?",["Penteu","Laio","Creonte","Polidectes"],"Penteu mandou prender o estrangeiro, mas as correntes caíram sozinhas."],["Quem despedaçou Penteu no monte Citerão?",["As Bacantes, guiadas por sua mãe, Agave","As Erínias","Os Sátiros","As Amazonas"],"Agave acreditava estar caçando um leão e voltou a Tebas com a cabeça do filho no tirso."],["Com quem Dioniso se casa em Naxos?",["Ariadne","Fedra","Medeia","Hipsípile"],"Ariadne fora abandonada por Teseu. A coroa que Dioniso lhe deu virou a Coroa Boreal."]],"hercules":[["A quem Héracles teve de servir durante os doze trabalhos?",["Ao primo Euristeu, rei de Tirinto e Micenas","Ao rei Minos","Ao rei Áugias","Ao rei Laomedonte"],"O oráculo de Delfos o mandou servir Euristeu para se purificar da morte da mulher e dos filhos."],["Como Héracles matou o Leão de Nemeia?",["Estrangulando-o com as mãos","Com uma flecha no olho","Com a espada","Com a clava"],"A pele do leão não podia ser furada; as flechas ricocheteavam e a espada se dobrou."],["Quem ajudou Héracles a vencer a Hidra de Lerna, queimando os pescoços cortados?",["Seu sobrinho Iolau","Teseu","Hilas","Abdero"],"Por causa dessa ajuda, Euristeu se recusou a contar o trabalho da Hidra."],["Que sábio centauro, mestre de Aquiles, foi ferido sem querer por uma flecha de Héracles?",["Quíron","Folo","Nesso","Euritião"],"Imortal e sem suportar a dor, Quíron acabou cedendo sua imortalidade a Prometeu."],["Como Héracles limpou os estábulos de Áugias em um único dia?",["Desviando os rios Alfeu e Peneu","Queimando o estrume","Com a ajuda de cem escravos","Soltando o gado no mar"],"Os rios atravessaram o curral e levaram toda a sujeira."],["O que Atena deu a Héracles para espantar as aves do lago Estínfalo?",["Castanholas de bronze (crótalos)","Uma rede de ouro","Um escudo espelhado","Uma trombeta de guerra"],"Assustadas com o barulho, as aves levantaram voo e ele as abateu com flechas."],["De quem era o cinturão que Héracles foi buscar em Temiscira?",["De Hipólita, rainha das Amazonas","De Pentesileia","De Atalanta","De Admete"],"Admete, filha de Euristeu, queria o cinturão. Hera fez as Amazonas atacarem e Héracles matou Hipólita."],["Que marco Héracles ergueu no estreito entre a Europa e a Líbia, a caminho de Gerião?",["Duas colunas, as Colunas de Héracles","Um farol","Uma muralha de bronze","Um templo a Zeus"],"Uma coluna de cada lado do estreito, onde hoje fica Gibraltar."],["Quem buscou as maçãs de ouro das Hespérides enquanto Héracles segurava o céu?",["Atlas","Prometeu","Nereu","Ládon"],"Atlas quis ficar livre, mas Héracles o enganou pedindo que segurasse o céu “só um instante”."],["Qual foi o último dos doze trabalhos?",["Trazer Cérbero do reino dos mortos","Matar o Leão de Nemeia","Capturar o touro de Creta","Roubar o gado de Gerião"],"Hades só permitiu levar o cão de três cabeças se Héracles o dominasse sem armas."]],"perseu":[["Quem é o avô de Perseu, a quem um oráculo predisse a morte pelas mãos do neto?",["Acrísio, rei de Argos","Polidectes","Cefeu","Díctis"],"Acrísio prendeu a filha Dânae numa câmara de bronze para tentar escapar do oráculo."],["De que forma Zeus entrou na câmara de bronze de Dânae?",["Como uma chuva de ouro","Como um touro branco","Como um cisne","Como uma nuvem"],"Zeus atravessou o teto como chuva de ouro, e dela nasceu Perseu."],["Em que ilha a arca com Dânae e o bebê Perseu foi parar?",["Sérifos","Delos","Creta","Esciros"],"A arca ficou presa na rede de um pescador da ilha de Sérifos, nas Cíclades."],["Qual pescador acolheu Dânae e Perseu?",["Díctis","Polidectes","Fineu","Molorco"],"Díctis era irmão do rei Polidectes. No fim, Perseu o fez rei da ilha."],["O que as três Greias dividiam entre si?",["Um único olho e um único dente","Uma única voz","Um único par de asas","Uma única mão"],"Perseu roubou o olho e só o devolveu quando elas lhe indicaram o caminho."],["Qual das três Górgonas era mortal?",["Medusa","Esteno","Euríale","Equidna"],"Esteno e Euríale eram imortais; só Medusa, a do meio, podia morrer."],["Como Perseu conseguiu cortar a cabeça de Medusa sem virar pedra?",["Olhou o reflexo dela no escudo polido de Atena","Atacou de olhos vendados","Usou o elmo de Hades para não ser visto","Esperou a noite sem lua"],"Ele mirou o reflexo no escudo e cortou a cabeça com a foice de Hermes."],["Que seres saltaram do pescoço de Medusa?",["O cavalo alado Pégaso e o guerreiro Crisaor","A Quimera e o cão Ortro","As serpentes do deserto","As Harpias"],"Ambos eram filhos de Poseidon."],["Quem era Andrômeda?",["Filha do rei Cefeu e de Cassiopeia","Filha de Polidectes","Irmã de Medusa","Uma Nereida"],"Cassiopeia se gabou de ser mais bela que as Nereidas, e Poseidon mandou um monstro marinho."],["Como Acrísio acabou morrendo?",["Atingido por um disco de Perseu desviado pelo vento","Petrificado pela cabeça de Medusa","Num naufrágio","Na batalha contra Fineu"],"Aconteceu nos jogos fúnebres de Larissa, para onde Acrísio havia fugido."]],"teseu":[["Quem é o pai humano de Teseu?",["Egeu, rei de Atenas","Piteu, rei de Trezena","Minos","Cécrops"],"Na mesma noite, Poseidon também visitou Etra, por isso algumas versões o fazem filho do deus."],["O que Egeu escondeu sob uma pedra para o filho encontrar?",["Uma espada e um par de sandálias","Um escudo e uma lança","Um anel e um manto","Uma coroa e um cetro"],"Aos dezesseis anos, Teseu ergueu a pedra com facilidade."],["Qual bandido do istmo de Corinto vergava pinheiros para matar os viajantes?",["Sinis","Círon","Procusto","Perifetes"],"Sinis era chamado Pitiocamptes, “o que verga pinheiros”. Teseu o matou do mesmo jeito."],["Qual bandido obrigava os viajantes a lavar seus pés e os chutava para uma tartaruga gigante?",["Círon","Sinis","Cercião","Procusto"],"Teseu agarrou o pé de Círon e o lançou ao mar, onde a tartaruga o recebeu."],["Qual bandido tinha uma cama de ferro e esticava ou cortava os hóspedes para caberem nela?",["Procusto","Perifetes","Cercião","Sinis"],"Teseu deitou Procusto na própria cama e o ajustou do mesmo jeito."],["Quem tentou envenenar Teseu quando ele chegou a Atenas?",["Medeia, esposa de Egeu","Etra","Fedra","Ariadne"],"Egeu reconheceu a espada do filho e derrubou a taça de veneno a tempo."],["Quantos jovens Atenas enviava a Creta como tributo ao Minotauro?",["Sete rapazes e sete moças","Doze rapazes","Cinquenta jovens","Três rapazes e três moças"],"Era o castigo pela morte de Androgeu, filho de Minos."],["O que Ariadne deu a Teseu para sair do Labirinto?",["Um novelo de fio","Uma tocha","Um mapa","Uma chave de bronze"],"A ideia foi de Dédalo, o construtor do Labirinto."],["Em que ilha Teseu abandonou Ariadne?",["Naxos","Delos","Lemnos","Creta"],"Ariadne adormeceu na praia de Naxos e acordou vendo as velas se afastando."],["Que sinal Teseu esqueceu de trocar, causando a morte de Egeu?",["As velas negras por velas brancas","A bandeira de Atenas pela de Creta","O fogo do farol","O toque das trombetas"],"Egeu viu as velas negras do cabo Súnio e se jogou ao mar, que passou a se chamar mar Egeu."]],"belerofonte":[["De que cidade Belerofonte era príncipe?",["Corinto","Tirinto","Argos","Atenas"],"Belerofonte era príncipe de Corinto e neto de Sísifo."],["O que Atena entregou a Belerofonte em sonho?",["Uma rédea de ouro","Uma lança de bronze","Um par de asas","Um escudo espelhado"],"Ao acordar no altar da deusa, a rédea estava em suas mãos."],["Onde Belerofonte encontrou Pégaso para montá-lo?",["Bebendo na fonte de Pirene, em Corinto","No monte Olimpo","Nas margens do Nilo","Na fonte Castália, em Delfos"],"Jogou a rédea sobre a cabeça do cavalo, que se deixou montar sem resistência."],["Qual rainha acusou Belerofonte falsamente em Tirinto?",["Anteia (Estenebeia), esposa do rei Preto","Hipodâmia","Fedra","Mérope"],"Ele recusou a sedução da rainha, e ela, humilhada, o acusou de tentar violentá-la."],["Para onde o rei Preto mandou Belerofonte?",["Para a Lícia, ao rei Ióbates","Para Creta, ao rei Minos","Para Troia","Para o Egito"],"Preto não podia matar um hóspede sem ofender Zeus, então o mandou ao sogro."],["O que Belerofonte levava sem saber para o rei da Lícia?",["Uma tábua selada pedindo que ele fosse morto","Um tesouro de ouro","Um colar amaldiçoado","Um convite de casamento"],"É a única menção à escrita em toda a obra de Homero."],["Como era a Quimera?",["Cabeça de leão, corpo de cabra e cauda de serpente","Rosto de mulher, corpo de leão e asas de águia","Três corpos unidos pela cintura","Nove cabeças de serpente"],"O monstro cuspia fogo e devastava a Lícia."],["Depois da Quimera, quais inimigos Ióbates mandou Belerofonte enfrentar?",["Os Sólimos e as Amazonas","Os Centauros e os Lápitas","Os Gigantes de Flegra","Os Ciclopes"],"Ele venceu todos, e ainda a emboscada dos melhores guerreiros do rei."],["Por que Belerofonte caiu de Pégaso?",["Tentou voar até o Olimpo e Zeus mandou um moscardo picar o cavalo","Pégaso se assustou com a Quimera","Atena retomou a rédea","Uma tempestade de Poseidon o derrubou"],"No auge da glória, ficou arrogante e quis subir ao céu dos deuses."],["A quem Pégaso passou a servir depois da queda de Belerofonte?",["A Zeus, carregando seus raios","A Poseidon","A Atena","A Perseu"],"Pégaso continuou subindo e virou constelação."]],"argonautas":[["O que Jasão foi buscar na Cólquida?",["O Velocino de Ouro","As maçãs de ouro","O colar de Harmonia","O Paládio"],"O Velocino era a pele do carneiro alado que havia salvado Frixo."],["De que homem o oráculo mandou o rei Pélias desconfiar?",["Do homem com uma sandália só","Do homem de cabelos ruivos","Do homem que viesse do mar","Do filho de um deus"],"Jasão perdeu uma sandália ao carregar uma velha, Hera disfarçada, pelo rio Anauro."],["Como se chamava o navio dos heróis?",["Argo","Pégaso","Eeia","Dodona"],"A Argo foi construída por Argos com a ajuda de Atena e tinha uma viga de carvalho que falava."],["Quem era a rainha de Lemnos, a ilha onde não havia homens?",["Hipsípile","Medeia","Calipso","Hipólita"],"As lemnianas tinham matado todos os homens; só Hipsípile poupou o pai, Toante."],["Qual jovem, escudeiro de Héracles, foi puxado por uma ninfa para dentro de uma fonte?",["Hilas","Abdero","Iolau","Mopso"],"Héracles saiu procurando Hilas pela floresta, e a Argo partiu sem os dois."],["Qual Argonauta venceu o gigante Âmico no pugilato?",["Pólux","Castor","Héracles","Peleu"],"Pólux, o melhor boxeador da Grécia, quebrou o crânio de Âmico com um golpe acima da orelha."],["Que monstros roubavam e sujavam a comida do vidente Fineu?",["As Harpias","As Sereias","As Górgonas","As Erínias"],"Zetes e Calais, filhos alados do Vento Norte, as perseguiram até as ilhas Estrófades."],["Como os Argonautas atravessaram as Simplégades, as rochas que se chocam?",["Soltaram uma pomba à frente e remaram quando as rochas se abriram","Esperaram a noite para passar","Orfeu fez as rochas pararem com a lira","Héracles segurou as rochas abertas"],"A pomba perdeu as penas da cauda, a Argo perdeu o ornamento da popa, e Atena empurrou o navio."],["Quem ajudou Jasão a cumprir as provas do rei Eetes?",["Medeia, filha do rei","Circe","Atalanta","Hipsípile"],"Medeia deu a Jasão um unguento que o tornava invulnerável ao fogo e ao ferro por um dia."],["Como Medeia derrotou o gigante de bronze Talos, em Creta?",["Enfeitiçou-o e ele soltou o prego da única veia no tornozelo","Derreteu-o com fogo","Fez Héracles flechá-lo","Afogou-o no mar"],"O icor escorreu como chumbo derretido e o gigante desabou."]],"calidon":[["Qual rei esqueceu de oferecer as primícias da colheita a Ártemis?",["Eneu, rei de Cálidon","Pélias, rei de Iolco","Acrísio, rei de Argos","Adrasto, rei de Argos"],"Eneu honrou todos os deuses, menos Ártemis."],["Que deusa mandou o javali gigante contra Cálidon?",["Ártemis","Hera","Atena","Afrodite"],"O javali destruía vinhedos, gado e gente."],["Quem reuniu os heróis para a caçada?",["O príncipe Meléagro","Jasão","Teseu","Héracles"],"Meléagro reuniu a maior assembleia de heróis antes da guerra de Troia."],["O que as Moiras disseram à mãe de Meléagro quando ele nasceu?",["Que ele viveria enquanto um tição na lareira não se consumisse","Que ele morreria pelas mãos de uma mulher","Que ele seria rei de Tebas","Que ele morreria no mar"],"Alteia apagou o tição e o escondeu num baú."],["Como se chamava a mãe de Meléagro?",["Alteia","Alcmena","Etra","Atalanta"],"Foi Alteia quem guardou e, depois, queimou o tição."],["Quem foi o primeiro a ferir o javali?",["A caçadora Atalanta, com uma flecha","Meléagro, com a lança","Peleu","Castor"],"Por ter derramado o primeiro sangue, Atalanta recebeu o prêmio."],["Quem acertou o olho do javali?",["Anfiarau","Nestor","Jasão","Pólux"],"Atalanta feriu primeiro, Anfiarau acertou o olho e Meléagro deu o golpe final."],["Que prêmio Meléagro deu a Atalanta?",["A pele e a cabeça do javali","Uma coroa de ouro","Sua própria lança","Metade do reino"],"Meléagro estava apaixonado por Atalanta."],["Por que Meléagro matou os próprios tios?",["Eles tomaram o prêmio de Atalanta","Eles mataram o javali antes dele","Eles tentaram usurpar o trono","Eles ofenderam Ártemis"],"Os irmãos de Alteia ficaram indignados de ver o prêmio ir para uma mulher."],["Como Meléagro morreu?",["Alteia jogou o tição no fogo","Foi morto pelo javali","Caiu num precipício","Foi flechado por Apolo"],"Meléagro morreu na hora, longe dali. Arrependida, Alteia se enforcou."]],"cadmo":[["Quem era o pai de Europa?",["Agenor, rei de Tiro","Minos","Cadmo","Cefeu"],"Europa era uma princesa fenícia, irmã de Cadmo."],["Em qual cidade Europa vivia?",["Tiro, na Fenícia","Mênfis","Troia","Babilônia"],"Ela brincava num prado junto ao mar, perto de Tiro."],["Em que animal Zeus se transformou para raptar Europa?",["Num touro branco","Num cisne","Numa águia","Num carneiro dourado"],"O touro era tão manso que Europa subiu em suas costas."],["Para onde o touro levou Europa?",["Para Creta","Para Chipre","Para a Grécia continental","Para o Egito"],"Zeus retomou a forma divina sob um plátano perto de Gortina."],["Quais foram os filhos de Europa com Zeus?",["Minos, Radamanto e Sarpédon","Cadmo, Fênix e Cílix","Castor, Pólux e Helena","Etéocles, Polinices e Antígona"],"Minos foi rei de Creta; Radamanto, famoso pela justiça; Sarpédon, rei na Lícia."],["O que o oráculo de Delfos mandou Cadmo seguir?",["Uma vaca que nunca tivesse puxado o arado","Uma águia de ouro","O curso de um rio","Uma estrela"],"Onde a vaca se deitasse, ele deveria fundar uma cidade: Tebas."],["O que guardava a fonte de Ares onde os companheiros de Cadmo foram buscar água?",["Um dragão, filho de Ares","Uma Esfinge","Um gigante de bronze","Uma Górgona"],"O dragão matou os companheiros, e Cadmo o matou com uma pedra e a lança."],["O que brotou dos dentes do dragão semeados por Cadmo?",["Guerreiros armados, os Spartoí","Oliveiras","Serpentes","Cavalos"],"Eles se mataram até restarem cinco, que ajudaram a construir a Cadmeia."],["Com quem Cadmo se casou?",["Harmonia, filha de Ares e Afrodite","Europa","Sêmele","Ino"],"Todos os deuses foram ao casamento. O colar dado a Harmonia trouxe desgraça às suas donas."],["Em que Cadmo e Harmonia se transformaram na velhice, na Ilíria?",["Em serpentes","Em pássaros","Em árvores","Em estrelas"],"Cadmo pediu para virar serpente; Harmonia pediu para segui-lo."]],"edipo":[["Quem era o pai biológico de Édipo?",["Laio, rei de Tebas","Pólibo, rei de Corinto","Creonte","Tirésias"],"Laio ouviu do oráculo que seria morto pelo filho."],["O que significa o nome Édipo?",["Pés inchados","O que sabe","Filho da montanha","Olhos de fogo"],"O nome vem das feridas nos tornozelos que Laio perfurou e amarrou."],["Em que monte o bebê Édipo foi abandonado?",["Citerão","Parnaso","Hélicon","Fíquio"],"O pastor tebano teve pena e entregou o bebê a um pastor de Corinto."],["Quem criou Édipo como filho?",["O rei Pólibo e a rainha Mérope, de Corinto","Laio e Jocasta","O pastor tebano","Teseu"],"Os reis de Corinto não tinham filhos e nunca lhe disseram que era adotado."],["Onde Édipo matou Laio sem saber quem ele era?",["Numa encruzilhada tríplice, na estrada de Delfos","Nas portas de Tebas","No palácio de Corinto","No monte Citerão"],"Laio ia a Delfos perguntar ao oráculo sobre a Esfinge."],["Como era a Esfinge de Tebas?",["Rosto de mulher, corpo de leão e asas de águia","Cabeça de leão, corpo de cabra e cauda de serpente","Cabeça de touro e corpo de homem","Cem cabeças de serpente"],"Ela devorava quem não resolvesse seu enigma."],["Qual era a resposta ao enigma da Esfinge?",["O homem","O tempo","O sol","A serpente"],"Engatinha de quatro quando bebê, anda com dois pés adulto e usa bengala na velhice."],["Qual adivinho cego disse a Édipo que o assassino de Laio era ele mesmo?",["Tirésias","Calcas","Anfiarau","Fineu"],"Édipo o acusou de conspiração antes de descobrir a verdade."],["Com o que Édipo furou os próprios olhos?",["Com os broches de ouro do vestido de Jocasta","Com uma espada","Com o bastão","Com espinhos"],"Jocasta havia se enforcado ao entender a verdade."],["Onde Édipo morreu, acolhido por Teseu?",["Em Colono, perto de Atenas","Em Tebas","Em Delfos","Em Corinto"],"Seu túmulo secreto deveria proteger Atenas para sempre."]],"sete-contra-tebas":[["Quais são os dois filhos de Édipo que disputam o trono de Tebas?",["Etéocles e Polinices","Castor e Pólux","Atreu e Tiestes","Dânao e Egito"],"Eles combinaram reinar em anos alternados, mas Etéocles se recusou a ceder o trono."],["Qual rei de Argos acolheu Polinices e organizou a expedição?",["Adrasto","Pelasgo","Acrísio","Agamêmnon"],"Adrasto casou suas filhas com Polinices e Tideu."],["Que animais Adrasto viu nos escudos de Polinices e Tideu?",["Um leão e um javali","Uma águia e uma serpente","Um touro e um cavalo","Uma coruja e um lobo"],"Um oráculo havia mandado casar as filhas com um leão e um javali."],["Por que eram sete os chefes da expedição?",["Um para cada porta de Tebas","Um para cada dia da semana","Por ordem de Apolo","Porque eram sete os filhos de Adrasto"],"Tebas tinha sete portas, e diante de cada uma um atacante enfrentou um defensor."],["Qual adivinho sabia que todos, menos Adrasto, morreriam na expedição?",["Anfiarau","Tirésias","Calcas","Mopso"],"Anfiarau se recusou a partir, mas foi convencido pela esposa, subornada."],["Com que objeto Polinices subornou Erifile, esposa de Anfiarau?",["O colar amaldiçoado de Harmonia","O Velocino de Ouro","A coroa de Ariadne","Um cetro de ouro"],"O colar que Hefesto fez para Harmonia trazia desgraça a todas as suas donas."],["Que jogos os sete chefes criaram em memória do menino Ofeltes?",["Os Jogos Nemeus","Os Jogos Olímpicos","Os Jogos Píticos","Os Jogos Ístmicos"],"Por isso os vencedores eram coroados com aipo e os juízes vestiam luto."],["O que aconteceu a Capaneu ao subir as muralhas de Tebas gritando que nem Zeus o impediria?",["Foi fulminado por um raio de Zeus","Caiu das muralhas","Foi petrificado","Foi engolido pela terra"],"Quem foi engolido pela terra, com seu carro, foi Anfiarau."],["Quem desafiou a ordem de Creonte e cobriu de terra o corpo de Polinices?",["Antígona","Ismênia","Jocasta","Electra"],"Ela afirmou que as leis não escritas dos deuses estão acima das leis de um rei."],["Qual foi a condenação de Antígona?",["Ser emparedada viva numa caverna","Ser exilada de Tebas","Ser apedrejada","Ser vendida como escrava"],"Quando Creonte cedeu, era tarde: Antígona, seu noivo Hémon e a mãe dele já estavam mortos."]],"pelope":[["Quem era o pai de Pélope?",["Tântalo, rei da Lídia","Atreu","Enômao","Poseidon"],"Tântalo, filho de Zeus, era tão favorecido que comia com os deuses."],["Que crime Tântalo cometeu para testar os deuses?",["Serviu-lhes o próprio filho como alimento","Roubou o fogo do Olimpo","Matou uma corça sagrada","Revelou os segredos de Zeus"],"Ele queria saber se os deuses eram mesmo oniscientes."],["Qual deusa comeu um pedaço do ombro de Pélope sem perceber?",["Deméter, distraída pelo luto por Perséfone","Hera","Atena","Ártemis"],"Todos os outros deuses perceberam e recuaram horrorizados."],["De que material era o novo ombro de Pélope?",["Marfim","Ouro","Bronze","Mármore"],"Zeus mandou ferver os pedaços num caldeirão e Pélope ressurgiu, mais belo do que antes."],["Qual é o suplício de Tântalo no Tártaro?",["A água e os frutos recuam sempre que ele tenta alcançá-los","Empurrar uma pedra montanha acima","Encher um jarro furado","Ter o fígado devorado por uma águia"],"Daí a expressão “suplício de Tântalo”: ter o que se deseja sempre à vista e nunca ao alcance."],["Com quem Pélope queria se casar?",["Hipodâmia, filha do rei Enômao","Helena","Andrômeda","Atalanta"],"Enômao desafiava cada pretendente a uma corrida de carros e matava os perdedores."],["Qual cocheiro Pélope subornou para vencer a corrida?",["Mírtilo","Automedonte","Ládon","Tífis"],"Mírtilo era o cocheiro do próprio rei Enômao."],["Como Mírtilo sabotou o carro do rei?",["Trocou os pinos das rodas por pinos de cera","Envenenou os cavalos","Cortou as rédeas","Quebrou o eixo"],"As rodas se soltaram e Enômao morreu arrastado. Depois Pélope jogou Mírtilo ao mar, e ele o amaldiçoou."],["O que Atreu serviu ao irmão Tiestes num falso banquete de reconciliação?",["A carne dos próprios filhos de Tiestes","Vinho envenenado","O carneiro de lã dourada","Pão com ervas mágicas"],"A maldição de Mírtilo passou de geração em geração e chegou a Agamêmnon."],["Que região da Grécia recebeu o nome de Pélope?",["O Peloponeso","A Ática","A Beócia","A Tessália"],"Peloponeso quer dizer “ilha de Pélope”."]],"guerra-troia":[["Qual deusa, excluída do casamento, jogou a maçã de ouro sobre a mesa?",["Éris, a deusa da discórdia","Hera","Nêmesis","Hécate"],"Todos os deuses foram convidados, menos Éris."],["O que estava escrito na maçã de ouro?",["“Para a mais bela”","“Para a mais sábia”","“Para a rainha dos deuses”","“Para quem a merecer”"],"Hera, Atena e Afrodite reivindicaram a maçã."],["De quem era o casamento em que tudo começou?",["De Peleu e Tétis","De Zeus e Hera","De Menelau e Helena","De Cadmo e Harmonia"],"Do casamento nasceria Aquiles."],["Quem foi escolhido para julgar as três deusas?",["Páris, príncipe troiano criado como pastor","Heitor","Príamo","Menelau"],"Hermes levou as três deusas a Páris, no monte Ida."],["O que Afrodite ofereceu a Páris?",["O amor da mulher mais bela do mundo","Poder sobre a Ásia","Sabedoria e vitória na guerra","Riquezas sem fim"],"Hera ofereceu poder; Atena, sabedoria e vitória. Páris escolheu Afrodite."],["Quem era o marido de Helena?",["Menelau, rei de Esparta","Agamêmnon","Odisseu","Páris"],"Helena partiu com Páris enquanto Menelau estava em Creta."],["Por que Aquiles se retirou da luta no décimo ano da guerra?",["Agamêmnon tomou dele a cativa Briseida","Foi ferido no calcanhar","Tétis o proibiu","Brigou com Odisseu"],"A cólera de Aquiles é o tema da Ilíada."],["Quem matou Pátroclo, amigo de Aquiles?",["Heitor","Páris","Eneias","Mêmnon"],"Pátroclo vestia a armadura de Aquiles. Aquiles voltou à luta e matou Heitor."],["Como Aquiles morreu?",["Com uma flecha de Páris no calcanhar, guiada por Apolo","Num duelo com Heitor","Afogado no rio Escamandro","Esmagado pelo cavalo de madeira"],"O calcanhar era o único ponto em que ele podia ser ferido."],["Qual troiano avisou contra o cavalo de madeira e foi morto por serpentes saídas do mar?",["Laocoonte","Heitor","Príamo","Eneias"],"Cassandra também profetizou a queda, mas ninguém acreditava nela."]],"oresteia":[["Quem matou Agamêmnon ao voltar de Troia?",["Clitemnestra, sua esposa","Orestes","Menelau","Cassandra"],"Ela o envolveu num manto sem saída durante o banho e o golpeou três vezes."],["Por que Clitemnestra odiava Agamêmnon?",["Ele havia sacrificado a filha deles, Ifigênia","Ele a abandonou por Helena","Ele matou o pai dela","Ele roubou o trono do irmão dela"],"O sacrifício aconteceu em Áulis, para que os ventos voltassem a soprar."],["Quem era o amante de Clitemnestra, que governou Micenas com ela?",["Egisto, filho de Tiestes","Pílades","Menelau","Páris"],"Egisto tinha sua própria vingança contra a casa de Atreu."],["Qual princesa troiana Agamêmnon trouxe para Micenas?",["Cassandra","Andrômaca","Hécuba","Briseida"],"Cassandra previu a própria morte e a do rei, mas ninguém acreditou."],["Qual filho de Agamêmnon voltou para vingar o pai?",["Orestes","Telêmaco","Neoptólemo","Pélope"],"Orestes voltou adulto, por ordem de Apolo, com o amigo Pílades."],["Que deusas antigas perseguiram Orestes depois do matricídio?",["As Erínias, ou Fúrias","As Moiras","As Harpias","As Górgonas"],"Elas vingavam o sangue derramado entre parentes."],["Que tribunal Atena criou em Atenas para julgar Orestes?",["O Areópago, na colina de Ares","A Assembleia do Pnyx","O Conselho dos Doze Deuses","O Pritaneu"],"Foi o primeiro tribunal de cidadãos, segundo Ésquilo."],["Quem deu o voto decisivo no julgamento?",["Atena","Apolo","Zeus","Hermes"],"Os votos empataram, e Atena estabeleceu que, em caso de empate, o réu é absolvido."],["Que novo nome as Erínias receberam ao aceitar um lugar de honra em Atenas?",["Eumênides, “as benevolentes”","Musas","Horas","Graças"],"Elas passaram a viver numa gruta sob a colina, como protetoras da cidade."],["Quem era a sacerdotisa de Ártemis em Táuris, que reconheceu Orestes?",["Ifigênia, sua irmã, salva por Ártemis","Electra","Medeia","Cassandra"],"Todos a julgavam morta em Áulis. O reconhecimento veio por uma carta."]],"orfeu":[["Quem era a mãe de Orfeu?",["Calíope, musa da poesia épica","Clio","Leto","Eurídice"],"O pai era o rei trácio Eagro, ou o próprio Apolo."],["Com quem Orfeu se casou?",["A ninfa Eurídice","Calipso","Eco","Ariadne"],"Pouco depois do casamento, Eurídice morreu."],["Como Eurídice morreu?",["Picada por uma serpente escondida na grama","Afogada no rio Hebro","Atingida por uma flecha de Ártemis","De febre"],"Ela fugia do pastor Aristeu quando pisou na serpente."],["Por onde Orfeu desceu ao mundo dos mortos?",["Por uma caverna no cabo Tênaro","Pelo lago Averno","Pelo monte Etna","Pelo rio Erídano"],"Héracles também desceu pelo Tênaro para buscar Cérbero."],["Qual barqueiro Orfeu encantou para atravessar o rio Estige?",["Caronte","Hermes","Glauco","Tritão"],"Com a lira, Orfeu encantou Caronte e o cão Cérbero."],["Qual foi a condição imposta por Hades e Perséfone?",["Orfeu não podia olhar para trás até sair do mundo subterrâneo","Orfeu não podia tocar a lira","Eurídice não podia falar","Orfeu teria de ficar um ano no Hades"],"Quase na saída, Orfeu teve medo, se virou, e Eurídice foi puxada de volta."],["Quem matou Orfeu?",["As Mênades, seguidoras de Dioniso","As Erínias","As Sereias","Os Centauros"],"Ofendidas, elas abafaram a lira com gritos e tambores e o despedaçaram."],["Em que rio as Mênades jogaram a cabeça e a lira de Orfeu?",["Hebro","Estige","Nilo","Erídano"],"A cabeça desceu pelo rio ainda cantando o nome de Eurídice."],["Em que ilha a cabeça de Orfeu chegou e passou a dar oráculos?",["Lesbos","Delos","Creta","Naxos"],"Por isso, contavam, Lesbos se tornou a ilha de grandes poetas líricos como Safo."],["Em que constelação a lira de Orfeu foi transformada?",["Lira, cuja estrela principal é Vega","Coroa Boreal","Cisne","Órion"],"As Musas levaram a lira ao céu."]],"dedalo-icaro":[["Por que Dédalo fugiu de Atenas?",["Matou o sobrinho e aprendiz, que ameaçava superá-lo","Roubou o tesouro da cidade","Ofendeu Atena","Foi expulso por Teseu"],"O sobrinho, Talo (ou Perdix), inventou a serra copiando a espinha de um peixe."],["Para qual rei Dédalo trabalhou em Creta?",["Minos","Cócalo","Egeu","Astério"],"Para Minos, ele construiu as obras mais famosas da mitologia."],["O que Dédalo construiu para a rainha Pasífae?",["Uma vaca de madeira oca coberta de couro","Uma torre de bronze","Um par de asas","Uma estátua que andava"],"Da união de Pasífae com o touro nasceu o Minotauro."],["Que obra Minos encomendou a Dédalo para esconder o Minotauro?",["O Labirinto","Uma torre","Uma caverna subterrânea","Um navio"],"Seus corredores eram tão intrincados que nem o construtor saía com facilidade."],["Do que eram feitas as asas de Dédalo e Ícaro?",["Penas presas com fio e cera","Couro e madeira","Folhas de ouro","Tecido e bambu"],"As penas maiores eram presas com fio; as menores, com cera."],["Que conselho Dédalo deu a Ícaro antes do voo?",["Voar no meio, nem alto nem baixo demais","Voar sempre perto do mar","Voar o mais alto possível","Voar só à noite"],"Baixo demais, o mar pesaria as penas; alto demais, o sol derreteria a cera."],["Por que Ícaro caiu?",["Subiu demais e o sol derreteu a cera","Uma tempestade o derrubou","Uma ave atacou suas asas","Cansou de bater os braços"],"Ele caiu no mar gritando o nome do pai."],["Em que lugar da Sicília Dédalo foi acolhido pelo rei Cócalo?",["Cámico","Siracusa","Ena","Cumas"],"Antes, ele pousou em Cumas, na Itália, e dedicou as asas a Apolo."],["Como Dédalo passou um fio por dentro de uma c const QLETTERS = ["Α", "Β", "Γ", "Δ"];
const QKEY = "atlas-mito-quiz-best";
function qBestAll() { try { return JSON.parse(localStorage.getItem(QKEY) || "{}") || {}; } catch (e) { return {}; } }
function qBest(id) { const v = qBestAll()[id]; return typeof v === "number" ? v : null; }
function qSaveBest(id, n) { try { const all = qBestAll(); if (all[id] == null || n > all[id]) { all[id] = n; localStorage.setItem(QKEY, JSON.stringify(all)); } } catch (e) {} }
function qShuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizCta(m) {
  const qs = QUIZ[m.id]; if (!qs) return null;
  const b = el("button", "qcta"); b.type = "button";
  const t = el("span", "qt"); t.append(el("b", null, "Quiz do mito"), el("span", null, qs.length + " perguntas de múltipla escolha"));
  const best = qBest(m.id);
  b.append(el("span", "qg", "?"), t, el("span", "qa", best == null ? "Começar →" : `Recorde ${best}/${qs.length} →`));
  b.onclick = () => startQuiz(m.id);
  return b;
}
function startQuiz(id) {
  stopPlay();
  const qs = QUIZ[id];
  state.quiz = { id, items: qShuffle(qs.map(q => ({ q: q[0], right: q[1][0], opts: qShuffle(q[1]), e: q[2] }))), i: 0, picks: [] };
  renderQuiz();
}
function endQuiz() { state.quiz = null; renderDetail(); }
function renderQuiz() {
  const m = state.myth, c = CYC[m.ciclo], Q = state.quiz;
  panel.innerHTML = "";
  const d = el("div", "detail quiz"); d.style.setProperty("--c", c.cor);
  const back = el("button", "back", "← Voltar ao mito"); back.onclick = endQuiz;
  const cyc = el("div", "cyc"); cyc.append(el("i"), document.createTextNode("Quiz · " + c.nome));
  d.append(back, cyc, el("h1", null, m.titulo));
  const n = Q.items.length, done = Q.picks.length >= n;
  const bar = el("div", "qbar"); bar.setAttribute("aria-hidden", "true");
  for (let k = 0; k < n; k++) {
    const seg = el("i"); const p = Q.picks[k];

    bar.append(seg);
  }
  d.append(bar);
  const score = Q.picks.filter((p, k) => p === Q.items[k].right).length;
  if (!done) {
    const it = Q.items[Q.i], answered = Q.picks[Q.i] != null;
    const num = el("div", "qnum"); num.append(el("span", null, `Pergunta ${Q.i + 1} de ${n}`), el("span", null, `${score} certa${score === 1 ? "" : "s"}`));

        else if (o === Q.picks[Q.i]) b.classList.add("bad");
        else b.classList.add("dim");

      box.append(b);
    });
    d.append(box);
    if (answered) {

      const fb = el("div", "qfb " + (ok ? "ok" : "bad")); fb.setAttribute("role", "status");

    const best = qBest(m.id);
    d.append(sc, el("p", "qverd", verd), el("div", "qbest", best != null ? `Seu recorde neste mito: ${best}/${n}` : ""));

        li.append(y, r); ul.append(li);
      });
      d.append(ul);
    }
  }
  panel.append(d); panel.scrollTop = 0;
}

    b.append(el("i"), document.createTextNode(c.nome.replace(/^(Ciclo|Mitos) (dos |do )?/, "").replace("Origens do Cosmos e dos Deuses", "Origens").replace("Deuses Olímpicos", "Olímpicos").replace("Amores, Castigos e Metamorfoses", "Metamorfoses")));
    b.onclick = () => {
      if (state.filter.has(c.id) && state.filter.size === DATA.ciclos.length) { state.filter = new Set([c.id]); }
      else if (state.filter.has(c.id)) { state.filter.delete(c.id); if (!state.filter.size) state.filter = new Set(DATA.ciclos.map(x => x.id)); }
      else state.filter.add(c.id);
      renderList(); fitAll();
    };
    chips.append(b);
  }
  panel.append(chips);
  for (const c of DATA.ciclos) {
    if (!state.filter.has(c.id)) continue;
    const g = el("section", "group"); g.style.setProperty("--c", c.cor);
    const h = el("h2"); h.append(el("i"), document.createTextNode(c.nome)); g.append(h);
    for (const m of MYTHS.filter(x => x.ciclo === c.id)) {
      const b = el("button", "myth");
      b.append(el("span", "mt", m.titulo), (() => { const mc = el("span", "mc", m.paradas.length + " lugares"); const b = qBest(m.id); if (b != null) mc.append(el("span", "qs", ` · ★ ${b}/10`)); return mc; })(),
        el("span", "mr", [...new Set(m.paradas.map(p => p.nome.replace(/^\d+\.\s*/, "")))].slice(0, 5).join(" → ")));
      b.onclick = () => openMyth(m.id);
      g.append(b);
    }
    panel.append(g);
  }
  panel.append(el("p", "srcnote", "Mapa-base: litoral e rios do Natural Earth. O relevo é real no Mediterrâneo central (AWS Terrain Tiles) e esquemático no resto do mapa. As fronteiras da camada política são as atuais e aproximadas; os nomes da camada geográfica seguem os autores antigos."));
  document.getElementById("legend").textContent = "Toque num ponto para abrir o mito";
}

function renderDetail() {
  const m = state.myth, c = CYC[m.ciclo];
  panel.innerHTML = "";
  const d = el("div", "detail"); d.style.setProperty("--c", c.cor);
  const back = el("button", "back", "← Todos os mitos"); back.onclick = () => closeMyth();
  const cyc = el("div", "cyc"); cyc.append(el("i"), document.createTextNode(c.nome));
  d.append(back, cyc, el("h1", null, m.titulo), el("div", "src", m.fontes.join(" · ")), el("p", "sum", m.resumo));
  if (m.trechos) {
    const lg = el("div", "legs");
    for (const k in m.trechos) { const s = el("span"); const i = el("i"); i.style.background = m.trechos[k].cor; s.append(i, document.createTextNode(m.trechos[k].nome)); lg.append(s); }
    d.append(lg);
  }
  const qc = quizCta(m); if (qc) d.append(qc);
  const ctr = el("div", "controls"); ctr.id = "controls"; d.append(ctr);
  const ol = el("ol", "stops"); ol.id = "stops";
  m.paradas.forEach((p, i) => {
    const li = el("li", "stop"); li.tabIndex = 0;
    li.style.setProperty("--c", stopColor(m, i));
    const sn = el("div", "sn", p.nome); if (p.grego) sn.append(el("span", "gk", " " + p.grego));
    li.append(sn, el("div", "sm", p.moderno + (p.tempo ? " · " + p.tempo : "")));
    const st = el("div", "st");
    String(p.texto).split(/\n\n+/).forEach(t => st.append(el("p", null, t)));
    if (p.sentido) st.append(el("p", "mean", p.sentido));
    if (p.hoje) { const hj = el("p", "today"); hj.append(el("b", null, "Hoje "), document.createTextNode(p.hoje)); st.append(hj); }
    const meta = el("div", "meta");
    if (p.certeza) meta.append(el("span", "cert", p.certeza));
    if (p.ref) meta.append(el("span", "ref", p.ref));
    if (meta.childNodes.length) st.append(meta);
    li.append(st, el("div", "co", `${Math.abs(p.lat).toFixed(2)}° ${p.lat >= 0 ? "N" : "S"} · ${Math.abs(p.lon).toFixed(2)}° ${p.lon >= 0 ? "L" : "O"}`));
    li.onclick = () => { stopPlay(); goTo(i, i === state.cur + 1); };
    li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); li.click(); } };
    ol.append(li);
  });
  d.append(ol);
  panel.append(d); panel.scrollTop = 0;
  renderControls(); renderStopsState();
  document.getElementById("legend").textContent = "Arraste e use + − para explorar";
}
function renderControls() {
  const ctr = document.getElementById("controls"); if (!ctr) return;
  const m = state.myth, end = state.cur >= m.paradas.length - 1;
  ctr.innerHTML = "";
  const mk = (cls, icon, label, fn) => { const b = el("button", "cbtn " + cls); b.innerHTML = icon; b.setAttribute("aria-label", label); b.onclick = fn; return b; };
  ctr.append(
    mk("", ICON.prev, "Parada anterior", () => { stopPlay(); goTo(state.cur - 1, false); }),
    mk("play", state.playing ? ICON.pause : (end ? ICON.restart : ICON.play), state.playing ? "Pausar" : (end ? "Recomeçar" : "Reproduzir viagem"), togglePlay),
    mk("", ICON.next, "Próxima parada", () => { stopPlay(); goTo(state.cur + 1); })
  );
  const pr = el("span", "prog", `${String(state.cur + 1).padStart(2, "0")} / ${String(m.paradas.length).padStart(2, "0")}`); ctr.append(pr);
}
function renderStopsState() {
  const ol = document.getElementById("stops"); if (!ol) return;
  [...ol.children].forEach((li, i) => {
    li.classList.toggle("cur", i === state.cur);
    li.classList.toggle("done", i < state.cur);
  });
  const cur = ol.children[state.cur];
  if (cur) {
    const pr = panel.getBoundingClientRect(), r = cur.getBoundingClientRect();
    if (r.top < pr.top + 70 || r.bottom > pr.bottom - 10) panel.scrollTo({ top: panel.scrollTop + r.top - pr.top - 90, behavior: reduce ? "auto" : "smooth" });
  }
  renderControls();
}
function togglePlay() {
  const m = state.myth;
  if (state.playing) return stopPlay();
  state.playing = true;
  if (state.cur >= m.paradas.length - 1) { state.cur = 0; state.seg = 1; renderStopsState(); fitPoints(m.paradas); setTimeout(() => goTo(1), 1000); }
  else goTo(state.cur + 1);
  renderControls();
}
function stopPlay() { state.playing = false; clearTimeout(playTimer); renderControls(); }

function openMyth(id, fromHash = false) {
  const m = MYTHS.find(x => x.id === id); if (!m) return;
  stopPlay();
  state.myth = m; state.cur = 0; state.seg = 1; state.quiz = null;
  renderDetail(); fitPoints(m.paradas);
  if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function closeMyth() {
  stopPlay(); state.myth = null; state.quiz = null;
  renderList(); fitAll();
  history.replaceState(null, "", location.pathname + location.search);
}
const CORE = [{ lon: 19.6, lat: 35.0 }, { lon: 29.4, lat: 41.6 }];
function fitAll(animate = true) { fitPoints(CORE, .96, animate); }
function fitEverything() {
  const pts = (state.myth ? state.myth.paradas : visibleMyths().flatMap(m => m.paradas));
  fitPoints(pts.length ? pts : CORE, .9, true);
}

/* clique no mapa */
let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("click", e => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 10) return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 26;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } }
  if (!best) return;
  if (!state.myth) { openMyth(best.myth.id); }
  else { stopPlay(); goTo(best.i, best.i === state.cur + 1); }
});
for (const bt of document.querySelectorAll(".layers .seg button")) bt.onclick = () => setBlend(+bt.dataset.v / 100);
document.getElementById("blend").addEventListener("input", e => setBlend(+e.target.value / 100));
document.getElementById("zin").onclick = () => zoomBy(1.6);
document.getElementById("zout").onclick = () => zoomBy(1 / 1.6);
document.getElementById("zall").onclick = () => fitEverything();
function zoomBy(f) {
  const k = proj.scale(), t = proj.translate(), k1 = Math.max(120, Math.min(40000, k * f));
  flyTo(k1, [W / 2 - (W / 2 - t[0]) * k1 / k, H / 2 - (H / 2 - t[1]) * k1 / k], 350);
}
document.addEventListener("keydown", e => {
  if (!state.myth || e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") { stopPlay(); goTo(state.cur + 1); }
  if (e.key === "ArrowLeft") { stopPlay(); goTo(state.cur - 1, false); }
});

/* ---------- mapa-base (contornos de terra) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}
async function loadLand() {
  const srcs = [
    "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.hires.min.js",
    "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.hires.min.js",
    "https://unpkg.com/datamaps@0.5.9/dist/datamaps.world.hires.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"
  ];
  for (const s of srcs) {
    try {
      await loadScript(s);
      const D = window.Datamap || window.Datamaps;
      const topo = D && D.prototype && D.prototype.worldTopo;
      if (topo && topo.objects) {
        const obj = topo.objects[Object.keys(topo.objects)[0]];
        land = topojson.merge(topo, obj.geometries);
        coast = topojson.mesh(topo, obj, (a, b) => a === b);
        countries = topojson.feature(topo, obj).features;
        borders = topojson.mesh(topo, obj, (a, b) => a !== b);
        const nb = topojson.neighbors(obj.geometries);
        ccol = countries.map(() => -1);
        countries.forEach((f, i) => { const used = new Set(nb[i].map(j => ccol[j])); let c = 0; while (used.has(c)) c++; ccol[i] = c; });
        ensureRasters();
        baseKey = ""; draw(); return;
      }
    } catch (e) { /* tenta o próximo */ }
  }
  const n = document.getElementById("notice");
  n.textContent = "Não foi possível carregar o contorno dos continentes. As rotas e os lugares continuam disponíveis sobre a grade de coordenadas.";
  n.hidden = false;
}

/* ---------- início ---------- */
function boot() {
  resize(); readColors(); setBlend(state.blend, false);
  const id = location.hash.slice(1);
  if (id && MYTHS.some(m => m.id === id)) {
    const m = MYTHS.find(x => x.id === id);
    state.myth = m; renderDetail(); fitPoints(m.paradas, .82, false);
  } else { renderList(); fitAll(false); }
  requestAnimationFrame(loop);
  loadLand();
  loadTerrain().then(() => { ensureRasters(); draw(); });
  document.fonts && document.fonts.ready.then(() => { baseKey = ""; });
}
window.addEventListener("resize", () => { const s = proj.scale(), t = proj.translate(), ow = W, oh = H; resize(); setView(s, [t[0] + (W - ow) / 2, t[1] + (H - oh) / 2]); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== state.myth?.id) openMyth(id, true); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
boot();
</script>

  .mapwrap { height: auto; min-height: 0; }
  .panel { overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 700px) and (orientation: landscape) {
  .app { grid-template-columns: clamp(340px, 32vw, 420px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }

}

    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

}

<script>
/* ===== Versão iPad: toque duplo para aproximar, ajuste na rotação ===== */
(() => {
  const map = document.querySelector("#map, canvas");
  if (map) {
    let last = null;
    map.addEventListener("pointerup", e => {
      if (e.pointerType !== "touch") return;
      const now = performance.now();
      if (last && now - last.t < 320 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 30) {
        last = null;
        map.dispatchEvent(new WheelEvent("wheel", { deltaY: -320, deltaMode: 0, clientX: e.clientX, clientY: e.clientY, bubbles: true, cancelable: true }));
      } else last = { t: now, x: e.clientX, y: e.clientY };
    });
    map.addEventListener("dblclick", e => e.preventDefault());
  }
  const hint = document.querySelector(".hint");
  if (hint && matchMedia("(hover: none)").matches) hint.textContent = "arraste · pince · toque duplo para aproximar";
  const kick = () => setTimeout(() => window.dispatchEvent(new Event("resize")), 260);
  window.addEventListener("orientationchange", kick);
  if (screen.orientation) screen.orientation.addEventListener("change", kick);
})();
</script>
