<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarot · Oráculos</title>
<style>
:root{--bg:#0a0914;--bg2:#13112a;--card:#1a1733;--line:#2e2a52;--tx:#ece8f6;--mut:#9a93b8;--ac:#e8b04a;--ac2:#b48cff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#2a2160 0%,var(--bg) 55%) fixed,var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Iowan Old Style","Palatino Linotype",serif;min-height:100vh}
#ceu{position:fixed;inset:0;z-index:-1;pointer-events:none}
header.top{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(10,9,20,.6);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
header.top .marca{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--ac);text-decoration:none}
header.top nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
header.top nav a{font:14px system-ui,sans-serif;color:var(--mut);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px}
header.top nav a.on,header.top nav a:hover{color:var(--tx);border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:28px 16px 80px}
h1{font-weight:normal;font-size:clamp(30px,6vw,48px);margin:0 0 4px;letter-spacing:.01em}
h1 .g{color:var(--ac)}
.sub{color:var(--mut);margin:0 0 26px;font-style:italic}
h2{font-weight:normal;color:var(--ac);font-size:22px;margin:34px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
h3{font-weight:normal;font-size:18px;margin:18px 0 6px}
.card{background:rgba(26,23,51,.85);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font:13px system-ui,sans-serif;color:var(--mut);margin:0 0 4px;letter-spacing:.03em}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:16px system-ui,sans-serif;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:84px;resize:vertical;font-family:Georgia,serif}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:12px}
button,.btn{font:15px system-ui,sans-serif;background:var(--ac);color:#1a1300;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;font-weight:600;letter-spacing:.02em}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:normal}
button.sec:hover{border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.mut{color:var(--mut)}.peq{font-size:13px;font-family:system-ui,sans-serif}
.chk{display:flex;align-items:center;gap:8px;font:14px system-ui,sans-serif;color:var(--mut)}
.chk input{width:auto}
.pill{display:inline-block;font:12px system-ui,sans-serif;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mut);margin:0 4px 4px 0}
.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hist button{font-size:13px;padding:6px 12px}
footer{color:var(--mut);font:13px system-ui,sans-serif;text-align:center;margin-top:50px}
@media print{header.top,#ceu,.noprint{display:none!important}body{background:#fff;color:#000}.card{background:#fff;border-color:#ccc}}

[id]{scroll-margin-top:84px}

.tiragens{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tiragens button{font-size:14px;padding:8px 14px}
.tiragens button.on{background:var(--ac);color:#1a1300;border-color:var(--ac)}
.leque{position:relative;height:118px;margin:6px 0}
.leque .c{position:absolute;top:14px;width:58px;transition:transform .25s,top .25s;cursor:pointer}
.leque .c:hover{top:0}
.leque .c svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.mesa{display:grid;gap:14px;justify-content:center;grid-template-columns:repeat(auto-fit,minmax(110px,140px));margin:20px 0}
.slot{text-align:center;font:12px system-ui,sans-serif;color:var(--mut)}
.slot .num{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);line-height:18px;margin-bottom:4px}
.carta{perspective:900px;width:100%;aspect-ratio:3/5;position:relative;cursor:pointer}
.carta .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.carta.vir .in{transform:rotateY(180deg)}
.carta .f,.carta .v{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.carta .f{transform:rotateY(180deg)}
.carta .f.inv svg{transform:rotate(180deg)}
.carta svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.vazia{width:100%;aspect-ratio:3/5;border:1px dashed var(--line);border-radius:10px}
.celta{display:grid;gap:10px 12px;grid-template-columns:repeat(4,minmax(64px,120px));grid-template-areas:". c5 . c10" "c4 c1 c6 c9" ". c3 . c8" ". . . c7";justify-content:center;margin:20px 0}
.celta .slot.p2{grid-area:c1;z-index:2;align-self:center}
.celta .slot.p2 .carta{transform:rotate(90deg) scale(.86)}
.celta .slot.p2 .lbl{display:none}
.leitura .item{display:grid;grid-template-columns:84px 1fr;gap:14px;margin:0 0 18px;align-items:start}
.leitura .item svg{width:84px;height:auto}
.leitura .item .inv svg{transform:rotate(180deg)}
.leitura h3{margin:0 0 2px;color:var(--ac)}
.leitura .pos{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.leitura p{margin:4px 0 0}
#etapa2,#etapa3{display:none}
.embaralha{animation:emb .7s ease-in-out 2}@keyframes emb{0%,100%{transform:none}25%{transform:translateX(-14px) rotate(-3deg)}75%{transform:translateX(14px) rotate(3deg)}}
</style>
</head>
<body>
<canvas id="ceu"></canvas>
<header class="top"><a class="marca" href="https://estevaolutz.github.io/oraculos/">✦ Oráculos</a>
<nav><a href="https://estevaolutz.github.io/oraculos/mapa-astral/">Mapa Astral</a><a class="on" href="https://estevaolutz.github.io/oraculos/tarot/">Tarot</a><a href="https://estevaolutz.github.io/oraculos/i-ching/">I Ching</a></nav></header>
<main>
<h1><span class="g">✦</span> Tarot</h1>
<p class="sub">Concentre-se na pergunta, embaralhe e escolha as cartas com a mão.</p>

<div class="card noprint" id="etapa1">
<label>Tiragem</label>
<div class="tiragens" id="tirs"></div>
<label>Sua pergunta (opcional)</label>
<textarea id="perg" placeholder="Ex.: O que preciso saber sobre o novo trabalho?"></textarea>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px">
<label class="chk"><input type="checkbox" id="usainv" checked> Usar cartas invertidas</label>
<label class="chk"><input type="checkbox" id="somaiores"> Só Arcanos Maiores</label>
</div>
<div style="margin-top:16px"><button id="emb">Embaralhar</button></div>
<div class="hist" id="hist"></div>
</div>

<div id="etapa2">
<h2 id="instr"></h2>
<div id="leques"></div>
<div id="mesa"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center" class="noprint"><button id="revelar" disabled>Revelar todas</button><button class="sec" id="recomecar">Recomeçar</button></div>
</div>

<div id="etapa3">
<h2>A leitura</h2>
<p class="mut" id="perguntaTxt"></p>
<div class="leitura" id="leitura"></div>
<h2>Síntese</h2>
<div id="sintese"></div>
<div class="noprint" style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="sec" onclick="print()">Imprimir / salvar PDF</button><button class="sec" id="nova">Nova tiragem</button></div>
</div>
<footer>78 cartas em desenho próprio · embaralhamento com aleatoriedade criptográfica do aparelho · para reflexão, não para decisões graves</footer>
</main>

['Riqueza duradoura, legado, família e patrimônio.','Problemas de herança ou família ligados a dinheiro.'],
['Estudante aplicado, nova habilidade, proposta concreta.','Falta de foco, procrastinação, oportunidade não aproveitada.'],
['Trabalho constante, responsabilidade, devagar e sempre.','Tédio, estagnação, teimosia.'],

['Abundância, sucesso material, segurança e liderança nos negócios.','Ganância, apego ao status, inflexibilidade.']]};

var TIRAGENS={
dia:{n:'Carta do dia',pos:[['A energia do dia','O tom e o conselho para hoje.']]},

conselho:{n:'Situação · Obstáculo · Conselho',pos:[['Situação','O cenário como ele é.'],['Obstáculo','O que atrapalha ou desafia.'],['Conselho','O que o tarot sugere fazer.']]},
relacao:{n:'Relação (5 cartas)',pos:[['Você','Como você está na relação.'],['A outra pessoa','Como a outra pessoa está.'],['O vínculo','O que une vocês.'],['O desafio','O que tensiona a relação.'],['O potencial','Para onde a relação pode ir.']]},
celta:{n:'Cruz Celta (10 cartas)',pos:[['O coração da questão','A situação central.'],['O que cruza','O desafio imediato.'],['A base','A raiz, o que está por baixo.'],['O passado recente','O que está ficando para trás.'],['O que se busca','O objetivo consciente, o melhor possível.'],['O futuro próximo','O que vem logo adiante.'],['Você','Sua atitude diante da questão.'],['O ambiente','As pessoas e influências ao redor.'],['Esperanças e medos','O que você deseja — e teme.'],['O desfecho','O resultado provável.']]}};

var $=function(i){return document.getElementById(i)};
// ---------- baralho ----------
var DECK=[];MAIORES.forEach(function(c,i){DECK.push({id:'M'+i,maior:true,num:i,nome:c[0],sim:c[1],kw:c[2],dir:c[3],inv:c[4]})});
Object.keys(NAIPES).forEach(function(s){RANKS.forEach(function(r,i){var m=MENORES[s][i];DECK.push({id:s+i,maior:false,naipe:s,rank:i,nome:r+' de '+NAIPES[s].n,dir:m[0],inv:m[1]})})});
function rnd(n){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
var ROM=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
// ---------- desenho ----------
function simbolo(s,cor){
 if(s==='paus')return '<g fill="'+cor+'"><rect x="-2.2" y="-12" width="4.4" height="24" rx="2.2"/><ellipse cx="-4.5" cy="-5" rx="2.6" ry="1.3" transform="rotate(-35 -4.5 -5)"/><ellipse cx="4.5" cy="1" rx="2.6" ry="1.3" transform="rotate(35 4.5 1)"/><ellipse cx="-4" cy="6" rx="2.2" ry="1.1" transform="rotate(-35 -4 6)"/></g>';
 if(s==='copas')return '<path fill="'+cor+'" d="M-8,-10H8Q8,1 1.5,3V8H6V11H-6V8H-1.5V3Q-8,1 -8,-10Z"/>';
 if(s==='espadas')return '<path fill="'+cor+'" d="M0,-13L2.3,4H6V6.5H1.4V11.5H-1.4V6.5H-6V4H-2.3Z"/>';
 return '<g><circle r="9" fill="none" stroke="'+cor+'" stroke-width="2"/><path fill="'+cor+'" d="'+estrela(0,0,6.5,2.6,5)+'"/></g>';
}
function estrela(cx,cy,R,r,n){var d='';for(var i=0;i<n*2;i++){var a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2)}return d+'Z'}
var PIPS={1:[[60,100]],2:[[60,60],[60,140]],3:[[60,52],[60,100],[60,148]],4:[[38,62],[82,62],[38,138],[82,138]],5:[[38,58],[82,58],[60,100],[38,142],[82,142]],6:[[38,55],[82,55],[38,100],[82,100],[38,145],[82,145]],7:[[38,52],[82,52],[60,76],[38,100],[82,100],[38,148],[82,148]],8:[[38,50],[82,50],[38,83],[82,83],[38,117],[82,117],[38,150],[82,150]],9:[[38,50],[82,50],[38,83],[82,83],[60,100],[38,117],[82,117],[38,150],[82,150]],10:[[38,48],[82,48],[60,66],[38,84],[82,84],[38,116],[82,116],[60,134],[38,152],[82,152]]};
var CORMAIOR=['#e8d04a','#e8794a','#8aa8ff','#8fbf5a','#e8794a','#e8b04a','#ff8ab0','#5aa8e8','#e8b04a','#b4a8d0','#c48ae8','#c9cde0','#5aa8e8','#9a93b8','#6fe0a0','#c0504a','#e86a4a','#7ad0ff','#a8b4ff','#ffd04a','#e8794a','#c48ae8'];
function svgCarta(c){
 var o='<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="118" height="198" rx="9" fill="#14122b" stroke="#e8b04a" stroke-width="1.5"/><rect x="6" y="6" width="108" height="188" rx="6" fill="none" stroke="#3d3770"/>';
 if(c.maior){var cor=CORMAIOR[c.num];
  o+='<defs><radialGradient id="g'+c.num+'"><stop offset="0" stop-color="'+cor+'" stop-opacity=".45"/><stop offset="1" stop-color="'+cor+'" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="96" r="50" fill="url(#g'+c.num+')"/>';
  for(var i=0;i<24;i++){var a=i*Math.PI/12,r1=i%2?30:26,r2=i%2?40:46;o+='<line x1="'+(60+r1*Math.cos(a)).toFixed(1)+'" y1="'+(96+r1*Math.sin(a)).toFixed(1)+'" x2="'+(60+r2*Math.cos(a)).toFixed(1)+'" y2="'+(96+r2*Math.sin(a)).toFixed(1)+'" stroke="'+cor+'" stroke-opacity=".7"/>'}
  o+='<circle cx="60" cy="96" r="24" fill="#14122b" stroke="'+cor+'"/>';
  if(c.sim==='ar'||c.sim==='fogo')o+='<path d="M60,82L73,105H47Z" fill="none" stroke="'+cor+'" stroke-width="2.5"/>'+(c.sim==='ar'?'<line x1="49" y1="97" x2="71" y2="97" stroke="'+cor+'" stroke-width="2.5"/>':'');
  else if(c.sim==='agua')o+='<path d="M60,108L73,85H47Z" fill="none" stroke="'+cor+'" stroke-width="2.5"/>';
  else o+='<text x="60" y="97" text-anchor="middle" dominant-baseline="central" font-size="28" fill="'+cor+'" font-family="Segoe UI Symbol,Noto Sans Symbols,Apple Symbols,sans-serif">'+c.sim+'︎</text>';
  o+='<text x="60" y="26" text-anchor="middle" font-size="14" fill="#e8b04a" font-family="Georgia,serif">'+ROM[c.num]+'</text>';
  o+='<path d="'+estrela(20,24,4,1.6,4)+'" fill="#e8b04a" opacity=".6"/><path d="'+estrela(100,24,4,1.6,4)+'" fill="#e8b04a" opacity=".6"/>';
  o+=rotulo(c.nome.replace(/^(O|A|Os) /,'').toUpperCase(),c.nome.match(/^(O|A|Os) /)?c.nome.split(' ')[0].toUpperCase():'');
 }else{var N=NAIPES[c.naipe],cor2=N.cor;
  if(c.rank<10){var sc=c.rank===0?2.6:(c.rank<4?1.15:.95);PIPS[c.rank+1].forEach(function(p){o+='<g transform="translate('+p[0]+','+p[1]+') scale('+sc+')">'+simbolo(c.naipe,cor2)+'</g>'});
   if(c.rank===0)o+='<circle cx="60" cy="100" r="40" fill="none" stroke="'+cor2+'" stroke-opacity=".35"/>';
   o+='<text x="14" y="22" font-size="13" fill="'+cor2+'" font-family="Georgia,serif">'+(c.rank===0?'A':c.rank+1)+'</text>';
  }else{
   o+='<circle cx="60" cy="96" r="36" fill="none" stroke="'+cor2+'" stroke-opacity=".4"/><g transform="translate(60,104) scale(2)">'+simbolo(c.naipe,cor2)+'</g>';
   var k=c.rank;
   if(k===10)o+='<path d="'+estrela(60,58,7,3,8)+'" fill="#e8b04a"/>';
   if(k===11)o+='<path d="M48,62Q60,44 72,62" fill="none" stroke="#e8b04a" stroke-width="3"/><circle cx="48" cy="62" r="2" fill="#e8b04a"/><circle cx="72" cy="62" r="2" fill="#e8b04a"/>';
   if(k===12)o+='<path d="M47,64L49,52L54,58L60,48L66,58L71,52L73,64Z" fill="#e8b04a"/>';
   if(k===13)o+='<path d="M45,66L46,50L53,57L60,44L67,57L74,50L75,66Z" fill="#e8b04a"/><rect x="45" y="64" width="30" height="3" fill="#e8b04a"/>';
   o+='<text x="14" y="22" font-size="11" fill="'+cor2+'" font-family="Georgia,serif">'+['V','C','R','K'][k-10].replace('K','Rei')+'</text>';
  }
  o+=rotulo(c.nome.toUpperCase().replace(' DE ',' · '),'');
 }
 return o+'</svg>'}
function rotulo(t,pre){return '<rect x="12" y="166" width="96" height="22" rx="4" fill="#0a0914" stroke="#3d3770"/><text x="60" y="'+(pre?175:181)+'" text-anchor="middle" font-size="'+(t.length>15?6.4:t.length>11?7.5:8.5)+'" fill="#ece8f6" font-family="system-ui,sans-serif" letter-spacing=".5">'+(pre?'<tspan font-size="5.5" fill="#9a93b8">'+pre+'</tspan><tspan x="60" dy="8">'+t+'</tspan>':t)+'</text>'}
var VERSO=(function(){var o='<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="118" height="198" rx="9" fill="#1e1a46" stroke="#e8b04a" stroke-width="1.5"/><rect x="7" y="7" width="106" height="186" rx="6" fill="none" stroke="#e8b04a" stroke-opacity=".5"/>';
 for(var y=20;y<190;y+=18)for(var x=18;x<110;x+=21)o+='<path d="'+estrela(x+(y/18%2?10:0),y,3,1.1,4)+'" fill="#e8b04a" opacity=".25"/>';
 o+='<circle cx="60" cy="100" r="26" fill="#1e1a46" stroke="#e8b04a"/><path d="'+estrela(60,100,18,6,8)+'" fill="#e8b04a" opacity=".85"/><circle cx="60" cy="100" r="5" fill="#1e1a46"/></svg>';return o})();

// ---------- fluxo ----------
var tir='tempo',baralho=[],escolhidas=[],viradas=0;
$('tirs').innerHTML=Object.keys(TIRAGENS).map(function(k){return '<button class="sec'+(k===tir?' on':'')+'" data-k="'+k+'">'+TIRAGENS[k].n+'</button>'}).join('');
$('tirs').onclick=function(e){var b=e.target.closest('button');if(!b)return;tir=b.dataset.k;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)})};
$('emb').onclick=function(){
 var pool=DECK.filter(function(c){return !$('somaiores').checked||c.maior}).slice();
 for(var i=pool.length-1;i>0;i--){var j=rnd(i+1),t=pool[i];pool[i]=pool[j];pool[j]=t}
 var inv=$('usainv').checked;baralho=pool.map(function(c){return{c:c,inv:inv&&rnd(2)===1}});
 escolhidas=[];viradas=0;$('etapa1').style.display='none';$('etapa3').style.display='none';$('etapa2').style.display='block';
 montaLeque();montaMesa();atualizaInstr();$('revelar').disabled=true;
 $('leques').classList.add('embaralha');setTimeout(function(){$('leques').classList.remove('embaralha')},1500);
 $('instr').scrollIntoView({behavior:'smooth'});
};
function montaLeque(){var n=baralho.length,linhas=n>40?3:2,por=Math.ceil(n/linhas),h='';
 for(var l=0;l<linhas;l++){h+='<div class="leque">';var ini=l*por,fim=Math.min(n,ini+por),q=fim-ini;
  for(var i=ini;i<fim;i++){var k=i-ini,rot=(k-(q-1)/2)*0.9;h+='<div class="c" data-i="'+i+'" style="left:calc('+(k/(q-1))+' * (100% - 58px));transform:rotate('+rot.toFixed(1)+'deg)">'+VERSO+'</div>'}
  h+='</div>'}
 $('leques').innerHTML=h;
 [].forEach.call($('leques').querySelectorAll('.c'),function(el){el.onclick=function(){pegar(el)}});
}
function atualizaInstr(){var t=TIRAGENS[tir].pos.length,f=t-escolhidas.length;$('instr').textContent=f>0?'Escolha '+f+(f>1?' cartas':' carta')+(escolhidas.length?' (faltam '+f+')':''):'Toque nas cartas para virar'}
function pegar(el){var t=TIRAGENS[tir].pos.length;if(escolhidas.length>=t)return;var i=+el.dataset.i;escolhidas.push(baralho[i]);el.style.visibility='hidden';
 var slot=$('mesa').querySelector('[data-p="'+(escolhidas.length-1)+'"] .vazia');
 if(slot){slot.outerHTML='<div class="carta" data-p="'+(escolhidas.length-1)+'"><div class="in"><div class="v">'+VERSO+'</div><div class="f'+(escolhidas[escolhidas.length-1].inv?' inv':'')+'">'+svgCarta(escolhidas[escolhidas.length-1].c)+'</div></div></div>'}
 atualizaInstr();
 if(escolhidas.length===t){$('leques').style.display='none';$('revelar').disabled=false;
  [].forEach.call($('mesa').querySelectorAll('.carta'),function(c){c.onclick=function(){virar(c)}})}
}
function virar(c){if(c.classList.contains('vir'))return;c.classList.add('vir');viradas++;if(viradas===TIRAGENS[tir].pos.length)setTimeout(leitura,900)}
$('revelar').onclick=function(){[].forEach.call($('mesa').querySelectorAll('.carta'),function(c,i){setTimeout(function(){virar(c)},i*260)})};
function montaMesa(){var P=TIRAGENS[tir].pos,h='';$('leques').style.display='block';
 P.forEach(function(p,i){h+='<div class="slot p'+(i+1)+'" data-p="'+i+'" style="grid-area:c'+(i===1?1:i+1)+'"><span class="num">'+(i+1)+'</span><div class="vazia"></div><div class="lbl">'+p[0]+'</div></div>'});
 $('mesa').className=tir==='celta'?'celta':'mesa';$('mesa').innerHTML=h;
 if(tir!=='celta')[].forEach.call($('mesa').children,function(s){s.style.gridArea=''});
}
$('recomecar').onclick=$('nova').onclick=function(){$('etapa2').style.display='none';$('etapa3').style.display='none';$('etapa1').style.display='block';scrollTo({top:0,behavior:'smooth'})};

var NUMS=['Ases: começos e sementes novas','Dois: escolhas e parcerias','Três: crescimento e colaboração','Quatros: estabilidade e pausa','Cincos: conflito e mudança','Seis: harmonia e troca','Setes: avaliação e desafio interior','Oitos: movimento e poder pessoal','Noves: quase lá, intensidade final','Dez: fim de ciclo e plenitude'];
function leitura(rever){
 var P=TIRAGENS[tir].pos,h='',q=$('perg').value.trim();
 $('perguntaTxt').textContent=q?'Pergunta: “'+q+'”':TIRAGENS[tir].n;
 escolhidas.forEach(function(e,i){var c=e.c;
  h+='<div class="item fade"><div class="'+(e.inv?'inv':'')+'">'+svgCarta(c)+'</div><div><div class="pos">'+(i+1)+' · '+P[i][0]+' — '+P[i][1]+'</div><h3>'+c.nome+(e.inv?' <span class="pill">invertida</span>':'')+'</h3>'+
   (c.maior?'<div class="peq mut">Arcano Maior · '+c.kw+'</div>':'<div class="peq mut">'+NAIPES[c.naipe].n+' · '+NAIPES[c.naipe].dom+'</div>')+'<p>'+(e.inv?c.inv:c.dir)+'</p></div></div>'});
 $('leitura').innerHTML=h;
 // síntese
 var n=escolhidas.length,s=[],maj=escolhidas.filter(function(e){return e.c.maior}).length,inv=escolhidas.filter(function(e){return e.inv}).length,cont={},rk={},corte=0;
 escolhidas.forEach(function(e){if(!e.c.maior){cont[e.c.naipe]=(cont[e.c.naipe]||0)+1;if(e.c.rank<10)rk[e.c.rank]=(rk[e.c.rank]||0)+1;else corte++}});
 if(n===1){var e=escolhidas[0];s.push(e.c.maior?'Um Arcano Maior como carta do dia indica um tema importante, maior do que a rotina: '+e.c.kw+'.':'O naipe de '+NAIPES[e.c.naipe].n+' coloca o foco do dia em '+NAIPES[e.c.naipe].dom+'.');if(e.inv)s.push('Invertida, a carta pede atenção ao que está travado ou sendo vivido mais por dentro do que por fora.')}
 else{
  if(maj/n>=.5)s.push('<b>Muitos Arcanos Maiores ('+maj+' de '+n+')</b>: a questão envolve forças grandes, viradas de fase e aprendizados profundos — não é só um assunto do dia a dia.');
  else if(maj===0)s.push('<b>Nenhum Arcano Maior</b>: a situação está nas suas mãos e se resolve no cotidiano, com escolhas práticas.');
  var dom=Object.keys(cont).sort(function(a,b){return cont[b]-cont[a]})[0];
  if(dom&&cont[dom]>=2&&cont[dom]>=n/3)s.push('<b>Predomina '+NAIPES[dom].n+'</b> (elemento '+NAIPES[dom].el+'): o centro da questão está em '+NAIPES[dom].dom+'.');
  var falta=Object.keys(NAIPES).filter(function(k){return !cont[k]});if(n>=5&&falta.length===1)s.push('Falta o naipe de <b>'+NAIPES[falta[0]].n+'</b>: '+NAIPES[falta[0]].dom+' podem estar sendo deixados de lado.');
  if(inv/n>=.5)s.push('<b>Muitas cartas invertidas</b>: há energia travada, atrasos ou processos internos. Antes de agir fora, vale olhar para dentro.');
  else if(inv===0&&$('usainv').checked)s.push('Todas as cartas de pé: a energia flui de forma direta e visível.');
  if(corte>=2)s.push('<b>'+corte+' figuras da corte</b>: outras pessoas têm papel importante — ou são facetas suas pedindo expressão.');
  Object.keys(rk).forEach(function(k){if(rk[k]>=2)s.push('<b>Repetição de '+NUMS[k].split(':')[0]+'</b>:'+NUMS[k].split(':')[1]+'.')});
  var ult=escolhidas[n-1],lp=P[n-1][0];s.push('A última carta, <b>'+ult.c.nome+(ult.inv?' invertida':'')+'</b> em “'+lp+'”, dá o tom de para onde as coisas caminham: '+(ult.inv?ult.c.inv:ult.c.dir).charAt(0).toLowerCase()+(ult.inv?ult.c.inv:ult.c.dir).slice(1));
 }
 $('sintese').innerHTML='<div class="card">'+s.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
 $('etapa3').style.display='block';$('etapa3').scrollIntoView({behavior:'smooth'});
 if(!rever)salvar({q:q,t:tir,d:new Date().toISOString(),c:escolhidas.map(function(e){return[e.c.id,e.inv]})});
}
var HK='oraculos-tarot';
function lerHist(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}}
function salvar(o){try{var h=lerHist();h.unshift(o);localStorage.setItem(HK,JSON.stringify(h.slice(0,30)))}catch(e){}mostraHist()}
function mostraHist(){var h=lerHist();$('hist').innerHTML=h.length?'<span class="peq mut" style="width:100%">Tiragens anteriores neste aparelho:</span>':'';
 h.slice(0,10).forEach(function(o){var b=document.createElement('button');b.className='sec';var d=new Date(o.d);b.textContent=d.toLocaleDateString('pt-BR')+' · '+(o.q?o.q.slice(0,28):TIRAGENS[o.t].n);
  b.onclick=function(){tir=o.t;$('perg').value=o.q;escolhidas=o.c.map(function(x){return{c:DECK.filter(function(c){return c.id===x[0]})[0],inv:x[1]}});$('etapa1').style.display='none';$('etapa2').style.display='none';leitura(true)};$('hist').appendChild(b)})}
mostraHist();
</script>
