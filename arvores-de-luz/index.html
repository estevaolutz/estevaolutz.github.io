<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="../lib/projecao.js"></script><script src="../lib/audio-arquivo.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Árvores de Luz</title>
<style>
:root{--bg:#07070a;--pn:rgba(14,14,20,.92);--tx:#e9e6df;--mu:#8d8a84;--ac:#ffcf6e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#panel{position:fixed;top:0;right:0;bottom:0;width:300px;background:var(--pn);backdrop-filter:blur(10px);border-left:1px solid #222;overflow-y:auto;padding:12px 14px 40px;transition:transform .25s}
#panel.hide{transform:translateX(100%)}
h1{font-size:15px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--mu);font-size:11px;margin-bottom:10px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ac);margin:16px 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row label{flex:0 0 96px;color:#cfcac1}
.row input[type=range]{flex:1;accent-color:var(--ac)}
.row .v{flex:0 0 38px;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
select,button{background:#1b1b22;color:var(--tx);border:1px solid #33333d;border-radius:6px;padding:6px 8px;font:inherit}
select{flex:1}
button{cursor:pointer}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.sel{border-color:#fff}
input[type=color]{width:40px;height:30px;border:none;background:none;padding:0}
#sel{border:1px solid #2c2c35;border-radius:8px;padding:8px;margin-top:6px;background:#111117}
#sel.off{opacity:.45;pointer-events:none}
#toggle{position:fixed;top:10px;right:310px;z-index:5;transition:right .25s;padding:8px 10px}
#panel.hide~#toggle{right:10px}
#hint{position:fixed;left:12px;bottom:10px;color:#777;font-size:11px;pointer-events:none}
#meter{height:4px;background:#222;border-radius:2px;margin-top:4px;overflow:hidden}
#meter b{display:block;height:100%;width:0;background:var(--ac)}
@media (max-width:700px){
 #panel{top:auto;left:0;width:auto;height:52vh;border-left:none;border-top:1px solid #222}
 #panel.hide{transform:translateY(100%)}
 #toggle{top:auto;bottom:calc(52vh + 8px);right:10px}
 #panel.hide~#toggle{bottom:10px;right:10px}
 #hint{display:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel">
 <h1>Árvores de Luz</h1>
 <div class="sub"><span id="nInfo"></span> · toque numa árvore para editá-la</div>

 <h2>Efeito</h2>
 <div class="row"><label>Modo</label><select id="mode">
  <option value="0">Espiral</option><option value="1">Pulso</option><option value="2">Onda entre árvores</option>
  <option value="3">Cintilar</option><option value="4">Subida (anéis)</option><option value="5">Espiral dupla</option>
  <option value="6">Chuva (descida)</option><option value="7">Fixo</option></select></div>
 <div class="row"><label>Intensidade</label><input type="range" id="depth" min="0" max="1" step=".01" value=".9"><span class="v"></span></div>
 <div class="row"><label>Luz de base</label><input type="range" id="base" min="0" max="1" step=".01" value=".05"><span class="v"></span></div>

 <h2>Ritmo</h2>
 <div class="row"><label>BPM</label><input type="range" id="bpm" min="20" max="200" step="1" value="90"><span class="v"></span></div>
 <div class="row"><label>Ciclos por batida</label><input type="range" id="rate" min="0.0625" max="4" step="0.0625" value=".5"><span class="v"></span></div>
 <div class="btns"><button id="tap">Tap tempo</button><button id="dir">Sobe ↑</button><button id="pause">Pausar</button></div>
 <div class="row"><label>Defasagem entre árvores</label><input type="range" id="spread" min="0" max="1" step=".01" value=".35"><span class="v"></span></div>

 <h2>Espiral</h2>
 <div class="row"><label>Passo (diâmetros)</label><input type="range" id="pitch" min="0.5" max="12" step=".1" value="2.2"><span class="v"></span></div>
 <div class="row"><label>Largura da faixa</label><input type="range" id="width" min=".03" max=".9" step=".01" value=".2"><span class="v"></span></div>
 <div class="row"><label>Fios (voltas paralelas)</label><input type="range" id="strands" min="1" max="6" step="1" value="1"><span class="v"></span></div>
 <div class="row"><label>Rastro</label><input type="range" id="tail" min="0" max="1" step=".01" value=".3"><span class="v"></span></div>

 <h2>Cor</h2>
 <div class="row"><label>Esquema</label><select id="cmode">
  <option value="0">Cor por árvore</option><option value="1">Cor única</option><option value="2">Arco-íris na espiral</option>
  <option value="3">Arco-íris entre árvores</option><option value="4">Gradiente vertical</option><option value="5">Branco quente (original)</option></select></div>
 <div class="row"><label>Paleta</label><select id="pal">
  <option value="natal">Natal</option><option value="neon">Neon</option><option value="oceano">Oceano</option>
  <option value="fogo">Fogo</option><option value="aurora">Aurora</option><option value="ouro">Ouro</option></select></div>
 <div class="row"><label>Cor única / topo</label><input type="color" id="c1" value="#ffb347"><label style="flex:0 0 auto;margin-left:8px">base</label><input type="color" id="c2" value="#ff2a6d"></div>
 <div class="row"><label>Giro de cor</label><input type="range" id="hueSpd" min="0" max="1" step=".01" value="0"><span class="v"></span></div>
 <div class="row"><label>Saturação</label><input type="range" id="sat" min="0" max="1" step=".01" value="1"><span class="v"></span></div>

 <h2>Luz</h2>
 <div class="row"><label>Tamanho</label><input type="range" id="size" min=".3" max="3" step=".01" value="1.4"><span class="v"></span></div>
 <div class="row"><label>Brilho (glow)</label><input type="range" id="glow" min="0" max="2" step=".01" value="1.2"><span class="v"></span></div>
 <div class="row"><label>Foto de fundo</label><input type="range" id="bgAmt" min="0" max="1.5" step=".01" value=".35"><span class="v"></span></div>
 <div class="row"><label>Luzes soltas</label><input type="range" id="amb" min="0" max="1" step=".01" value=".5"><span class="v"></span></div>

 <h2>Áudio</h2>
 <div class="btns"><button id="mic">Microfone: desligado</button></div>
 <div class="row"><label>Reação ao som</label><input type="range" id="react" min="0" max="2" step=".01" value="1"><span class="v"></span></div>
 <div id="meter"><b></b></div>

 <h2>Árvore selecionada</h2>
 <div id="sel" class="off">
  <div class="row"><label id="selName">—</label><input type="color" id="selCol"></div>
  <div class="row"><label>Atraso</label><input type="range" id="selOff" min="0" max="1" step=".01" value="0"><span class="v"></span></div>
  <div class="row"><label>Brilho</label><input type="range" id="selGain" min="0" max="2" step=".01" value="1"><span class="v"></span></div>
  <div class="btns"><button id="selSolo">Solo</button><button id="selMute">Apagar</button><button id="selClr">Limpar</button></div>
 </div>
 <div class="btns" style="margin-top:8px"><button id="allOn">Acender todas</button><button id="shuffle">Sortear cores</button></div>

 <h2>Tela</h2>
 <div class="btns"><button id="fit">Enquadrar: inteira</button><button id="fs">Tela cheia</button><button id="rnd">Surpresa</button></div>
</div>
<button id="toggle">☰</button>
<div id="hint">H esconde o painel · F tela cheia · espaço pausa · T tap tempo · 1–8 modos</div>

  const upd=()=>{P[el.id]=+el.value; if(out&&out.classList.contains('v')) out.textContent=(+el.value).toFixed(el.step<1?2:0).replace(/\.00$/,'');};
  el.addEventListener('input',upd); upd();
});
['mode','cmode','pal'].forEach(id=>{const el=$(id);const u=()=>P[id]=el.value;el.addEventListener('change',u);u();});
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const rgb2hex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0')).join('');
const PAL={natal:['#ff2a2a','#ffd24a','#2bd96b','#ffffff','#ff7a1a'],neon:['#ff2bd6','#28f0ff','#b4ff2b','#7a3bff','#ff8a1f'],
 oceano:['#1fd2ff','#1b6dff','#5ff7d2','#a8e6ff','#3346ff'],fogo:['#ff3b1f','#ff8a1f','#ffd04a','#ff5a00','#ffb37a'],
 aurora:['#3bff9e','#30d0ff','#a54bff','#ff4bd2','#7affc8'],ouro:['#ffcf6e','#ffb347','#fff1c2','#e8a33a','#ffdfa0']};
const tree=[]; for(let i=0;i<MAXT;i++) tree.push({col:[1,.8,.4],off:0,gain:1,on:1});
function applyPalette(shuffle){const p=PAL[P.pal];for(let i=0;i<NT;i++){const k=shuffle?Math.floor(Math.random()*p.length):i%p.length;tree[i].col=hex2rgb(p[k]);}}
$('pal').addEventListener('change',()=>applyPalette(false)); applyPalette(false);
$('shuffle').onclick=()=>applyPalette(true);
let c1=hex2rgb($('c1').value),c2=hex2rgb($('c2').value);
$('c1').oninput=e=>c1=hex2rgb(e.target.value); $('c2').oninput=e=>c2=hex2rgb(e.target.value);

let dir=1,paused=false,fitCover=false;
$('dir').onclick=e=>{dir*=-1;e.target.textContent=dir>0?'Sobe ↑':'Desce ↓';};
const togglePause=()=>{paused=!paused;$('pause').classList.toggle('on',paused);$('pause').textContent=paused?'Continuar':'Pausar';};
$('pause').onclick=togglePause;
let taps=[];
function tap(){const n=performance.now();taps=taps.filter(t=>n-t<2500);taps.push(n);
 if(taps.length>1){const d=(taps[taps.length-1]-taps[0])/(taps.length-1);const b=Math.round(Math.min(200,Math.max(20,60000/d)));$('bpm').value=b;$('bpm').dispatchEvent(new Event('input'));}
 $('tap').classList.add('on');setTimeout(()=>$('tap').classList.remove('on'),90);}
$('tap').onclick=tap;
const togglePanel=()=>{$('panel').classList.toggle('hide');resize();};
$('toggle').onclick=togglePanel;
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();};
$('fit').onclick=e=>{fitCover=!fitCover;e.target.textContent=fitCover?'Enquadrar: preencher':'Enquadrar: inteira';resize();};

// ---------- selection ----------
let selected=-1;
function setSel(i){selected=i;const s=$('sel');
 if(i<0){s.classList.add('off');$('selName').textContent='—';return;}
 s.classList.remove('off');$('selName').textContent='Árvore '+(i+1);
 $('selCol').value=rgb2hex(tree[i].col);$('selOff').value=tree[i].off;$('selGain').value=tree[i].gain;
 ['selOff','selGain'].forEach(id=>$(id).dispatchEvent(new Event('input')));
 $('selMute').textContent=tree[i].on?'Apagar':'Acender';}
$('selCol').oninput=e=>{if(selected>=0){tree[selected].col=hex2rgb(e.target.value);if(P.cmode!=='0'){$('cmode').value='0';P.cmode='0';}}};
$('selOff').addEventListener('input',e=>{if(selected>=0)tree[selected].off=+e.target.value;});
$('selGain').addEventListener('input',e=>{if(selected>=0)tree[selected].gain=+e.target.value;});
$('selMute').onclick=()=>{if(selected<0)return;tree[selected].on^=1;setSel(selected);};
$('selSolo').onclick=()=>{if(selected<0)return;for(let i=0;i<NT;i++)tree[i].on=i===selected?1:0;setSel(selected);};
$('selClr').onclick=()=>setSel(-1);
$('allOn').onclick=()=>{for(let i=0;i<NT;i++)tree[i].on=1;if(selected>=0)setSel(selected);};

// ---------- GL ----------
const cv=$('gl');const gl=cv.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error('link',gl.getProgramInfoLog(p));return p;}
const bgProg=prog(`attribute vec2 p;uniform vec4 uR;varying vec2 v;void main(){v=vec2(p.x,1.-p.y);gl_Position=vec4(uR.xy+p*uR.zw,0,1);}`,
`precision mediump float;varying vec2 v;uniform sampler2D t;uniform float a;void main(){vec3 c=texture2D(t,v).rgb;gl_FragColor=vec4(c*a,1);}`);
// real vertex shader (built below for clarity)
const VS2=`
precision highp float;
attribute vec2 aPos;attribute float aTree;attribute float aTh;attribute float aH;attribute float aV;attribute float aR;attribute float aRad;attribute float aTx;attribute float aHt;
uniform vec4 uR;uniform vec2 uImg;uniform float uScale;
uniform float uT,uBeat,uMode,uDepth,uBase,uSpread,uPitch,uWidth,uStrands,uTail,uCMode,uHue,uSat,uSize,uGlow,uAmb,uLvl,uSel,uFlash,uDir;
uniform vec3 uC1,uC2;
uniform vec3 uCol[${MAXT}];uniform vec3 uTS[${MAXT}];
varying vec3 vCol;varying float vB;
float hash(float n){return fract(sin(n*12.9898)*43758.5453);}
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(fract(h+vec3(0.,2./3.,1./3.))*6.-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
float pulse(float ph){float f=fract(ph);float w=max(uWidth,.02);
  float tail=mix(w,1.,uTail*.9);
  return smoothstep(0.,w*.25,f)*(1.-smoothstep(w*.25,tail,f));}
void main(){
  int ti=int(aTree+.5);
  vec3 ts=uTS[0];vec3 tc=uCol[0];
  for(int i=0;i<${MAXT};i++){if(i==ti){ts=uTS[i];tc=uCol[i];}}
  bool amb=ti==${AMB};
  float r=max(aRad,3.);vec4 tp=vec4(0.,0.,r,aTx);
  float up=aH*aHt;                       // px from bottom of trunk
  float tOff=tp.w*uSpread+ts.x;           // per-tree phase offset
  float beat=uBeat;
  float helix=aTh/6.2831853*uStrands + up/(uPitch*2.*r)*uStrands; // cycles along helix
  float b=1.;float m=uMode;
  if(m<.5){ b=pulse(helix - uDir*beat - tOff);}
  else if(m<1.5){ b=.5+.5*cos(6.2831853*(beat+tOff)); b=b*b;}
  else if(m<2.5){ float d=fract(beat*.5 - tp.w); b=exp(-pow(min(d,1.-d)*7.,2.));}
  else if(m<3.5){ float k=floor(beat*4.+aR*7.); b=step(.62,hash(aR*91.+k)); b*=1.-fract(beat*4.+aR*7.)*.6;}
  else if(m<4.5){ b=pulse(aH*2.5 - uDir*beat - tOff);}
  else if(m<5.5){ b=max(pulse(helix - uDir*beat - tOff),pulse(-aTh/6.2831853*uStrands + up/(uPitch*2.*r)*uStrands + uDir*beat + tOff));}
  else if(m<6.5){ float col=floor((aTh+1.6)*3.)+floor(tp.w*40.); float sp=.6+hash(col)*.8; b=pulse(aH*1.5 + uDir*beat*sp + hash(col+3.));}
  else { b=1.;}
  float lvl=uBase+(1.-uBase)*mix(1.,b,uDepth);
  lvl*=1.+uLvl;
  lvl*=ts.y*ts.z;
  // colour
  vec3 c;float cm=uCMode;
  if(cm<.5) c=tc;
  else if(cm<1.5) c=uC1;
  else if(cm<2.5) c=hsv(fract(helix/uStrands*.25+uHue),1.,1.);
  else if(cm<3.5) c=hsv(fract(tp.w+uHue),1.,1.);
  else if(cm<4.5) c=mix(uC2,uC1,aH);
  else c=vec3(1.,.78,.45);
  if(cm<1.5||cm>3.5){ // hue rotation for non-rainbow modes
    if(uHue>0.){ float L=dot(c,vec3(.3,.59,.11)); vec3 q=c-L; float a=uHue*6.2831853; vec3 k=normalize(vec3(1.));
      q=q*cos(a)+cross(k,q)*sin(a)+k*dot(k,q)*(1.-cos(a)); c=L+q;}}
  float L=dot(c,vec3(.3,.59,.11)); c=mix(vec3(L),c,uSat);
  if(amb){ c=vec3(1.,.82,.55); lvl=uAmb*(.55+.45*sin(uT*1.3+aR*40.)); }
  if(float(ti)==uSel) lvl=max(lvl,uFlash);
  vCol=c;vB=lvl*(.55+.6*aV);
  vec2 n=aPos/uImg; n.y=1.-n.y;
  gl_Position=vec4(uR.xy+n*uR.zw,0,1);
  gl_PointSize=uScale*uSize*(3.+r*.06)*(1.+uGlow*1.6)*(.65+.35*aV);
}`;
const FS=`precision highp float;varying vec3 vCol;varying float vB;uniform highp float uGlow;
void main(){vec2 d=gl_PointCoord-.5;float r=length(d)*2.;if(r>1.)discard;
 float g=1.+uGlow*1.6; float rc=r*g;
 float core=exp(-rc*rc*4.5);
 float halo=exp(-r*r*3.)*.35*uGlow;
 vec3 col=vCol*(core+halo)*vB + vec3(1.)*pow(core,4.)*vB*.6;
 gl_FragColor=vec4(col,1.);}`;
const ptProg=prog(VS2,FS);

// buffers
const pts=DATA.pts,N=pts.length/6;
const NA=10;const arr=new Float32Array(N*NA);
for(let i=0;i<N;i++){const o=i*6,ti=pts[o+2],t=DATA.trees[ti];
 arr.set([pts[o],pts[o+1],ti===63?AMB:ti,pts[o+3],pts[o+4],pts[o+5],Math.random(),t?t.r:4,t?(t.a+t.b*(t.y0+t.y1)/2)/DATA.w:.5,t?t.y1-t.y0:1],i*NA);}
const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
const tex=gl.createTexture();const im=new Image();
im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);};
im.src=BG;
const U={};const u=(p,n)=>{const k=(p===bgProg?'b':'p')+n;return U[k]||(U[k]=gl.getUniformLocation(p,n));};
// tree static params
const TS=new Float32Array(MAXT*3),TC=new Float32Array(MAXT*3);

// layout
let rect=[0,0,1,1],scale=1,dpr=1,view={x:0,y:0,w:1,h:1};
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
 const W=cv.width,H=cv.height,ar=DATA.w/DATA.h,open=!$('panel').classList.contains('hide'),mob=innerWidth<=700;
 const AW=W-(open&&!mob?300*dpr:0),AH=H-(open&&mob?innerHeight*.52*dpr:0);
 let w,h; if(fitCover? AW/AH<ar : AW/AH>ar){h=AH;w=h*ar;}else{w=AW;h=w/ar;}
 view={x:(AW-w)/2,y:(AH-h)/2,w,h};
 rect=[-1+2*view.x/W, -1+2*(H-view.y-h)/H, 2*w/W, 2*h/H]; scale=w/DATA.w;}
addEventListener('resize',resize);resize();

// pick tree
cv.addEventListener('pointerdown',e=>{
 const ix=((e.clientX*dpr)-view.x)/view.w*DATA.w, iy=((e.clientY*dpr)-view.y)/view.h*DATA.h;
 let best=-1,bd=1e9;
 DATA.trees.forEach((t,i)=>{if(iy<t.y0-30||iy>t.y1+30)return;const d=Math.abs(ix-(t.a+t.b*iy))/(t.r+8);if(d<1.6&&d<bd){bd=d;best=i;}});
 setSel(best); if(best>=0){flash=1;}
});

// audio
let an=null,abuf=null,lvlS=0;
$('mic').onclick=async e=>{
 if(an){an.ctx.close();an=null;e.target.textContent='Microfone: desligado';e.target.classList.remove('on');return;}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaStreamSource(s);const a=ctx.createAnalyser();a.fftSize=1024;src.connect(a);
  an={ctx,a};abuf=new Float32Array(a.fftSize);e.target.textContent='Microfone: ligado';e.target.classList.add('on');}
 catch(err){e.target.textContent='Microfone bloqueado';}
};

// keys
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 const k=e.key.toLowerCase();
 if(k==='h')togglePanel();else if(k==='f')$('fs').click();else if(k===' '){e.preventDefault();togglePause();}
 else if(k==='t')tap();else if(k>='1'&&k<='8'){$('mode').value=+k-1;P.mode=String(+k-1);}});

$('rnd').onclick=()=>{const r=(id,a,b)=>{$(id).value=a+Math.random()*(b-a);$(id).dispatchEvent(new Event('input'));};
 $('mode').value=Math.floor(Math.random()*7);P.mode=$('mode').value;
 $('cmode').value=Math.floor(Math.random()*5);P.cmode=$('cmode').value;
 const pk=Object.keys(PAL);$('pal').value=pk[Math.floor(Math.random()*pk.length)];P.pal=$('pal').value;applyPalette(true);
 r('pitch',1,8);r('width',.1,.5);r('spread',0,1);r('rate',.25,1.5);r('strands',1,3);r('hueSpd',0,.3);};

// loop
let beat=0,last=performance.now(),flash=0,hue=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 if(!paused){beat+=dt*P.bpm/60*P.rate;hue=(hue+dt*P.hueSpd*.2)%1;}
 flash=Math.max(0,flash-dt*1.5);
 let lv=0; if(an){an.a.getFloatTimeDomainData(abuf);let s=0;for(const x of abuf)s+=x*x;const rms=Math.sqrt(s/abuf.length);
  const tgt=Math.min(1.5,rms*6);lvlS+= (tgt-lvlS)*(tgt>lvlS?.5:.08);lv=lvlS*P.react;$('meter').firstElementChild.style.width=Math.min(100,lvlS*80)+'%';}
 for(let i=0;i<MAXT;i++){const t=tree[i];TS.set([t.off,t.gain,t.on],i*3);TC.set(t.col,i*3);}
 gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 // bg
 gl.disable(gl.BLEND);gl.useProgram(bgProg);gl.bindBuffer(gl.ARRAY_BUFFER,qb);
 let l=gl.getAttribLocation(bgProg,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
 gl.uniform4fv(u(bgProg,'uR'),rect);gl.uniform1f(u(bgProg,'a'),P.bgAmt);gl.bindTexture(gl.TEXTURE_2D,tex);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 gl.disableVertexAttribArray(l);
 // points
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(ptProg);gl.bindBuffer(gl.ARRAY_BUFFER,pb);
 [['aPos',2,0],['aTree',1,2],['aTh',1,3],['aH',1,4],['aV',1,5],['aR',1,6],['aRad',1,7],['aTx',1,8],['aHt',1,9]].forEach(([n,s,o])=>{const L=gl.getAttribLocation(ptProg,n);if(L<0)return;gl.enableVertexAttribArray(L);gl.vertexAttribPointer(L,s,gl.FLOAT,false,NA*4,o*4);});
 const f=(n,v)=>gl.uniform1f(u(ptProg,n),v);
 gl.uniform4fv(u(ptProg,'uR'),rect);gl.uniform2f(u(ptProg,'uImg'),DATA.w,DATA.h);f('uScale',scale);
 f('uT',now/1000);f('uBeat',beat);f('uMode',+P.mode);f('uDepth',P.depth);f('uBase',P.base);f('uSpread',P.spread*3);
 f('uPitch',P.pitch);f('uWidth',P.width);f('uStrands',P.strands);f('uTail',P.tail);f('uCMode',+P.cmode);f('uHue',hue);f('uSat',P.sat);
 f('uSize',P.size);f('uGlow',P.glow);f('uAmb',P.amb);f('uLvl',lv);f('uSel',selected);f('uFlash',flash);f('uDir',dir);
 gl.uniform3fv(u(ptProg,'uC1'),c1);gl.uniform3fv(u(ptProg,'uC2'),c2);
 gl.uniform3fv(u(ptProg,'uCol[0]'),TC);gl.uniform3fv(u(ptProg,'uTS[0]'),TS);
 gl.drawArrays(gl.POINTS,0,N);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
