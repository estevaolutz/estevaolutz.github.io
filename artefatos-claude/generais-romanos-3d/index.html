(Teutões e Ambrões)","baixas":"Teutões: dezenas de milhares de mortos e capturados","diagrama":"aquae"}},{"nome":"Vercelas","moderno":"Campos Ráudios, perto de Vercelli, Itália","lat":45.32,"lon":8.42,"ano":-101,"tempo":"101 a.C.","texto":"Os cimbros, por outra rota, atravessam os Alpes pelo Brennero, descendo os rochedos sentados nos escudos como trenós sobre a neve. O colega de Mário, Quinto Lutácio Cátulo, recua até atrás do Pó. Mário volta da Gália e une os dois exércitos.\n\nO rei cimbro Boiorix pede que os romanos marquem dia e lugar para a batalha. Mário escolhe os Campos Ráudios. Em 30 de julho de 101 a.C., uma nuvem de poeira enorme esconde os dois exércitos; o sol de verão bate no rosto dos cimbros, acostumados ao frio do norte. Os germânicos tinham amarrado as primeiras fileiras umas às outras com correntes para não romper a linha, e isso as transforma numa armadilha. A batalha vira massacre. As mulheres cimbras, nos carros, matam os fugitivos e depois os próprios filhos, para não caírem como escravos.","sentido":"O fim da ameaça germânica e o auge de Mário, chamado de terceiro fundador de Roma.","hoje":"A localização dos Campos Ráudios é debatida; a hipótese tradicional fica perto de Vercelli, mas há quem proponha a região de Rovigo, no delta do Pó.","ref":"Plutarco, Mário 24–27","certeza":"Local debatido","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 52.000 (Mário e Cátulo) × c. 100.000+ (Cimbros)","baixas":"Cimbros: até 60.000 capturados e muitos mortos"}},{"nome":"Minturnas","moderno":"Minturno, Itália","lat":41.24,"lon":13.77,"ano":-88,"tempo":"88 a.C.","texto":"Em 88 a.C., Mário, já com quase 70 anos, consegue por manobras na assembleia que o comando contra Mitrídates seja tirado de Sula e dado a ele. Sula responde marchando sobre Roma com seu exército, algo nunca feito antes. Mário foge e é declarado inimigo público.\n\nA fuga parece o fim de uma lenda. Ele se esconde num pântano perto de Minturnas, com água até o pescoço, até ser descoberto e preso. Os magistrados da cidade mandam um escravo gaulês ou címbrio matá-lo na cela. Segundo Plutarco, os olhos de Mário brilhavam no escuro, e uma voz poderosa perguntou: homem, você ousa matar Caio Mário? O escravo largou a espada e fugiu. Os habitantes, envergonhados, ajudaram Mário a embarcar.","sentido":"O velho general sobrevive apenas pela autoridade do próprio nome.","hoje":"As ruínas de Minturnae, junto à foz do rio Garigliano, incluem teatro, fórum e um trecho da Via Ápia. O pântano de Marica, onde Mário se escondeu, ficava ali perto.","ref":"Plutarco, Mário 35–39 · Apiano, Guerras Civis I 61–62","certeza":"Sítio arqueológico"},{"nome":"Nas ruínas de Cartago","moderno":"Cartago, Tunísia","lat":36.853,"lon":10.323,"ano":-88,"tempo":"88 a.C.","texto":"Mário atravessa para a África e desembarca perto das ruínas de Cartago, destruída por Roma sessenta anos antes. O governador romano da província manda um mensageiro proibi-lo de pisar ali.\n\nMário, sentado em silêncio entre os escombros, responde ao mensageiro: diga ao governador que viu Caio Mário, exilado, sentado sobre as ruínas de Cartago. A frase ficou como imagem da queda dos grandes: duas ruínas, a da cidade e a do homem, olhando uma para a outra. Mário passa o inverno numa ilha ao largo da costa, enquanto em Roma Sula parte para o Oriente.","sentido":"Uma das cenas mais citadas da história romana sobre fortuna e decadência.","hoje":"As ruínas de Cartago ficam em Túnis. A colina de Byrsa e os portos púnicos são os pontos mais visitados.","ref":"Plutarco, Mário 40","certeza":"Sítio arqueológico"},{"nome":"A volta a Roma","moderno":"Roma, Itália","lat":41.893,"lon":12.483,"ano":-87,"tempo":"87 a.C.","texto":"Com Sula longe, o cônsul Cina briga com o Senado e é expulso de Roma. Mário volta da África, desembarca na Etrúria, liberta escravos e reúne um exército. Junto com Cina, cerca Roma e corta o abastecimento de trigo. A cidade se rende.\n\nO que vem depois é um banho de sangue. Mário entra com uma guarda pessoal de escravos libertos, os bardieus, que matam a seu sinal: basta Mário não responder a uma saudação para que o homem seja morto ali mesmo. Cabeças de senadores são expostas na tribuna dos Rostros. Em janeiro de 86 a.C., Mário assume o sétimo consulado, como uma profecia lhe prometera na juventude. Morre dezessete dias depois, de pleurisia, atormentado por insônia e visões.","sentido":"O salvador da Itália termina como o primeiro grande carrasco das guerras civis.","hoje":"Os Rostros, a tribuna dos oradores decorada com os esporões de navios capturados, ficam no Fórum Romano; a estrutura visível hoje é posterior, da época de César e Augusto.","ref":"Plutarco, Mário 41–46 · Apiano, Guerras Civis I 70–75","certeza":"Sítio arqueológico"}],"era":"crise","rivais":["sula"]},{"id":"sula","nome":"Lúcio Cornélio Sula","latim":"Lucius Cornelius Sulla Felix","cor":"#2c4a7a","vida":"138–78 a.C.","papel":"Primeiro a marchar sobre Roma · ditador","fontes":["Plutarco, Vida de Sula","Apiano, Guerras Civis I e Guerras Mitridáticas","Salústio, Jugurta","Veleio Patérculo"],"resumo":"Patrício empobrecido, de juventude boêmia entre atores e músicos, Sula entrou tarde na carreira militar e brilhou como questor de Mário. Rompido com ele, fez o que nenhum romano fizera: marchou com suas legiões sobre Roma. Venceu Mitrídates na Grécia, voltou à Itália para uma guerra civil feroz, tomou o poder como ditador e publicou listas de proscritos que podiam ser mortos por recompensa. Depois reformou o Estado, renunciou ao poder e morreu como cidadão comum.","paradas":[{"nome":"A entrega de Jugurta","moderno":"Mauritânia (Marrocos)","lat":35.1,"lon":-4.5,"ano":-105,"tempo":"105 a.C.","texto":"Sula tem 33 anos e chega à guerra da Numídia como questor de Mário, sem experiência militar. Logo se torna popular entre os soldados: trabalha ao lado deles, conversa, nunca fala mal do general. Quando o rei Bocco da Mauritânia sinaliza que pode trair Jugurta, é Sula quem vai negociar.\n\nA missão é arriscadíssima. Sula atravessa território inimigo com poucos cavaleiros e encontra no caminho o filho de Bocco à frente de mil homens, sem saber se é escolta ou emboscada. Na corte, Bocco passa noites indeciso. Sula insiste, promete amizade de Roma e espera. No fim, Jugurta é preso numa conferência e entregue a ele acorrentado. Sula manda gravar a cena num anel de sinete e passa a usá-lo como assinatura.","sentido":"O feito que lança Sula e que Mário nunca perdoou.","hoje":"A localização da entrega não é conhecida; ocorreu em território mauritano, no atual norte do Marrocos.","ref":"Salústio, Jugurta 102–113 · Plutarco, Sula 3","certeza":"Local aproximado"},{"nome":"Nola e a coroa de grama","moderno":"Nola, Itália","lat":40.926,"lon":14.527,"ano":-89,"tempo":"89 a.C.","texto":"Em 91 a.C., os aliados itálicos, cansados de lutar por Roma sem ter cidadania, se rebelam e formam um Estado próprio com capital em Corfínio. É a Guerra Social, uma das mais duras de Roma. Sula comanda no sul, na Campânia e no Sâmnio.\n\nDiante de Nola, salva o exército romano de um cerco e recebe dos soldados a coroa de grama, a corona graminea, feita de plantas colhidas no próprio campo de batalha. Era a condecoração mais rara e prestigiosa, dada apenas a quem salvava um exército inteiro. Pouquíssimos romanos a receberam. Em 88 a.C., Sula é eleito cônsul pela primeira vez, aos 50 anos.","sentido":"A Guerra Social obriga Roma a estender a cidadania a quase toda a Itália, e faz de Sula um general consagrado.","hoje":"Nola fica perto do Vesúvio. Augusto morreria ali, em 14 d.C., na mesma casa onde morrera seu pai.","ref":"Plínio, História Natural XXII 12 · Apiano, Guerras Civis I 50","certeza":"Local aproximado"},{"nome":"Marcha sobre Roma","moderno":"Roma, Itália","lat":41.893,"lon":12.483,"ano":-88,"tempo":"88 a.C.","texto":"Sula recebe o comando da guerra contra Mitrídates VI do Ponto, que acabou de massacrar dezenas de milhares de italianos na Ásia em um único dia. Mas o tribuno Públio Sulpício, aliado de Mário, transfere o comando para Mário numa assembleia tumultuada.\n\nSula está em Nola com seis legiões. Conta aos soldados o que houve, e eles, temendo que Mário leve outros para a lucrativa campanha no Oriente, apedrejam os tribunos enviados para assumir o comando. Quase todos os oficiais se recusam a acompanhar Sula; apenas um questor vai com ele. Sula marcha sobre Roma, entra pela Porta Esquilina e luta contra a população que joga telhas dos telhados. Manda incendiar casas para avançar. Sulpício é morto; Mário foge. Pela primeira vez, um exército romano tomou Roma.","sentido":"O tabu de usar legiões contra a cidade está quebrado. Ninguém mais o restaurará.","hoje":"A Porta Esquilina corresponde ao atual Arco de Galieno, perto da Piazza Vittorio.","ref":"Plutarco, Sula 8–10 · Apiano, Guerras Civis I 55–60","certeza":"Local aproximado"},{"nome":"Cerco de Atenas e do Pireu","moderno":"Atenas, Grécia","lat":37.95,"lon":23.65,"ano":-86,"tempo":"86 a.C.","texto":"Mitrídates domina a Ásia e boa parte da Grécia, e Atenas se aliou a ele. Sula desembarca no Épiro com cerca de 30 mil homens e sem frota. Cerca ao mesmo tempo Atenas e seu porto, o Pireu, defendido pelo general pôntico Arquelau.\n\nPara construir máquinas de cerco, Sula manda derrubar as árvores da Academia de Platão e do Liceu de Aristóteles. Saqueia os tesouros dos santuários de Delfos, Olímpia e Epidauro para pagar os soldados. Atenas morre de fome. Em 1º de março de 86 a.C., os romanos entram à meia-noite por um trecho mal guardado da muralha. O massacre é tão grande que, segundo Plutarco, o sangue escorre pelas portas até os subúrbios. Sula para o saque dizendo que perdoa os vivos em nome dos mortos ilustres. O Pireu cai pouco depois.","sentido":"A Grécia clássica paga caro por apostar em Mitrídates.","hoje":"Os Longos Muros que ligavam Atenas ao Pireu tinham sido derrubados havia muito; a Academia de Platão é hoje um parque no bairro de Akadimia Platonos.","ref":"Plutarco, Sula 12–14 · Apiano, Mitridática 30–41","certeza":"Sítio arqueológico"},{"nome":"Queroneia","moderno":"Queroneia, Grécia","lat":38.495,"lon":22.845,"ano":-86,"tempo":"86 a.C.","texto":"Arquelau desce da Tessália com um exército enorme: falanges, cavalaria, carros de foice e escravos libertos armados. Sula tem um terço disso. Escolhe um vale estreito perto de Queroneia, onde a cavalaria inimiga não pode manobrar.\n\nNas alas, manda cavar trincheiras para proteger os flancos e, na frente, planta fileiras de estacas. Os carros de foice partem com força, mas sem espaço para ganhar velocidade; os legionários se abrem, os carros passam ou se chocam nas estacas, e os soldados aplaudem e pedem mais, como no circo. Um grupo de romanos toma por trás uma colina, o monte Thurion, e expulsa os soldados pônticos para baixo. A falange, apertada, não consegue reagir. Sula ergue dois troféus no campo, um deles achado por arqueólogos modernos.","sentido":"Engenharia de campo e escolha do terreno vencem a superioridade numérica.","hoje":"O leão de Queroneia, monumento de outra batalha famosa (Filipe II contra Atenas e Tebas, em 338 a.C.), domina a planície. A base de um dos troféus de Sula foi achada em 1990 no monte Isarion.","ref":"Plutarco, Sula 15–19 · Apiano, Mitridática 41–45","certeza":"Local identificado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (Sula) × c. 60.000–120.000 (Arquelau)","baixas":"Ponto: dezenas de milhares; Roma: perdas mínimas","diagrama":"queroneia"}},{"nome":"Orcômeno","moderno":"Orcômeno, Grécia","lat":38.49,"lon":22.98,"ano":-85,"tempo":"85 a.C.","texto":"Mitrídates manda outro exército de 80 mil homens. Sula o enfrenta perto de Orcômeno, numa planície junto ao lago Copais, boa para a cavalaria inimiga. Ele manda cavar valas para limitar os movimentos dos cavaleiros.\n\nOs pônticos atacam as obras, e as legiões começam a fugir. Sula salta do cavalo, pega um estandarte e corre para o inimigo gritando: para mim é glorioso morrer aqui; e vocês, quando perguntarem onde abandonaram seu general, respondam que foi em Orcômeno. Os soldados voltam e a batalha vira. No dia seguinte, os romanos tomam o acampamento inimigo, encurralado entre as valas e o pântano. Duzentos anos depois, ainda se achavam no lodo arcos, capacetes e espadas.","sentido":"O momento em que o próprio general, de estandarte na mão, vira a batalha.","hoje":"O lago Copais foi drenado no século XIX e virou planície agrícola. Orcômeno conserva o Tesouro de Mínias, tumba micênica monumental.","ref":"Plutarco, Sula 20–21 · Apiano, Mitridática 49–50","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (Sula) × c. 80.000 (Ponto)","baixas":"Ponto: o exército praticamente destruído"}},{"nome":"Paz de Dárdano","moderno":"Perto de Çanakkale, Turquia","lat":40.08,"lon":26.36,"ano":-85,"tempo":"85 a.C.","texto":"Enquanto Sula vence na Grécia, em Roma os partidários de Mário o declaram inimigo público e mandam outro exército para o Oriente. Sula precisa voltar. Encontra Mitrídates em Dárdano, junto ao Helesponto.\n\nO rei estende a mão; Sula pergunta se ele aceita as condições. Diante do silêncio, diz que quem pede deve falar primeiro e quem vence pode calar. As condições são brandas para quem massacrou 80 mil italianos: Mitrídates devolve as conquistas, paga 2 mil talentos e entrega 70 navios, mas mantém o reino. Os soldados reclamam. Sula precisa do dinheiro e das mãos livres. Antes de voltar, impõe às cidades da Ásia uma multa de 20 mil talentos, que as arruína por décadas.","sentido":"Uma paz apressada que deixa Mitrídates vivo para mais duas guerras.","hoje":"As ruínas de Dárdano ficam na costa asiática dos Dardanelos, ao sul de Çanakkale.","ref":"Plutarco, Sula 22–24 · Apiano, Mitridática 54–58","certeza":"Local aproximado"},{"nome":"Desembarque em Brundísio","moderno":"Brindisi, Itália","lat":40.638,"lon":17.946,"ano":-83,"tempo":"83 a.C.","texto":"Na primavera de 83 a.C., Sula desembarca em Brundísio com cerca de 40 mil veteranos, 1.200 navios e o butim do Oriente. Os soldados juram fidelidade espontaneamente e oferecem suas economias para pagar a guerra.\n\nJovens ambiciosos correm para o seu lado: Marco Licínio Crasso, que perdera o pai e o irmão nas matanças de Mário; e Cneu Pompeu, de 23 anos, que chega com três legiões levantadas por conta própria. Sula desce do cavalo para cumprimentá-lo como imperator. A guerra civil dura mais de um ano, contra os cônsules marianos e o filho de Mário.","sentido":"A segunda guerra civil começa no mesmo porto por onde os exércitos partiam para o Oriente.","hoje":"Em Brindisi, uma coluna romana marca o fim da Via Ápia, junto ao porto.","ref":"Plutarco, Sula 27–28 · Apiano, Guerras Civis I 79–80","certeza":"Nome preservado"},{"nome":"Porta Colina","moderno":"Roma, Itália","lat":41.908,"lon":12.497,"ano":-82,"tempo":"82 a.C.","texto":"Em 1º de novembro de 82 a.C., um exército samnita de 40 mil homens, inimigos históricos de Roma aliados aos marianos, tenta tomar a cidade indefesa. O líder, Pôncio Telesino, grita que é preciso destruir a toca dos lobos que roubam a liberdade da Itália.\n\nSula chega no fim da tarde, depois de marchar o dia todo, e ataca contra o conselho dos oficiais. A ala esquerda, comandada por ele, é derrotada e foge até as muralhas; Sula quase é morto. Mas a ala direita, de Crasso, vence. Os combates seguem pela noite. Ao amanhecer, os samnitas estão destruídos. Três dias depois, Sula reúne o Senado no templo de Belona enquanto, ali perto, 6 mil prisioneiros são massacrados. Os senadores ouvem os gritos. Sula pede que prestem atenção ao discurso, pois são apenas criminosos sendo corrigidos.","sentido":"A vitória que dá a Sula Roma, e a frieza com que a usou.","hoje":"A Porta Colina ficava na Muralha Serviana, na região da atual Via XX Settembre.","ref":"Plutarco, Sula 29–30 · Apiano, Guerras Civis I 92–93","certeza":"Local aproximado","batalha":{"tipo":"Vitória de Sula","vencedor":"Sula","forcas":"c. 50.000 (Sula) × c. 70.000 (Samnitas e Marianos)","baixas":"Dezenas de milhares de mortos"}},{"nome":"Ditadura e renúncia","moderno":"Pozzuoli, Itália","lat":40.823,"lon":14.122,"ano":-78,"tempo":"78 a.C.","texto":"Sula se torna ditador sem prazo definido, um cargo esquecido havia 120 anos. Publica as proscrições: listas de nomes, afixadas no Fórum, de pessoas que podem ser mortas por qualquer um, com recompensa, e cujos bens são confiscados. Morrem talvez milhares; muitos estão na lista por serem ricos. Um jovem Júlio César, sobrinho de Mário, escapa por pouco, e Sula avisa que nele há muitos Mários.\n\nDepois reforma o Estado: dobra o Senado, enfraquece os tribunos, fixa a ordem das magistraturas. Em 79 a.C., para espanto geral, renuncia, dispensa os guardas e caminha pelo Fórum dizendo que responderá por seus atos a quem quiser acusá-lo. Ninguém se atreve. Retira-se para sua vila perto de Putéolos, escreve memórias e morre no ano seguinte, aos 60 anos. Seu epitáfio dizia que nenhum amigo lhe fizera um favor nem inimigo uma ofensa que ele não tivesse pago com juros.","sentido":"Sula restaurou a República pela força e mostrou a todos que ela podia ser tomada pela força.","hoje":"Pozzuoli conserva o Macellum, mercado romano conhecido como Templo de Serápis, usado para medir o bradissismo, o lento subir e descer do solo dos Campos Flégreos.","ref":"Plutarco, Sula 31–38 · Apiano, Guerras Civis I 95–106","certeza":"Local aproximado"}],"era":"crise","rivais":["mario","pompeu"]},{"id":"pompeu","nome":"Pompeu Magno","latim":"Gnaeus Pompeius Magnus","cor":"#2f8f5b","vida":"106–48 a.C.","papel":"Conquistador do Oriente · rival de César","fontes":["Plutarco, Vida de Pompeu","Apiano, Guerras Mitridáticas e Guerras Civis","Dião Cássio XXXVI–XLII","César, A Guerra Civil","Flávio Josefo, Antiguidades XIV"],"resumo":"Filho de um general odiado, Pompeu levantou seu próprio exército aos 23 anos e recebeu de Sula o apelido de Magno, o Grande, como Alexandre, que ele imitava até no penteado. Triunfou três vezes antes de ser senador, limpou o Mediterrâneo de piratas em três meses e redesenhou o Oriente romano. Aliado e depois rival de César, perdeu tudo em Farsália e morreu assassinado numa praia do Egito, diante da esposa e do filho.","paradas":[{"nome":"O exército particular","moderno":"Piceno, perto de Osimo, Itália","lat":43.48,"lon":13.48,"ano":-83,"tempo":"83 a.C.","texto":"Pompeu tem 23 anos, é filho de Pompeu Estrabão, general rico, cruel e tão odiado que a multidão arrastou seu cadáver pelas ruas. Herdou terras e clientes no Piceno, a costa do Adriático. Quando Sula desembarca na Itália, Pompeu levanta por conta própria três legiões entre os camponeses da região, sem nenhum cargo público.\n\nNo caminho para se juntar a Sula, derrota três exércitos marianos. Sula vem ao encontro dele, desce do cavalo e o saúda como imperator, título que reservava a poucos. O gesto mostra quanto valia um jovem com legiões próprias: tudo.","sentido":"Pompeu é o primeiro grande produto da nova regra: quem tem soldados tem poder.","hoje":"Auximum, a atual Osimo, foi uma das bases de Pompeu no Piceno, sua terra de clientes.","ref":"Plutarco, Pompeu 6–8","certeza":"Local aproximado"},{"nome":"Sicília e África: o Magno","moderno":"Útica, Tunísia","lat":37.056,"lon":10.062,"ano":-81,"tempo":"81 a.C.","texto":"Sula manda Pompeu caçar os marianos na Sicília e depois na África. Na Sicília, ele executa o cônsul Papírio Carbão, levado acorrentado à sua presença, e ganha o apelido de adulescentulus carnifex, o jovem carniceiro. Na África, em quarenta dias, derrota o exército mariano e o rei númida aliado, e avança até o interior para caçar elefantes e leões, porque, segundo dizia, até as feras deviam conhecer a força de Roma.\n\nQuando volta, Sula o recebe chamando-o de Magnus, o Grande. Pompeu pede um triunfo, algo proibido para quem nunca tinha sido magistrado. Sula recusa. Pompeu responde que mais pessoas adoram o sol nascente que o poente. Sula, desconcertado, cede. No desfile, os elefantes atrelados ao carro não passam pela porta da cidade, e Pompeu precisa descer e trocar por cavalos.","sentido":"Um triunfo aos 24 anos, contra todas as regras, e um apelido que ele usará pelo resto da vida.","hoje":"Útica era a capital da província da África na época. As ruínas ficam hoje longe do mar, por causa do assoreamento.","ref":"Plutarco, Pompeu 10–14","certeza":"Local aproximado"},{"nome":"Guerra contra Sertório","moderno":"Huesca, Espanha","lat":42.14,"lon":-0.41,"ano":-76,"tempo":"76 a.C.","texto":"Quinto Sertório, mariano exilado, transformou a Hispânia num Estado rebelde. Montou um Senado próprio, uma escola para os filhos dos chefes ibéricos e um exército que lutava em guerrilha. Andava com uma corça branca que, segundo dizia, lhe trazia recados da deusa Diana.\n\nPompeu chega em 77 a.C. e apanha. Em Lauro, Sertório o engana e destrói uma de suas legiões debaixo de seus olhos. No rio Sucro, Pompeu é ferido e escapa porque os inimigos se distraem com seu cavalo de arreios dourados. A guerra se arrasta por seis anos. Termina não em batalha, mas com o assassinato de Sertório por seu próprio lugar-tenente, Perperna, num banquete em Osca. Pompeu derrota Perperna com facilidade e queima, sem ler, as cartas de senadores romanos que Sertório guardava.","sentido":"Pompeu aprende que coragem e dinheiro não bastam contra um general que conhece o terreno.","hoje":"Osca, a atual Huesca, foi a capital de Sertório e sede de sua escola para os jovens nobres ibéricos.","ref":"Plutarco, Sertório 18–27, Pompeu 17–21","certeza":"Local aproximado"},{"nome":"Os restos de Espártaco","moderno":"Etrúria, Itália","lat":43.3,"lon":11.3,"ano":-71,"tempo":"71 a.C.","texto":"Na volta da Hispânia, Pompeu cruza a Itália quando Crasso acabou de derrotar Espártaco, o gladiador que liderou uma revolta de escravos por dois anos. Cerca de 5 mil fugitivos tentam escapar para o norte.\n\nPompeu os intercepta e os destrói. Em seguida, escreve ao Senado que Crasso venceu os escravos em batalha, mas que ele, Pompeu, arrancou a guerra pela raiz. Crasso, que tinha feito todo o trabalho e crucificado 6 mil prisioneiros ao longo da Via Ápia, nunca esquece a afronta. Mesmo assim, os dois são eleitos cônsules juntos para 70 a.C.","sentido":"Pompeu rouba o crédito de uma vitória alheia e ganha um rival rico e rancoroso.","hoje":"O local do combate não é conhecido com precisão; ocorreu no norte da Itália, provavelmente na Etrúria.","ref":"Plutarco, Crasso 11, Pompeu 21","certeza":"Local aproximado"},{"nome":"Guerra contra os piratas","moderno":"Coracésio, Alanya, Turquia","lat":36.54,"lon":32.0,"ano":-67,"tempo":"67 a.C.","texto":"Os piratas, sobretudo da Cilícia, dominam o Mediterrâneo. Têm mais de mil navios, saqueiam santuários, sequestram magistrados e cortam o trigo de Roma. Em 67 a.C., a Lei Gabínia dá a Pompeu um comando sem precedentes: 500 navios, 120 mil homens, autoridade sobre todo o mar e 80 km para dentro de cada costa, por três anos.\n\nPompeu precisa de três meses. Divide o Mediterrâneo em 13 setores, cada um com um legado e uma frota, e varre o mar de oeste para leste, empurrando os piratas para a Cilícia. Ali os encurrala em Coracésio. Em vez de crucificá-los, assenta milhares deles como agricultores em cidades despovoadas, como Soli, que passa a se chamar Pompeiópolis. O preço do trigo em Roma cai no mesmo dia em que o comando é votado.","sentido":"Uma operação de logística militar exemplar: um mar inteiro limpo em uma estação.","hoje":"Coracésio é a atual Alanya, com a fortaleza seljúcida sobre o mesmo rochedo onde se refugiaram os piratas.","ref":"Plutarco, Pompeu 24–28 · Dião Cássio XXXVI 20–37","certeza":"Local identificado","batalha":{"tipo":"Campanha naval","vencedor":"Roma","forcas":"c. 500 navios e 120.000 homens (Pompeu)","baixas":"c. 10.000 piratas mortos; 20.000 capturados e reassentados"}},{"nome":"Vitória sobre Mitrídates","moderno":"Perto de Koyulhisar, Turquia","lat":40.3,"lon":37.8,"ano":-66,"tempo":"66 a.C.","texto":"Pompeu recebe o comando da guerra contra Mitrídates, tirando-o de Lúculo, que já tinha feito quase todo o trabalho. Lúculo o chama de abutre que pousa sobre os corpos que outros mataram.\n\nMitrídates recua para o interior do Ponto, evitando a batalha. Pompeu o persegue e, numa noite de lua baixa, ataca o acampamento real perto do rio Lico. A lua, atrás dos romanos, projeta sombras longas à frente deles; os soldados pônticos lançam os dardos contra as sombras, achando que os inimigos estão mais perto. O exército de Mitrídates é destruído. O rei escapa com uma das concubinas, vestida de homem, e foge pelo Cáucaso até a Crimeia. Ali, em 63 a.C., traído pelo filho, tenta se envenenar, mas tinha tomado antídotos a vida inteira. Pede a um guarda que o mate com a espada.","sentido":"O fim de quarenta anos de guerra entre Roma e o rei do Ponto.","hoje":"Pompeu fundou Nicópolis, a cidade da vitória, perto do campo de batalha; corresponderia à região de Koyulhisar.","ref":"Plutarco, Pompeu 32 · Dião Cássio XXXVI 48–49","certeza":"Local aproximado","batalha":{"tipo":"Ataque noturno","vencedor":"Roma","forcas":"c. 40.000 (Pompeu) × c. 30.000 (Mitrídates)","baixas":"Ponto: c. 10.000 mortos; exército desfeito"}},{"nome":"Expedição ao Cáucaso","moderno":"Perto de Tbilisi, Geórgia","lat":41.7,"lon":44.8,"ano":-65,"tempo":"65 a.C.","texto":"Pompeu persegue Mitrídates pelo Cáucaso e chega a terras onde nenhum exército romano tinha pisado. Enfrenta os iberos, no atual centro da Geórgia, e os albanos, no atual Azerbaijão. Contra os albanos, esconde a infantaria atrás da cavalaria, que finge fugir e abre caminho para as legiões no último momento.\n\nPompeu chega a três dias de marcha do mar Cáspio, mas para por causa das serpentes venenosas. A expedição alimenta sua comparação com Alexandre. Ele recolhe informações geográficas e volta ao sul, deixando Mitrídates para trás.","sentido":"Até onde a ambição de Pompeu levou Roma: as montanhas do Cáucaso.","hoje":"Os antigos reinos de Ibéria e Albânia do Cáucaso correspondem a partes da atual Geórgia e do Azerbaijão.","ref":"Plutarco, Pompeu 34–36 · Dião Cássio XXXVII 1–5","certeza":"Local aproximado"},{"nome":"Antioquia: o fim dos Selêucidas","moderno":"Antakya, Turquia","lat":36.202,"lon":36.16,"ano":-64,"tempo":"64 a.C.","texto":"O reino selêucida, herdeiro de parte do império de Alexandre, é uma sombra do que foi, disputado por príncipes rivais. Pompeu chega a Antioquia e simplesmente o declara extinto, transformando a Síria em província romana.\n\nO último rei, Antíoco XIII, perde o trono sem uma batalha. Pompeu reorganiza todo o Oriente: cria províncias, confirma reis clientes, funda ou refunda dezenas de cidades. É a maior reorganização territorial feita por um romano até então. Mas, como fez tudo sem consultar o Senado, enfrentará anos de resistência em Roma para ratificar seus atos.","sentido":"Num gesto administrativo, Pompeu encerra uma dinastia de 250 anos.","hoje":"Antakya, a antiga Antioquia, foi gravemente atingida pelo terremoto de fevereiro de 2023. O museu de mosaicos é um dos mais ricos do mundo.","ref":"Apiano, Síria 49–50 · Plutarco, Pompeu 39","certeza":"Nome preservado"},{"nome":"Jerusalém","moderno":"Jerusalém","lat":31.778,"lon":35.235,"ano":-63,"tempo":"63 a.C.","texto":"Dois irmãos asmoneus, Hircano II e Aristóbulo II, disputam o trono da Judeia e pedem a arbitragem de Pompeu. Ele decide por Hircano. Os partidários de Aristóbulo se entrincheiram na colina do Templo.\n\nO cerco dura três meses. Pompeu nota que os judeus não combatem no sábado, apenas se defendem se atacados, e usa esses dias para erguer rampas e máquinas sem ser incomodado. Quando a muralha cai, milhares morrem; sacerdotes continuam os sacrifícios enquanto são mortos no altar. Pompeu entra no Santo dos Santos, onde só o sumo sacerdote podia pisar uma vez ao ano. Fica surpreso ao ver que não há imagem de deus alguma. Não toca no tesouro. Para os judeus, a profanação marcou o início do domínio romano.","sentido":"O início do domínio romano sobre a Judeia, que levará às grandes revoltas do século seguinte.","hoje":"O Monte do Templo, o Haram al-Sharif, é hoje sítio da Cúpula da Rocha e da mesquita de Al-Aqsa.","ref":"Josefo, Antiguidades XIV 54–79 · Tácito, Histórias V 9","certeza":"Sítio identificado","batalha":{"tipo":"Cerco","vencedor":"Roma","forcas":"Legiões de Pompeu × partidários de Aristóbulo","baixas":"c. 12.000 mortos do lado judeu"}},{"nome":"Dirráquio","moderno":"Durrës, Albânia","lat":41.32,"lon":19.45,"ano":-48,"tempo":"48 a.C.","texto":"Quinze anos depois, a aliança com César e Crasso, o Primeiro Triunvirato, desmoronou. Crasso morreu na Pártia, Júlia, filha de César e esposa de Pompeu, morreu de parto, e Pompeu se aproximou do Senado. Em 49 a.C., César cruza o Rubicão. Pompeu abandona a Itália e reúne um exército enorme na Grécia.\n\nEm Dirráquio, César tenta cercar Pompeu com uma linha de fortificações de 25 km, embora tenha menos soldados. Os soldados de César passam fome, comendo um pão feito de raízes; Pompeu, ao ver o pão, diz que luta contra feras. Em julho, Pompeu ataca o ponto mais fraco da linha, no litoral, e rompe o cerco. As legiões de César fogem em pânico. César dirá depois que a guerra teria terminado naquele dia se o inimigo tivesse um general que soubesse vencer.","sentido":"A grande vitória de Pompeu sobre César, e a hesitação que o impediu de acabar com ele.","hoje":"Durrës, a antiga Dirráquio, tem o maior anfiteatro romano dos Bálcãs, redescoberto em 1966 sob casas modernas.","ref":"César, Guerra Civil III 41–72 · Plutarco, Pompeu 65","certeza":"Local aproximado","batalha":{"tipo":"Vitória de Pompeu","vencedor":"Pompeu","forcas":"c. 45.000 (Pompeu) × c. 25.000 (César)","baixas":"César: c. 1.000 mortos e 32 estandartes perdidos"}},{"nome":"Farsália","moderno":"Perto de Farsala, Grécia","lat":39.3,"lon":22.4,"ano":-48,"tempo":"48 a.C.","texto":"César recua para a Tessália, e Pompeu o segue, pressionado pelos senadores que o acompanham. Eles já discutem quem ficará com o cargo de sumo pontífice de César e chamam Pompeu de rei dos reis, irritados com sua prudência.\n\nEm 9 de agosto, Pompeu aceita a batalha. Tem o dobro da infantaria e sete vezes mais cavalaria. Seu plano é simples: a cavalaria, comandada por Labieno, antigo braço direito de César, vai esmagar a ala direita inimiga e atacar a retaguarda. César previu isso e escondeu atrás da ala direita uma quarta linha de seis coortes, com ordens de usar os pilos como lanças, visando o rosto dos cavaleiros, jovens nobres preocupados com a aparência. A carga de Labieno é repelida e foge. As coortes de César contornam o flanco de Pompeu. Pompeu volta ao acampamento e fica sentado em silêncio até ouvir os inimigos na paliçada. Então troca de roupa e foge.","sentido":"Num dia, Pompeu perde tudo o que construiu em trinta anos.","hoje":"O local exato é debatido ao longo do rio Enipeu, perto de Farsala, na Tessália.","ref":"César, Guerra Civil III 82–99 · Plutarco, Pompeu 68–72","certeza":"Local debatido","batalha":{"tipo":"Vitória de César","vencedor":"César","forcas":"c. 45.000 + 7.000 cav. (Pompeu) × c. 22.000 + 1.000 cav. (César)","baixas":"Pompeu: c. 15.000 mortos e 24.000 capturados; César: c. 1.200","diagrama":"farsalia"}},{"nome":"Pelúsio","moderno":"Tell el-Farama, Egito","lat":31.04,"lon":32.54,"ano":-48,"tempo":"48 a.C.","texto":"Pompeu foge por mar com a esposa, Cornélia, e o filho Sexto. Decide pedir abrigo ao Egito, cujo rei, Ptolomeu XIII, de 13 anos, era filho de um homem que Pompeu ajudara a recuperar o trono. Os conselheiros do rei calculam que receber Pompeu irritaria César, e mandá-lo embora faria dele um inimigo. Decidem matá-lo. Como disse um deles, mortos não mordem.\n\nUm pequeno barco vem buscá-lo. Nele está Lúcio Septímio, que servira sob Pompeu como centurião. Pompeu embarca lendo o discurso que preparou em grego. Quando se levanta para desembarcar, Septímio o golpeia por trás. Pompeu cobre o rosto com a toga e morre sem um gemido, diante de Cornélia, que assiste do navio. Era 28 de setembro, um dia antes de seu 58º aniversário. Quando César chega dias depois, recebem-no com a cabeça e o anel de Pompeu. César desvia o rosto e chora.","sentido":"O homem que celebrou triunfos sobre três continentes morre numa praia, por cálculo político de um menino-rei.","hoje":"Pelúsio, na foz mais oriental do Nilo, é hoje o sítio de Tell el-Farama, perto de Port Said. A linha de costa recuou muito desde a Antiguidade.","ref":"Plutarco, Pompeu 76–80 · César, Guerra Civil III 103–104","certeza":"Local aproximado"}],"era":"crise","rivais":["sula","cesar"]},{"id":"cesar","nome":"Júlio César","latim":"Gaius Iulius Caesar","cor":"#c9a227","vida":"100–44 a.C.","papel":"Conquistador da Gália · ditador","fontes":["César, Comentários sobre a Guerra das Gálias e A Guerra Civil","Suetônio, Vida do Divino Júlio","Plutarco, Vida de César","Dião Cássio XXXVIII–XLIV","Apiano, Guerras Civis II"],"resumo":"Patrício de família antiga e pobre, sobrinho de Mário pelo casamento, César fez carreira afundado em dívidas e virou general só depois dos 40 anos. Em oito anos conquistou a Gália, cruzou o Reno e o canal da Mancha e escreveu a própria história em terceira pessoa. Quando o Senado mandou que entregasse o exército, cruzou o Rubicão, venceu Pompeu e seus herdeiros em quatro continentes e se fez ditador perpétuo. Foi morto a punhaladas por senadores que diziam defender a República, e seu nome virou título de imperador.","paradas":[{"nome":"Sequestrado pelos piratas","moderno":"Farmacusa, Grécia","lat":37.28,"lon":27.17,"ano":-75,"tempo":"75 a.C.","texto":"César tem 25 anos e viaja para estudar retórica em Rodes quando é capturado por piratas cilícios perto da ilha de Farmacusa. Os piratas pedem 20 talentos de resgate. César ri e diz que vale pelo menos 50.\n\nDurante 38 dias, enquanto seus companheiros juntam o dinheiro, ele trata os captores como se fosse o chefe: manda que fiquem quietos quando quer dormir, participa dos exercícios, lê para eles os poemas que escreve e os chama de bárbaros iletrados quando não aplaudem. Promete, rindo, que vai crucificar todos. Os piratas acham graça. Libertado, César levanta uma pequena frota em Mileto, sem nenhum cargo, captura os piratas no mesmo lugar e os crucifica. Como eles o tinham tratado bem, manda cortar-lhes a garganta antes, para que não sofram.","sentido":"A história, contada por Plutarco e Suetônio, já mostra tudo: audácia, charme e implacabilidade.","hoje":"Farmacusa é a pequena ilha de Farmakonisi, no Dodecaneso, entre Leros e a costa turca.","ref":"Plutarco, César 1–2 · Suetônio, César 4","certeza":"Nome preservado"},{"nome":"Genebra: os helvécios","moderno":"Genebra, Suíça","lat":46.204,"lon":6.143,"ano":-58,"tempo":"58 a.C.","texto":"César recebe o governo da Gália Cisalpina, do Ilírico e da Gália Narbonense por cinco anos. Mal chega, os helvécios, cerca de 368 mil pessoas segundo ele, queimam suas aldeias na atual Suíça e partem para se instalar no oeste da Gália, querendo atravessar a província romana.\n\nCésar corre para Genebra, destrói a ponte sobre o Ródano e, enquanto finge negociar, faz seus soldados construírem um muro de 28 km com fosso, do lago Léman às montanhas do Jura. Quando os helvécios voltam para a resposta, ele nega a passagem. Eles tentam forçar o muro e são repelidos. É o começo de oito anos de guerra.","sentido":"César transforma um problema de fronteira no pretexto para conquistar a Gália inteira.","hoje":"Na ilha de Genebra, no Ródano, uma placa lembra a ponte destruída por César, citada logo no primeiro livro dos Comentários.","ref":"César, Guerra das Gálias I 2–8","certeza":"Local identificado"},{"nome":"Bibracte","moderno":"Monte Beuvray, França","lat":46.923,"lon":4.037,"ano":-58,"tempo":"58 a.C.","texto":"Os helvécios seguem por outra rota, pelo território dos séquanos. César os persegue e destrói a retaguarda que atravessa o rio Arar, o Saône. Mas os mantimentos acabam, e ele desvia para Bibracte, a capital dos éduos, aliados de Roma, para se abastecer.\n\nOs helvécios acham que César está fugindo e o atacam. César manda embora o próprio cavalo e os de todos os oficiais, para que ninguém pense em fugir, e luta a pé com os soldados. A batalha dura do meio-dia à noite. As legiões resistem no alto de uma colina, descem em contra-ataque e tomam o acampamento helvécio, defendido com carros. Segundo César, dos 368 mil helvécios, só 110 mil voltam para casa.","sentido":"A primeira grande vitória de César na Gália, e o começo da sua lenda entre os soldados.","hoje":"Bibracte, no monte Beuvray, tem um grande sítio arqueológico e museu. Foi ali que, em 52 a.C., Vercingetórix foi proclamado chefe de toda a Gália.","ref":"César, Guerra das Gálias I 23–29","certeza":"Local aproximado","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (César) × c. 70.000–90.000 guerreiros (Helvécios)","baixas":"Helvécios: perdas enormes segundo César"}},{"nome":"Contra Ariovisto","moderno":"Alsácia, França","lat":47.9,"lon":7.3,"ano":-58,"tempo":"58 a.C.","texto":"Os gauleses pedem ajuda a César contra Ariovisto, rei dos suevos, um povo germânico que atravessou o Reno e se instalou na Alsácia. Os soldados romanos, apavorados com as histórias sobre o tamanho e a ferocidade dos germânicos, escrevem testamentos no acampamento.\n\nCésar reúne os centuriões e diz que, se ninguém quiser segui-lo, irá apenas com a Décima Legião. A Décima, envaidecida, agradece; as outras, envergonhadas, pedem para ir. César descobre por prisioneiros que as adivinhas germânicas proibiram lutar antes da lua nova e força a batalha imediatamente. Os germânicos são esmagados e fogem até o Reno, onde Ariovisto escapa num barco.","sentido":"César usa o orgulho de seus soldados e a superstição do inimigo como armas.","hoje":"O local da batalha é debatido, provavelmente na planície da Alsácia, entre Mulhouse e Colmar.","ref":"César, Guerra das Gálias I 39–53","certeza":"Local debatido","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 30.000 (César) × c. 75.000 (Suevos)","baixas":"Suevos: a maior parte do exército"}},{"nome":"Rio Sabis: os nérvios","moderno":"Rio Sambre, França–Bélgica","lat":50.28,"lon":3.97,"ano":-57,"tempo":"57 a.C.","texto":"No segundo ano, César marcha contra os belgas. Os nérvios, os mais ferozes, se escondem na floresta do outro lado do rio Sabis e esperam. Quando as legiões começam a montar o acampamento, sem armadura, eles atacam de surpresa, atravessam o rio correndo e sobem a encosta.\n\nOs soldados não têm tempo nem de tirar a capa dos escudos ou pôr os capacetes. A Sétima e a Décima Segunda legiões, na ala direita, estão cercadas, os centuriões quase todos mortos. César pega o escudo de um soldado, avança para a primeira fila, chama os centuriões pelo nome e manda abrir as fileiras para usar as espadas. A chegada das legiões de reserva e da Décima, que voltou depois de tomar o acampamento inimigo, decide a batalha. Os nérvios lutam até o fim; segundo César, de 60 mil, sobram 500.","sentido":"Foi a vez em que César esteve mais perto da derrota na Gália, e venceu na linha de frente.","hoje":"O local é debatido ao longo do rio Sambre; uma hipótese clássica fica perto de Maubeuge, outra perto de Saulzoir, no Selle.","ref":"César, Guerra das Gálias II 16–28","certeza":"Local debatido","batalha":{"tipo":"Vitória romana","vencedor":"Roma","forcas":"c. 40.000 (César) × c. 60.000 (Nérvios e aliados)","baixas":"Nérvios quase aniquilados"}},{"nome":"Batalha contra os vênetos","moderno":"Golfo de Morbihan, França","lat":47.55,"lon":-2.85,"ano":-56,"tempo":"56 a.C.","texto":"Os vênetos, povo marinheiro da Bretanha, controlam o comércio com a Britânia e prendem oficiais romanos. Suas cidades ficam em promontórios que se transformam em ilhas na maré alta, e seus navios de carvalho, com velas de couro, são altos e resistentes demais para as galeras romanas.\n\nCésar manda construir uma frota no Loire, comandada pelo jovem Décimo Bruto. Na batalha, os romanos usam foices presas em longas varas: emparelham com os navios vênetos, cortam as cordas que prendem as vergas, e as velas desabam. Imobilizados, os navios são abordados um a um. Então o vento para completamente, e os navios a vela não conseguem fugir. César mata os chefes e vende o resto como escravos.","sentido":"Uma batalha naval vencida com ferramentas de agricultor.","hoje":"O golfo de Morbihan, com dezenas de ilhas, é a localização mais provável. Na região ficam também os alinhamentos megalíticos de Carnac.","ref":"César, Guerra das Gálias III 8–16","certeza":"Local aproximado"},{"nome":"Ponte sobre o Reno","moderno":"Perto de Neuwied ou Koblenz, Alemanha","lat":50.43,"lon":7.47,"ano":-55,"tempo":"55 a.C.","texto":"Dois povos germânicos, os usípetes e os tencteros, atravessam o Reno. César os ataca durante uma negociação e os massacra, um episódio que levou Catão a propor em Roma que ele fosse entregue aos germânicos. Depois decide mostrar que Roma pode chegar ao outro lado do Reno quando quiser.\n\nEm vez de atravessar de barco, o que achava indigno, constrói uma ponte de madeira com cerca de 400 m de comprimento em dez dias. Estacas inclinadas são cravadas no leito do rio contra a correnteza, ligadas por vigas transversais; troncos à frente protegem contra objetos lançados rio abaixo. César descreve a técnica em detalhe nos Comentários. Passa dezoito dias do outro lado, queima aldeias, volta e destrói a ponte.","sentido":"Uma obra de engenharia usada como propaganda: Roma pode ir aonde quiser.","hoje":"O local exato é discutido entre Andernach, Neuwied e Koblenz. Restos de estacas romanas foram achados no leito do rio perto de Neuwied.","ref":"César, Guerra das Gálias IV 16–19","certeza":"Local debatido"},{"nome":"Britânia","moderno":"Deal, Inglaterra","lat":51.22,"lon":1.4,"ano":-55,"tempo":"55 a.C.","texto":"Logo depois, César atravessa o canal com duas legiões. Os britanos o esperam nas falésias de Dover, e ele procura uma praia mais plana. Os soldados hesitam em pular dos navios em água funda, com armadura, diante de carros de guerra. O porta-estandarte da Décima pula primeiro, gritando que pulem se não quiserem entregar a águia ao inimigo.\n\nEm 54 a.C., César volta com cinco legiões, atravessa o Tâmisa e derrota Cassivelauno, chefe dos britanos. Mas uma tempestade destrói parte da frota, e a Gália começa a fervilhar. César impõe um tributo simbólico e volta. Não conquistou nada, mas em Roma o Senado decreta 20 dias de festas: ele tinha ido além do oceano, aos confins do mundo conhecido.","sentido":"Uma expedição militarmente modesta e politicamente enorme.","hoje":"A praia de Deal, em Kent, é a candidata tradicional para o desembarque. Em 2017, arqueólogos acharam em Pegwell Bay, mais ao norte, um grande acampamento que pode ser de 54 a.C.","ref":"César, Guerra das Gálias IV 20–36, V 1–23","certeza":"Local aproximado"},{"nome":"Avárico","moderno":"Bourges, França","lat":47.081,"lon":2.398,"ano":-52,"tempo":"52 a.C.","texto":"No inverno de 52 a.C., toda a Gália se levanta sob o comando de Vercingetórix, jovem nobre arverno. Ele adota a terra arrasada: queima mais de 20 cidades para deixar os romanos sem comida. Os bitúriges pedem para poupar Avárico, sua capital, a mais bela cidade da Gália, protegida por pântanos e um rio.\n\nCésar a cerca. Por 25 dias, debaixo de chuva e frio, os legionários constroem uma rampa de 100 m de largura e 25 m de altura, enquanto os gauleses, experientes em minas, cavam túneis por baixo e a incendeiam. Os soldados passam fome. Num dia de chuva forte, quando as sentinelas gaulesas se abrigam, César ataca. A cidade cai. Os soldados, furiosos, não poupam ninguém: segundo César, de 40 mil habitantes, só 800 escapam.","sentido":"A cidade que a Gália quis salvar se torna o primeiro grande massacre da revolta.","hoje":"Bourges, a antiga Avaricum, conserva trechos de muralha galo-romana sob a catedral gótica de Saint-Étienne.","ref":"César, Guerra das Gálias VII 13–28","certeza":"Nome evoluído"},{"nome":"Gergóvia","moderno":"Planalto de Gergovie, França","lat":45.709,"lon":3.123,"ano":-52,"tempo":"52 a.C.","texto":"César avança contra Gergóvia, capital dos arvernos, a cidade de Vercingetórix, num planalto de encostas íngremes. O exército gaulês acampa nas encostas. César toma uma colina menor, ataca por surpresa os acampamentos e consegue chegar ao pé da muralha.\n\nEle dá o sinal de retirada, mas a Oitava Legião, empolgada, não ouve ou ignora a ordem e tenta escalar a muralha. Algumas mulheres gaulesas jogam joias aos romanos implorando para poupá-las. Então o exército de Vercingetórix volta e cai sobre os romanos espalhados. César perde 46 centuriões e cerca de 700 soldados, e precisa levantar o cerco. É sua única grande derrota pessoal na Gália. Os éduos, aliados de Roma, passam para o lado da revolta.","sentido":"A derrota que mostra que César era vencível, e que quase lhe custa a Gália.","hoje":"No planalto de Gergovie há um museu e um monumento a Vercingetórix. Escavações confirmaram o oppidum e os acampamentos romanos.","ref":"César, Guerra das Gálias VII 34–53","certeza":"Sítio arqueológico","batalha":{"tipo":"Derrota romana","vencedor":"Gália","forcas":"c. 35.000 (César) × c. 60.000 (Vercingetórix)","baixas":"Roma: c. 700 mortos, 46 centuriões"}},{"nome":"Alésia","moderno":"Alise-Sainte-Reine, França","lat":47.537,"lon":4.5,"ano":-52,"tempo":"52 a.C.","texto":"Vercingetórix se refugia em Alésia, cidade num planalto, com 80 mil homens, e manda a cavalaria pedir socorro a toda a Gália. César decide não atacar: vai cercá-los.\n\nEm seis semanas, os legionários constroem uma linha de 18 km em torno da cidade, com fossos, uma muralha de 4 m, torres a cada 25 m e uma floresta de armadilhas: troncos afiados enterrados, buracos cônicos com estacas escondidas, a que os soldados chamam de lírios, e ferros pontiagudos enterrados. Depois constroem uma segunda linha, de 21 km, voltada para fora, contra o exército de socorro. Dentro, a fome é tanta que os gauleses expulsam mulheres, crianças e idosos; César não os deixa passar, e eles morrem entre as linhas. O exército de socorro chega: talvez 250 mil homens. Por três dias, os romanos lutam de costas uns para os outros, contra ataques de dentro e de fora ao mesmo tempo. No dia decisivo, César, com sua capa vermelha à vista de todos, leva a reserva ao ponto mais ameaçado e manda a cavalaria contornar e atacar por trás. O exército de socorro se dissolve. No dia seguinte, Vercingetórix se rende.","sentido":"O cerco duplo de Alésia é uma das maiores obras de engenharia militar da Antiguidade e o fim da Gália independente.","hoje":"Em Alise-Sainte-Reine, o MuséoParc Alésia reconstrói as fortificações. Escavações franco-alemãs dos anos 1990 confirmaram as linhas. Vercingetórix ficou seis anos preso e foi estrangulado após o triunfo de César, em 46 a.C.","ref":"César, Guerra das Gálias VII 68–90 · Plutarco, César 27","certeza":"Sítio arqueológico","batalha":{"tipo":"Cerco duplo","vencedor":"Roma","forcas":"c. 60.000 (César) × c. 80.000 sitiados + c. 250.000 de socorro (Gália)","baixas":"Gália: perdas enormes; Vercingetórix capturado","diagrama":"alesia"}},{"nome":"Rubicão","moderno":"Rio Rubicone, perto de Savignano, Itália","lat":44.09,"lon":12.4,"ano":-49,"tempo":"49 a.C.","texto":"O mandato de César na Gália acabou. Se voltar a Roma como cidadão comum, os inimigos o processarão e o destruirão. O Senado, liderado por Catão e apoiado por Pompeu, ordena que ele entregue o exército. César propõe que os dois, ele e Pompeu, deixem os exércitos ao mesmo tempo. O Senado recusa.\n\nNa noite de 10 de janeiro de 49 a.C., César está em Ravena com uma única legião, a Décima Terceira. Assiste a um espetáculo, janta com os convidados e, discretamente, sai numa carroça puxada por mulas. Chega à margem do Rubicão, o riacho que marca o limite entre sua província e a Itália. Cruzá-lo com tropas é declarar guerra à República. Hesita longamente. Segundo Suetônio, uma figura de beleza extraordinária aparece tocando flauta, toma a trombeta de um soldado e atravessa o rio. César diz: vamos aonde nos chamam os sinais dos deuses e a injustiça dos inimigos. A sorte está lançada.","sentido":"Atravessar o Rubicão virou sinônimo de uma decisão sem volta.","hoje":"Qual dos riachos da região é o Rubicão antigo foi discutido por séculos. Em 1933, o Fiumicino de Savignano foi oficialmente rebatizado de Rubicone.","ref":"Suetônio, César 31–32 · Plutarco, César 32","certeza":"Local debatido"},{"nome":"Ilerda","moderno":"Lleida, Espanha","lat":41.617,"lon":0.62,"ano":-49,"tempo":"49 a.C.","texto":"Pompeu abandona a Itália sem lutar. César diz que vai primeiro enfrentar um exército sem general, na Hispânia, e depois um general sem exército, no Oriente. Na Hispânia, sete legiões pompeianas estão concentradas em Ilerda.\n\nUma enchente destrói as pontes de César, que fica isolado e com fome. Ele manda construir barcos de vime e couro, como vira na Britânia, e restabelece as comunicações. Depois, cavando canais para desviar o rio e criar um vau, fica em vantagem. Quando os pompeianos tentam recuar, ele os persegue e os cerca sem dar batalha, cortando-lhes o acesso à água. Os soldados dos dois lados começam a confraternizar. Os pompeianos se rendem. César dispensa todos sem punição.","sentido":"César vence uma campanha inteira quase sem derramar sangue, e conquista corações com a clemência.","hoje":"Lleida, a antiga Ilerda, fica junto ao rio Segre. A colina da Seu Vella domina a cidade como dominava o campo da campanha.","ref":"César, Guerra Civil I 37–87","certeza":"Nome evoluído"},{"nome":"Farsália","moderno":"Perto de Farsala, Grécia","lat":39.3,"lon":22.4,"ano":-48,"tempo":"48 a.C.","texto":"Depois do fracasso em Dirráquio, César recua para a Tessália, onde pode alimentar os soldados. Pompeu o segue com o dobro de infantaria e 7 mil cavaleiros contra mil.\n\nCésar entende o plano de Pompeu: a cavalaria vai varrer sua ala direita e atacar por trás. Ele tira uma coorte de cada legião da terceira linha e forma uma quarta linha escondida, oblíqua, atrás da cavalaria. Ordena aos soldados que não arremessem os pilos, mas que os usem como lanças contra o rosto dos cavaleiros. Quando Labieno ataca, a pequena cavalaria de César recua, a quarta linha aparece, e os cavaleiros pompeianos, surpresos, fogem para as colinas. As coortes avançam e atacam o flanco esquerdo de Pompeu, enquanto César lança a terceira linha descansada contra a frente. O exército de Pompeu desmorona. Ao ver os mortos no campo, César diz: eles quiseram isso.","sentido":"A obra-prima tática de César decide a guerra civil.","hoje":"O local exato é discutido ao longo do rio Enipeu, a norte ou a sul do rio, perto de Farsala.","ref":"César, Guerra Civil III 84–99 · Plutarco, César 42–46 · Apiano II 75–82","certeza":"Local debatido","batalha":{"tipo":"Vitória de César","vencedor":"César","forcas":"c. 22.000 + 1.000 cav. (César) × c. 45.000 + 7.000 cav. (Pompeu)","baixas":"Pompeu: c. 15.000 mortos e 24.000 capturados; César: c. 1.200","diagrama":"farsalia"}},{"nome":"Alexandria","moderno":"Alexandria, Egito","lat":31.205,"lon":29.885,"ano":-48,"tempo":"48 a.C.","texto":"César chega a Alexandria em perseguição a Pompeu e recebe sua cabeça. Fica para cobrar dívidas e arbitrar a disputa entre Ptolomeu XIII e a irmã, Cleópatra VII. Cleópatra entra no palácio escondida, segundo Plutarco, dentro de um saco de dormir carregado por um servo. César fica fascinado.\n\nOs alexandrinos e o exército do rei se revoltam e cercam César no bairro dos palácios com poucos homens. Ele incendeia os navios no porto para que não caiam nas mãos do inimigo; o fogo se espalha e destrói armazéns, talvez parte da Biblioteca. Numa luta pelo farol, César precisa pular no mar e nadar até um navio, segurando documentos acima da água com uma mão e arrastando a capa com os dentes. Reforços chegam em março de 47 a.C., e Ptolomeu se afoga no Nilo. Cleópatra fica com o trono e, logo depois, dá a César um filho, Cesarião.","sentido":"Seis meses presos num palácio, uma guerra quase perdida e uma das alianças mais famosas da história.","hoje":"Os palácios ptolemaicos estão hoje sob o mar, no porto oriental, onde arqueólogos subaquáticos acharam esfinges e estátuas. A Biblioteca Alexandrina moderna foi inaugurada em 2002.","ref":"César, Guerra Civil III 106–112 · Guerra Alexandrina · Plutarco, César 48–49","certeza":"Local identificado"},{"nome":"Zela","moderno":"Zile, Turquia","lat":40.3,"lon":35.89,"ano":-47,"tempo":"47 a.C.","texto":"Fárnaces II, filho de Mitrídates, aproveita a guerra civil para retomar o Ponto e derrotar um exército romano. César sai do Egito, atravessa a Síria e a Ásia Menor e o encontra em Zela.\n\nFárnaces ataca morro acima, contra todas as regras, enquanto os romanos ainda constroem o acampamento. Os carros de foice são inúteis na encosta. Em quatro horas, o exército de Fárnaces é destruído. Toda a campanha dura cinco dias desde a chegada de César. Ele escreve a um amigo em Roma três palavras que se tornaram a frase mais famosa de qualquer general: veni, vidi, vici. Vim, vi, venci.","sentido":"Três palavras que resumem a velocidade de César e seu gênio para a propaganda.","hoje":"Zile, na província de Tokat, conserva o castelo sobre a colina onde se ergueria um templo de Anaítis. Segundo Plínio, a frase foi exibida em placas no triunfo de César.","ref":"Guerra Alexandrina 72–77 · Suetônio, César 37 · Plutarco, César 50","certeza":"Nome evoluído","batalha":{"tipo":"Vitória de César","vencedor":"César","forcas":"c. 15.000 (César) × c. 20.000 (Fárnaces)","baixas":"Ponto: exército destruído"}},{"nome":"Tapso","moderno":"Ras Dimass, Tunísia","lat":35.62,"lon":11.05,"ano":-46,"tempo":"46 a.C.","texto":"Os pompeianos se reagrupam na África, com Catão, Metelo Cipião, Labieno e o rei Juba I da Numídia, com seus elefantes. César desembarca com poucas tropas e passa meses em dificuldades. Treina os soldados contra elefantes trazidos da Itália, para que aprendam onde golpear.\n\nEm Tapso, os pompeianos se alinham numa faixa de terra entre o mar e uma laguna. Os soldados de César, impacientes, atacam antes do sinal; um trombeteiro da ala direita toca a carga por conta própria. Os elefantes, alvejados por arqueiros, se voltam contra as próprias linhas. A vitória vira massacre: os veteranos de César matam até os que se rendem. Segundo uma tradição, César teve uma crise de epilepsia no início da batalha e não a comandou. Em Útica, Catão lê o Fédon de Platão e se suicida para não aceitar o perdão de César.","sentido":"A vitória africana elimina os pompeianos, mas o suicídio de Catão faz dele um mártir da República.","hoje":"Tapso fica em Ras Dimass, perto de Bekalta, no golfo de Hammamet; restam vestígios do porto antigo.","ref":"Guerra Africana 79–86 · Plutarco, César 53–54, Catão 68–70","certeza":"Local aproximado","batalha":{"tipo":"Vitória de César","vencedor":"César","forcas":"c. 35.000 (César) × c. 50.000 + 60 elefantes (Pompeianos)","baixas":"Pompeianos: c. 10.000 mortos"}},{"nome":"Munda","moderno":"Entre Écija e Osuna, Espanha","lat":37.38,"lon":-5.15,"ano":-45,"tempo":"45 a.C.","texto":"Os filhos de Pompeu, Cneu e Sexto, levantam a Hispânia com Labieno e as últimas legiões republicanas. César faz uma campanha de inverno brutal e os encontra em Munda, em 17 de março de 45 a.C.\n\nOs pompeianos estão no alto de uma colina e lutam com o desespero de quem não espera perdão. A batalha fica equilibrada por horas, e os veteranos de César começam a ceder. César, com 55 anos, desce do cavalo, tira o capacete para ser reconhecido e corre para a primeira fila. Segundo Apiano, chegou a pensar em se matar. A Décima Legião, na ala direita, finalmente rompe a esquerda inimiga. Labieno se desloca para reforçá-la, mas o movimento é interpretado como fuga, e o exército pompeiano desmorona. César dirá depois que muitas vezes lutara pela vitória, mas naquele dia lutou pela vida.","sentido":"A última batalha das guerras civis de César, e a mais perto que ele chegou de perder tudo.","hoje":"O local é um dos mais discutidos da arqueologia espanhola. A hipótese hoje mais aceita fica entre Écija e Osuna; a região de Montilla voltou ao debate com o achado de um projétil de funda com a inscrição CAES.","ref":"Guerra Hispânica 27–31 · Apiano, Guerras Civis II 104 · Plutarco, César 56","certeza":"Local debatido","batalha":{"tipo":"Vitória de César","vencedor":"César","forcas":"c. 40.000 (César) × c. 70.000 (Pompeianos)","baixas":"Pompeianos: c. 30.000 mortos; Labieno morto"}},{"nome":"Idos de Março","moderno":"Cúria de Pompeu, Largo di Torre Argentina, Roma","lat":41.8955,"lon":12.4767,"ano":-44,"tempo":"44 a.C.","texto":"César é ditador perpétuo. Reforma o calendário, perdoa inimigos, planeja uma campanha contra a Pártia, mas também aceita honras que parecem as de um rei: estátua entre os reis de Roma, cadeira de ouro no Senado, o mês de julho com seu nome. Uns sessenta senadores, liderados por Marco Bruto e Caio Cássio, decidem matá-lo. Bruto é descendente do homem que expulsou o último rei de Roma, e César o tratava quase como filho.\n\nNa manhã de 15 de março de 44 a.C., a esposa de César, Calpúrnia, tem pesadelos e implora que ele não saia. Um adivinho, Espurina, já o alertara para tomar cuidado com os Idos. César vai. No caminho, alguém lhe entrega um bilhete revelando a conspiração; ele o guarda sem ler. O Senado se reúne na Cúria de Pompeu. Os conspiradores o cercam com o pretexto de um pedido; Casca dá o primeiro golpe no pescoço. César recebe 23 punhaladas. Quando vê Bruto entre eles, cobre o rosto com a toga. Cai aos pés da estátua de Pompeu.","sentido":"O assassinato que deveria salvar a República acaba com ela: treze anos de novas guerras civis levam ao Império.","hoje":"As ruínas da Cúria de Pompeu estão no Largo di Torre Argentina, hoje também um santuário de gatos. Desde 2023, a área tem passarelas para visitação.","ref":"Suetônio, César 76–82 · Plutarco, César 60–66 · Nicolau de Damasco","certeza":"Sítio arqueológico"}],"era":"fim","rivais":["pompeu","augusto"]},{"id":"agripa","nome":"Marco Agripa","latim":"Marcus Vipsanius Agrippa","cor":"#1f9bb0","vida":"c. 63–12 a.C.","papel":"O general por trás de Augusto","fontes":["Dião Cássio XLVIII–LIV","Veleio Patérculo II","Suetônio, Vida de Augusto","Apiano, Guerras Civis V","Plínio, História Natural"],"resumo":"De família obscura, Agripa foi colega de estudos de Otaviano e se tornou seu amigo para a vida inteira. Enquanto Otaviano, de saúde frágil, fazia política, Agripa vencia as guerras: Perúsia, Náuloco, Áccio. Depois construiu aquedutos, termas e o primeiro Panteão, mapeou o mundo romano e casou com Júlia, filha de Augusto, tornando-se praticamente corregente. Nunca quis o poder para si. Morreu antes do amigo, e seus netos se tornaram imperadores.","paradas":[{"nome":"Apolônia: a notícia","moderno":"Pojani, Albânia","lat":40.72,"lon":19.47,"ano":-44,"tempo":"44 a.C.","texto":"Agripa tem cerca de 19 anos e estuda retórica e artes militares em Apolônia, na costa da Ilíria, junto com Caio Otávio, sobrinho-neto de César, e Salvidieno Rufo. As legiões da campanha planejada contra a Pártia estão acampadas por perto.\n\nEm março de 44 a.C. chega a notícia: César foi assassinado. Pouco depois, outra: em testamento, César adotou Otávio como filho e herdeiro. Os oficiais das legiões oferecem apoio para marchar sobre Roma. Agripa, segundo uma tradição, aconselha aproveitar a lealdade dos soldados. Otávio decide ir à Itália com poucos amigos, como cidadão, para reclamar a herança. Agripa vai com ele. A partir daí, nunca mais sai do seu lado.","sentido":"Dois estudantes ouvem a notícia que vai mudar o mundo romano.","hoje":"As ruínas de Apolônia, perto de Fier, incluem o bouleutérion, o odeon e um mosteiro bizantino que hoje abriga um museu.","ref":"Veleio Patérculo II 59 · Suetônio, Augusto 8 · Nicolau de Damasco 16","certeza":"Sítio arqueológico"},{"nome":"Cerco de Perúsia","moderno":"Perugia, Itália","lat":43.112,"lon":12.389,"ano":-41,"tempo":"41 a.C.","texto":"Otaviano distribui terras na Itália aos veteranos de Filipos, desapropriando milhares de famílias. Lúcio Antônio, irmão de Marco Antônio, e Fúlvia, esposa de Marco Antônio, aproveitam o descontentamento e levantam exércitos contra ele.\n\nAgripa, já com comando militar, manobra para encurralar Lúcio dentro de Perúsia, cidade etrusca no alto de uma colina. Otaviano e Agripa cercam a cidade com uma linha de fortificações de 15 km. Os sitiados lançam projéteis de chumbo com insultos obscenos contra Otaviano e Fúlvia; os romanos respondem do mesmo jeito. Arqueólogos acharam dezenas dessas balas de funda gravadas. A fome força a rendição em fevereiro de 40 a.C. Lúcio é poupado, mas a cidade é incendiada, e a tradição conta que 300 conselheiros foram sacrificados no aniversário da morte de César.","sentido":"A primeira grande vitória de Agripa e o lado mais sombrio da ascensão de Otaviano.","hoje":"Perugia conserva o Arco Etrusco, uma porta da muralha que resistiu ao cerco e recebeu depois a inscrição Augusta Perusia.","ref":"Apiano, Guerras Civis V 32–49 · Suetônio, Augusto 15","certeza":"Sítio arqueológico","batalha":{"tipo":"Cerco","vencedor":"Otaviano","forcas":"Legiões de Otaviano e Agripa × c. 30.000 (Lúcio Antônio)","baixas":"Cidade incendiada; Lúcio poupado"}},{"nome":"Travessia do Reno","moderno":"Colônia, Alemanha","lat":50.938,"lon":6.958,"ano":-38,"tempo":"38 a.C.","texto":"Agripa governa a Gália Transalpina. Reprime uma revolta na Aquitânia e se torna o segundo romano depois de César a cruzar o Reno com um exército. Em vez de apenas punir os germânicos, faz algo mais duradouro.\n\nOs úbios, povo germânico aliado de Roma, sofrem com ataques dos vizinhos suevos. Agripa os transfere para a margem esquerda do Reno, dentro do território romano, e lhes dá terras em torno de um povoado que se tornará o Oppidum Ubiorum. Décadas depois, a cidade será elevada a colônia com o nome da neta de Agripa, Agripina: Colonia Claudia Ara Agrippinensium. É a atual Colônia. Em 37 a.C., Agripa é cônsul, aos 26 anos.","sentido":"Agripa funda, quase sem querer, uma das grandes cidades da Europa.","hoje":"Colônia preserva a torre romana (Römerturm), trechos da muralha e o pretório sob a prefeitura. O Museu Romano-Germânico tem o famoso mosaico de Dioniso.","ref":"Dião Cássio XLVIII 49 · Estrabão IV 3","certeza":"Local identificado"},{"nome":"Porto Júlio","moderno":"Lagos Averno e Lucrino, Itália","lat":40.835,"lon":14.075,"ano":-37,"tempo":"37 a.C.","texto":"Sexto Pompeu, filho de Pompeu Magno, controla a Sicília, a Sardenha e o mar, e corta o trigo de Roma. A frota de Otaviano é destruída duas vezes, por Sexto e por tempestades. Otaviano entrega o problema a Agripa.\n\nAgripa precisa de uma frota nova e de remadores treinados, sem que o inimigo veja. Escolhe o lago Averno, uma cratera vulcânica cercada de florestas que os antigos acreditavam ser a entrada do mundo dos mortos, e o vizinho lago Lucrino. Abre um canal entre o Lucrino e o mar, outro entre os dois lagos, e cria um porto interno protegido: o Portus Julius. Um túnel de quase 1 km, a Gruta de Cocceio, liga o Averno a Cumas. Durante um ano, 20 mil escravos libertados treinam como remadores. Agripa também desenvolve o harpax, um arpão lançado por catapulta, com uma corda que permite puxar o navio inimigo para a abordagem.","sentido":"Agripa transforma um lago mitológico na base naval mais secreta do Mediterrâneo.","hoje":"Os restos do Portus Julius estão hoje submersos por causa do bradissismo dos Campos Flégreos; fazem parte do Parque Submerso de Baia, visitável de barco com fundo de vidro ou mergulhando.","ref":"Dião Cássio XLVIII 49–51 · Estrabão V 4 · Suetônio, Augusto 16","certeza":"Sítio arqueológico"},{"nome":"Milas e Náuloco","moderno":"Costa norte da Sicília, Itália","lat":38.25,"lon":15.4,"ano":-36,"tempo":"36 a.C.","texto":"Em agosto de 36 a.C., Agripa vence uma primeira batalha diante de Milas. Em 3 de setembro, as duas frotas, cada uma com cerca de 300 navios, se enfrentam ao largo de Náuloco, entre Milas e o cabo Peloro.\n\nOs navios de Agripa são mais pesados e altos, com torres. O harpax resolve o resto: lançado de longe, crava-se no casco inimigo, e a corda, protegida por placas de ferro, não pode ser cortada. Os navios de Sexto, mais leves e rápidos, são puxados um a um para a abordagem. Sexto perde 28 navios afundados e quase toda a frota capturada ou queimada; Agripa perde três. Sexto foge para o Oriente e será executado no ano seguinte. Agripa recebe a coroa naval, uma coroa de ouro decorada com esporões de navio, honra inédita.","sentido":"O fim de Sexto Pompeu, o último filho do Magno, e o primeiro grande triunfo naval de Agripa.","hoje":"Náuloco ficava perto da atual Spadafora, entre Milazzo e o estreito de Messina. Milazzo conserva um grande castelo sobre o promontório.","ref":"Apiano, Guerras Civis V 105–122 · Dião Cássio XLIX 2–11","certeza":"Local aproximado","batalha":{"tipo":"Vitória naval","vencedor":"Otaviano (Agripa)","forcas":"c. 300 navios (Agripa) × c. 300 navios (Sexto Pompeu)","baixas":"Sexto: c. 28 afundados e quase toda a frota perdida; Agripa: 3 navios"}},{"nome":"Metone","moderno":"Methoni, Grécia","lat":36.817,"lon":21.705,"ano":-31,"tempo":"31 a.C.","texto":"A aliança entre Otaviano e Marco Antônio se rompeu. Antônio, casado com Cleópatra, reúne uma enorme força de terra e mar na Grécia ocidental e espera a invasão. Sua frota está ancorada no golfo de Ambrácia, e as linhas de abastecimento vêm do Egito, contornando o Peloponeso.\n\nAntes que Otaviano atravesse, Agripa ataca de surpresa Metone, base fortificada de Antônio na ponta sudoeste do Peloponeso, e a toma. Depois, uma após outra, captura as bases da rota de abastecimento, Corcira, Leucas, Patras e Corinto, e corta os comboios de trigo. Enquanto o exército de Antônio passa fome e adoece nos acampamentos pantanosos de Áccio, Otaviano desembarca no Épiro sem resistência.","sentido":"Agripa vence a guerra antes da batalha, estrangulando o abastecimento do inimigo.","hoje":"Methoni tem uma enorme fortaleza veneziana sobre o promontório, construída sobre o porto antigo.","ref":"Dião Cássio L 11–14 · Orósio VI 19","certeza":"Local identificado"},{"nome":"Áccio","moderno":"Golfo de Ambrácia, perto de Preveza, Grécia","lat":38.95,"lon":20.73,"ano":-31,"tempo":"31 a.C.","texto":"Em 2 de setembro de 31 a.C., Antônio, cercado e com metade dos remadores mortos de doenças, tenta romper o bloqueio. Queima os navios que não consegue tripular e sai com cerca de 230 galeras, muitas grandes, com torres, e com o tesouro a bordo, o que indica que já pensa em fuga. Cleópatra fica atrás com 60 navios.\n\nAgripa comanda a ala esquerda de Otaviano e estende sua linha para o norte, forçando Antônio a estender a dele e abrir buracos no centro. Ao meio-dia, quando a brisa do noroeste começa, Cleópatra solta as velas e passa pelo centro com seus 60 navios, rumo ao sul. Antônio pula para um navio rápido e a segue, abandonando a frota e o exército. A frota que fica para trás luta até o fim da tarde e é incendiada. O exército de terra, sem comandante, se rende uma semana depois.","sentido":"A batalha que decide quem governará o mundo romano: um Estado, um senhor.","hoje":"Na colina onde acampou, Otaviano ergueu um monumento com os esporões dos navios capturados e fundou Nicópolis, a cidade da vitória. As ruínas ficam perto de Preveza; o museu de Nicópolis mostra os encaixes dos esporões.","ref":"Dião Cássio L 31–35 · Plutarco, Antônio 64–68 · Veleio Patérculo II 84–85","certeza":"Local identificado","batalha":{"tipo":"Vitória naval decisiva","vencedor":"Otaviano (Agripa)","forcas":"c. 400 navios (Agripa) × c. 230 + 60 navios (Antônio e Cleópatra)","baixas":"Antônio: c. 5.000 mortos e a maior parte da frota; exército de terra rendido","diagrama":"accio"}},{"nome":"O Panteão e as obras de Roma","moderno":"Roma, Itália","lat":41.899,"lon":12.477,"ano":-27,"tempo":"27 a.C.","texto":"Agripa se torna edil em 33 a.C., um cargo menor que um ex-cônsul não precisaria ocupar, e o usa para refazer Roma com o próprio dinheiro. Reforma esgotos, navegando pela Cloaca Máxima de barco para inspecioná-la, restaura aquedutos e constrói um novo, o Aqua Julia. Abre centenas de fontes e cisternas e distribui óleo e sal de graça.\n\nNo Campo de Marte, constrói as primeiras termas públicas de Roma, um lago artificial e, em 27 a.C., um templo para todos os deuses: o Panteão. Também organiza um grande levantamento do mundo romano, que resultaria num mapa exposto no Pórtico de Vipsânia. O Panteão atual foi reconstruído por Adriano por volta de 125 d.C., mas mantém na fachada a inscrição original: M·AGRIPPA·L·F·COS·TERTIVM·FECIT, Marco Agripa, filho de Lúcio, cônsul pela terceira vez, fez.","sentido":"O general vitorioso vira o construtor de Roma, sem nunca querer o poder para si.","hoje":"O Panteão é o edifício antigo mais bem conservado de Roma, usado como igreja desde 609. A inscrição de Agripa continua no frontão.","ref":"Dião Cássio XLIX 43, LIII 27 · Plínio, História Natural XXXVI 104","certeza":"Edifício preservado"},{"nome":"Fim das Guerras Cantábricas","moderno":"Cantábria, Espanha","lat":43.2,"lon":-4.5,"ano":-19,"tempo":"19 a.C.","texto":"Os cântabros e ásturos, nas montanhas do norte da Hispânia, resistem havia quase dez anos, mesmo depois de Augusto em pessoa ter comandado uma campanha. Prisioneiros vendidos como escravos matam os donos e voltam às montanhas.\n\nAgripa chega em 19 a.C. e encontra os próprios soldados desmoralizados e à beira do motim. Precisa primeiro restaurar a disciplina: rebaixa uma legião inteira, a Augusta, tirando-lhe o título. Depois avança vale por vale, toma os redutos nas alturas e desloca a população para as planícies, onde podia ser controlada. Muitos cântabros se suicidam com veneno de teixo para não se render. A guerra acaba. Agripa recusa o triunfo oferecido pelo Senado e não manda nem relatório oficial, para não ofuscar Augusto.","sentido":"Agripa encerra a conquista da Hispânia, dois séculos depois de Cipião começá-la.","hoje":"Os acampamentos romanos das Guerras Cantábricas, como os de La Poza e Castillejo, são estudados por arqueólogos na Cordilheira Cantábrica.","ref":"Dião Cássio LIV 11 · Floro II 33","certeza":"Local aproximado"},{"nome":"Morte na Campânia","moderno":"Campânia, Itália","lat":40.85,"lon":14.25,"ano":-12,"tempo":"12 a.C.","texto":"Em 21 a.C., Augusto casa Agripa com a filha Júlia, viúva do jovem Marcelo. Agripa recebe poderes quase iguais aos de Augusto: o imperium proconsular e o poder tribunício. Os filhos do casal, Caio e Lúcio, são adotados por Augusto como herdeiros. Agripa governa o Oriente, visita Herodes em Jerusalém e reprime uma revolta no Bósforo.\n\nEm 13 a.C., parte para a Panônia, onde os povos do Danúbio estão inquietos. A simples notícia de sua chegada acalma a região. Na volta, adoece na Campânia e morre em março de 12 a.C., aos 51 anos. Augusto corre até lá, mas chega tarde. Faz o elogio fúnebre pessoalmente e deposita as cinzas no próprio mausoléu. Os netos de Agripa incluem o imperador Calígula, filho de Agripina e Germânico; os bisnetos, Nero.","sentido":"O amigo fiel morre antes de Augusto. O Império perde seu melhor general e sua sucessão mais segura.","hoje":"O lugar exato da morte não é conhecido. O Mausoléu de Augusto, em Roma, onde suas cinzas foram depositadas, foi restaurado e reaberto em 2021.","ref":"Dião Cássio LIV 28–29 · Veleio Patérculo II 96","certeza":"Local aproximado"}],"era":"fim","rivais":["augusto"]},{"id":"augusto","nome":"Augusto","latim":"Imperator Caesar Augustus","cor":"#7b3fa0","vida":"63 a.C.–14 d.C.","papel":"Fundador do Império","fontes":["Augusto, Res Gestae Divi Augusti","Suetônio, Vida do Divino Augusto","Dião Cássio XLV–LVI","Veleio Patérculo II","Tácito, Anais I"],"resumo":"Caio Otávio tinha 18 anos, saúde frágil e nenhuma experiência quando o testamento de César o fez herdeiro e filho adotivo. Com um nome e muito sangue-frio, venceu os assassinos de César, depois Marco Antônio e Cleópatra, e encerrou um século de guerras civis. Não era grande general em campo, mas soube escolher quem fosse. Governou por 41 anos sob a aparência de restaurar a República, levou as fronteiras ao Reno e ao Danúbio, e terminou a vida aconselhando os sucessores a não expandir mais o Império.","paradas":[{"nome":"Brundísio: o herdeiro","moderno":"Brindisi, Itália","lat":40.638,"lon":17.946,"ano":-44,"tempo":"44 a.C.","texto":"Caio Otávio desembarca perto de Brundísio em abril de 44 a.C., vindo de Apolônia. Ali fica sabendo do conteúdo do testamento: César o adotou e o deixou herdeiro de três quartos de sua fortuna. A mãe e o padrasto aconselham que recuse a herança perigosa.\n\nEle aceita e passa a usar o nome Caio Júlio César. Os veteranos de César o recebem com entusiasmo. Em Roma, Marco Antônio, cônsul e homem forte do momento, o trata com desprezo e se recusa a entregar o dinheiro de César. O jovem vende as próprias propriedades para pagar os legados que César deixou ao povo, 300 sestércios por cidadão, e levanta um exército particular entre os veteranos. Cícero, que o vê como um garoto manipulável, diz que é preciso elogiá-lo, honrá-lo e descartá-lo. Será Cícero o descartado.","sentido":"Um rapaz de 18 anos aceita uma herança que todos os adultos à sua volta acham suicida.","hoje":"Em Brindisi, as colunas junto ao porto marcavam o fim da Via Ápia. Uma delas foi levada para Lecce no século XVII.","ref":"Nicolau de Damasco 17–18 · Suetônio, Augusto 8 · Res Gestae 1","certeza":"Local identificado"},{"nome":"Mútina","moderno":"Modena, Itália","lat":44.647,"lon":10.925,"ano":-43,"tempo":"43 a.C.","texto":"Antônio cerca em Mútina Décimo Bruto, um dos assassinos de César, que se recusa a entregar a Gália Cisalpina. O Senado, empurrado por Cícero, declara Antônio inimigo público e manda os dois cônsules, Hírcio e Pansa, junto com Otaviano, então com 19 anos e com poderes de propretor.\n\nEm abril de 43 a.C., em duas batalhas, Fórum dos Gauleses e Mútina, Antônio é derrotado e foge pelos Alpes. Mas os dois cônsules morrem, um em combate e outro dos ferimentos. Corre o boato de que Otaviano os mandou matar. Ele fica com os exércitos dos dois. Quando o Senado tenta deixá-lo de lado e entregar o comando a Décimo Bruto, Otaviano marcha sobre Roma com oito legiões e exige o consulado. Tem 19 anos. Um centurião, diante do Senado, bate na espada e diz: se vocês não o fizerem cônsul, esta o fará.","sentido":"Otaviano ganha sua primeira guerra sem que os dois generais vitoriosos sobrevivam a ela.","hoje":"Modena, a antiga Mutina, conserva poucos restos visíveis da cidade romana; o Museu Lapidário Estense guarda inscrições e sarcófagos.","ref":"Apiano, Guerras Civis III 66–94 · Suetônio, Augusto 10–12","certeza":"Local aproximado","batalha":{"tipo":"Vitória do Senado","vencedor":"Senado e Otaviano","forcas":"c. 40.000 (Senado) × c. 30.000 (Antônio)","baixas":"Ambos os cônsules mortos"}},{"nome":"O Segundo Triunvirato","moderno":"Ilhota no rio Reno (Lavino), perto de Bolonha, Itália","lat":44.49,"lon":11.25,"ano":-43,"tempo":"43 a.C.","texto":"Em vez de lutar de novo, Otaviano, Antônio e Lépido se encontram numa ilhota de um rio perto de Bonônia, em novembro de 43 a.C. Cada um chega com cinco legiões. Revistam-se uns aos outros em busca de armas escondidas e passam dois dias conversando.\n\nDividem o Ocidente entre si e criam, por lei, um triunvirato com poderes absolutos por cinco anos. Para pagar as tropas e eliminar inimigos, retomam as proscrições de Sula. Cada um entrega à morte amigos e parentes dos outros. Antônio exige a cabeça de Cícero, que o atacara nas Filípicas. Otaviano, segundo Plutarco, resiste dois dias e depois cede. Cícero é morto em dezembro; sua cabeça e suas mãos são pregadas nos Rostros. Cerca de 300 senadores e 2 mil cavaleiros estão nas listas.","sentido":"A paz entre os herdeiros de César começa com uma lista de mortos.","hoje":"O local exato do encontro é desconhecido; a tradição o situa numa ilha do rio Lavino ou do Reno, o pequeno rio de Bolonha, não o grande Reno germânico.","ref":"Apiano, Guerras Civis IV 2–51 · Plutarco, Cícero 46–49","certeza":"Local aproximado"},{"nome":"Filipos","moderno":"Filipos, Grécia","lat":41.013,"lon":24.287,"ano":-42,"tempo":"42 a.C.","texto":"Bruto e Cássio reuniram no Oriente cerca de 19 legiões e controlam o mar. Antônio e Otaviano atravessam para a Grécia e os encontram perto de Filipos, na Macedônia, onde a Via Egnácia passa entre montanhas e pântanos.\n\nNa primeira batalha, em outubro, Antônio toma o acampamento de Cássio, enquanto Bruto toma o de Otaviano, que estava doente e se escondia num pântano. Cássio, achando que tudo está perdido e sem saber que Bruto venceu do seu lado, manda um liberto matá-lo. Três semanas depois, na segunda batalha, Bruto é forçado a lutar e é derrotado. Ele se mata atirando-se sobre a espada que um amigo segura. Antônio cobre o corpo com seu manto de púrpura. Otaviano manda a cabeça de Bruto para Roma, para ser jogada aos pés da estátua de César, mas o navio afunda numa tempestade.","sentido":"Os assassinos de César morrem por suas próprias mãos, como César morreu pelas deles.","hoje":"O sítio arqueológico de Filipos, Patrimônio Mundial da UNESCO, inclui o teatro, o fórum e basílicas cristãs. O apóstolo Paulo pregou ali cerca de noventa anos depois.","ref":"Plutarco, Bruto 38–53, Antônio 22 · Apiano, Guerras Civis IV 105–131","certeza":"Sítio arqueológico","batalha":{"tipo":"Vitória dos triúnviros","vencedor":"Antônio e Otaviano","forcas":"c. 100.000 (triúnviros) × c. 90.000 (Bruto e Cássio)","baixas":"Bruto e Cássio suicidados; dezenas de milhares de mortos"}},{"nome":"Áccio","moderno":"Golfo de Ambrácia, perto de Preveza, Grécia","lat":38.95,"lon":20.73,"ano":-31,"tempo":"31 a.C.","texto":"Onze anos depois, o mundo romano tem dois senhores: Otaviano no Ocidente e Antônio no Oriente, vivendo em Alexandria com Cleópatra e distribuindo províncias romanas aos filhos dela. Otaviano lê no Senado o testamento de Antônio, arrancado das Vestais, em que ele pede para ser enterrado em Alexandria. Roma declara guerra, não a Antônio, mas a Cleópatra.\n\nOtaviano entrega o comando naval a Agripa e fica no seu navio, observando. Quando Cleópatra rompe o centro e foge, seguida por Antônio, a frota abandonada continua lutando por horas. Otaviano oferece perdão aos que se rendem. À noite, a frota de Antônio está em chamas ou capturada; dias depois, o exército de terra, 19 legiões, se rende sem lutar. Com a vitória, Otaviano funda Nicópolis e dedica a Apolo um monumento com os esporões dos navios inimigos.","sentido":"O fim das guerras civis romanas. Dali em diante, um único homem governará o mundo romano.","hoje":"As ruínas de Nicópolis e o Monumento da Vitória de Otaviano ficam perto de Preveza; o museu local tem fragmentos dos encaixes dos esporões.","ref":"Dião Cássio L 31–35 · Plutarco, Antônio 64–68 · Res Gestae 25","certeza":"Local identificado","batalha":{"tipo":"Vitória naval decisiva","vencedor":"Otaviano","forcas":"c. 400 navios (Otaviano e Agripa) × c. 290 navios (Antônio e Cleópatra)","baixas":"Antônio: maior parte da frota; 19 legiões rendidas","diagrama":"accio"}},{"nome":"Alexandria: o Egito","moderno":"Alexandria, Egito","lat":31.205,"lon":29.885,"ano":-30,"tempo":"30 a.C.","texto":"Otaviano chega ao Egito no verão de 30 a.C. A cavalaria de Antônio passa para o seu lado e a frota se rende sem combate. Antônio, ao ouvir o falso rumor de que Cleópatra morreu, se fere com a espada. É levado ainda vivo ao mausoléu onde ela se trancou, içado por cordas pela janela, e morre em seus braços.\n\nOtaviano quer Cleópatra viva para o triunfo. Ela se mata, segundo a tradição, com a picada de uma áspide escondida num cesto de figos. Otaviano manda matar Cesarião, o filho de César e Cleópatra, porque, como lhe disse o filósofo Ário, não é bom haver muitos Césares. Visita o t
